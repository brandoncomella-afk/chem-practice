<style>
*{box-sizing:border-box}

 --bg:#f6f7f9; --card:#ffffff; --ink:#1c2024; --muted:#6b7280; --line:#e3e6ea;

}
html,body{margin:0;padding:0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}

button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);max-width:100%}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-top:4px}
.stat b{font-size:22px;color:var(--accent)} .stat span{font-size:12.5px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.05em}

.opt.wrong{background:var(--nobg);border-color:var(--no)} .opt.wrong .k{color:var(--no)}
.fb{margin-top:12px;padding:13px 15px;border-radius:9px;font-size:15px;line-height:1.55;border-left:3px solid}

.fb b{display:block;margin-bottom:4px}

.hide{display:none}

<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Signs of a Chemical Reaction", "stem": "A student pours two clear, colorless liquids together and steady bubbles rise from the mixture without any heating. Which sign of a chemical reaction is this?", "options": ["The formation of a gas", "A change in the volume", "A change in the texture", "A change in the shape"], "answer": "A", "answer_text": "The formation of a gas", "exp": "Bubbles rising from a liquid that is not being heated show that a new gas is being produced, and formation of a gas is one of the signs of a chemical reaction. A change in shape or texture describes a physical change only, and a change in volume by itself does not show that new substances formed."}, {"id": 2, "level": "Beginner", "tag": "Signs of a Chemical Reaction", "stem": "Two clear solutions are mixed and a cloudy solid slowly settles to the bottom of the beaker. What is that solid called?", "options": ["A coefficient", "A precipitate", "A solute", "A reactant"], "answer": "B", "answer_text": "A precipitate", "exp": "A solid that forms when two solutions are mixed is called a precipitate, and it is one of the signs of a chemical reaction. A solute dissolves instead of settling out, a reactant is a starting material, and a coefficient is a number written in front of a formula."}, {"id": 3, "level": "Beginner", "tag": "Signs of a Chemical Reaction", "stem": "Which of these observations is NOT a sign that a chemical reaction has taken place?", "options": ["The color changes from blue to green", "A solid is crushed into powder", "A new gas bubbles out of the liquid", "The mixture gives off heat and light"], "answer": "B", "answer_text": "A solid is crushed into powder", "exp": "Crushing a solid changes only its size and shape, so no new substance is made and no chemical reaction has occurred. Releasing a new gas, giving off heat and light, and an unexpected color change are all listed as signs of a chemical reaction."}, {"id": 4, "level": "Beginner", "tag": "Signs of a Chemical Reaction", "stem": "A candle burns steadily, giving off both heat and light. Which sign of a chemical reaction does this show?", "options": ["The absorption of a gas", "A change in mass only", "The release of energy", "A change in state only"], "answer": "C", "answer_text": "The release of energy", "exp": "Burning gives off energy as heat and light, and the release (or absorption) of heat or light is one of the signs of a chemical reaction. Melting wax is only a change of state, and the wax is not simply absorbing a gas or quietly losing mass."}, {"id": 5, "level": "Beginner", "tag": "Signs of a Chemical Reaction", "stem": "Two household liquids are poured into the same container and a sharp new smell appears right away. What is the best conclusion?", "options": ["A new substance formed, because any two liquids react when mixed", "No reaction occurred, because only solids can take part in reactions", "A new substance formed, because a change in odor signals a reaction", "No reaction occurred, because odors are always physical properties"], "answer": "C", "answer_text": "A new substance formed, because a change in odor signals a reaction", "exp": "A brand-new odor means brand-new substances, and a change in odor is one of the listed signs of a chemical reaction. Odors are not always physical properties, liquids do not react every time they are mixed, and liquids can be reactants just as solids can."}, {"id": 6, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "In the equation 2H₂(g) + O₂(g) → 2H₂O(l), which substances are the reactants?", "options": ["H₂ and O₂", "O₂ and H₂O", "H₂O only", "H₂ and H₂O"], "answer": "A", "answer_text": "H₂ and O₂", "exp": "Reactants are written on the left side of the arrow, so hydrogen gas and oxygen gas are the reactants here. Water sits on the right side of the arrow, which makes it the product, so any choice that lists H₂O is naming a product instead."}, {"id": 7, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "In the equation NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq), what does the symbol (aq) tell you about a substance?", "options": ["It is dissolved in water", "It is a gas escaping from the beaker", "It is a dry solid resting on the bottom", "It is a pure liquid with no water"], "answer": "A", "answer_text": "It is dissolved in water", "exp": "The symbol (aq) stands for aqueous, meaning the substance is dissolved in water, while (l) marks a pure liquid, (g) a gas, and (s) a solid. In this equation AgCl(s) is the only solid, so reading (aq) as a dry solid would mix up the two products."}, {"id": 8, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "What does the arrow in a chemical equation mean?", "options": ["Plus, so the substances on each side are added", "Yields, and it separates reactants from products", "Minus, so a substance is taken away from the mix", "Equals, so both sides hold the same substances"], "answer": "B", "answer_text": "Yields, and it separates reactants from products", "exp": "The arrow is read as the word yields, and it separates the starting materials on the left from the substances made on the right. It does not mean the two sides hold the same substances; the same atoms are there, but they have been rearranged into new substances."}, {"id": 9, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "In the equation CaCO₃(s) → CaO(s) + CO₂(g), which substance leaves the reaction as a gas?", "options": ["CaO", "CO₂", "CaCO₃", "O₂"], "answer": "B", "answer_text": "CO₂", "exp": "The state symbol (g) is written after CO₂, so carbon dioxide is the substance that leaves as a gas. Both CaCO₃ and CaO carry the symbol (s) for solid, and O₂ never appears anywhere in this equation."}, {"id": 10, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "In the formula H₂SO₄, what is the small 4 written just after the O called?", "options": ["A coefficient", "A product", "A subscript", "A state symbol"], "answer": "C", "answer_text": "A subscript", "exp": "A small number written after an element's symbol is a subscript, and it tells how many atoms of that element the formula contains, so H₂SO₄ holds 4 oxygen atoms. A coefficient is a full-size number written in front of a formula, and a state symbol such as (aq) goes in parentheses after it."}, {"id": 11, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "Which chemical equation matches the word equation \"magnesium + oxygen yields magnesium oxide\"?", "options": ["2Mg(s) + O₂(g) → 2MgO(s)", "3Mg(s) + N₂(g) → Mg₃N₂(s)", "Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)", "2MgO(s) → 2Mg(s) + O₂(g)"], "answer": "A", "answer_text": "2Mg(s) + O₂(g) → 2MgO(s)", "exp": "The words name magnesium and oxygen as the reactants and magnesium oxide as the product, which is exactly 2Mg(s) + O₂(g) → 2MgO(s). The equation that starts with 2MgO(s) runs the change backwards, and the nitrogen and hydrochloric acid equations use reactants the words never mention."}, {"id": 12, "level": "Beginner", "tag": "Reading a Chemical Equation", "stem": "In the equation Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g), which substance is a product?", "options": ["H₂(g)", "Zn(s)", "HCl(aq)", "Zn(s) and HCl(aq)"], "answer": "A", "answer_text": "H₂(g)", "exp": "Products are written after the arrow, so hydrogen gas is a product of this reaction. Zinc and hydrochloric acid sit to the left of the arrow, which makes them the reactants that get used up."}, {"id": 13, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 3H₂O. How many hydrogen atoms does that term represent?", "options": ["2 hydrogen atoms", "3 hydrogen atoms", "6 hydrogen atoms", "5 hydrogen atoms"], "answer": "C", "answer_text": "6 hydrogen atoms", "exp": "Multiply the coefficient by the subscript: 3 × 2 = 6 hydrogen atoms. Answering 2 uses the subscript alone and ignores the coefficient, and 5 comes from adding 3 + 2 instead of multiplying."}, {"id": 14, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 5Al(OH)₃. How many oxygen atoms does that term represent?", "options": ["5 oxygen atoms", "15 oxygen atoms", "3 oxygen atoms", "45 oxygen atoms"], "answer": "B", "answer_text": "15 oxygen atoms", "exp": "Multiply the coefficient, the subscript outside the parentheses, and the understood 1 on oxygen: 5 × 3 × 1 = 15 oxygen atoms. Answering 3 counts only one formula unit, and 45 multiplies by the 3 a second time, as if oxygen carried its own subscript of 3."}, {"id": 15, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 2Ca₃(PO₄)₂. How many calcium atoms does that term represent?", "options": ["3 calcium atoms", "6 calcium atoms", "12 calcium atoms", "2 calcium atoms"], "answer": "B", "answer_text": "6 calcium atoms", "exp": "Multiply the coefficient by the subscript on calcium: 2 × 3 = 6 calcium atoms. Answering 3 leaves the coefficient out, and 12 comes from also multiplying by the 2 outside the parentheses, which belongs only to P and O."}, {"id": 16, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 2Fe(NO₃)₃. How many oxygen atoms does that term represent?", "options": ["12 oxygen atoms", "9 oxygen atoms", "6 oxygen atoms", "18 oxygen atoms"], "answer": "D", "answer_text": "18 oxygen atoms", "exp": "Multiply the coefficient, the subscript outside the parentheses, and the subscript on oxygen: 2 × 3 × 3 = 18 oxygen atoms. Answering 9 counts only one formula unit, and 6 uses 2 × 3 but forgets one of the two threes."}, {"id": 17, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 3Mg(NO₃)₂. How many nitrogen atoms does that term represent?", "options": ["2 nitrogen atoms", "6 nitrogen atoms", "3 nitrogen atoms", "18 nitrogen atoms"], "answer": "B", "answer_text": "6 nitrogen atoms", "exp": "Nitrogen carries an understood subscript of 1 inside the parentheses, so multiply 3 × 2 × 1 = 6 nitrogen atoms. Answering 2 counts a single formula unit, and 18 comes from also multiplying by the 3 that belongs to oxygen."}, {"id": 18, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "A balanced equation contains the term 2H₂SO₄. How many atoms of all kinds does that term represent?", "options": ["7 atoms", "14 atoms", "9 atoms", "12 atoms"], "answer": "B", "answer_text": "14 atoms", "exp": "One H₂SO₄ holds 2 + 1 + 4 = 7 atoms, and the coefficient doubles every one of them, so 2 × 7 = 14 atoms. Answering 7 counts only one molecule, and 9 comes from adding the coefficient to the 7 atoms instead of multiplying."}, {"id": 19, "level": "Beginner", "tag": "Counting Atoms with Coefficients", "stem": "In the equation 2KNO₃(s) → 2KNO₂(s) + O₂(g), how many oxygen atoms are on the product side?", "options": ["6 oxygen atoms", "5 oxygen atoms", "4 oxygen atoms", "2 oxygen atoms"], "answer": "A", "answer_text": "6 oxygen atoms", "exp": "The products are 2KNO₂ and O₂, so 2 × 2 = 4 oxygen atoms in the potassium nitrite plus the 2 in O₂ gives 6 oxygen atoms. Answering 4 leaves out the oxygen gas, and 2 counts only the O₂ molecule."}, {"id": 20, "level": "Beginner", "tag": "Law of Conservation of Mass", "stem": "The law of conservation of mass says that atoms are only rearranged in a chemical reaction. What does that mean about the mass of the reactants and the mass of the products?", "options": ["The reactants always weigh more", "The products always weigh more", "The two masses are equal", "The two masses are unrelated"], "answer": "C", "answer_text": "The two masses are equal", "exp": "Because no atoms are created and none are destroyed, the total mass of the reactants must equal the total mass of the products. Saying that one side always weighs more would require atoms to appear from nowhere or vanish during the reaction."}, {"id": 21, "level": "Beginner", "tag": "Law of Conservation of Mass", "stem": "In a sealed flask, 4.0 g of hydrogen reacts completely with 32.0 g of oxygen and water is the only product. What mass of water forms?", "options": ["36.0 g", "8.0 g", "32.0 g", "28.0 g"], "answer": "A", "answer_text": "36.0 g", "exp": "All of the mass of the reactants ends up in the product, so 4.0 g + 32.0 g = 36.0 g of water. The value 28.0 g comes from subtracting the masses instead of adding them, and 32.0 g ignores the hydrogen completely."}, {"id": 22, "level": "Beginner", "tag": "Law of Conservation of Mass", "stem": "A student burns a magnesium strip in an open dish and the white powder left behind has more mass than the strip did. Which statement explains this correctly?", "options": ["Mass was created as the metal gave off bright light", "The balance always reads high after something burns", "Heat from the flame added extra mass to the powder", "Oxygen from the air combined with the magnesium"], "answer": "D", "answer_text": "Oxygen from the air combined with the magnesium", "exp": "The powder contains the magnesium plus the oxygen it took from the air, so the mass gained equals the mass of oxygen that reacted and no mass was created. Heat and light are energy, not matter, so a flame cannot add mass to the product."}, {"id": 23, "level": "Beginner", "tag": "Law of Conservation of Mass", "stem": "A reaction in an open beaker gives off a gas, and the beaker and its contents lose mass. Does this break the law of conservation of mass?", "options": ["Yes, because mass is lost whenever a gas forms", "No, because gases have no mass of their own", "No, the escaping gas carries away that mass", "Yes, because the atoms in the gas were destroyed"], "answer": "C", "answer_text": "No, the escaping gas carries away that mass", "exp": "The gas that bubbles out still has mass, and in a sealed container the total mass would not change at all, so the law still holds. The atoms in the gas were not destroyed, and gases do have mass just as solids and liquids do."}, {"id": 24, "level": "Beginner", "tag": "Balancing Equations", "stem": "Which of these chemical equations is balanced?", "options": ["CH₄(g) + O₂(g) → CO₂(g) + H₂O(g)", "H₂(g) + O₂(g) → H₂O(l)", "Mg(s) + O₂(g) → MgO(s)", "2Na(s) + Cl₂(g) → 2NaCl(s)"], "answer": "D", "answer_text": "2Na(s) + Cl₂(g) → 2NaCl(s)", "exp": "Counting atoms in 2Na(s) + Cl₂(g) → 2NaCl(s) gives 2 sodium and 2 chlorine atoms on each side, so it is balanced. The hydrogen and magnesium equations each leave one oxygen atom unaccounted for on the product side, and the methane equation shows 4 hydrogen atoms on the left but only 2 on the right."}, {"id": 25, "level": "Beginner", "tag": "Balancing Equations", "stem": "Which of these chemical equations is NOT balanced?", "options": ["2H₂(g) + O₂(g) → 2H₂O(l)", "2KClO₃(s) → 2KCl(s) + O₂(g)", "Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g)", "2KNO₃(s) → 2KNO₂(s) + O₂(g)"], "answer": "B", "answer_text": "2KClO₃(s) → 2KCl(s) + O₂(g)", "exp": "The potassium chlorate equation shows 6 oxygen atoms on the left but only 2 on the right, so it is not balanced and needs 3O₂ as the product. Each of the other three equations has the same number of every kind of atom on both sides, including 6 oxygen atoms on each side of the potassium nitrate equation."}, {"id": 26, "level": "Beginner", "tag": "Balancing Equations", "stem": "What coefficient belongs in the blank to balance N₂(g) + 3H₂(g) → ___NH₃(g)?", "options": ["4", "2", "3", "6"], "answer": "B", "answer_text": "2", "exp": "The left side supplies 2 nitrogen atoms and 6 hydrogen atoms, and 2NH₃ uses up exactly 2 nitrogen and 6 hydrogen atoms. Choosing 3 would call for 3 nitrogen and 9 hydrogen atoms, and 6 would demand six times the nitrogen the reactants provide."}, {"id": 27, "level": "Beginner", "tag": "Balancing Equations", "stem": "What coefficient belongs in the blank to balance ___Al(s) + 3Cl₂(g) → 2AlCl₃(s)?", "options": ["6", "2", "4", "3"], "answer": "B", "answer_text": "2", "exp": "The product side holds 2 aluminum atoms and 6 chlorine atoms, so the left side needs 2Al, since 3Cl₂ already supplies those 6 chlorine atoms. Choosing 3 or 4 would put extra aluminum atoms on the left with no chlorine left for them to bond with."}, {"id": 28, "level": "Beginner", "tag": "Balancing Equations", "stem": "Which set of coefficients, read from left to right, balances ___Fe(s) + ___O₂(g) → ___Fe₂O₃(s)?", "options": ["4, 2, 3", "3, 2, 4", "2, 3, 4", "4, 3, 2"], "answer": "D", "answer_text": "4, 3, 2", "exp": "Using 4, 3, 2 gives 4 iron atoms and 6 oxygen atoms on each side, which is balanced. The set 2, 3, 4 puts 8 iron atoms on the right against only 2 on the left, and 4, 2, 3 leaves 4 oxygen atoms on the left facing 9 on the right."}, {"id": 29, "level": "Beginner", "tag": "Balancing Equations", "stem": "What coefficient belongs in the blank to balance CH₄(g) + ___O₂(g) → CO₂(g) + 2H₂O(g)?", "options": ["5", "4", "3", "2"], "answer": "D", "answer_text": "2", "exp": "The product side holds 2 oxygen atoms in CO₂ plus 2 more in 2H₂O, for 4 in all, and 2O₂ supplies exactly 4 oxygen atoms. Choosing 3 would put 6 oxygen atoms on the left, and 4 would put 8, far more than the products can hold."}, {"id": 30, "level": "Beginner", "tag": "Balancing Equations", "stem": "When you balance a chemical equation, which numbers are you allowed to change?", "options": ["Only the subscripts inside of the formulas", "Neither one, because a formula is set for good", "Only the coefficients in front of formulas", "Both the coefficients and also the subscripts"], "answer": "C", "answer_text": "Only the coefficients in front of formulas", "exp": "Coefficients tell how many of each molecule you have, so changing them changes the amounts without changing what the substances are. Changing a subscript would create a different compound, for example turning H₂O into H₂O₂, so subscripts must stay exactly as written."}, {"id": 31, "level": "Beginner", "tag": "Balancing Equations", "stem": "A student writes the reaction of zinc with hydrochloric acid as 2Zn(s) + 4HCl(aq) → 2ZnCl₂(aq) + 2H₂(g). What still needs to be fixed?", "options": ["Every coefficient should be divided by 2", "A subscript should change so chlorine matches", "Coefficients should be added until they are even", "Nothing at all, since every atom already matches"], "answer": "A", "answer_text": "Every coefficient should be divided by 2", "exp": "Every atom does balance, but all four coefficients share a factor of 2, so the equation must be reduced to Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g), which is lowest whole-number terms. Changing a subscript is never allowed when balancing, and no coefficients need to be added because the atom counts already match."}, {"id": 32, "level": "Beginner", "tag": "Balancing Equations", "stem": "Which atom counts show that 2H₂(g) + O₂(g) → 2H₂O(l) is balanced?", "options": ["4 hydrogen atoms and 4 oxygen atoms per side", "2 hydrogen atoms and 2 oxygen atoms per side", "2 hydrogen atoms and 1 oxygen atom on each side", "4 hydrogen atoms and 2 oxygen atoms per side"], "answer": "D", "answer_text": "4 hydrogen atoms and 2 oxygen atoms per side", "exp": "On the left, 2H₂ gives 4 hydrogen atoms and O₂ gives 2 oxygen atoms; on the right, 2H₂O also holds 4 hydrogen and 2 oxygen atoms. A count of 2 hydrogen atoms ignores the coefficient in front of H₂, and 4 oxygen atoms would need twice the oxygen this equation shows."}, {"id": 33, "level": "Beginner", "tag": "Synthesis Reactions", "stem": "Which general pattern describes a synthesis reaction?", "options": ["AB + CD → AD + CB", "AB → A + B", "A + BC → AC + B", "A + B → AB"], "answer": "D", "answer_text": "A + B → AB", "exp": "In a synthesis reaction two or more simple substances combine to make one more complex substance, which is the pattern A + B → AB. The pattern AB → A + B is decomposition, while A + BC → AC + B and AB + CD → AD + CB describe single replacement and double replacement."}, {"id": 34, "level": "Beginner", "tag": "Synthesis Reactions", "stem": "Which equation shows a synthesis reaction?", "options": ["2H₂O(l) → 2H₂(g) + O₂(g)", "2Ca(s) + O₂(g) → 2CaO(s)", "Zn(s) + 2HCl(aq) → ZnCl₂(aq) + H₂(g)", "AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)"], "answer": "B", "answer_text": "2Ca(s) + O₂(g) → 2CaO(s)", "exp": "Two reactants, calcium and oxygen, combine into the single product calcium oxide, which is what synthesis means. The water equation starts with one substance and makes two, so it is a decomposition, and the zinc equation has an element replacing an ion in a single replacement, and the silver nitrate equation has two compounds trading partners in a double replacement."}, {"id": 35, "level": "Beginner", "tag": "Synthesis Reactions", "stem": "Which balanced equation shows nitrogen and hydrogen combining to make ammonia?", "options": ["N₂(g) + O₂(g) → 2NO(g)", "2NH₃(g) → N₂(g) + 3H₂(g)", "N₂(g) + 2O₂(g) → 2NO₂(g)", "N₂(g) + 3H₂(g) → 2NH₃(g)"], "answer": "D", "answer_text": "N₂(g) + 3H₂(g) → 2NH₃(g)", "exp": "Nitrogen and hydrogen are the reactants and ammonia is the only product, and this equation balances with 2 nitrogen and 6 hydrogen atoms on each side. The equation beginning with 2NH₃ shows ammonia breaking apart instead, and the two oxygen equations build nitrogen oxides rather than ammonia."}, {"id": 36, "level": "Beginner", "tag": "Synthesis Reactions", "stem": "Which statement best describes what happens in a synthesis reaction?", "options": ["Two compounds exchange their positive ion partners", "One substance breaks apart into simpler products", "Two or more substances combine into one product", "An element trades places with an ion in a compound"], "answer": "C", "answer_text": "Two or more substances combine into one product", "exp": "Synthesis puts substances together, so two or more reactants end up as a single, more complex product. Breaking one substance into simpler pieces is decomposition, and the two descriptions about trading places belong to single replacement and double replacement."}, {"id": 37, "level": "Beginner", "tag": "Decomposition Reactions", "stem": "Which equation shows a decomposition reaction?", "options": ["BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq)", "2Mg(s) + O₂(g) → 2MgO(s)", "Cu(s) + 2AgNO₃(aq) → 2Ag(s) + Cu(NO₃)₂(aq)", "2H₂O₂(aq) → 2H₂O(l) + O₂(g)"], "answer": "D", "answer_text": "2H₂O₂(aq) → 2H₂O(l) + O₂(g)", "exp": "One reactant, hydrogen peroxide, breaks apart into two simpler products, water and oxygen gas, which is the pattern of decomposition. The magnesium equation combines two reactants into one product, and the copper equation is an element replacing an ion and the barium equation is two compounds trading partners."}, {"id": 38, "level": "Beginner", "tag": "Decomposition Reactions", "stem": "Which balanced equation shows aluminum nitride, AlN, breaking down into its elements?", "options": ["2AlN(s) → 2Al(s) + N₂(g)", "2AlCl₃(s) → 2Al(s) + 3Cl₂(g)", "2Al(s) + N₂(g) → 2AlN(s)", "2NH₃(g) → N₂(g) + 3H₂(g)"], "answer": "A", "answer_text": "2AlN(s) → 2Al(s) + N₂(g)", "exp": "Aluminum nitride splits into aluminum metal and nitrogen gas, and the equation balances with 2 aluminum and 2 nitrogen atoms on each side. The equation that ends with 2AlN(s) runs the change backwards as a synthesis, and the other two break down aluminum chloride and ammonia instead."}, {"id": 39, "level": "Beginner", "tag": "Decomposition Reactions", "stem": "A decomposition reaction begins with how many reactants?", "options": ["Two elements", "One element", "Two compounds", "One compound"], "answer": "D", "answer_text": "One compound", "exp": "Decomposition always starts with a single compound that breaks apart into two or more simpler substances. Starting with two reactants, whether they are elements or compounds, describes synthesis or one of the replacement reactions instead."}, {"id": 40, "level": "Beginner", "tag": "Decomposition Reactions", "stem": "Heating calcium carbonate drives off a gas and leaves a different solid behind. Which balanced equation shows this decomposition?", "options": ["CaO(s) + CO₂(g) → CaCO₃(s)", "2CaCO₃(s) → 2Ca(s) + 2C(s) + 3O₂(g)", "CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g)", "CaCO₃(s) → CaO(s) + CO₂(g)"], "answer": "D", "answer_text": "CaCO₃(s) → CaO(s) + CO₂(g)", "exp": "Calcium carbonate breaks into calcium oxide, the solid left in the container, and carbon dioxide, the gas that escapes. The equation ending with CaCO₃(s) runs the change backwards as a synthesis, the version making 2Ca(s), 2C(s), and 3O₂(g) would tear the compound all the way down to its elements, and the last equation is a reaction with an acid rather than simple heating."}, {"id": 41, "level": "Beginner", "tag": "Single Replacement and the Activity Series", "stem": "Which equation shows a single replacement reaction?", "options": ["2H₂O₂(aq) → 2H₂O(l) + O₂(g)", "2Na(s) + Cl₂(g) → 2NaCl(s)", "Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)", "Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)"], "answer": "D", "answer_text": "Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)", "exp": "One element, zinc, takes the place of another element, copper, in its compound, which is the pattern A + BC → AC + B. Sodium with chlorine is a synthesis, hydrogen peroxide breaking apart is a decomposition, and lead (II) nitrate with potassium iodide simply trades partners."}, {"id": 42, "level": "Beginner", "tag": "Single Replacement and the Activity Series", "stem": "Use this activity series, most reactive first: Mg > Al > Zn > Fe > Cu > Ag. What happens when a clean copper wire is placed in zinc sulfate solution, ZnSO₄(aq)?", "options": ["No reaction, because copper and zinc are equally reactive", "A reaction, because any metal can replace any metal ion", "No reaction, because copper is less reactive than zinc", "A reaction, because copper is more reactive than zinc"], "answer": "C", "answer_text": "No reaction, because copper is less reactive than zinc", "exp": "A metal replaces only a metal ion that sits below it on the activity series, and copper sits below zinc, so nothing happens. The printed series also shows that the two metals are not equally reactive. Switching them, so that zinc goes into copper (II) sulfate, would give a reaction that coats the zinc with copper metal."}, {"id": 43, "level": "Beginner", "tag": "Single Replacement and the Activity Series", "stem": "Use this activity series, most reactive first: Mg > Al > Zn > Fe > Cu > Ag. Which balanced equation shows copper replacing silver in silver nitrate solution?", "options": ["Cu(s) + 2AgNO₃(aq) → 2Ag(s) + Cu(NO₃)₂(aq)", "Cu(s) + Zn(NO₃)₂(aq) → Zn(s) + Cu(NO₃)₂(aq)", "2Ag(s) + Cu(NO₃)₂(aq) → Cu(s) + 2AgNO₃(aq)", "Al(s) + 3AgNO₃(aq) → 3Ag(s) + Al(NO₃)₃(aq)"], "answer": "A", "answer_text": "Cu(s) + 2AgNO₃(aq) → 2Ag(s) + Cu(NO₃)₂(aq)", "exp": "Copper sits above silver, so copper replaces the silver ions, and two AgNO₃ units are needed to supply the two nitrates that copper (II) takes. The reversed equation would require silver to outrank copper, the aluminum equation replaces silver with the wrong metal, and copper cannot replace zinc because zinc is the more reactive of the two."}, {"id": 44, "level": "Beginner", "tag": "Double Replacement and Solubility", "stem": "Which equation shows a double replacement reaction?", "options": ["NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq)", "Cu(s) + 2AgNO₃(aq) → 2Ag(s) + Cu(NO₃)₂(aq)", "2H₂O₂(aq) → 2H₂O(l) + O₂(g)", "3Mg(s) + N₂(g) → Mg₃N₂(s)"], "answer": "A", "answer_text": "NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq)", "exp": "The two compounds swap partners, so silver joins chloride and sodium joins nitrate, which is the pattern AB + CD → AD + CB. The copper equation has an element replacing an ion, making it a single replacement, while the other two are a decomposition and a synthesis."}, {"id": 45, "level": "Beginner", "tag": "Double Replacement and Solubility", "stem": "Solubility rules: all nitrates and all sodium compounds are soluble, but silver chloride is insoluble. In NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq), which product is the precipitate?", "options": ["NaNO₃, because all sodium compounds are insoluble", "AgCl, because silver chloride does not dissolve", "AgNO₃, because it is the silver compound in the list", "NaCl, because it is the solid that starts the reaction"], "answer": "B", "answer_text": "AgCl, because silver chloride does not dissolve", "exp": "The rules and the state symbol (s) agree: silver chloride does not dissolve, so it is the solid that drops out of solution. Sodium nitrate stays dissolved because sodium compounds and nitrates are both soluble, and NaCl and AgNO₃ are reactants rather than products."}, {"id": 46, "level": "Beginner", "tag": "Double Replacement and Solubility", "stem": "Solubility rules: all Group 1, ammonium, and nitrate compounds are soluble, but most carbonates are insoluble. Which pair of solutions forms a precipitate when mixed?", "options": ["Ammonium nitrate and potassium sulfate", "Potassium nitrate and sodium chloride", "Iron (II) sulfate and sodium carbonate", "Sodium sulfate and potassium chloride"], "answer": "C", "answer_text": "Iron (II) sulfate and sodium carbonate", "exp": "Trading partners here gives iron (II) carbonate, and carbonates other than the Group 1 and ammonium ones are insoluble, so a solid drops out. Every product from the other pairs is a Group 1, ammonium, or nitrate compound, and all of those stay dissolved, so no precipitate can form."}, {"id": 47, "level": "Beginner", "tag": "Combustion Reactions", "stem": "When a hydrocarbon fuel burns completely in oxygen, which two products always form?", "options": ["Hydrogen gas and oxygen gas", "Carbon dioxide and hydrogen", "Carbon dioxide and water", "Carbon monoxide and soot"], "answer": "C", "answer_text": "Carbon dioxide and water", "exp": "Complete combustion sends every carbon atom into carbon dioxide and every hydrogen atom into water, along with a release of energy. Carbon monoxide and soot show up only when there is too little oxygen for complete burning, and hydrogen gas is a fuel rather than a product."}, {"id": 48, "level": "Beginner", "tag": "Combustion Reactions", "stem": "Which balanced equation shows the complete combustion of methane, CH₄?", "options": ["CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g)", "2CO(g) + O₂(g) → 2CO₂(g)", "2H₂(g) + O₂(g) → 2H₂O(l)", "C₃H₈(g) + 5O₂(g) → 3CO₂(g) + 4H₂O(g)"], "answer": "A", "answer_text": "CH₄(g) + 2O₂(g) → CO₂(g) + 2H₂O(g)", "exp": "Methane burns in oxygen to give carbon dioxide and water, and the equation balances with 1 carbon, 4 hydrogen, and 4 oxygen atoms on each side. The propane equation burns a different fuel, while burning hydrogen makes only water and burning carbon monoxide makes only carbon dioxide."}, {"id": 49, "level": "Beginner", "tag": "Identifying Reaction Types", "stem": "What type of reaction is BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2NaCl(aq)?", "options": ["Single replacement", "Double replacement", "Synthesis", "Decomposition"], "answer": "B", "answer_text": "Double replacement", "exp": "The barium and sodium compounds trade partners, giving a solid and a dissolved salt, which is the pattern AB + CD → AD + CB. Nothing breaks down into simpler substances and no lone element swaps in, so it is neither a decomposition nor a single replacement."}, {"id": 50, "level": "Beginner", "tag": "Identifying Reaction Types", "stem": "What type of reaction is 2C₇H₁₄(l) + 21O₂(g) → 14CO₂(g) + 14H₂O(g)?", "options": ["Combustion", "Double replacement", "Synthesis", "Decomposition"], "answer": "A", "answer_text": "Combustion", "exp": "A hydrocarbon reacting with oxygen to give only carbon dioxide and water is a combustion reaction, and the counts check out at 14 carbon, 28 hydrogen, and 42 oxygen atoms per side. Two reactants forming two products rules out synthesis, which makes a single product, and decomposition, which starts from a single substance."}, {"id": 51, "level": "Intermediate", "tag": "Signs of a Chemical Reaction", "stem": "A student heats a sealed sample and records four observations. Which observation is the best evidence that a chemical reaction happened rather than a physical change?", "options": ["Steam rises from the sample and condenses back into liquid water on the lid", "The solid sample cracks into smaller pieces as it is stirred with a rod", "A gas with a sharp new odor bubbles out and does not come back on cooling", "The solid dissolves completely and can be recovered by evaporating the water"], "answer": "C", "answer_text": "A gas with a sharp new odor bubbles out and does not come back on cooling", "exp": "A chemical reaction makes new substances, so producing a gas with a new odor that will not reverse on cooling is the strongest evidence. Steam condensing back to liquid water is a change of state, cracking into smaller pieces changes only size, and a solid that can be recovered by evaporating the water was only dissolved, so none of those three make a new substance."}, {"id": 52, "level": "Intermediate", "tag": "Signs of a Chemical Reaction", "stem": "Bubbling is often listed as a sign of a chemical reaction, but it is not always one. In which case are the bubbles NOT evidence of a chemical reaction?", "options": ["A tablet dropped into water fizzes steadily until the tablet disappears", "Two clear solutions are poured together and release bubbles of a new gas", "A strip of magnesium is dropped into acid and releases bubbles that pop", "Water in a beaker reaches its boiling point and releases bubbles of steam"], "answer": "D", "answer_text": "Water in a beaker reaches its boiling point and releases bubbles of steam", "exp": "Boiling water gives off bubbles of steam, but steam is still water, so no new substance forms and the change is physical. The magnesium in acid, the two solutions poured together, and the fizzing tablet all release a gas that was not present before, which is a true sign of a chemical reaction."}, {"id": 53, "level": "Intermediate", "tag": "Reading a Chemical Equation", "stem": "Which statement correctly describes the equation 2NaHCO₃(s) → Na₂CO₃(s) + H₂O(g) + CO₂(g)?", "options": ["Two solid reactants combine to form one solid product and two gaseous products", "One solid reactant breaks down into three solid products of equal amounts", "One solid reactant breaks down into one solid product and two gaseous products", "Two gaseous reactants combine to form one solid product and one liquid product"], "answer": "C", "answer_text": "One solid reactant breaks down into one solid product and two gaseous products", "exp": "Everything before the arrow is the reactant, and only NaHCO₃(s) appears there, so there is one solid reactant; after the arrow are Na₂CO₃(s), H₂O(g), and CO₂(g), which is one solid and two gases. Reading the 2 in 2NaHCO₃ as two different reactants is the common slip, and calling all three products solids or the reactants gases ignores the (g) and (s) labels that are printed in the equation."}, {"id": 54, "level": "Intermediate", "tag": "Reading a Chemical Equation", "stem": "In the equation 2C₄H₁₀(g) + 13O₂(g) → 8CO₂(g) + 10H₂O(g), what does the 13 written in front of O₂ tell you?", "options": ["Thirteen atoms of oxygen in total are used up during the reaction", "Thirteen molecules, or 13 moles, of oxygen gas are used in the reaction", "Each molecule of oxygen gas in this reaction contains thirteen atoms", "The subscript on oxygen must be multiplied by thirteen when counting"], "answer": "B", "answer_text": "Thirteen molecules, or 13 moles, of oxygen gas are used in the reaction", "exp": "A coefficient counts whole units of the substance that follows it, so 13O₂ means 13 molecules (or 13 moles) of O₂. Each O₂ molecule still holds only 2 atoms, which makes 13 × 2 = 26 oxygen atoms rather than 13 atoms, and a coefficient multiplies the entire formula instead of being folded into the subscript."}, {"id": 55, "level": "Intermediate", "tag": "Reading a Chemical Equation", "stem": "Use the equation 2Fe(NO₃)₃(aq) + 3Mn(s) → 2Fe(s) + 3Mn(NO₃)₂(aq). How many moles of manganese must react in order to produce 2 moles of iron?", "options": ["1 mole of manganese", "3 moles of manganese", "2 moles of manganese", "6 moles of manganese"], "answer": "B", "answer_text": "3 moles of manganese", "exp": "Coefficients are read as mole amounts, and the equation pairs 3Mn with 2Fe, so 3 moles of manganese produce 2 moles of iron. Answering 2 moles copies the coefficient on iron instead of reading the one on manganese, 6 moles multiplies the two coefficients together, and 1 mole assumes an unwritten coefficient that the equation does not have."}, {"id": 56, "level": "Intermediate", "tag": "Reading a Chemical Equation", "stem": "Which sentence reads the equation CuSO₄(aq) + Na₂CO₃(aq) → Na₂SO₄(aq) + CuCO₃(s) correctly?", "options": ["Solid copper (II) sulfate plus liquid sodium carbonate yields aqueous sodium sulfate plus solid copper (II) carbonate", "Aqueous sodium sulfate plus solid copper (II) carbonate yields aqueous copper (II) sulfate plus aqueous sodium carbonate", "Aqueous copper (II) sulfate plus aqueous sodium carbonate yields aqueous sodium sulfate plus solid copper (II) carbonate", "Aqueous copper (II) sulfate plus aqueous sodium carbonate yields solid sodium sulfate plus aqueous copper (II) carbonate"], "answer": "C", "answer_text": "Aqueous copper (II) sulfate plus aqueous sodium carbonate yields aqueous sodium sulfate plus solid copper (II) carbonate", "exp": "The reactants are both labeled (aq), and of the two products only CuCO₃ carries (s), so the solid that settles out is copper (II) carbonate. Assigning the (s) to sodium sulfate swaps the two labels, calling the reactants solid and liquid ignores the (aq) printed on both, and starting the sentence with sodium sulfate reads the equation backwards through the arrow."}, {"id": 57, "level": "Intermediate", "tag": "Counting Atoms with Coefficients", "stem": "A worksheet lists 5Al(OH)₃. How many hydrogen atoms are represented?", "options": ["8 hydrogen atoms", "3 hydrogen atoms", "5 hydrogen atoms", "15 hydrogen atoms"], "answer": "D", "answer_text": "15 hydrogen atoms", "exp": "The subscript 3 outside the parenthesis applies to the whole OH group, giving 3 H in one formula unit, and the coefficient 5 multiplies that: 5 × 3 = 15 hydrogen atoms. Answering 3 counts one formula unit and forgets the coefficient, 5 counts only the coefficient, and 8 adds 5 + 3 instead of multiplying."}, {"id": 58, "level": "Intermediate", "tag": "Counting Atoms with Coefficients", "stem": "A worksheet lists 2Ca₃(PO₄)₂. How many oxygen atoms are represented?", "options": ["8 oxygen atoms", "12 oxygen atoms", "4 oxygen atoms", "16 oxygen atoms"], "answer": "D", "answer_text": "16 oxygen atoms", "exp": "Inside one formula unit the 4 on oxygen is multiplied by the 2 outside the parenthesis to give 8 O, and then the coefficient 2 doubles it: 2 × 4 × 2 = 16 oxygen atoms. Answering 8 stops before the coefficient, 4 uses only the subscript inside the parenthesis, and 12 comes from multiplying the 4 on oxygen by the 3 on calcium, using a subscript that belongs to a different element."}, {"id": 59, "level": "Intermediate", "tag": "Counting Atoms with Coefficients", "stem": "How many atoms of all kinds are represented by 3Mg(NO₃)₂?", "options": ["9 atoms", "27 atoms", "21 atoms", "12 atoms"], "answer": "B", "answer_text": "27 atoms", "exp": "One formula unit holds 1 Mg, 2 N, and 2 × 3 = 6 O, which is 9 atoms, and the coefficient 3 triples every one of them: 3 Mg + 6 N + 18 O = 27 atoms. Answering 9 counts a single formula unit and drops the coefficient, 21 applies the coefficient 3 to the oxygen only and leaves the magnesium and nitrogen at one formula unit, and 12 comes from adding 9 + 3 instead of multiplying."}, {"id": 60, "level": "Intermediate", "tag": "Counting Atoms with Coefficients", "stem": "In the equation 4Fe(s) + 3O₂(g) → 2Fe₂O₃(s), how many oxygen atoms are on the reactant side?", "options": ["12 oxygen atoms", "2 oxygen atoms", "6 oxygen atoms", "3 oxygen atoms"], "answer": "C", "answer_text": "6 oxygen atoms", "exp": "The only oxygen on the left is in 3O₂, and each O₂ contains 2 atoms, so 3 × 2 = 6 oxygen atoms, which matches the 2 × 3 = 6 on the product side. Answering 3 uses the coefficient alone, 2 uses the subscript alone, and 12 counts both sides of the equation together instead of the reactant side only."}, {"id": 61, "level": "Intermediate", "tag": "Counting Atoms with Coefficients", "stem": "Which of these terms represents the greatest number of oxygen atoms?", "options": ["3Ca(NO₃)₂", "2Al₂(SO₄)₃", "2Mg₃(PO₄)₂", "4CO₂"], "answer": "B", "answer_text": "2Al₂(SO₄)₃", "exp": "In 2Al₂(SO₄)₃ the 4 on oxygen is multiplied by the 3 outside the parenthesis and then by the coefficient 2: 2 × 3 × 4 = 24 oxygen atoms. That beats 2 × 2 × 4 = 16 in 2Mg₃(PO₄)₂, 3 × 2 × 3 = 18 in 3Ca(NO₃)₂, and 4 × 2 = 8 in 4CO₂, each of which falls short once the coefficient and both subscripts are used."}, {"id": 62, "level": "Intermediate", "tag": "Law of Conservation of Mass", "stem": "In the reaction Ca(s) + 2H₂O(l) → Ca(OH)₂(aq) + H₂(g), 40 grams of calcium react completely with 36 grams of water and 2 grams of hydrogen gas are collected. What mass of calcium hydroxide forms?", "options": ["74 grams", "76 grams", "38 grams", "72 grams"], "answer": "A", "answer_text": "74 grams", "exp": "Mass is conserved, so the reactants total 40 g + 36 g = 76 g and the products must also total 76 g: 76 g − 2 g = 74 g of calcium hydroxide. Answering 76 g forgets to remove the hydrogen gas that left the mixture, 38 g subtracts the hydrogen from the calcium alone, and 72 g subtracts the 2 g twice."}, {"id": 63, "level": "Intermediate", "tag": "Law of Conservation of Mass", "stem": "Inside a sealed container, 8 grams of methane burn with 32 grams of oxygen and produce 22 grams of carbon dioxide plus water. What mass of water is produced?", "options": ["40 grams", "24 grams", "10 grams", "18 grams"], "answer": "D", "answer_text": "18 grams", "exp": "The sealed container lets nothing escape, so 8 g + 32 g = 40 g of reactants must give 40 g of products, and 40 g − 22 g = 18 g of water. Answering 40 g reports the total instead of the missing piece, 10 g subtracts the carbon dioxide from the oxygen only, and 24 g subtracts the methane from the oxygen."}, {"id": 64, "level": "Intermediate", "tag": "Law of Conservation of Mass", "stem": "A student weighs baking soda and vinegar in an open cup, mixes them, and finds that the cup weighs less after the fizzing stops. What is the best explanation?", "options": ["Mass is conserved only when every product of a reaction is a solid", "Some mass was destroyed as the bubbles formed inside the liquid", "The vinegar evaporated completely before it could react with the solid", "Carbon dioxide gas escaped from the open cup and carried mass away"], "answer": "D", "answer_text": "Carbon dioxide gas escaped from the open cup and carried mass away", "exp": "The law of conservation of mass always holds, so the missing mass left the cup as carbon dioxide gas; repeating the mixing in a sealed bag would show no change in mass. Mass is never destroyed in a reaction, conservation is not limited to solid products, and the vinegar could not have evaporated first because the fizzing shows it reacted."}, {"id": 65, "level": "Intermediate", "tag": "Law of Conservation of Mass", "stem": "In the reaction Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s), 6.4 grams of copper react with 34.0 grams of silver nitrate and 21.6 grams of silver are collected. What mass of copper (II) nitrate forms?", "options": ["18.8 grams", "12.4 grams", "27.6 grams", "40.4 grams"], "answer": "A", "answer_text": "18.8 grams", "exp": "The reactants total 6.4 g + 34.0 g = 40.4 g, so the products must total 40.4 g as well: 40.4 g − 21.6 g = 18.8 g of copper (II) nitrate. Answering 40.4 g gives the whole product mass instead of just the nitrate, 12.4 g subtracts the silver from the silver nitrate alone, and 27.6 g subtracts the copper from the silver nitrate."}, {"id": 66, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Which is the correctly balanced equation, in lowest whole-number ratio, for Na₂S + HCl → H₂S + NaCl?", "options": ["Na₂S + 2HCl → H₂S₂ + 2NaCl", "Na₂S + 2HCl → H₂S + 2NaCl", "2Na₂S + 4HCl → 2H₂S + 4NaCl", "Na₂S + HCl → H₂S + NaCl"], "answer": "B", "answer_text": "Na₂S + 2HCl → H₂S + 2NaCl", "exp": "Putting a 2 in front of HCl and NaCl gives Na 2 = 2, S 1 = 1, H 2 = 2, and Cl 2 = 2 on both sides. Leaving the equation as written strands an extra Na on the left and supplies only 1 H where the products need 2, writing H₂S₂ changes a subscript and invents a new substance, and doubling everything to 2, 4, 2, 4 balances but is not the lowest whole-number ratio."}, {"id": 67, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Iron burns in oxygen to form iron (II) oxide. Which is the correctly balanced equation in lowest whole-number ratio?", "options": ["Fe + O₂ → FeO₂", "4Fe + 2O₂ → 4FeO", "2Fe + O₂ → 2FeO", "Fe + O₂ → 2FeO"], "answer": "C", "answer_text": "2Fe + O₂ → 2FeO", "exp": "A 2 in front of Fe and FeO gives Fe 2 = 2 and O 2 = 2, and no coefficient of 1 is ever written in front of the O₂. Writing FeO₂ changes a subscript and turns the product into a different compound, 4Fe + 2O₂ → 4FeO is balanced but every coefficient can be halved, and Fe + O₂ → 2FeO leaves 1 Fe on the left facing 2 Fe on the right."}, {"id": 68, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Which is the correctly balanced equation, in lowest whole-number ratio, for C₆H₆ + O₂ → CO₂ + H₂O?", "options": ["4C₆H₆ + 30O₂ → 24CO₂ + 12H₂O", "2C₆H₆ + 15O₂ → 12CO₂ + 3H₂O", "2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O", "C₆H₆ + 15O₂ → 12CO₂ + 6H₂O"], "answer": "C", "answer_text": "2C₆H₆ + 15O₂ → 12CO₂ + 6H₂O", "exp": "Two C₆H₆ supply 12 C and 12 H, which need 12CO₂ and 6H₂O, and those products hold 24 + 6 = 30 oxygen atoms, matching 15O₂. Starting with a single C₆H₆ leaves 6 C facing 12 C, using 3H₂O leaves only 6 H on the right, and 4C₆H₆ + 30O₂ → 24CO₂ + 12H₂O is simply the correct answer doubled."}, {"id": 69, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Potassium nitrate decomposes on heating to potassium nitrite and oxygen gas. Which is the correctly balanced equation in lowest whole-number ratio?", "options": ["KNO₃ → KNO₂ + O₂", "4KNO₃ → 4KNO₂ + 2O₂", "2KNO₃ → 3KNO₂ + 3O₂", "2KNO₃ → 2KNO₂ + O₂"], "answer": "D", "answer_text": "2KNO₃ → 2KNO₂ + O₂", "exp": "Two KNO₃ give K 2, N 2, and O 6, and the products 2KNO₂ + O₂ give K 2, N 2, and 4 + 2 = 6 O. The version 2KNO₃ → 3KNO₂ + 3O₂ creates potassium and nitrogen out of nothing (2 versus 3 of each), KNO₃ → KNO₂ + O₂ leaves 3 O facing 4 O, and 4KNO₃ → 4KNO₂ + 2O₂ is the correct ratio doubled."}, {"id": 70, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Which is the correctly balanced equation, in lowest whole-number ratio, for Sn + AuCl → SnCl₂ + Au?", "options": ["Sn + 2AuCl → SnCl₂ + 2Au", "Sn + AuCl₂ → SnCl₂ + Au", "2Sn + 4AuCl → 2SnCl₂ + 4Au", "Sn + AuCl → SnCl₂ + Au"], "answer": "A", "answer_text": "Sn + 2AuCl → SnCl₂ + 2Au", "exp": "SnCl₂ needs 2 Cl, and each AuCl supplies only one, so 2AuCl is required and that forces 2Au: Sn 1 = 1, Au 2 = 2, Cl 2 = 2. Leaving AuCl alone strands 1 Cl against 2, rewriting the reactant as AuCl₂ changes a subscript instead of adding a coefficient, and 2Sn + 4AuCl → 2SnCl₂ + 4Au can be divided through by 2."}, {"id": 71, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Which is the correctly balanced equation, in lowest whole-number ratio, for Al + H₂SO₄ → Al₂(SO₄)₃ + H₂?", "options": ["4Al + 6H₂SO₄ → 2Al₂(SO₄)₃ + 6H₂", "Al + H₂SO₄ → Al₂(SO₄)₃ + H₂", "2Al + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂", "2Al + 3H₂SO₄ → Al₂(SO₄)₃ + H₂"], "answer": "C", "answer_text": "2Al + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂", "exp": "Treating SO₄ as one unit, the product needs 3 of them, so 3H₂SO₄ is required, which brings 6 H and forces 3H₂, while Al₂(SO₄)₃ needs 2Al: Al 2 = 2, S 3 = 3, O 12 = 12, H 6 = 6. Ending with a single H₂ leaves 6 H facing 2 H, the version with no coefficients leaves 1 Al facing 2 Al and 1 S facing 3 S, and 4Al + 6H₂SO₄ → 2Al₂(SO₄)₃ + 6H₂ is the answer doubled."}, {"id": 72, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Which is the correctly balanced equation, in lowest whole-number ratio, for Ca(OH)₂ + H₃PO₄ → Ca₃(PO₄)₂ + H₂O?", "options": ["Ca(OH)₂ + 2H₃PO₄ → Ca₃(PO₄)₂ + 6H₂O", "3Ca(OH)₂ + 2H₃PO₄ → Ca₃(PO₄)₂ + 6H₂O", "6Ca(OH)₂ + 4H₃PO₄ → 2Ca₃(PO₄)₂ + 12H₂O", "3Ca(OH)₂ + 2H₃PO₄ → Ca₃(PO₄)₂ + 3H₂O"], "answer": "B", "answer_text": "3Ca(OH)₂ + 2H₃PO₄ → Ca₃(PO₄)₂ + 6H₂O", "exp": "Ca₃(PO₄)₂ needs 3 Ca and 2 PO₄, which sets 3Ca(OH)₂ and 2H₃PO₄, and those reactants carry 6 + 6 = 12 H, so 6H₂O completes it with O 6 + 8 = 14 on each side. Using a single Ca(OH)₂ leaves 1 Ca facing 3 Ca, using 3H₂O leaves 12 H facing 6 H, and the 6, 4, 2, 12 version is the correct set doubled."}, {"id": 73, "level": "Intermediate", "tag": "Balancing Equations", "stem": "The equation ___Al + ___O₂ → 2Al₂O₃ is balanced when the blanks are filled in with the lowest whole numbers. Which pair of coefficients belongs in the blanks?", "options": ["4 and 6", "2 and 1", "2 and 3", "4 and 3"], "answer": "D", "answer_text": "4 and 3", "exp": "The product 2Al₂O₃ contains 4 Al and 6 O, so the left side needs 4Al and, since each O₂ carries 2 atoms, 6 ÷ 2 = 3 molecules of O₂. Using 2 and 3 leaves only 2 Al on the left, 4 and 6 supplies 12 oxygen atoms instead of 6, and 2 and 1 supplies neither enough aluminum nor enough oxygen."}, {"id": 74, "level": "Intermediate", "tag": "Balancing Equations", "stem": "Baking soda breaks down on heating into sodium carbonate, water vapor, and carbon dioxide. Which is the correctly balanced equation in lowest whole-number ratio?", "options": ["2NaHCO₃ → Na₂CO₃ + H₂O + 2CO₂", "2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "4NaHCO₃ → 2Na₂CO₃ + 2H₂O + 2CO₂", "NaHCO₃ → Na₂CO₃ + H₂O + CO₂"], "answer": "B", "answer_text": "2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "exp": "Two NaHCO₃ give Na 2, H 2, C 2, and O 6, and the products give Na 2, H 2, C 1 + 1 = 2, and O 3 + 1 + 2 = 6. Dropping the 2 in front leaves 1 Na facing 2 Na, using 2CO₂ raises the right side to 3 C and 8 O, and 4NaHCO₃ → 2Na₂CO₃ + 2H₂O + 2CO₂ is the correct equation doubled."}, {"id": 75, "level": "Intermediate", "tag": "Synthesis Reactions", "stem": "Magnesium metal burns in nitrogen gas to form magnesium nitride. Magnesium forms Mg²⁺ and nitrogen forms N³⁻. Which balanced equation shows this synthesis?", "options": ["Mg + N₂ → MgN₂", "3Mg + N₂ → Mg₃N₂", "6Mg + 2N₂ → 2Mg₃N₂", "2Mg + 3N₂ → Mg₂N₃"], "answer": "B", "answer_text": "3Mg + N₂ → Mg₃N₂", "exp": "Criss-crossing Mg²⁺ and N³⁻ gives Mg₃N₂, and that product needs 3Mg and one N₂ on the left, so Mg 3 = 3 and N 2 = 2. MgN₂ ignores the charges entirely, Mg₂N₃ reverses the criss-cross and also leaves 6 N on the left facing 3 N, and 6Mg + 2N₂ → 2Mg₃N₂ is the correct equation doubled."}, {"id": 76, "level": "Intermediate", "tag": "Synthesis Reactions", "stem": "Aluminum combines directly with nitrogen gas to form aluminum nitride. Aluminum forms Al³⁺ and nitrogen forms N³⁻. Which balanced equation shows this synthesis?", "options": ["4Al + 2N₂ → 4AlN", "3Al + N₂ → Al₃N₂", "2Al + N₂ → 2AlN", "Al + N₂ → AlN"], "answer": "C", "answer_text": "2Al + N₂ → 2AlN", "exp": "Because +3 and −3 cancel one for one, aluminum nitride is AlN, and balancing the diatomic N₂ requires 2Al and 2AlN, giving Al 2 = 2 and N 2 = 2. The formula Al₃N₂ would require aluminum to be +2 and nitrogen −3, Al + N₂ → AlN leaves 2 N on the left facing 1 N, and 4Al + 2N₂ → 4AlN is the correct answer doubled."}, {"id": 77, "level": "Intermediate", "tag": "Synthesis Reactions", "stem": "Quicklime, CaO, is added to water and the only product is calcium hydroxide. Which equation shows this synthesis correctly?", "options": ["2CaO(s) + 2H₂O(ℓ) → 2Ca(OH)₂(s)", "CaO(s) + H₂O(ℓ) → Ca(OH)₂(s)", "CaO(s) + 2H₂O(ℓ) → Ca(OH)₂(s) + H₂(g)", "CaO(s) + H₂O(ℓ) → CaOH(s) + H(g)"], "answer": "B", "answer_text": "CaO(s) + H₂O(ℓ) → Ca(OH)₂(s)", "exp": "Two simple substances combine into one product, and the equation already balances as written: Ca 1 = 1, O 2 = 2, H 2 = 2, so no coefficients are needed. CaOH + H would leave calcium with the wrong charge and hydrogen as a lone atom, adding H₂ as a second product invents a substance the problem says is not there and leaves 3 O facing 2 O, and doubling every coefficient breaks the lowest whole-number ratio."}, {"id": 78, "level": "Intermediate", "tag": "Synthesis Reactions", "stem": "Iron reacts with oxygen in moist air to form iron (III) oxide, common rust. Which balanced equation shows this synthesis?", "options": ["2Fe(s) + 3O₂(g) → Fe₂O₃(s)", "4Fe(s) + 3O₂(g) → 2Fe₂O₃(s)", "2Fe(s) + O₂(g) → 2FeO(s)", "4Fe(s) + 3O₂(g) → 2Fe₃O₂(s)"], "answer": "B", "answer_text": "4Fe(s) + 3O₂(g) → 2Fe₂O₃(s)", "exp": "Iron (III) means Fe³⁺, which criss-crosses with O²⁻ to give Fe₂O₃, and balancing that needs 4Fe and 3O₂: Fe 4 = 4 and O 6 = 6. The equation 2Fe + O₂ → 2FeO is balanced but builds iron (II) oxide instead, Fe₃O₂ reverses the criss-cross and leaves 4 Fe facing 6 Fe, and 2Fe + 3O₂ → Fe₂O₃ strands 6 O on the left against 3 O."}, {"id": 79, "level": "Intermediate", "tag": "Decomposition Reactions", "stem": "Aluminum nitride is heated strongly and breaks down into its elements. Which balanced equation shows this decomposition?", "options": ["AlN → Al + N", "4AlN → 4Al + 2N₂", "Al₃N₂ → 3Al + N₂", "2AlN → 2Al + N₂"], "answer": "D", "answer_text": "2AlN → 2Al + N₂", "exp": "Aluminum nitride is AlN because Al³⁺ and N³⁻ cancel one for one, and since nitrogen is released as the diatomic N₂ the equation needs 2AlN → 2Al + N₂, giving Al 2 = 2 and N 2 = 2. The formula Al₃N₂ cannot exist for a +3 and −3 pair, writing N as a lone atom ignores that nitrogen gas is diatomic, and 4AlN → 4Al + 2N₂ is the correct equation doubled."}, {"id": 80, "level": "Intermediate", "tag": "Decomposition Reactions", "stem": "Limestone, CaCO₃, is heated in a kiln and decomposes into a metal oxide and a gas. Which equation is correct?", "options": ["CaCO₃(s) → CaO(s) + CO₂(g)", "2CaCO₃(s) → 2CaO(s) + 2CO₂(g)", "CaCO₃(s) → CaO(s) + CO(g)", "CaCO₃(s) + O₂(g) → CaO(s) + CO₂(g)"], "answer": "A", "answer_text": "CaCO₃(s) → CaO(s) + CO₂(g)", "exp": "One compound splits into two simpler ones and the equation balances as written: Ca 1 = 1, C 1 = 1, and O 3 = 1 + 2 = 3, so no coefficients are needed. Releasing CO instead of CO₂ leaves an oxygen atom unaccounted for (3 on the left, 2 on the right), adding O₂ to the reactants puts 5 O on the left and also stops the change from being a decomposition, and doubling every coefficient breaks the lowest whole-number ratio."}, {"id": 81, "level": "Intermediate", "tag": "Decomposition Reactions", "stem": "An electric current is passed through water and splits it into its elements. Which balanced equation shows this decomposition?", "options": ["2H₂O → 2H₂ + O₂", "2H₂O → 2H₂ + 2O₂", "4H₂O → 4H₂ + 2O₂", "H₂O → H₂ + O"], "answer": "A", "answer_text": "2H₂O → 2H₂ + O₂", "exp": "Both elements come off as diatomic molecules, so 2H₂O is needed to supply the 2 O in one O₂, giving H 4 = 4 and O 2 = 2. Writing a lone O ignores that oxygen gas is O₂, 2H₂O → 2H₂ + 2O₂ puts 4 O on the right against only 2 on the left, and 4H₂O → 4H₂ + 2O₂ is the correct equation doubled."}, {"id": 82, "level": "Intermediate", "tag": "Decomposition Reactions", "stem": "A worksheet asks students to complete and classify NH₃ → N₂ + H₂. Which answer is correct?", "options": ["2NH₃ → N₂ + 3H₂, decomposition", "N₂ + 3H₂ → 2NH₃, synthesis", "NH₃ → N₂ + H₂, decomposition", "2NH₃ → N₂ + 3H₂, synthesis"], "answer": "A", "answer_text": "2NH₃ → N₂ + 3H₂, decomposition", "exp": "As printed, one compound breaks apart into two elements, which is decomposition, and balancing it takes 2NH₃ → N₂ + 3H₂ so that N 2 = 2 and H 6 = 6. Turning the arrow around to N₂ + 3H₂ → 2NH₃ answers a different question, calling the forward reaction synthesis mislabels a compound that is coming apart, and NH₃ → N₂ + H₂ leaves 1 N facing 2 N and 3 H facing 2 H."}, {"id": 83, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "A strip of zinc is placed in copper (II) sulfate solution. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. What happens?", "options": ["No reaction occurs, because copper sits above zinc on the activity series", "Zn(s) + CuSO₄(aq) → ZnCu(s) + SO₄(g), because the two metals join together", "Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s), because zinc is above copper", "Zn(s) + CuSO₄(aq) → Zn₂SO₄(aq) + Cu(s), because zinc always forms +1 ions"], "answer": "C", "answer_text": "Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s), because zinc is above copper", "exp": "Zinc is higher on the activity series than copper, so it replaces copper in the compound and copper plates out as a reddish solid while the blue color fades. Zinc is a +2 ion, so Zn₂SO₄ is not a real formula, the claim that copper outranks zinc reverses the series, and metals do not bond to each other while ejecting a sulfate group as a gas."}, {"id": 84, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "A clean copper wire is left overnight in zinc sulfate solution. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. What is the correct prediction?", "options": ["No reaction occurs, because copper sits below zinc on the activity series", "Cu(s) + ZnSO₄(aq) → CuZn(s) + SO₄(aq), because the metals trade positions", "2Cu(s) + ZnSO₄(aq) → Cu₂SO₄(aq) + Zn(s), because copper reacts as a +1 ion", "Cu(s) + ZnSO₄(aq) → CuSO₄(aq) + Zn(s), because copper replaces the zinc"], "answer": "A", "answer_text": "No reaction occurs, because copper sits below zinc on the activity series", "exp": "A metal can replace only a metal that is less reactive than itself, and copper is below zinc, so nothing happens and the wire stays shiny. Writing CuSO₄ + Zn predicts a reaction the series forbids, the Cu₂SO₄ version does the same while also assuming the wrong charge, and CuZn plus a free sulfate is not a single replacement at all."}, {"id": 85, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "Nickel metal is added to aluminum carbonate solution. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. What is the correct prediction?", "options": ["3Ni + Al₂(CO₃)₃ → 3NiCO₃ + 2Al, because nickel replaces the aluminum", "2Ni + Al₂(CO₃)₃ → Ni₂(CO₃)₃ + 2Al, because nickel takes the charge of aluminum", "Ni + Al(CO₃)₃ → Ni(CO₃)₃ + Al, because the two metals trade places evenly", "No reaction occurs, because nickel sits below aluminum on the activity series"], "answer": "D", "answer_text": "No reaction occurs, because nickel sits below aluminum on the activity series", "exp": "Aluminum is more reactive than nickel, so nickel cannot push aluminum out of its compound and the nickel simply sits in the solution unchanged. The equation 3Ni + Al₂(CO₃)₃ → 3NiCO₃ + 2Al is balanced but predicts a reaction the activity series forbids, Al(CO₃)₃ would require aluminum to be +6 so it cannot exist, and Ni₂(CO₃)₃ assigns nickel a +3 charge it does not take with carbonate."}, {"id": 86, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "A copper foil is dipped in silver nitrate solution; the foil dissolves and shiny silver crystals grow on it. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. Which balanced equation describes this?", "options": ["Cu(s) + 2AgNO₃(aq) → Cu₂NO₃(aq) + 2Ag(s)", "2Ag(s) + Cu(NO₃)₂(aq) → 2AgNO₃(aq) + Cu(s)", "Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)", "Cu(s) + AgNO₃(aq) → Cu(NO₃)₂(aq) + Ag(s)"], "answer": "C", "answer_text": "Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)", "exp": "Copper is above silver, so copper goes into solution as Cu²⁺ and needs two nitrates, which forces 2AgNO₃ and 2Ag: Cu 1 = 1, Ag 2 = 2, N 2 = 2, O 6 = 6. The version with a single AgNO₃ leaves 1 N facing 2 N, Cu₂NO₃ gives copper the wrong charge, and starting from silver and copper (II) nitrate runs the reaction backwards, which the activity series does not allow."}, {"id": 87, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "Magnesium ribbon is dropped into hydrochloric acid and a gas that pops with a flame is released. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. Which balanced equation describes the reaction?", "options": ["Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)", "Mg(s) + 2HCl(aq) → MgH₂(aq) + Cl₂(g)", "Mg(s) + HCl(aq) → MgCl(aq) + H(g)", "2Mg(s) + 4HCl(aq) → 2MgCl₂(aq) + 2H₂(g)"], "answer": "A", "answer_text": "Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)", "exp": "Magnesium is above hydrogen, so it replaces the hydrogen in the acid, and because Mg²⁺ needs two chlorides the equation takes 2HCl: Mg 1 = 1, H 2 = 2, Cl 2 = 2. Writing MgCl and a lone H uses the wrong charge and forgets that hydrogen gas is diatomic, MgH₂ + Cl₂ swaps the wrong partners, and the 2, 4, 2, 2 version is the correct equation doubled."}, {"id": 88, "level": "Intermediate", "tag": "Single Replacement and the Activity Series", "stem": "Four metals are each dropped into hydrochloric acid: magnesium, zinc, iron, and copper. Activity series, most to least reactive: K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au. Which metal produces no bubbles at all, and why?", "options": ["Magnesium, because it is the least reactive of the four metals", "Copper, because copper sits below hydrogen on the activity series", "Iron, because iron also sits below hydrogen on the activity series", "Zinc, because no metal at all can replace the hydrogen in an acid"], "answer": "B", "answer_text": "Copper, because copper sits below hydrogen on the activity series", "exp": "Only a metal listed above hydrogen can replace it and release H₂, and copper is the one metal of the four that falls below hydrogen, so it just sits in the acid. Iron is above hydrogen and does bubble, magnesium is the most reactive of the four rather than the least, and zinc does replace hydrogen, which is why the general claim about acids is false."}, {"id": 89, "level": "Intermediate", "tag": "Double Replacement and Solubility", "stem": "Copper (II) sulfate solution is mixed with sodium carbonate solution. Solubility rules: all sodium salts are soluble; most sulfates are soluble; carbonates are insoluble except those of Group 1 metals and ammonium. Which equation is correct?", "options": ["CuSO₄(aq) + Na₂CO₃(aq) → Na₂SO₄(s) + CuCO₃(aq)", "CuSO₄(aq) + Na₂CO₃(aq) → NaSO₄(aq) + Cu₂CO₃(s)", "No reaction occurs, because both of the possible products dissolve in water", "CuSO₄(aq) + Na₂CO₃(aq) → Na₂SO₄(aq) + CuCO₃(s)"], "answer": "D", "answer_text": "CuSO₄(aq) + Na₂CO₃(aq) → Na₂SO₄(aq) + CuCO₃(s)", "exp": "The cations trade partners to give Na₂SO₄ and CuCO₃, and by the rules the sodium salt stays dissolved while copper (II) carbonate is insoluble, so it is the blue-green precipitate that drives the reaction. Marking sodium sulfate as the solid contradicts the rule that all sodium salts are soluble, NaSO₄ and Cu₂CO₃ have their charges backwards, and calling it no reaction ignores the insoluble carbonate."}, {"id": 90, "level": "Intermediate", "tag": "Double Replacement and Solubility", "stem": "A procedure calls for adding sodium carbonate solution to a second solution so that a precipitate forms. Solubility rules: all sodium, potassium, and nitrate compounds are soluble; all chlorides are soluble except silver, lead (II), and mercury (I); carbonates are insoluble except those of Group 1 metals and ammonium. Which second solution works?", "options": ["NaCl(aq), since sodium chloride is insoluble", "NaNO₃(aq), since sodium carbonate is insoluble", "KNO₃(aq), since potassium carbonate is insoluble", "CaCl₂(aq), since calcium carbonate is insoluble"], "answer": "D", "answer_text": "CaCl₂(aq), since calcium carbonate is insoluble", "exp": "Swapping partners between CaCl₂ and Na₂CO₃ gives NaCl, which is soluble, and CaCO₃, which is not, so a white solid settles out: CaCl₂(aq) + Na₂CO₃(aq) → CaCO₃(s) + 2NaCl(aq). Table salt cannot work because both sodium chloride and sodium carbonate are soluble, and the two nitrate solutions give only potassium or sodium compounds, every one of which the rules list as soluble."}, {"id": 91, "level": "Intermediate", "tag": "Double Replacement and Solubility", "stem": "Magnesium nitrate solution is mixed with sodium chloride solution. Solubility rules: all nitrates are soluble; all sodium salts are soluble; all chlorides are soluble except silver, lead (II), and mercury (I). What is the correct prediction?", "options": ["Mg(NO₃)₂(aq) + 2NaCl(aq) → MgCl₂(s) + 2NaNO₃(aq), magnesium chloride settles", "Mg(NO₃)₂(aq) + NaCl(aq) → MgCl(aq) + NaNO₃(aq), the ions simply trade places", "No reaction occurs, because both possible products are soluble in water", "Mg(NO₃)₂(aq) + 2NaCl(aq) → MgCl₂(aq) + 2NaNO₃(s), sodium nitrate settles"], "answer": "C", "answer_text": "No reaction occurs, because both possible products are soluble in water", "exp": "Trading partners would give MgCl₂ and NaNO₃, but magnesium is not on the chloride exception list and every nitrate is soluble, so nothing solid forms and there is no driving force. Calling magnesium chloride a precipitate ignores that exception list, calling sodium nitrate a precipitate contradicts the nitrate rule, and MgCl gives magnesium a +1 charge it does not have."}, {"id": 92, "level": "Intermediate", "tag": "Double Replacement and Solubility", "stem": "Sodium sulfide solution is mixed with hydrochloric acid and a gas that smells of rotten eggs bubbles out. Which balanced equation describes this double replacement?", "options": ["Na₂S(aq) + 2HCl(aq) → NaCl₂(aq) + H₂S(g)", "No reaction occurs, because both of the products dissolve in water", "Na₂S(aq) + HCl(aq) → H₂S(g) + NaCl(aq)", "Na₂S(aq) + 2HCl(aq) → H₂S(g) + 2NaCl(aq)"], "answer": "D", "answer_text": "Na₂S(aq) + 2HCl(aq) → H₂S(g) + 2NaCl(aq)", "exp": "The ions switch partners to give hydrogen sulfide and sodium chloride, and 2HCl is needed to supply the 2 H in H₂S and the 2 Cl for 2NaCl: Na 2 = 2, S 1 = 1, H 2 = 2, Cl 2 = 2. The single-HCl version leaves 2 Na facing 1 Na, NaCl₂ gives sodium a +2 charge, and calling it no reaction misses the driving force, since the escaping H₂S gas is one even without a precipitate."}, {"id": 93, "level": "Intermediate", "tag": "Double Replacement and Solubility", "stem": "Lead (II) nitrate solution is mixed with potassium iodide solution. Solubility rules: all nitrates are soluble; all potassium salts are soluble; iodides are soluble except silver, lead (II), and mercury (I). Which equation is correct?", "options": ["No reaction occurs, because both of the products stay dissolved in water", "Pb(NO₃)₂(aq) + KI(aq) → PbI(s) + KNO₃(aq)", "Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)", "Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(aq) + 2KNO₃(s)"], "answer": "C", "answer_text": "Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)", "exp": "The partners switch to give PbI₂ and KNO₃, lead (II) iodide is on the iodide exception list so it drops out as a bright yellow solid, and 2KI balances it: Pb 1 = 1, N 2 = 2, O 6 = 6, K 2 = 2, I 2 = 2. Labeling potassium nitrate as the solid contradicts the potassium rule, PbI gives lead a +1 charge and leaves the equation short an iodine, and calling it no reaction ignores the precipitate."}, {"id": 94, "level": "Intermediate", "tag": "Combustion Reactions", "stem": "Pentane, C₅H₁₂, burns completely in oxygen. Which is the balanced equation in lowest whole-number ratio?", "options": ["C₅H₁₂ + 8O₂ → 5CO₂ + 6H₂O", "C₅H₁₂ + 5O₂ → 5CO₂ + 6H₂O", "2C₅H₁₂ + 16O₂ → 10CO₂ + 12H₂O", "C₅H₁₂ + 8O₂ → 5CO₂ + 12H₂O"], "answer": "A", "answer_text": "C₅H₁₂ + 8O₂ → 5CO₂ + 6H₂O", "exp": "The 5 C become 5CO₂ and the 12 H become 6H₂O, which together need 10 + 6 = 16 oxygen atoms, or 8O₂. The 2, 16, 10, 12 version is balanced but every coefficient can be halved, using 5O₂ supplies only 10 of the 16 oxygen atoms, and 12H₂O would demand 24 H when pentane provides just 12."}, {"id": 95, "level": "Intermediate", "tag": "Combustion Reactions", "stem": "Heptene, C₇H₁₄, burns completely in oxygen. Which is the balanced equation in lowest whole-number ratio?", "options": ["C₇H₁₄ + 21O₂ → 14CO₂ + 14H₂O", "2C₇H₁₄ + 21O₂ → 14CO₂ + 7H₂O", "4C₇H₁₄ + 42O₂ → 28CO₂ + 28H₂O", "2C₇H₁₄ + 21O₂ → 14CO₂ + 14H₂O"], "answer": "D", "answer_text": "2C₇H₁₄ + 21O₂ → 14CO₂ + 14H₂O", "exp": "One C₇H₁₄ would need 21 oxygen atoms, an odd number, so the fuel is doubled: 2C₇H₁₄ gives 14 C and 28 H, making 14CO₂ and 14H₂O, which need 28 + 14 = 42 oxygen atoms, or 21O₂. Leaving the fuel at one molecule leaves 7 C facing 14 C, 7H₂O accounts for only 14 of the 28 H, and the 4, 42, 28, 28 version is the correct answer doubled."}, {"id": 96, "level": "Intermediate", "tag": "Combustion Reactions", "stem": "Candle wax can be modeled as C₂₀H₄₂. Which is the balanced equation for its complete combustion, in lowest whole-number ratio?", "options": ["4C₂₀H₄₂ + 122O₂ → 80CO₂ + 84H₂O", "C₂₀H₄₂ + 41O₂ → 20CO₂ + 42H₂O", "2C₂₀H₄₂ + 61O₂ → 40CO₂ + 42H₂O", "2C₂₀H₄₂ + 61O₂ → 40CO₂ + 84H₂O"], "answer": "C", "answer_text": "2C₂₀H₄₂ + 61O₂ → 40CO₂ + 42H₂O", "exp": "Two wax molecules give 40 C and 84 H, so the products are 40CO₂ and 42H₂O, holding 80 + 42 = 122 oxygen atoms, which is exactly 61O₂. The version C₂₀H₄₂ + 41O₂ → 20CO₂ + 42H₂O is the classic trap: 42H₂O needs 84 H but one wax molecule supplies only 42. Using 84H₂O on the doubled equation doubles the hydrogen again, and the 4, 122, 80, 84 set is the correct answer doubled."}, {"id": 97, "level": "Intermediate", "tag": "Combustion Reactions", "stem": "When methane burns with too little oxygen, poisonous carbon monoxide forms instead of carbon dioxide. Which equation shows this incomplete combustion, balanced in lowest whole-number ratio?", "options": ["CH₄ + 2O₂ → CO₂ + 2H₂O", "2CH₄ + 3O₂ → 2CO₂ + 4H₂O", "2CH₄ + 3O₂ → 2CO + 4H₂O", "4CH₄ + 6O₂ → 4CO + 8H₂O"], "answer": "C", "answer_text": "2CH₄ + 3O₂ → 2CO + 4H₂O", "exp": "Two CH₄ give 2 C and 8 H, so the products are 2CO and 4H₂O, which contain 2 + 4 = 6 oxygen atoms, matching 3O₂. The equation CH₄ + 2O₂ → CO₂ + 2H₂O is balanced but describes complete combustion, 2CH₄ + 3O₂ → 2CO₂ + 4H₂O needs 8 oxygen atoms while only 6 are supplied, and 4CH₄ + 6O₂ → 4CO + 8H₂O is the correct answer doubled."}, {"id": 98, "level": "Intermediate", "tag": "Identifying Reaction Types", "stem": "Classify the reaction 2Fe(NO₃)₃(aq) + 3Mn(s) → 2Fe(s) + 3Mn(NO₃)₂(aq).", "options": ["Decomposition, because one compound is breaking apart into simpler substances", "Synthesis, because several simple substances combine into one larger product", "Double replacement, because two compounds exchange their positive ion partners", "Single replacement, because an element replaces a metal inside a compound"], "answer": "D", "answer_text": "Single replacement, because an element replaces a metal inside a compound", "exp": "The pattern is A + BC → B + AC: manganese starts as a free element, takes the nitrate away from iron, and iron is set free as a metal. Double replacement would need two compounds trading partners rather than an element and a compound, synthesis would end with a single product, and decomposition would start with a single reactant."}, {"id": 99, "level": "Intermediate", "tag": "Identifying Reaction Types", "stem": "Classify the reaction Na₂S(aq) + 2HCl(aq) → H₂S(g) + 2NaCl(aq).", "options": ["Combustion, because a gas is given off while the mixture warms up", "Single replacement, because one free element pushes another one out", "Decomposition, because the sodium sulfide is breaking into pieces", "Double replacement, because the two compounds trade their ion partners"], "answer": "D", "answer_text": "Double replacement, because the two compounds trade their ion partners", "exp": "Two compounds react and the positive ions switch partners, AB + CD → AD + CB, with sodium ending up on the chloride and hydrogen on the sulfide. Single replacement would require a free element among the reactants, and there is none; combustion would require oxygen as a reactant with CO₂ and H₂O as products; and decomposition would require just one reactant."}, {"id": 100, "level": "Intermediate", "tag": "Identifying Reaction Types", "stem": "Classify the reaction 2H₂O₂(aq) → 2H₂O(ℓ) + O₂(g).", "options": ["Synthesis, because water and oxygen are being built out of the peroxide", "Combustion, because oxygen gas appears and the container becomes warm", "Decomposition, because a single compound splits into two simpler substances", "Single replacement, because the oxygen is replacing hydrogen in the compound"], "answer": "C", "answer_text": "Decomposition, because a single compound splits into two simpler substances", "exp": "One reactant, hydrogen peroxide, breaks apart into two products, which is the pattern AB → A + B. Combustion needs oxygen as a reactant rather than a product, synthesis would run the other way and end with one product instead of two, and single replacement would require a free element among the reactants."}, {"id": 101, "level": "Advanced", "tag": "Reading a Chemical Equation", "stem": "A study guide states: “In 4Fe(s) + 3O₂(g) → 2Fe₂O₃(s), the coefficients mean 4 grams of iron react with 3 grams of oxygen.” How should this equation actually be read?", "options": ["Four iron atoms react with three oxygen atoms to give two units of the oxide", "Four grams of iron react with three grams of oxygen gas, exactly as written", "Three iron atoms react with four oxygen molecules, reading the arrow backward", "Four iron atoms react with three oxygen molecules to give two oxide units"], "answer": "D", "answer_text": "Four iron atoms react with three oxygen molecules to give two oxide units", "exp": "Coefficients count particles, not mass: 4 Fe atoms react with 3 O₂ molecules to give 2 formula units of iron (III) oxide, and the (s) and (g) labels give the states. Reading them as grams ignores that different atoms have different masses, and calling 3O₂ “three oxygen atoms” loses half the oxygen, since three molecules hold six atoms. The arrow always points from reactants to products, so iron and oxygen cannot be swapped to 3 Fe and 4 O₂."}, {"id": 102, "level": "Advanced", "tag": "Counting Atoms with Coefficients", "stem": "A student’s worked solution counts the atoms in 5Al(OH)₃ as “Al 1, O 3, H 3.” What is the correct atom count?", "options": ["Al 5, O 15, H 5, because the subscript 3 outside the parentheses acts on O", "Al 1, O 3, H 3, because a coefficient counts whole units and not the atoms", "Al 5, O 3, H 3, because a coefficient applies only to the element it touches", "Al 5, O 15, H 15, because the coefficient 5 multiplies every atom shown"], "answer": "D", "answer_text": "Al 5, O 15, H 15, because the coefficient 5 multiplies every atom shown", "exp": "The subscript 3 outside the parentheses gives 3 O and 3 H in each Al(OH)₃ unit, and the coefficient 5 multiplies everything: Al 5, O 15, H 15. The Al 1, O 3, H 3 count drops the coefficient entirely, Al 5, O 3, H 3 applies it only to aluminum, and Al 5, O 15, H 5 forgets that the 3 covers the hydrogen inside the parentheses as well."}, {"id": 103, "level": "Advanced", "tag": "Law of Conservation of Mass", "stem": "A study guide shows this work: “2.1 g of lead reacts completely with 2.54 g of iodine to form lead (II) iodide, so the product has a mass of 2.6 g.” What mass of lead (II) iodide forms?", "options": ["4.6 g, since 2.1 + 2.54 = 4.64 and 2.1 g limits the sum to the tenths place", "0.44 g, since the lead mass is subtracted from the mass of the iodine used", "4.64 g, since every digit of both measured masses belongs in the answer", "2.6 g, as the guide states, since a product cannot outweigh either reactant"], "answer": "A", "answer_text": "4.6 g, since 2.1 + 2.54 = 4.64 and 2.1 g limits the sum to the tenths place", "exp": "Mass is conserved, so all of the lead and all of the iodine end up in the product: 2.1 g + 2.54 g = 4.64 g. The 2.1 g mass is known only to the tenths place, so the sum is reported as 4.6 g; 4.64 g claims a hundredths digit the lead mass never had, 2.6 g throws away most of the mass, and 0.44 g comes from subtracting when the two reactants combine."}, {"id": 104, "level": "Advanced", "tag": "Law of Conservation of Mass", "stem": "A sealed flask of baking soda and vinegar has a total mass of 158.2 g. The reaction runs, the stopper is removed so the gas escapes, and the flask and contents are re-massed at 156.9 g. What mass of carbon dioxide escaped?", "options": ["315.1 g, since the two flask readings are added to find the gas released", "1.30 g, since the subtraction keeps one digit from each measured mass", "1.3 g, and the drop shows that mass is destroyed when a gas is released", "1.3 g, and the sealed reading shows mass was conserved inside the flask"], "answer": "D", "answer_text": "1.3 g, and the sealed reading shows mass was conserved inside the flask", "exp": "The only material that left was carbon dioxide, so 158.2 g − 156.9 g = 1.3 g of gas escaped, and both readings are known to the tenths place, so the difference stops there too. Writing 1.30 g claims a hundredths digit the balance never gave, and 315.1 g adds the readings instead of subtracting. Nothing was destroyed — while the flask was sealed the mass never changed at all."}, {"id": 105, "level": "Advanced", "tag": "Law of
