 Conservation of Mass", "stem": "A study guide shows this work: “12.25 g of potassium chlorate is heated in an open crucible until only 7.45 g of potassium chloride remains. Oxygen released = 4.80 g/mol.” What should be reported?", "options": ["4.80 g, since 12.25 − 7.45 = 4.80 and the result is a sample mass, not a molar mass", "4.8 g, since a subtraction answer can keep only two digits in total here", "4.80 g/mol, since a mass found from a chemical formula carries that unit", "19.70 g, since the starting and remaining masses are added for the total"], "answer": "A", "answer_text": "4.80 g, since 12.25 − 7.45 = 4.80 and the result is a sample mass, not a molar mass", "exp": "The mass that disappeared from the crucible left as oxygen gas: 12.25 g − 7.45 g = 4.80 g, and both masses are known to the hundredths place, so the answer keeps that place. The unit g/mol belongs to molar mass, not to the mass of a sample, 4.8 g drops a digit the balance supports, and 19.70 g adds the two masses when the product mass is part of the starting mass."}, {"id": 106, "level": "Advanced", "tag": "Balancing Equations", "stem": "A study guide gives the decomposition of sodium nitrate as 2NaNO₃ → 3NaNO₂ + 3O₂. Which balanced equation should replace it?", "options": ["2NaNO₃ → 2NaNO₂ + O₂, which puts 2 Na, 2 N and 6 O on each side of the arrow", "4NaNO₃ → 4NaNO₂ + 2O₂, which is the smallest whole-number set that will work", "NaNO₃ → NaNO₂ + O₂, which balances once all of the coefficients are removed", "2NaNO₃ → 3NaNO₂ + 3O₂, which is already balanced just as the guide wrote it"], "answer": "A", "answer_text": "2NaNO₃ → 2NaNO₂ + O₂, which puts 2 Na, 2 N and 6 O on each side of the arrow", "exp": "The guide’s version has 2 Na and 6 O entering but 3 Na and 12 O leaving, so it cannot be balanced. Using 2NaNO₃ → 2NaNO₂ + O₂ gives 2 Na, 2 N and 6 O on both sides. Dropping the coefficients leaves 3 O in and 4 O out, and 4NaNO₃ → 4NaNO₂ + 2O₂ does balance but every coefficient divides by 2, so it is not in lowest whole numbers."}, {"id": 107, "level": "Advanced", "tag": "Balancing Equations", "stem": "A worked solution balances the burning of hexane, C₆H₁₄, as 4C₆H₁₄ + 38O₂ → 24CO₂ + 28H₂O. Every element does come out even. What is still wrong with it?", "options": ["The oxygen is too high, so 4C₆H₁₄ + 25O₂ → 24CO₂ + 28H₂O is the correct form", "Water cannot form here, so 4C₆H₁₄ + 38O₂ → 24CO₂ is the version that balances", "Every coefficient divides by 2, so 2C₆H₁₄ + 19O₂ → 12CO₂ + 14H₂O is lowest terms", "Nothing is wrong, since those are the smallest whole numbers that will balance"], "answer": "C", "answer_text": "Every coefficient divides by 2, so 2C₆H₁₄ + 19O₂ → 12CO₂ + 14H₂O is lowest terms", "exp": "The atom counts do match — 24 C, 56 H and 76 O on each side — but a balanced equation must also use the lowest whole-number ratio, and 4, 38, 24 and 28 all divide by 2 to give 2C₆H₁₄ + 19O₂ → 12CO₂ + 14H₂O. Changing oxygen to 25O₂ leaves 50 O entering and 76 O leaving, and deleting the water strands all 56 hydrogen atoms with nowhere to go."}, {"id": 108, "level": "Advanced", "tag": "Balancing Equations", "stem": "A study guide writes the burning of iron as 2Fe(s) + 1O₂(g) → 2FeO(s) and names the product iron oxide. What two corrections does the line need?", "options": ["The coefficient 1 has to stay, and the product is named simply iron oxide", "The coefficient 1 is left off, and the product is named iron (II) oxide", "The coefficient 1 is left off, and the product is named iron (III) oxide", "The equation should read 4Fe + 3O₂, and the product is named iron oxide"], "answer": "B", "answer_text": "The coefficient 1 is left off, and the product is named iron (II) oxide", "exp": "As written the atoms already balance at 2 Fe and 2 O per side, so the only equation fix is that a coefficient of 1 is understood and never printed: 2Fe(s) + O₂(g) → 2FeO(s). Iron forms more than one ion, so FeO must be named iron (II) oxide; iron (III) oxide is Fe₂O₃, which is what 4Fe + 3O₂ → 2Fe₂O₃ would produce, and plain “iron oxide” leaves the charge unstated."}, {"id": 109, "level": "Advanced", "tag": "Balancing Equations", "stem": "Tetraphosphorus decoxide, P₄O₁₀, reacts with water to make phosphoric acid, H₃PO₄. Which balanced equation is correct?", "options": ["P₄O₁₀ + 6H₂O → 4H₃PO₄, which gives 4 P, 12 H and 16 O on each side", "2PO₅ + 3H₂O → 2H₃PO₄, since the oxide is written as PO₅ per phosphorus", "P₄O₁₀ + 6H₂O → 2H₃PO₄, since the acid keeps phosphorus atoms in pairs", "P₄O₁₀ + 4H₂O → 4H₃PO₄, since one water is needed for each phosphorus"], "answer": "A", "answer_text": "P₄O₁₀ + 6H₂O → 4H₃PO₄, which gives 4 P, 12 H and 16 O on each side", "exp": "Four phosphorus atoms require 4H₃PO₄, which needs 12 H, so 6H₂O must react, and the oxygen then balances at 10 + 6 = 16 on each side. Using 4H₂O supplies only 8 H for the 12 the acid needs, and 2H₃PO₄ strands two phosphorus atoms. PO₅ is not a real compound — phosphorus oxides are written P₄O₁₀ or P₂O₅."}, {"id": 110, "level": "Advanced", "tag": "Balancing Equations", "stem": "Aluminum hydroxide neutralizes sulfuric acid, giving aluminum sulfate and water. Aluminum ions are Al³⁺ and sulfate ions are SO₄²⁻. Which balanced equation is correct?", "options": ["Al(OH)₃ + H₂SO₄ → AlSO₄ + H₂O, pairing one hydroxide unit with one acid unit", "2Al(OH)₃ + 3H₂SO₄ → Al₂(SO₄)₃ + 6H₂O, giving 2 Al, 3 S and 12 H per side", "3Al(OH)₃ + 2H₂SO₄ → Al₂(SO₄)₃ + 6H₂O, matching the acid to the metal count", "2Al(OH)₃ + 3H₂SO₄ → Al₂(SO₄)₃ + 3H₂O, using one water for each acid unit"], "answer": "B", "answer_text": "2Al(OH)₃ + 3H₂SO₄ → Al₂(SO₄)₃ + 6H₂O, giving 2 Al, 3 S and 12 H per side", "exp": "Al³⁺ with SO₄²⁻ gives Al₂(SO₄)₃, so 2 aluminum hydroxide units and 3 acid units are needed, and the 6 hydroxide hydrogens plus the 6 acid hydrogens form 6H₂O, with 18 O on each side. Only 3H₂O would leave 6 hydrogen atoms unaccounted for, AlSO₄ is charge-impossible because a 3+ ion cannot balance a 2− ion one to one, and 3Al(OH)₃ supplies 3 Al for the 2 the product needs."}, {"id": 111, "level": "Advanced", "tag": "Balancing Equations", "stem": "Zinc metal is dropped into phosphoric acid, H₃PO₄, and hydrogen gas bubbles off, leaving zinc phosphate in solution. Zinc ions are Zn²⁺ and phosphate ions are PO₄³⁻. Which balanced equation is correct?", "options": ["Zn + H₃PO₄ → ZnPO₄ + H₂, pairing one zinc atom with one acid unit", "2Zn + 3H₃PO₄ → Zn₂(PO₄)₃ + 3H₂, crossing the 2 and the 3 as they appear", "3Zn + 2H₃PO₄ → Zn₃(PO₄)₂ + 3H₂, with 3 Zn, 2 P, 8 O and 6 H per side", "3Zn + 2H₃PO₄ → Zn₃(PO₄)₂ + H₂, since the hydrogen leaves as a single gas"], "answer": "C", "answer_text": "3Zn + 2H₃PO₄ → Zn₃(PO₄)₂ + 3H₂, with 3 Zn, 2 P, 8 O and 6 H per side", "exp": "Zn²⁺ with PO₄³⁻ gives Zn₃(PO₄)₂, so 3 zinc atoms and 2 phosphate groups are needed, and the 6 hydrogen atoms released form 3H₂. Writing only H₂ on the right leaves 4 hydrogen atoms missing, ZnPO₄ would require zinc to carry a 3+ charge, and Zn₂(PO₄)₃ crosses the charges the wrong way and also leaves 9 H entering against 6 H leaving."}, {"id": 112, "level": "Advanced", "tag": "Balancing Equations", "stem": "A study guide writes aluminum carbonate as Al(CO₃)₃ and heats it to aluminum oxide and carbon dioxide. Aluminum ions are Al³⁺ and carbonate ions are CO₃²⁻. Which line is correct?", "options": ["Al₂(CO₃)₃ → 2AlO + 3CO₂, since the oxide of aluminum is written as AlO", "Al(CO₃)₃ → AlO₃ + 3CO₂, since the formula the guide wrote already works", "Al₂(CO₃)₃ → Al₂O₃ + 3CO₂, since two Al³⁺ ions balance three carbonates", "Al₃(CO₃)₂ → Al₂O₃ + 2CO₂, since aluminum takes the larger subscript here"], "answer": "C", "answer_text": "Al₂(CO₃)₃ → Al₂O₃ + 3CO₂, since two Al³⁺ ions balance three carbonates", "exp": "Crossing 3+ with 2− gives Al₂(CO₃)₃; the guide’s Al(CO₃)₃ would need a single Al⁶⁺ ion, and Al₃(CO₃)₂ reverses the subscripts. Heating it gives Al₂O₃ + 3CO₂, which balances at 2 Al, 3 C and 9 O per side. AlO is also charge-impossible, since one 3+ ion cannot pair one to one with a 2− ion."}, {"id": 113, "level": "Advanced", "tag": "Synthesis Reactions", "stem": "A study guide gives zinc oxide as Zn₂O₂ and makes it from its elements. Zinc ions are Zn²⁺ and oxide ions are O²⁻. Which synthesis equation is correct?", "options": ["2Zn + O₂ → 2ZnO, since one Zn²⁺ ion balances one O²⁻ ion exactly", "2Zn + O₂ → Zn₂O₂, since the two charges are crossed to build the formula", "Zn + O₂ → ZnO₂, since oxygen carries its 2 into the product formula", "4Zn + 2O₂ → 2Zn₂O₂, since the crossed formula only needs doubling to balance"], "answer": "A", "answer_text": "2Zn + O₂ → 2ZnO, since one Zn²⁺ ion balances one O²⁻ ion exactly", "exp": "Charges of 2+ and 2− cancel one to one, so the compound is ZnO, not Zn₂O₂, and 2Zn + O₂ → 2ZnO balances at 2 Zn and 2 O per side. Crossing the numbers when the charges are already equal is the mistake behind both Zn₂O₂ versions, and ZnO₂ would require zinc to carry a 4+ charge."}, {"id": 114, "level": "Advanced", "tag": "Synthesis Reactions", "stem": "Calcium burning in air also combines directly with nitrogen. Calcium ions are Ca²⁺ and nitride ions are N³⁻. Which balanced synthesis equation is correct?", "options": ["2Ca + 3N₂ → Ca₂N₃, since the charges are used as written and not crossed", "Ca + N₂ → CaN₂, since the nitrogen molecule stays whole inside the product", "3Ca + 2N₂ → Ca₃N₄, since each nitrogen molecule adds two atoms to the pile", "3Ca + N₂ → Ca₃N₂, which puts 3 Ca and 2 N on each side of the arrow"], "answer": "D", "answer_text": "3Ca + N₂ → Ca₃N₂, which puts 3 Ca and 2 N on each side of the arrow", "exp": "Crossing 2+ and 3− gives Ca₃N₂, and one N₂ molecule supplies exactly the 2 N that formula needs, so 3Ca + N₂ → Ca₃N₂ balances. Ca₂N₃ uses the charges without crossing them and CaN₂ assumes the N₂ molecule survives intact. Ca₃N₄ does come out even atom for atom, but three Ca²⁺ ions carry 6+ while four N³⁻ ions carry 12−, so that compound cannot exist."}, {"id": 115, "level": "Advanced", "tag": "Synthesis Reactions", "stem": "Aluminum foil burns in pure oxygen to form aluminum oxide. Aluminum ions are Al³⁺ and oxide ions are O²⁻. Which balanced equation is correct?", "options": ["4Al + 3O₂ → 2Al₂O₃, which puts 4 Al and 6 O on each side of the arrow", "2Al + 3O₂ → Al₂O₃, since crossing the charges already finishes the job", "2Al + O₂ → 2AlO, since one aluminum atom pairs with one oxygen atom", "4Al + 6O₂ → 2Al₂O₃, doubling the oxygen to cover the three subscripts"], "answer": "A", "answer_text": "4Al + 3O₂ → 2Al₂O₃, which puts 4 Al and 6 O on each side of the arrow", "exp": "Crossing 3+ with 2− gives Al₂O₃, and balancing needs 4 Al and 6 O, which is 3O₂: 4Al + 3O₂ → 2Al₂O₃. Writing 2Al + 3O₂ → Al₂O₃ sends in 6 oxygen atoms but stores only 3, 4Al + 6O₂ doubles oxygen to 12 atoms for the same 6 needed, and AlO would require Al²⁺."}, {"id": 116, "level": "Advanced", "tag": "Decomposition Reactions", "stem": "A worksheet asks students to balance HgO → Hg + O₂ and name the reaction type. A study guide answers “2Hg + O₂ → 2HgO, synthesis.” What is correct for the reaction as printed?", "options": ["2HgO → 2Hg + O₂, synthesis, since two products are built from one reactant", "HgO → Hg + O₂, decomposition, since no coefficients are needed as printed", "2Hg + O₂ → 2HgO, synthesis, since the guide rewrote the equation correctly", "2HgO → 2Hg + O₂, decomposition, since one compound gives two elements"], "answer": "D", "answer_text": "2HgO → 2Hg + O₂, decomposition, since one compound gives two elements", "exp": "The printed arrow runs from mercury (II) oxide to the elements, so the answer must keep that direction: 2HgO → 2Hg + O₂, with 2 Hg and 2 O per side. One reactant breaking into two products is decomposition, not synthesis, and flipping the equation to 2Hg + O₂ → 2HgO answers a different question than the sheet asked. Leaving off the coefficients gives 1 O entering and 2 O leaving."}, {"id": 117, "level": "Advanced", "tag": "Decomposition Reactions", "stem": "A bottle of hydrogen peroxide, H₂O₂, slowly breaks down on the shelf into water and oxygen gas. Which line gives the balanced equation and the correct type?", "options": ["2H₂O₂ → 2H₂O + O₂, decomposition, since one compound gives two products", "2H₂O₂ → 2H₂O + O₂, single replacement, since oxygen leaves the compound", "2H₂O + O₂ → 2H₂O₂, synthesis, since water and oxygen combine on the shelf", "H₂O₂ → H₂O + O₂, decomposition, since the formulas already match up here"], "answer": "A", "answer_text": "2H₂O₂ → 2H₂O + O₂, decomposition, since one compound gives two products", "exp": "Two peroxide units supply 4 H and 4 O, which come out as 2H₂O + O₂, so 2H₂O₂ → 2H₂O + O₂ balances. Without the coefficients there are 2 O entering and 3 O leaving. A single replacement needs a free element trading places with part of a compound, and reversing the arrow describes the bottle refilling itself rather than breaking down."}, {"id": 118, "level": "Advanced", "tag": "Decomposition Reactions", "stem": "A study guide shows limestone breaking down in a hot kiln as CaCO₃ → CaO + CO. What correction does that line need?", "options": ["The gas is carbon dioxide: CaCO₃ → CaO + CO₂ keeps 3 O on each side", "The solid is calcium peroxide: CaCO₃ → CaO₂ + CO₂ keeps the carbon in", "Nothing is wrong, since one calcium and one carbon appear on each side here", "The gas stays carbon monoxide, but 2CaCO₃ → 2CaO + 2CO is needed to balance"], "answer": "A", "answer_text": "The gas is carbon dioxide: CaCO₃ → CaO + CO₂ keeps 3 O on each side", "exp": "Limestone carries 3 oxygen atoms, and CaO + CO accounts for only 2, so the gas released must be carbon dioxide: CaCO₃ → CaO + CO₂. Adding matching coefficients to 2CaCO₃ → 2CaO + 2CO cannot help, because doubling both sides leaves the same 6-to-4 oxygen gap. CaO₂ is not what heating limestone gives, and that version sends 3 oxygen atoms in and 4 out. The calcium and carbon counts alone never prove an equation is balanced."}, {"id": 119, "level": "Advanced", "tag": "Single Replacement and the Activity Series", "stem": "A study guide gives the reaction of aluminum foil with silver nitrate solution as AgNO₃ + Al → Ag + Al(NO₃)₃. Aluminum sits above silver on the activity series. Which balanced equation is correct?", "options": ["3AgNO₃ + Al → 3Ag + Al(NO₃)₃, giving 3 Ag and 3 nitrate groups per side", "AgNO₃ + Al → Ag + Al(NO₃)₃, since the nitrate groups travel as one piece", "AgNO₃ + 3Al → Ag + Al(NO₃)₃, since the aluminum must be tripled to react", "3AgNO₃ + Al → Ag₃ + Al(NO₃)₃, since three silver atoms plate out together"], "answer": "A", "answer_text": "3AgNO₃ + Al → 3Ag + Al(NO₃)₃, giving 3 Ag and 3 nitrate groups per side", "exp": "Aluminum is the more reactive metal, so it replaces silver, but Al(NO₃)₃ needs three nitrate groups while one AgNO₃ supplies only one: 3AgNO₃ + Al → 3Ag + Al(NO₃)₃ balances at 3 Ag, 1 Al, 3 N and 9 O per side. The one-to-one version leaves 1 N entering and 3 N leaving, tripling the aluminum strands two extra aluminum atoms, and silver metal is written Ag, never Ag₃."}, {"id": 120, "level": "Advanced", "tag": "Single Replacement and the Activity Series", "stem": "A study guide states: “Copper is more reactive than zinc, so copper (II) sulfate plus zinc is no reaction.” In lab the blue solution fades and dark copper coats the zinc strip. What is correct?", "options": ["Zinc is more reactive, so ZnSO₄ + Cu → CuSO₄ + Zn is the reaction observed", "Zinc is more reactive: CuSO₄ + Zn → ZnSO₄ + Cu, matching the lab result", "The two metals are equally reactive, so they simply trade places back and forth", "Copper is more reactive, so the dark coating on the zinc strip is zinc metal"], "answer": "B", "answer_text": "Zinc is more reactive: CuSO₄ + Zn → ZnSO₄ + Cu, matching the lab result", "exp": "Zinc sits above copper on the activity series, so zinc replaces copper: CuSO₄ + Zn → ZnSO₄ + Cu, which balances as written and explains both the fading blue color and the copper coating. Writing ZnSO₄ + Cu → CuSO₄ + Zn has the less reactive metal doing the replacing, so nothing would happen, and calling the coating zinc ignores that the zinc strip is what dissolves."}, {"id": 121, "level": "Advanced", "tag": "Single Replacement and the Activity Series", "stem": "Using the activity series K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au (most to least reactive), what happens when lead metal is dropped into zinc nitrate solution?", "options": ["No reaction, because lead sits below zinc and cannot replace it", "Pb + Zn(NO₃)₂ → Pb(NO₃)₂ + Zn, because lead replaces the zinc", "2Pb + Zn(NO₃)₂ → Pb₂(NO₃)₂ + Zn, because lead takes a 1+ charge here", "No reaction, because nitrates are never part of a replacement reaction"], "answer": "A", "answer_text": "No reaction, because lead sits below zinc and cannot replace it", "exp": "A metal replaces only a metal that is less reactive than itself, and lead sits four places below zinc on the series, so the lead just sits in the solution. Both equations that show lead pushing zinc out run the activity series backward, and Pb₂(NO₃)₂ also gives lead a charge it does not take with nitrate. Nitrates do take part in replacement reactions when the metal ranking allows it."}, {"id": 122, "level": "Advanced", "tag": "Single Replacement and the Activity Series", "stem": "A worked solution reads: “2Fe(NO₃)₃ + 3Mn → 2Fe + 3Mg(NO₃)₂.” Manganese sits above iron on the activity series. What is wrong with it?", "options": ["No reaction occurs, since manganese sits below iron on the activity series", "Iron must appear in the product: 2Fe(NO₃)₃ + 3Mn → 2Mn + 3Fe(NO₃)₂ instead", "Nothing is wrong, since magnesium and manganese behave the same way here", "Manganese must appear in the product: 2Fe(NO₃)₃ + 3Mn → 2Fe + 3Mn(NO₃)₂"], "answer": "D", "answer_text": "Manganese must appear in the product: 2Fe(NO₃)₃ + 3Mn → 2Fe + 3Mn(NO₃)₂", "exp": "Magnesium never entered the beaker, so it cannot leave it — the metal that replaces iron is the manganese that was added, giving 2Fe(NO₃)₃ + 3Mn → 2Fe + 3Mn(NO₃)₂ with 2 Fe, 3 Mn, 6 N and 18 O per side. Swapping the products to 2Mn + 3Fe(NO₃)₂ puts the free metal back into solution and the dissolved metal back on the shelf. Mn and Mg are different elements, and the stem places manganese above iron, so the reaction does happen."}, {"id": 123, "level": "Advanced", "tag": "Single Replacement and the Activity Series", "stem": "Aluminum wire is placed in lead (II) nitrate solution. Using the activity series K, Na, Ca, Mg, Al, Zn, Fe, Ni, Sn, Pb, H, Cu, Hg, Ag, Au (most to least reactive), which balanced equation is correct?", "options": ["Al + Pb(NO₃)₂ → Pb + Al(NO₃)₂, since the nitrate count carries straight over", "2Al + 3Pb(NO₃)₂ → 3Pb + 2Al(NO₃)₃, since aluminum outranks lead here", "3Al + 2Pb(NO₃)₂ → 2Pb + 3Al(NO₃)₂, since the two charges are crossed here", "No reaction, since lead sits below aluminum on the activity series given"], "answer": "B", "answer_text": "2Al + 3Pb(NO₃)₂ → 3Pb + 2Al(NO₃)₃, since aluminum outranks lead here", "exp": "Aluminum is above lead, so it replaces lead, and Al³⁺ with NO₃⁻ gives Al(NO₃)₃; balancing the 6 nitrate groups takes 3Pb(NO₃)₂ and 2Al(NO₃)₃. Al(NO₃)₂ in the other two choices would require Al²⁺, which aluminum does not form. A metal only fails to react when it is the less reactive one, and here the reacting metal is the higher one."}, {"id": 124, "level": "Advanced", "tag": "Double Replacement and Solubility", "stem": "A lab sheet says to dissolve table salt in water, add sodium nitrate solution, and collect the precipitate — but nothing forms. Every sodium salt and every nitrate is soluble, while lead (II) chloride is not. Which change fixes the demonstration?", "options": ["Add the table salt as dry crystals, since the water is what blocks it here", "Use lead (II) nitrate: Pb(NO₃)₂ + 2NaCl → PbCl₂(s) + 2NaNO₃ gives the solid", "Heat the mixture, since sodium nitrate must decompose before reacting", "Use more table salt, since a precipitate needs a higher concentration"], "answer": "B", "answer_text": "Use lead (II) nitrate: Pb(NO₃)₂ + 2NaCl → PbCl₂(s) + 2NaNO₃ gives the solid", "exp": "Sodium chloride and sodium nitrate can only trade partners to give sodium nitrate and sodium chloride again, and every sodium salt and every nitrate dissolves, so there is no precipitate, no gas and no water to drive anything. Lead (II) nitrate supplies the Pb²⁺ that pairs with Cl⁻: Pb(NO₃)₂ + 2NaCl → PbCl₂(s) + 2NaNO₃, with 1 Pb, 2 N, 6 O, 2 Na and 2 Cl per side. More salt, extra heat or dry crystals cannot create a driving force that the ions do not have."}, {"id": 125, "level": "Advanced", "tag": "Double Replacement and Solubility", "stem": "Silver nitrate solution is mixed with sodium carbonate solution. All sodium salts and all nitrates are soluble, while silver carbonate is not. Which balanced equation is correct?", "options": ["No reaction, since both starting solutions are clear and fully dissolved", "AgNO₃ + Na₂CO₃ → AgCO₃(s) + NaNO₃, since one silver ion pairs with one carbonate", "2AgNO₃ + Na₂CO₃ → Ag₂(CO₃)₂(s) + 2NaNO₃, since the carbonate keeps its own subscript", "2AgNO₃ + Na₂CO₃ → Ag₂CO₃(s) + 2NaNO₃, with 2 Ag, 2 Na and 2 nitrates per side"], "answer": "D", "answer_text": "2AgNO₃ + Na₂CO₃ → Ag₂CO₃(s) + 2NaNO₃, with 2 Ag, 2 Na and 2 nitrates per side", "exp": "The ions trade partners to give Na⁺ with NO₃⁻ and Ag⁺ with CO₃²⁻, so the formulas are NaNO₃ and Ag₂CO₃, and balancing needs 2AgNO₃ and 2NaNO₃. AgCO₃ would require Ag²⁺, and Ag₂(CO₃)₂ writes the correct ratio twice over instead of in its simplest form. The insoluble silver carbonate is the driving force, so two clear solutions certainly can react."}, {"id": 126, "level": "Advanced", "tag": "Double Replacement and Solubility", "stem": "Silver nitrate solution is mixed with aluminum chloride solution. Nitrates are soluble and aluminum nitrate stays dissolved, while silver chloride is insoluble. Which balanced equation is correct?", "options": ["3AgNO₃ + AlCl₃ → 3AgCl(s) + Al(NO₃)₃, with 3 Ag, 3 Cl and 3 nitrates", "2AgNO₃ + AlCl₃ → 2AgCl(s) + Al(NO₃)₂, since aluminum takes two nitrates", "AgNO₃ + AlCl₃ → AgCl(s) + Al(NO₃)₃, since silver and chlorine pair one to one", "3AgNO₃ + AlCl₃ → Ag₃Cl(s) + Al(NO₃)₃, since three silvers join one chloride"], "answer": "A", "answer_text": "3AgNO₃ + AlCl₃ → 3AgCl(s) + Al(NO₃)₃, with 3 Ag, 3 Cl and 3 nitrates", "exp": "Silver is always 1+ and chloride 1−, so the precipitate is AgCl, and aluminum needs three nitrate groups, which takes 3AgNO₃ and gives 3AgCl(s) + Al(NO₃)₃. Leaving the coefficients off sends in 1 nitrate while 3 leave, Ag₃Cl would require chloride to carry a 3− charge, and Al(NO₃)₂ would require Al²⁺."}, {"id": 127, "level": "Advanced", "tag": "Double Replacement and Solubility", "stem": "A study guide lists ammonium sulfide plus barium iodide as forming a barium sulfide precipitate. Ammonium salts are soluble, barium iodide is soluble, and barium sulfide is soluble as well. What should the guide say instead?", "options": ["(NH₄)₂S + BaI₂ → BaS(s) + 2NH₄I, since the barium sulfide precipitates out", "(NH₄)₂S + BaI₂ → BaS(s) + NH₄I₂, since ammonium takes both iodide ions", "No reaction, since ammonium compounds never take part in an exchange", "No reaction, since every possible product dissolves and nothing drives it"], "answer": "D", "answer_text": "No reaction, since every possible product dissolves and nothing drives it", "exp": "Trading partners would give barium sulfide and ammonium iodide, and both of those dissolve, so no precipitate, no gas and no water forms and there is nothing to drive the change. Writing BaS(s) contradicts the solubility information given, and NH₄I₂ would require ammonium to carry a 2+ charge. Ammonium compounds do take part in double replacements whenever a product is insoluble."}, {"id": 128, "level": "Advanced", "tag": "Combustion Reactions", "stem": "A study guide balances a wax modeled as C₂₂H₄₆ burning as C₂₂H₄₆ + 45O₂ → 22CO₂ + 46H₂O, but hydrogen counts 46 on the left and 92 on the right. Which equation is correct?", "options": ["4C₂₂H₄₆ + 134O₂ → 88CO₂ + 92H₂O, doubling every coefficient to balance it", "C₂₂H₄₆ + 45O₂ → 22CO₂ + 23H₂O, halving the water to fix the hydrogen count", "2C₂₂H₄₆ + 67O₂ → 44CO₂ + 46H₂O, giving 44 C, 92 H and 134 O per side", "C₂₂H₄₆ + 34O₂ → 22CO₂ + 46H₂O, lowering the oxygen to match the products"], "answer": "C", "answer_text": "2C₂₂H₄₆ + 67O₂ → 44CO₂ + 46H₂O, giving 44 C, 92 H and 134 O per side", "exp": "Doubling the wax gives 92 H, which is exactly what 46H₂O needs, and then 44CO₂ + 46H₂O holds 134 O, supplied by 67O₂. Halving the water to 23H₂O balances hydrogen but leaves 90 O entering and 67 O leaving, and 34O₂ supplies 68 O for products needing 90. The version with 4, 134, 88 and 92 does balance, but every coefficient divides by 2, so it is not in lowest whole numbers."}, {"id": 129, "level": "Advanced", "tag": "Combustion Reactions", "stem": "A practice sheet offers C₅H₁₀ + 15O₂ → 10CO₂ + 10H₂O as a balanced combustion equation for pentene. Which correction makes it balance in lowest whole numbers?", "options": ["C₅H₁₀ + 15O₂ → 5CO₂ + 5H₂O, halving the products to match one fuel unit", "2C₅H₁₀ + 15O₂ → 10CO₂ + 10H₂O, giving 10 C, 20 H and 30 O on each side", "C₅H₁₀ + 7O₂ → 5CO₂ + 5H₂O, lowering oxygen to fit that single fuel unit", "4C₅H₁₀ + 30O₂ → 20CO₂ + 20H₂O, doubling everything to clear the fractions"], "answer": "B", "answer_text": "2C₅H₁₀ + 15O₂ → 10CO₂ + 10H₂O, giving 10 C, 20 H and 30 O on each side", "exp": "One C₅H₁₀ unit supplies only 5 C and 10 H, half of the 10 C and 20 H the printed products need, so the fuel takes a coefficient of 2, and the 30 O on the right matches 15O₂ exactly. Cutting the products to 5CO₂ + 5H₂O leaves 30 O entering and 15 O leaving, and 7O₂ supplies 14 O for products holding 15. The 4, 30, 20, 20 set balances but divides by 2."}, {"id": 130, "level": "Advanced", "tag": "Combustion Reactions", "stem": "Paraffin, C₂₅H₅₂, burns completely in oxygen to carbon dioxide and water vapor. Which balanced equation is correct?", "options": ["C₂₅H₅₂ + 26O₂ → 25CO₂ + 26H₂O, since water and oxygen match one for one", "2C₂₅H₅₂ + 76O₂ → 50CO₂ + 52H₂O, since the coefficients have to be doubled", "C₂₅H₅₂ + 38O₂ → 25CO₂ + 26H₂O, with 25 C, 52 H and 76 O on each side", "C₂₅H₅₂ + 38O₂ → 25CO₂ + 52H₂O, since the fuel carries 52 hydrogen atoms"], "answer": "C", "answer_text": "C₂₅H₅₂ + 38O₂ → 25CO₂ + 26H₂O, with 25 C, 52 H and 76 O on each side", "exp": "The 25 carbons give 25CO₂ and the 52 hydrogens give 26H₂O, because each water holds two hydrogen atoms; those products need 50 + 26 = 76 O, so 38O₂ is required. Writing 52H₂O doubles the hydrogen to 104, and 26O₂ supplies only 52 of the 76 oxygen atoms needed. The doubled version balances but every coefficient divides by 2."}, {"id": 131, "level": "Advanced", "tag": "Combustion Reactions", "stem": "Octane, C₈H₁₈, burns completely in a truck engine. Which balanced equation is written in lowest whole numbers?", "options": ["4C₈H₁₈ + 50O₂ → 32CO₂ + 36H₂O, since every coefficient here must be even", "C₈H₁₈ + 12O₂ → 8CO₂ + 9H₂O, since the oxygen rounds to a whole number", "2C₈H₁₈ + 25O₂ → 16CO₂ + 18H₂O, giving 16 C, 36 H and 50 O on each side", "2C₈H₁₈ + 18O₂ → 16CO₂ + 18H₂O, matching the oxygen to the water produced"], "answer": "C", "answer_text": "2C₈H₁₈ + 25O₂ → 16CO₂ + 18H₂O, giving 16 C, 36 H and 50 O on each side", "exp": "One octane unit needs 12.5 O₂, so the whole equation is doubled: 2C₈H₁₈ + 25O₂ → 16CO₂ + 18H₂O, with 50 O on each side. Rounding to 12O₂ supplies 24 O for products holding 25, and 18O₂ supplies only 36 of the 50 needed. The 4, 50, 32, 36 version balances but every coefficient divides by 2, so it is not lowest terms."}, {"id": 132, "level": "Advanced", "tag": "Combustion Reactions", "stem": "Ethanol, C₂H₆O, burns completely. Unlike a hydrocarbon, the fuel itself brings one oxygen atom into the count. Which balanced equation is correct?", "options": ["C₂H₆O + 4O₂ → 2CO₂ + 3H₂O, since only the O₂ molecules are counted here", "C₂H₆O + 3O₂ → 2CO₂ + 6H₂O, since the fuel carries six hydrogen atoms in", "C₂H₆O + 3O₂ → 2CO₂ + 3H₂O, since the fuel supplies one of the 7 oxygens", "2C₂H₆O + 6O₂ → 4CO₂ + 6H₂O, since the coefficients here should be doubled"], "answer": "C", "answer_text": "C₂H₆O + 3O₂ → 2CO₂ + 3H₂O, since the fuel supplies one of the 7 oxygens", "exp": "The products 2CO₂ + 3H₂O hold 4 + 3 = 7 oxygen atoms, and the fuel already brings 1, so only 6 more are needed and the coefficient is 3O₂. Using 4O₂ ignores the fuel’s own oxygen and sends in 9 atoms for 7, and 6H₂O would need 12 hydrogen atoms when the fuel supplies 6. The doubled version balances but divides by 2, so it is not in lowest whole numbers."}, {"id": 133, "level": "Advanced", "tag": "Identifying Reaction Types", "stem": "Iron (III) hydroxide, Fe(OH)₃, breaks down when heated into iron (III) oxide, Fe₂O₃, and water. Which line gives the balanced equation and the correct type?", "options": ["2Fe(OH)₃ → Fe₂O₃ + 3H₂O, double replacement into two products", "Fe(OH)₃ → Fe₂O₃ + H₂O, decomposition needing no coefficient here", "2Fe(OH)₃ → Fe₂O₃ + 3H₂O, decomposition from a single reactant", "Fe₂O₃ + 3H₂O → 2Fe(OH)₃, synthesis of the hydroxide from two parts"], "answer": "C", "answer_text": "2Fe(OH)₃ → Fe₂O₃ + 3H₂O, decomposition from a single reactant", "exp": "Two Fe(OH)₃ units supply 2 Fe, 6 O and 6 H, which is exactly what Fe₂O₃ + 3H₂O holds, so 2Fe(OH)₃ → Fe₂O₃ + 3H₂O balances. One reactant breaking apart is decomposition no matter how many products appear; double replacement requires two compounds trading partners. Without the coefficient there is 1 Fe entering and 2 leaving, and reversing the arrow describes the opposite change."}, {"id": 134, "level": "Advanced", "tag": "Identifying Reaction Types", "stem": "Each choice below pairs a balanced equation with a reaction type. Which pairing is correct?", "options": ["2H₂O₂ → 2H₂O + O₂, synthesis from one reactant", "Zn + 2HCl → ZnCl₂ + H₂, single replacement", "3Mg + N₂ → Mg₃N₂, decomposition into two parts", "CaCl₂ + Na₂CO₃ → CaCO₃ + 2NaCl, combustion"], "answer": "B", "answer_text": "Zn + 2HCl → ZnCl₂ + H₂, single replacement", "exp": "In Zn + 2HCl → ZnCl₂ + H₂ a free element replaces the hydrogen in a compound, which is the definition of single replacement. 2H₂O₂ → 2H₂O + O₂ is a decomposition, since one compound breaks into two, while 3Mg + N₂ → Mg₃N₂ is the reverse pattern and is a synthesis. CaCl₂ + Na₂CO₃ → CaCO₃ + 2NaCl is two compounds trading partners, a double replacement; a combustion burns a fuel in O₂ to give CO₂ and H₂O."}, {"id": 135, "level": "Advanced", "tag": "Identifying Reaction Types", "stem": "A study guide labels 2Al(s) + 3CuSO₄(aq) → Al₂(SO₄)₃(aq) + 3Cu(s) a double replacement “because two compounds are shown.” How should this reaction be classified?", "options": ["Synthesis, since the aluminum and the sulfate combine into one product", "Decomposition, since the copper (II) sulfate breaks apart during the change", "Single replacement, since one free element takes the place of another", "Double replacement, since the sulfate group changes partners as written"], "answer": "C", "answer_text": "Single replacement, since one free element takes the place of another", "exp": "Only one compound appears among the reactants; aluminum enters as a free element and pushes copper out, which is the single replacement pattern of A + BC → B + AC. A double replacement needs two compounds trading partners, so counting compounds across the whole equation is the trap here. A synthesis would end with one product, and a decomposition would begin with one reactant."}, {"id": 136, "level": "Intermediate", "tag": "Case File: The Secret Recipe", "stem": "An inspector's evidence log at the NovaTaste Industries plant records the spilled leavening acid as 3Ca(H₂PO₄)₂ (calcium dihydrogen phosphate). Counting the coefficient, how many oxygen atoms does 3Ca(H₂PO₄)₂ represent?", "options": ["8 oxygen atoms", "9 oxygen atoms", "24 oxygen atoms", "4 oxygen atoms"], "answer": "C", "answer_text": "24 oxygen atoms", "exp": "The subscript 2 outside the parentheses multiplies the 4 oxygens in each dihydrogen phosphate group, and the coefficient 3 then multiplies the whole formula unit: 3 × 2 × 4 = 24 oxygen atoms. Answering 8 oxygen atoms counts one formula unit and ignores the coefficient, 4 counts a single phosphate group, and 9 comes from adding the 3, the 2 and the 4 rather than multiplying them."}, {"id": 137, "level": "Intermediate", "tag": "Case File: The Secret Recipe", "stem": "Heat from a jammed conveyor motor bakes a pile of baking soda (sodium bicarbonate, NaHCO₃) on Line 1. The solid breaks down into sodium carbonate (Na₂CO₃), water, and carbon dioxide gas. Which equation for this decomposition is balanced?", "options": ["3NaHCO₃ → Na₂CO₃ + 3H₂O + 2CO₂", "2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "2NaHCO₃ → 2Na₂CO₃ + H₂O + CO₂"], "answer": "B", "answer_text": "2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", "exp": "Two units of NaHCO₃ supply the 2 Na, 2 H, 2 C and 6 O that the products need: 2NaHCO₃ → Na₂CO₃ + H₂O + CO₂ counts 2 Na, 2 H, 2 C and 6 O on each side. Writing NaHCO₃ → Na₂CO₃ + H₂O + CO₂ leaves 1 Na facing 2 Na, 2Na₂CO₃ puts 4 Na on the right, and 3NaHCO₃ → Na₂CO₃ + 3H₂O + 2CO₂ leaves 3 Na facing 2 Na."}, {"id": 138, "level": "Intermediate", "tag": "Case File: The Secret Recipe", "stem": "During the sabotage a drum of bleach (sodium hypochlorite, NaOCl) is dumped into an open tank of vinegar (acetic acid, CH₃COOH) on Line 2. Workers on the catwalk above smell a sharp, choking odor like an over-treated swimming pool. Which toxic gas is the most likely product?", "options": ["Chlorine, Cl₂, released when hypochlorite meets an acid", "Hydrogen sulfide, H₂S, released when vinegar meets chloride", "Ammonia, NH₃, released when an acid meets a carbonate", "Carbon monoxide, CO, released when acid meets hypochlorite"], "answer": "A", "answer_text": "Chlorine, Cl₂, released when hypochlorite meets an acid", "exp": "Bleach mixed with any acid drives the hypochlorite to release chlorine gas, Cl₂, which is exactly why “never mix bleach with vinegar” is a standard kitchen warning, and the pool-like odor matches chlorine. Ammonia, NH₃, needs nitrogen and hydrogen sulfide, H₂S, needs sulfur, and neither element appears in NaOCl or CH₃COOH; carbon monoxide, CO, comes from burning fuel with too little oxygen, not from pouring two liquids together."}, {"id": 139, "level": "Intermediate", "tag": "Case File: The Secret Recipe", "stem": "In a sealed mixing vessel at NovaTaste, 84.0 g of baking soda (NaHCO₃) reacts completely with 60.0 g of vinegar (acetic acid, CH₃COOH). The vessel is opened and found to hold 82.0 g of sodium acetate and 18.0 g of water, plus carbon dioxide gas. Because mass is conserved, what mass of carbon dioxide formed?", "options": ["24.0 g", "44.0 g", "100.0 g", "144.0 g"], "answer": "B", "answer_text": "44.0 g", "exp": "The law of conservation of mass says the 84.0 g + 60.0 g = 144.0 g that went in must all come back out, so the gas accounts for 144.0 g − 82.0 g − 18.0 g = 44.0 g. The value 144.0 g is the total starting mass rather than the gas alone, 100.0 g is only the solid and liquid already weighed, and 24.0 g comes from subtracting the two reactant masses instead of using the products."}, {"id": 140, "level": "Intermediate", "tag": "Case File: The Secret Recipe", "stem": "A fire under the calcium supplement hopper heats calcium carbonate, CaCO₃, until it breaks apart into calcium oxide, CaO, and carbon dioxide gas: CaCO₃(s) → CaO(s) + CO₂(g). Which type of reaction is this?", "options": ["Synthesis, because two substances join into one larger product", "Decomposition, because one compound breaks into two products", "Double replacement, because two compounds trade their partners", "Single replacement, because one element takes another's place"], "answer": "B", "answer_text": "Decomposition, because one compound breaks into two products", "exp": "One reactant becoming two products is the pattern of a decomposition reaction, and note that the gas released is carbon dioxide, CO₂: heated limestone gives CaO + CO₂ and never carbon monoxide. Synthesis is the reverse pattern of two substances joining into one, while single replacement and double replacement both require two reactants trading partners, and only one reactant is written here."}, {"id": 141, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "Food-grade phosphoric acid, H₃PO₄, leaks from a cracked line onto the calcium supplement (calcium carbonate, CaCO₃), producing calcium phosphate, Ca₃(PO₄)₂, water, and carbon dioxide gas. Which balanced equation represents the spill?", "options": ["3CaCO₃ + 2H₃PO₄ → Ca₃(PO₄)₂ + 2H₂O + 3CO₂", "3CaCO₃ + 2H₃PO₄ → Ca₃(PO₄)₂ + 3H₂O + 3CO₂", "CaCO₃ + H₃PO₄ → Ca₃(PO₄)₂ + H₂O + CO₂", "2CaCO₃ + 3H₃PO₄ → Ca₃(PO₄)₂ + 3H₂O + 2CO₂"], "answer": "B", "answer_text": "3CaCO₃ + 2H₃PO₄ → Ca₃(PO₄)₂ + 3H₂O + 3CO₂", "exp": "Calcium phosphate needs 3 Ca and 2 PO₄, so 3 CaCO₃ and 2 H₃PO₄ react, and the 6 H from the acid make 3 H₂O while the 3 carbonates make 3 CO₂: each side has 3 Ca, 3 C, 2 P, 6 H and 17 O. Using 2H₂O leaves 6 H facing 4 H, the one-to-one version leaves 1 Ca facing 3 Ca, and 2CaCO₃ + 3H₃PO₄ reverses the ratio the formula Ca₃(PO₄)₂ demands."}, {"id": 142, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "Detectors in the NovaTaste boiler room register carbon monoxide, CO. The plant's burners run on methane, CH₄, and a hopper of limestone (calcium carbonate, CaCO₃) sitting nearby is also hot. Which equation accounts for the carbon monoxide?", "options": ["2CH₄ + 3O₂ → 2CO + 4H₂O, methane burning with too little oxygen", "CH₄ + 2O₂ → CO₂ + 2H₂O, methane burning with plenty of oxygen", "CaCO₃ → CaO + CO, limestone breaking down in the hopper heat", "CO₂ → CO + O, carbon dioxide dropping one oxygen atom in the heat"], "answer": "A", "answer_text": "2CH₄ + 3O₂ → 2CO + 4H₂O, methane burning with too little oxygen", "exp": "Carbon monoxide is the signature of incomplete combustion, when a fuel burns without enough oxygen: 2CH₄ + 3O₂ → 2CO + 4H₂O balances with 2 C, 8 H and 6 O on each side. Burning methane with plenty of oxygen gives CO₂ instead, heating limestone gives CaO + CO₂ and never CO, and carbon dioxide does not simply shed a lone oxygen atom, which would leave a stray O with nothing to bond to."}, {"id": 143, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "A trainee writes the reaction of the calcium supplement (calcium carbonate, CaCO₃) with vinegar (acetic acid, CH₃COOH) as 2CaCO₃ + 4CH₃COOH → 2Ca(CH₃COO)₂ + 2H₂O + 2CO₂. The atoms do balance, but the equation is still not written correctly. What is the correct form?", "options": ["CaCO₃ + 2CH₃COOH → Ca(CH₃COO)₂ + H₂O + CO₂", "CaCO₃ + CH₃COOH → Ca(CH₃COO)₂ + H₂O + CO₂", "CaCO₃ + 4CH₃COOH → Ca(CH₃COO)₂ + 2H₂O + 2CO₂", "2CaCO₃ + 2CH₃COOH → 2Ca(CH₃COO)₂ + H₂O + CO₂"], "answer": "A", "answer_text": "CaCO₃ + 2CH₃COOH → Ca(CH₃COO)₂ + H₂O + CO₂", "exp": "Every coefficient in the trainee's version shares a factor of 2, and a balanced equation must be written in the lowest whole-number ratio, so dividing through gives CaCO₃ + 2CH₃COOH → Ca(CH₃COO)₂ + H₂O + CO₂ with 1 Ca, 5 C, 8 H and 7 O on each side. Cutting the acid to CH₃COOH leaves 4 H facing 8 H, halving only part of the equation as in 2CaCO₃ + 2CH₃COOH leaves the hydrogen short, and CaCO₃ + 4CH₃COOH doubles the acid without doubling the calcium."}, {"id": 144, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "NovaTaste's freezer system is cooled with ammonia, NH₃. Ammonia vapor from a cut line drifts into a room where a large excess of bleach (sodium hypochlorite, NaOCl) was spilled. With bleach in excess the ammonia is oxidized all the way to nitrogen gas, N₂, and the other products are sodium chloride, NaCl, and water. Which equation for this is balanced?", "options": ["NaOCl + NH₃ → N₂ + NaCl + H₂O", "6NaOCl + 4NH₃ → 2N₂ + 6NaCl + 6H₂O", "3NaOCl + 2NH₃ → N₂ + 3NaCl + 3H₂O", "3NaOCl + 2NH₃ → 2N₂ + 3NaCl + 3H₂O"], "answer": "C", "answer_text": "3NaOCl + 2NH₃ → N₂ + 3NaCl + 3H₂O", "exp": "Two NH₃ supply the 2 N that one N₂ needs and 6 H that must all leave as water, so 3 H₂O are required, and those 3 waters plus 3 NaCl take exactly the 3 Na, 3 O and 3 Cl in 3 NaOCl: 3NaOCl + 2NH₃ → N₂ + 3NaCl + 3H₂O counts 3 Na, 3 O, 3 Cl, 2 N and 6 H on each side. Writing the equation one-to-one leaves 1 N facing 2 N and 3 H facing 2 H, using 2N₂ demands 4 N from only 2, and 6NaOCl + 4NH₃ → 2N₂ + 6NaCl + 6H₂O does balance but every coefficient divides by 2, so it is not in lowest whole numbers."}, {"id": 145, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "A brown haze over the NovaTaste plant is nitrogen dioxide, NO₂. Ammonia, NH₃, leaking from the freezer system is oxidized in air, and the nitrogen ends up as NO₂ while the hydrogen ends up as water. The change runs through more than one step, but the overall conversion can be summed up in a single equation. Which balanced equation gives that overall conversion?", "options": ["4NH₃ + 7O₂ → 4NO₂ + 6H₂O", "2NH₃ + 3O₂ → 2NO₂ + 3H₂O", "4NH₃ + 5O₂ → 4NO₂ + 6H₂O", "NH₃ + 2O₂ → NO₂ + 3H₂O"], "answer": "A", "answer_text": "4NH₃ + 7O₂ → 4NO₂ + 6H₂O", "exp": "Taking 4 NH₃ gives 4 N and 12 H, which fix the products at 4 NO₂ and 6 H₂O; those products hold 8 + 6 = 14 O, so 7 O₂ is required. The 5O₂ version supplies only 10 O for the 14 O needed, 2NH₃ + 3O₂ → 2NO₂ + 3H₂O gives 6 O against 7 O, and NH₃ + 2O₂ → NO₂ + 3H₂O puts 6 H on the right from only 3 H on the left."}, {"id": 146, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "Iron fortification powder at the plant is iron (II) sulfate, FeSO₄. In the plant lab a clean strip of solid iron is lowered into blue copper (II) sulfate solution, CuSO₄(aq). Iron sits ABOVE copper on the activity series. What happens, and which equation shows it?", "options": ["Fe + CuSO₄ → Fe₂(SO₄)₃ + Cu; iron replaces copper, forming iron sulfate", "No reaction occurs, since copper sits above iron on the activity series", "Fe + CuSO₄ → FeSO₄ + Cu; iron replaces copper, forming iron (II) sulfate", "Cu + FeSO₄ → CuSO₄ + Fe; copper replaces iron, forming copper (II) sulfate"], "answer": "C", "answer_text": "Fe + CuSO₄ → FeSO₄ + Cu; iron replaces copper, forming iron (II) sulfate", "exp": "A metal higher on the activity series replaces one below it, so iron takes copper's place: Fe + CuSO₄ → FeSO₄ + Cu, with the blue color fading as red-brown copper coats the strip. The product must be iron (II) sulfate because sulfate is 2− and one Fe²⁺ balances it, so Fe₂(SO₄)₃ would need iron (III) and does not balance here; copper replacing iron reverses the activity series, and “no reaction” would apply only if iron sat below copper."}, {"id": 147, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "A copper pipe fitting drops into a vat of iron (II) sulfate solution, FeSO₄(aq), on Line 4 and is left there overnight. Copper sits BELOW iron on the activity series. What should the investigator record in the evidence log?", "options": ["Fe + CuSO₄ → FeSO₄ + Cu; the iron in the vat plates onto the fitting", "2Cu + FeSO₄ → Cu₂SO₄ + Fe; copper below iron replaces it two at a time", "Cu + FeSO₄ → CuSO₄ + Fe; copper below iron still trades places with it", "No reaction; copper below iron cannot replace it from its compound"], "answer": "D", "answer_text": "No reaction; copper below iron cannot replace it from its compound", "exp": "A single replacement happens only when the free metal is more reactive than the metal already in the compound, and copper sits below iron, so nothing happens and the log should read “no reaction.” Both Cu + FeSO₄ → CuSO₄ + Fe and the two-at-a-time version run the activity series backwards, and Fe + CuSO₄ → FeSO₄ + Cu describes the opposite setup, free iron dropped into copper (II) sulfate, not a copper fitting sitting in iron (II) sulfate."}, {"id": 148, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "Iron fortification powder, iron (II) sulfate FeSO₄(aq), is spilled into a wash tank of sodium carbonate solution, Na₂CO₃(aq). Use these rules: all sodium compounds are soluble, and carbonates are insoluble except with Group 1 metals and ammonium. Which equation shows the result?", "options": ["FeSO₄(aq) + Na₂CO₃(aq) → no reaction; both products stay dissolved", "FeSO₄(aq) + Na₂CO₃(aq) → Fe₂CO₃(s) + NaSO₄(aq)", "FeSO₄(aq) + Na₂CO₃(aq) → Na₂SO₄(s) + FeCO₃(aq)", "FeSO₄(aq) + Na₂CO₃(aq) → FeCO₃(s) + Na₂SO₄(aq)"], "answer": "D", "answer_text": "FeSO₄(aq) + Na₂CO₃(aq) → FeCO₃(s) + Na₂SO₄(aq)", "exp": "In a double replacement the partners trade, giving iron (II) carbonate and sodium sulfate, and since carbonates are insoluble except with Group 1 metals, FeCO₃ drops out as a solid while Na₂SO₄ stays in solution. Labeling Na₂SO₄ as the solid reverses the solubility rules, “no reaction” ignores the insoluble carbonate, and Fe₂CO₃ with NaSO₄ ignores the charges: Fe²⁺ pairs one-to-one with CO₃²⁻ and two Na⁺ are needed for one SO₄²⁻."}, {"id": 149, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "The inspector needs this word equation written as a formula equation: solid sodium bicarbonate (baking soda, NaHCO₃) reacts with food-grade phosphoric acid (H₃PO₄) to make sodium phosphate (Na₃PO₄), water, and carbon dioxide gas. Which balanced equation matches the words?", "options": ["NaHCO₃ + H₃PO₄ → Na₃PO₄ + H₂O + CO₂", "3NaHCO₃ + 3H₃PO₄ → Na₃PO₄ + 3H₂O + 3CO₂", "3NaHCO₃ + 3H₃PO₄ → 3Na₃PO₄ + 3H₂O + 3CO₂", "3NaHCO₃ + H₃PO₄ → Na₃PO₄ + 3H₂O + 3CO₂"], "answer": "D", "answer_text": "3NaHCO₃ + H₃PO₄ → Na₃PO₄ + 3H₂O + 3CO₂", "exp": "Sodium phosphate needs 3 Na, so 3 NaHCO₃ react with 1 H₃PO₄, and the 3 H from the acid plus the 3 H from the bicarbonate make 3 H₂O while the 3 carbonates leave as 3 CO₂: each side has 3 Na, 3 C, 6 H, 1 P and 13 O. The one-to-one version leaves 1 Na facing 3 Na, using 3H₃PO₄ puts 3 P on the left against 1 P on the right, and 3Na₃PO₄ demands 9 Na from only 3."}, {"id": 150, "level": "Advanced", "tag": "Case File: The Secret Recipe", "stem": "On an open balance a beaker holds 60.0 g of vinegar (acetic acid, CH₃COOH). A technician tips in 4.20 g of baking soda (sodium bicarbonate, NaHCO₃), and the mixture fizzes hard until the reaction CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂ is complete. When the fizzing stops the balance reads 62.00 g. Which statement accounts for that reading?", "options": ["The reaction destroyed 2.20 g of matter, so mass is not conserved in an open beaker", "2.20 g of water evaporated, because water is the only product that can leave the beaker", "2.20 g of carbon dioxide gas bubbled out of the open beaker, so the mass is still all accounted for", "The balance must be misreading, because the mass after a reaction always equals the mass before"], "answer": "C", "answer_text": "2.20 g of carbon dioxide gas bubbled out of the open beaker, so the mass is still all accounted for", "exp": "The beaker started with 60.0 g + 4.20 g = 64.20 g of material and reads 62.00 g at the end, a difference of 2.20 g. The equation lists carbon dioxide among the products, and in an open beaker that gas escapes into the room and carries its 2.20 g with it, so every atom is still accounted for and mass is conserved. Matter is never destroyed in a chemical reaction; the water stays behind in the solution rather than evaporating away during the fizzing; and the reading before and after match only when the container is sealed, which is exactly why the beaker being open matters here."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let tag = '', setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
$('#tagsel').innerHTML = '<option value="">All skills</option>' +
  tags.map(t=>`<option value="${t}">${t} (${BANK.filter(q=>q.tag===t).length})</option>`).join('');

function pool(){
  return BANK.filter(q => levels.has(q.level) && (!tag || q.tag===tag));
}
function refresh(){
  const n = pool().length;
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
$('#tagsel').onchange = e => { tag = e.target.value; refresh(); };
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  const n = pos + (answered?1:0);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
