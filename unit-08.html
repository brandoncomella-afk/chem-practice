", "options": ["80.87%", "80.9%", "81%", "124%"], "answer": "B", "answer_text": "80.9%", "exp": "Percent yield = 6.85 g / 8.47 g × 100% = 80.8737%, and both masses carry three digits while the 100% is exact, so the answer is 80.9%. Reporting 81% keeps only two digits, 80.87% claims four, and 124% comes from dividing 8.47 g by 6.85 g, which puts the theoretical yield on top."}, {"id": 99, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "The Sack of Silver has a theoretical yield of 42.4 g of Ag, but the silver you can scrape off the wire weighs 38.6 g. Percent yield = actual / theoretical × 100%. What is the percent yield?", "options": ["110%", "91.04%", "91.0%", "91%"], "answer": "C", "answer_text": "91.0%", "exp": "Percent yield = 38.6 g / 42.4 g × 100% = 91.0377%, and three digits in each mass gives 91.0%, with the trailing zero shown because that digit is known. Writing 91% displays only two digits, 91.04% displays four, and 110% comes from putting the theoretical yield on top of the fraction instead of the actual yield."}, {"id": 100, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "The Alchemist says a well-run copper recovery gives a percent yield of 87.5%. If the theoretical yield of copper is 19.1 g, what actual mass of copper should the apprentice expect to collect?", "options": ["21.8 g of Cu", "17 g of Cu", "16.7 g of Cu", "16.71 g of Cu"], "answer": "C", "answer_text": "16.7 g of Cu", "exp": "Rearranging actual / theoretical × 100% = 87.5% gives actual = 19.1 g × 0.875 = 16.7125 g, and both 19.1 g and 87.5% carry three digits, so the expected mass is 16.7 g. Reporting 16.71 g claims a fourth digit, 17 g reports only two, and 21.8 g comes from dividing by 0.875 when a yield below 100% has to make the actual mass smaller than the theoretical one."}, {"id": 101, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "You collect 12.4 g of gold from a run that the Alchemist says is 78.0% efficient. Percent yield = actual / theoretical × 100%. What was the theoretical yield of gold for this run?", "options": ["15.90 g of Au", "9.67 g of Au", "16 g of Au", "15.9 g of Au"], "answer": "D", "answer_text": "15.9 g of Au", "exp": "Rearranging gives theoretical = actual / percent yield = 12.4 g / 0.780 = 15.8974 g, and three digits in both 12.4 g and 78.0% makes the answer 15.9 g. The value 15.90 g claims four digits, 16 g reports only two, and 9.67 g comes from multiplying by 0.780 instead of dividing, which would make the theoretical yield smaller than the gold already in hand."}, {"id": 102, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "You react 6.36 g of Na₂CO₃ with excess CaCl₂: Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2NaCl(aq). Molar masses: Na₂CO₃ 106.0 g/mol, CaCO₃ 100.1 g/mol. You filter and dry the chalk and it weighs 5.55 g. Percent yield = actual / theoretical × 100%. What is the percent yield?", "options": ["92.3%", "92.4%", "108%", "92%"], "answer": "B", "answer_text": "92.4%", "exp": "The theoretical yield is 6.36 g Na₂CO₃ × (1 mol Na₂CO₃ / 106.0 g Na₂CO₃) × (1 mol CaCO₃ / 1 mol Na₂CO₃) × (100.1 g CaCO₃ / 1 mol CaCO₃) = 6.006 g CaCO₃, and this number is carried into the next step unrounded: 5.55 g / 6.006 g × 100% = 92.4076%, or 92.4% at three digits. The trap is 92.3%, which appears only if the theoretical yield is first rounded to 6.01 g; 92% reports only two digits, and 108% flips the fraction upside down."}, {"id": 103, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "The apprentice weighs 9.12 g of product from a reaction whose theoretical yield is 8.75 g. Percent yield = actual / theoretical × 100%. What is the percent yield, and what does the Alchemist conclude?", "options": ["95.9%, so some of the product was lost", "104%, so the product was not fully dried", "104.2%, so the product was still a bit damp", "1.04%, so almost nothing at all was made"], "answer": "B", "answer_text": "104%, so the product was not fully dried", "exp": "Percent yield = 9.12 g / 8.75 g × 100% = 104.2286%, and three digits in each mass gives 104%, a value above 100% that usually means the product was still wet or the filter paper was weighed with it. Reporting 104.2% claims a fourth digit, 95.9% comes from dividing 8.75 g by 9.12 g, and 1.04% forgets to multiply the decimal fraction by 100%."}, {"id": 104, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "The escape balloon reaction has a theoretical yield of 0.812 g of H₂, but the gas actually captured weighs 0.755 g. Percent yield = actual / theoretical × 100%. What is the percent yield?", "options": ["108%", "93%", "92.98%", "93.0%"], "answer": "D", "answer_text": "93.0%", "exp": "Percent yield = 0.755 g / 0.812 g × 100% = 92.9803%, and three digits in both masses gives 93.0%, where the trailing zero is a known digit and must be shown. Writing 93% displays only two digits, 92.98% displays four, and 108% comes from dividing the theoretical yield by the actual yield."}, {"id": 105, "level": "Intermediate", "tag": "Molar Volume and Gas Stoichiometry", "stem": "The escape balloon must hold 75,125 L of hydrogen gas, measured at 0 °C and 1 atm, where the molar volume is 22.4 L/mol. How many moles of H₂ does the balloon need?", "options": ["3.35 × 10³ mol of H₂", "3354 mol of H₂", "3.4 × 10³ mol of H₂", "1.68 × 10⁶ mol of H₂"], "answer": "A", "answer_text": "3.35 × 10³ mol of H₂", "exp": "Set the molar volume up so liters cancel: 75,125 L × (1 mol / 22.4 L) = 3353.79 mol, and the 22.4 L/mol has only three digits, the fewest in the calculation, so the answer is 3.35 × 10³ mol. Reporting 3354 mol copies four digits off the calculator, 3.4 × 10³ mol keeps only two, and 1.68 × 10⁶ mol comes from multiplying by 22.4 L/mol instead of dividing."}, {"id": 106, "level": "Intermediate", "tag": "Molar Volume and Gas Stoichiometry", "stem": "The prototype balloon fills with 0.250 mol of CO₂ at 0 °C and 1 atm, where the molar volume is 22.4 L/mol. What volume of gas is that?", "options": ["0.0112 L of CO₂", "5.60 L of CO₂", "89.6 L of CO₂", "5.6 L of CO₂"], "answer": "B", "answer_text": "5.60 L of CO₂", "exp": "0.250 mol CO₂ × (22.4 L / 1 mol) = 5.60 L, and both 0.250 mol and 22.4 L/mol carry three digits, so the trailing zero in 5.60 L is a digit you are entitled to write. Reporting 5.6 L shows only two digits, 89.6 L comes from dividing 22.4 by 0.250, and 0.0112 L comes from dividing the moles by the molar volume."}, {"id": 107, "level": "Intermediate", "tag": "Molar Volume and Gas Stoichiometry", "stem": "You escape by filling the balloon with hydrogen from Fe + 2HCl → FeCl₂ + H₂. The molar mass of Fe is 55.85 g/mol and the molar volume is 22.4 L/mol at 0 °C and 1 atm. What volume of H₂ does 22.5 g of Fe produce with excess HCl?", "options": ["9.0 L of H₂", "18.0 L of H₂", "9.024 L of H₂", "9.02 L of H₂"], "answer": "D", "answer_text": "9.02 L of H₂", "exp": "Run grams → moles → moles → liters without rounding in between: 22.5 g Fe × (1 mol Fe / 55.85 g Fe) = 0.402865 mol Fe, × (1 mol H₂ / 1 mol Fe) = 0.402865 mol H₂, × (22.4 L / 1 mol) = 9.0242 L, or 9.02 L at three digits. The value 9.024 L claims four digits, 9.0 L reports only two, and 18.0 L uses the HCl coefficient of 2 as though two moles of H₂ came from each mole of Fe."}, {"id": 108, "level": "Intermediate", "tag": "Molar Volume and Gas Stoichiometry", "stem": "The workshop lamp burns methane: CH₄ + 2O₂ → CO₂ + 2H₂O. A cylinder delivers 4.48 L of CH₄ measured at 0 °C and 1 atm, where the molar volume is 22.4 L/mol. What volume of O₂, measured at the same conditions, burns it completely?", "options": ["2.24 L of O₂", "8.960 L of O₂", "8.96 L of O₂", "4.48 L of O₂"], "answer": "C", "answer_text": "8.96 L of O₂", "exp": "Go liters → moles → moles → liters: 4.48 L CH₄ × (1 mol / 22.4 L) = 0.200 mol CH₄, × (2 mol O₂ / 1 mol CH₄) = 0.400 mol O₂, × (22.4 L / 1 mol) = 8.96 L, which is three digits, matching the fewest in the data. Reporting 8.960 L claims a fourth digit, 4.48 L skips the ratio and assumes equal volumes, and 2.24 L divides by 2 when the recipe calls for multiplying by 2."}, {"id": 109, "level": "Advanced", "tag": "Reading a Balanced Equation", "stem": "A study guide prints the chalk reaction as “Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(aq) + 2NaCl(aq)” and reads it as “106.0 grams of sodium carbonate react with 111.0 grams of calcium chloride.” In the lab, the calcium carbonate is the white solid you scrape off the filter paper. Molar masses: Na₂CO₃ 106.0 g/mol, CaCl₂ 111.0 g/mol, CaCO₃ 100.1 g/mol. Which reading of this recipe is correct?", "options": ["One mole of Na₂CO₃ and one mole of CaCl₂ give one mole of CaCO₃, and every product stays dissolved in the beaker", "Two moles of Na₂CO₃ and two moles of CaCl₂ give one mole of CaCO₃, because the 2 in front of NaCl scales them", "One gram of Na₂CO₃ and one gram of CaCl₂ give one gram of CaCO₃, because the coefficients are counting out grams", "One mole of Na₂CO₃ and one mole of CaCl₂ give one mole of CaCO₃, and that CaCO₃ is the solid you filter"], "answer": "D", "answer_text": "One mole of Na₂CO₃ and one mole of CaCl₂ give one mole of CaCO₃, and that CaCO₃ is the solid you filter", "exp": "Coefficients count moles, not grams, so the understood 1s mean that 1 mol of Na₂CO₃ and 1 mol of CaCl₂ give 1 mol of CaCO₃ and 2 mol of NaCl, and the chalk you scrape off the filter paper shows CaCO₃ is a solid, written (s). Reading the coefficients as grams ignores that 1 mol of Na₂CO₃ is 106.0 g while 1 mol of CaCO₃ is 100.1 g, and the 2 in front of NaCl belongs to NaCl alone, so it cannot turn the reactants into 2 mol each."}, {"id": 110, "level": "Advanced", "tag": "Mole Ratios from Coefficients", "stem": "A study guide lists the reaction of iron with copper (II) chloride as “Fe + CuCl₂ → FeCl₃ + Cu” and states that the recipe is 1 mol of Fe for every 1 mol of Cu. Balance the equation in lowest whole numbers and give the correct ratio.", "options": ["Fe + CuCl₂ → FeCl₃ + Cu, so the recipe is 1 mol Fe for every 1 mol Cu", "4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu, so the recipe is 4 mol Fe for every 6 mol Cu", "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu, so the recipe is 2 mol Fe for every 3 mol Cu", "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu, so the recipe is 3 mol Fe for every 2 mol Cu"], "answer": "C", "answer_text": "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu, so the recipe is 2 mol Fe for every 3 mol Cu", "exp": "As printed the equation has 2 Cl on the left and 3 Cl on the right, so it is not balanced; 2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu gives Fe 2 = 2, Cu 3 = 3 and Cl 6 = 6, a recipe of 2 mol Fe to 3 mol Cu. Reading 3 mol Fe to 2 mol Cu turns the ratio upside down, and 4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu does balance but every coefficient is twice as large as it needs to be."}, {"id": 111, "level": "Advanced", "tag": "Mole Ratios from Coefficients", "stem": "A lesson handout says: “In 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s), 1 mole of aluminum gives 1 mole of Al₂(SO₄)₃ and 3 moles of copper.” If you really start with 1.00 mol of aluminum foil and copper (II) sulfate is in excess, what do the coefficients give?", "options": ["1.00 mol Al₂(SO₄)₃ and 3.00 mol Cu, because the coefficients hold for any amount of Al used", "2.00 mol Al₂(SO₄)₃ and 6.00 mol Cu, because 1.00 mol Al is doubled to reach the 2 mol Al shown", "0.500 mol Al₂(SO₄)₃ and 1.50 mol Cu, because 1.00 mol Al is half of the 2 mol Al in the recipe", "1.00 mol Al₂(SO₄)₃ and 1.50 mol Cu, because only the copper amount is scaled by the recipe"], "answer": "C", "answer_text": "0.500 mol Al₂(SO₄)₃ and 1.50 mol Cu, because 1.00 mol Al is half of the 2 mol Al in the recipe", "exp": "The recipe is written for 2 mol Al, so 1.00 mol Al is half a batch: half of 1 mol Al₂(SO₄)₃ is 0.500 mol and half of 3 mol Cu is 1.50 mol. Keeping 1.00 mol Al₂(SO₄)₃ and 3.00 mol Cu quietly uses 2 mol of aluminum you do not have, doubling to 2.00 mol and 6.00 mol scales the wrong way, and scaling copper alone breaks the conservation of mass the balanced equation guarantees."}, {"id": 112, "level": "Advanced", "tag": "Mole-to-Mole Conversions", "stem": "In the Alchemist’s shop you have 0.0240 mol of gold (III) chloride and plenty of magnesium for 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). How many moles of MgCl₂ can form?", "options": ["0.0360 mol MgCl₂, from 0.0240 mol × 3 mol MgCl₂ ÷ 2 mol AuCl₃", "0.0160 mol MgCl₂, from 0.0240 mol × 2 mol AuCl₃ ÷ 3 mol MgCl₂", "0.0720 mol MgCl₂, from 0.0240 mol × 3 mol MgCl₂ with no denominator", "0.0240 mol MgCl₂, because one AuCl₃ unit hands over one MgCl₂ unit"], "answer": "A", "answer_text": "0.0360 mol MgCl₂, from 0.0240 mol × 3 mol MgCl₂ ÷ 2 mol AuCl₃", "exp": "The coefficients give 3 mol MgCl₂ for every 2 mol AuCl₃, so 0.0240 mol AuCl₃ × 3 ÷ 2 = 0.0360 mol MgCl₂, kept to the three digits of 0.0240. Flipping the ratio gives 0.0160 mol, dropping the ratio entirely gives 0.0240 mol, and multiplying by 3 without dividing by 2 gives 0.0720 mol, which is a batch and a half too large."}, {"id": 113, "level": "Advanced", "tag": "Mole-to-Mole Conversions", "stem": "The prototype balloon runs on C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(ℓ). Your plan calls for 0.0750 mol of CO₂. How many moles of citric acid, C₆H₈O₇, does that take?", "options": ["0.0125 mol C₆H₈O₇, from 0.0750 mol ÷ 6, counting all six product units", "0.225 mol C₆H₈O₇, from 0.0750 mol × 3 mol CO₂ ÷ 1 mol acid", "0.0250 mol C₆H₈O₇, from 0.0750 mol × 1 mol acid ÷ 3 mol CO₂", "0.0750 mol C₆H₈O₇, treating acid and CO₂ as a one-to-one recipe"], "answer": "C", "answer_text": "0.0250 mol C₆H₈O₇, from 0.0750 mol × 1 mol acid ÷ 3 mol CO₂", "exp": "One mole of citric acid releases 3 mol of CO₂, so 0.0750 mol CO₂ × 1 ÷ 3 = 0.0250 mol of acid, kept to three digits. Multiplying by 3 instead of dividing gives 0.225 mol, ignoring the coefficients gives 0.0750 mol, and dividing by 6 counts the 3H₂O along with the 3CO₂, but only the CO₂ coefficient links to the acid here."}, {"id": 114, "level": "Advanced", "tag": "Mole-to-Mole Conversions", "stem": "A student’s worked solution for rusting reads: “0.480 mol Fe × (4 mol Fe ÷ 3 mol O₂) = 0.640 mol O₂,” for the equation 4Fe(s) + 3O₂(g) → 2Fe₂O₃(s). How many moles of O₂ actually react with 0.480 mol of Fe?", "options": ["0.640 mol O₂, from 0.480 mol × 4 mol Fe ÷ 3 mol O₂", "0.240 mol O₂, from 0.480 mol × 2 mol Fe₂O₃ ÷ 4 mol Fe", "0.480 mol O₂, because iron and oxygen react one to one", "0.360 mol O₂, from 0.480 mol × 3 mol O₂ ÷ 4 mol Fe"], "answer": "D", "answer_text": "0.360 mol O₂, from 0.480 mol × 3 mol O₂ ÷ 4 mol Fe", "exp": "The unit you are leaving, mol Fe, belongs on the bottom, so 0.480 mol Fe × 3 mol O₂ ÷ 4 mol Fe = 0.360 mol O₂ to three digits. The shown work puts mol Fe on top, which leaves 0.640 mol and units that do not cancel; 0.480 mol ignores the coefficients, and 0.240 mol is really the moles of Fe₂O₃ produced, not the oxygen consumed."}, {"id": 115, "level": "Advanced", "tag": "Mass and Moles", "stem": "A study guide’s chalk work reads: “8.0 g CaCO₃ × (1 mol CaCO₃ ÷ 100.1 g CaCO₃) = 0.079 mol CaCO₃.” Using molar mass CaCO₃ 100.1 g/mol, how many moles is 8.0 g of chalk?", "options": ["0.0799 mol CaCO₃, because the calculator display should be copied", "0.080 mol CaCO₃, because 8.0 ÷ 100.1 = 0.07992, which rounds up", "0.079 mol CaCO₃, because 0.07992 is cut off after the 7 and the 9", "801 mol CaCO₃, from 8.0 g × 100.1 g/mol instead of dividing"], "answer": "B", "answer_text": "0.080 mol CaCO₃, because 8.0 ÷ 100.1 = 0.07992, which rounds up", "exp": "8.0 g ÷ 100.1 g/mol = 0.07992 mol, and 8.0 g carries two digits, so the answer is 0.080 mol — the third digit is a 9, which rounds the 79 up to 80. Writing 0.079 mol chops the digits off instead of rounding and starts the whole chain about 1% low, 0.0799 mol claims three digits from two-digit data, and multiplying by the molar mass gives 801, which has units of g²/mol."}, {"id": 116, "level": "Advanced", "tag": "Mass and Moles", "stem": "For Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2NaCl(aq), a study guide finds the sodium carbonate needed for 8.0 g of chalk this way: “0.079 mol × 106.0 g/mol = 8.4 g Na₂CO₃.” Molar masses: CaCO₃ 100.1 g/mol, Na₂CO₃ 106.0 g/mol. What mass of Na₂CO₃ is really needed?", "options": ["8.4 g Na₂CO₃, from the chopped-off 0.079 mol, then × 106.0", "7.6 g Na₂CO₃, from 8.0 × 100.1 ÷ 106.0 in a single step", "8.5 g Na₂CO₃, from 8.0 ÷ 100.1 = 0.07992 mol, then × 106.0", "8.47 g Na₂CO₃, keeping three digits from two-digit data"], "answer": "C", "answer_text": "8.5 g Na₂CO₃, from 8.0 ÷ 100.1 = 0.07992 mol, then × 106.0", "exp": "The recipe is 1 mol Na₂CO₃ for 1 mol CaCO₃, so carry the unrounded 0.07992 mol across and round only at the end: 0.07992 mol × 106.0 g/mol = 8.47 g, which is 8.5 g to two digits. The 8.4 g comes from a mole count that was chopped to 0.079 before it was used, 8.47 g reports three digits from 8.0 g, and 7.6 g multiplies by the molar mass of the chalk instead of dividing by it."}, {"id": 117, "level": "Advanced", "tag": "Mass and Moles", "stem": "A worksheet prints “Fe + 2HCl → FeCl₂ + H₂, MM of FeCl₂ = 128.8 g/mol,” but the accepted molar mass of FeCl₂ is 126.75 g/mol. How many moles are in a 12.5 g sample of FeCl₂, and what does the printed value do?", "options": ["0.0986 mol, and the printed 128.8 g/mol changes nothing in the answer", "1.58 × 10³ mol, and 12.5 g × 126.75 g/mol is how a mole count is found", "0.0970 mol, and 128.8 g/mol is the value this sample was massed with", "0.0986 mol, and the printed 128.8 g/mol would give a low 0.0970 mol"], "answer": "D", "answer_text": "0.0986 mol, and the printed 128.8 g/mol would give a low 0.0970 mol", "exp": "12.5 g ÷ 126.75 g/mol = 0.098619 mol, or 0.0986 mol to the three digits of 12.5 g, while the printed 128.8 g/mol gives 12.5 ÷ 128.8 = 0.0970 mol, about 2% low and low again in every step that follows. A molar mass is a property of FeCl₂, not of the balance, so the printed value does matter, and 12.5 × 126.75 = 1.58 × 10³ multiplies where the mole count needs division."}, {"id": 118, "level": "Advanced", "tag": "Mass-to-Mass Stoichiometry", "stem": "You decompose copper (II) oxide in the Alchemist’s furnace: 4CuO(s) → 2Cu₂O(s) + O₂(g). You start with 45 g of CuO. Molar masses: CuO 79.55 g/mol, O₂ 32.00 g/mol. What mass of oxygen gas can you produce?", "options": ["4.5 g O₂, from 45 ÷ 79.55 = 0.5657 mol, ÷ 4, then × 32.00", "72 g O₂, from 0.5657 mol CuO × 4 mol O₂, then × 32.00", "4.53 g O₂, from the same chain but kept to three digits", "18 g O₂, from 0.5657 mol CuO carried one to one into oxygen"], "answer": "A", "answer_text": "4.5 g O₂, from 45 ÷ 79.55 = 0.5657 mol, ÷ 4, then × 32.00", "exp": "45 g ÷ 79.55 g/mol = 0.5657 mol CuO, and the recipe gives 1 mol O₂ for every 4 mol CuO, so 0.5657 ÷ 4 = 0.1414 mol O₂ and 0.1414 mol × 32.00 g/mol = 4.53 g, rounded at the end to 4.5 g for the two digits in 45 g. Skipping the ratio gives 18 g, multiplying by 4 instead of dividing gives 72 g, and 4.53 g reports one digit more than the data supports."}, {"id": 119, "level": "Advanced", "tag": "Mass-to-Mass Stoichiometry", "stem": "In the Aqua Verde tube the reaction is 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). A scrap of aluminum foil massing 0.20 g reacts completely with copper (II) sulfate in excess. Molar masses: Al 26.98 g/mol, Cu 63.55 g/mol. What mass of copper appears?", "options": ["0.31 g Cu, from 0.007413 mol Al × 2 ÷ 3, then × 63.55", "0.71 g Cu, from 0.007413 mol Al × 3 ÷ 2, then × 63.55", "0.7066 g Cu, from the same chain kept to four digits", "0.47 g Cu, from 0.007413 mol Al carried one to one into copper"], "answer": "B", "answer_text": "0.71 g Cu, from 0.007413 mol Al × 3 ÷ 2, then × 63.55", "exp": "0.20 g ÷ 26.98 g/mol = 0.007413 mol Al, and 3 mol Cu form for every 2 mol Al, so 0.007413 × 3 ÷ 2 = 0.011119 mol Cu and 0.011119 mol × 63.55 g/mol = 0.7066 g, reported as 0.71 g for the two digits in 0.20 g. Ignoring the ratio gives 0.47 g, inverting it gives 0.31 g, and 0.7066 g claims four digits from a two-digit mass."}, {"id": 120, "level": "Advanced", "tag": "Mass-to-Mass Stoichiometry", "stem": "A worked solution for Fe(s) + AuCl₃(aq) → FeCl₃(aq) + Au(s) reads: “16 g Fe × (1 mol Fe ÷ 55.85 g Fe) = 0.29 mol Fe; 0.29 mol AuCl₃ × 303.3 g/mol = 86.9 g AuCl₃.” Molar masses: Fe 55.85 g/mol, AuCl₃ 303.3 g/mol. What mass of AuCl₃ is needed, and what is wrong with the work?", "options": ["2.6 × 10² g AuCl₃; the recipe calls for 3 mol of AuCl₃ for each mol of Fe", "87 g AuCl₃; the 0.29 mol shown × 303.3 gives 88 g, not the 86.9 g printed", "88 g AuCl₃; a mole count rounded to 0.29 must be used in every later step", "86.9 g AuCl₃; two-digit data can still support a three-digit answer here"], "answer": "B", "answer_text": "87 g AuCl₃; the 0.29 mol shown × 303.3 gives 88 g, not the 86.9 g printed", "exp": "Carrying the unrounded value, 16 ÷ 55.85 = 0.28648 mol Fe, and the 1-to-1 recipe gives 0.28648 mol × 303.3 g/mol = 86.89 g, which is 87 g for the two digits in 16 g. The printed work cannot reproduce itself: 0.29 × 303.3 = 88 g, so 86.9 g was computed from digits the page never shows, and 2.6 × 10² g invents a 3-to-1 ratio the equation does not contain."}, {"id": 121, "level": "Advanced", "tag": "Mass-to-Mass Stoichiometry", "stem": "The chalk recipe is Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2NaCl(aq), and you want to make 8.0 g of CaCO₃. Molar masses: CaCO₃ 100.1 g/mol, CaCl₂ 111.0 g/mol. What mass of calcium chloride do you weigh out?", "options": ["8.9 g CaCl₂, from 8.0 ÷ 100.1 = 0.07992 mol, then × 111.0", "8.8 g CaCl₂, from a mole count chopped to 0.079, then × 111.0", "8.87 g CaCl₂, from the full chain kept to three digits", "7.2 g CaCl₂, from 8.0 × 100.1 ÷ 111.0 in a single step"], "answer": "A", "answer_text": "8.9 g CaCl₂, from 8.0 ÷ 100.1 = 0.07992 mol, then × 111.0", "exp": "8.0 g ÷ 100.1 g/mol = 0.07992 mol CaCO₃, the recipe is 1 mol CaCl₂ per 1 mol CaCO₃, and 0.07992 mol × 111.0 g/mol = 8.871 g, so you weigh 8.9 g. Rounding the mole count first gives 8.8 g, 8.87 g keeps three digits from a two-digit mass, and 7.2 g comes from multiplying by 100.1 instead of dividing."}, {"id": 122, "level": "Advanced", "tag": "Mass-to-Mass Stoichiometry", "stem": "Rust is eating the Alchemist’s tools: 4Fe(s) + 3O₂(g) → 2Fe₂O₃(s). One tool loses 12.4 g of iron to rust with oxygen in excess. Molar masses: Fe 55.85 g/mol, Fe₂O₃ 159.69 g/mol. What mass of Fe₂O₃ forms?", "options": ["70.9 g Fe₂O₃, from 0.2220 mol Fe × 4 ÷ 2, then × 159.69", "35.5 g Fe₂O₃, from 0.2220 mol Fe carried one to one into the oxide", "17.73 g Fe₂O₃, from the same chain kept to four digits", "17.7 g Fe₂O₃, from 0.2220 mol Fe × 2 ÷ 4, then × 159.69"], "answer": "D", "answer_text": "17.7 g Fe₂O₃, from 0.2220 mol Fe × 2 ÷ 4, then × 159.69", "exp": "12.4 g ÷ 55.85 g/mol = 0.2220 mol Fe, and 2 mol Fe₂O₃ form for every 4 mol Fe, so 0.2220 × 2 ÷ 4 = 0.1110 mol and 0.1110 mol × 159.69 g/mol = 17.7 g to three digits. Skipping the ratio gives 35.5 g, inverting it gives 70.9 g — more oxide than the tool could possibly hold from 12.4 g of iron — and 17.73 g claims a fourth digit."}, {"id": 123, "level": "Advanced", "tag": "Limiting Reactant", "stem": "You are ready to present the Philosopher’s Stone: Lemac gives you 20.0 g of lead and you have 31.2 g of gold (III) chloride for 2AuCl₃(aq) + 3Pb(s) → 3PbCl₂(s) + 2Au(s). Molar masses: Pb 207.2 g/mol, AuCl₃ 303.3 g/mol. Work the gold out from each reactant. Which one limits the reaction?", "options": ["AuCl₃, because 0.103 mol of it is more than the 0.0965 mol of lead", "AuCl₃, because 31.2 g is the larger of the two masses weighed out", "Lead, because it gives 0.0644 mol Au while AuCl₃ gives 0.103 mol", "AuCl₃, because its 0.103 mol Au is the larger of the two amounts"], "answer": "C", "answer_text": "Lead, because it gives 0.0644 mol Au while AuCl₃ gives 0.103 mol", "exp": "Lead gives 20.0 ÷ 207.2 = 0.09653 mol Pb × 2 mol Au ÷ 3 mol Pb = 0.0644 mol Au, while AuCl₃ gives 31.2 ÷ 303.3 = 0.1029 mol × 2 ÷ 2 = 0.103 mol Au; the smaller product amount wins, so lead runs out first. Choosing the larger 0.103 mol would make gold appear from lead that is not there, and neither the larger mass nor the larger mole count of a reactant decides the question — only the product each one can make."}, {"id": 124, "level": "Advanced", "tag": "Limiting Reactant", "stem": "A worked solution for 2AuCl₃(aq) + 3Pb(s) → 3PbCl₂(s) + 2Au(s) with 20.0 g of lead and 31.2 g of AuCl₃ reads: “The lead gives 0.0644 mol Au and the AuCl₃ gives 0.103 mol Au; take the larger, so 0.103 × 196.97 = 20.3 g Au.” Molar mass Au 196.97 g/mol. What mass of gold should you expect?", "options": ["33.0 g Au, from adding the two amounts before multiplying by 196.97", "20.3 g Au, using the larger amount, 0.103 mol × 196.97 g/mol", "12.7 g Au, using the smaller amount, 0.0644 mol × 196.97 g/mol", "16.5 g Au, from averaging the two amounts before multiplying by 196.97"], "answer": "C", "answer_text": "12.7 g Au, using the smaller amount, 0.0644 mol × 196.97 g/mol", "exp": "Each reactant is a ceiling, and a reaction stops when the first reactant runs out, so the smaller amount wins: 0.0644 mol × 196.97 g/mol = 12.7 g Au. The 20.3 g answer needs 0.103 mol of gold’s worth of lead, which 20.0 g of lead cannot supply; adding the amounts to 33.0 g or averaging them to 16.5 g treats two competing predictions as if they could be combined."}, {"id": 125, "level": "Advanced", "tag": "Limiting Reactant", "stem": "Lemac hands you a 7.0 g strip of magnesium and you scoop up 1.6 g of gold (III) chloride for 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). Molar masses: Mg 24.31 g/mol, AuCl₃ 303.3 g/mol. Comparing the MgCl₂ each reactant could make, which one limits the reaction?", "options": ["Magnesium, giving 0.29 mol MgCl₂, which is the larger of the two amounts", "Magnesium, because its 7.0 g is a much larger mass than the 1.6 g of AuCl₃", "Neither one; the 3-to-3 ratio makes both reactants run out at the same time", "Gold (III) chloride, giving 0.0079 mol MgCl₂ against 0.29 mol from the Mg"], "answer": "D", "answer_text": "Gold (III) chloride, giving 0.0079 mol MgCl₂ against 0.29 mol from the Mg", "exp": "Magnesium gives 7.0 ÷ 24.31 = 0.2879 mol × 3 mol MgCl₂ ÷ 3 mol Mg = 0.29 mol MgCl₂, while AuCl₃ gives 1.6 ÷ 303.3 = 0.005275 mol × 3 ÷ 2 = 0.0079 mol MgCl₂, and the smaller amount wins, so the AuCl₃ runs out. The larger 0.29 mol and the larger 7.0 g both point at magnesium, but a bigger pile of one ingredient is exactly what excess means, and the 3-to-3 ratio links Mg to MgCl₂ only, not the two reactants to each other."}, {"id": 126, "level": "Advanced", "tag": "Limiting Reactant", "stem": "Lab tube 1 holds 0.20 g of aluminum foil and 0.30 g of copper (II) sulfate for 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). Molar masses: Al 26.98 g/mol, CuSO₄ 159.6 g/mol. How many moles of copper can form, and which reactant limits the tube?", "options": ["0.013 mol Cu, from adding the two predicted amounts of copper", "0.0019 mol Cu, with copper (II) sulfate as the limiting one", "0.0028 mol Cu, from the CuSO₄ taken as 3 mol Cu per 2 mol CuSO₄", "0.011 mol Cu, with the aluminum foil as the limiting reactant"], "answer": "B", "answer_text": "0.0019 mol Cu, with copper (II) sulfate as the limiting one", "exp": "Aluminum gives 0.20 ÷ 26.98 = 0.007413 mol × 3 ÷ 2 = 0.011 mol Cu, while the CuSO₄ gives 0.30 ÷ 159.6 = 0.0019 mol × 3 ÷ 3 = 0.0019 mol Cu, and the smaller amount wins, so the copper (II) sulfate limits the tube and leftover foil should still be visible. Choosing 0.011 mol ignores that ceiling, 0.013 mol adds two predictions that cannot both happen, and the CuSO₄-to-Cu ratio is 3 to 3, not 3 to 2."}, {"id": 127, "level": "Advanced", "tag": "Limiting Reactant", "stem": "Lab tube 2 holds 0.20 g of aluminum foil and 2.0 g of copper (II) sulfate for the same reaction, 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s), and after the reaction the foil has disappeared. Molar masses: Al 26.98 g/mol, CuSO₄ 159.6 g/mol. How many moles of copper form?", "options": ["0.024 mol Cu, from adding the two predicted amounts together", "0.011 mol Cu, the smaller amount, limited by the aluminum foil", "0.013 mol Cu, the larger amount, limited by the copper (II) sulfate", "0.0074 mol Cu, from the aluminum taken one mole to one mole"], "answer": "B", "answer_text": "0.011 mol Cu, the smaller amount, limited by the aluminum foil", "exp": "Aluminum gives 0.20 ÷ 26.98 = 0.007413 mol × 3 ÷ 2 = 0.011 mol Cu and the CuSO₄ gives 2.0 ÷ 159.6 = 0.01253 mol × 3 ÷ 3 = 0.013 mol Cu, so the smaller 0.011 mol wins and the foil is the limiting reactant — which matches the foil vanishing while blue solution remains. Taking 0.013 mol picks the larger prediction, 0.024 mol adds them, and 0.0074 mol drops the 3-to-2 ratio."}, {"id": 128, "level": "Advanced", "tag": "Limiting Reactant", "stem": "A study guide states: “The reactant present in the smaller number of moles is always the limiting reactant.” Test that rule on Fe(s) + 2HCl(aq) → FeCl₂(aq) + H₂(g) using 5.60 g of iron and 6.20 g of HCl. Molar masses: Fe 55.85 g/mol, HCl 36.46 g/mol.", "options": ["Iron limits, at 0.100 mol H₂, since 0.100 mol is the smaller mole count", "Neither limits; 0.100 mol Fe and 0.170 mol HCl both react completely", "HCl limits, since its 6.20 g outweighs the 5.60 g of iron in the flask", "HCl limits, at 0.0850 mol H₂ against the 0.100 mol the iron could give"], "answer": "D", "answer_text": "HCl limits, at 0.0850 mol H₂ against the 0.100 mol the iron could give", "exp": "Iron gives 5.60 ÷ 55.85 = 0.100 mol × 1 mol H₂ ÷ 1 mol Fe = 0.100 mol H₂, while HCl gives 6.20 ÷ 36.46 = 0.170 mol × 1 mol H₂ ÷ 2 mol HCl = 0.0850 mol H₂, and the smaller amount wins, so HCl limits even though there are more moles of it. That is exactly why the rule fails: the coefficient 2 means HCl is used up twice as fast, and comparing masses or declaring a tie skips the products altogether."}, {"id": 129, "level": "Advanced", "tag": "Limiting Reactant", "stem": "For A Sack of Silver you mix 50.0 g of silver (I) nitrate with 8.00 g of copper: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Molar masses: AgNO₃ 169.9 g/mol, Cu 63.55 g/mol, Ag 107.9 g/mol. What mass of silver can you make?", "options": ["58.9 g Ag, from adding the two predicted masses of silver together", "27.2 g Ag, the smaller amount, set by the 8.00 g of copper", "31.8 g Ag, the larger amount, set by the 50.0 g of AgNO₃", "13.6 g Ag, from the copper taken as one mol Ag per mol Cu"], "answer": "B", "answer_text": "27.2 g Ag, the smaller amount, set by the 8.00 g of copper", "exp": "The AgNO₃ gives 50.0 ÷ 169.9 = 0.2943 mol × 2 ÷ 2 = 0.2943 mol Ag, or 31.8 g, while the copper gives 8.00 ÷ 63.55 = 0.1259 mol × 2 mol Ag ÷ 1 mol Cu = 0.2518 mol Ag, or 0.2518 × 107.9 = 27.2 g; the smaller mass wins, so copper is limiting. Taking 31.8 g uses copper you do not have, 58.9 g adds two competing predictions, and 13.6 g drops the 2-to-1 ratio that gives two silvers per copper."}, {"id": 130, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "You plan to make silver from 50.0 g of silver (I) nitrate with copper in excess: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Molar masses: AgNO₃ 169.9 g/mol, Ag 107.9 g/mol. What is your theoretical yield of silver?", "options": ["63.5 g Ag, from 0.2943 mol AgNO₃ doubled before × 107.9 g/mol", "31.8 g Ag, from 50.0 ÷ 169.9 = 0.2943 mol, then × 107.9 g/mol", "31.75 g Ag, from the same chain but kept to four digits", "15.9 g Ag, from 0.2943 mol AgNO₃ halved before × 107.9 g/mol"], "answer": "B", "answer_text": "31.8 g Ag, from 50.0 ÷ 169.9 = 0.2943 mol, then × 107.9 g/mol", "exp": "50.0 g ÷ 169.9 g/mol = 0.2943 mol AgNO₃, and the recipe gives 2 mol Ag for every 2 mol AgNO₃, so 0.2943 mol Ag × 107.9 g/mol = 31.75 g, reported as 31.8 g for the three digits in 50.0 g. Halving gives 15.9 g and doubling gives 63.5 g, but the coefficients are 2 and 2, and 31.75 g shows a fourth digit the data cannot support."}, {"id": 131, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "Your theoretical yield of silver is 31.8 g, but the sack you hand Lemac holds only 28.1 g. Percent yield = actual ÷ theoretical × 100%. What percent yield do you report?", "options": ["11.6%, from the 3.7 g of missing silver ÷ 31.8 g × 100%", "113%, from 31.8 g ÷ 28.1 g × 100%, dividing in the other order", "88%, from 28.1 g ÷ 31.8 g × 100% cut back to two digits", "88.4%, from 28.1 g ÷ 31.8 g × 100%, three digits in each mass"], "answer": "D", "answer_text": "88.4%, from 28.1 g ÷ 31.8 g × 100%, three digits in each mass", "exp": "Percent yield puts what you actually got on top: 28.1 ÷ 31.8 × 100% = 88.4%, and both masses carry three digits, so the answer does too. Dividing the other way gives 113%, which would claim more silver than the AgNO₃ could ever supply; 88% throws away a digit you have earned, and 11.6% is the fraction lost, not the fraction collected."}, {"id": 132, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "You planned on 8.0 g of chalk, CaCO₃, and the dried chalk you scrape off the filter paper masses 7.8 g. Percent yield = actual ÷ theoretical × 100%. What is your percent yield, reported correctly?", "options": ["98%, because 7.8 ÷ 8.0 = 0.975 and both masses have two digits", "97.5%, because the calculator shows three digits for 7.8 ÷ 8.0", "0.98%, because 7.8 ÷ 8.0 is already a percentage as it stands", "103%, because 8.0 ÷ 7.8 gives the yield the other way round"], "answer": "A", "answer_text": "98%, because 7.8 ÷ 8.0 = 0.975 and both masses have two digits", "exp": "7.8 g ÷ 8.0 g × 100% = 97.5%, but 7.8 g and 8.0 g each carry two digits, so the reported yield is 98%. Keeping 97.5% claims a third digit that neither mass supports, 103% divides theoretical by actual, and 0.98% forgets the × 100% that turns the decimal fraction into a percent."}, {"id": 133, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "Your theoretical yield of gold from Lemac’s lead is 12.7 g, and the nugget you actually collect masses 11.0 g. Percent yield = actual ÷ theoretical × 100%. What percent yield do you report?", "options": ["86.6%, from 11.0 g ÷ 12.7 g × 100%, keeping three digits", "13.4%, from the 1.7 g of missing gold ÷ 12.7 g × 100%", "86.61%, from 11.0 g ÷ 12.7 g × 100% kept to four digits", "115%, from 12.7 g ÷ 11.0 g × 100%, dividing in the other order"], "answer": "A", "answer_text": "86.6%, from 11.0 g ÷ 12.7 g × 100%, keeping three digits", "exp": "11.0 g ÷ 12.7 g × 100% = 86.61%, and with three digits in each mass the yield is 86.6%. Dividing the other way gives 115%, a claim that more gold came out than the lead could make; 86.61% keeps a fourth digit, and 13.4% reports the gold lost rather than the gold collected."}, {"id": 134, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "A student’s worked solution reads: “Theoretical yield 0.71 g Cu, actual yield 0.58 g Cu, percent yield = 0.71 ÷ 0.58 × 100% = 122%.” Percent yield = actual ÷ theoretical × 100%. What is the correct percent yield?", "options": ["18%, from the 0.13 g of copper never collected ÷ 0.71 g × 100%", "122%, from 0.71 g ÷ 0.58 g × 100%, with theoretical on top", "82%, from 0.58 g ÷ 0.71 g × 100%, with the actual mass on top", "81.7%, from 0.58 g ÷ 0.71 g × 100% kept to three digits"], "answer": "C", "answer_text": "82%, from 0.58 g ÷ 0.71 g × 100%, with the actual mass on top", "exp": "The actual yield belongs on top: 0.58 ÷ 0.71 × 100% = 81.7%, or 82% for the two digits in each mass. The 122% comes from flipping the fraction, and a yield above 100% should always prompt a second look because it says a reaction made more product than its reactants held; 81.7% keeps a third digit, and 18% is the share lost."}, {"id": 135, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "The rusting reaction 4Fe(s) + 3O₂(g) → 2Fe₂O₃(s) has a theoretical yield of 25.0 g of Fe₂O₃ in your setup, and this reaction is known to run at 78.0% yield. Percent yield = actual ÷ theoretical × 100%. What mass of Fe₂O₃ do you actually collect?", "options": ["32.1 g Fe₂O₃, from 25.0 g ÷ 0.780 instead of multiplying", "1.95 × 10³ g Fe₂O₃, from 78.0 × 25.0 with the percent left in", "19.5 g Fe₂O₃, from 0.780 × 25.0 g, keeping three digits", "5.50 g Fe₂O₃, the mass missing rather than the mass collected"], "answer": "C", "answer_text": "19.5 g Fe₂O₃, from 0.780 × 25.0 g, keeping three digits", "exp": "Rearranging percent yield gives actual = percent ÷ 100 × theoretical = 0.780 × 25.0 g = 19.5 g of Fe₂O₃, to three digits. Dividing instead gives 32.1 g, more than the theoretical yield and therefore impossible; 5.50 g is the 22.0% never collected, and 1.95 × 10³ g leaves the percent unconverted, inflating the answer by a factor of 100."}, {"id": 136, "level": "Advanced", "tag": "Theoretical and Percent Yield", "stem": "A lab group pulls their chalk off the filter paper while it is still damp, masses it right away, and gets a percent yield above 100%. Their conclusion reads: “Our reaction created extra calcium carbonate out of nothing.” What is the better explanation?", "options": ["Percent yield is actual ÷ theoretical, so damp product cannot change the result", "Mass really can be created in a precipitation reaction, so this is expected", "A theoretical yield that is set too high always pushes the percent above 100%", "Water still in the chalk adds mass, pushing the actual yield above theoretical"], "answer": "D", "answer_text": "Water still in the chalk adds mass, pushing the actual yield above theoretical", "exp": "The balance cannot tell chalk from the water clinging to it, so the actual yield includes water mass and actual ÷ theoretical × 100% climbs past 100%; drying the chalk to constant mass fixes it. Matter is conserved in every reaction, so nothing is created; a theoretical yield set too high would make the percent smaller, not larger; and anything that adds to the measured mass does change the result."}, {"id": 137, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "One mole of a gas fills 22.4 L at 0 °C and 1 atm. The Alchemist keeps 3.0 g of helium in a small cylinder. Molar mass He 4.003 g/mol. What volume would that helium fill at 0 °C and 1 atm?", "options": ["16.8 L, from 0.7494 mol × 22.4 L/mol kept to three digits", "17 L, from 3.0 ÷ 4.003 = 0.7494 mol, then × 22.4 L/mol", "67 L, from 3.0 g × 22.4 L/mol with no molar mass step", "0.033 L, from 0.7494 mol ÷ 22.4 L/mol instead of multiplying"], "answer": "B", "answer_text": "17 L, from 3.0 ÷ 4.003 = 0.7494 mol, then × 22.4 L/mol", "exp": "3.0 g ÷ 4.003 g/mol = 0.7494 mol He, and 0.7494 mol × 22.4 L/mol = 16.79 L, which is 17 L for the two digits in 3.0 g. Reporting 16.8 L keeps a third digit the 3.0 g cannot support, 67 L skips the molar mass so grams never become moles, and dividing by 22.4 gives 0.033 L, far too small for 3.0 g of a gas."}, {"id": 138, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "One mole of a gas fills 22.4 L at 0 °C and 1 atm. A test flask in the workshop holds 6.2 g of hydrogen gas. Molar mass H₂ 2.016 g/mol. What volume does that hydrogen fill at 0 °C and 1 atm?", "options": ["1.4 × 10² L, from 6.2 g × 22.4 L/mol with no molar mass step", "0.14 L, from 3.075 mol ÷ 22.4 L/mol instead of multiplying", "69 L, from 6.2 ÷ 2.016 = 3.075 mol, then × 22.4 L/mol", "68.9 L, from 3.075 mol × 22.4 L/mol kept to three digits"], "answer": "C", "answer_text": "69 L, from 6.2 ÷ 2.016 = 3.075 mol, then × 22.4 L/mol", "exp": "6.2 g ÷ 2.016 g/mol = 3.075 mol H₂, and 3.075 mol × 22.4 L/mol = 68.89 L, reported as 69 L for the two digits in 6.2 g. The 68.9 L answer keeps three digits, 1.4 × 10² L multiplies grams by 22.4 L/mol as if grams were moles, and 0.14 L divides where the chain multiplies."}, {"id": 139, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "One mole of a gas fills 22.4 L at 0 °C and 1 atm. A sealed jar on the shelf holds 70.5 L of xenon at those conditions. Molar mass Xe 131.29 g/mol. What is the mass of the xenon?", "options": ["413.2 g Xe, from the same chain but kept to four digits", "12.0 g Xe, from 70.5 ÷ 131.29, then × 22.4 L/mol", "413 g Xe, from 70.5 ÷ 22.4 = 3.147 mol, then × 131.29", "2.07 × 10⁵ g Xe, from 70.5 × 22.4, then × 131.29 g/mol"], "answer": "C", "answer_text": "413 g Xe, from 70.5 ÷ 22.4 = 3.147 mol, then × 131.29", "exp": "70.5 L ÷ 22.4 L/mol = 3.147 mol Xe, and 3.147 mol × 131.29 g/mol = 413 g, limited to three digits by 70.5 L and 22.4 L/mol. Reporting 413.2 g claims a fourth digit, multiplying by 22.4 instead of dividing inflates the answer to 2.07 × 10⁵ g, and 12.0 g divides the volume by the molar mass, which does not give moles."}, {"id": 140, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "A study guide’s work reads: “4.1 L Kr × (22.4 L ÷ 1 mol) = 91.8 mol Kr,” then multiplies by the molar mass. One mole of a gas fills 22.4 L at 0 °C and 1 atm, and Kr is 83.80 g/mol. What is the mass of 4.1 L of krypton at those conditions?", "options": ["15.3 g Kr, from 0.1830 mol × 83.80 g/mol kept to three digits", "15 g Kr, from 4.1 ÷ 22.4 = 0.1830 mol, then × 83.80 g/mol", "7.7 × 10³ g Kr, from 91.8 mol × 83.80 g/mol as the guide has it", "0.0022 g Kr, from 4.1 ÷ 83.80 g/mol, then ÷ 22.4 L/mol"], "answer": "B", "answer_text": "15 g Kr, from 4.1 ÷ 22.4 = 0.1830 mol, then × 83.80 g/mol", "exp": "Liters belong on top and 22.4 L/mol on the bottom so that liters cancel: 4.1 ÷ 22.4 = 0.1830 mol Kr, and 0.1830 mol × 83.80 g/mol = 15.3 g, reported as 15 g for the two digits in 4.1 L. The guide’s 91.8 mol leaves units of L²/mol and balloons the mass to 7.7 × 10³ g, 15.3 g keeps one digit too many, and 0.0022 g divides by both values instead of dividing by one and multiplying by the other."}, {"id": 141, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "The prototype balloon runs on C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(ℓ), and you want it to hold 0.50 L of CO₂. One mole of a gas fills 22.4 L at 0 °C and 1 atm, and baking soda NaHCO₃ is 84.0 g/mol. What mass of baking soda do you weigh out?", "options": ["1.9 g NaHCO₃, from 0.02232 mol CO₂ taken 3 to 3, then × 84.0", "1.88 g NaHCO₃, from the same chain kept to three digits", "5.6 g NaHCO₃, from 0.02232 mol CO₂ × 3, then × 84.0 g/mol", "0.62 g NaHCO₃, from 0.02232 mol CO₂ ÷ 3 first, then × 84.0 g/mol"], "answer": "A", "answer_text": "1.9 g NaHCO₃, from 0.02232 mol CO₂ taken 3 to 3, then × 84.0", "exp": "0.50 L ÷ 22.4 L/mol = 0.02232 mol CO₂, the recipe gives 3 mol NaHCO₃ for 3 mol CO₂ so the moles carry straight across, and 0.02232 mol × 84.0 g/mol = 1.875 g, or 1.9 g for the two digits in 0.50 L. Dividing by 3 gives 0.62 g, multiplying by 3 gives 5.6 g, and 1.88 g reports a third digit the volume cannot support."}, {"id": 142, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "A study guide works out the citric acid for a 0.50 L CO₂ balloon as “0.0074 mol × 60.1 g/mol = 0.44 g,” for C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(ℓ). Citric acid C₆H₈O₇ is 192.1 g/mol, while 60.1 g/mol belongs to acetic acid. One mole of gas fills 22.4 L at 0 °C and 1 atm. What mass of citric acid is needed?", "options": ["1.4 g C₆H₈O₇, from 0.0074 mol of acid × 192.1 g/mol", "4.3 g C₆H₈O₇, from 0.02232 mol CO₂ × 192.1 with no ratio used", "1.43 g C₆H₈O₇, from the correct chain kept to three digits", "0.44 g C₆H₈O₇, from 0.0074 mol of acid × 60.1 g/mol as printed"], "answer": "A", "answer_text": "1.4 g C₆H₈O₇, from 0.0074 mol of acid × 192.1 g/mol", "exp": "0.50 L ÷ 22.4 L/mol = 0.02232 mol CO₂, and 1 mol of acid makes 3 mol of CO₂, so 0.02232 ÷ 3 = 0.0074 mol of acid and 0.0074 mol × 192.1 g/mol = 1.4 g, to the two digits in 0.50 L. Using 60.1 g/mol weighs out acetic acid’s molar mass and gives 0.44 g, less than a third of what the balloon needs; 4.3 g skips the 1-to-3 ratio, and 1.43 g keeps a third digit."}, {"id": 143, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "Your escape balloon holds 75,125 L and you fill it with hydrogen made by Fe(s) + 2HCl(aq) → FeCl₂(aq) + H₂(g). One mole of a gas fills 22.4 L at 0 °C and 1 atm, and Fe is 55.85 g/mol. What mass of iron do you need?", "options": ["9.40 × 10⁷ g Fe, from 75,125 × 22.4, then × 55.85 g/mol", "1.87 × 10⁵ g Fe, from 75,125 ÷ 22.4 = 3354 mol, then × 55.85", "9.37 × 10⁴ g Fe, from halving the moles of H₂ before × 55.85", "3.75 × 10⁵ g Fe, from doubling the moles of H₂ before × 55.85"], "answer": "B", "answer_text": "1.87 × 10⁵ g Fe, from 75,125 ÷ 22.4 = 3354 mol, then × 55.85", "exp": "75,125 L ÷ 22.4 L/mol = 3354 mol H₂, the recipe gives 1 mol Fe per 1 mol H₂, and 3354 mol × 55.85 g/mol = 1.87 × 10⁵ g of iron, held to the three digits of 22.4 L/mol. The 2 in front of HCl belongs to the acid, not the iron, so halving to 9.37 × 10⁴ g or doubling to 3.75 × 10⁵ g misreads the recipe, and multiplying by 22.4 instead of dividing gives 9.40 × 10⁷ g."}, {"id": 144, "level": "Advanced", "tag": "Molar Volume and Gas Stoichiometry", "stem": "A study guide states: “One mole of any gas fills 22.4 L, no matter what the temperature and the pressure happen to be.” Under what conditions does the 22.4 L per mole value actually hold?", "options": ["At 0 °C and any pressure, because only the temperature moves the gas particles", "At 25 °C and 1 atm, the ordinary conditions of a laboratory bench in a school", "At any temperature and any pressure, because a mole is always the same count", "At 0 °C and 1 atm; change either one and a mole fills a different volume"], "answer": "D", "answer_text": "At 0 °C and 1 atm; change either one and a mole fills a different volume", "exp": "The 22.4 L per mole value is measured at 0 °C and 1 atm, so every gas volume problem in this unit is understood to sit at those conditions. A mole is indeed a fixed count, but the space that count occupies grows when a gas is warmed and shrinks when it is squeezed, so neither “any temperature and pressure,” nor room temperature, nor 0 °C at any pressure describes where 22.4 L per mole comes from."}, {"id": 145, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 1: a scrap of aluminum foil falls into Aqua Verde and reddish-brown copper appears on it. The reaction is 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). The jar was mixed from 12.5 g of copper (II) sulfate pentahydrate, CuSO₄·5H₂O, molar mass 249.7 g/mol, with aluminum foil in excess. Molar mass Cu 63.55 g/mol. What mass of copper can form?", "options": ["4.98 g Cu, from 12.5 ÷ 159.6 = 0.07832 mol, then × 63.55 g/mol", "3.18 g Cu, from 12.5 ÷ 249.7 = 0.05006 mol, then × 63.55 g/mol", "9.54 g Cu, from 0.05006 mol × 3 before multiplying by 63.55 g/mol", "1.06 g Cu, from 0.05006 mol ÷ 3 before multiplying by 63.55 g/mol"], "answer": "B", "answer_text": "3.18 g Cu, from 12.5 ÷ 249.7 = 0.05006 mol, then × 63.55 g/mol", "exp": "Each CuSO₄·5H₂O unit carries five waters that add mass but no copper, so use 249.7 g/mol: 12.5 ÷ 249.7 = 0.05006 mol, and the 3-to-3 ratio carries that straight to copper, giving 0.05006 mol × 63.55 g/mol = 3.18 g to three digits. Using the anhydrous 159.6 g/mol gives 4.98 g and pretends the water weighed nothing, while dividing or multiplying by 3 misreads a 3-to-3 recipe as 3-to-1 or 1-to-3."}, {"id": 146, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 4: to prove the Philosopher’s Stone works again, Lemac hands you a 7.0 g strip of magnesium and you scoop up 1.6 g of gold (III) chloride. The reaction is 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). Molar masses: Mg 24.31 g/mol, AuCl₃ 303.3 g/mol, Au 196.97 g/mol. What mass of gold can you show Lemac?", "options": ["1.6 g Au, taking the mass of AuCl₃ straight across to gold", "1.0 g Au, the smaller amount, from 1.6 g AuCl₃ ÷ 303.3 g/mol", "38 g Au, the larger amount, from 7.0 g Mg ÷ 24.31 = 0.2879 mol", "0.69 g Au, from 0.005275 mol AuCl₃ × 2 ÷ 3, then × 196.97"], "answer": "B", "answer_text": "1.0 g Au, the smaller amount, from 1.6 g AuCl₃ ÷ 303.3 g/mol", "exp": "Work the gold out both ways: AuCl₃ gives 1.6 ÷ 303.3 = 0.005275 mol × 2 mol Au ÷ 2 mol AuCl₃ = 0.005275 mol Au, or 1.0 g, while magnesium gives 7.0 ÷ 24.31 = 0.2879 mol × 2 ÷ 3 = 0.1920 mol Au, or 38 g — and the smaller amount wins, so the AuCl₃ runs out first. The 38 g answer would need far more gold chloride than the 1.6 g you scooped, 1.6 g treats grams of one substance as grams of another, and 0.69 g applies the magnesium ratio to the AuCl₃."}, {"id": 147, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 4: Lemac is impressed and pulls out a 16 g lump of iron for Fe(s) + AuCl₃(aq) → FeCl₃(aq) + Au(s), with gold (III) chloride in excess. Molar masses: Fe 55.85 g/mol, Au 196.97 g/mol. What mass of gold can the iron make?", "options": ["1.7 × 10² g Au, from 0.2865 mol Fe × 3 mol Au, then × 196.97", "57 g Au, from a mole count rounded to 0.29 mol, then × 196.97", "56 g Au, from 16 ÷ 55.85 = 0.2865 mol Fe, then × 196.97 g/mol", "56.4 g Au, from the same chain but kept to three digits"], "answer": "C", "answer_text": "56 g Au, from 16 ÷ 55.85 = 0.2865 mol Fe, then × 196.97 g/mol", "exp": "16 g ÷ 55.85 g/mol = 0.2865 mol Fe, the recipe is 1 mol Au for every 1 mol Fe, and 0.2865 mol × 196.97 g/mol = 56.43 g, rounded at the end to 56 g for the two digits in 16 g. Reporting 56.4 g claims a third digit, 57 g comes from rounding the mole count in the middle of the chain instead of at the end, and 1.7 × 10² g invents a 3-to-1 ratio the equation does not have."}, {"id": 148, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 5: filling the 75,125 L escape balloon with hydrogen from Fe(s) + 2HCl(aq) → FeCl₂(aq) + H₂(g) takes 1.87 × 10⁵ g of iron. Iron has a density of 7.9 g/cm³, and Density = mass ÷ volume. What volume of iron must you haul into the workshop?", "options": ["1.5 × 10⁶ cm³, from 1.87 × 10⁵ g × 7.9 g/cm³ instead of dividing", "4.2 × 10⁻⁵ cm³, from 7.9 g/cm³ ÷ 1.87 × 10⁵ g, the other way round", "2.4 × 10⁴ cm³, from 1.87 × 10⁵ g ÷ 7.9 g/cm³, kept to two digits", "2.37 × 10⁴ cm³, from 1.87 × 10⁵ g ÷ 7.9 g/cm³, kept to three digits"], "answer": "C", "answer_text": "2.4 × 10⁴ cm³, from 1.87 × 10⁵ g ÷ 7.9 g/cm³, kept to two digits", "exp": "Rearranging Density = mass ÷ volume gives volume = mass ÷ density = 1.87 × 10⁵ g ÷ 7.9 g/cm³ = 2.4 × 10⁴ cm³, held to two digits because 7.9 g/cm³ has only two. Multiplying by the density gives 1.5 × 10⁶ cm³, 2.37 × 10⁴ cm³ keeps a third digit the density cannot support, and 4.2 × 10⁻⁵ cm³ inverts the division into a volume smaller than a grain of sand."}, {"id": 149, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 2: to make a sack of silver for Lemac you plan to react 50.0 g of silver (I) nitrate with copper metal: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Molar masses: AgNO₃ 169.9 g/mol, Cu 63.55 g/mol. What mass of copper do you need to use up all of the silver (I) nitrate?", "options": ["9.35 g Cu, from 50.0 ÷ 169.9 = 0.2943 mol, halved, then × 63.55", "18.7 g Cu, from 0.2943 mol AgNO₃ carried one to one, then × 63.55", "37.4 g Cu, from 0.2943 mol AgNO₃ doubled, then × 63.55 g/mol", "9.351 g Cu, from the correct chain but kept to four digits"], "answer": "A", "answer_text": "9.35 g Cu, from 50.0 ÷ 169.9 = 0.2943 mol, halved, then × 63.55", "exp": "50.0 g ÷ 169.9 g/mol = 0.2943 mol AgNO₃, and the recipe needs only 1 mol Cu for every 2 mol AgNO₃, so 0.2943 ÷ 2 = 0.1471 mol Cu and 0.1471 mol × 63.55 g/mol = 9.35 g to three digits. Ignoring the 2-to-1 ratio gives 18.7 g, doubling instead of halving gives 37.4 g, and 9.351 g reports four digits from three-digit data."}, {"id": 150, "level": "Advanced", "tag": "Case File: The Alchemist's Apprentice", "stem": "Case file, Day 5: your prototype balloon was supposed to reach 0.50 L of CO₂ gas. You wrap a string around the finished balloon and measure a circumference of 29.2 cm. Use C = 2πr and V = (4/3)πr³, with 1 cm³ = 1 mL, and percent yield = actual ÷ theoretical × 100%. What is the percent yield of gas?", "options": ["119%, since 0.50 L ÷ 0.420 L divides the two volumes the other way", "84.1%, since 0.420 L ÷ 0.50 L is kept to three digits instead of two", "16%, since the 0.080 L of gas that is missing ÷ 0.50 L × 100% = 16%", "84%, since r = 4.6473 cm gives V = 0.420 L and 0.4204 ÷ 0.50 = 0.8409"], "answer": "D", "answer_text": "84%, since r = 4.6473 cm gives V = 0.420 L and 0.4204 ÷ 0.50 = 0.8409", "exp": "From C = 2πr, r = 29.2 cm ÷ 2π = 4.6473 cm, carried unrounded, so V = (4/3)πr³ = 420.4 cm³ = 0.420 L of CO₂ actually collected, and 0.420 L ÷ 0.50 L × 100% = 84%, held to two digits by the 0.50 L target. Dividing the other way gives 119%, which would claim more gas than the recipe could make; 84.1% keeps a third digit, and 16% is the share of gas that escaped rather than the share captured."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>
  `<button data-t="${i}">${t}<span class="c">${tagCount[t]}</span></button>`).join('');
document.querySelectorAll('#tagchips button').forEach((b,i)=>{
  b.onclick = ()=>{
    const t = tags[i];
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.classList.toggle('on', picked.has(t));
    refresh();
  };
});
$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
