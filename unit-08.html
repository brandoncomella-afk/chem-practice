<style>
*{box-sizing:border-box}
:root{
 --bg:#f6f7f9; --card:#ffffff; --ink:#1c2024; --muted:#6b7280; --line:#e3e6ea;
 --accent:#1f3864; --accent2:#2e5496; --ok:#0f7b3d; --okbg:#e8f6ed;
 --no:#b3261e; --nobg:#fdecea; --chip:#eef1f5;
}
@media (prefers-color-scheme:dark){
 :root{--bg:#12151a;--card:#1a1e25;--ink:#e8eaed;--muted:#9aa3ad;--line:#2c323b;
 --accent:#8ab4f8;--accent2:#a8c7fa;--ok:#5cd18a;--okbg:#12331f;--no:#ff8a80;--nobg:#3a1c19;--chip:#242a33;}
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 80px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:26px 0 20px;margin-bottom:20px}
h1{margin:0 0 4px;font-size:23px;color:var(--accent);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14.5px;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%;margin-bottom:2px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 13px;transition:.12s}
button:hover{border-color:var(--accent2)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.on{color:#12151a}}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.primary{color:#12151a}}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);max-width:100%}
.skills{display:flex;flex-wrap:wrap;gap:7px;width:100%;max-height:190px;overflow-y:auto;padding:2px 2px 4px;margin-top:2px}
.skills button{font-size:13px;padding:6px 11px}
.skills button .c{opacity:.62;font-size:11.5px;margin-left:5px}
.skillbar{display:flex;gap:8px;width:100%;margin-top:6px;align-items:center}
.mini{font-size:12px;padding:4px 10px;background:transparent}
.hint{font-size:12px;color:var(--muted)}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-top:4px}
.stat b{font-size:22px;color:var(--accent)} .stat span{font-size:12.5px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
.qnum{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tag{font-size:11.5px;background:var(--chip);color:var(--muted);padding:3px 9px;border-radius:99px;white-space:nowrap}
.stem{font-size:17px;margin:0 0 14px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 14px;margin-bottom:8px;font-size:15.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent2);background:var(--chip)}
.opt:disabled{cursor:default}
.opt .k{font-weight:700;margin-right:9px;color:var(--muted)}
.opt.correct{background:var(--okbg);border-color:var(--ok)} .opt.correct .k{color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no)} .opt.wrong .k{color:var(--no)}
.fb{margin-top:12px;padding:13px 15px;border-radius:9px;font-size:15px;line-height:1.55;border-left:3px solid}
.fb.y{background:var(--okbg);border-color:var(--ok)} .fb.n{background:var(--nobg);border-color:var(--no)}
.fb b{display:block;margin-bottom:4px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:6px}
.done{text-align:center;padding:34px 20px}
.done .score{font-size:46px;font-weight:700;color:var(--accent);line-height:1}
.miss{text-align:left;margin-top:22px}
.miss h3{font-size:15px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.miss div{font-size:14.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.hide{display:none}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
</style></head><body>

<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "The Alchemist chalks the recipe for the Aqua Verde reaction on the wall of the workshop: 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). How many moles of aluminum does this recipe call for?", "options": ["6 mol Al", "3 mol Al", "1 mol Al", "2 mol Al"], "answer": "D", "answer_text": "2 mol Al", "exp": "The number written in front of a formula is its coefficient, and it tells how many moles of that substance the recipe uses; the 2 sits in front of Al. Reading 1 mol Al treats aluminum as though it had no coefficient at all, 3 mol is what stands in front of CuSO₄ and Cu, and 6 mol comes from multiplying two coefficients together."}, {"id": 2, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "In the Sack of Silver reaction you write 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Which substance is a product that appears as a solid metal?", "options": ["Cu(s), the copper wire used up", "AgNO₃(aq), the dissolved reactant", "Ag(s), the silver that forms", "Cu(NO₃)₂(aq), the dissolved product"], "answer": "C", "answer_text": "Ag(s), the silver that forms", "exp": "Products are written to the right of the arrow, and Ag(s) is the only substance on the right carrying an (s) for solid. Cu(s) is a solid but sits on the left as a reactant, Cu(NO₃)₂(aq) is a product yet stays dissolved, and AgNO₃(aq) is a dissolved reactant."}, {"id": 3, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "A strip of magnesium flashes in the Alchemist's furnace: 2Mg + O₂ → 2MgO. If 4.86 g of magnesium reacts completely with 3.20 g of oxygen gas, what mass of magnesium oxide forms?", "options": ["8.1 g", "1.66 g", "16.1 g", "8.06 g"], "answer": "D", "answer_text": "8.06 g", "exp": "Mass is conserved, so every gram that goes in comes back out as product: 4.86 g + 3.20 g = 8.06 g of MgO. Adding is limited by decimal places rather than significant digits, and both masses run to the hundredths place, so 8.1 g throws away a digit that was measured; 1.66 g comes from subtracting and 16.1 g from doubling the total."}, {"id": 4, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "The rusting recipe from Lemac's iron is 4Fe + 3O₂ → 2Fe₂O₃. How many oxygen atoms are shown on the product side of this equation?", "options": ["12 oxygen atoms", "5 oxygen atoms", "6 oxygen atoms", "3 oxygen atoms"], "answer": "C", "answer_text": "6 oxygen atoms", "exp": "On the product side the coefficient 2 multiplies the 3 oxygens inside Fe₂O₃, giving 2 × 3 = 6 oxygen atoms, which matches the 3 × 2 = 6 on the reactant side. Answering 3 reads only the subscript and ignores the coefficient, 5 adds 2 + 3 instead of multiplying, and 12 multiplies by the 4 in front of Fe."}, {"id": 5, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "An old scroll shows iron dropped into copper (II) chloride solution, but the scroll is smudged. Which version of the equation is balanced and written in lowest whole-number ratio?", "options": ["Fe + 3CuCl₂ → FeCl₃ + 3Cu", "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu", "Fe + CuCl₂ → FeCl₃ + Cu", "4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu"], "answer": "B", "answer_text": "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu", "exp": "Counting atoms in 2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu gives 2 Fe, 3 Cu and 6 Cl on each side. Fe + CuCl₂ → FeCl₃ + Cu leaves 2 Cl on the left against 3 on the right and Fe + 3CuCl₂ → FeCl₃ + 3Cu leaves 6 Cl against 3, while 4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu does balance but every coefficient can still be divided by 2."}, {"id": 6, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "You are out of ink, so you make chalk: Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2NaCl(aq). Which substance is the solid chalk that settles out in the beaker?", "options": ["Na₂CO₃, the sodium carbonate", "NaCl, the sodium chloride", "CaCl₂, the calcium chloride", "CaCO₃, the calcium carbonate"], "answer": "D", "answer_text": "CaCO₃, the calcium carbonate", "exp": "The (s) label marks the substance that leaves the solution as a solid, and only CaCO₃ carries it. NaCl stays dissolved as a product, while CaCl₂ and Na₂CO₃ are the dissolved reactants you poured together to start with."}, {"id": 7, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "The workshop lamp burns methane by the recipe CH₄ + 2O₂ → CO₂ + 2H₂O. One mole of methane burns with how much oxygen gas and makes how much water?", "options": ["2 mol O₂ and 1 mol H₂O", "4 mol O₂ and 2 mol H₂O", "2 mol O₂ and 2 mol H₂O", "1 mol O₂ and 1 mol H₂O"], "answer": "C", "answer_text": "2 mol O₂ and 2 mol H₂O", "exp": "Read the coefficients straight across the recipe: 1 CH₄ goes with 2 O₂ and produces 2 H₂O along with 1 CO₂. Answering 1 mol O₂ and 1 mol H₂O ignores both 2s, 2 mol O₂ and 1 mol H₂O reads the coefficient of CO₂ for the water, and 4 mol O₂ doubles a coefficient that is already written."}, {"id": 8, "level": "Beginner", "tag": "Reading a Balanced Equation", "stem": "Lemac hands over gold (III) chloride and a ribbon of magnesium: 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). What type of reaction is this?", "options": ["Synthesis, two elements combine to build one compound", "Single replacement, one metal takes the other's place", "Double replacement, two compounds trade their partners", "Decomposition, one compound breaks into simpler pieces"], "answer": "B", "answer_text": "Single replacement, one metal takes the other's place", "exp": "An element and a compound react and the magnesium takes the chlorine away from the gold, leaving gold as a free element, which is the pattern of a single replacement. A double replacement needs two compounds on the left, a decomposition needs a single compound on the left, and a synthesis would have one substance on the right."}, {"id": 9, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "The coefficients provide a ratio. In 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s), what ratio do the coefficients give for aluminum to copper?", "options": ["2 mol Al : 1 mol Cu", "3 mol Al : 2 mol Cu", "1 mol Al : 1 mol Cu", "2 mol Al : 3 mol Cu"], "answer": "D", "answer_text": "2 mol Al : 3 mol Cu", "exp": "Read the coefficient in front of each substance: Al carries a 2 and Cu carries a 3, so the ratio is 2 mol Al : 3 mol Cu. Writing 3 mol Al : 2 mol Cu flips the two numbers, 2 mol Al : 1 mol Cu borrows the 1 that belongs to Al₂(SO₄)₃, and 1 : 1 ignores the coefficients altogether."}, {"id": 10, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "For the flash of magnesium in the furnace, 2Mg + O₂ → 2MgO, what ratio do the coefficients give for magnesium to oxygen gas?", "options": ["2 mol Mg : 2 mol O₂", "1 mol Mg : 1 mol O₂", "2 mol Mg : 1 mol O₂", "1 mol Mg : 2 mol O₂"], "answer": "C", "answer_text": "2 mol Mg : 1 mol O₂", "exp": "Mg carries the coefficient 2 and O₂ has no written coefficient, which means 1, giving 2 mol Mg : 1 mol O₂. Writing 1 mol Mg : 2 mol O₂ turns the ratio upside down, 2 mol Mg : 2 mol O₂ copies the 2 from MgO onto the oxygen, and 1 : 1 ignores the coefficient in front of Mg."}, {"id": 11, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "Iron rusts by 4Fe + 3O₂ → 2Fe₂O₃. What ratio do the coefficients give for oxygen gas to iron (III) oxide?", "options": ["2 mol O₂ : 3 mol Fe₂O₃", "3 mol O₂ : 2 mol Fe₂O₃", "1 mol O₂ : 1 mol Fe₂O₃", "3 mol O₂ : 4 mol Fe₂O₃"], "answer": "B", "answer_text": "3 mol O₂ : 2 mol Fe₂O₃", "exp": "O₂ carries a 3 and Fe₂O₃ carries a 2, so the recipe pairs 3 mol O₂ : 2 mol Fe₂O₃. Writing 2 mol O₂ : 3 mol Fe₂O₃ flips them, 3 mol O₂ : 4 mol Fe₂O₃ uses the 4 that belongs to iron, and 1 : 1 ignores the coefficients."}, {"id": 12, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "The Stoichiometry Game deals you 2KI + Pb(NO₃)₂ → 2KNO₃ + PbI₂. What ratio do the coefficients give for lead (II) nitrate to potassium nitrate?", "options": ["1 mol Pb(NO₃)₂ : 1 mol KNO₃", "2 mol Pb(NO₃)₂ : 2 mol KNO₃", "1 mol Pb(NO₃)₂ : 2 mol KNO₃", "2 mol Pb(NO₃)₂ : 1 mol KNO₃"], "answer": "C", "answer_text": "1 mol Pb(NO₃)₂ : 2 mol KNO₃", "exp": "Pb(NO₃)₂ has no written coefficient, so it is 1, and KNO₃ carries a 2, giving 1 mol Pb(NO₃)₂ : 2 mol KNO₃. Writing 2 mol Pb(NO₃)₂ : 1 mol KNO₃ reverses them, and both 1 : 1 and 2 : 2 treat the two substances as if their coefficients matched."}, {"id": 13, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "The lamp burns by CH₄ + 2O₂ → CO₂ + 2H₂O. What ratio do the coefficients give for oxygen gas to water?", "options": ["2 mol O₂ : 1 mol H₂O", "1 mol O₂ : 2 mol H₂O", "1 mol O₂ : 1 mol H₂O", "2 mol O₂ : 1 mol CO₂"], "answer": "C", "answer_text": "1 mol O₂ : 1 mol H₂O", "exp": "Both O₂ and H₂O carry the coefficient 2, and 2 : 2 reduces to 1 mol O₂ : 1 mol H₂O. Writing 2 mol O₂ : 1 mol H₂O or 1 mol O₂ : 2 mol H₂O pairs one of the 2s with the 1 in front of CH₄ or CO₂, and 2 mol O₂ : 1 mol CO₂ reads the wrong product off the equation."}, {"id": 14, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "The prototype balloon fizzes by C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(l). What ratio do the coefficients give for citric acid to carbon dioxide?", "options": ["1 mol C₆H₈O₇ : 3 mol CO₂", "1 mol C₆H₈O₇ : 6 mol CO₂", "1 mol C₆H₈O₇ : 1 mol CO₂", "3 mol C₆H₈O₇ : 1 mol CO₂"], "answer": "A", "answer_text": "1 mol C₆H₈O₇ : 3 mol CO₂", "exp": "Citric acid has no written coefficient, so it is 1, and CO₂ carries a 3, giving 1 mol C₆H₈O₇ : 3 mol CO₂. Writing 3 mol C₆H₈O₇ : 1 mol CO₂ turns the ratio over, 1 : 1 ignores the 3, and 1 : 6 reads the subscript 6 in C₆H₈O₇ rather than a coefficient."}, {"id": 15, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "Lemac's lead goes into the gold chloride: 2AuCl₃(aq) + 3Pb(s) → 3PbCl₂(s) + 2Au(s). What ratio do the coefficients give for lead to gold?", "options": ["3 mol Pb : 3 mol Au", "1 mol Pb : 1 mol Au", "3 mol Pb : 2 mol Au", "2 mol Pb : 3 mol Au"], "answer": "C", "answer_text": "3 mol Pb : 2 mol Au", "exp": "Pb carries a 3 and Au carries a 2, so the recipe pairs 3 mol Pb : 2 mol Au. Writing 2 mol Pb : 3 mol Au swaps the coefficients, 3 mol Pb : 3 mol Au copies the 3 from PbCl₂ onto the gold, and 1 : 1 ignores both coefficients."}, {"id": 16, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "The escape balloon is filled using Fe + 2HCl → FeCl₂ + H₂. What ratio do the coefficients give for hydrochloric acid to hydrogen gas?", "options": ["2 mol HCl : 1 mol H₂", "2 mol HCl : 2 mol H₂", "1 mol HCl : 2 mol H₂", "1 mol HCl : 1 mol H₂"], "answer": "A", "answer_text": "2 mol HCl : 1 mol H₂", "exp": "HCl carries a 2 and H₂ has no written coefficient, so it is 1, giving 2 mol HCl : 1 mol H₂. Writing 1 mol HCl : 2 mol H₂ inverts the pair, 2 : 2 reads the subscript in H₂ as a coefficient, and 1 : 1 drops the 2 in front of the acid."}, {"id": 17, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "You know how many moles of copper wire went into 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s) and you want moles of silver. Which ratio should you write so that moles of Cu cancel?", "options": ["2 mol Cu / 1 mol Ag", "1 mol Cu / 2 mol Ag", "1 mol Ag / 2 mol Cu", "2 mol Ag / 1 mol Cu"], "answer": "D", "answer_text": "2 mol Ag / 1 mol Cu", "exp": "Whatever you start with has to sit in the bottom of the ratio so it cancels, so moles of Cu go underneath and the silver you want goes on top: 2 mol Ag / 1 mol Cu. Writing 1 mol Cu / 2 mol Ag leaves moles of Cu multiplied instead of cancelled, while 1 mol Ag / 2 mol Cu and 2 mol Cu / 1 mol Ag attach the coefficients to the wrong substances."}, {"id": 18, "level": "Beginner", "tag": "Mole Ratios from Coefficients", "stem": "A crucible of copper (II) oxide is heated: 4CuO → 2Cu₂O + O₂. What ratio do the coefficients give for copper (II) oxide to oxygen gas?", "options": ["4 mol CuO : 2 mol O₂", "2 mol CuO : 1 mol O₂", "4 mol CuO : 1 mol O₂", "1 mol CuO : 4 mol O₂"], "answer": "C", "answer_text": "4 mol CuO : 1 mol O₂", "exp": "CuO carries a 4 and O₂ has no written coefficient, so it is 1, giving 4 mol CuO : 1 mol O₂. Writing 1 mol CuO : 4 mol O₂ turns the ratio over, 2 : 1 reads the coefficient of Cu₂O, and 4 : 2 pairs the CuO with the Cu₂O instead of with the oxygen gas."}, {"id": 19, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "In the Aqua Verde reaction, 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s), you drop in 0.600 mol of aluminum foil with plenty of copper (II) sulfate. How many moles of copper can form?", "options": ["0.400 mol Cu", "0.900 mol Cu", "0.600 mol Cu", "1.80 mol Cu"], "answer": "B", "answer_text": "0.900 mol Cu", "exp": "Set the ratio so aluminum cancels: 0.600 mol Al × (3 mol Cu / 2 mol Al) = 0.900 mol Cu, and the coefficients are exact, so the 3 digits in 0.600 set the 3 digits in the answer. The value 0.400 mol comes from flipping the ratio to 2/3, 0.600 mol assumes a 1 : 1 recipe, and 1.80 mol multiplies by 3 without dividing by 2."}, {"id": 20, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "Titanium is made by 2Mg + TiCl₄ → Ti + 2MgCl₂. If 0.750 mol of magnesium reacts with plenty of TiCl₄, how many moles of titanium form?", "options": ["0.750 mol Ti", "0.188 mol Ti", "0.375 mol Ti", "1.50 mol Ti"], "answer": "C", "answer_text": "0.375 mol Ti", "exp": "Set the ratio so magnesium cancels: 0.750 mol Mg × (1 mol Ti / 2 mol Mg) = 0.375 mol Ti, keeping 3 digits because the coefficients are exact and 0.750 has three. The value 1.50 mol multiplies by 2 instead of dividing, 0.750 mol assumes a 1 : 1 recipe, and 0.188 mol divides by 2 a second time."}, {"id": 21, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "Iron rusts by 4Fe + 3O₂ → 2Fe₂O₃. How many moles of iron (III) oxide can form from 0.480 mol of iron and plenty of oxygen?", "options": ["0.360 mol Fe₂O₃", "0.120 mol Fe₂O₃", "0.960 mol Fe₂O₃", "0.240 mol Fe₂O₃"], "answer": "D", "answer_text": "0.240 mol Fe₂O₃", "exp": "Set the ratio so iron cancels: 0.480 mol Fe × (2 mol Fe₂O₃ / 4 mol Fe) = 0.240 mol Fe₂O₃, with 3 digits carried down from 0.480. The value 0.960 mol turns the ratio upside down, 0.360 mol uses the 3 that belongs to oxygen gas, and 0.120 mol divides by 4 without multiplying by 2."}, {"id": 22, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "The workshop lamp burns 1.20 mol of methane by CH₄ + 2O₂ → CO₂ + 2H₂O. How many moles of water are produced?", "options": ["0.600 mol H₂O", "1.20 mol H₂O", "2.40 mol H₂O", "4.80 mol H₂O"], "answer": "C", "answer_text": "2.40 mol H₂O", "exp": "Set the ratio so methane cancels: 1.20 mol CH₄ × (2 mol H₂O / 1 mol CH₄) = 2.40 mol H₂O, keeping the 3 digits of 1.20. The value 0.600 mol divides by 2 instead of multiplying, 1.20 mol reads the recipe as 1 : 1, and 4.80 mol uses the 4 hydrogens in CH₄ as if it were a coefficient."}, {"id": 23, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "To make the Sack of Silver you place 0.0450 mol of copper wire into silver nitrate: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). How many moles of silver can form?", "options": ["0.0900 mol Ag", "0.0225 mol Ag", "0.180 mol Ag", "0.0450 mol Ag"], "answer": "A", "answer_text": "0.0900 mol Ag", "exp": "Set the ratio so copper cancels: 0.0450 mol Cu × (2 mol Ag / 1 mol Cu) = 0.0900 mol Ag, and the trailing zero is written because 0.0450 carries 3 digits. The value 0.0225 mol divides by 2 instead of multiplying, 0.0450 mol treats the recipe as 1 : 1, and 0.180 mol multiplies by 4."}, {"id": 24, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "The escape balloon is filled by Fe + 2HCl → FeCl₂ + H₂. If 2.50 mol of hydrochloric acid is poured over plenty of iron, how many moles of hydrogen gas form?", "options": ["2.50 mol H₂", "1.25 mol H₂", "5.00 mol H₂", "0.625 mol H₂"], "answer": "B", "answer_text": "1.25 mol H₂", "exp": "Set the ratio so acid cancels: 2.50 mol HCl × (1 mol H₂ / 2 mol HCl) = 1.25 mol H₂, with 3 digits carried from 2.50. The value 5.00 mol multiplies by 2 instead of dividing, 2.50 mol reads the recipe as 1 : 1, and 0.625 mol divides by 2 twice."}, {"id": 25, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "You plan the demonstration 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s) using 0.150 mol of gold (III) chloride. How many moles of magnesium does the recipe require?", "options": ["0.100 mol Mg", "0.225 mol Mg", "0.150 mol Mg", "0.450 mol Mg"], "answer": "B", "answer_text": "0.225 mol Mg", "exp": "Set the ratio so the gold (III) chloride cancels: 0.150 mol AuCl₃ × (3 mol Mg / 2 mol AuCl₃) = 0.225 mol Mg, keeping the 3 digits of 0.150. The value 0.100 mol flips the ratio to 2/3, 0.150 mol assumes a 1 : 1 recipe, and 0.450 mol multiplies by 3 without dividing by 2."}, {"id": 26, "level": "Beginner", "tag": "Mole-to-Mole Conversions", "stem": "The prototype balloon runs on C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(l). How many moles of carbon dioxide can 0.0250 mol of citric acid make with plenty of baking soda?", "options": ["0.00833 mol CO₂", "0.150 mol CO₂", "0.0250 mol CO₂", "0.0750 mol CO₂"], "answer": "D", "answer_text": "0.0750 mol CO₂", "exp": "Set the ratio so citric acid cancels: 0.0250 mol C₆H₈O₇ × (3 mol CO₂ / 1 mol C₆H₈O₇) = 0.0750 mol CO₂, with 3 digits from 0.0250. The value 0.00833 mol divides by 3 instead of multiplying, 0.0250 mol treats the recipe as 1 : 1, and 0.150 mol multiplies by 6."}, {"id": 27, "level": "Beginner", "tag": "Mass and Moles", "stem": "Lemac tosses you an iron nail with a mass of 12.6 g. How many moles of iron is that? The molar mass of Fe is 55.85 g/mol.", "options": ["4.43 mol Fe", "0.2256 mol Fe", "704 mol Fe", "0.226 mol Fe"], "answer": "D", "answer_text": "0.226 mol Fe", "exp": "Divide so grams cancel: 12.6 g × (1 mol / 55.85 g) = 0.22560 mol, which is 0.226 mol because 12.6 g carries only 3 significant digits. Reporting 0.2256 mol keeps a fourth digit the balance never measured, 704 mol comes from multiplying by the molar mass, and 4.43 mol comes from dividing 55.85 by 12.6."}, {"id": 28, "level": "Beginner", "tag": "Mass and Moles", "stem": "On Day 4 Lemac gives you 20.0 g of lead to turn into gold. How many moles of lead is that? The molar mass of Pb is 207.2 g/mol.", "options": ["0.09653 mol Pb", "0.0965 mol Pb", "10.4 mol Pb", "4.14 × 10³ mol Pb"], "answer": "B", "answer_text": "0.0965 mol Pb", "exp": "Divide so grams cancel: 20.0 g × (1 mol / 207.2 g) = 0.096525 mol, reported as 0.0965 mol for the 3 digits in 20.0 g. Reporting 0.09653 mol keeps a fourth digit, 10.4 mol comes from dividing 207.2 by 20.0, and 4.14 × 10³ mol comes from multiplying instead of dividing."}, {"id": 29, "level": "Beginner", "tag": "Mass and Moles", "stem": "The reddish-brown copper is scraped out of the Aqua Verde and comes to 0.250 mol. What is its mass? The molar mass of Cu is 63.55 g/mol.", "options": ["254 g Cu", "15.9 g Cu", "0.00393 g Cu", "15.89 g Cu"], "answer": "B", "answer_text": "15.9 g Cu", "exp": "Multiply so moles cancel: 0.250 mol × (63.55 g / 1 mol) = 15.8875 g, reported as 15.9 g because 0.250 mol carries 3 significant digits. Reporting 15.89 g keeps a fourth digit, 254 g comes from dividing 63.55 by 0.250, and 0.00393 g comes from dividing the moles by the molar mass."}, {"id": 30, "level": "Beginner", "tag": "Mass and Moles", "stem": "Your chalk lab produces 8.00 g of calcium carbonate. How many moles is that? The molar mass of CaCO₃ is 100.1 g/mol.", "options": ["0.0799 mol CaCO₃", "0.080 mol CaCO₃", "801 mol CaCO₃", "0.07992 mol CaCO₃"], "answer": "A", "answer_text": "0.0799 mol CaCO₃", "exp": "Divide so grams cancel: 8.00 g × (1 mol / 100.1 g) = 0.079920 mol, which is 0.0799 mol for the 3 digits in 8.00 g. Reporting 0.080 mol keeps only two digits and truncates the third, 0.07992 mol keeps a fourth, and 801 mol comes from multiplying by the molar mass."}, {"id": 31, "level": "Beginner", "tag": "Mass and Moles", "stem": "The chalk recipe calls for 0.0800 mol of sodium carbonate. What mass should you weigh out? The molar mass of Na₂CO₃ is 106.0 g/mol.", "options": ["0.000755 g Na₂CO₃", "8.48 g Na₂CO₃", "8.5 g Na₂CO₃", "8.480 g Na₂CO₃"], "answer": "B", "answer_text": "8.48 g Na₂CO₃", "exp": "Multiply so moles cancel: 0.0800 mol × (106.0 g / 1 mol) = 8.48 g, and although the molar mass carries 4 significant digits, 0.0800 mol carries only 3, so the answer keeps three. Reporting 8.5 g drops a digit that is known, 8.480 g claims a fourth digit, and 0.000755 g comes from dividing by the molar mass instead of multiplying."}, {"id": 32, "level": "Beginner", "tag": "Mass and Moles", "stem": "Lemac slides 7.0 g of magnesium across the table. How many moles of magnesium is that? The molar mass of Mg is 24.31 g/mol.", "options": ["0.29 mol Mg", "0.2879 mol Mg", "0.288 mol Mg", "1.7 × 10² mol Mg"], "answer": "A", "answer_text": "0.29 mol Mg", "exp": "Divide so grams cancel: 7.0 g × (1 mol / 24.31 g) = 0.28795 mol, but 7.0 g carries only 2 significant digits, so the answer is 0.29 mol. Reporting 0.288 mol or 0.2879 mol claims precision the 7.0 g measurement does not have, and 1.7 × 10² mol comes from multiplying by the molar mass."}, {"id": 33, "level": "Beginner", "tag": "Mass and Moles", "stem": "The lamp is charged with 5.00 g of methane. How many moles of methane is that? The molar mass of CH₄ is 16.04 g/mol.", "options": ["0.3117 mol CH₄", "3.21 mol CH₄", "0.312 mol CH₄", "80.2 mol CH₄"], "answer": "C", "answer_text": "0.312 mol CH₄", "exp": "Divide so grams cancel: 5.00 g × (1 mol / 16.04 g) = 0.31172 mol, reported as 0.312 mol for the 3 digits in 5.00 g. Reporting 0.3117 mol keeps a fourth digit, 3.21 mol comes from dividing 16.04 by 5.00, and 80.2 mol comes from multiplying instead of dividing."}, {"id": 34, "level": "Beginner", "tag": "Mass and Moles", "stem": "The Sack of Silver plan calls for 0.400 mol of silver nitrate. What mass should you weigh out? The molar mass of AgNO₃ is 169.9 g/mol.", "options": ["68.0 g AgNO₃", "425 g AgNO₃", "67.96 g AgNO₃", "0.00235 g AgNO₃"], "answer": "A", "answer_text": "68.0 g AgNO₃", "exp": "Multiply so moles cancel: 0.400 mol × (169.9 g / 1 mol) = 67.96 g, and 0.400 mol carries only 3 significant digits, so the answer is written 68.0 g with the trailing zero shown. Reporting 67.96 g keeps a fourth digit, 425 g comes from dividing 169.9 by 0.400, and 0.00235 g comes from dividing instead of multiplying."}, {"id": 35, "level": "Beginner", "tag": "Mass and Moles", "stem": "The workshop jar holds 15.2 g of gold (III) chloride. How many moles is that? The molar mass of AuCl₃ is 303.3 g/mol.", "options": ["4.61 × 10³ mol AuCl₃", "0.05012 mol AuCl₃", "20.0 mol AuCl₃", "0.0501 mol AuCl₃"], "answer": "D", "answer_text": "0.0501 mol AuCl₃", "exp": "Divide so grams cancel: 15.2 g × (1 mol / 303.3 g) = 0.050115 mol, reported as 0.0501 mol for the 3 digits in 15.2 g. Reporting 0.05012 mol keeps a fourth digit, 20.0 mol comes from dividing 303.3 by 15.2, and 4.61 × 10³ mol comes from multiplying by the molar mass."}, {"id": 36, "level": "Beginner", "tag": "Mass and Moles", "stem": "The prototype balloon recipe needs 0.0073 mol of citric acid. What mass should you weigh out? The molar mass of citric acid, C₆H₈O₇, is 192.1 g/mol.", "options": ["0.61 g", "1.40 g", "1.4 g", "0.44 g"], "answer": "C", "answer_text": "1.4 g", "exp": "Multiply so moles cancel: 0.0073 mol × (192.1 g / 1 mol) = 1.4023 g, and 0.0073 mol carries only 2 significant digits, so the answer is 1.4 g. Reporting 1.40 g claims a third digit, 0.44 g comes from using 60.1 g/mol, which belongs to acetic acid, and 0.61 g comes from using the 84.0 g/mol of baking soda."}, {"id": 37, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "You are given grams of magnesium and asked for grams of magnesium oxide. The Alchemist works one box at a time. In what order do the boxes go?", "options": ["(grams → moles), (moles → moles), (moles → grams)", "(moles → grams), (grams → moles), (moles → moles)", "(grams → moles), (moles → grams), (moles → moles)", "(moles → moles), (grams → moles), (moles → grams)"], "answer": "A", "answer_text": "(grams → moles), (moles → moles), (moles → grams)", "exp": "The coefficients of a balanced equation count moles, not grams, so grams must become moles first, then the ratio switches substances, and only then do moles become grams. Any order that uses the ratio before the grams are converted, such as starting with (moles → moles) or with (moles → grams), applies the recipe to a number of grams the recipe knows nothing about."}, {"id": 38, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "Working from Fe(s) + AuCl₃(aq) → FeCl₃(aq) + Au(s), you start with 0.500 g of iron and want grams of gold. What goes in the first box, the moles of iron? The molar mass of Fe is 55.85 g/mol.", "options": ["0.008953 mol Fe", "0.500 mol Fe", "27.9 mol Fe", "0.00895 mol Fe"], "answer": "D", "answer_text": "0.00895 mol Fe", "exp": "The first box converts the measured mass to moles: 0.500 g × (1 mol / 55.85 g) = 0.0089526 mol, reported as 0.00895 mol for the 3 digits in 0.500 g. Reporting 0.008953 mol keeps a fourth digit, 27.9 mol comes from multiplying by the molar mass, and 0.500 mol skips the conversion entirely."}, {"id": 39, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "The Philosopher's Stone is tested with Fe(s) + AuCl₃(aq) → FeCl₃(aq) + Au(s). How many grams of gold can 1.00 g of iron make? Molar masses: Fe 55.85 g/mol, Au 196.97 g/mol.", "options": ["3.53 g Au", "0.284 g Au", "0.0179 g Au", "3.5268 g Au"], "answer": "A", "answer_text": "3.53 g Au", "exp": "Work one box at a time: 1.00 g × (1 mol / 55.85 g) = 0.0179051 mol Fe, then the 1 : 1 ratio gives the same moles of Au, then 0.0179051 mol × (196.97 g / 1 mol) = 3.5268 g, which rounds only at the end to 3.53 g for the 3 digits in 1.00 g. Reporting 3.5268 g keeps calculator digits, 0.0179 g stops at moles and mislabels them grams, and 0.284 g swaps the two molar masses."}, {"id": 40, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "A 2.43 g ribbon of magnesium burns completely: 2Mg + O₂ → 2MgO. How many grams of magnesium oxide form? Molar masses: Mg 24.31 g/mol, MgO 40.31 g/mol.", "options": ["2.43 g MgO", "4.0293 g MgO", "1.47 g MgO", "4.03 g MgO"], "answer": "D", "answer_text": "4.03 g MgO", "exp": "Work one box at a time: 2.43 g × (1 mol / 24.31 g) = 0.099959 mol Mg, then the 2 : 2 ratio gives the same moles of MgO, then × (40.31 g / 1 mol) = 4.0293 g, rounded at the end to 4.03 g for the 3 digits in 2.43 g. Reporting 4.0293 g keeps calculator digits, 2.43 g assumes mass does not change, and 1.47 g swaps the two molar masses."}, {"id": 41, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "A Stoichiometry Game card reads 2KI + Pb(NO₃)₂ → 2KNO₃ + PbI₂. You start with 19.0 g of potassium iodide. How much potassium nitrate will you produce? Molar masses: KI 166.0 g/mol, KNO₃ 101.1 g/mol.", "options": ["11.6 g KNO₃", "31.2 g KNO₃", "0.114 g KNO₃", "11.57 g KNO₃"], "answer": "A", "answer_text": "11.6 g KNO₃", "exp": "Work one box at a time: 19.0 g × (1 mol / 166.0 g) = 0.114458 mol KI, then the 2 : 2 ratio gives the same moles of KNO₃, then × (101.1 g / 1 mol) = 11.5717 g, rounded at the end to 11.6 g for the 3 digits in 19.0 g. Reporting 11.57 g keeps a fourth digit, 0.114 g stops at moles, and 31.2 g swaps the two molar masses."}, {"id": 42, "level": "Beginner", "tag": "Mass-to-Mass Stoichiometry", "stem": "For the Sack of Silver you dissolve 8.50 g of silver nitrate and add plenty of copper wire: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). How many grams of silver can form? Molar masses: AgNO₃ 169.9 g/mol, Ag 107.9 g/mol.", "options": ["0.0500 g Ag", "5.398 g Ag", "5.40 g Ag", "13.4 g Ag"], "answer": "C", "answer_text": "5.40 g Ag", "exp": "Work one box at a time: 8.50 g × (1 mol / 169.9 g) = 0.0500294 mol AgNO₃, then the 2 : 2 ratio gives the same moles of Ag, then × (107.9 g / 1 mol) = 5.3982 g, rounded at the end to 5.40 g with the trailing zero shown for 3 digits. Reporting 5.398 g keeps a fourth digit, 0.0500 g stops at moles, and 13.4 g swaps the two molar masses."}, {"id": 43, "level": "Beginner", "tag": "Limiting Reactant", "stem": "While shopping for the Association of Area Alchemists luncheon, the Alchemist asks you to name the limiting reactant. Which statement describes it correctly?", "options": ["It is the ingredient that runs out first and sets the batch size", "It is the ingredient left sitting on the shelf after the work is done", "It is the ingredient with the smallest molar mass in the recipe", "It is the ingredient you have the most of, since more mass makes more product"], "answer": "A", "answer_text": "It is the ingredient that runs out first and sets the batch size", "exp": "The limiting reactant is whichever starting material is used up first, and once it is gone no more product can form, so it fixes the size of the batch. Molar mass has nothing to do with which one runs out, having the most of something makes it the excess reactant instead, and what is left over at the end is the excess reactant, not the limiting one."}, {"id": 44, "level": "Beginner", "tag": "Limiting Reactant", "stem": "One hayburger takes 2 slices of bread and 1 lettuce leaf. Your kitchen holds 8 slices of bread and 3 lettuce leaves. How many complete hayburgers can you make, and what is the limiting ingredient?", "options": ["3 hayburgers, and the lettuce is limiting", "3 hayburgers, and the bread is limiting", "4 hayburgers, and the bread is limiting", "8 hayburgers, and the lettuce is limiting"], "answer": "A", "answer_text": "3 hayburgers, and the lettuce is limiting", "exp": "Work it both ways: 8 slices of bread would make 4 burgers, but 3 lettuce leaves make only 3 burgers, and the smaller answer is the one you can actually build, so the lettuce runs out first. Answering 4 burgers ignores the lettuce that has already run out, and 8 burgers counts the bread slices as if each one were a whole burger."}, {"id": 45, "level": "Beginner", "tag": "Limiting Reactant", "stem": "For 2Mg + O₂ → 2MgO you compute the product both ways. The magnesium you have would make 0.400 mol of MgO, and the oxygen you have would make 1.00 mol of MgO. How much magnesium oxide actually forms, and which reactant is limiting?", "options": ["0.400 mol MgO, and the oxygen gas is limiting", "0.400 mol MgO, and the magnesium is limiting", "1.00 mol MgO, and the oxygen gas is limiting", "1.40 mol MgO, and neither reactant is limiting"], "answer": "B", "answer_text": "0.400 mol MgO, and the magnesium is limiting", "exp": "When you compute the product both ways, the smaller answer wins, so only 0.400 mol of MgO can form and the magnesium that produced that smaller number is the limiting reactant. Choosing 1.00 mol uses the reactant that is left over, adding to 1.40 mol counts each reactant a second time, and naming the oxygen as limiting contradicts the fact that it was the magnesium route that gave the smaller amount."}, {"id": 46, "level": "Beginner", "tag": "Limiting Reactant", "stem": "One of the pre-made test tubes of 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s) holds 0.30 g of copper (II) sulfate and 0.20 g of aluminum foil. Computed both ways, the copper (II) sulfate would give 0.12 g of copper and the aluminum foil would give 0.71 g of copper. Which substance is the excess reactant?", "options": ["The copper metal, because it is the product this recipe makes", "The copper (II) sulfate, because it gave the smaller amount of copper", "Neither substance, because the two answers did not come out equal", "The aluminum foil, because the copper (II) sulfate ran out first"], "answer": "D", "answer_text": "The aluminum foil, because the copper (II) sulfate ran out first", "exp": "The smaller answer wins, so only 0.12 g of copper can form and the copper (II) sulfate that gave that number is the limiting reactant, which leaves the foil sitting in the tube as the excess reactant. Giving the smaller amount makes the copper (II) sulfate limiting rather than in excess, copper is a product and can be neither, and two different answers are exactly what tells you one reactant runs out first."}, {"id": 47, "level": "Beginner", "tag": "Limiting Reactant", "stem": "The Alchemist has you calculate the amount of product twice, once from each reactant, before you decide anything. What do you do with the two answers?", "options": ["Take the larger answer, because that is all that can be made", "Average the two answers to get the amount of product that forms", "Take the smaller answer, because that is all that can be made", "Add the two answers together to get the amount that is made"], "answer": "C", "answer_text": "Take the smaller answer, because that is all that can be made", "exp": "Each calculation asks how much product one reactant could make if nothing else ran short, and the reaction actually stops at the smaller of the two amounts. Taking the larger answer assumes a reactant that has already run out keeps reacting, and averaging or adding the two mixes together numbers that describe the same product twice."}, {"id": 48, "level": "Beginner", "tag": "Limiting Reactant", "stem": "The reaction in the test tube stops even though you can still see blue solution. What has happened inside the tube?", "options": ["Both reactants ran out at the same moment, so nothing at all is left", "The excess reactant is gone, so the limiting reactant just sits there", "The limiting reactant is gone, so the excess reactant just sits there", "The leftover reactant slowly turns into more product after it stops"], "answer": "C", "answer_text": "The limiting reactant is gone, so the excess reactant just sits there", "exp": "A reaction can only continue while it has some of every reactant, so it stops the moment the limiting reactant is used up and leaves the excess reactant behind, which is the blue color still in the tube. Both reactants running out together would leave nothing visible, and leftover reactant cannot keep making product with nothing to react with."}, {"id": 49, "level": "Beginner", "tag": "Theoretical and Percent Yield", "stem": "At the end of the chalk lab you dry the filter paper and put the chalk on the balance. Which quantity have you just measured?", "options": ["The percent yield, the product compared with the recipe", "The actual yield, the product you really collected", "The limiting reactant, the substance that ran out first", "The theoretical yield, the product the recipe promises"], "answer": "B", "answer_text": "The actual yield, the product you really collected", "exp": "The actual yield is whatever you truly recover and weigh at the end of the lab, while the theoretical yield is the amount the balanced recipe predicts before you ever start. Percent yield is a comparison of those two masses and is not something a balance reads, and the limiting reactant is a starting material, not a product."}, {"id": 50, "level": "Beginner", "tag": "Theoretical and Percent Yield", "stem": "Percent yield = (actual yield / theoretical yield) × 100%. Your chalk lab predicted 8.00 g of calcium carbonate and you collected 6.85 g. What is the percent yield?", "options": ["85.6%", "0.856%", "117%", "85.625%"], "answer": "A", "answer_text": "85.6%", "exp": "Divide the mass you collected by the mass the recipe promised and scale it up: (6.85 g / 8.00 g) × 100% = 85.625%, reported as 85.6% because both masses carry 3 significant digits. Reporting 85.625% keeps every calculator digit, 117% comes from dividing 8.00 g by 6.85 g, and 0.856% leaves out the × 100%."}, {"id": 51, "level": "Beginner", "tag": "Theoretical and Percent Yield", "stem": "Percent yield = (actual yield / theoretical yield) × 100%. The Sack of Silver should have held 8.06 g of silver, and you scraped 7.42 g out of the beaker. What is the percent yield?", "options": ["0.921%", "109%", "92.06%", "92.1%"], "answer": "D", "answer_text": "92.1%", "exp": "Divide the silver you actually recovered by the silver the recipe promised: (7.42 g / 8.06 g) × 100% = 92.0596%, reported as 92.1% since both masses carry 3 significant digits. Reporting 92.06% keeps a fourth digit, 109% comes from dividing 8.06 g by 7.42 g, and 0.921% forgets to multiply by 100%."}, {"id": 52, "level": "Beginner", "tag": "Theoretical and Percent Yield", "stem": "A lab group reports a percent yield of 118% for their chalk. What is the most likely explanation?", "options": ["Their chalk was still damp, so water was weighed along with it", "Their reaction made more product than the recipe can account for", "They used too many significant digits when they weighed the chalk", "Some of their chalk washed down the drain before it was weighed"], "answer": "A", "answer_text": "Their chalk was still damp, so water was weighed along with it", "exp": "A percent yield above 100% means the balance read more mass than the recipe allows, and leftover water in the filter paper is the usual reason, because that water is weighed as if it were product. A reaction cannot exceed what its limiting reactant allows, spilling product would push the percent yield below 100%, and extra digits change only how a number is written, not how big it is."}, {"id": 53, "level": "Beginner", "tag": "Molar Volume and Gas Stoichiometry", "stem": "At 0 °C and 1 atm, one mole of any gas takes up 22.4 L. You have 3.00 mol of hydrogen gas ready for the escape balloon. What volume does it occupy at those conditions?", "options": ["7.47 L", "22.4 L", "67.2 L", "0.134 L"], "answer": "C", "answer_text": "67.2 L", "exp": "Multiply so moles cancel: 3.00 mol × (22.4 L / 1 mol) = 67.2 L, and both numbers carry 3 significant digits, so the answer keeps three. The value 0.134 L comes from dividing the moles by 22.4 L/mol, 7.47 L comes from dividing 22.4 by 3.00, and 22.4 L is the volume of just one mole."}, {"id": 54, "level": "Beginner", "tag": "Molar Volume and Gas Stoichiometry", "stem": "At 0 °C and 1 atm, one mole of any gas takes up 22.4 L. The prototype balloon fills with 33.6 L of carbon dioxide. How many moles of carbon dioxide is that?", "options": ["753 mol", "0.667 mol", "1.50 mol", "15.0 mol"], "answer": "C", "answer_text": "1.50 mol", "exp": "Divide so liters cancel: 33.6 L × (1 mol / 22.4 L) = 1.50 mol, with 3 significant digits because both values carry three. The value 0.667 mol comes from dividing 22.4 by 33.6, 753 mol comes from multiplying instead of dividing, and 15.0 mol misplaces the decimal point."}, {"id": 55, "level": "Intermediate", "tag": "Reading a Balanced Equation", "stem": "The Alchemist writes the rusting recipe as 4Fe + 3O₂ → 2Fe₂O₃. For the Philosopher's Stone he needs exactly 8 mol of Fe₂O₃, so the whole recipe has to be scaled up. Which scaled recipe is correct?", "options": ["16 mol Fe + 12 mol O₂ → 8 mol Fe₂O₃", "4 mol Fe + 3 mol O₂ → 8 mol Fe₂O₃", "12 mol Fe + 16 mol O₂ → 8 mol Fe₂O₃", "8 mol Fe + 6 mol O₂ → 8 mol Fe₂O₃"], "answer": "A", "answer_text": "16 mol Fe + 12 mol O₂ → 8 mol Fe₂O₃", "exp": "Eight moles of Fe₂O₃ is 4 times the 2 mol in the recipe, so every coefficient is multiplied by the same 4: 4 × 4 mol Fe = 16 mol Fe and 4 × 3 mol O₂ = 12 mol O₂. The set 8 mol Fe + 6 mol O₂ only doubles the recipe, 4 mol Fe + 3 mol O₂ scales the product but leaves the reactants alone, and 12 mol Fe + 16 mol O₂ swaps the two reactant coefficients."}, {"id": 56, "level": "Intermediate", "tag": "Reading a Balanced Equation", "stem": "In the Sack of Silver reaction, 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s), the apprentice reacts 3.40 g of AgNO₃ with 0.64 g of Cu on a balance that reads to 0.01 g. Both reactants are used up and 2.16 g of Ag is collected. By the law of conservation of mass, what mass of Cu(NO₃)₂ formed?", "options": ["4.04 g of Cu(NO₃)₂", "1.88 g of Cu(NO₃)₂", "2.16 g of Cu(NO₃)₂", "1.9 g of Cu(NO₃)₂"], "answer": "B", "answer_text": "1.88 g of Cu(NO₃)₂", "exp": "Mass in must equal mass out: 3.40 g + 0.64 g = 4.04 g total, so the Cu(NO₃)₂ is 4.04 g − 2.16 g = 1.88 g. Adding and subtracting keeps the fewest decimal places, and every mass here is known to the hundredths place, so 1.9 g throws away a decimal place the balance actually supplies; 4.04 g is the combined reactant mass and 2.16 g is the silver that was already weighed separately."}, {"id": 57, "level": "Intermediate", "tag": "Reading a Balanced Equation", "stem": "Lemac scribbles the iron and copper (II) chloride recipe four different ways on the workshop wall. Only one of them is balanced AND written in the lowest whole-number ratio. Which one is it?", "options": ["2Fe + 3CuCl₂ → 2FeCl₃ + 2Cu", "4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu", "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu", "Fe + CuCl₂ → FeCl₃ + Cu"], "answer": "C", "answer_text": "2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu", "exp": "Counting atoms in 2Fe + 3CuCl₂ → 2FeCl₃ + 3Cu gives 2 Fe, 3 Cu and 6 Cl on each side, and 2, 3, 2, 3 have no common factor left to divide out. Fe + CuCl₂ → FeCl₃ + Cu has 2 Cl on the left but 3 on the right, 4Fe + 6CuCl₂ → 4FeCl₃ + 6Cu does balance but every coefficient can still be divided by 2, and 2Fe + 3CuCl₂ → 2FeCl₃ + 2Cu leaves 3 Cu on the left against only 2 Cu on the right."}, {"id": 58, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "Aqua Verde is copper (II) sulfate solution, and the foil that fell in reacts as 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). You know the moles of Al and you want the moles of Cu. Which ratio from the coefficients belongs in the calculation?", "options": ["3 mol Cu / 2 mol Al", "2 mol Al / 3 mol Cu", "3 mol Cu / 3 mol CuSO₄", "1 mol Cu / 1 mol Al"], "answer": "A", "answer_text": "3 mol Cu / 2 mol Al", "exp": "The unit you start with goes on the bottom so it cancels and the unit you want goes on top: mol Al × (3 mol Cu / 2 mol Al) leaves mol Cu. Using 2 mol Al / 3 mol Cu flips the ratio so nothing cancels, 3 mol Cu / 3 mol CuSO₄ starts from copper (II) sulfate instead of aluminum, and 1 mol Cu / 1 mol Al ignores the coefficients the recipe gives you."}, {"id": 59, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "One of the Alchemist's demonstration reactions is 2KI + Pb(NO₃)₂ → 2KNO₃ + PbI₂, which drops a bright yellow solid. You have measured the moles of KI and want the moles of PbI₂. Which ratio from the coefficients belongs in the calculation?", "options": ["2 mol PbI₂ / 1 mol KI", "1 mol PbI₂ / 1 mol KI", "2 mol KI / 1 mol PbI₂", "1 mol PbI₂ / 2 mol KI"], "answer": "D", "answer_text": "1 mol PbI₂ / 2 mol KI", "exp": "KI has to cancel, so it goes on the bottom: mol KI × (1 mol PbI₂ / 2 mol KI) leaves mol PbI₂. The ratio 2 mol KI / 1 mol PbI₂ is upside down and cancels nothing, 2 mol PbI₂ / 1 mol KI reads the coefficients backwards and would predict twice as much solid as KI supplied, and 1 mol PbI₂ / 1 mol KI throws the coefficient 2 away entirely."}, {"id": 60, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "The prototype balloon is inflated by C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(l). For every 1 mol of citric acid that reacts, how many moles of gas are produced to lift the balloon?", "options": ["3 mol of CO₂, the only product marked (g)", "9 mol of gas, adding up all three products", "1 mol of gas, matching the 1 mol of acid", "6 mol of gas, adding in the 3 mol of H₂O(l)"], "answer": "A", "answer_text": "3 mol of CO₂, the only product marked (g)", "exp": "The coefficient in front of CO₂ is 3 and CO₂ is the only product labelled (g), so 1 mol of citric acid gives 3 mol of gas. Counting the water as well gives 6 mol but H₂O is written (l), so it is a liquid and lifts nothing; 1 mol simply copies the coefficient of the acid, and 9 mol adds in the sodium citrate too, which is dissolved in the flask."}, {"id": 61, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "The escape balloon is filled using Fe + 2HCl → FeCl₂ + H₂. Which statement reads the coefficients of this recipe correctly?", "options": ["2 mol of Fe are needed for every 1 mol of HCl", "1 mol of HCl is needed for every 2 mol of Fe", "2 mol of H₂ are made for every 1 mol of Fe", "2 mol of HCl are needed for every 1 mol of Fe"], "answer": "D", "answer_text": "2 mol of HCl are needed for every 1 mol of Fe", "exp": "The coefficients read 1 Fe to 2 HCl to 1 FeCl₂ to 1 H₂, so each mole of iron consumes 2 mol of HCl. Saying 1 mol of HCl per 2 mol of Fe or 2 mol of Fe per 1 mol of HCl both flip that ratio upside down, and 2 mol of H₂ per 1 mol of Fe moves the coefficient 2 onto the wrong substance, since H₂ has an understood coefficient of 1."}, {"id": 62, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "Rust forms by 4Fe + 3O₂ → 2Fe₂O₃. How much O₂ does this recipe call for per mole of Fe₂O₃ produced?", "options": ["1.5 mol O₂ for every 1 mol Fe₂O₃", "2 mol O₂ for every 1 mol Fe₂O₃", "3 mol O₂ for every 1 mol Fe₂O₃", "0.67 mol O₂ for every 1 mol Fe₂O₃"], "answer": "A", "answer_text": "1.5 mol O₂ for every 1 mol Fe₂O₃", "exp": "The coefficients give 3 mol O₂ for 2 mol Fe₂O₃, and 3 mol O₂ / 2 mol Fe₂O₃ = 1.5 mol O₂ per mole of Fe₂O₃; coefficients are exact counts, so this 1.5 never limits the digits in a later answer. The value 0.67 is 2/3, the flipped ratio, while 3 and 2 each quote one coefficient by itself without dividing by the other."}, {"id": 63, "level": "Intermediate", "tag": "Mole Ratios from Coefficients", "stem": "To make a sack of silver for Lemac you use 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). You know the moles of Cu you dropped in and want the moles of Ag produced. Which ratio from the coefficients belongs in the calculation?", "options": ["2 mol Ag / 2 mol AgNO₃", "2 mol Ag / 1 mol Cu", "1 mol Cu / 2 mol Ag", "1 mol Ag / 1 mol Cu"], "answer": "B", "answer_text": "2 mol Ag / 1 mol Cu", "exp": "Copper has to cancel, so mol Cu × (2 mol Ag / 1 mol Cu) leaves mol Ag, and the recipe really does make two silver atoms per copper atom. The ratio 1 mol Cu / 2 mol Ag is upside down, 2 mol Ag / 2 mol AgNO₃ is a true ratio but starts from silver nitrate rather than from the copper you measured, and 1 mol Ag / 1 mol Cu ignores the coefficient 2 in front of Ag."}, {"id": 64, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "A scrap of aluminum foil falls into Aqua Verde: 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). If 0.480 mol of Al reacts with excess copper (II) sulfate, how many moles of copper appear?", "options": ["0.480 mol of Cu", "0.320 mol of Cu", "0.720 mol of Cu", "0.72 mol of Cu"], "answer": "C", "answer_text": "0.720 mol of Cu", "exp": "0.480 mol Al × (3 mol Cu / 2 mol Al) = 0.720 mol Cu, and the coefficients are exact counts, so the answer keeps the three digits of the 0.480 mol measurement, trailing zero included. Writing 0.72 mol reports only two digits when the data supports three, 0.320 mol comes from using 2 mol Al / 3 mol Cu upside down, and 0.480 mol skips the ratio altogether."}, {"id": 65, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "Heating black copper (II) oxide drives off oxygen: 4CuO → 2Cu₂O + O₂. To collect 0.250 mol of O₂, how many moles of CuO must decompose?", "options": ["1.00 mol of CuO", "0.0625 mol of CuO", "0.500 mol of CuO", "1 mol of CuO"], "answer": "A", "answer_text": "1.00 mol of CuO", "exp": "0.250 mol O₂ × (4 mol CuO / 1 mol O₂) = 1.00 mol CuO, and since the coefficients are exact, the three digits of 0.250 mol carry through and must be shown as 1.00. Writing 1 mol displays only one digit, 0.500 mol uses the Cu₂O coefficient of 2 instead of the CuO coefficient of 4, and 0.0625 mol comes from dividing by 4 instead of multiplying."}, {"id": 66, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "The workshop lamp burns methane: CH₄ + 2O₂ → CO₂ + 2H₂O. How many moles of O₂ are needed to burn 3.60 mol of CH₄ completely?", "options": ["3.60 mol of O₂", "1.80 mol of O₂", "7.2 mol of O₂", "7.20 mol of O₂"], "answer": "D", "answer_text": "7.20 mol of O₂", "exp": "3.60 mol CH₄ × (2 mol O₂ / 1 mol CH₄) = 7.20 mol O₂, and the exact coefficient 2 does not limit digits, so the three digits of 3.60 mol are kept. Reporting 7.2 mol drops to two digits, 1.80 mol comes from dividing by 2 rather than multiplying, and 3.60 mol leaves the ratio out completely."}, {"id": 67, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "Presenting the Philosopher's Stone uses 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). If 6.0 mol of Mg reacts with excess gold (III) chloride, how many moles of gold form?", "options": ["6.0 mol of Au", "9.0 mol of Au", "4.0 mol of Au", "4 mol of Au"], "answer": "C", "answer_text": "4.0 mol of Au", "exp": "6.0 mol Mg × (2 mol Au / 3 mol Mg) = 4.0 mol Au, and because coefficients are exact the answer keeps the two digits of 6.0 mol. Writing 4 mol shows only one digit, 9.0 mol comes from flipping the ratio to 3 mol Mg / 2 mol Au, and 6.0 mol assumes one mole of gold per mole of magnesium."}, {"id": 68, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "Titanium for the balloon frame is made by 2Mg + TiCl₄ → Ti + 2MgCl₂. How many moles of Mg are required to react with 0.145 mol of TiCl₄?", "options": ["0.290 mol of Mg", "0.145 mol of Mg", "0.29 mol of Mg", "0.0725 mol of Mg"], "answer": "A", "answer_text": "0.290 mol of Mg", "exp": "0.145 mol TiCl₄ × (2 mol Mg / 1 mol TiCl₄) = 0.290 mol Mg, and the exact coefficient 2 leaves the three digits of 0.145 mol in place, so the trailing zero must be shown. Reporting 0.29 mol keeps only two digits, 0.0725 mol comes from dividing by 2 instead of multiplying, and 0.145 mol ignores the ratio."}, {"id": 69, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "Hydrogen for the escape balloon comes from Fe + 2HCl → FeCl₂ + H₂. How many moles of HCl are needed to produce 0.0625 mol of H₂?", "options": ["0.13 mol of HCl", "0.0625 mol of HCl", "0.0313 mol of HCl", "0.125 mol of HCl"], "answer": "D", "answer_text": "0.125 mol of HCl", "exp": "0.0625 mol H₂ × (2 mol HCl / 1 mol H₂) = 0.125 mol HCl, and the exact coefficient 2 does not cost any digits, so three digits are reported. Writing 0.13 mol rounds away a digit the measurement supports, 0.0313 mol comes from dividing by 2 instead of multiplying, and 0.0625 mol assumes a one-to-one recipe."}, {"id": 70, "level": "Intermediate", "tag": "Mole-to-Mole Conversions", "stem": "Iron left in the damp workshop rusts by 4Fe + 3O₂ → 2Fe₂O₃. If 1.24 mol of Fe rusts completely, how many moles of Fe₂O₃ form?", "options": ["0.620 mol of Fe₂O₃", "0.62 mol of Fe₂O₃", "2.48 mol of Fe₂O₃", "0.930 mol of Fe₂O₃"], "answer": "A", "answer_text": "0.620 mol of Fe₂O₃", "exp": "1.24 mol Fe × (2 mol Fe₂O₃ / 4 mol Fe) = 0.620 mol Fe₂O₃, and the exact coefficients keep the three digits of 1.24 mol, so the trailing zero belongs in the answer. Reporting 0.62 mol shows only two digits, 0.930 mol uses the O₂ ratio of 3/4 by mistake, and 2.48 mol comes from turning the ratio upside down to 4 mol Fe₂O₃ / 2 mol Fe."}, {"id": 71, "level": "Intermediate", "tag": "Mass and Moles", "stem": "Lemac tosses you 20.0 g of lead and demands gold. The molar mass of Pb is 207.2 g/mol. How many moles of lead did he give you?", "options": ["0.097 mol of Pb", "0.0965 mol of Pb", "0.09653 mol of Pb", "4.14 × 10³ mol of Pb"], "answer": "B", "answer_text": "0.0965 mol of Pb", "exp": "Put grams on top and the molar mass underneath so grams cancel: 20.0 g Pb × (1 mol Pb / 207.2 g Pb) = 0.096525 mol, and 20.0 g has the fewest digits at three, so the answer is 0.0965 mol. Reporting 0.09653 mol keeps a fourth digit the balance cannot support, 0.097 mol keeps only two, and 4.14 × 10³ mol comes from multiplying by 207.2 g/mol instead of dividing."}, {"id": 72, "level": "Intermediate", "tag": "Mass and Moles", "stem": "Lemac then hands over 7.0 g of magnesium. The molar mass of Mg is 24.31 g/mol. How many moles of magnesium is that?", "options": ["0.288 mol of Mg", "1.7 × 10² mol of Mg", "0.2879 mol of Mg", "0.29 mol of Mg"], "answer": "D", "answer_text": "0.29 mol of Mg", "exp": "7.0 g Mg × (1 mol Mg / 24.31 g Mg) = 0.28795 mol, and 7.0 g carries only two digits while 24.31 g/mol carries four, so the answer is limited to two digits: 0.29 mol. The calculator readings 0.288 mol and 0.2879 mol claim three and four digits from a mass measured to only two, and 1.7 × 10² mol comes from multiplying by the molar mass instead of dividing."}, {"id": 73, "level": "Intermediate", "tag": "Mass and Moles", "stem": "The Philosopher's Stone demonstration calls for 0.250 mol of gold. The molar mass of Au is 196.97 g/mol. What mass of gold should you weigh out?", "options": ["0.00127 g of Au", "49.24 g of Au", "49 g of Au", "49.2 g of Au"], "answer": "D", "answer_text": "49.2 g of Au", "exp": "0.250 mol Au × (196.97 g Au / 1 mol Au) = 49.2425 g, and the mole count has the fewest digits at three, so the mass is 49.2 g. Reporting 49.24 g keeps a fourth digit the 0.250 mol cannot support, 49 g keeps only two, and 0.00127 g comes from dividing by the molar mass when the grams unit needed to be on top."}, {"id": 74, "level": "Intermediate", "tag": "Mass and Moles", "stem": "For the chalk lab you scrape together 8.0 g of calcium carbonate, CaCO₃, whose molar mass is 100.1 g/mol. How many moles of CaCO₃ do you have?", "options": ["0.080 mol of CaCO₃", "0.079 mol of CaCO₃", "8.0 × 10² mol of CaCO₃", "0.0799 mol of CaCO₃"], "answer": "A", "answer_text": "0.080 mol of CaCO₃", "exp": "8.0 g CaCO₃ × (1 mol CaCO₃ / 100.1 g CaCO₃) = 0.079920 mol, and 8.0 g has only two digits, so the answer rounds to 0.080 mol. The value 0.0799 mol reports three digits from a two-digit mass, 0.079 mol chops the calculator display instead of rounding it, and 8.0 × 10² mol comes from multiplying by 100.1 g/mol."}, {"id": 75, "level": "Intermediate", "tag": "Mass and Moles", "stem": "A recipe calls for 0.0799 mol of sodium carbonate, Na₂CO₃, molar mass 106.0 g/mol. What mass of Na₂CO₃ should the apprentice weigh out?", "options": ["8.47 g of Na₂CO₃", "8.5 g of Na₂CO₃", "8.469 g of Na₂CO₃", "7.54 × 10⁻⁴ g of Na₂CO₃"], "answer": "A", "answer_text": "8.47 g of Na₂CO₃", "exp": "0.0799 mol Na₂CO₃ × (106.0 g Na₂CO₃ / 1 mol Na₂CO₃) = 8.4694 g, and the mole count has three digits against the molar mass's four, so the mass is 8.47 g. Reporting 8.5 g drops to two digits, 8.469 g claims four, and 7.54 × 10⁻⁴ g comes from dividing by the molar mass when the moles needed to be multiplied by it."}, {"id": 76, "level": "Intermediate", "tag": "Mass and Moles", "stem": "A cylinder holds 3.50 g of hydrogen gas for the balloon. The molar mass of H₂ is 2.016 g/mol. How many moles of H₂ is that?", "options": ["7.06 mol of H₂", "1.74 mol of H₂", "1.7 mol of H₂", "1.736 mol of H₂"], "answer": "B", "answer_text": "1.74 mol of H₂", "exp": "3.50 g H₂ × (1 mol H₂ / 2.016 g H₂) = 1.73611 mol, and 3.50 g has three digits while 2.016 g/mol has four, so the answer is 1.74 mol. The value 1.736 mol keeps a fourth digit the mass cannot support, 1.7 mol keeps only two, and 7.06 mol comes from multiplying by 2.016 g/mol instead of dividing."}, {"id": 77, "level": "Intermediate", "tag": "Mass and Moles", "stem": "The workshop shelf lists 0.0450 mol of gold (III) chloride, AuCl₃, molar mass 303.3 g/mol. What mass of AuCl₃ is on the shelf?", "options": ["1.48 × 10⁻⁴ g of AuCl₃", "13.6 g of AuCl₃", "14 g of AuCl₃", "13.65 g of AuCl₃"], "answer": "B", "answer_text": "13.6 g of AuCl₃", "exp": "0.0450 mol AuCl₃ × (303.3 g AuCl₃ / 1 mol AuCl₃) = 13.6485 g, and 0.0450 mol has three digits, the fewest, so the mass is 13.6 g. Reporting 13.65 g keeps four digits, 14 g keeps only two, and 1.48 × 10⁻⁴ g comes from dividing by the molar mass instead of multiplying."}, {"id": 78, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "A scrap of aluminum foil weighing 8.10 g drops into excess Aqua Verde: 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). Molar masses: Al 26.98 g/mol, Cu 63.55 g/mol. What mass of reddish-brown copper should appear?", "options": ["12.7 g of Cu", "28.62 g of Cu", "28.6 g of Cu", "19.1 g of Cu"], "answer": "C", "answer_text": "28.6 g of Cu", "exp": "Go grams → moles → moles → grams without rounding in between: 8.10 g Al × (1 mol Al / 26.98 g Al) = 0.300222 mol Al, × (3 mol Cu / 2 mol Al) = 0.450334 mol Cu, × (63.55 g Cu / 1 mol Cu) = 28.6187 g, which is 28.6 g at three digits. The value 28.62 g claims four digits, 19.1 g leaves the ratio out and converts moles of Al straight to grams of Cu, and 12.7 g uses the flipped ratio 2 mol Cu / 3 mol Al."}, {"id": 79, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "Lemac's 20.0 g of lead is dropped into excess gold (III) chloride: 2AuCl₃(aq) + 3Pb(s) → 3PbCl₂(s) + 2Au(s). Molar masses: Pb 207.2 g/mol, Au 196.97 g/mol. What mass of gold can the lead produce?", "options": ["12.68 g of Au", "19.0 g of Au", "28.5 g of Au", "12.7 g of Au"], "answer": "D", "answer_text": "12.7 g of Au", "exp": "20.0 g Pb × (1 mol Pb / 207.2 g Pb) = 0.0965251 mol Pb, × (2 mol Au / 3 mol Pb) = 0.0643501 mol Au, × (196.97 g Au / 1 mol Au) = 12.675 g, and 20.0 g is the three-digit limit, so the answer is 12.7 g. Reporting 12.68 g claims a fourth digit, 28.5 g comes from flipping the ratio to 3 mol Au / 2 mol Pb, and 19.0 g skips the ratio entirely."}, {"id": 80, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "The chalk lab runs Na₂CO₃(aq) + CaCl₂(aq) → CaCO₃(s) + 2NaCl(aq), and you want 8.0 g of the CaCO₃ precipitate. Molar masses: CaCO₃ 100.1 g/mol, Na₂CO₃ 106.0 g/mol. What mass of Na₂CO₃ must react with excess CaCl₂?", "options": ["8.5 g of Na₂CO₃", "8.47 g of Na₂CO₃", "7.5 × 10⁻⁴ g of Na₂CO₃", "8.4 g of Na₂CO₃"], "answer": "A", "answer_text": "8.5 g of Na₂CO₃", "exp": "Carry the full calculator value through the chain: 8.0 g CaCO₃ × (1 mol CaCO₃ / 100.1 g CaCO₃) = 0.0799201 mol, × (1 mol Na₂CO₃ / 1 mol CaCO₃), × (106.0 g Na₂CO₃ / 1 mol Na₂CO₃) = 8.4715 g, and 8.0 g limits the answer to two digits, giving 8.5 g. The trap is 8.4 g, which comes from rounding the middle step to 0.079 mol before multiplying; 8.47 g reports three digits from a two-digit mass, and 7.5 × 10⁻⁴ g divides by 106.0 g/mol when it should multiply."}, {"id": 81, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "To make a sack of silver you drop 12.5 g of copper wire into excess silver nitrate: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Molar masses: Cu 63.55 g/mol, Ag 107.9 g/mol. What mass of silver should form?", "options": ["42.5 g of Ag", "21.2 g of Ag", "42.45 g of Ag", "42.4 g of Ag"], "answer": "D", "answer_text": "42.4 g of Ag", "exp": "12.5 g Cu × (1 mol Cu / 63.55 g Cu) = 0.1966955 mol Cu, × (2 mol Ag / 1 mol Cu) = 0.393391 mol Ag, × (107.9 g Ag / 1 mol Ag) = 42.4469 g, which is 42.4 g at the three digits 12.5 g allows. The trap is 42.5 g, which appears only if the first step is rounded to 0.197 mol before it is used; 42.45 g keeps four digits, and 21.2 g forgets the 2 mol Ag / 1 mol Cu ratio."}, {"id": 82, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "Magnesium ribbon burns with a blinding white light: 2Mg + O₂ → 2MgO. Molar masses: Mg 24.31 g/mol, O₂ 32.00 g/mol. What mass of O₂ is consumed when 4.86 g of Mg burns completely?", "options": ["3.2 g of O₂", "6.40 g of O₂", "3.199 g of O₂", "3.20 g of O₂"], "answer": "D", "answer_text": "3.20 g of O₂", "exp": "4.86 g Mg × (1 mol Mg / 24.31 g Mg) = 0.199918 mol Mg, × (1 mol O₂ / 2 mol Mg) = 0.0999588 mol O₂, × (32.00 g O₂ / 1 mol O₂) = 3.1987 g, and three digits gives 3.20 g with the trailing zero shown. Reporting 3.2 g shows only two digits, 3.199 g shows four, and 6.40 g comes from skipping the 1 mol O₂ / 2 mol Mg ratio."}, {"id": 83, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "A 25.0 g iron bar in the damp workshop rusts completely: 4Fe + 3O₂ → 2Fe₂O₃. Molar masses: Fe 55.85 g/mol, Fe₂O₃ 159.69 g/mol. What mass of Fe₂O₃ forms?", "options": ["35.7 g of Fe₂O₃", "143 g of Fe₂O₃", "71.5 g of Fe₂O₃", "35.74 g of Fe₂O₃"], "answer": "A", "answer_text": "35.7 g of Fe₂O₃", "exp": "25.0 g Fe × (1 mol Fe / 55.85 g Fe) = 0.447628 mol Fe, × (2 mol Fe₂O₃ / 4 mol Fe) = 0.223814 mol Fe₂O₃, × (159.69 g Fe₂O₃ / 1 mol Fe₂O₃) = 35.7408 g, or 35.7 g at three digits. The value 35.74 g claims four digits, 71.5 g leaves out the ratio, and 143 g uses the ratio upside down as 4 mol Fe₂O₃ / 2 mol Fe."}, {"id": 84, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "The workshop lamp burns methane: CH₄ + 2O₂ → CO₂ + 2H₂O. Molar masses: CH₄ 16.04 g/mol, O₂ 32.00 g/mol. What mass of O₂ is needed to burn 8.50 g of CH₄ completely?", "options": ["33.9 g of O₂", "8.48 g of O₂", "17.0 g of O₂", "33.92 g of O₂"], "answer": "A", "answer_text": "33.9 g of O₂", "exp": "8.50 g CH₄ × (1 mol CH₄ / 16.04 g CH₄) = 0.529925 mol CH₄, × (2 mol O₂ / 1 mol CH₄) = 1.05985 mol O₂, × (32.00 g O₂ / 1 mol O₂) = 33.9152 g, which is 33.9 g at three digits. The value 33.92 g keeps four digits, 17.0 g skips the ratio, and 8.48 g comes from dividing by 2 when the recipe says to multiply by 2."}, {"id": 85, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "The yellow-precipitate demonstration is 2KI + Pb(NO₃)₂ → 2KNO₃ + PbI₂. Molar masses: KI 166.0 g/mol, KNO₃ 101.1 g/mol. What mass of KNO₃ is produced when 5.20 g of KI reacts with excess Pb(NO₃)₂?", "options": ["6.33 g of KNO₃", "3.17 g of KNO₃", "3.2 g of KNO₃", "3.167 g of KNO₃"], "answer": "B", "answer_text": "3.17 g of KNO₃", "exp": "5.20 g KI × (1 mol KI / 166.0 g KI) = 0.0313253 mol KI, × (2 mol KNO₃ / 2 mol KI) = 0.0313253 mol KNO₃, × (101.1 g KNO₃ / 1 mol KNO₃) = 3.16699 g, or 3.17 g at three digits. Reporting 3.167 g claims a fourth digit, 3.2 g reports only two, and 6.33 g treats the ratio as 2 mol KNO₃ / 1 mol KI when both coefficients are 2."}, {"id": 86, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "The prototype balloon runs on C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(l). Molar masses: NaHCO₃ 84.0 g/mol, citric acid C₆H₈O₇ 192.1 g/mol. What mass of citric acid exactly consumes 1.84 g of baking soda?", "options": ["0.439 g of citric acid", "1.40 g of citric acid", "12.6 g of citric acid", "1.4 g of citric acid"], "answer": "B", "answer_text": "1.40 g of citric acid", "exp": "1.84 g NaHCO₃ × (1 mol NaHCO₃ / 84.0 g NaHCO₃) = 0.0219048 mol, × (1 mol C₆H₈O₇ / 3 mol NaHCO₃) = 0.0073016 mol acid, × (192.1 g C₆H₈O₇ / 1 mol C₆H₈O₇) = 1.40263 g, so 1.40 g at three digits, trailing zero shown. Writing 1.4 g reports only two digits, 12.6 g multiplies by 3 instead of dividing, and 0.439 g uses 60.1 g/mol, which is the molar mass of acetic acid, not citric acid."}, {"id": 87, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "Lemac's last gift is 16.0 g of iron, which you drop into excess gold (III) chloride: Fe(s) + AuCl₃(aq) → FeCl₃(aq) + Au(s). Molar masses: Fe 55.85 g/mol, Au 196.97 g/mol. What mass of gold can the iron produce?", "options": ["56.4 g of Au", "4.54 g of Au", "56.43 g of Au", "56 g of Au"], "answer": "A", "answer_text": "56.4 g of Au", "exp": "16.0 g Fe × (1 mol Fe / 55.85 g Fe) = 0.286481 mol Fe, × (1 mol Au / 1 mol Fe), × (196.97 g Au / 1 mol Au) = 56.4283 g, and 16.0 g limits the answer to three digits, giving 56.4 g. Reporting 56.43 g claims four digits, 56 g reports only two, and 4.54 g comes from swapping the molar masses so that the iron is divided by 196.97 g/mol."}, {"id": 88, "level": "Intermediate", "tag": "Mass-to-Mass Stoichiometry", "stem": "Hydrogen for the escape balloon is made by Fe + 2HCl → FeCl₂ + H₂. Molar masses: Fe 55.85 g/mol, H₂ 2.016 g/mol. What mass of H₂ is produced when 22.5 g of Fe reacts with excess HCl?", "options": ["0.812 g of H₂", "0.8122 g of H₂", "0.81 g of H₂", "1.62 g of H₂"], "answer": "A", "answer_text": "0.812 g of H₂", "exp": "22.5 g Fe × (1 mol Fe / 55.85 g Fe) = 0.402865 mol Fe, × (1 mol H₂ / 1 mol Fe), × (2.016 g H₂ / 1 mol H₂) = 0.812175 g, which is 0.812 g at three digits. The value 0.8122 g claims four digits, 0.81 g claims only two, and 1.62 g comes from using the HCl coefficient of 2 as though two moles of H₂ were made per mole of Fe."}, {"id": 89, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "Day 1: 5.40 g of Al foil is dropped into a beaker holding 20.0 g of dissolved anhydrous CuSO₄. The recipe is 3CuSO₄(aq) + 2Al(s) → Al₂(SO₄)₃(aq) + 3Cu(s). Molar masses: Al 26.98 g/mol, CuSO₄ 159.6 g/mol, Cu 63.55 g/mol. Work the copper out from each reactant. What mass of copper actually forms, and which reactant is limiting?", "options": ["19.1 g of Cu; CuSO₄ is the limiting reactant", "27.1 g of Cu; the two amounts are added together", "19.1 g of Cu; Al is the limiting reactant", "7.96 g of Cu; CuSO₄ is the limiting reactant"], "answer": "D", "answer_text": "7.96 g of Cu; CuSO₄ is the limiting reactant", "exp": "From the foil: 5.40 g Al × (1 mol Al / 26.98 g Al) × (3 mol Cu / 2 mol Al) × (63.55 g Cu / 1 mol Cu) = 19.1 g Cu; from the solution: 20.0 g CuSO₄ × (1 mol CuSO₄ / 159.6 g CuSO₄) × (3 mol Cu / 3 mol CuSO₄) × (63.55 g Cu / 1 mol Cu) = 7.96 g Cu. The smaller answer is the one the beaker can actually deliver, so 7.96 g of copper forms and CuSO₄ is limiting; 19.1 g is the larger answer, which would need more copper (II) sulfate than is there, and adding the two answers to get 27.1 g counts the same copper twice."}, {"id": 90, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "Lemac supplies 20.0 g of Pb and 15.0 g of AuCl₃ for 2AuCl₃(aq) + 3Pb(s) → 3PbCl₂(s) + 2Au(s). Molar masses: Pb 207.2 g/mol, AuCl₃ 303.3 g/mol, Au 196.97 g/mol. What mass of gold actually forms, and which reactant is limiting?", "options": ["9.74 g of Au; AuCl₃ is the limiting reactant", "12.7 g of Au; AuCl₃ is the limiting reactant", "9.74 g of Au; Pb is the limiting reactant", "12.7 g of Au; Pb is the limiting reactant"], "answer": "A", "answer_text": "9.74 g of Au; AuCl₃ is the limiting reactant", "exp": "From the lead: 20.0 g Pb × (1 mol Pb / 207.2 g Pb) × (2 mol Au / 3 mol Pb) × (196.97 g Au / 1 mol Au) = 12.7 g Au; from the gold (III) chloride: 15.0 g AuCl₃ × (1 mol AuCl₃ / 303.3 g AuCl₃) × (2 mol Au / 2 mol AuCl₃) × (196.97 g Au / 1 mol Au) = 9.74 g Au. The smaller number is the real yield, so 9.74 g of gold forms and the AuCl₃ runs out first; picking 12.7 g takes the larger answer, and pairing 9.74 g with Pb names the reactant that is left in excess."}, {"id": 91, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "Lemac's 7.0 g of Mg is added to 20.0 g of AuCl₃: 2AuCl₃(aq) + 3Mg(s) → 3MgCl₂(aq) + 2Au(s). Molar masses: Mg 24.31 g/mol, AuCl₃ 303.3 g/mol, Au 196.97 g/mol. The magnesium route gives 38 g of gold and the gold (III) chloride route gives 13.0 g. Which reactant is limiting, and why?", "options": ["AuCl₃, because 13.0 g is the smaller answer", "Mg, because 38 g of gold is the larger answer", "Mg, because 13.0 g of gold is the smaller answer", "AuCl₃, because 38 g of gold is the larger answer"], "answer": "A", "answer_text": "AuCl₃, because 13.0 g is the smaller answer", "exp": "Working the product out both ways gives 7.0 g Mg × (1 mol Mg / 24.31 g Mg) × (2 mol Au / 3 mol Mg) × (196.97 g Au / 1 mol Au) = 38 g Au and 20.0 g AuCl₃ × (1 mol AuCl₃ / 303.3 g AuCl₃) × (2 mol Au / 2 mol AuCl₃) × (196.97 g Au / 1 mol Au) = 13.0 g Au. The smaller answer is the one that can actually be made, so the AuCl₃ is limiting and only 13.0 g of gold appears; naming Mg attaches the limit to the reactant still sitting in excess, and choosing 38 g takes the larger number, which the flask has no chloride left to supply."}, {"id": 92, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "You stir 2.00 g of Cu into a solution containing 8.50 g of AgNO₃: 2AgNO₃(aq) + Cu(s) → Cu(NO₃)₂(aq) + 2Ag(s). Molar masses: Cu 63.55 g/mol, AgNO₃ 169.9 g/mol, Ag 107.9 g/mol. What mass of silver actually forms, and which reactant is limiting?", "options": ["6.79 g of Ag; Cu is the limiting reactant", "5.40 g of Ag; AgNO₃ is the limiting reactant", "6.79 g of Ag; AgNO₃ is the limiting reactant", "12.2 g of Ag; the two amounts are added together"], "answer": "B", "answer_text": "5.40 g of Ag; AgNO₃ is the limiting reactant", "exp": "From the silver nitrate: 8.50 g AgNO₃ × (1 mol AgNO₃ / 169.9 g AgNO₃) × (2 mol Ag / 2 mol AgNO₃) × (107.9 g Ag / 1 mol Ag) = 5.40 g Ag; from the copper: 2.00 g Cu × (1 mol Cu / 63.55 g Cu) × (2 mol Ag / 1 mol Cu) × (107.9 g Ag / 1 mol Ag) = 6.79 g Ag. The smaller answer wins, so 5.40 g of silver forms and AgNO₃ is limiting; 6.79 g is the larger answer, and 12.2 g comes from adding the two predictions instead of comparing them."}, {"id": 93, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "The lamp is fed 2.00 mol of CH₄ and 3.00 mol of O₂ and then lit: CH₄ + 2O₂ → CO₂ + 2H₂O. How many moles of CO₂ actually form, and which reactant is limiting?", "options": ["1.50 mol of CO₂; O₂ is the limiting reactant", "2.00 mol of CO₂; CH₄ is the limiting reactant", "2.00 mol of CO₂; O₂ is the limiting reactant", "3.50 mol of CO₂; neither reactant is limiting"], "answer": "A", "answer_text": "1.50 mol of CO₂; O₂ is the limiting reactant", "exp": "From the methane: 2.00 mol CH₄ × (1 mol CO₂ / 1 mol CH₄) = 2.00 mol CO₂; from the oxygen: 3.00 mol O₂ × (1 mol CO₂ / 2 mol O₂) = 1.50 mol CO₂. The smaller result is what the lamp can really make, so 1.50 mol of CO₂ forms and O₂ is limiting; 2.00 mol is the larger prediction and would require 4.00 mol of O₂, and 3.50 mol comes from adding the two predictions, 2.00 mol and 1.50 mol, instead of comparing them."}, {"id": 94, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "A sealed jar holds 1.20 mol of Fe and 1.20 mol of O₂, and the iron is allowed to rust: 4Fe + 3O₂ → 2Fe₂O₃. How many moles of Fe₂O₃ actually form, and which reactant is limiting?", "options": ["0.60 mol of Fe₂O₃; Fe is the limiting reactant", "0.800 mol of Fe₂O₃; O₂ is the limiting reactant", "0.800 mol of Fe₂O₃; Fe is the limiting reactant", "0.600 mol of Fe₂O₃; Fe is the limiting reactant"], "answer": "D", "answer_text": "0.600 mol of Fe₂O₃; Fe is the limiting reactant", "exp": "From the iron: 1.20 mol Fe × (2 mol Fe₂O₃ / 4 mol Fe) = 0.600 mol Fe₂O₃; from the oxygen: 1.20 mol O₂ × (2 mol Fe₂O₃ / 3 mol O₂) = 0.800 mol Fe₂O₃. The smaller answer is the real yield, so 0.600 mol forms and the Fe is limiting; 0.800 mol is the larger prediction, and 0.60 mol is the right number displayed with only two digits when the exact coefficients let 1.20 mol keep three."}, {"id": 95, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "A demonstration mixes 0.150 mol of KI with 0.100 mol of Pb(NO₃)₂: 2KI + Pb(NO₃)₂ → 2KNO₃ + PbI₂. How many moles of the yellow PbI₂ actually form, and which reactant is limiting?", "options": ["0.100 mol of PbI₂; Pb(NO₃)₂ is limiting", "0.075 mol of PbI₂; KI is limiting", "0.100 mol of PbI₂; KI is limiting", "0.0750 mol of PbI₂; KI is limiting"], "answer": "D", "answer_text": "0.0750 mol of PbI₂; KI is limiting", "exp": "From the iodide: 0.150 mol KI × (1 mol PbI₂ / 2 mol KI) = 0.0750 mol PbI₂; from the nitrate: 0.100 mol Pb(NO₃)₂ × (1 mol PbI₂ / 1 mol Pb(NO₃)₂) = 0.100 mol PbI₂. The smaller answer is the actual yield, so 0.0750 mol of PbI₂ forms and KI is limiting; 0.100 mol is the larger prediction, and 0.075 mol is the right value shown with two digits when the three digits of 0.150 mol survive the exact coefficients."}, {"id": 96, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "The prototype balloon is charged with 0.0100 mol of citric acid and 0.0240 mol of baking soda: C₆H₈O₇(aq) + 3NaHCO₃(aq) → Na₃C₆H₅O₇(aq) + 3CO₂(g) + 3H₂O(l). How many moles of CO₂ actually inflate the balloon, and which reactant is limiting?", "options": ["0.0300 mol of CO₂; citric acid is limiting", "0.0240 mol of CO₂; NaHCO₃ is limiting", "0.0300 mol of CO₂; NaHCO₃ is limiting", "0.0540 mol of CO₂; the two answers added up"], "answer": "B", "answer_text": "0.0240 mol of CO₂; NaHCO₃ is limiting", "exp": "From the acid: 0.0100 mol C₆H₈O₇ × (3 mol CO₂ / 1 mol C₆H₈O₇) = 0.0300 mol CO₂; from the baking soda: 0.0240 mol NaHCO₃ × (3 mol CO₂ / 3 mol NaHCO₃) = 0.0240 mol CO₂, since those two coefficients are both 3. The smaller answer is the gas the balloon really gets, so 0.0240 mol of CO₂ forms and NaHCO₃ is limiting; 0.0300 mol is the larger prediction, and 0.0540 mol comes from adding the two predictions instead of comparing them."}, {"id": 97, "level": "Intermediate", "tag": "Limiting Reactant", "stem": "For 2Mg + TiCl₄ → Ti + 2MgCl₂ the apprentice works the product out from each starting amount and gets 0.480 mol of MgCl₂ from the magnesium and 0.360 mol of MgCl₂ from the TiCl₄. What should he report?", "options": ["0.420 mol of MgCl₂; the average of the two answers", "0.480 mol of MgCl₂; Mg is the limiting reactant", "0.360 mol of MgCl₂; TiCl₄ is the limiting reactant", "0.840 mol of MgCl₂; the two answers added together"], "answer": "C", "answer_text": "0.360 mol of MgCl₂; TiCl₄ is the limiting reactant", "exp": "When the product is worked out both ways, the smaller answer is the one the flask can actually deliver, so 0.360 mol of MgCl₂ is the yield and the TiCl₄ that produced it is the limiting reactant. Reporting 0.480 mol takes the larger answer, which would need more TiCl₄ than is present; 0.840 mol adds the two predictions and 0.420 mol averages them, but each prediction is the whole yield calculated from one reactant, so they are never combined."}, {"id": 98, "level": "Intermediate", "tag": "Theoretical and Percent Yield", "stem": "Your chalk lab has a theoretical yield of 8.47 g of CaCO₃, and after filtering and drying you weigh 6.85 g. Percent yield = actual / theoretical × 100%. What is the percent yield?
