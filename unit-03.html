<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "On the periodic table, the vertical columns are called:", "options": ["blocks, named for the s, p, d, and f orbitals", "groups, also known as the chemical families", "periods, the same word used for the table's rows", "energy levels, one level for each row shown"], "answer": "B", "answer_text": "groups, also known as the chemical families", "exp": "On the periodic table, columns are called groups, and the objectives also call them chemical families. Rows are the periods, so calling a column a period swaps the two words; the s, p, d, and f blocks run across several columns, and an energy level is a place for electrons, not a part of the chart."}, {"id": 2, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "Silicon (Si) sits in the same column as tin (Sn), two rows above it. Silicon and tin are therefore in the same:", "options": ["f block", "d block", "group", "period"], "answer": "C", "answer_text": "group", "exp": "Elements stacked in the same column belong to the same group, which is why silicon and tin both have 4 valence electrons. Silicon is in Period 3 while tin is in Period 5, so they are not in the same period, and both are p block elements rather than d block or f block elements."}, {"id": 3, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "Groups 1 and 2, on the far left of the periodic table, make up which block?", "options": ["the s block", "the f block", "the p block", "the d block"], "answer": "A", "answer_text": "the s block", "exp": "The valence electrons of Groups 1 and 2 go into an s sublevel, which is why sodium ends in 3s¹ and calcium ends in 4s². The p block holds Groups 13 through 18, the d block holds the transition metals in the wide middle, and the f block is the pair of rows pulled out at the bottom."}, {"id": 4, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "Which statement correctly describes the layout of the periodic table?", "options": ["The columns are called blocks and the rows are called families.", "The columns are called periods and the rows are called groups.", "The columns are called groups and the rows are called periods.", "The columns are called orbitals and the rows are called shells."], "answer": "C", "answer_text": "The columns are called groups and the rows are called periods.", "exp": "Columns are groups and rows are periods, so tin sits in Group 14 and Period 5. Saying the columns are periods and the rows are groups reverses both words, and blocks, families, orbitals, and shells are not the names used for the rows of the chart."}, {"id": 5, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "Potassium (K) is found in Period 4 of the periodic table. How many energy levels hold electrons in a neutral potassium atom?", "options": ["19", "8", "2", "4"], "answer": "D", "answer_text": "4", "exp": "The period number tells you how many energy levels hold electrons, so a Period 4 element such as potassium uses 4 energy levels. The value 19 is potassium's atomic number, which is its proton count and its electron count, and 8 is the number of electrons the second energy level can hold."}, {"id": 6, "level": "Beginner", "tag": "Periodic Table Organization", "stem": "Tin (Sn) is in Period 5 of the periodic table. Which element shares that same period with tin?", "options": ["germanium (Ge)", "iodine (I)", "lead (Pb)", "carbon (C)"], "answer": "B", "answer_text": "iodine (I)", "exp": "Iodine sits in the same row as tin, so both elements are in Period 5. Carbon, germanium, and lead are all stacked in Group 14 with tin, but they sit in Periods 2, 4, and 6, so they share tin's column rather than its row."}, {"id": 7, "level": "Beginner", "tag": "Chemical Families", "stem": "Sodium (Na) and potassium (K) both sit in Group 1. What is this group of elements called?", "options": ["the alkali metals", "the alkaline earth metals", "the transition metals", "the noble gases"], "answer": "A", "answer_text": "the alkali metals", "exp": "Group 1 is the alkali metals, each with 1 valence electron in an s orbital and each very reactive in water. The alkaline earth metals are Group 2, the transition metals fill the middle of the table, and the noble gases are Group 18."}, {"id": 8, "level": "Beginner", "tag": "Chemical Families", "stem": "The halogens are found in Group 17 of the periodic table. How many valence electrons does a halogen atom have?", "options": ["1", "8", "7", "2"], "answer": "C", "answer_text": "7", "exp": "A halogen has 7 valence electrons, which you can count in chlorine's configuration 1s²2s²2p⁶3s²3p⁵ as 2 + 5 in the third energy level. A count of 8 belongs to the noble gases of Group 18, while 1 and 2 belong to the alkali metals and the alkaline earth metals."}, {"id": 9, "level": "Beginner", "tag": "Chemical Families", "stem": "Which statement best describes the noble gases of Group 18?", "options": ["They are brittle solids that react quickly.", "They are gases that are not reactive.", "They are gases that react quickly with water.", "They are shiny solids that are malleable."], "answer": "B", "answer_text": "They are gases that are not reactive.", "exp": "The Group 18 noble gases are gases at room temperature and are not reactive, which is why argon was named for the Greek word for lazy. Shiny, malleable solids describe the metal families, and brittle solids that react quickly describe the halogens rather than the noble gases."}, {"id": 10, "level": "Beginner", "tag": "Chemical Families", "stem": "Where are the transition metals found on the periodic table?", "options": ["in Groups 1 and 2 only", "in Groups 13 through 18", "in Groups 3 through 12", "in Group 17 and Group 18"], "answer": "C", "answer_text": "in Groups 3 through 12", "exp": "The transition metals fill the wide middle section of the table, Groups 3 through 12, and each has 1 or 2 valence electrons in an s orbital. Groups 1 and 2 are the alkali and alkaline earth metals, and Groups 13 through 18 include the halogens and the noble gases."}, {"id": 11, "level": "Beginner", "tag": "Chemical Families", "stem": "Magnesium (Mg) and calcium (Ca) were tested in distilled water and then in 1.0 M HCl, and both reacted far more strongly in the acid. Which of the chemical families do these two metals belong to?", "options": ["the halogens, found on the right of the table", "the transition metals of the wide middle block", "the alkali metals, the first column of the table", "the alkaline earth metals, the second column"], "answer": "D", "answer_text": "the alkaline earth metals, the second column", "exp": "The alkaline earth metals are reactive in water and very reactive in acid, which is exactly the pattern seen when the acid was added. The alkali metals sit one column to the left and hold only 1 valence electron, the halogens are nonmetals rather than metals, and the transition metals fill the wide middle block of the table."}, {"id": 12, "level": "Beginner", "tag": "Chemical Families", "stem": "Which statement describes the physical properties of the halogens?", "options": ["They are brittle as solids and often gases at room temperature.", "They are liquids at room temperature and have a metallic luster.", "They are shiny and malleable and conduct heat very well.", "They are dense solids that can be drawn out into a thin wire."], "answer": "A", "answer_text": "They are brittle as solids and often gases at room temperature.", "exp": "Halogens are nonmetals, so as solids they are brittle, and two of them — fluorine and chlorine — are gases at room temperature. Being shiny, malleable, and drawn out into wire are metal properties, and only bromine among the halogens is a liquid at room temperature."}, {"id": 13, "level": "Beginner", "tag": "Metals, Nonmetals, and Metalloids", "stem": "Which set of properties describes the metals on the periodic table?", "options": ["Earthy luster, malleable and ductile, and good conductors", "Metallic luster, brittle, and poor conductors of electricity", "Earthy luster, brittle, and usually gases at room temperature", "Metallic luster, malleable and ductile, and good conductors"], "answer": "D", "answer_text": "Metallic luster, malleable and ductile, and good conductors", "exp": "Metals have a metallic luster, can be hammered into sheets and drawn into wire, and conduct both heat and electricity well. Being brittle and a poor conductor describes a nonmetal, and an earthy luster is what students saw on the sulfur and carbon samples, not on the copper or magnesium."}, {"id": 14, "level": "Beginner", "tag": "Metals, Nonmetals, and Metalloids", "stem": "A sample of sulfur has a dull, earthy luster, crumbles when it is hammered, and does not light the conductivity tester. Sulfur is best classified as:", "options": ["a metal, since only metals are solid", "a nonmetal, since it is dull and brittle", "a noble gas, since it is not reactive", "a metalloid, since it is a solid element"], "answer": "B", "answer_text": "a nonmetal, since it is dull and brittle", "exp": "No metallic luster, no malleability, and no conductivity are all nonmetal properties, so sulfur is a nonmetal. A metalloid would still show a metallic luster and would conduct at least weakly, many nonmetals are solids too, and the noble gases are all gases in Group 18."}, {"id": 15, "level": "Beginner", "tag": "Metals, Nonmetals, and Metalloids", "stem": "Metalloids sit along the stair-step line of the periodic table. Which statement describes them?", "options": ["They have no luster and never conduct electricity.", "They are gases at room temperature like nonmetals.", "They have properties of metals and of nonmetals.", "They have every property that a true metal has."], "answer": "C", "answer_text": "They have properties of metals and of nonmetals.", "exp": "Metalloids such as silicon have a metallic luster and conduct heat and electricity, but not nearly as well as a metal, and they are brittle rather than malleable. That mix is why they are neither full metals nor full nonmetals, and metalloids are solids at room temperature, not gases."}, {"id": 16, "level": "Beginner", "tag": "Metals, Nonmetals, and Metalloids", "stem": "Metalloids such as silicon can be used as semi-conductors. What does a semi-conductor do?", "options": ["It conducts electricity only while it is being hammered.", "It stops conducting electricity as soon as it is heated.", "It conducts electricity better as its temperature increases.", "It conducts heat well but never conducts any electric current."], "answer": "C", "answer_text": "It conducts electricity better as its temperature increases.", "exp": "A semi-conductor conducts electricity better as its temperature increases, which is what makes silicon so useful inside a phone. Losing conductivity when heated is the opposite of that behavior, hammering changes shape rather than conductivity, and a semi-conductor does carry an electric current."}, {"id": 17, "level": "Beginner", "tag": "Metals, Nonmetals, and Metalloids", "stem": "Hydrogen (H) is printed on the far left side of the periodic table. Which statement about hydrogen is correct?", "options": ["It is a metal, because it is placed directly above lithium.", "It is a liquid at room temperature, in the same way mercury is.", "It is a metalloid, because it will conduct electricity well.", "It sits on the metal side of the table, but it is not a metal."], "answer": "D", "answer_text": "It sits on the metal side of the table, but it is not a metal.", "exp": "Hydrogen is listed as an exception: it is printed on the metal side of the table but it is not a metal. Its position above lithium does not make it a metal, it is not one of the metalloids along the stair-step line, and hydrogen is a gas at room temperature rather than a liquid like mercury."}, {"id": 18, "level": "Beginner", "tag": "History of the Periodic Table", "stem": "John Newlands arranged the known elements by atomic weight in 1864 and named the pattern he saw the Law of Octaves. What did he borrow the name “octave” from?", "options": ["Geometry, where an octagon closes after a fixed number of equal sides", "Music, where a scale returns to a similar note after a fixed number of steps", "Optics, where white light splits into a fixed number of visible colours", "Latin, where the root simply means “a list arranged in order of weight”"], "answer": "B", "answer_text": "Music, where a scale returns to a similar note after a fixed number of steps", "exp": "Newlands saw properties come back around at a regular interval, just as a musical scale returns to a similar-sounding note, so he borrowed the musical word octave. The Chemical Society of London mocked the comparison at the time; the pattern was only accepted after the noble gases were discovered and the missing column was filled in."}, {"id": 19, "level": "Beginner", "tag": "History of the Periodic Table", "stem": "Dmitri Mendeleev published his periodic table in 1869 and Julius Meyer published his in 1870. Both men ordered the elements by:", "options": ["number of neutrons", "atomic number", "density of the element", "atomic weight"], "answer": "D", "answer_text": "atomic weight", "exp": "Both chemists ordered the elements by atomic weight and then placed them in columns based on similar chemical properties. Ordering by atomic number was not possible until Moseley found a way to measure nuclear charge in 1913, and neutron counts and densities were never the basis for either table."}, {"id": 20, "level": "Beginner", "tag": "History of the Periodic Table", "stem": "Henry Moseley changed how the periodic table is built because he found a way to measure:", "options": ["the atomic number, or nuclear charge, of an element", "the density of a gas to two extra decimal places", "the atomic weight of a pure sample of any given element", "the number of neutrons packed into any nucleus"], "answer": "A", "answer_text": "the atomic number, or nuclear charge, of an element", "exp": "Moseley measured nuclear charge, which is the atomic number, and today's table of 118 elements is arranged by atomic number because of that work. Atomic weight was already what Mendeleev and Meyer used, neutron counting came much later, and measuring gas densities to extra decimals was Lord Rayleigh's project."}, {"id": 21, "level": "Beginner", "tag": "History of the Periodic Table", "stem": "By 1829 Johann Döbereiner noticed that when he took three elements with similar properties and ordered them by atomic weight, he could:", "options": ["predict the properties of one element from the other two", "measure the nuclear charge of each of the elements", "prove that every one of the elements was made of hard spheres", "arrange all 56 of the known elements into one column"], "answer": "A", "answer_text": "predict the properties of one element from the other two", "exp": "Döbereiner worked in sets of three, and the outer two elements let him predict the properties of the middle one. His hard-sphere ideas about atomic structure came from Dalton and were never something the triads proved; he built no single column of all the known elements, and nuclear charge could not be measured until Moseley."}, {"id": 22, "level": "Beginner", "tag": "History of the Periodic Table", "stem": "All of the noble gases had been discovered by 1900, which forced a whole new column to be added to the periodic table. Argon, the first one isolated, was discovered by:", "options": ["Joseph Priestley and Henry Cavendish", "Lord Rayleigh and William Ramsay", "Henry Moseley and John Newlands", "Dmitri Mendeleev and Julius Meyer"], "answer": "B", "answer_text": "Lord Rayleigh and William Ramsay", "exp": "Rayleigh found that two samples of pure nitrogen did not have the same density, and Ramsay helped him trace the difference to argon, atomic weight 39.95. Both men won 1904 Nobel Prizes for the work — Rayleigh in physics, Ramsay in chemistry. Mendeleev and Meyer built the first tables and never anticipated a non-reactive group, Moseley and Newlands worked on how to order the table, and Priestley and Cavendish studied gases a century earlier."}, {"id": 23, "level": "Beginner", "tag": "Electron Configuration", "stem": "The p sublevel is divided into 3 orbitals, and each orbital holds 2 electrons. What is the maximum number of electrons in a p sublevel?", "options": ["14", "6", "10", "2"], "answer": "B", "answer_text": "6", "exp": "Three orbitals holding 2 electrons each gives 3 × 2 = 6 electrons in a full p sublevel. A maximum of 2 belongs to an s sublevel, 10 belongs to the 5 orbitals of a d sublevel, and 14 belongs to the 7 orbitals of an f sublevel."}, {"id": 24, "level": "Beginner", "tag": "Electron Configuration", "stem": "A neutral silicon atom has 14 electrons. What is silicon's standard electron configuration?", "options": ["1s²2s²2p⁶3s²3p⁴", "1s²2s²2p⁶3s²3p⁶", "1s²2s⁴2p⁶3s²", "1s²2s²2p⁶3s²3p²"], "answer": "D", "answer_text": "1s²2s²2p⁶3s²3p²", "exp": "Adding the superscripts gives 2 + 2 + 6 + 2 + 2 = 14 electrons, which matches silicon's atomic number of 14. Ending in 3p⁴ totals 16 electrons, which is sulfur, ending in 3p⁶ totals 18, which is argon, and an s sublevel can never hold 4 electrons."}, {"id": 25, "level": "Beginner", "tag": "Electron Configuration", "stem": "Which element has the standard electron configuration 1s²2s²2p⁶3s¹?", "options": ["magnesium", "neon", "sodium", "lithium"], "answer": "C", "answer_text": "sodium", "exp": "The superscripts add to 2 + 2 + 6 + 1 = 11 electrons, so a neutral atom with this configuration has 11 protons and is sodium. Neon is 10 electrons and ends at 2p⁶, magnesium is 12 electrons and ends at 3s², and lithium is only 3 electrons, written 1s²2s¹."}, {"id": 26, "level": "Beginner", "tag": "Electron Configuration", "stem": "Tin (Sn) has the standard configuration 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p². What is tin's noble gas configuration?", "options": ["[Kr]5s²5p²", "[Ar]4d¹⁰5s²5p²", "[Xe]4d¹⁰5s²5p²", "[Kr]4d¹⁰5s²5p²"], "answer": "D", "answer_text": "[Kr]4d¹⁰5s²5p²", "exp": "Krypton accounts for tin's first 36 electrons, through 4p⁶, leaving 50 − 36 = 14 electrons to write out as 4d¹⁰5s²5p². Writing [Kr]5s²5p² leaves out the 10 d electrons, starting from [Ar] leaves 3d¹⁰4s²4p⁶ unaccounted for, and xenon comes after tin so it cannot be used as the shortcut."}, {"id": 27, "level": "Beginner", "tag": "Electron Configuration", "stem": "Which sublevel do electrons fill immediately before they begin filling the 3d sublevel?", "options": ["4d", "3p", "4s", "4p"], "answer": "C", "answer_text": "4s", "exp": "Electrons take the small 4s sublevel before moving into the larger 3d sublevel, which is why calcium is [Ar]4s² and scandium adds 3d¹ only after that. The 3p sublevel is filled earlier in the order rather than immediately before 3d, and 4p and 4d are not reached until after 3d is full."}, {"id": 28, "level": "Beginner", "tag": "Valence Electrons and Lewis Dot", "stem": "Valence electrons are best described as the electrons:", "options": ["that an atom has already lost to become an ion", "in the first energy level closest to the nucleus", "in the outermost energy level of an atom", "packed inside the nucleus with the protons"], "answer": "C", "answer_text": "in the outermost energy level of an atom", "exp": "Valence electrons are the electrons in the outermost energy level, and they are the ones that set an element's chemical properties. Protons and neutrons are in the nucleus while electrons are outside it, the first energy level is the innermost one rather than the outermost, and an atom keeps its valence electrons until it forms an ion."}, {"id": 29, "level": "Beginner", "tag": "Valence Electrons and Lewis Dot", "stem": "Tin (Sn) is in Group 14 of the periodic table. How many valence electrons would you expect a tin atom to have?", "options": ["4", "5", "14", "2"], "answer": "A", "answer_text": "4", "exp": "For Groups 13 through 18 the last digit of the group number gives the valence number, so Group 14 means 4 valence electrons. Tin's noble gas configuration [Kr]4d¹⁰5s²5p² confirms it, with 2 + 2 = 4 electrons in the fifth energy level; 14 is the group number itself and 5 is tin's period number."}, {"id": 30, "level": "Beginner", "tag": "Valence Electrons and Lewis Dot", "stem": "When drawing a Lewis dot structure, how are the dots placed around the element symbol?", "options": ["One dot on each of the four sides first, then pair them up.", "All of the dots are paired up, starting from the left-hand side.", "Dots are drawn only on the top side of the element symbol.", "One dot for each proton, spread evenly around the symbol."], "answer": "A", "answer_text": "One dot on each of the four sides first, then pair them up.", "exp": "Dots go one to a side until all four sides are used, and only then do they double up into pairs, so nitrogen with 5 valence electrons shows one pair and three singles. Pairing from the start hides which electrons are unpaired, stacking dots on one side is not the convention, and the dot count comes from valence electrons rather than protons."}, {"id": 31, "level": "Beginner", "tag": "Valence Electrons and Lewis Dot", "stem": "Atoms are most stable when they have a full outer energy level. For a Period 2 element such as oxygen, a full outer energy level holds how many electrons?", "options": ["6", "10", "8", "2"], "answer": "C", "answer_text": "8", "exp": "The first energy level holds up to 2 electrons and the second energy level holds up to 8, so a Period 2 atom is most stable with 8 electrons in that outer level. The value 6 is how many valence electrons oxygen actually has, 2 is the capacity of the first energy level, and 10 is the total electron count of a neon atom."}, {"id": 32, "level": "Beginner", "tag": "Atomic Radius", "stem": "How is the atomic radius of an element measured?", "options": ["As the full distance between the nuclei of two bonded atoms", "As half the distance between the nuclei of two bonded atoms", "As half the distance between two atoms that are not bonded", "As the distance from one proton out to the nearest neutron"], "answer": "B", "answer_text": "As half the distance between the nuclei of two bonded atoms", "exp": "The radius of an atom is half the distance between the nuclei of two bonded atoms, and the atoms have to be bonded or you would not know where the edge of the atom was. Using the full nucleus-to-nucleus distance gives a diameter rather than a radius, and unbonded atoms are not held at any fixed separation to measure."}, {"id": 33, "level": "Beginner", "tag": "Atomic Radius", "stem": "The atomic radius of lithium is 167 pm, of sodium is 1.90 × 10² pm, and of potassium is 243 pm. What happens to atomic radius as you move down Group 1?", "options": ["It increases, because these atoms have more energy levels.", "It stays the same, because the group number does not change.", "It decreases, because the nucleus holds the electrons tightly.", "It decreases, because these atoms have more protons pulling in."], "answer": "A", "answer_text": "It increases, because these atoms have more energy levels.", "exp": "Going down a group adds an energy level, so the valence electrons sit farther from the nucleus and the radius grows from 167 pm to 1.90 × 10² pm to 243 pm. These atoms do gain protons on the way down, but the extra energy levels outweigh that pull, so the radius rises instead of shrinking or holding steady."}, {"id": 34, "level": "Beginner", "tag": "Atomic Radius", "stem": "Which element has the larger atomic radius, sodium (Na) or phosphorus (P)?", "options": ["Sodium, since it has more energy levels than phosphorus does", "Phosphorus, since it has more protons pulling on its electrons", "Sodium, since atoms on the left of a period have larger radii", "Phosphorus, since it sits closer to the noble gases on the table"], "answer": "C", "answer_text": "Sodium, since atoms on the left of a period have larger radii", "exp": "Atomic radius increases across a period from right to left, so sodium at 190 pm is much larger than phosphorus at 98 pm. Phosphorus does have more protons, but that larger positive charge pulls its valence electrons in tighter rather than pushing them out, and both elements are in Period 3, so neither one has more energy levels."}, {"id": 35, "level": "Beginner", "tag": "Atomic Radius", "stem": "The atomic radius of the noble gases cannot be measured the same way as the radius of other elements because they:", "options": ["generally do not bond with other atoms", "have too many electrons to count exactly", "are much too small for any instrument", "are always found as diatomic molecules"], "answer": "A", "answer_text": "generally do not bond with other atoms", "exp": "Atomic radius is taken as half the distance between two bonded nuclei, so an element that generally does not bond gives you nothing to measure. The noble gases are single atoms rather than diatomic molecules like oxygen and nitrogen, their electrons can be counted from the atomic number, and helium at 31 pm is small but not unmeasurable."}, {"id": 36, "level": "Beginner", "tag": "Ionic Radius", "stem": "Ionic radius is best defined as:", "options": ["the distance an electron travels when it leaves an atom", "the distance from the nucleus to the outer energy level of an ion", "the distance from the nucleus to the outer energy level of an atom", "half the distance across the nucleus of a charged ion"], "answer": "B", "answer_text": "the distance from the nucleus to the outer energy level of an ion", "exp": "Ionic radius is the distance from the nucleus out to the outer energy level of an ion, the same measurement as atomic radius but for a charged particle. Measuring to the outer energy level of a neutral atom gives the atomic radius instead, and the nucleus itself is far smaller than any energy level."}, {"id": 37, "level": "Beginner", "tag": "Ionic Radius", "stem": "A lithium atom has 3 protons and 3 electrons, written 1s²2s¹. The lithium ion has 3 protons and 2 electrons, written 1s². Compared with the atom, the lithium ion is:", "options": ["smaller, because the ion has only one energy level left", "smaller, because the ion gained one extra electron", "larger, because losing an electron adds an energy level", "larger, because the ion now has more protons than electrons"], "answer": "A", "answer_text": "smaller, because the ion has only one energy level left", "exp": "Positive ions are smaller than their neutral atoms: the atom's 2 energy levels drop to 1, and 3 protons now pull on only 2 electrons. Having more protons than electrons is exactly why the ion shrinks rather than grows, and losing an electron removes an energy level here instead of adding one."}, {"id": 38, "level": "Beginner", "tag": "Ionization Energy", "stem": "The first ionization energy of an element is:", "options": ["the amount of energy needed to melt one gram of the element", "the amount of energy needed to remove a valence electron", "the amount of energy stored in the nucleus of a neutral atom", "the energy given off when an atom gains an extra electron"], "answer": "B", "answer_text": "the amount of energy needed to remove a valence electron", "exp": "First ionization energy is how much energy it takes to pull the first valence electron off an atom, measured on a gaseous neutral atom. Energy released when an atom gains an electron is a different idea entirely, nuclear energy has nothing to do with the valence shell, and melting is a physical change measured in the density and melting-point tables."}, {"id": 39, "level": "Beginner", "tag": "Ionization Energy", "stem": "First ionization energy increases across a period from left to right and up a group. Which element has the higher first ionization energy, lithium (Li) or beryllium (Be)?", "options": ["Lithium, because it has a smaller radius than beryllium does", "Beryllium, because it sits to the right of lithium in Period 2", "Lithium, because it sits at the far left edge of Period 2", "Beryllium, because it holds more energy levels than lithium does"], "answer": "B", "answer_text": "Beryllium, because it sits to the right of lithium in Period 2", "exp": "Beryllium is one step to the right of lithium in the same period, and ionization energy climbs from left to right, so beryllium's valence electron is harder to remove. Lithium actually has the larger radius of the two, and since both are Period 2 elements they have the same number of energy levels."}, {"id": 40, "level": "Beginner", "tag": "Ionization Energy", "stem": "Ionization energy can be used to predict how reactive a metal is. A metal that is very reactive has:", "options": ["no valence electrons at all", "a high first ionization energy", "a very large nuclear charge", "a low first ionization energy"], "answer": "D", "answer_text": "a low first ionization energy", "exp": "More reactive elements have lower ionization energies, so an alkali metal gives up its single valence electron with very little energy input. The noble gases sit at the top of the ionization energy graph and are not reactive, every metal has at least 1 valence electron, and a large nuclear charge holds electrons more tightly rather than releasing them."}, {"id": 41, "level": "Beginner", "tag": "Electronegativity", "stem": "Electronegativity is a measure of:", "options": ["the mass of one atom compared with carbon", "the tendency of an element to attract electrons", "the energy that is needed to remove a valence electron", "the number of valence electrons in an atom"], "answer": "B", "answer_text": "the tendency of an element to attract electrons", "exp": "Electronegativity is the tendency of an element to attract electrons, and tin's value of 1.96 is listed as a medium value on the research profile. The energy needed to remove a valence electron is ionization energy, the valence number is a simple count from the group, and comparing one atom's mass with carbon-12 gives relative atomic mass."}, {"id": 42, "level": "Beginner", "tag": "Electronegativity", "stem": "Which element is more electronegative, oxygen (O) or fluorine (F)?", "options": ["Fluorine, because electronegativity rises to the right", "Oxygen, because a larger radius pulls harder on electrons", "Fluorine, because it has more energy levels than oxygen", "Oxygen, because it is closer to the left side of Period 2"], "answer": "A", "answer_text": "Fluorine, because electronegativity rises to the right", "exp": "Electronegativity increases across a period from left to right and up a group, and fluorine has the greatest electronegativity of all the elements. Oxygen sits one place to the left, so it attracts electrons less strongly; both are Period 2 elements with the same number of energy levels, and a larger radius means less pull, not more."}, {"id": 43, "level": "Beginner", "tag": "Electronegativity", "stem": "Electronegativity can be used to predict how reactive a nonmetal is. A more reactive nonmetal has:", "options": ["a lower electronegativity value", "no tendency to attract electrons", "a greater electronegativity value", "a lower first ionization energy value"], "answer": "C", "answer_text": "a greater electronegativity value", "exp": "More reactive nonmetals attract electrons more strongly, so a greater electronegativity means greater reactivity, which is why fluorine is the most reactive halogen. Electronegativity follows the same trend as first ionization energy, so a low ionization energy points to a reactive metal instead, and a nonmetal with no pull on electrons would not react at all."}, {"id": 44, "level": "Beginner", "tag": "Reactivity Trends", "stem": "Reactivity of the halogens increases as you move up the group. Which halogen is the most reactive?", "options": ["fluorine (F)", "chlorine (Cl)", "iodine (I)", "bromine (Br)"], "answer": "A", "answer_text": "fluorine (F)", "exp": "Fluorine sits at the top of Group 17, so it is the most reactive halogen. In the halogen lab, chlorine water reacted with both the bromide and the iodide solutions while iodine water reacted with neither, showing that reactivity climbs as you move up the column toward fluorine."}, {"id": 45, "level": "Beginner", "tag": "Reactivity Trends", "stem": "PumpkinTech asked whether an alkali metal such as sodium could replace the tin in a phone's solder. Why is the answer no?", "options": ["Alkali metals will not conduct any electric current.", "Alkali metals are gases at normal room temperature.", "Alkali metals have no valence electrons to give away.", "Alkali metals are far too reactive to use in a phone."], "answer": "D", "answer_text": "Alkali metals are far too reactive to use in a phone.", "exp": "Alkali metals have the lowest first ionization energies on the table and react violently in water, so they are far too reactive for solder. They are shiny, malleable solids that conduct electricity well, and each one has 1 valence electron, so the other three claims are false."}, {"id": 46, "level": "Beginner", "tag": "Reactivity Trends", "stem": "How does the reactivity of the transition metals compare with that of the other families?", "options": ["Exactly as reactive as the alkaline earth metals found in Group 2", "More reactive than Group 1 metals but less reactive than noble gases", "More reactive than every one of the other families on the table", "Less reactive than Group 1 metals but more reactive than noble gases"], "answer": "D", "answer_text": "Less reactive than Group 1 metals but more reactive than noble gases", "exp": "The transition metals are less reactive than the alkali metals and the alkaline earth metals, but more reactive than the noble gases, and most of them fall in a narrow range of ionization energies. Ranking them above Group 1 or tying them with Group 2 ignores how violently those metals react in water and acid."}, {"id": 47, "level": "Beginner", "tag": "Density and Material Properties", "stem": "Density = mass ÷ volume. A copper sample from the density lab has a mass of 144 g and a volume of 16 cm³. What is the density of the copper?", "options": ["2.7 g/cm³", "9.0 g/cm³", "0.11 g/cm³", "128 g/cm³"], "answer": "B", "answer_text": "9.0 g/cm³", "exp": "Density = 144 g ÷ 16 cm³ = 9.0 g/cm³, reported to 2 significant digits because the volume 16 cm³ carries only 2. The value 0.11 g/cm³ comes from inverting the ratio as 16 ÷ 144, 128 g/cm³ comes from subtracting instead of dividing, and 2.7 g/cm³ is the aluminum sample's density."}, {"id": 48, "level": "Beginner", "tag": "Density and Material Properties", "stem": "The research table lists tin at 7.287 g/cm³, nickel at 8.91 g/cm³, copper at 8.96 g/cm³, and lead at 11.34 g/cm³. If equal volumes of each metal were used, which one would give the lightest phone?", "options": ["copper, at 8.96 g/cm³", "lead, at 11.34 g/cm³", "tin, at 7.287 g/cm³", "nickel, at 8.91 g/cm³"], "answer": "C", "answer_text": "tin, at 7.287 g/cm³", "exp": "Density is a ratio between mass and volume, so for the same volume the least dense metal has the least mass, and 7.287 g/cm³ is the smallest value in the table. Lead at 11.34 g/cm³ would be the heaviest choice, packing about 1.6 times the mass of tin into the same space, and nickel and copper fall in between."}, {"id": 49, "level": "Intermediate", "tag": "Periodic Table Organization", "stem": "On the periodic table, columns are called groups and rows are called periods. An element sits in Period 4, in the column labeled 13 on one handout and 3A on the other. How many energy levels do its atoms use, and how many valence electrons does it have?", "options": ["4 energy levels and 13 electrons in all", "13 energy levels and 4 valence electrons", "4 energy levels and 3 valence electrons", "3 energy levels and 4 valence electrons"], "answer": "C", "answer_text": "4 energy levels and 3 valence electrons", "exp": "The period number gives the number of energy levels, so Period 4 means 4 of them, and the 3A label tells you the valence number is 3. Counting 13 electrons in all reads the column header as an electron count, and 3 energy levels with 4 valence electrons swaps the row and column information."}, {"id": 50, "level": "Intermediate", "tag": "Periodic Table Organization", "stem": "An element sits in the same column as chlorine (Cl) but one row below it. Use the periodic table to identify that element and give its valence number.", "options": ["Bromine (Br), with a valence number of 7", "Selenium (Se), with a valence number of 7", "Argon (Ar), with a valence number of 8", "Sulfur (S), with a valence number of 6"], "answer": "A", "answer_text": "Bromine (Br), with a valence number of 7", "exp": "Chlorine is in Group 17 (7A) of Period 3, so the same column one row down is bromine in Period 4, and every element in that column has 7 valence electrons. Sulfur and argon are chlorine's neighbours in its own row rather than the row below, and selenium is one column to the left, giving it 6 valence electrons."}, {"id": 51, "level": "Intermediate", "tag": "Periodic Table Organization", "stem": "Tin's noble gas configuration is [Kr]4d¹⁰5s²5p². Which block of the periodic table is tin in, and which period?", "options": ["The p block, Period 5, because the last electrons enter 5p", "The p block, Period 4, because the highest d sublevel is 4d", "The d block, Period 4, because the 4d sublevel is filled", "The d block, Period 5, because tin holds ten d electrons"], "answer": "A", "answer_text": "The p block, Period 5, because the last electrons enter 5p", "exp": "The block is named for the sublevel the last electrons enter, which is 5p, and the period number is the highest energy level used, which is 5. Calling tin a d-block element counts the filled 4d¹⁰ core instead of the outermost sublevel, and reading Period 4 off the '4d' ignores the 5s and 5p electrons entirely."}, {"id": 52, "level": "Intermediate", "tag": "Periodic Table Organization", "stem": "Period 3 runs from sodium (11) through argon (18), and Period 4 runs from potassium (19) through krypton (36). How many elements are in each period, and what accounts for the difference?", "options": ["8 in Period 3 and 10 in Period 4; the 3d sublevel replaces the 4p", "8 in Period 3 and 18 in Period 4; the 4f sublevel adds 10 more", "8 in Period 3 and 18 in Period 4; the 3d sublevel adds 10 more", "18 in Period 3 and 18 in Period 4; both fill an s, p, and d sublevel"], "answer": "C", "answer_text": "8 in Period 3 and 18 in Period 4; the 3d sublevel adds 10 more", "exp": "Sodium through argon is 18 − 11 + 1 = 8 elements (3s² then 3p⁶), while potassium through krypton is 36 − 19 + 1 = 18 elements because 4s², 3d¹⁰, and 4p⁶ all fill. The 4f sublevel does not begin until Period 6, and Period 3 has no d sublevel at all, so it cannot hold 18 elements."}, {"id": 53, "level": "Intermediate", "tag": "Chemical Families", "stem": "An element has the noble gas configuration [Ar]4s¹. Which chemical family does it belong to, and how would you expect it to behave in water?", "options": ["Alkaline earth metals; it would react only in acid", "Alkali metals; it would be very reactive in water", "Noble gases; it would not react with the water at all", "Transition metals; it would not be nearly as reactive"], "answer": "B", "answer_text": "Alkali metals; it would be very reactive in water", "exp": "A single electron in the outermost s sublevel puts the element in Group 1, the alkali metals, and the reactivity lab showed those metals are very reactive in water. Two outer s electrons ([Ar]4s²) would make it an alkaline earth metal, and a transition metal needs an incomplete d sublevel, which [Ar]4s¹ does not have."}, {"id": 54, "level": "Intermediate", "tag": "Chemical Families", "stem": "Nickel's standard electron configuration is 1s²2s²2p⁶3s²3p⁶3d⁸4s². Which statement explains why nickel is grouped with the transition metals?", "options": ["Its 3p sublevel is incomplete, giving it properties between two families", "It has an incomplete d sublevel while its valence electrons sit in 4s", "It has eight valence electrons, which would place it with the noble gases", "Its outer s sublevel is empty, so it has no valence electrons at all"], "answer": "B", "answer_text": "It has an incomplete d sublevel while its valence electrons sit in 4s", "exp": "Transition metals are the elements with a partly filled d sublevel; nickel's 3d⁸ is two electrons short of full while the 4s² pair supplies its 2 valence electrons, matching the summary chart's '1 or 2 valence electrons' in an s orbital. Counting the 3d⁸ electrons as valence gives the wrong answer of eight, and the 3p⁶ sublevel is completely full."}, {"id": 55, "level": "Intermediate", "tag": "Chemical Families", "stem": "Chlorine is a greenish gas at room temperature and reacts readily. Bromine sits one row below chlorine in the same family. Which prediction about bromine follows from the family trends?", "options": ["Bromine is a liquid at room temperature and reacts with none of the salts", "Bromine is a gas at room temperature and is more reactive than chlorine", "Bromine is a shiny malleable solid and is more reactive than chlorine", "Bromine is a liquid at room temperature and less reactive than chlorine"], "answer": "D", "answer_text": "Bromine is a liquid at room temperature and less reactive than chlorine", "exp": "Halogen reactivity increases as you move up the group, so bromine below chlorine is the less reactive of the two, and the exceptions box lists bromine as a liquid at room temperature. Calling bromine more reactive inverts the halogen trend, and halogens are brittle nonmetals rather than shiny malleable solids."}, {"id": 56, "level": "Intermediate", "tag": "Chemical Families", "stem": "The Day 8 handout says the noble gases cannot have their atomic radius measured the same way as other elements. Which statement gives the reason together with the electron structure behind it?", "options": ["They have an incomplete d sublevel, so the outer edge of the atom keeps changing", "They hold just one valence electron, so any bond they form is too weak to measure", "They have a full outer energy level, so they generally do not bond with other atoms", "They are all radioactive gases, so a sample never sits still long enough to measure"], "answer": "C", "answer_text": "They have a full outer energy level, so they generally do not bond with other atoms", "exp": "Atomic radius is defined as half the distance between the nuclei of two bonded atoms, so an element that does not bond gives you no way to locate its edge, and the noble gases have full s and p sublevels (8 valence electrons, 2 for helium). Radon is the only radioactive member of the family, and noble gases have neither a lone valence electron nor a partly filled d sublevel."}, {"id": 57, "level": "Intermediate", "tag": "Chemical Families", "stem": "In the Dr. Rrrg puzzle, element 'Hu' is described as having the greatest electronegativity of all of the elements, and element 'Hf' as having the highest first ionization energy of all of the elements. Which families do Hu and Hf belong to?", "options": ["Hu is a noble gas and Hf is a halogen", "Hu is a halogen and Hf is a noble gas", "Hu is a halogen and Hf is an alkali metal", "Hu is an alkaline earth metal and Hf is a halogen"], "answer": "B", "answer_text": "Hu is a halogen and Hf is a noble gas", "exp": "Electronegativity increases to the right and up a group, so its maximum is fluorine at the top of the halogens, while first ionization energy peaks at helium, a noble gas. Swapping the two ignores that a noble gas already has a full outer energy level and is not measured as the most electronegative, and alkali metals sit in the valleys of the ionization energy graph rather than the peaks."}, {"id": 58, "level": "Intermediate", "tag": "Metals, Nonmetals, and Metalloids", "stem": "In the Day 2 lab a sample has a metallic luster, is brittle rather than malleable or ductile, and lights the conductivity tester only faintly. Which classification fits, and what use follows from that behavior?", "options": ["Metalloid, so it can be drawn into the wire that carries the current", "Metalloid, so it can be used as a semi-conductor in a phone chip", "Nonmetal, so it can be used as the insulation around a phone wire", "Metal, so it can be hammered flat into the case around the chip"], "answer": "B", "answer_text": "Metalloid, so it can be used as a semi-conductor in a phone chip", "exp": "A metallic luster combined with brittleness and weak conduction is the metalloid pattern, and metalloids are the semi-conductors, which conduct better as their temperature increases. A brittle sample cannot be drawn into wire or hammered flat, and a nonmetal would have no metallic luster and would not light the tester at all."}, {"id": 59, "level": "Intermediate", "tag": "Metals, Nonmetals, and Metalloids", "stem": "The Day 2 handout lists exceptions to the usual metal, nonmetal, and metalloid rules. Which of these statements is one of those exceptions, stated correctly?", "options": ["Iodine is printed with the nonmetals and shows no luster of any kind", "Boron is printed as a metalloid but conducts better than copper does", "Mercury is printed with the nonmetals because it is a liquid at 25 °C", "Hydrogen is printed on the metal side of the table but is not a metal"], "answer": "D", "answer_text": "Hydrogen is printed on the metal side of the table but is not a metal", "exp": "Hydrogen sits above the alkali metals on the left side of the table, yet it is a nonmetal, which is exactly the exception the handout calls out. Iodine does have a metallic luster, mercury is a metal that happens to be liquid near room temperature, and metalloids conduct far worse than a metal such as copper."}, {"id": 60, "level": "Intermediate", "tag": "Metals, Nonmetals, and Metalloids", "stem": "A semi-conductor is defined as a material that conducts electricity better as its temperature increases. Based on where semi-conductors sit on the periodic table, which pair of properties would you expect one to have?", "options": ["Earthy luster and malleability, since it sits in the bottom rows below the metals", "Earthy luster and brittleness, since it sits well to the right among the nonmetals", "Metallic luster and malleability, since it sits well to the left among the metals", "Metallic luster and brittleness, since it sits on the line between the two sides"], "answer": "D", "answer_text": "Metallic luster and brittleness, since it sits on the line between the two sides", "exp": "Semi-conductors are the metalloids, which lie along the line between metals and nonmetals and share properties of both: metallic luster from the metals and brittleness from the nonmetals. Malleability belongs only to the metals on the left, and a dull, earthy look belongs to the nonmetals on the right."}, {"id": 61, "level": "Intermediate", "tag": "History of the Periodic Table", "stem": "In 1864, when 64 elements were known, John Newlands ordered them by increasing atomic weight and reported that properties repeated at a regular interval. Why did his arrangement break down for the heavier elements?", "options": ["He had grouped the elements into sets of three, and no third element existed past calcium", "He had ordered the elements by atomic number, which nobody could measure until 1913", "An entire column of elements had not yet been discovered, so every row was short", "He had left out the transition metals on purpose because their weights were unknown"], "answer": "C", "answer_text": "An entire column of elements had not yet been discovered, so every row was short", "exp": "The noble gases were not isolated until the 1890s, so the whole Group 18 column was missing from Newlands' table and every row came up one element short — which is exactly why the repeat drifted out of step past calcium. Ordering by atomic number was Moseley's later work in 1913, and grouping in threes was Döbereiner's triads."}, {"id": 62, "level": "Intermediate", "tag": "History of the Periodic Table", "stem": "The average atomic mass of tellurium (127.6 amu) is greater than that of iodine (126.9 amu), yet iodine is placed after tellurium on the modern table. Which development explains why the table is built this way?", "options": ["Newlands showed in 1864 that elements order by their number of valence electrons", "Döbereiner showed in 1829 that elements order in triads set by their chemical families", "Moseley showed in 1913 that elements order by atomic number, not by atomic weight", "Mendeleev showed in 1869 that elements order by atomic weight, not by atomic number"], "answer": "C", "answer_text": "Moseley showed in 1913 that elements order by atomic number, not by atomic weight", "exp": "Moseley tied each element to the number of protons in its nucleus, so iodine (53 protons) has to follow tellurium (52 protons) even though its average atomic mass is smaller. Mendeleev did order by atomic weight, which is precisely why this pair looked like an exception in his table, and neither triads nor octaves address the problem."}, {"id": 63, "level": "Intermediate", "tag": "History of the Periodic Table", "stem": "Lord Rayleigh found that nitrogen separated from air was denser than nitrogen made from compounds. Working with William Ramsay, he traced the difference to a new gas of atomic weight 39.95. What was the gas, and what did it mean for the table?", "options": ["Argon, and a whole new group had to be opened up for it and its family", "Argon, and it was placed with the halogens next to chlorine (35.45)", "Nitrogen in an N₃ form, and no change to the table was needed at all", "Neon, and it was placed between fluorine and sodium in the second period"], "answer": "A", "answer_text": "Argon, and a whole new group had to be opened up for it and its family", "exp": "The heavier gas was argon, and because it would not react with anything it fit none of the existing columns, so a new group was opened for it; the rest of the noble gases followed quickly, all of them known by 1900. Placing argon with the halogens ignores that it does not react, and the N₃ idea was ruled out once the gas proved to be a new element."}, {"id": 64, "level": "Intermediate", "tag": "Electron Configuration", "stem": "Nickel has an atomic number of 28. Which is the standard electron configuration of a neutral nickel atom?", "options": ["1s²2s²2p⁶3s²3p⁶3d⁸4p²", "1s²2s²2p⁶3s²3p⁶3d⁶4s²", "1s²2s²2p⁶3s²3p⁶3d¹⁰", "1s²2s²2p⁶3s²3p⁶3d⁸4s²"], "answer": "D", "answer_text": "1s²2s²2p⁶3s²3p⁶3d⁸4s²", "exp": "A neutral nickel atom holds 28 electrons: 2 + 2 + 6 + 2 + 6 = 18 through argon, then 4s takes 2 and 3d takes the last 8. Writing 3d¹⁰ with no 4s crowds all ten electrons into the five-bedroom d apartment before using the s apartment on the next floor up, and 3d⁶ 4s² is iron's configuration, two electrons short of nickel."}, {"id": 65, "level": "Intermediate", "tag": "Electron Configuration", "stem": "A tin atom has 50 electrons. Which is the correct noble gas electron configuration for tin?", "options": ["1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p²", "[Kr]4d¹⁰5s²5p², using the noble gas before tin", "[Xe]4d¹⁰5s²5p², using the noble gas that follows tin", "[Kr]5s²5p², leaving the filled d sublevel out"], "answer": "B", "answer_text": "[Kr]4d¹⁰5s²5p², using the noble gas before tin", "exp": "Krypton is the noble gas immediately before tin, and its 36 electrons plus the 14 in 4d¹⁰5s²5p² total 50. Xenon already holds 54 electrons, more than tin has, dropping the 4d¹⁰ leaves only 40 electrons, and the long string of sublevels is the standard configuration rather than the noble gas configuration that was asked for."}, {"id": 66, "level": "Intermediate", "tag": "Electron Configuration", "stem": "An atom's standard electron configuration is 1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p³. Which element is it?", "options": ["Selenium (Se), atomic number 34", "Arsenic (As), atomic number 33", "Gallium (Ga), atomic number 31", "Phosphorus (P), atomic number 15"], "answer": "B", "answer_text": "Arsenic (As), atomic number 33", "exp": "Adding the superscripts gives 2 + 2 + 6 + 2 + 6 + 10 + 2 + 3 = 33 electrons, and a neutral atom with 33 electrons has 33 protons, which is arsenic. Selenium would need a 4p⁴ ending and gallium a 4p¹ ending, while phosphorus has only 15 electrons and stops at 3p³."}, {"id": 67, "level": "Intermediate", "tag": "Electron Configuration", "stem": "Aluminum in a phone casing corrodes, and each aluminum atom loses 3 electrons. What is the standard electron configuration of the ion that forms?", "options": ["1s²2s²2p⁶3s²3p¹", "1s²2s²2p⁶3s²3p⁴", "1s²2s²2p⁶3s²", "1s²2s²2p⁶"], "answer": "D", "answer_text": "1s²2s²2p⁶", "exp": "A neutral aluminum atom has 13 electrons, 1s²2s²2p⁶3s²3p¹, and removing 3 electrons takes the lone 3p electron and both 3s electrons, leaving 10 electrons and an empty energy level 3. The configuration ending in 3p⁴ adds three electrons instead of removing them, and the one ending in 3s² removes only one."}, {"id": 68, "level": "Intermediate", "tag": "Electron Configuration", "stem": "An element has the noble gas electron configuration [Ne]3s²3p⁴. Identify the element and its group.", "options": ["Sulfur, in Group 6, the same column as chromium", "Selenium, in Group 16", "Oxygen, in Group 16", "Sulfur, in Group 16 (6A)"], "answer": "D", "answer_text": "Sulfur, in Group 16 (6A)", "exp": "The neon core holds 10 electrons and 3s²3p⁴ adds 6 more for 16 in all, which is sulfur, and the third energy level places it in Period 3 of Group 16, the column also labeled 6A. Putting sulfur in the chromium column reads the 6 valence electrons as the group number, while oxygen would be [He]2s²2p⁴ and selenium [Ar]3d¹⁰4s²4p⁴."}, {"id": 69, "level": "Intermediate", "tag": "Electron Configuration", "stem": "Following the electron room rental rules, a potassium atom has 19 electrons. Where does the 19th electron go, and why?", "options": ["Into the 3d sublevel, because energy level 3 has to fill up first", "Into the 4s sublevel, because it fills before the 3d sublevel does", "Into the 4p sublevel, because energy level 4 starts with its p orbitals", "Into the 3p sublevel, because it still has room for two more electrons"], "answer": "B", "answer_text": "Into the 4s sublevel, because it fills before the 3d sublevel does", "exp": "The first 18 electrons fill 1s²2s²2p⁶3s²3p⁶, and the rules say an electron takes a one-bedroom s apartment on the next floor up before it will move into a five-bedroom d apartment, so the 19th goes into 4s and the configuration ends 3p⁶4s¹. The 3p sublevel is already full at 6 electrons, and a p sublevel never fills before the s sublevel on the same floor."}, {"id": 70, "level": "Intermediate", "tag": "Valence Electrons and Lewis Dot", "stem": "Nickel's standard electron configuration is 1s²2s²2p⁶3s²3p⁶3d⁸4s². How many valence electrons does a nickel atom have?", "options": ["10, the 3d and 4s electrons added together", "2, the two electrons in the 4s sublevel", "18, every electron outside the neon core", "8, the eight electrons in the 3d sublevel"], "answer": "B", "answer_text": "2, the two electrons in the 4s sublevel", "exp": "Valence electrons are the electrons in the outermost energy level, and for nickel that is level 4, which holds only the 4s² pair, matching the summary chart's listing of 1 or 2 valence electrons for the transition metals. Counting the 3d⁸ electrons reaches into an inner energy level, and adding 3d and 4s together to get 10 makes the same mistake twice over."}, {"id": 71, "level": "Intermediate", "tag": "Valence Electrons and Lewis Dot", "stem": "Phosphorus is in Group 15 (5A). Using the rule of one dot per side until all four sides are used and then pairing, what does the Lewis dot structure of phosphorus look like?", "options": ["Five dots: three single dots and one pair", "Five dots: five single dots spread evenly", "Fifteen dots arranged as pairs around the symbol", "Three dots: one single dot on each of three sides"], "answer": "A", "answer_text": "Five dots: three single dots and one pair", "exp": "The 5A label means 5 valence electrons, and the rule places one dot on each of the four sides first, so the fifth dot must pair with a dot already there, leaving three single dots and one pair. Five single dots would require five sides, and three dots counts only the 3p electrons while forgetting the 3s pair."}, {"id": 72, "level": "Intermediate", "tag": "Valence Electrons and Lewis Dot", "stem": "A tin atom has the noble gas configuration [Kr]4d¹⁰5s²5p². How many dots belong in tin's Lewis dot structure, and how many more electrons would give tin a full outer energy level?", "options": ["12 dots, and 4 more electrons would fill the outer level", "4 dots, and 8 more electrons would fill the outer level", "4 dots, and 4 more electrons would fill the outer level", "2 dots, and 6 more electrons would fill the outer level"], "answer": "C", "answer_text": "4 dots, and 4 more electrons would fill the outer level", "exp": "Only the outermost energy level counts, so 5s² plus 5p² gives 4 valence electrons and 4 dots, the same answer the Day 3 practice reaches for tin. A full outer s and p set holds 8, so 8 − 4 = 4 more are needed; counting the 4d¹⁰ electrons as valence gives 12, and using only the 5s² pair gives 2."}, {"id": 73, "level": "Intermediate", "tag": "Valence Electrons and Lewis Dot", "stem": "Which pair of elements would be drawn with Lewis dot structures having the same number of dots arranged the same way?", "options": ["Chlorine (Cl) and calcium (Ca), each with seven dots in all", "Nickel (Ni) and oxygen (O), each with two pairs and two single dots", "Argon (Ar) and aluminum (Al), each with three single dots", "Tin (Sn) and silicon (Si), each with four single dots"], "answer": "D", "answer_text": "Tin (Sn) and silicon (Si), each with four single dots", "exp": "Elements in the same column share a valence number, and tin and silicon are both in Group 14 (4A) with 4 valence electrons, so each gets one dot on each of the four sides. Nickel has 2 valence electrons rather than 6 because its 3d electrons sit in an inner level, argon has 8 while aluminum has 3, and calcium has 2 while chlorine has 7."}, {"id": 74, "level": "Intermediate", "tag": "Atomic Radius", "stem": "The Day 8 data table lists sodium at 1.90 × 10² pm and aluminum at 118 pm. How much larger is the sodium atom, and what explains the difference?", "options": ["72 pm larger, because sodium has more energy levels holding electrons than aluminum", "308 pm larger, because the two radii add together when atoms are compared", "72 pm smaller, because aluminum has both more protons and more energy levels", "72 pm larger, because aluminum's bigger nucleus pulls its valence electrons closer"], "answer": "D", "answer_text": "72 pm larger, because aluminum's bigger nucleus pulls its valence electrons closer", "exp": "1.90 × 10² pm − 118 pm = 72 pm, and since both atoms are in Period 3 they use the same three energy levels, so the difference comes from aluminum having 13 protons pulling on its valence electrons instead of sodium's 11. Sodium does not have more energy levels than aluminum, and adding the radii to get 308 pm answers no question at all."}, {"id": 75, "level": "Intermediate", "tag": "Atomic Radius", "stem": "A copper atom has an atomic radius of 145 pm. If 25 copper atoms sit in a straight row with each one touching the next, how long is the row? (The count of 25 atoms is an exact number.)", "options": ["3.63 × 10³ pm", "7.25 × 10³ pm", "7.2 × 10³ pm", "7.250 × 10³ pm"], "answer": "B", "answer_text": "7.25 × 10³ pm", "exp": "Each atom takes up its full diameter along the row, so 2 × 145 pm = 290 pm per atom and 25 × 290 pm = 7250 pm, reported as 7.25 × 10³ pm to carry the 3 SD of the 145 pm measurement. Using the radius instead of the diameter gives 3.63 × 10³ pm, and because 25 is an exact counted number it never cuts the answer to 2 SD or lets it stretch to 4."}, {"id": 76, "level": "Intermediate", "tag": "Atomic Radius", "stem": "The Day 8 table gives helium 31 pm, neon 38 pm, and krypton 88 pm. Which is the best value for the atomic radius of argon, and why?", "options": ["63 pm, because argon must fall exactly halfway between its neighbours", "76 pm, because the radius doubles from neon's 38 pm going down", "38 pm, because argon and neon are both small unreactive gases", "71 pm, because argon has one more energy level than neon does"], "answer": "D", "answer_text": "71 pm, because argon has one more energy level than neon does", "exp": "Atomic radius increases down a group because each period adds an energy level farther from the nucleus, so argon in Period 3 must be larger than neon's 38 pm and smaller than krypton's 88 pm, and the table's value is 71 pm. Averaging neon and krypton to get 63 pm assumes equal jumps, which the helium-to-neon step already contradicts, and the radius neither stays at neon's value nor doubles."}, {"id": 77, "level": "Intermediate", "tag": "Atomic Radius", "stem": "Using the Day 8 radii (nitrogen 56 pm, aluminum 118 pm, lithium 167 pm, sodium 1.90 × 10² pm), rank these four elements from smallest to largest atomic radius.", "options": ["Al, N, Na, Li", "N, Al, Li, Na", "Li, Na, N, Al", "Na, Li, Al, N"], "answer": "B", "answer_text": "N, Al, Li, Na", "exp": "Nitrogen at 56 pm is far to the right in Period 2, aluminum at 118 pm is in Period 3, lithium at 167 pm is at the far left of Period 2, and sodium at 1.90 × 10² pm is at the far left of Period 3, giving N < Al < Li < Na. Listing Na, Li, Al, N runs the whole trend backwards, and putting the two Group 1 metals together first ignores how sharply the radius grows from right to left across a period."}, {"id": 78, "level": "Intermediate", "tag": "Atomic Radius", "stem": "An aluminum atom has an atomic radius of 118 pm. Treating the atom as a sphere and using volume = (4/3)πr³, what is its approximate volume?", "options": ["6.88 × 10⁶ pm³", "5.16 × 10⁶ pm³", "8.60 × 10⁵ pm³", "6.882 × 10⁶ pm³"], "answer": "A", "answer_text": "6.88 × 10⁶ pm³", "exp": "Cubing gives (118 pm)³ = 1.643 × 10⁶ pm³, and (4/3)π × 1.643 × 10⁶ pm³ = 6.882 × 10⁶ pm³, which rounds to 6.88 × 10⁶ pm³ because 118 pm carries 3 SD while 4/3 and π are exact. Dropping the 4/3 gives 5.16 × 10⁶ pm³, halving the radius first gives 8.60 × 10⁵ pm³, and 6.882 × 10⁶ pm³ keeps a fourth digit the measurement cannot support."}, {"id": 79, "level": "Intermediate", "tag": "Ionic Radius", "stem": "Lithium's configuration is 1s²2s¹ with 3 protons and 3 electrons, while the lithium ion is 1s² with 3 protons and 2 electrons. Why is the ion smaller than the atom?", "options": ["It loses a proton, so the smaller positive charge lets the electrons settle inward", "It gains an electron, so the extra negative charge is squeezed toward the nucleus", "It loses its only outer-level electron, so 3 protons pull on just 2 electrons", "It keeps two energy levels but loses a neutron, making the whole nucleus lighter"], "answer": "C", "answer_text": "It loses its only outer-level electron, so 3 protons pull on just 2 electrons", "exp": "Removing the 2s¹ electron empties energy level 2 completely, dropping the ion from two energy levels to one, and with more protons than electrons the pull on each remaining electron is stronger. An ion never gains or loses protons or neutrons — only electrons move — and gaining an electron would make the particle larger, not smaller."}, {"id": 80, "level": "Intermediate", "tag": "Ionic Radius", "stem": "Fluorine is 1s²2s²2p⁵ with 9 protons and 9 electrons; the fluorine ion is 1s²2s²2p⁶ with 9 protons and 10 electrons. Which comparison of the two is correct?", "options": ["The ion is smaller, because its outer p sublevel is now completely full", "The ion is the same size, because the number of protons did not change", "The ion is larger, because 9 protons must now hold on to 10 electrons", "The ion is larger, because it gained a whole new energy level, level 3"], "answer": "C", "answer_text": "The ion is larger, because 9 protons must now hold on to 10 electrons", "exp": "Both particles use two energy levels, but the ion carries one more electron than it has protons, so the nuclear pull is spread thinner and the ion swells; negative ions are always larger than their neutral atoms. Filling the 2p sublevel does not shrink anything, and no new energy level appears because 2p⁶ is still inside level 2."}, {"id": 81, "level": "Intermediate", "tag": "Ionic Radius", "stem": "Across Period 3 the ionic radii are Na⁺ 102 pm, Mg²⁺ 72 pm, Al³⁺ 54 pm, P³⁻ 212 pm, S²⁻ 184 pm, and Cl⁻ 181 pm. Which statement describes this data correctly?", "options": ["The positive ions shrink left to right, the radius jumps up at the first negative ion, then shrinks again", "The ionic radius increases steadily from right to left across the whole period with no break at all", "The positive ions grow from left to right and the negative ions grow from left to right in the same way", "The ionic radius decreases steadily from left to right across the whole period, just as atomic radius does"], "answer": "A", "answer_text": "The positive ions shrink left to right, the radius jumps up at the first negative ion, then shrinks again", "exp": "Na⁺ 102 → Mg²⁺ 72 → Al³⁺ 54 pm falls because those three ions all hold 10 electrons while the proton count climbs, then P³⁻ 212 pm leaps up because the negative ions hold 18 electrons, and P³⁻ → S²⁻ → Cl⁻ falls again from 212 to 181 pm. A single smooth right-to-left increase would require Cl⁻ at 181 pm to be smaller than Al³⁺ at 54 pm, which the numbers flatly contradict. Your summary chart's blanket rule — that ionic radius simply increases right to left — is the oversimplification this data set is designed to expose."}, {"id": 82, "level": "Intermediate", "tag": "Ionization Energy", "stem": "Which element has the higher first ionization energy, lithium or beryllium, and why?", "options": ["Beryllium, because its smaller radius holds its valence electrons tighter", "Lithium, because it has fewer electrons for the nucleus to hold on to at once", "Lithium, because losing one electron leaves it with a full outer energy level", "Beryllium, because it has more energy levels than lithium has in its atoms"], "answer": "A", "answer_text": "Beryllium, because its smaller radius holds its valence electrons tighter", "exp": "Both are in Period 2, but beryllium has 4 protons to lithium's 3, so its atomic radius is smaller and its valence electrons are held more tightly, which is exactly what first ionization energy measures. Lithium does reach a full level 1 after losing an electron, and that is why it gives the electron up easily — a LOW first ionization energy — and both elements use two energy levels."}, {"id": 83, "level": "Intermediate", "tag": "Ionization Energy", "stem": "First ionization energies in kJ/mol: potassium 419, calcium 589.8, nickel 737, argon 1521. Using the rule that more reactive elements have lower ionization energies, which is the most reactive metal listed and which element is not reactive?", "options": ["Calcium is the most reactive metal; nickel is not reactive", "Nickel is the most reactive metal; calcium is not reactive", "Potassium is the most reactive metal; argon is not reactive", "Argon is the most reactive metal; potassium is not reactive"], "answer": "C", "answer_text": "Potassium is the most reactive metal; argon is not reactive", "exp": "Potassium's 419 kJ/mol is the lowest value on the list, so its valence electron is the easiest to remove and it is the most reactive metal, which fits Group 1 being very reactive in water. Argon's 1521 kJ/mol is the highest, and as a noble gas it is not a metal and does not react, while nickel's 737 kJ/mol sits in the flat transition-metal range above calcium."}, {"id": 84, "level": "Intermediate", "tag": "Ionization Energy", "stem": "Sodium's first ionization energy is 496 kJ/mol, but its second ionization energy is 4562 kJ/mol. What best explains the enormous jump?", "options": ["The second electron leaves the same 3s sublevel, which simply resists twice as hard", "The second electron has to come out of a full inner level closer to the nucleus", "The second electron has to be removed from a level farther out than the first one", "The sodium ion picks up a proton as it ionizes, so the nucleus pulls much harder"], "answer": "B", "answer_text": "The second electron has to come out of a full inner level closer to the nucleus", "exp": "Sodium is 1s²2s²2p⁶3s¹, so the first electron leaves the lone 3s spot, but the second must be torn out of the filled 2p sublevel in energy level 2, which is nearer the nucleus and already stable. The 3s sublevel is empty after the first removal, protons never change during ionization, and level 2 is closer in rather than farther out."}, {"id": 85, "level": "Intermediate", "tag": "Ionization Energy", "stem": "On the First Ionization Energy vs. Atomic Number graph, element Q sits at the peak at atomic number 18 and element R sits in the valley immediately after it. Identify Q and R, and say which is more reactive.", "options": ["Q is chlorine and R is argon; chlorine is much more reactive", "Q is potassium and R is argon; potassium is much more reactive", "Q is argon and R is potassium; potassium is much more reactive", "Q is argon and R is potassium; argon is much more reactive"], "answer": "C", "answer_text": "Q is argon and R is potassium; potassium is much more reactive", "exp": "Atomic number 18 is argon, and the peaks of that graph are always the noble gases because a full outer energy level makes an electron very hard to remove; atomic number 19 is potassium, an alkali metal sitting in the valley. A low ionization energy means an electron comes off easily, so potassium is the reactive one and argon at the peak is the least reactive of the pair."}, {"id": 86, "level": "Intermediate", "tag": "Electronegativity", "stem": "Tin's electronegativity is 1.96. Using the periodic trend, which neighbouring element would you expect to have a higher electronegativity than tin?", "options": ["Cadmium (Cd), which is two columns to the left of tin", "Thallium (Tl), which is down a row and to the left of tin", "Indium (In), which is one column to the left of tin", "Antimony (Sb), which is one column to the right of tin"], "answer": "D", "answer_text": "Antimony (Sb), which is one column to the right of tin", "exp": "Electronegativity increases from left to right across a period and up a group, so stepping right from tin to antimony raises it, and antimony's accepted value is 2.05. Indium and cadmium lie to the left of tin and thallium lies both left and down, and every one of those directions runs the trend the wrong way."}, {"id": 87, "level": "Intermediate", "tag": "Electronegativity", "stem": "Rank fluorine, chlorine, bromine, and iodine from most electronegative to least, and say what that ranking means for their reactivity.", "options": ["I > Br > Cl > F, so iodine is the most reactive of the four", "Br > I > F > Cl, so bromine is the most reactive of the whole set", "F > Cl > Br > I, so fluorine is the most reactive of the four", "F > Cl > Br > I, so iodine is the most reactive of the four"], "answer": "C", "answer_text": "F > Cl > Br > I, so fluorine is the most reactive of the four", "exp": "Electronegativity increases up a group, so within the halogens fluorine at the top is the greatest and iodine at the bottom is the least. More reactive nonmetals have greater electronegativity, which is why chlorine water displaced both bromide and iodide in the lab while iodine water displaced nothing, so calling iodine the most reactive inverts the rule."}, {"id": 88, "level": "Intermediate", "tag": "Electronegativity", "stem": "An element has one of the lowest first ionization energies on the periodic table. What do you predict about its electronegativity, and why?", "options": ["Also very low, because both trends increase to the right and up a group", "Very high, because a loosely held electron attracts other electrons easily", "Also very low, because both trends increase to the left and down a group", "Very high, because those two trends always run opposite to one another"], "answer": "A", "answer_text": "Also very low, because both trends increase to the right and up a group", "exp": "The summary chart states that the trend for electronegativity is the same as the trend for ionization energy: both increase from left to right across a period and up a group. An element that gives up its own electron easily also has little pull on new electrons, so a low ionization energy goes with a low electronegativity."}, {"id": 89, "level": "Intermediate", "tag": "Reactivity Trends", "stem": "In the halogen lab, chlorine water added to a bromide salt solution produced a reaction, but bromine water added to a chloride salt solution produced no reaction. What do these two results show?", "options": ["The two halogens are equally reactive, so only the salt chosen decides the outcome", "Bromine is more reactive than chlorine, matching reactivity rising down the group", "Chlorine is more reactive than bromine, matching reactivity rising down the group", "Chlorine is more reactive than bromine, matching reactivity rising up the group"], "answer": "D", "answer_text": "Chlorine is more reactive than bromine, matching reactivity rising up the group", "exp": "A halogen that can replace the halide in the salt is the more reactive of the two, so chlorine replacing bromide while bromine cannot replace chloride puts chlorine on top. Chlorine sits above bromine in Group 17, so halogen reactivity increases as you move up the group, not down it, and the results are clearly not identical for the two salts."}, {"id": 90, "level": "Intermediate", "tag": "Reactivity Trends", "stem": "In the Day 9 lab, magnesium and calcium were each placed in 1.0M HCl, and the calcium bubbled much faster than the magnesium. What would you predict for strontium, directly below calcium, and why?", "options": ["Slower than magnesium, because first ionization energy drops going down Group 2", "Faster than calcium, because first ionization energy drops going down Group 2", "Faster than calcium, because first ionization energy rises going down Group 2", "The same as calcium, since both belong to the alkaline earth metal family"], "answer": "B", "answer_text": "Faster than calcium, because first ionization energy drops going down Group 2", "exp": "First ionization energy decreases down a group, and elements with lower ionization energies are more reactive, so strontium below calcium should bubble even faster than calcium did. Predicting a slower reaction inverts the trend, and being in the same family does not make two metals equally reactive, as magnesium and calcium themselves demonstrated."}, {"id": 91, "level": "Intermediate", "tag": "Reactivity Trends", "stem": "A piece of magnesium dropped into 1.0M HCl fizzed, and a burning wooden splint held at the mouth of the test tube made a sharp pop. Which gas formed, and what about the other splint test?", "options": ["Hydrogen; the glowing-splint test finds oxygen, which supports burning but does not burn", "Hydrogen; a glowing splint would also relight, since hydrogen makes any splint burn faster", "Oxygen; a burning splint pops in oxygen because oxygen is the most flammable gas there is", "Oxygen; a glowing splint goes out in oxygen because oxygen smothers a flame like water"], "answer": "A", "answer_text": "Hydrogen; the glowing-splint test finds oxygen, which supports burning but does not burn", "exp": "A burning splint pops when hydrogen is present, and a metal reacting with hydrochloric acid releases hydrogen gas. The other test uses a glowing splint that relights in oxygen, and oxygen is not itself flammable — it supports the burning of other substances, which is why a glowing ember flares back up instead of going out."}, {"id": 92, "level": "Intermediate", "tag": "Density and Material Properties", "stem": "A zinc sample masses 45.70 g on a lab balance. Its volume is found by displacement in a cylinder marked every 0.1 mL, where the level rises from 25.00 mL to 31.40 mL. Using Density = mass ÷ volume, what is the density of the zinc?", "options": ["0.140 g/mL", "7.1 g/mL", "7.14 g/mL", "7.141 g/mL"], "answer": "C", "answer_text": "7.14 g/mL", "exp": "The volume is 31.40 mL − 25.00 mL = 6.40 mL, which holds 3 SD, and 45.70 g ÷ 6.40 mL = 7.140625 g/mL, rounded to 7.14 g/mL because division keeps the fewest SD among the inputs. Reporting 7.141 g/mL claims a fourth digit the volume cannot support, 7.1 g/mL throws away a digit that it can, and 0.140 g/mL divides the volume by the mass."}, {"id": 93, "level": "Intermediate", "tag": "Density and Material Properties", "stem": "A spherical tin pellet has a diameter of 1.50 cm and a mass of 12.88 g. Using volume = (4/3)πr³ and Density = mass ÷ volume, what is the density of the pellet?", "options": ["7.29 g/cm³", "7.289 g/cm³", "9.72 g/cm³", "0.911 g/cm³"], "answer": "A", "answer_text": "7.29 g/cm³", "exp": "The radius is half the diameter, 0.750 cm, so volume = (4/3)π(0.750 cm)³ = 1.77 cm³, and 12.88 g ÷ 1.767 cm³ = 7.2886 g/cm³, which rounds to 7.29 g/cm³ and matches tin's accepted density. Using 1.50 cm as the radius gives 0.911 g/cm³, leaving out the 4/3 gives 9.72 g/cm³, and 7.289 g/cm³ shows one digit too many."}, {"id": 94, "level": "Intermediate", "tag": "Density and Material Properties", "stem": "Three cubes are machined to the same volume, 8.00 cm³. Their densities are aluminum 2.70 g/cm³, nickel 8.91 g/cm³, and copper 8.96 g/cm³. Which line gives the correct masses?", "options": ["Al 22 g, Ni 71 g, Cu 72 g", "Al 21.60 g, Ni 71.28 g, Cu 71.68 g", "Al 2.96 g, Ni 0.898 g, Cu 0.893 g", "Al 21.6 g, Ni 71.3 g, Cu 71.7 g"], "answer": "D", "answer_text": "Al 21.6 g, Ni 71.3 g, Cu 71.7 g",
