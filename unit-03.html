"exp": "Rearranging Density = mass ÷ volume gives mass = density × volume, so 2.70 × 8.00 = 21.6 g, 8.91 × 8.00 = 71.28 → 71.3 g, and 8.96 × 8.00 = 71.68 → 71.7 g, each carrying the 3 SD shared by both inputs. The 71.28 g and 71.68 g line keeps 4 SD, the whole-gram line keeps only 2, and the values under 3 g come from dividing the volume by the density."}, {"id": 95, "level": "Intermediate", "tag": "Case File: Conflict and Cellphones", "stem": "Part IV of the research packet lists tin at $12.00 per pound and copper at $3.62 per pound. How many times more expensive is tin than copper, reported with the correct number of significant digits?", "options": ["3.3 times", "3.315 times", "0.302 times", "3.31 times"], "answer": "D", "answer_text": "3.31 times", "exp": "$12.00 ÷ $3.62 = 3.31491…, and division keeps the fewest SD among the inputs, which is the 3 SD of $3.62, so the answer is 3.31 times. Reporting 3.315 keeps a fourth digit $3.62 cannot support, 3.3 discards a digit it can, and 0.302 divides copper's price by tin's, answering the reverse question."}, {"id": 96, "level": "Intermediate", "tag": "Case File: Conflict and Cellphones", "stem": "PumpkinTech wants a tin replacement whose atoms have the same valence number as tin, since valence electrons control how an element bonds. Tin's noble gas configuration is [Kr]4d¹⁰5s²5p². Which candidate qualifies?", "options": ["Cadmium (Cd), whose configuration is [Kr]4d¹⁰5s²", "Germanium (Ge), whose configuration is [Ar]3d¹⁰4s²4p²", "Indium (In), whose configuration is [Kr]4d¹⁰5s²5p¹", "Bismuth (Bi), whose configuration is [Xe]4f¹⁴5d¹⁰6s²6p³"], "answer": "B", "answer_text": "Germanium (Ge), whose configuration is [Ar]3d¹⁰4s²4p²", "exp": "Tin's outermost level holds 5s² and 5p², which is 4 valence electrons, and germanium's 4s²4p² gives the same 4, placing both in Group 14. Indium's 5s²5p¹ gives 3 and bismuth's 6s²6p³ gives 5, while cadmium has only the 5s² pair because its 4d¹⁰ electrons lie in an inner energy level."}, {"id": 97, "level": "Advanced", "tag": "Periodic Table Organization", "stem": "Period 4 of the periodic table holds 18 elements while Period 3 holds only 8. Using the sublevel capacities (s = 2, p = 6, d = 10, f = 14) and the order in which the sublevels actually fill, which explanation accounts for the jump from 8 to 18?", "options": ["Period 4 fills 3d, then 3p, then 4s, and 10 + 6 + 2 gives the 18 elements in that row", "Period 4 fills 4s and 4p only, and 2 + 6 gives 8, with the ten d elements counted in Period 3", "Period 4 fills 4s, then 4d, then 4p, and 2 + 10 + 6 gives the 18 elements in that row", "Period 4 fills 4s, then 3d, then 4p, and 2 + 10 + 6 gives the 18 elements in that row"], "answer": "D", "answer_text": "Period 4 fills 4s, then 3d, then 4p, and 2 + 10 + 6 gives the 18 elements in that row", "exp": "Electrons take the lowest available sublevel first, and 4s is lower than 3d, so the row runs 4s, then 3d, then 4p: 2 + 10 + 6 = 18. Writing 4d in place of 3d skips a whole sublevel and would leave 3d permanently empty, and filling 3p during Period 4 is impossible because 3p was already full at the end of Period 3."}, {"id": 98, "level": "Advanced", "tag": "Periodic Table Organization", "stem": "A 1962 supplier data sheet describes the solder metal only as “Group 4A, Period 5.” Your class periodic table numbers the columns 1, 2, 13, 14, 15, 16, 17, 18. Which element is the data sheet describing?", "options": ["Tellurium, because 4A matches the modern Group 16 and Period 5 is the fifth row down", "Lead, because 4A matches the modern Group 14 and the periods are counted from the bottom", "Tin, because 4A matches the modern Group 14 and Period 5 is the fifth row down", "Zirconium, because 4A matches the modern Group 4 and Period 5 is the fifth row down"], "answer": "C", "answer_text": "Tin, because 4A matches the modern Group 14 and Period 5 is the fifth row down", "exp": "On the A/B labeling the “A” columns are the main-group columns, so 4A is the fourth main-group column, which is the modern Group 14; the fifth row down is Period 5, and Group 14 of Period 5 is tin (Sn). Reading 4A as the modern Group 4 lands on zirconium in the d block, and counting periods upward from the bottom of the table would give lead instead."}, {"id": 99, "level": "Advanced", "tag": "Chemical Families", "stem": "Two clues in the Dr. Rrrg puzzle read: “Hu has the greatest electronegativity of all of the elements” and “Hf has the highest first ionization energy of all of the elements.” Which real elements are Hu and Hf, and what families are they in?", "options": ["Hu is fluorine, a halogen, and Hf is francium, an alkali metal", "Hu is oxygen, a nonmetal, and Hf is helium, one of the noble gases", "Hu is chlorine, a halogen, and Hf is neon, one of the noble gases", "Hu is fluorine, a halogen, and Hf is helium, a noble gas"], "answer": "D", "answer_text": "Hu is fluorine, a halogen, and Hf is helium, a noble gas", "exp": "Electronegativity increases across a period from left to right and up a group, which puts fluorine at the extreme and makes it the most electronegative element, ahead of both chlorine and oxygen. First ionization energy follows the same directions, and helium tops Group 18 with a full first energy level, so its first ionization energy is the highest of any element; francium sits at the opposite corner and has one of the lowest."}, {"id": 100, "level": "Advanced", "tag": "Chemical Families", "stem": "In the alkaline earth lab, magnesium and calcium are each placed in 2 cm of distilled water with 3 drops of phenolphthalein. Calcium fizzes and the water turns bright pink; magnesium barely changes. A group is then handed beryllium, which sits directly above magnesium. What should they predict?", "options": ["Beryllium reacts faster than magnesium, because a smaller atom always reacts faster in water", "Beryllium reacts faster than calcium, because it has the fewest energy levels of the three metals", "Beryllium reacts the same as magnesium, because both are alkaline earth metals in the same family", "Beryllium reacts even less than magnesium, because its valence electrons are held closest to the nucleus"], "answer": "D", "answer_text": "Beryllium reacts even less than magnesium, because its valence electrons are held closest to the nucleus", "exp": "Reactivity of a metal tracks its first ionization energy, which RISES going up a group: beryllium has the fewest energy levels, so its valence electrons sit closest to the nucleus and are hardest to remove. Since magnesium already barely reacted, beryllium should react even less. Being in the same family does not make two metals equally reactive, as magnesium and calcium themselves demonstrated."}, {"id": 101, "level": "Advanced", "tag": "Chemical Families", "stem": "A tray sample is a dark solid at room temperature with a clearly metallic luster, yet it shatters instead of flattening, cannot be drawn into a wire, and never lights the conductivity tester. Its atoms carry 7 valence electrons. Which family is it, and does the luster change that?", "options": ["Transition metals; the metallic luster outweighs the brittleness, since all metals are lustrous", "Halogens; luster alone does not make it a metal, since iodine is a lustrous nonmetal", "Noble gases; 7 valence electrons is one short of a full level, so it is a solid noble gas", "Metalloids; 7 valence electrons plus a metallic luster place it on the staircase near silicon"], "answer": "B", "answer_text": "Halogens; luster alone does not make it a metal, since iodine is a lustrous nonmetal", "exp": "Seven valence electrons means Group 17, and brittleness with no electrical conduction is the nonmetal profile, so the sample is a halogen — iodine, the element the characteristics table lists as the exception that does have a metallic luster. Metalloids conduct at least weakly and sit on the staircase, transition metals are malleable and conduct well, and a noble gas has a full outer level — 8 valence electrons, or 2 for helium and be a gas at room temperature."}, {"id": 102, "level": "Advanced", "tag": "Metals, Nonmetals, and Metalloids", "stem": "Sample C in the Day 2 lab is shiny and solid, shatters when it is hammered, and lights the conductivity tester only dimly — and the bulb glows brighter after the sample is warmed. Why does this evidence rule the sample out as a replacement for tin in solder?", "options": ["It is a nonmetal insulator, and no nonmetal can be melted and reshaped the way that solder must be", "It is a transition metal, and its brittleness would crack the joint before the circuit closed properly", "It is a metalloid semi-conductor, and its weak conduction would not carry circuit current reliably", "It is a metalloid semi-conductor, and its conduction drops as it warms, unlike a true metal does"], "answer": "C", "answer_text": "It is a metalloid semi-conductor, and its weak conduction would not carry circuit current reliably", "exp": "Metallic luster plus brittleness plus weak conduction that improves with temperature is the metalloid profile, and conducting better as it heats up is the definition of a semi-conductor given in the characteristics table. A solder joint must carry current dependably, so weak conduction disqualifies it; the sample does conduct, so it is not an insulator, transition metals are malleable rather than brittle, and its conduction rises with warming rather than dropping."}, {"id": 103, "level": "Advanced", "tag": "Metals, Nonmetals, and Metalloids", "stem": "A student writes: “Hydrogen must be a metal, because on the periodic table it sits at the top of Group 1 directly above lithium and sodium, and both of those are metals.” What is wrong with this claim?", "options": ["Hydrogen sits on the metal side of the table but is a nonmetal, a gas with no luster or malleability", "Hydrogen is indeed a metal, but only at very high pressure; its 1 valence electron makes it malleable", "Hydrogen belongs down in Group 17, so it is really a halogen and would react with the alkali metals", "Hydrogen is a metalloid, because it sits on the staircase that divides the metals from the nonmetals"], "answer": "A", "answer_text": "Hydrogen sits on the metal side of the table but is a nonmetal, a gas with no luster or malleability", "exp": "Position alone does not decide the classification: the characteristics table states outright that hydrogen is on the metal side of the periodic table but is not a metal. At room temperature it is a colorless gas with no luster, no malleability and no ductility, which is the nonmetal profile — it is not on the staircase, so it is not a metalloid, and having 1 valence electron is the opposite of a halogen's 7."}, {"id": 104, "level": "Advanced", "tag": "History of the Periodic Table", "stem": "John Newlands' 1864 arrangement of the 64 known elements was mocked by the Chemical Society of London, yet decades later he was awarded a medal for it. What changed between those two moments?", "options": ["The noble gases were isolated, filling the missing column and making the repeat come out right", "Atomic weights were re-measured, and the new values happened to fall into a different order", "Mendeleev proved that Newlands had been right to leave gaps for undiscovered elements", "Moseley showed that ordering by atomic weight had been correct all along after all"], "answer": "A", "answer_text": "The noble gases were isolated, filling the missing column and making the repeat come out right", "exp": "Between 1894 and 1900 the noble gases were discovered and a new column was added to the table. Once that column was in place, Newlands' repeating pattern lined up properly and the Royal Society awarded him the Davy Medal. Moseley's work actually replaced atomic weight with atomic number as the ordering rule, so it did not vindicate weight-ordering."}, {"id": 105, "level": "Advanced", "tag": "History of the Periodic Table", "stem": "Argon has an average atomic mass of 39.95 u and potassium 39.10 u, yet argon is placed BEFORE potassium on the modern periodic table. Which statement explains the placement and correctly credits the scientists involved?", "options": ["Argon has 19 protons and potassium 18, so ordering by atomic weight and by protons already agree here", "Argon is a gas and potassium is a solid, and Mendeleev ordered elements by state of matter within a row", "Argon has 18 protons and potassium 19, and Moseley's ordering by atomic number fixed the reversal", "Argon's mass was measured wrongly by Ramsay, and Mendeleev later corrected the value down to 38.9 u"], "answer": "C", "answer_text": "Argon has 18 protons and potassium 19, and Moseley's ordering by atomic number fixed the reversal", "exp": "Argon is heavier than potassium by 39.95 u − 39.10 u = 0.85 u, so a strict atomic-weight ordering would place potassium first and drop argon into Group 1 with the alkali metals, which its chemistry flatly contradicts. Henry Moseley showed in 1913 that the elements line up by ATOMIC NUMBER — argon 18 protons, potassium 19 — which restores the right order and keeps argon among the noble gases that Rayleigh and Ramsay had isolated. The argon mass was not an error, and state of matter was never an ordering rule."}, {"id": 106, "level": "Advanced", "tag": "Electron Configuration", "stem": "A student writes the standard electron configuration of nickel as 1s²2s²2p⁶3s²3p⁶3d¹⁰. The electron count is right — it adds up to 28. What is still wrong, and what is the correct configuration?", "options": ["The 3p sublevel fills after 3d, so nickel is 1s²2s²2p⁶3s²3d¹⁰3p⁶", "Nothing is wrong; nickel has 28 electrons, so 1s²2s²2p⁶3s²3p⁶3d¹⁰ is acceptable", "The 3d sublevel can hold only 8 electrons, so nickel is 1s²2s²2p⁶3s²3p⁶3d⁸4p²", "The 4s sublevel fills before 3d, so nickel is 1s²2s²2p⁶3s²3p⁶3d⁸4s²"], "answer": "D", "answer_text": "The 4s sublevel fills before 3d, so nickel is 1s²2s²2p⁶3s²3p⁶3d⁸4s²", "exp": "Electrons take the lowest available room first, and the 4s room sits lower in energy than the 5-room 3d apartment, so 4s takes 2 electrons before any electron enters 3d — that leaves 8 for the d sublevel: 1s²2s²2p⁶3s²3p⁶3d⁸4s². A d sublevel does hold up to 10 electrons, so a capacity limit is not the reason, and 3p fills before 3d rather than after. Getting the total right is necessary but not sufficient; the filling order has to be right too."}, {"id": 107, "level": "Advanced", "tag": "Electron Configuration", "stem": "Tin's noble gas electron configuration is [Kr]4d¹⁰5s²5p², and krypton has 36 electrons. How many electrons does a neutral tin atom have, and how many of those are valence electrons?", "options": ["50 electrons, of which 2 are valence electrons in the 5s sublevel only", "50 electrons, of which 4 are valence electrons in the 5s and 5p sublevels", "50 electrons, of which 14 are valence electrons in the 4d, 5s and 5p sublevels", "14 electrons, of which 4 are valence electrons in the 5s and 5p sublevels"], "answer": "B", "answer_text": "50 electrons, of which 4 are valence electrons in the 5s and 5p sublevels", "exp": "Counting past krypton gives 36 + 10 + 2 + 2 = 50 electrons, and 50 is tin's atomic number. Valence electrons are the electrons in the outermost energy level, which is level 5, so the 5s² and 5p² electrons make 4 valence electrons — exactly what Group 14 predicts. The 4d¹⁰ electrons are in energy level 4 and do not count, and 14 counts only the electrons written after the bracket."}, {"id": 108, "level": "Advanced", "tag": "Electron Configuration", "stem": "A worksheet asks for the NOBLE GAS electron configuration of zinc, which has 30 electrons. A student answers 1s²2s²2p⁶3s²3p⁶3d¹⁰4s². Is that answer acceptable, and what should it be?", "options": ["Yes — the two forms are interchangeable so long as the electron count is 30", "No — the electron count is wrong; the noble gas form is [Ar]3d¹⁰4s²4p²", "No — that is the standard form; the noble gas form is [Ar]3d¹⁰4s²", "No — that is the standard form; the noble gas form is [Ne]3d¹⁰4s²"], "answer": "C", "answer_text": "No — that is the standard form; the noble gas form is [Ar]3d¹⁰4s²", "exp": "The configuration itself is correct, but it is written in STANDARD form. A noble gas configuration replaces the filled inner portion with the previous noble gas in brackets, and the noble gas before zinc is argon with 18 electrons, so 1s²2s²2p⁶3s²3p⁶ collapses to [Ar] and zinc becomes [Ar]3d¹⁰4s². Using [Ne] would leave 3s²3p⁶ unaccounted for, and adding 4p² would give 32 electrons, which is germanium."}, {"id": 109, "level": "Advanced", "tag": "Valence Electrons and Lewis Dot", "stem": "A student draws the Lewis dot structure of tin as the symbol Sn with a pair of dots on the top side and a pair of dots on the right side. Tin is in Group 14. What is wrong with the drawing?", "options": ["The count is wrong; a Group 14 element shows 14 dots arranged around its element symbol", "The pairing is right, but tin should show only 2 dots because just the 5s pair can count", "Nothing is wrong; dots always pair on one side first and then spread to the empty sides", "The count of 4 is right, but dots go singly on all four sides before any of them pair up"], "answer": "D", "answer_text": "The count of 4 is right, but dots go singly on all four sides before any of them pair up", "exp": "Group 14 gives tin 4 valence electrons, so 4 dots is the right total. The placement rule is one dot per side until all four sides are used and only then do dots pair, so tin is drawn with one dot on the top, bottom, left and right. Showing 14 dots confuses the group number with the valence count, and the 5p² electrons are valence electrons too, so 2 dots is short by half."}, {"id": 110, "level": "Advanced", "tag": "Valence Electrons and Lewis Dot", "stem": "Bismuth (Bi) is one of the four candidates on the research sheet. Bismuth is in Group 15 and Period 6. How many dots belong in its Lewis dot structure, and how are they arranged around the symbol?", "options": ["5 dots: one pair on one side and single dots on each of the other three sides", "5 dots: two pairs on two adjacent sides and one single dot on a third side", "3 dots: one dot on each of three sides, matching bismuth's common 3+ ion charge", "6 dots: three pairs, one pair on each of three sides, matching its Period 6 row"], "answer": "A", "answer_text": "5 dots: one pair on one side and single dots on each of the other three sides", "exp": "Group 15 means 5 valence electrons, so the structure carries 5 dots. Applying the rule of one dot per side up to four and then pairing, the first four dots take the four sides and the fifth doubles up, giving exactly one pair and three singles. Using the period number 6 or an ion charge of 3 in place of the group number produces the wrong dot count entirely."}, {"id": 111, "level": "Advanced", "tag": "Atomic Radius", "stem": "Atomic radii for four candidate metals are aluminum 118 pm, magnesium 145 pm, copper 145 pm and nickel 149 pm. Nickel and copper are both in Period 4 and in adjacent columns. Which statement best accounts for this set of data?", "options": ["Nickel is largest at 149 pm; radii change little across the transition metals because electrons fill an inner sublevel", "Aluminum is largest at 118 pm; radii shrink going down a group because the added energy levels are packed in tightly", "Magnesium is largest at 145 pm; the radius of a transition metal must exceed that of every main-group metal listed", "Copper is largest at 145 pm; radii climb steadily across the transition metals as each added proton widens the atom out"], "answer": "A", "answer_text": "Nickel is largest at 149 pm; radii change little across the transition metals because electrons fill an inner sublevel", "exp": "The largest number in the list is nickel's 149 pm; copper and magnesium tie at 145 pm and aluminum is smallest at 118 pm, so copper, aluminum and magnesium are each ruled out as “largest” by the data themselves. From nickel to copper the radius falls only 4 pm because the electrons being added enter the inner 3d sublevel rather than the outermost energy level, so the pull on the valence electrons barely changes — nothing like the 118 pm to 190 pm swing across the main-group elements. Radius increases down a group rather than shrinking."}, {"id": 112, "level": "Advanced", "tag": "Atomic Radius", "stem": "The Day 8 graph plots atomic radius against atomic number: H 53 pm, He 31 pm, Li 167 pm, Ne 38 pm, Na 190 pm, Ar 71 pm, K 243 pm, Kr 88 pm. Which description of the graph's shape and its cause fits the data?", "options": ["Sawtooth: each noble gas is a peak because a full outer level pushes the electrons outward, and each alkali metal is low", "Sawtooth: each alkali metal is a peak because it starts a new energy level, and each noble gas is a low point", "Steady rise: radius grows with every proton added, so the largest atomic number always has the largest radius", "Steady fall: radius shrinks with every proton added, so the smallest atomic number always has the largest radius"], "answer": "B", "answer_text": "Sawtooth: each alkali metal is a peak because it starts a new energy level, and each noble gas is a low point", "exp": "The alkali metals are the high points — Li 167 pm, Na 190 pm, K 243 pm, each taller than the last — because each one begins a brand-new outermost energy level farther from the nucleus, while the noble gases that end each period are the low points at He 31 pm, Ne 38 pm, Ar 71 pm and Kr 88 pm. That is the opposite of making the noble gases the peaks. A steady rise would make krypton at atomic number 36 bigger than potassium at 19, and 88 pm is nowhere near 243 pm, while a steady fall would make hydrogen the largest atom on the graph."}, {"id": 113, "level": "Advanced", "tag": "Atomic Radius", "stem": "Treat an aluminum atom as a sphere with a radius of 118 pm and use V = (4/3)πr³. What is the volume of one aluminum atom, reported to the correct number of significant digits?", "options": ["6,882,316 pm³", "6.88 × 10⁶ pm³", "6.9 × 10⁶ pm³", "1.64 × 10⁶ pm³"], "answer": "B", "answer_text": "6.88 × 10⁶ pm³", "exp": "V = (4/3)π(118 pm)³ = (4/3)π(1.643032 × 10⁶ pm³) = 6.8823 × 10⁶ pm³ on the calculator. The radius carries 3 significant digits while 4/3 and π are exact and never limit a result, so the answer keeps 3 SD: 6.88 × 10⁶ pm³. Writing 6,882,316 pm³ copies the whole calculator display, 6.9 × 10⁶ pm³ discards a digit the measurement supports, and 1.64 × 10⁶ pm³ is r³ with the (4/3)π left out."}, {"id": 114, "level": "Advanced", "tag": "Ionic Radius", "stem": "Three ions from Period 3 have these radii: Na⁺ 102 pm, Mg²⁺ 72 pm, Al³⁺ 54 pm. Each of the three has exactly 10 electrons. Why does the radius shrink so sharply from Na⁺ to Al³⁺?", "options": ["The proton count climbs from 11 to 13 while the electron count stays at 10, so the pull on those 10 grows", "Aluminum's larger charge attracts more neighboring ions, and that crowding squeezes the ion into less space", "Each ion loses one more entire energy level as its charge rises, so Al³⁺ has fewer levels than Na⁺ has", "The electron count falls from 11 to 13 while the proton count stays at 10, so the outer level collapses in"], "answer": "A", "answer_text": "The proton count climbs from 11 to 13 while the electron count stays at 10, so the pull on those 10 grows", "exp": "All three ions end up with the configuration 1s²2s²2p⁶, so the electron count is locked at 10 and only the nucleus changes: sodium 11 protons, magnesium 12, aluminum 13. More protons pulling on the same 10 electrons means a stronger pull and a smaller ion, which is exactly the 102 → 72 → 54 pm drop. Swapping protons and electrons reverses the physics, and all three ions already sit at the same two energy levels, so none of them loses an extra level."}, {"id": 115, "level": "Advanced", "tag": "Ionic Radius", "stem": "A study sheet states: “Ionic radius simply increases across a period from right to left.” The Period 3 ionic radii are Na⁺ 102 pm, Mg²⁺ 72 pm, Al³⁺ 54 pm, P³⁻ 212 pm, S²⁻ 184 pm, Cl⁻ 181 pm. What do the data actually show?", "options": ["The positive ions shrink from Na⁺ to Al³⁺, then the size jumps up at P³⁻ and falls again to Cl⁻", "The positive ions grow from Na⁺ to Al³⁺, then the size drops at P³⁻ and climbs again toward Cl⁻", "Every ion is larger than the ion to its right, so the right-to-left rule does hold across the whole period", "Every ion is smaller than the ion to its right, so the rule should simply be reversed across the period"], "answer": "A", "answer_text": "The positive ions shrink from Na⁺ to Al³⁺, then the size jumps up at P³⁻ and falls again to Cl⁻", "exp": "Reading right to left, Cl⁻ 181 pm, S²⁻ 184 pm and P³⁻ 212 pm do get larger, but the sequence breaks wide open between P³⁻ 212 pm and Al³⁺ 54 pm — a drop of 158 pm, not an increase, so no single blanket rule covers the row. The metals lost their entire outermost energy level to form positive ions while the nonmetals kept theirs and added electrons, which produces two separate shrinking runs (102 → 54 pm and 212 → 181 pm) instead of one smooth climb."}, {"id": 116, "level": "Advanced", "tag": "Ionic Radius", "stem": "A magnesium atom has a radius of 145 pm and the Mg²⁺ ion a radius of 72 pm. Treating both as spheres with V = (4/3)πr³, the ion's volume is about what percent of the atom's volume?", "options": ["50%", "200%", "12%", "25%"], "answer": "C", "answer_text": "12%", "exp": "The (4/3)π cancels in a ratio, so V(ion)/V(atom) = (72 pm / 145 pm)³ = (0.4966)³ = 0.1224. The radius 72 pm carries only 2 significant digits, so the result is reported as 12%. Using the radius ratio without cubing gives 50%, squaring instead of cubing gives 25%, and 200% would make the ion bigger than the atom, contradicting the rule that positive ions are smaller than their neutral atoms."}, {"id": 117, "level": "Advanced", "tag": "Ionization Energy", "stem": "A supplier sheet lists first ionization energies in kJ/mol for four metals identified only by code: W 375.7, X 577.5, Y 708.6, Z 745.5. Tin's first ionization energy is 708.6 kJ/mol. Which code is tin, and which metal is the MOST reactive?", "options": ["Y is tin, and Z is most reactive because it holds on to its valence electron most tightly", "Y is tin, and W is most reactive because it gives up a valence electron most easily", "W is tin, and Y is most reactive because its value sits in the middle of the listed range", "Z is tin, and W is most reactive because it gives up a valence electron most easily"], "answer": "B", "answer_text": "Y is tin, and W is most reactive because it gives up a valence electron most easily", "exp": "Tin's known value of 708.6 kJ/mol matches code Y exactly, so Z at 745.5 kJ/mol and W at 375.7 kJ/mol are other elements. More reactive metals have LOWER first ionization energies, so W at 375.7 kJ/mol — low enough to be an alkali metal such as cesium — loses its valence electron most easily and is the most reactive. Holding an electron tightly, as Z does at 745.5 kJ/mol, is the mark of the least reactive metal of the four."}, {"id": 118, "level": "Advanced", "tag": "Ionization Energy", "stem": "Silicon and tin are both in Group 14. Silicon's first ionization energy is 786.5 kJ/mol and tin's is 708.6 kJ/mol. Which explanation fits both the group trend and these two numbers?", "options": ["Tin's value is lower because tin has fewer protons than silicon, so its nucleus pulls less on the electrons", "Tin's value is lower because tin has more valence electrons than silicon and spreads the pull among them", "Tin's value is higher because tin has more protons, and more protons always mean a stronger pull inward", "Tin's value is lower because its valence electrons sit in a higher energy level, farther from the nucleus"], "answer": "D", "answer_text": "Tin's value is lower because its valence electrons sit in a higher energy level, farther from the nucleus", "exp": "Each step down a group adds an energy level, so tin's valence electrons are in level 5 while silicon's are in level 3; the farther the valence electrons sit from the nucleus, the less pull they feel and the less energy it takes to remove one — 708.6 kJ/mol versus 786.5 kJ/mol. Tin has MORE protons than silicon (50 versus 14), not fewer, and both elements have exactly 4 valence electrons, so neither of those can explain the drop; and 708.6 is lower than 786.5, not higher."}, {"id": 119, "level": "Advanced", "tag": "Ionization Energy", "stem": "First ionization energies: magnesium 737.7 kJ/mol, calcium 589.8 kJ/mol. In the alkaline earth lab one metal fizzed hard in 1.0 M HCl and, in the separate water test, turned the phenolphthalein bright pink, while the other barely reacted in either. Which metal was the vigorous one, and what in the data supports it?", "options": ["Calcium, because 589.8 kJ/mol is the lower value, so it gives up its valence electrons more easily", "Magnesium, because 737.7 kJ/mol is the higher value, so it gives up its valence electrons more easily", "Magnesium, because a smaller atom always reacts faster than a larger atom within the very same group", "Calcium, because 589.8 kJ/mol is the higher value, so it holds on to its valence electrons more tightly"], "answer": "A", "answer_text": "Calcium, because 589.8 kJ/mol is the lower value, so it gives up its valence electrons more easily", "exp": "A lower first ionization energy means a metal parts with its valence electrons more readily, and 589.8 kJ/mol is lower than 737.7 kJ/mol, so calcium is the more reactive metal — which matches the vigorous fizzing and the pink phenolphthalein. Calling 589.8 kJ/mol the higher value simply misreads the numbers, and within a group the smaller atom is the LESS reactive metal because its valence electrons are held more tightly."}, {"id": 120, "level": "Advanced", "tag": "Electronegativity", "stem": "Electronegativity values for four solder candidates are copper 1.90, nickel 1.91, tin 1.96 and bismuth 2.02, while fluorine is 3.98. Which conclusion do these values support?", "options": ["All four are nonmetals, so their values cluster low, and fluorine is a metal sitting at the opposite corner", "Bismuth at 2.02 attracts electrons about half as strongly as fluorine at 3.98, since 2.02 is about half of 3.98", "All four are metals far from the top right corner, so their values cluster low, while fluorine is extreme", "The narrow spread proves that all four candidates have to lie in the same group and the same period as well"], "answer": "C", "answer_text": "All four are metals far from the top right corner, so their values cluster low, while fluorine is extreme", "exp": "Electronegativity increases across a period from left to right and up a group, so fluorine sits at the extreme corner with the highest value of any element, 3.98. Copper, nickel, tin and bismuth are all metals from the middle and lower right of the table, far from that corner, which is why they crowd into the narrow 1.90 to 2.02 band — they are metals rather than nonmetals, and they come from Groups 11, 10, 14 and 15, so a narrow spread does not mean one group. The scale is not a simple ratio, so 2.02 does not mean “half the pull” of fluorine."}, {"id": 121, "level": "Advanced", "tag": "Electronegativity", "stem": "A student writes: “Electronegativity increases going down a group, because the atoms get bigger and a bigger atom has more room to hold onto extra electrons.” Which correction is needed?", "options": ["Electronegativity INCREASES down a group, but only because each atom gains protons, not extra room", "Electronegativity DECREASES down a group, because the valence shell is farther out and pulls in less", "Electronegativity stays the same down a group, because every element in a group has the same valence count", "Electronegativity DECREASES down a group, because atoms give up their valence electrons as they grow"], "answer": "B", "answer_text": "Electronegativity DECREASES down a group, because the valence shell is farther out and pulls in less", "exp": "Electronegativity runs in the same directions as first ionization energy: it increases across a period from left to right and UP a group. Going down a group adds energy levels, so the valence shell sits farther from the nucleus and there is less pull to bring in new electrons — the trend falls, with cesium at 0.79 far below lithium at 0.98. Atoms do not shed valence electrons as they grow (every Group 1 atom still has exactly 1), and having the same valence count does not hold the value constant."}, {"id": 122, "level": "Advanced", "tag": "Reactivity Trends", "stem": "In the halogen lab, chlorine water changed the color of both the bromide and the iodide solution but did nothing to the chloride solution; bromine water changed only the iodide solution; iodine water changed nothing at all. Which ranking do these results support, and what should fluorine water do?", "options": ["Cl > Br > I; fluorine would react with all three salts, since reactivity increases up Group 17", "Br > Cl > I; fluorine would react only with the chloride, since it sits directly above chlorine", "I > Br > Cl; fluorine would react with none of the salts, since reactivity increases down Group 17", "Cl > Br > I; fluorine would react with none of the salts, since it is already the smallest halogen"], "answer": "A", "answer_text": "Cl > Br > I; fluorine would react with all three salts, since reactivity increases up Group 17", "exp": "A halogen that replaces the halide in a salt is the more reactive of the two: chlorine displaced both bromide and iodide, bromine displaced only iodide, and iodine displaced nothing, which orders them Cl > Br > I. Reactivity of the halogens increases as you move UP the group, so fluorine, sitting above chlorine, should displace chloride, bromide and iodide alike — a ranking of I > Br > Cl or Br > Cl > I contradicts the observed grid outright."}, {"id": 123, "level": "Advanced", "tag": "Reactivity Trends", "stem": "In the Day 10 quick labs, steel wool in 3% hydrogen peroxide with salt turned orange-brown within minutes, and a penny left in salt and vinegar grew a green coating. Both changes are corrosion. How should this evidence shape the choice of a replacement for tin?", "options": ["Prefer the metal that corroded fastest, since a fresh oxide layer conducts current better than bare metal", "Prefer a nonmetal instead, since corrosion is the formation of a metal oxide and only metals can corrode", "Prefer a metal that resists forming a metal oxide, since an oxide layer weakens the joint's contact", "Ignore corrosion entirely, since a metal oxide can only form when a metal is heated in a furnace or flame"], "answer": "C", "answer_text": "Prefer a metal that resists forming a metal oxide, since an oxide layer weakens the joint's contact", "exp": "Corrosion is the formation of a metal oxide and can occur in any metal, so a candidate that oxidizes readily will build a layer at exactly the joint that has to carry current. Metal oxides are poor conductors rather than better ones, and both of these reactions ran at room temperature in minutes, so heat is clearly not required. Switching to a nonmetal is no escape either, because solder still has to be malleable and conduct electricity."}, {"id": 124, "level": "Advanced", "tag": "Density and Material Properties", "stem": "A group masses a copper cylinder at 144.30 g on a lab balance, then lowers it into a graduated cylinder marked every 1 mL. The water reads 25.0 mL before and 41.1 mL after. Their worked solution reads: D = 144.30 g ÷ 41.1 mL = 3.51 g/mL. (Density = mass ÷ volume.) What went wrong?", "options": ["They used the starting reading instead of the displaced volume; D = 144.30 g ÷ 25.0 mL = 5.77 g/mL", "They used the displaced volume instead of the final reading; D = 144.30 g ÷ 41.1 mL = 3.51 g/mL", "They inverted the ratio; the density should be 16.1 mL ÷ 144.30 g = 0.112 mL/g for this cylinder", "They used the final reading instead of the displaced volume; D = 144.30 g ÷ 16.1 mL = 8.96 g/mL"], "answer": "D", "answer_text": "They used the final reading instead of the displaced volume; D = 144.30 g ÷ 16.1 mL = 8.96 g/mL", "exp": "The volume of the metal is only the water it pushed aside: 41.1 mL − 25.0 mL = 16.1 mL, which keeps one decimal place and 3 significant digits. Dividing 144.30 g by 16.1 mL gives 8.9627, reported as 8.96 g/mL — copper's accepted value. Dividing by the 41.1 mL final reading counts water that was already in the cylinder, dividing by 25.0 mL uses space the metal never occupied, and 0.112 mL/g inverts mass and volume."}, {"id": 125, "level": "Advanced", "tag": "Density and Material Properties", "stem": "Using a mass of 144.30 g and a displaced volume of 16.1 mL, a student's calculator displays 8.962732919 and the student writes “D = 8.9627 g/mL” on the lab sheet. What is the correct report?", "options": ["8.96 g/mL, because the 16.1 mL volume limits the quotient to 3 significant digits", "8.9627 g/mL, because carrying extra digits along always makes a reported result more accurate", "8.963 g/mL, because the mass has more digits than the volume and should set the limit", "9 g/mL, because a graduated cylinder can never support more than 1 significant digit anyway"], "answer": "A", "answer_text": "8.96 g/mL, because the 16.1 mL volume limits the quotient to 3 significant digits", "exp": "In division the answer keeps the fewest significant digits among the inputs: 144.30 g has 5 SD but 16.1 mL has only 3, so the quotient is rounded to 3 SD and reported as 8.96 g/mL. Writing 8.9627 g/mL claims a precision the volume measurement cannot support, and letting the more precise mass set the limit at 8.963 g/mL makes the same mistake one digit later. Reporting 9 g/mL throws away two digits the cylinder genuinely provided, since it was read to the nearest tenth of a mL."}, {"id": 126, "level": "Advanced", "tag": "Density and Material Properties", "stem": "An atomic-scale data table lists nickel with an average atomic mass of 58.7 u, an effective volume per atom in the solid of 1.10 × 10⁷ pm³, and a density of 5.85 × 10⁻⁶ u/pm³. Check the arithmetic against the two measurements given. What should the density entry be?", "options": ["5.34 × 10⁻⁶ u/pm³, and the printed value is an arithmetic error", "5.3 × 10⁻⁶ u/pm³, and the answer may carry only 2 significant digits", "5.85 × 10⁻⁶ u/pm³, and the printed value checks out just fine", "1.87 × 10⁵ u/pm³, and the printed value has the ratio inverted"], "answer": "A", "answer_text": "5.34 × 10⁻⁶ u/pm³, and the printed value is an arithmetic error", "exp": "Density is mass divided by volume: 58.7 u ÷ 1.10 × 10⁷ pm³ = 5.336 × 10⁻⁶ u/pm³, and both inputs carry 3 significant digits, so the entry should read 5.34 × 10⁻⁶ u/pm³. The printed 5.85 × 10⁻⁶ u/pm³ cannot be reproduced from these two numbers at all, so the table is wrong. Dividing volume by mass gives 1.87 × 10⁵ with the units upside down, and cutting back to 5.3 × 10⁻⁶ discards a digit that both measurements support."}, {"id": 127, "level": "Advanced", "tag": "Case File: Conflict and Cellphones", "stem": "The team profiles four candidates. Bismuth: density 9.79 g/cm³, melting point 271.4 °C, poor heat and electrical conduction, not malleable. Nickel: 8.91 g/cm³, 1455 °C, good conduction, malleable. Copper: 8.96 g/cm³, 1084.6 °C, excellent conduction, malleable. Lead: 11.34 g/cm³, 327.5 °C, poor conduction, malleable. Round 1 eliminates ONE candidate on PHYSICAL properties alone. Which one goes?", "options": ["Nickel, because its 1455 °C melting point is a chemical property that no solder can tolerate", "Copper, because its 8.96 g/cm³ density is higher than bismuth's and would add weight to each phone", "Bismuth, because it is the only candidate that is both a poor conductor and not malleable", "Lead, because its toxicity to humans is the most serious physical property in the whole table"], "answer": "C", "answer_text": "Bismuth, because it is the only candidate that is both a poor conductor and not malleable", "exp": "Solder has to carry the circuit and be worked into the joint, and bismuth is the only one of the four that both conducts poorly and cannot be hammered or drawn out — lead conducts poorly but is still malleable, so bismuth fails on physical properties first. Melting point is a physical property rather than a chemical one, and toxicity is a chemical property that belongs to the next round; copper's 8.96 g/cm³ is actually LOWER than bismuth's 9.79 g/cm³, so that reason has the comparison backwards."}, {"id": 128, "level": "Advanced", "tag": "Case File: Conflict and Cellphones", "stem": "The economics table gives tin at $12.00 per pound, abundance 0.00022%, mined mainly in China, Myanmar and Indonesia. Nickel is $3.97 per pound, abundance 0.0089%, mined mainly in Indonesia, the Philippines and Russia. Tin is one of the four minerals designated as conflict minerals under US law — tin, tantalum, tungsten and gold; nickel is not. PumpkinTech's tin supplier was red-flagged as a trader of conflict material. What does this mean for the team's CER?", "options": ["Switching to nickel ends the sourcing problem, because nickel is not a designated conflict mineral", "Switching to nickel is pointless, because nickel costs more per pound than tin does at $12.00 a pound", "Switching to nickel ends the sourcing problem, because nickel is about 40 times more abundant", "Switching to nickel cuts cost and eases supply, but does not by itself tell the team where its metal comes from"], "answer": "D", "answer_text": "Switching to nickel cuts cost and eases supply, but does not by itself tell the team where its metal comes from", "exp": "Nickel is cheaper ($3.97 versus $12.00 per pound) and roughly 40 times more abundant (0.0089% versus 0.00022%), which are genuine advantages, and nickel is indeed not one of the four designated conflict minerals. But the company's problem was a red-flagged supplier, and changing the element does not tell the team which mines and traders its nickel would come from — that still takes supplier auditing. Nickel costs less than tin, not more, and abundance says nothing about who handled the ore."}, {"id": 129, "level": "Advanced", "tag": "Case File: Conflict and Cellphones", "stem": "Melting points: tin 231.9 °C, bismuth 271.4 °C, lead 327.5 °C, copper 1084.6 °C, nickel 1455 °C. Solder has to melt at a temperature low enough that the circuit board survives the joint being made. Ranked on melting point ALONE, which candidate matches tin most closely, and what is the trade-off?", "options": ["Copper at 1084.6 °C, the best conductor listed, and its melting point is nearest tin's", "Bismuth at 271.4 °C, only 39.5 °C above tin, but it is brittle and conducts poorly", "Lead at 327.5 °C, only 39.5 °C above tin, but it is very toxic when it is ingested", "Nickel at 1455 °C, over 1200 °C above tin, but it is malleable and conducts well"], "answer": "B", "answer_text": "Bismuth at 271.4 °C, only 39.5 °C above tin, but it is brittle and conducts poorly", "exp": "Subtracting gives 271.4 °C − 231.9 °C = 39.5 °C for bismuth, the smallest gap of the four; lead is next at 327.5 °C − 231.9 °C = 95.6 °C, so the 39.5 °C figure does not belong to lead, and copper at 1084.6 °C is over 850 °C away. Melting point alone favors bismuth, yet bismuth is not malleable and conducts heat and electricity poorly, which is why the physical-properties round drops it — one criterion is never enough to decide."}, {"id": 130, "level": "Advanced", "tag": "Case File: Conflict and Cellphones", "stem": "One phone contains 0.150 cm³ of solder. Tin's density is 7.29 g/cm³ and lead's is 11.34 g/cm³. Using Density = mass ÷ volume, how much mass would going back to lead solder ADD to each phone?", "options": ["1.70 g, since that is the mass of the lead solder itself", "4.05 g, since lead is 11.34 g/cm³ and tin is 7.29 g/cm³", "0.61 g, since lead solder is 1.70 g and tin solder is 1.09 g", "0.25 g, since lead solder is 1.34 g and tin solder is 1.09 g"], "answer": "C", "answer_text": "0.61 g, since lead solder is 1.70 g and tin solder is 1.09 g", "exp": "Rearranging gives mass = density × volume, so lead is 11.34 g/cm³ × 0.150 cm³ = 1.70 g and tin is 7.29 g/cm³ × 0.150 cm³ = 1.09 g, each to 3 significant digits because 0.150 cm³ carries 3 SD. The mass ADDED is the difference, 1.70 g − 1.09 g = 0.61 g. Reporting 1.70 g answers a different question — the total lead mass rather than the increase — and 4.05 g is only the difference in densities, which carries units of g/cm³ rather than grams."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>
  `<button data-t="${i}">${t}<span class="c">${tagCount[t]}</span></button>`).join('');
document.querySelectorAll('#tagchips button').forEach((b,i)=>{
  b.onclick = ()=>{
    const t = tags[i];
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.classList.toggle('on', picked.has(t));
    refresh();
  };
});
$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
