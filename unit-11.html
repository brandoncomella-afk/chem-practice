<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Water, Polarity, and Dissolving", "stem": "Water is called the universal solvent because it is a polar molecule. Which statement explains why a water molecule is polar?", "options": ["The oxygen atom pulls the shared electrons more strongly, so it takes a partial negative charge", "The oxygen atom has a lower electronegativity than hydrogen, so it takes a partial positive charge", "The hydrogen atoms give their electrons away completely, so the molecule is built out of two ions", "The oxygen atom and the hydrogen atoms share the electrons perfectly evenly among the three of them"], "answer": "A", "answer_text": "The oxygen atom pulls the shared electrons more strongly, so it takes a partial negative charge", "exp": "Oxygen has the higher electronegativity, so it pulls the shared electrons closer and takes a partial negative charge while the hydrogen ends take a partial positive charge. Perfectly even sharing would make the molecule nonpolar, giving electrons away completely would build ions rather than a covalent molecule, and oxygen's electronegativity is higher than hydrogen's, not lower."}, {"id": 2, "level": "Beginner", "tag": "Water, Polarity, and Dissolving", "stem": "A student shakes cooking oil with water in a beaker, and the two layers separate again as soon as the shaking stops. Why does the oil not dissolve?", "options": ["Oil is lighter than water, and a substance that floats can never dissolve at all", "Oil is nonpolar, so the polar water molecules are not attracted to it", "Oil is polar, so the polar water molecules push it away into its own layer", "Oil is an ionic compound, and ionic compounds dissolve only in nonpolar liquids"], "answer": "B", "answer_text": "Oil is nonpolar, so the polar water molecules are not attracted to it", "exp": "Oil is nonpolar, so the partial charges on water find nothing to attract and the oil stays in its own layer. Calling oil polar gets the property backwards, oil is a molecular substance rather than an ionic compound, and floating has nothing to do with whether a solute dissolves."}, {"id": 3, "level": "Beginner", "tag": "Water, Polarity, and Dissolving", "stem": "Table salt dissolves because polar water molecules pull the ions apart. Which end of a water molecule is attracted to a chloride ion, Cl⁻?", "options": ["The hydrogen end, which carries a partial positive charge", "The oxygen end, which carries a partial positive charge", "The oxygen end, which carries a full negative charge of −1", "The hydrogen end, which carries a partial negative charge"], "answer": "A", "answer_text": "The hydrogen end, which carries a partial positive charge", "exp": "A chloride ion is negative, so it is attracted to the hydrogen end of water, which carries the partial positive charge. The oxygen end carries the partial negative charge and attracts positive ions instead, and the charges on water are partial charges from unequal sharing, never a full −1."}, {"id": 4, "level": "Beginner", "tag": "Solute, Solvent, and Solution", "stem": "In the drink-mix lab you stir a spoonful of powdered drink mix into a beaker of water. Which substance is the solute?", "options": ["The drink mix, because it is the substance being dissolved", "The stirring rod, because it is what breaks the powder apart", "The water, because it is the substance being dissolved by the powder", "The finished drink, because a solution counts as its own solute"], "answer": "A", "answer_text": "The drink mix, because it is the substance being dissolved", "exp": "The solute is the substance being dissolved, which here is the powdered drink mix; the water is the solvent doing the dissolving. The finished drink is the solution the two of them make, and the stirring rod is equipment that only speeds the dissolving up."}, {"id": 5, "level": "Beginner", "tag": "Solute, Solvent, and Solution", "stem": "Your Science Spiral defines the parts of a solution. What is the solvent?", "options": ["The undissolved solid that is left sitting on the bottom of the beaker", "The substance present in the larger amount, which does the dissolving", "The evenly mixed combination of everything in the beaker after stirring", "The substance in the smaller amount, which gets dissolved by the other one"], "answer": "B", "answer_text": "The substance present in the larger amount, which does the dissolving", "exp": "The solvent is the substance present in the larger amount, and it is what does the dissolving. The substance in the smaller amount is the solute, the evenly mixed combination is the solution itself, and undissolved solid on the bottom is simply solute that never went in."}, {"id": 6, "level": "Beginner", "tag": "Solute, Solvent, and Solution", "stem": "A student stirs table salt into water until none of it is left in view, and the liquid stays clear. What has the student made?", "options": ["A pure substance, because the salt and the water became one compound", "A solution, because the salt settled out into a separate bottom layer", "Nothing new, because the salt disappeared and is no longer present", "A solution, because the salt is evenly mixed through the water"], "answer": "D", "answer_text": "A solution, because the salt is evenly mixed through the water", "exp": "A solution is a mixture that is evenly mixed throughout, which is exactly what clear salt water is. The salt is still present, spread through the water as ions, so it has not disappeared; no new compound formed, since this is a mixture and not a reaction; and a settled bottom layer would mean the salt had not dissolved."}, {"id": 7, "level": "Beginner", "tag": "Electrolytes and Nonelectrolytes", "stem": "A conductivity tester is dipped into a beaker of salt water and the bulb lights up. What does that tell you about the solution?", "options": ["The tester has identified exactly which ion is in the water", "Dissolved ions are present in the solution to carry the current", "Dissolved sugar is present, the one solute that carries a current", "Dissolved molecules are present, and molecules carry current best"], "answer": "B", "answer_text": "Dissolved ions are present in the solution to carry the current", "exp": "A lit bulb means an ionic compound dissolved and dissociated, so dissolved ions are present to carry the current. The tester cannot say which ion is there, dissolved sugar leaves the bulb dark because it does not ionize, and whole molecules do not carry a current."}, {"id": 8, "level": "Beginner", "tag": "Electrolytes and Nonelectrolytes", "stem": "Sugar dissolves completely in a beaker of water, but the conductivity tester stays dark. What does that make sugar?", "options": ["A nonelectrolyte, because it dissolves without breaking into ions", "An electrolyte, because anything that dissolves in water must form ions", "An electrolyte, because its molecules carry a current once they spread out", "A nonelectrolyte, because it never truly dissolves in water in the first place"], "answer": "A", "answer_text": "A nonelectrolyte, because it dissolves without breaking into ions", "exp": "Sugar dissolves but does not ionize, so no ions are there to carry a current and sugar is a nonelectrolyte. Dissolving does not by itself produce ions, whole sugar molecules carry no current, and the sugar plainly did dissolve, since the liquid is clear."}, {"id": 9, "level": "Beginner", "tag": "Electrolytes and Nonelectrolytes", "stem": "NaCl is an ionic compound. What does it do when it dissolves in water?", "options": ["It stays whole, drifting through the water as intact NaCl units", "It reacts with the water and is destroyed, leaving only pure water", "It dissociates in water, breaking apart into its component ions", "It ionizes into neutral sodium and chlorine atoms that float apart"], "answer": "C", "answer_text": "It dissociates in water, breaking apart into its component ions", "exp": "An ionic compound dissociates in water, which means it breaks apart into its component ions, and those ions are what a conductivity tester detects. Intact NaCl units would leave the bulb dark, the particles released are charged ions rather than neutral atoms, and the salt is not destroyed, since evaporating the water brings it back."}, {"id": 10, "level": "Beginner", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "A beaker of water at 25 °C has extra table salt sitting undissolved on the bottom after standing overnight. How is this solution described?", "options": ["Dilute, because the leftover solid shows very little salt actually dissolved", "Saturated, because it holds all the solute it can at that temperature", "Unsaturated, because there is still solid sitting on the bottom of it", "Supersaturated, because it holds more solute than it normally could"], "answer": "B", "answer_text": "Saturated, because it holds all the solute it can at that temperature", "exp": "A solution sitting at its saturation point with undissolved solute left over is saturated: it holds all the solute it can at that temperature. Unsaturated would mean more could still dissolve, supersaturated means holding more than the saturation point after cooling undisturbed, and the leftover solid shows the water is full rather than dilute."}, {"id": 11, "level": "Beginner", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Your solubility curve shows that Compound W holds 145 g per 100. mL of water at 20 °C. A student stirs 50. g of Compound W into 100. mL of water at 20 °C and all of it dissolves. How is this solution described?", "options": ["Saturated, because 20 °C is too cold to hold more than 50. g", "Saturated, because all 50. g of Compound W went into solution", "Unsaturated, because more of Compound W could still dissolve", "Supersaturated, because Compound W dissolved with no heating"], "answer": "C", "answer_text": "Unsaturated, because more of Compound W could still dissolve", "exp": "The curve allows 145 g per 100. mL at 20 °C and only 50. g is in there, so the solution is unsaturated and has room for more. It is not saturated, since the saturation point at 20 °C is 145 g rather than 50. g, and supersaturated would mean holding more than 145 g after cooling undisturbed."}, {"id": 12, "level": "Beginner", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Which procedure produces a supersaturated solution?", "options": ["Dissolve solute in hot water, then let it cool slowly and undisturbed", "Stir a saturated solution much harder until extra solute is forced in", "Add extra solute to hot water and keep heating it until it all goes in", "Grind the solute into a fine powder so that more of it can dissolve"], "answer": "A", "answer_text": "Dissolve solute in hot water, then let it cool slowly and undisturbed", "exp": "Supersaturation appears only when a hot solution cools slowly with nothing to start crystals, so it briefly holds more solute than its saturation point allows. Adding solute while heating just gives a hot saturated or unsaturated solution, and stirring harder or grinding the solid finer changes only the dissolving rate, never how much can dissolve."}, {"id": 13, "level": "Beginner", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "A supersaturated solution sits undisturbed in a beaker. A student lowers a thermometer into it and crystals immediately grow through the liquid. Why?", "options": ["The thermometer is a seed surface where crystallization can start", "The thermometer cools the solution below its own saturation point", "The thermometer stirs the solution, which lowers how much can dissolve", "The thermometer adds solute and pushes the solution past saturation"], "answer": "A", "answer_text": "The thermometer is a seed surface where crystallization can start", "exp": "A supersaturated solution is unstable and needs only a seed surface for crystallization to begin, and the thermometer provides one. The thermometer adds no solute, stirring changes the dissolving rate rather than the saturation point, and a thermometer dropped in does not cool the solution enough to matter."}, {"id": 14, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your KNO₃ solubility curve is built from these crystallization points: 40. g per 100. mL at 25 °C, 80. g per 100. mL at 50 °C, 120. g per 100. mL at 65 °C, and 160. g per 100. mL at 75 °C. Will 120. g of KNO₃ dissolve completely in 100. mL of water at 40 °C?", "options": ["No, because KNO₃ gets less soluble as the water is heated", "Yes, because 120. g is below the 160. g listed on the curve", "No, that amount needs a higher temperature than 40 °C", "Yes, because 40 °C is warm enough to dissolve any amount"], "answer": "C", "answer_text": "No, that amount needs a higher temperature than 40 °C", "exp": "The curve puts 120. g at 65 °C, so at 40 °C the water is nowhere near able to hold it and the answer is no until the temperature is raised. The 160. g figure belongs to 75 °C rather than to 40 °C, no temperature dissolves any amount at all, and KNO₃ becomes more soluble as it is heated, not less."}, {"id": 15, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your KNO₃ solubility curve is built from these crystallization points: 40. g per 100. mL at 25 °C, 80. g per 100. mL at 50 °C, 120. g per 100. mL at 65 °C, and 160. g per 100. mL at 75 °C. About how much KNO₃ dissolves in 100. mL of water at 30 °C?", "options": ["About 120. g", "About 50. g", "About 95 g", "About 30. g"], "answer": "B", "answer_text": "About 50. g", "exp": "The curve passes through 40. g at 25 °C and climbs to 80. g at 50 °C, so at 30 °C it has risen only a little, to about 50. g per 100. mL. About 30. g would be less than the 25 °C value even though 30 °C is warmer, and 95 g or 120. g belong to much hotter water, since 120. g is the 65 °C point."}, {"id": 16, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your KNO₃ solubility curve is built from these crystallization points: 40. g per 100. mL at 25 °C, 80. g per 100. mL at 50 °C, 120. g per 100. mL at 65 °C, and 160. g per 100. mL at 75 °C. Will 40. g of KNO₃ dissolve completely in 100. mL of water at 50 °C?", "options": ["Yes, since 50 °C water holds up to 80. g of KNO₃ per 100. mL", "No, since 40. g is above the 30. g limit that 50 °C water allows", "Yes, since KNO₃ dissolves in any amount at any temperature at all", "No, since KNO₃ needs at least 65 °C before any of it dissolves"], "answer": "A", "answer_text": "Yes, since 50 °C water holds up to 80. g of KNO₃ per 100. mL", "exp": "At 50 °C the curve allows 80. g per 100. mL, so 40. g dissolves completely and leaves room to spare. KNO₃ dissolves well below 65 °C, no substance dissolves in any amount at any temperature, and the 50 °C limit is 80. g rather than 30. g."}, {"id": 17, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of CuSO₄ per 100. mL of water: 15 g at 0 °C, 20. g at 20 °C, 30. g at 40 °C, 40. g at 60 °C, 55 g at 80 °C, and 79 g at 100 °C. About how many grams of CuSO₄ saturate 100. mL of water at 30 °C?", "options": ["About 35 g", "About 25 g", "About 20. g", "About 50. g"], "answer": "B", "answer_text": "About 25 g", "exp": "A temperature of 30 °C sits halfway between the 20. g listed at 20 °C and the 30. g listed at 40 °C, so about 25 g saturates 100. mL. Reading 20. g just copies the 20 °C row instead of moving up the curve, 35 g overshoots the 40 °C value, and 50. g belongs up near 80 °C."}, {"id": 18, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of NH₃ per 100. mL of water: 90. g at 0 °C, 55 g at 20 °C, 35 g at 40 °C, 23 g at 60 °C, 14 g at 80 °C, and 7 g at 100 °C. What does this pattern tell you about NH₃?", "options": ["Its solubility falls as temperature rises, so NH₃ is a gas", "Its solubility rises as temperature rises, the way solids do", "Its solubility falls as temperature rises, so NH₃ is a solid", "Its solubility stays flat, so temperature has no effect on NH₃"], "answer": "A", "answer_text": "Its solubility falls as temperature rises, so NH₃ is a gas", "exp": "The listed values drop from 90. g to 7 g as the water is heated, and falling solubility with rising temperature is the behaviour of a gas, so NH₃ is the gas in the table. Saying the values rise or stay flat contradicts the numbers, and it is solids that become more soluble when heated."}, {"id": 19, "level": "Beginner", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of NH₄Cl per 100. mL of water: 30. g at 0 °C, 38 g at 20 °C, 45 g at 40 °C, 55 g at 60 °C, 65 g at 80 °C, and 78 g at 100 °C. A solution is reported to hold 60. g of NH₄Cl in 100. mL of water at 60 °C. How is it described?", "options": ["Supersaturated, because 60. g is more than 55 g", "Unsaturated, because 60. g is under the 65 g listed", "Unsaturated, because warm water dissolves any amount", "Saturated, because 60. g is the exact limit at 60 °C"], "answer": "A", "answer_text": "Supersaturated, because 60. g is more than 55 g", "exp": "The table caps NH₄Cl at 55 g per 100. mL at 60 °C, so a solution holding 60. g is carrying more than its saturation point and is supersaturated. The 65 g figure belongs to 80 °C rather than 60 °C, the limit at 60 °C is 55 g and not 60. g, and no temperature lets water dissolve any amount at all."}, {"id": 20, "level": "Beginner", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "A saturated salt solution has undissolved salt on the bottom. A student stirs it for ten more minutes at the same temperature. What happens to the amount of salt dissolved?", "options": ["It increases, since stirring breaks the crystals into smaller pieces", "It decreases, since stirring knocks dissolved particles back out again", "It stays the same, since stirring changes only the dissolving rate", "It increases, since agitation raises how much solute can dissolve"], "answer": "C", "answer_text": "It stays the same, since stirring changes only the dissolving rate", "exp": "Agitation (stirring or shaking) changes the dissolving rate, how fast the dissolving happens, and never the saturation point, so a saturated solution takes in nothing extra. Smaller crystals also only speed things up, and stirring does not drive dissolved solute back out of solution."}, {"id": 21, "level": "Beginner", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "One student drops a sugar cube into a beaker of water while another adds an equal mass of powdered sugar to an identical beaker. Neither beaker is stirred and both are at the same temperature. What does the larger surface area of the powder do?", "options": ["The powder dissolves at the same rate, but more of it dissolves", "The powder dissolves faster, and more of it dissolves in total", "The powder dissolves faster, but the same amount dissolves", "The powder dissolves more slowly, since the grains crowd together"], "answer": "C", "answer_text": "The powder dissolves faster, but the same amount dissolves", "exp": "Surface area is a dissolving-rate factor: powder meets the water at many more points and goes in faster, but the amount that can dissolve is set by the temperature and is the same for both beakers. Saying more dissolves in total confuses rate with solubility, and finely divided solid never dissolves more slowly than one large lump."}, {"id": 22, "level": "Beginner", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "Temperature, agitation (stirring or shaking) and surface area are the three factors you tested. Which one changes how much solute can dissolve, and not just how fast?", "options": ["Temperature of the water", "All three change how much dissolves", "Agitation (stirring or shaking)", "Surface area of the solute"], "answer": "A", "answer_text": "Temperature of the water", "exp": "Only temperature moves the saturation point and changes the solubility, how much solute can be dissolved. Agitation (stirring or shaking) and a larger surface area speed the dissolving up but leave the saturation point exactly where it was, so the claim that all three change the amount is wrong twice over."}, {"id": 23, "level": "Beginner", "tag": "Gas Solubility", "stem": "River water warms up during a hot spell. What happens to the amount of oxygen gas the water can hold?", "options": ["It decreases, because gases get less soluble as temperature rises", "It increases, because warm water spreads out and traps more gas", "It stays the same, because temperature affects only solid solutes", "It increases, because gases get more soluble as temperature rises"], "answer": "A", "answer_text": "It decreases, because gases get less soluble as temperature rises", "exp": "Gases become less soluble as temperature rises, so warm river water can hold less dissolved oxygen than cold river water. The opposite pattern, more soluble when heated, is what solids do, and temperature affects gases and solids alike rather than solids only."}, {"id": 24, "level": "Beginner", "tag": "Gas Solubility", "stem": "A sealed bottle of sweetened soda is opened and the pressure above the liquid drops. What does that pressure change do?", "options": ["Nothing changes, since pressure has no effect on any dissolved substance", "Less gas stays dissolved, since gases are less soluble at low pressure", "More gas stays dissolved, since gases are more soluble at low pressure", "The dissolved sugar comes out too, since solids follow pressure as well"], "answer": "B", "answer_text": "Less gas stays dissolved, since gases are less soluble at low pressure", "exp": "Gas solubility rises with pressure, so dropping the pressure means less gas can stay dissolved and the soda fizzes. Claiming gases dissolve better at low pressure reverses that, pressure does change gas solubility, and solids are unaffected by pressure, so the dissolved sugar stays put."}, {"id": 25, "level": "Beginner", "tag": "Gas Solubility", "stem": "Your investigation had to account for the dissolved oxygen in the White River. How does most of the oxygen get into the river water?", "options": ["Mainly from water molecules splitting into hydrogen and oxygen", "Mainly from the rocks and mud of the riverbed, which release it", "Mainly from plants in the water, which are its only source", "Mainly by dissolving out of the air at the water's surface"], "answer": "D", "answer_text": "Mainly by dissolving out of the air at the water's surface", "exp": "Most dissolved oxygen enters river water by dissolving straight out of the air at the surface, and riffles, turbulence and wind keep mixing it in. Photosynthesis by water plants adds oxygen but is second, not the only source; the riverbed releases none; and water molecules do not split apart on their own."}, {"id": 26, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Is AgNO₃ soluble in water?", "options": ["Insoluble, because NO₃⁻ is insoluble with metal cations such as Ag⁺", "Soluble, because NO₃⁻ is soluble with any cation in the table", "Insoluble, because silver forms insoluble compounds with everything", "Partially soluble, because only part of a nitrate ever goes into water"], "answer": "B", "answer_text": "Soluble, because NO₃⁻ is soluble with any cation in the table", "exp": "The table gives NO₃⁻ as soluble with any cation, so AgNO₃ is soluble even though silver appears in several insoluble rows. Silver is insoluble with the halides and with carbonate, not with everything, and no rule in the table calls nitrate insoluble or partially soluble."}, {"id": 27, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Is AgCl soluble in water?", "options": ["Soluble, because silver compounds all dissolve completely", "Insoluble, because Cl⁻ is insoluble with the cation Ag⁺", "Soluble, because Cl⁻ is soluble with every cation there is", "Insoluble, because every chloride compound is insoluble"], "answer": "B", "answer_text": "Insoluble, because Cl⁻ is insoluble with the cation Ag⁺", "exp": "The halide row lists Ag⁺ as one of the few cations that make Cl⁻, Br⁻ and I⁻ insoluble, so AgCl is insoluble. Chloride is soluble with any other cation rather than with every cation or with none, and silver compounds do not all dissolve, as AgCl itself shows."}, {"id": 28, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Is K₂CO₃ soluble in water?", "options": ["Insoluble, because CO₃²⁻ is insoluble with every cation", "Partially soluble, because K⁺ and CO₃²⁻ pull in opposite ways", "Insoluble, because K⁺ is too large an ion to stay in solution", "Soluble, because K⁺ is soluble with any anion in the table"], "answer": "D", "answer_text": "Soluble, because K⁺ is soluble with any anion in the table", "exp": "The first row of the table makes K⁺ soluble with any anion, and the carbonate row lists K⁺ among the soluble cations too, so K₂CO₃ is soluble. Carbonate is insoluble only with cations outside that list, and nothing in the table depends on ion size or gives a partially soluble result here."}, {"id": 29, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Is CaCO₃ soluble in water?", "options": ["Soluble, because CO₃²⁻ is soluble with any cation at all", "Soluble, because calcium compounds always dissolve in water", "Insoluble, because Ca²⁺ is insoluble with every anion listed", "Insoluble, because CO₃²⁻ is insoluble with the cation Ca²⁺"], "answer": "D", "answer_text": "Insoluble, because CO₃²⁻ is insoluble with the cation Ca²⁺", "exp": "Carbonate is soluble only with H⁺, the Group 1 cations and NH₄⁺, and Ca²⁺ is none of those, so CaCO₃ is insoluble. Carbonate is not soluble with any cation at all, and calcium is soluble with plenty of anions, chloride and nitrate among them."}, {"id": 30, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Which cation makes SO₄²⁻ insoluble?", "options": ["NH₄⁺", "Na⁺", "Ca²⁺", "K⁺"], "answer": "C", "answer_text": "Ca²⁺", "exp": "The sulfate row of the table names Ca²⁺, Sr²⁺, Ba²⁺, Ag⁺, Pb²⁺ and Ra²⁺ as the cations that make SO₄²⁻ insoluble, and Ca²⁺ is the only one of those offered. Na⁺, K⁺ and NH₄⁺ all sit in the first row of the table, soluble with any anion, so their sulfates dissolve."}, {"id": 31, "level": "Beginner", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. Which of these compounds is insoluble in water?", "options": ["AlPO₄", "NH₄Cl", "KNO₃", "NaCl"], "answer": "A", "answer_text": "AlPO₄", "exp": "Phosphate is soluble only with H⁺, the Group 1 cations and NH₄⁺, and Al³⁺ is none of those, so AlPO₄ is insoluble. NaCl and NH₄Cl are soluble because Na⁺ and NH₄⁺ are soluble with any anion, and KNO₃ is soluble twice over, since K⁺ and NO₃⁻ each dissolve with anything."}, {"id": 32, "level": "Beginner", "tag": "Double Replacement and Precipitates", "stem": "Two solutions are mixed in a double replacement reaction and a precipitate forms. What is a precipitate?", "options": ["An insoluble solid that forms when the two solutions are mixed", "The leftover water that is squeezed out when the ions trade places", "A gas that bubbles up out of the liquid as the two solutions mix", "A soluble product that spreads evenly through the mixed solution"], "answer": "A", "answer_text": "An insoluble solid that forms when the two solutions are mixed", "exp": "A precipitate is the insoluble solid that appears when the ions trade partners and one of the new pairings will not dissolve. A soluble product stays spread through the solution as ions, a gas is not a solid, and no water is squeezed out when a precipitate forms."}, {"id": 33, "level": "Beginner", "tag": "Double Replacement and Precipitates", "stem": "Your Science Spiral shows this equation with the soluble compounds left as ions: Li₂CO₃ + 2AgNO₃ → 2Li⁺ + 2NO₃⁻ + Ag₂CO₃. Which product should be circled as the precipitate?", "options": ["2NO₃⁻", "2Li⁺", "Ag₂CO₃", "Li₂CO₃"], "answer": "C", "answer_text": "Ag₂CO₃", "exp": "Ag₂CO₃ is written as a whole compound because carbonate is insoluble with Ag⁺, so it is the precipitate to circle. Li⁺ and NO₃⁻ are written as separate ions exactly because they stayed dissolved, and Li₂CO₃ is a reactant that was poured in rather than a product."}, {"id": 34, "level": "Beginner", "tag": "Double Replacement and Precipitates", "stem": "You mix a solution of NaCl with a solution of AgNO₃ in a test tube. Using the solubility rules, do you predict PPT or NR?", "options": ["PPT, because AgCl is insoluble", "NR, because Na⁺ and Ag⁺ will not trade", "PPT, because NaNO₃ is insoluble in water", "NR, because both products are soluble"], "answer": "A", "answer_text": "PPT, because AgCl is insoluble", "exp": "Trading partners gives AgCl and NaNO₃, and Cl⁻ is insoluble with Ag⁺, so AgCl drops out and the prediction is PPT. NaNO₃ is soluble, since Na⁺ dissolves with any anion and NO₃⁻ with any cation, so it is not the solid, and the ions certainly do trade."}, {"id": 35, "level": "Beginner", "tag": "Molarity", "stem": "Your Concept Check prints molarity = moles / Liters. What exactly does molarity measure?", "options": ["Grams of solute per liter of the solution made", "Moles of solvent per liter of the finished solution", "Moles of solute per liter of solution", "Moles of solute per liter of the water used"], "answer": "C", "answer_text": "Moles of solute per liter of solution", "exp": "Molarity is moles of solute divided by liters of solution, the volume you have after the solute is dissolved and the flask is filled to the mark. Using liters of water measures the wrong volume, since dissolving solute changes the total; grams is a mass rather than moles; and it is the solute, not the solvent, that gets counted."}, {"id": 36, "level": "Beginner", "tag": "Molarity", "stem": "A student dissolves 0.50 mol of NaCl to make 2.0 L of solution. Using molarity = moles / Liters, what is the molarity? Report your answer with the correct number of significant digits.", "options": ["1.0M", "2.5 × 10⁻⁴M", "4.0M", "0.25M"], "answer": "D", "answer_text": "0.25M", "exp": "Substitute into molarity = moles / Liters: 0.50 mol ÷ 2.0 L = 0.25M, two digits because both measurements carry two. The value 4.0M comes from dividing the liters by the moles, 1.0M comes from multiplying instead of dividing, and 2.5 × 10⁻⁴M comes from entering the 2.0 L as 2000 mL and dividing by that."}, {"id": 37, "level": "Beginner", "tag": "Molarity", "stem": "Convert with a T-chart: 8.0 g NaCl × (1 mole NaCl / 58.44 g NaCl) = ? Use MM = 58.44 g/mol and report your answer with the correct number of significant digits.", "options": ["4.7 × 10² mol", "0.14 mol", "1.4 × 10⁻⁴ mol", "7.3 mol"], "answer": "B", "answer_text": "0.14 mol", "exp": "The grams of NaCl cancel top and bottom: 8.0 g NaCl × (1 mole NaCl / 58.44 g NaCl) = 0.14 mol, rounded to the two digits in 8.0 g. The value 7.3 mol comes from flipping the T-chart and dividing 58.44 by 8.0, 4.7 × 10² mol comes from multiplying by the molar mass instead of dividing, and 1.4 × 10⁻⁴ mol comes from treating the 8.0 g as 8.0 mg, which is only 0.0080 g."}, {"id": 38, "level": "Beginner", "tag": "Molarity", "stem": "A beaker holds 3.0 L of 0.20M NaCl solution. Substitute into molarity = moles / Liters as 0.20M = moles / 3.0 L. How many moles of NaCl are dissolved? Report your answer with the correct number of significant digits.", "options": ["0.067 mol", "15 mol", "0.60 mol", "3.2 mol"], "answer": "C", "answer_text": "0.60 mol", "exp": "Substituting gives 0.20M = moles / 3.0 L, so moles = 0.20 × 3.0 = 0.60 mol, carrying two digits. The value 0.067 mol comes from dividing the molarity by the liters, 15 mol comes from dividing the liters by the molarity, and 3.2 mol comes from adding the 3.0 L to the 0.20M instead of multiplying."}, {"id": 39, "level": "Beginner", "tag": "Molarity", "stem": "A student dissolves 0.10 mol of KNO₃ to make 250. mL of solution. There are 1000 mL in a liter. Using molarity = moles / Liters, what is the molarity? Report your answer with the correct number of significant digits.", "options": ["25M", "4.0M", "4.0 × 10⁻⁴M", "0.40M"], "answer": "D", "answer_text": "0.40M", "exp": "Convert first, 250. mL = 0.250 L, then divide: 0.10 mol ÷ 0.250 L = 0.40M, two digits because 0.10 mol carries two. The value 4.0 × 10⁻⁴M comes from dividing by 250. mL without converting to liters, 25M comes from multiplying by the volume, and 4.0M comes from converting 250. mL to 0.0250 L instead of 0.250 L."}, {"id": 40, "level": "Beginner", "tag": "Molarity", "stem": "Convert with a T-chart: 34.23 g C₁₂H₂₂O₁₁ × (1 mole C₁₂H₂₂O₁₁ / 342.30 g C₁₂H₂₂O₁₁) = ? Use MM = 342.30 g/mol and report your answer with the correct number of significant digits.", "options": ["10.00 mol", "0.01000 mol", "0.1000 mol", "1.172 × 10⁴ mol"], "answer": "C", "answer_text": "0.1000 mol", "exp": "The grams of sugar cancel: 34.23 g ÷ 342.30 g/mol = 0.1000 mol, and four digits are justified because 34.23 g carries four. The value 10.00 mol comes from flipping the T-chart, 1.172 × 10⁴ mol comes from multiplying by the molar mass instead of dividing, and 0.01000 mol slips the decimal point one place to the left."}, {"id": 41, "level": "Beginner", "tag": "Molarity", "stem": "A student weighs out NaCl, pours it into a volumetric flask, and adds water until the liquid reaches the 100.0 mL mark. Which volume belongs in the Liters of molarity = moles / Liters?", "options": ["The volume of the dry NaCl before it was poured into the flask", "The volume of water alone, measured after all the salt dissolves", "The volume of water alone, measured before the NaCl was added", "The 100.0 mL of finished solution standing in the filled flask"], "answer": "D", "answer_text": "The 100.0 mL of finished solution standing in the filled flask", "exp": "Molarity is moles of solute per liter of solution, so the volume you use is the 100.0 mL of solution standing in the filled flask, which is 0.1000 L. Measuring the water by itself, before or after, leaves out the volume the dissolved solute takes up, and the volume of the dry solid is not a solution volume at all."}, {"id": 42, "level": "Beginner", "tag": "Dilution", "stem": "Which equation is the dilution equation, the one glossed as “starting molarity × starting volume = final molarity × final volume”?", "options": ["M(i) + V(i) = M(f) + V(f)", "M(i)V(f) = M(f)V(i)", "M(i)V(i) = M(f)V(f)", "M(i)/V(i) = M(f)/V(f)"], "answer": "C", "answer_text": "M(i)V(i) = M(f)V(f)", "exp": "The gloss says multiply the starting molarity by the starting volume and set it equal to the final molarity times the final volume, which is M(i)V(i) = M(f)V(f). Writing M(i)/V(i) = M(f)/V(f) divides where the gloss multiplies, adding a molarity to a volume combines units that cannot be added, and M(i)V(f) = M(f)V(i) pairs each molarity with the wrong volume."}, {"id": 43, "level": "Beginner", "tag": "Dilution", "stem": "In the drink-mix lab you pour 100. mL of 0.60M drink mix into a pitcher and add water until the drink measures 300. mL. Using M₁V₁ = M₂V₂, what is the final molarity? Report your answer with the correct number of significant digits.", "options": ["0.30M", "1.8M", "0.20M", "2.0 × 10⁻⁴M"], "answer": "C", "answer_text": "0.20M", "exp": "Substitute into M₁V₁ = M₂V₂: (0.60M)(100. mL) = M₂(300. mL), so M₂ = 60. ÷ 300. = 0.20M, two digits because 0.60M carries two. The value 0.30M uses the 200. mL of water added instead of the 300. mL of finished drink, 1.8M flips the two volumes, and 2.0 × 10⁻⁴M divides by 300. mL after converting only the 100. mL to 0.100 L."}, {"id": 44, "level": "Beginner", "tag": "Dilution", "stem": "You dilute 10.0 mL of a 0.600M CuSO₄ stock solution down to 0.0500M. Using M(i)V(i) = M(f)V(f), what is the final volume of solution? Report your answer with the correct number of significant digits.", "options": ["120. mL", "0.833 mL", "110. mL", "12.0 mL"], "answer": "A", "answer_text": "120. mL", "exp": "Substitute into M(i)V(i) = M(f)V(f): (0.600M)(10.0 mL) = (0.0500M)V(f), so V(f) = 6.00 ÷ 0.0500 = 120. mL of solution, three digits from three-digit data. The value 110. mL is the water you would add, V(f) − V(i), rather than the final volume asked for; 12.0 mL is the ratio 0.600 ÷ 0.0500 with the 10.0 mL left out; and 0.833 mL swaps the two molarities."}, {"id": 45, "level": "Beginner", "tag": "Dilution", "stem": "You have 50.0 mL of 0.400M NaCl and you want 0.100M NaCl. Using M(i)V(i) = M(f)V(f), what volume of water must be added? Report your answer with the correct number of significant digits.", "options": ["150. mL", "200. mL", "12.5 mL", "250. mL"], "answer": "A", "answer_text": "150. mL", "exp": "M(i)V(i) = M(f)V(f) gives V(f) = (0.400M)(50.0 mL) ÷ 0.100M = 200. mL of solution, and the water added is V(f) − V(i) = 200. mL − 50.0 mL = 150. mL. Answering 200. mL reports the final volume instead of the water added, 250. mL counts the starting volume a second time, and 12.5 mL flips the two molarities."}, {"id": 46, "level": "Beginner", "tag": "Dilution", "stem": "A student adds water to a beaker of salt solution and stirs it in. What happens to the moles of salt in the beaker?", "options": ["They increase, because the solution now fills a larger volume", "They increase, because water breaks apart more of the salt", "They decrease, because the added water washes solute away", "They stay the same, because water alone was added"], "answer": "D", "answer_text": "They stay the same, because water alone was added", "exp": "Diluting adds solvent only, so the moles of solute stay put while the volume grows and the molarity falls, which is exactly why M(i)V(i) = M(f)V(f) works. Extra volume does not create solute, water added to a beaker cannot carry solute out of it, and there is no extra salt for the water to break apart."}, {"id": 47, "level": "Beginner", "tag": "Dilution", "stem": "A student dilutes 20.0 mL of 1.50M NaCl by adding water until the solution measures 60.0 mL. Using M(i)V(i) = M(f)V(f), what volume of water was added?", "options": ["80.0 mL", "60.0 mL", "40.0 mL", "0.500 mL"], "answer": "C", "answer_text": "40.0 mL", "exp": "In M(i)V(i) = M(f)V(f) the 60.0 mL is V(f), the final volume of solution, so the water added is V(f) − V(i) = 60.0 mL − 20.0 mL = 40.0 mL. Answering 60.0 mL gives the final volume of solution instead of the water added, 80.0 mL adds the 20.0 mL of stock to the 60.0 mL of solution, and 0.500 mL is the final molarity written down as if it were a volume."}, {"id": 48, "level": "Beginner", "tag": "Significant Digits in Solution Calculations", "stem": "A student dissolves 20. g of NaCl to make 0.50 L of solution. Use MM = 58.44 g/mol and molarity = moles / Liters. What is the molarity? Report your answer with the correct number of significant digits.", "options": ["2.3 × 10³M", "0.34M", "0.17M", "0.68M"], "answer": "D", "answer_text": "0.68M", "exp": "20. g NaCl × (1 mole NaCl / 58.44 g NaCl) = 0.34223 mol, then 0.34223 mol ÷ 0.50 L = 0.68M at two digits. Reporting 0.34M stops at the moles and never divides by the 0.50 L, 0.17M multiplies by the litres instead of dividing, and 2.3 × 10³M multiplies by the molar mass instead of dividing."}, {"id": 49, "level": "Beginner", "tag": "Significant Digits in Solution Calculations", "stem": "You dilute 15.0 mL of 0.250M CuSO₄ with water until the solution measures 50.0 mL. Using M(i)V(i) = M(f)V(f), what is the final molarity? Report your answer with the correct number of significant digits.", "options": ["0.833M", "0.107M", "0.0750M", "0.750M"], "answer": "C", "answer_text": "0.0750M", "exp": "(0.250M)(15.0 mL) = M(f)(50.0 mL), so M(f) = 3.75 ÷ 50.0 = 0.0750M. The value 0.107M uses the 35.0 mL of water added rather than the 50.0 mL of solution, 0.833M flips the two volumes, and 0.750M slips the decimal point one place."}, {"id": 50, "level": "Beginner", "tag": "Case File: An Aquatic Apocalypse", "stem": "In the real 1999 White River fish kill, how did the contaminated wastewater reach the river?", "options": ["A pipe at the Guide Corporation plant discharged it straight into the river", "A rainstorm washed manure from farm lagoons upstream into the river channel", "A barge tore open on the river and spilled its entire load of fuel oil into it", "It went to the Anderson sewage treatment plant, which then passed it on"], "answer": "D", "answer_text": "It went to the Anderson sewage treatment plant, which then passed it on", "exp": "Guide Corporation sent roughly 1.6 million gallons of untested, contaminated wastewater to the Anderson sewage treatment plant, and that plant passed it on to the river, so it was never a direct discharge from Guide's own pipe. The fuel-oil barge and the farm runoff are suspects in your simulated investigation rather than events of 1999."}, {"id": 51, "level": "Beginner", "tag": "Case File: An Aquatic Apocalypse", "stem": "The 1999 White River fish kill is remembered for its size. About how many fish died, and how long was the affected stretch of river?", "options": ["About 117 million fish over about 4 miles", "About 4.6 million fish over about 40 miles", "About 4.6 thousand fish over about 40 miles", "About 187 million fish over about 400 miles"], "answer": "B", "answer_text": "About 4.6 million fish over about 40 miles", "exp": "The kill was estimated at about 4.6 million fish along roughly a 40-mile stretch of the White River. The numbers 117 and 187 are tonnages of dead fish from your case file rather than counts of fish, and 4.6 thousand fish is a thousand times too small to empty 40 miles of river."}, {"id": 52, "level": "Beginner", "tag": "Case File: An Aquatic Apocalypse", "stem": "What chemical was the White River wastewater found to be carrying in toxic amounts in 1999?", "options": ["Dimethyldithiocarbamate, the active ingredient of HMP-2000", "Aluminum sulfate, the flocculant used to settle out solids", "Sulfur dioxide, the smokestack gas from a coal-burning power plant", "Ammonium nitrate, the fertilizer carried off nearby farm fields"], "answer": "A", "answer_text": "Dimethyldithiocarbamate, the active ingredient of HMP-2000", "exp": "The wastewater carried toxic levels of dimethyldithiocarbamate, the active ingredient of the treatment product HMP-2000, along with its breakdown product carbon disulfide. Aluminum sulfate, fertilizer nitrates and smokestack sulfur dioxide all belong to the suspects your class investigates in the simulation, not to the 1999 findings."}, {"id": 53, "level": "Beginner", "tag": "Case File: An Aquatic Apocalypse", "stem": "In your simulated investigation, the spot test on the river water and the later gravimetric analysis pointed to one contaminant. Which one was it?", "options": ["Lead", "Aluminum", "Phosphate", "Nitrate"], "answer": "B", "answer_text": "Aluminum", "exp": "The river-water spot test gave the NR, PPT, PPT, NR, NR pattern that matches the aluminum row, and weighing the AlPO₄ precipitate confirmed it, so the verdict in the simulation is aluminum. Lead would have precipitated with all five reagents, and the nitrate and phosphate data collected later ruled both of those out as the cause."}, {"id": 54, "level": "Beginner", "tag": "Case File: An Aquatic Apocalypse", "stem": "The aluminum toxicity threshold used in your investigation is 3.0 × 10⁻⁶ moles/liter. Your Day 4 river sample works out to 1.0 × 10⁻⁵M Al³⁺. What do you conclude?", "options": ["It cannot be compared, since the two units are different", "It is below the threshold, since 1.0 × 10⁻⁵ is smaller", "It is above the threshold, since 1.0 × 10⁻⁵ is larger", "It is exactly at the threshold, since both are near zero"], "answer": "C", "answer_text": "It is above the threshold, since 1.0 × 10⁻⁵ is larger", "exp": "A concentration of 1.0 × 10⁻⁵M is ten millionths of a mole per liter while the threshold 3.0 × 10⁻⁶M is three millionths, so the sample sits above the threshold. Reading 10⁻⁵ as the smaller value compares the exponents without their minus signs, two small numbers are not thereby equal, and moles/liter and M are the same unit written two ways."}, {"id": 55, "level": "Intermediate", "tag": "Molarity", "stem": "You are making a stock solution for the serial-dilution lab. You weigh 12.00 g of CuSO₄ (MM = 159.60 g/mol) on the scale and dissolve it to make 0.500 L of solution. Using molarity = moles / Liters, what is the molarity of the stock? Report your answer with the correct number of significant digits.", "options": ["0.0752M", "0.1504M", "0.150M", "24.0M"], "answer": "C", "answer_text": "0.150M", "exp": "The T-chart comes first: 12.00 g CuSO₄ × (1 mole CuSO₄ / 159.60 g CuSO₄) = 0.07519 mol, and then molarity = moles / Liters = 0.07519 mol ÷ 0.500 L = 0.150M at three digits, the three the volume allows. The value 0.0752M reports that mole count and never divides by the volume, 24.0M drops the grams straight into the numerator where the moles belong, and 0.1504M shows a fourth digit the 0.500 L cannot support."}, {"id": 56, "level": "Intermediate", "tag": "Molarity", "stem": "A storm-drain sample carries 10. mg of NH₄NO₃ (MM = 80.04 g/mol) in each 1.00 L of runoff. If there are 1000 mg in a gram and 1000 mL in a liter, what is the molarity of the NH₄NO₃? Use molarity = moles / Liters and report your answer with the correct number of significant digits.", "options": ["1.25 × 10⁻⁴M", "0.80M", "1.2 × 10⁻¹M", "1.2 × 10⁻⁴M"], "answer": "D", "answer_text": "1.2 × 10⁻⁴M", "exp": "Convert the mass first: 10. mg × (1 g / 1000 mg) = 0.010 g, then 0.010 g NH₄NO₃ × (1 mole NH₄NO₃ / 80.04 g NH₄NO₃) = 1.2 × 10⁻⁴ mol, so molarity = 1.2 × 10⁻⁴ mol ÷ 1.00 L = 1.2 × 10⁻⁴M at two digits. The value 1.2 × 10⁻¹M leaves the mass in milligrams, 0.80M multiplies by the molar mass instead of dividing by it, and 1.25 × 10⁻⁴M claims a third digit that 10. mg cannot support."}, {"id": 57, "level": "Intermediate", "tag": "Molarity", "stem": "You weigh 2.50 g of KCl (MM = 74.55 g/mol), pour it into a volumetric flask, and add water up to the 250.0 mL mark. There are 1000 mL in a liter. Using molarity = moles / Liters, what is the molarity of the working solution? Report your answer with the correct number of significant digits.", "options": ["7.455M", "0.134M", "1.34 × 10⁻⁴M", "0.0335M"], "answer": "B", "answer_text": "0.134M", "exp": "The T-chart gives 2.50 g KCl × (1 mole KCl / 74.55 g KCl) = 0.0335 mol, and the flask holds 250.0 mL ÷ 1000 mL/L = 0.2500 L of solution, so molarity = 0.0335 mol ÷ 0.2500 L = 0.134M. The value 1.34 × 10⁻⁴M leaves the volume in milliliters, 0.0335M stops at the moles, and 7.455M turns molarity = moles / Liters upside down by dividing the liters by the moles."}, {"id": 58, "level": "Intermediate", "tag": "Molarity", "stem": "The spot-test kit needs 0.300 L of solution that is 0.200M in KNO₃ (MM = 101.10 g/mol). Substitute into molarity = moles / Liters as 0.200M = moles / 0.300 L to find the moles, then convert to grams with a T-chart. How much KNO₃ should you weigh out? Report your answer with the correct number of significant digits.", "options": ["6.07 g", "6.066 g", "20.2 g", "5.93 × 10⁻⁴ g"], "answer": "A", "answer_text": "6.07 g", "exp": "Substituting gives 0.200M = moles / 0.300 L, so moles = 0.0600 mol, and 0.0600 mol KNO₃ × (101.10 g KNO₃ / 1 mole KNO₃) = 6.07 g at three digits. The value 20.2 g copies the 0.200 straight down as though the molarity were the moles, 5.93 × 10⁻⁴ g divides by the molar mass instead of multiplying, and 6.066 g keeps a fourth digit the three-digit data cannot support."}, {"id": 59, "level": "Intermediate", "tag": "Molarity", "stem": "A flask on the prep bench is labeled 0.25M NaCl (MM = 58.44 g/mol), and the bench notes say it was made from 3.7 g of NaCl. Substitute into molarity = moles / Liters and solve for the volume of solution in the flask. Report your answer with the correct number of significant digits.", "options": ["0.2533 L", "0.25 L", "15 L", "3.9 L"], "answer": "B", "answer_text": "0.25 L", "exp": "First the T-chart: 3.7 g NaCl × (1 mole NaCl / 58.44 g NaCl) = 0.063 mol, then 0.25M = 0.063 mol / Liters rearranges to Liters = 0.063 mol ÷ 0.25M = 0.25 L at two digits. The value 15 L divides the grams by the molarity without ever converting to moles, 3.9 L divides the molarity by the moles, and 0.2533 L reports four digits from two-digit data."}, {"id": 60, "level": "Intermediate", "tag": "Molarity", "stem": "You pipet a 50.0 mL aliquot out of a bottle of 0.400M AgNO₃ stock. There are 1000 mL in a liter. Substitute into molarity = moles / Liters as 0.400M = moles / 0.0500 L. How many moles of AgNO₃ are in the aliquot? Report your answer with the correct number of significant digits.", "options": ["1.25 × 10² mol", "0.125 mol", "0.0200 mol", "20.0 mol"], "answer": "C", "answer_text": "0.0200 mol", "exp": "The aliquot is 0.0500 L, so 0.400M = moles / 0.0500 L gives moles = 0.0200 mol at three digits. The value 20.0 mol leaves the volume in milliliters, 0.125 mol divides the liters by the molarity, and 1.25 × 10² mol makes both errors at once by dividing 50.0 mL by the molarity."}, {"id": 61, "level": "Intermediate", "tag": "Molarity", "stem": "Two suspect discharges are sampled below their outfalls. Discharge 1 holds 5.0 g of NaCl (MM = 58.44 g/mol) in 2.0 L of solution, and Discharge 2 holds 5.0 g of KCl (MM = 74.55 g/mol) in 2.0 L of solution. Using molarity = moles / Liters, which discharge is more concentrated?", "options": ["Discharge 2, because KCl breaks apart into ions in the water while NaCl dissolves as whole units", "Discharge 1, at 0.043M against 0.034M for Discharge 2, since the lighter NaCl gives more moles per gram", "Discharge 2, because the heavier formula unit of KCl packs more solute into every 5.0 g that is weighed out", "Neither one — the two match exactly, because each of them holds 5.0 g of solute in 2.0 L of solution"], "answer": "B", "answer_text": "Discharge 1, at 0.043M against 0.034M for Discharge 2, since the lighter NaCl gives more moles per gram", "exp": "5.0 g NaCl × (1 mole / 58.44 g) = 0.086 mol ÷ 2.0 L = 0.043M, while 5.0 g KCl × (1 mole / 74.55 g) = 0.067 mol ÷ 2.0 L = 0.034M, so Discharge 1 is the more concentrated. The lighter formula unit gives more moles per gram, so the heavier KCl supplies fewer; equal masses in equal volumes are not equal molarities; and both salts break apart into their component ions, which is not what molarity counts."}, {"id": 62, "level": "Intermediate", "tag": "Molarity", "stem": "Outfall 1 releases 0.60 mol of dissolved salt in 3.0 L of solution. Outfall 2 releases 0.25 mol of the same salt in 1.0 L of solution. Using molarity = moles / Liters, which outfall's water is the more concentrated?", "options": ["Outfall 2, at 0.25M against 0.20M for Outfall 1, since its moles sit in a third of the volume", "Outfall 1, at 0.20M against 0.25M, because it releases the greater number of moles of salt overall", "Outfall 1, at 5.0M against 4.0M, because molarity is found by dividing the Liters by the moles", "Neither one — both samples work out to the very same 0.25M once their volumes are taken into account"], "answer": "A", "answer_text": "Outfall 2, at 0.25M against 0.20M for Outfall 1, since its moles sit in a third of the volume", "exp": "Outfall 1 is 0.60 mol ÷ 3.0 L = 0.20M and Outfall 2 is 0.25 mol ÷ 1.0 L = 0.25M, so Outfall 2 is the more concentrated by 0.05M. Releasing more moles overall does not win when those moles are spread through three times the volume, dividing Liters by moles gives 5.0 and 4.0 from an upside-down equation, and the two molarities are not equal."}, {"id": 63, "level": "Intermediate", "tag": "Molarity", "stem": "Four samples are logged at the treatment-plant bench. Using molarity = moles / Liters, and 1000 mL in a liter, which one is the most dilute?", "options": ["0.50 mol of solute in 2.0 liters of solution", "1.0 mol of solute in 5.0 liters of solution", "0.10 mol of solute in 250. mL of solution", "0.30 mol of solute in 1.0 liter of solution"], "answer": "B", "answer_text": "1.0 mol of solute in 5.0 liters of solution", "exp": "Divide each one: 1.0 mol ÷ 5.0 L = 0.20M, which is thinner than 0.50 mol ÷ 2.0 L = 0.25M, 0.30 mol ÷ 1.0 L = 0.30M and 0.10 mol ÷ 0.250 L = 0.40M. The largest pile of moles does not make a sample concentrated when those moles are spread through 5.0 L, and the 250. mL sample is the most concentrated of the four once its volume is converted to 0.250 L."}, {"id": 64, "level": "Intermediate", "tag": "Molarity", "stem": "A spot test calls for 0.0250 mol of AgNO₃, and the stock bottle on the shelf is 0.200M AgNO₃. Substitute into molarity = moles / Liters to find the volume of stock you must measure out, then convert with 1000 mL in a liter. Report your answer with the correct number of significant digits.", "options": ["125 mL", "8.00 mL", "0.125 mL", "5.00 mL"], "answer": "A", "answer_text": "125 mL", "exp": "The substitution 0.200M = 0.0250 mol / Liters rearranges to Liters = 0.0250 mol ÷ 0.200M = 0.125 L, and 0.125 L × (1000 mL / 1 L) = 125 mL. The value 0.125 mL keeps the liter figure and simply writes milliliters beside it, 8.00 mL divides the molarity by the moles, and 5.00 mL multiplies the moles by the molarity instead of dividing."}, {"id": 65, "level": "Intermediate", "tag": "Dilution", "stem": "The serial-dilution ladder runs 1.0M → 0.1M → 0.01M → 0.001M → 0.0001M → 0.00001M. To make the first rung you need 100.0 mL of 0.100M solution from the 1.00M stock. Using M(i)V(i) = M(f)V(f), what volume of stock do you measure into the flask? Report your answer with the correct number of significant digits.", "options": ["90.0 mL", "10.0 mL", "1.00 × 10³ mL", "100.0 mL"], "answer": "B", "answer_text": "10.0 mL", "exp": "Solving M(i)V(i) = M(f)V(f) for the starting volume gives V(i) = (0.100M)(100.0 mL) ÷ 1.00M = 10.0 mL of stock, which is then topped up with water to the 100.0 mL mark. The value 90.0 mL is the water added, V(f) − V(i), rather than the stock measured out; 1.00 × 10³ mL swaps the two molarities; and 100.0 mL is the volume of the finished rung rather than the stock measured into it."}, {"id": 66, "level": "Intermediate", "tag": "Dilution", "stem": "You have 25.0 mL of 0.400M AgNO₃ stock and need it at 0.0500M for the spot-test tray. Using M(i)V(i) = M(f)V(f), what volume of water must be added? Report your answer with the correct number of significant digits.", "options": ["175 mL", "3.13 mL", "225 mL", "200. mL"], "answer": "A", "answer_text": "175 mL", "exp": "M(i)V(i) = M(f)V(f) gives V(f) = (0.400M)(25.0 mL) ÷ 0.0500M = 200. mL of solution, and the water added is V(f) − V(i) = 200. mL − 25.0 mL = 175 mL. Answering 200. mL reports the final volume of solution rather than the water, 225 mL adds the starting volume on instead of subtracting it, and 3.13 mL swaps the two molarities."}, {"id": 67, "level": "Intermediate", "tag": "Dilution", "stem": "An outfall sample reads off the top of the meter's range, so you pipet 15.0 mL of the 0.0800M sample into a flask and add water up to the 75.0 mL mark. Using M(i)V(i) = M(f)V(f), what is the molarity of the diluted sample? Report your answer with the correct number of significant digits.", "options": ["0.400M", "0.0160M", "0.00160M", "0.0133M"], "answer": "B", "answer_text": "0.0160M", "exp": "Substituting gives (0.0800M)(15.0 mL) = M(f)(75.0 mL), so M(f) = 1.20 ÷ 75.0 = 0.0160M, and that final zero is a real digit from three-digit data. The value 0.400M flips the two volumes and would have the dilution concentrating the sample, 0.0133M divides by the 90.0 mL you get from adding the two volumes together, and 0.00160M slips the decimal one place."}, {"id": 68, "level": "Intermediate", "tag": "Dilution", "stem": "In the serial-dilution lab you transfer 10.0 mL of 1.0M stock into a flask and add water to the 100.0 mL mark, then transfer 10.0 mL of that flask into a second flask and again add water to the 100.0 mL mark. Using M(i)V(i) = M(f)V(f) twice, what is the molarity in the second flask? Report your answer with the correct number of significant digits.", "options": ["0.010M", "0.20M", "1.0 × 10⁻⁴M", "0.10M"], "answer": "A", "answer_text": "0.010M", "exp": "Each rung cuts the molarity to a tenth: (1.0M)(10.0 mL) = M(f)(100.0 mL) gives 0.10M, and repeating with the second flask gives (0.10M)(10.0 mL) ÷ 100.0 mL = 0.010M, two digits because the 1.0M stock carries two. The value 0.10M stops after the first flask, 1.0 × 10⁻⁴M runs the ladder down four rungs instead of two, and 0.20M treats the two 10.0 mL transfers as one 20.0 mL portion of stock."}, {"id": 69, "level": "Intermediate", "tag": "Dilution", "stem": "The treatment-plant bench has 2.00 L of 0.500M test solution and needs it at 0.100M. Using M(i)V(i) = M(f)V(f), what is the final volume of solution? Report your answer with the correct number of significant digits.", "options": ["12.0 L", "8.0 L", "10.0 L", "0.400 L"], "answer": "C", "answer_text": "10.0 L", "exp": "M(i)V(i) = M(f)V(f) gives V(f) = (0.500M)(2.00 L) ÷ 0.100M = 10.0 L of solution, three digits because every measurement carries three. The value 8.0 L is the water that has to be added, V(f) − V(i) = 10.0 L − 2.00 L, rather than the final volume the question asks for; 12.0 L piles the starting 2.00 L on top of that final volume; and 0.400 L swaps the starting and final molarities."}, {"id": 70, "level": "Intermediate", "tag": "Dilution", "stem": "You dilute 50.0 mL of 0.600M CuSO₄ with water to a final volume of 150.0 mL of solution. Using molarity = moles / Liters and 1000 mL in a liter, which statement describes the moles of CuSO₄ and the molarity afterward?", "options": ["The moles stay at 0.0300 mol and the molarity falls to 0.200M, since the added water brings no CuSO₄ with it", "The moles fall to 0.0100 mol and the molarity stays at 0.600M, since the water thins the solute itself", "Both fall to a third of what they were, 0.0100 mol and 0.200M, since the added water thins out each one", "The moles rise to 0.0900 mol as the added water carries more solute in, and the molarity falls to 0.200M"], "answer": "A", "answer_text": "The moles stay at 0.0300 mol and the molarity falls to 0.200M, since the added water brings no CuSO₄ with it", "exp": "Adding water adds no CuSO₄, and 0.600M = moles / 0.0500 L fixes the moles at 0.0300 mol, so spreading them through 0.1500 L gives 0.0300 mol ÷ 0.1500 L = 0.200M. Nothing removes solute, so 0.0100 mol is wrong in both options that use it; water carries no CuSO₄ into the flask, so the moles never climb to 0.0900 mol; and the molarity cannot hold at 0.600M once the volume triples."}, {"id": 71, "level": "Intermediate", "tag": "Dilution", "stem": "A technician pours 100. mL of 0.60M stock into a beaker and stirs in 3.0 × 10² mL of water. Using M(i)V(i) = M(f)V(f), what is the molarity of the finished solution? Report your answer with the correct number of significant digits.", "options": ["0.20M", "2.4M", "0.150M", "0.15M"], "answer": "D", "answer_text": "0.15M", "exp": "The water added is not the final volume: V(f) = 100. mL + 3.0 × 10² mL = 4.0 × 10² mL, so M(f) = (0.60M)(100. mL) ÷ 4.0 × 10² mL = 0.15M at two digits. The value 0.20M uses the 3.0 × 10² mL of water as V(f), 2.4M turns the volume ratio upside down, and 0.150M shows three digits when 0.60M supplies only two."}, {"id": 72, "level": "Intermediate", "tag": "Dilution", "stem": "The serial-dilution ladder runs 1.0M → 0.1M → 0.01M → 0.001M → 0.0001M → 0.00001M. Using M(i)V(i) = M(f)V(f), how much of the 0.0100M rung do you need to make 250.0 mL of the 0.00100M rung? Report your answer with the correct number of significant digits.", "options": ["25.0 mL", "225.0 mL", "0.0250 mL", "2.50 × 10³ mL"], "answer": "A", "answer_text": "25.0 mL", "exp": "V(i) = (0.00100M)(250.0 mL) ÷ 0.0100M = 25.0 mL of the 0.0100M rung, which is then topped up with water to the 250.0 mL mark. The value 225.0 mL is the water added, V(f) − V(i), rather than the rung solution measured out; 0.0250 mL keeps the 0.0250 L figure and relabels it milliliters; and 2.50 × 10³ mL swaps the two molarities."}, {"id": 73, "level": "Intermediate", "tag": "Dilution", "stem": "Two analysts prepare working solutions from the same stock bench. Analyst 1 dilutes 10.0 mL of 0.500M solution to 250.0 mL of solution, and Analyst 2 dilutes 25.0 mL of 0.200M solution to 200.0 mL of solution. Using M(i)V(i) = M(f)V(f), whose working solution is more dilute?", "options": ["Analyst 2's, at 0.0250M against 0.0200M, since that flask started from the weaker of the two stock solutions", "Neither — they match at 0.0250M each, because both analysts diluted by the very same factor of 25", "Analyst 2's, because that flask finished at the smaller total volume, 200.0 mL against 250.0 mL", "Analyst 1's, at 0.0200M against 0.0250M, since that flask spreads its solute through the larger volume"], "answer": "D", "answer_text": "Analyst 1's, at 0.0200M against 0.0250M, since that flask spreads its solute through the larger volume", "exp": "Analyst 1 gives M(f) = (0.500M)(10.0 mL) ÷ 250.0 mL = 0.0200M and Analyst 2 gives (0.200M)(25.0 mL) ÷ 200.0 mL = 0.0250M, so Analyst 1's working solution is the more dilute. The weaker stock does not settle it, since Analyst 1 cut its stock by a factor of 25 while Analyst 2 cut its stock by a factor of 8; the smaller total volume does not settle it either, since what matters is how far each stock was cut; and the two molarities are not equal."}, {"id": 74, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "In the spot-test tray you mix a solution of Na₂CO₃ with a solution of CaCl₂. Use the general solubility rules to trade the partners. What are the products, and which one is the precipitate?", "options": ["The products are Ca₂CO₃ and NaCl₂, and the Ca₂CO₃ is the solid that settles to the bottom of the well", "The products are CaCO₃ and NaCl, and the CaCO₃ is the precipitate to circle, since Ca²⁺ is no Group 1 cation", "The products are CaCO₃ and NaCl, and the NaCl is the precipitate, since Group 1 chlorides are insoluble", "There is no reaction at all, since carbonates stay dissolved beside every cation and nothing can leave"], "answer": "B", "answer_text": "The products are CaCO₃ and NaCl, and the CaCO₃ is the precipitate to circle, since Ca²⁺ is no Group 1 cation", "exp": "Trading partners gives CaCO₃ and NaCl. Carbonate is soluble only with the Group 1 cations, H⁺ and NH₄⁺, so CaCO₃ is insoluble and is the precipitate, while NaCl stays dissolved as Na⁺ and Cl⁻. Chloride is insoluble only with Ag⁺, Pb²⁺, Cu⁺ and Tl⁺, so NaCl never drops out; Ca₂CO₃ and NaCl₂ ignore the charges on Ca²⁺, Na⁺ and CO₃²⁻; and carbonate is very much insoluble with Ca²⁺."}, {"id": 75, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "Your Science Spiral says: “Complete and then balance the equation. Circle the precipitate. (Soluble compounds will remain as ions.)” Which line does that correctly for Li₃PO₄ mixed with Al(NO₃)₃, balanced using the lowest whole-number coefficients?", "options": ["Li₃PO₄ + Al(NO₃)₃ → Li⁺ + NO₃⁻ + AlPO₄", "3Li₃PO₄ + Al(NO₃)₃ → 9Li⁺ + 3NO₃⁻ + AlPO₄", "Li₃PO₄ + 3Al(NO₃)₃ → 3Li⁺ + 9NO₃⁻ + 3AlPO₄", "Li₃PO₄ + Al(NO₃)₃ → 3Li⁺ + 3NO₃⁻ + AlPO₄"], "answer": "D", "answer_text": "Li₃PO₄ + Al(NO₃)₃ → 3Li⁺ + 3NO₃⁻ + AlPO₄", "exp": "The trade gives LiNO₃, which is soluble and stays as ions, and AlPO₄, which is insoluble and gets circled: Li₃PO₄ + Al(NO₃)₃ → 3Li⁺ + 3NO₃⁻ + AlPO₄ carries 3 Li, 1 Al, 1 P and 3 N on both sides with the charges matching. Writing Li⁺ + NO₃⁻ leaves two lithiums and two nitrates unaccounted for, while the versions starting 3Li₃PO₄ and 3Al(NO₃)₃ multiply one reactant only and leave phosphorus and aluminum unbalanced."}, {"id": 76, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "You mix a solution of MgSO₄ with a solution of CaCl₂ in a spot-test well. Use the general solubility rules to predict PPT or NR, and name the solid if one forms.", "options": ["PPT — both products are insoluble, so the well fills with solid and the liquid above it turns clear", "NR — CaSO₄ and MgCl₂ are both soluble, since sulfates dissolve beside every cation in the rules table", "PPT — the CaSO₄ is insoluble, while the MgCl₂ stays dissolved, since the sulfate row names Ca²⁺ but not Mg²⁺", "PPT — the MgCl₂ is insoluble, since chlorides leave solution with every cation but the Group 1 metals"], "answer": "C", "answer_text": "PPT — the CaSO₄ is insoluble, while the MgCl₂ stays dissolved, since the sulfate row names Ca²⁺ but not Mg²⁺", "exp": "Trading partners gives CaSO₄ and MgCl₂, and the sulfate row lists Ca²⁺ among the cations that make sulfate insoluble, so CaSO₄ is the precipitate while MgCl₂ remains as Mg²⁺ and Cl⁻. Chloride is insoluble only with Ag⁺, Pb²⁺, Cu⁺ and Tl⁺, so MgCl₂ never precipitates; sulfate is not soluble with every cation; and only one of the two products leaves the solution."}, {"id": 77, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "You mix a solution of NH₄Cl with a solution of Na₂CO₃. Use the general solubility rules to trade the partners and predict PPT or NR.", "options": ["PPT — the (NH₄)₂CO₃ is insoluble, since carbonates leave solution with every cation outside Group 1", "PPT — the NaCl is insoluble, since chloride sits on the insoluble side of the halide row of the table", "NR — the (NH₄)₂CO₃ and the NaCl are both soluble, since the carbonate row lists NH₄⁺ beside Group 1", "NR — two solutions can never react, since a double replacement needs one solid reactant to get started"], "answer": "C", "answer_text": "NR — the (NH₄)₂CO₃ and the NaCl are both soluble, since the carbonate row lists NH₄⁺ beside Group 1", "exp": "The trade gives (NH₄)₂CO₃ and NaCl. The carbonate row lists NH₄⁺ alongside the Group 1 cations as soluble, and Na⁺ is soluble with any anion, so nothing leaves the solution and the prediction is NR. Carbonate is insoluble with the cations outside that list rather than with NH₄⁺, chloride is insoluble only with Ag⁺, Pb²⁺, Cu⁺ and Tl⁺, and a double replacement between two solutions needs no solid to start."}, {"id": 78, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "Four pairs of solutions are lined up on the tray. Using the general solubility rules, which pair gives a precipitate?", "options": ["KCl with Pb(NO₃)₂, which drops PbCl₂, since the halide row lists Pb²⁺ as insoluble with Cl⁻", "NH₄Cl with K₂CO₃, which drops (NH₄)₂CO₃ because carbonates are insoluble beside every cation", "Na₂CO₃ with K₃PO₄, which drops K₂CO₃ because phosphate pushes carbonate out of any solution", "NaNO₃ with KCl, which drops KNO₃ because two Group 1 salts cannot both stay dissolved at once"], "answer": "A", "answer_text": "KCl with Pb(NO₃)₂, which drops PbCl₂, since the halide row lists Pb²⁺ as insoluble with Cl⁻", "exp": "Trading KCl with Pb(NO₃)₂ gives PbCl₂ and KNO₃, and the halide row lists Pb²⁺ as insoluble with Cl⁻, so PbCl₂ is the precipitate. The other three pairs trade into KNO₃, NaCl, (NH₄)₂CO₃, KCl, Na₃PO₄ and K₂CO₃, every one of them soluble, because Group 1 cations and NH₄⁺ dissolve with any anion and nitrate dissolves with any cation."}, {"id": 79, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "Adding K₂CO₃ solution to CuSO₄ solution leaves a blue-green solid on the bottom of the tube. Using the general solubility rules, which compound is that solid?", "options": ["CuCO₃, since carbonate is soluble only with Group 1 cations, H⁺ and NH₄⁺, and Cu²⁺ is on neither list", "K₂CO₃, since carbonate pulls whatever cation it meets down to the bottom of the tube with it", "K₂SO₄, since the sulfate row of the table makes sulfate insoluble beside every cation there is", "CuSO₄, since it was never truly dissolved and simply settles out once the tube has been disturbed"], "answer": "A", "answer_text": "CuCO₃, since carbonate is soluble only with Group 1 cations, H⁺ and NH₄⁺, and Cu²⁺ is on neither list", "exp": "The trade gives CuCO₃ and K₂SO₄, and Cu²⁺ is outside the Group 1 and NH₄⁺ list, so CuCO₃ is the insoluble one while K₂SO₄ stays dissolved as K⁺ and SO₄²⁻. Sulfate is insoluble only with Ca²⁺, Sr²⁺, Ba²⁺, Ag⁺, Pb²⁺ and Ra²⁺; the CuSO₄ dissolved completely before the mixing; and K₂CO₃ is soluble because K⁺ dissolves with any anion."}, {"id": 80, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "Two storm-drain samples are tested with a few drops of AgNO₃ solution. Sample 1, known to carry NaCl, gives a white solid; Sample 2, known to carry NaNO₃, stays clear. What is the white solid, and why does Sample 2 give nothing?", "options": ["NaNO₃ — it is the insoluble product in Sample 1, and Sample 2 already holds all the nitrate it can take", "AgCl — chloride is insoluble with Ag⁺, and Sample 2 gives nothing because nitrates react only when warmed", "AgNO₃ — the drops themselves settle out in Sample 1, while Sample 2 dissolves those same drops completely", "AgCl — chloride is insoluble with Ag⁺, while every nitrate stays dissolved, so Sample 2 can give nothing"], "answer": "D", "answer_text": "AgCl — chloride is insoluble with Ag⁺, while every nitrate stays dissolved, so Sample 2 can give nothing", "exp": "Sample 1 trades into AgCl and NaNO₃, and the halide row lists Ag⁺ as insoluble with Cl⁻, so AgCl is the white solid; Sample 2 can only trade into AgNO₃ and NaNO₃, and nitrate is soluble with any cation, so nothing forms. NaNO₃ is soluble twice over, the AgNO₃ drops dissolve in both tubes, and warming has nothing to do with the second result."}, {"id": 81, "level": "Intermediate", "tag": "Double Replacement and Precipitates", "stem": "A lab partner mixes Na₂SO₄ solution with Ba(NO₃)₂ solution and says “NR — every nitrate is soluble, so nothing can come out.” Use the general solubility rules to judge the claim.", "options": ["Wrong — the other product, BaSO₄, is insoluble, so a precipitate forms, since the sulfate row names Ba²⁺", "Wrong — the NaNO₃ is the insoluble product, since sodium salts leave solution whenever sulfate is present", "Right — both products are soluble, so the tube stays clear and the prediction of NR holds up", "Wrong — both products come out together, since neither barium nor sodium can stay dissolved beside sulfate"], "answer": "A", "answer_text": "Wrong — the other product, BaSO₄, is insoluble, so a precipitate forms, since the sulfate row names Ba²⁺", "exp": "The trade gives BaSO₄ and NaNO₃, and the sulfate row lists Ba²⁺ among the cations that make sulfate insoluble, so BaSO₄ precipitates and the claim fails. NaNO₃ is soluble twice over, by the Na⁺ row and by the nitrate row, so it is neither the solid nor a second solid, and checking only the nitrate half of the trade is exactly the mistake the partner made."}, {"id": 82, "level": "Intermediate", "tag": "Solubility Rules", "stem": "The abbreviated table glued in your Science Spiral carries only four rules: nitrate is soluble with any cation; Cl⁻, Br⁻ and I⁻ are insoluble with Ag⁺, Pb²⁺, Cu⁺ and Tl⁺ but soluble with any other cation; and phosphate and carbonate are soluble with the Group 1 cations and H⁺ but insoluble with any other cation. Which compound's solubility can you NOT settle from that table alone?", "options": ["CaCO₃, the calcium carbonate solid", "AgCl, the silver chloride solid", "K₃PO₄, a potassium phosphate salt", "MgSO₄, magnesium sulfate"], "answer": "D", "answer_text": "MgSO₄, magnesium sulfate", "exp": "The abbreviated table covers nitrate, the halides, phosphate and carbonate, but it carries no sulfate rule at all, so MgSO₄ cannot be settled from it — that takes the full general solubility rules table. AgCl is insoluble by the halide row, K₃PO₄ is soluble because K⁺ is a Group 1 cation, and CaCO₃ is insoluble because Ca²⁺ is not one."}, {"id": 83, "level": "Intermediate", "tag": "Solubility Rules", "stem": "Use the general solubility rules table. The reagent tray holds one bottle labeled AgNO₃ and one jar labeled AgCl. Which labeling of the two is correct?", "options": ["Both are soluble, since silver sits on the soluble side of the halide row while nitrate dissolves with any cation at all", "Both are insoluble, since every compound built on the silver ion stays out of solution in water, the AgNO₃ bottle included", "AgNO₃ is insoluble and AgCl is soluble, since the heavier nitrate ion drags silver out of solution while the chloride lets it stay", "AgNO₃ is soluble and AgCl is insoluble, since nitrate dissolves with any cation while Ag⁺ sits on the insoluble side of the halide row"], "answer": "D", "answer_text": "AgNO₃ is soluble and AgCl is insoluble, since nitrate dissolves with any cation while Ag⁺ sits on the insoluble side of the halide row", "exp": "Nitrate is soluble with any cation, so AgNO₃ dissolves, while the halide row lists Ag⁺ among the cations that make Cl⁻ insoluble, so AgCl does not. Silver sits on the insoluble side of that halide row rather than the soluble side, and it forms the perfectly soluble AgNO₃ used all through the spot tests, so not every silver compound stays out of solution."}, {"id": 84, "level": "Intermediate", "tag": "Solubility Rules", "stem": "Use the general solubility rules table to label the two sulfates on the reagent shelf, CaSO₄ and MgSO₄, as soluble (S) or insoluble (I).", "options": ["Both are I, since the sulfate ion is insoluble beside every cation listed anywhere in the table", "CaSO₄ is I and MgSO₄ is S, since the sulfate row names Ca²⁺ but not Mg²⁺ among its insoluble cations", "Both are S, since sulfate shares a row of the table with nitrate and behaves the same way it does", "CaSO₄ is S and MgSO₄ is I, since magnesium is the heavier of the two cations in the pair"], "answer": "B", "answer_text": "CaSO₄ is I and MgSO₄ is S, since the sulfate row names Ca²⁺ but not Mg²⁺ among its insoluble cations", "exp": "The sulfate row names Ca²⁺, Sr²⁺, Ba²⁺, Ag⁺, Pb²⁺ and Ra²⁺ as the cations that make sulfate insoluble and calls sulfate soluble with any other cation, so CaSO₄ is I and MgSO₄ is S. Mg²⁺ is not on that short list whatever its mass, sulfate is soluble with most cations rather than with none, and sulfate has a row of its own that is nothing like the nitrate row."}, {"id": 85, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of CuSO₄ per 100. mL of water: 15 g at 0 °C, 20. g at 20 °C, 30. g at 40 °C, 40. g at 60 °C, 55 g at 80 °C and 79 g at 100 °C. A beaker holds 25 g of CuSO₄ dissolved in 100. mL of water. At about what temperature would that 25 g exactly saturate the water?", "options": ["About 20 °C, since the 20. g reading is the last one the 25 g can sit on", "About 30 °C, the point halfway between the 20. g and 30. g readings", "About 60 °C, since 25 g only goes in once the water reaches its 40. g reading", "About 40 °C, since 30. g is the first reading above 25 g and saturation is read off a listed temperature"], "answer": "B", "answer_text": "About 30 °C, the point halfway between the 20. g and 30. g readings", "exp": "The table gives 20. g per 100. mL at 20 °C and 30. g per 100. mL at 40 °C, so the 25 g mark falls halfway between those readings, at about 30 °C. At 20 °C the water can take only 20. g and some of the 25 g would stay undissolved, while at 40 °C and 60 °C the water has room for 30. g and 40. g, so 25 g would leave it unsaturated rather than saturated."}, {"id": 86, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of NH₄Cl per 100. mL of water: 30. g at 0 °C, 38 g at 20 °C, 45 g at 40 °C, 55 g at 60 °C, 65 g at 80 °C and 78 g at 100 °C. A saturated solution made in 100. mL of water at 80 °C is cooled to 20 °C and crystals appear. About how much NH₄Cl crystallizes out?", "options": ["103 g", "38 g", "65 g", "27 g"], "answer": "D", "answer_text": "27 g", "exp": "The saturated solution at 80 °C holds 65 g per 100. mL, and 20 °C water can hold only 38 g, so 65 g − 38 g = 27 g has to crystallize out. The value 38 g is what stays dissolved at the lower temperature, 65 g is everything that was there to begin with, and 103 g adds the two table readings instead of subtracting them."}, {"id": 87, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your KNO₃ solubility curve is built from these crystallization points: 40. g per 100. mL at 25 °C, 80. g per 100. mL at 50 °C, 120. g per 100. mL at 65 °C and 160. g per 100. mL at 75 °C. A solution holding 80. g of KNO₃ in 100. mL of water at 50 °C is cooled to 25 °C. About how much KNO₃ crystallizes out?", "options": ["80. g", "1.2 × 10² g", "40. g", "20. g"], "answer": "C", "answer_text": "40. g", "exp": "At 50 °C the water is holding its full 80. g and at 25 °C it can hold only 40. g, so 80. g − 40. g = 40. g comes out. The value 80. g would mean every gram crystallized and the cooled water held none, 1.2 × 10² g adds the two curve readings together instead of subtracting them, and 20. g would leave 60. g dissolved at 25 °C, far past the 40. g the curve allows."}, {"id": 88, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of CuSO₄ per 100. mL of water: 15 g at 0 °C, 20. g at 20 °C, 30. g at 40 °C, 40. g at 60 °C, 55 g at 80 °C and 79 g at 100 °C. How much CuSO₄ is needed to saturate 300. mL of water at 20 °C? Report your answer with the correct number of significant digits.", "options": ["6.7 g", "6.0 × 10² g", "20. g", "60. g"], "answer": "D", "answer_text": "60. g", "exp": "The table is written per 100. mL, so 300. mL takes three times as much: 20. g × 3 = 60. g at 20 °C. The value 20. g is the reading for a single 100. mL and ignores the tripled water, 6.7 g divides the reading by three instead of multiplying, and 6.0 × 10² g multiplies by 30 rather than by the factor of 3 between 100. mL and 300. m
