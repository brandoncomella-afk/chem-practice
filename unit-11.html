L."}, {"id": 89, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your Day 9 table gives, per 100. mL of water at 0 °C, 20 °C, 40 °C, 60 °C, 80 °C and 100 °C, NH₃ at 90. g, 55 g, 35 g, 23 g, 14 g and 7 g, and NH₄Cl at 30. g, 38 g, 45 g, 55 g, 65 g and 78 g. Between which readings do the two curves cross, and roughly where?", "options": ["Between 20 °C and 40 °C, at about 32 °C, where the falling NH₃ line meets the rising NH₄Cl line", "Between 60 °C and 80 °C, at about 70 °C, where the NH₃ line finally climbs past the NH₄Cl line", "They never cross, since NH₃ stays the more soluble of the two at every temperature in the table", "Between 0 °C and 20 °C, at about 12 °C, where the NH₃ line has already dropped below the NH₄Cl line"], "answer": "A", "answer_text": "Between 20 °C and 40 °C, at about 32 °C, where the falling NH₃ line meets the rising NH₄Cl line", "exp": "At 20 °C the NH₃ leads 55 g to 38 g, and by 40 °C the NH₄Cl leads 45 g to 35 g, so the two lines must cross between those readings, at about 32 °C. Below 20 °C the NH₃ line is still far above at 90. g against 30. g, above 60 °C the falling NH₃ line and the rising NH₄Cl line only spread further apart, and NH₃ is plainly not the more soluble at 80 °C, where it holds 14 g against 65 g."}, {"id": 90, "level": "Intermediate", "tag": "Solubility Curves", "stem": "On the class solubility graph, the line for Compound D falls as the temperature rises and sits at about 30–35 g per 100. mL of water at 80 °C. What does that shape tell you about Compound D, and what happens if its solution is warmed further?", "options": ["Compound D is most likely a gas, and warming drives more of it out of solution, since a falling line marks a gas", "Compound D is most likely a solid, and warming drives more of it into solution the way it does on the other lines", "Compound D is most likely a solid, and warming does nothing to it at all, since its line is the flattest on the graph", "Compound D is most likely a gas, and warming lets the water take up still more of it as the line turns and rises"], "answer": "A", "answer_text": "Compound D is most likely a gas, and warming drives more of it out of solution, since a falling line marks a gas", "exp": "Solids become more soluble as the temperature rises while gases become less soluble, so a line that falls with temperature marks Compound D as a gas, and warming it further drives still more of it out of solution. Compound D's line does not turn and rise, a solid would not fall in the first place, and the flattest line belongs to Compound C, the one least affected by temperature."}, {"id": 91, "level": "Intermediate", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of NH₄Cl per 100. mL of water: 30. g at 0 °C, 38 g at 20 °C, 45 g at 40 °C, 55 g at 60 °C, 65 g at 80 °C and 78 g at 100 °C. A jar holds 300. mL of water at 20 °C with 80. g of NH₄Cl already dissolved in it. How much more NH₄Cl will dissolve at that temperature?", "options": ["42 g", "114 g", "34 g", "38 g"], "answer": "C", "answer_text": "34 g", "exp": "At 20 °C the table allows 38 g per 100. mL, so 300. mL can hold 38 g × 3 = 114 g, and with 80. g already dissolved the room left is 114 g − 80. g = 34 g. The value 114 g is the total capacity rather than the room left, 42 g compares the 80. g with the 38 g for a single 100. mL, and 38 g is the table reading itself with the tripled volume ignored."}, {"id": 92, "level": "Intermediate", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Your KNO₃ curve gives 120. g per 100. mL of water at 65 °C and 40. g per 100. mL at 25 °C. You dissolve 120. g of KNO₃ in 100. mL of water at 65 °C, then let the flask cool undisturbed to 25 °C and no crystals appear. How is the solution described now, and what happens when a seed crystal is dropped in?", "options": ["Unsaturated — the seed dissolves too, which proves the water at 25 °C still had room for more KNO₃", "Supersaturated — the seed dissolves and the extra 80. g of KNO₃ stays in solution in the cooled flask", "Supersaturated — the seed starts crystallization and about 80. g comes out, the excess that 25 °C water cannot hold", "Saturated — the seed dissolves along with the rest, since the flask is sitting right on its saturation point"], "answer": "C", "answer_text": "Supersaturated — the seed starts crystallization and about 80. g comes out, the excess that 25 °C water cannot hold", "exp": "Cooling an undisturbed solution past its saturation point leaves it supersaturated, holding 120. g where 25 °C water can hold only 40. g, and the seed gives the crystals a surface to grow on, so about 120. g − 40. g = 80. g comes out. A flask carrying three times what the curve allows is neither saturated nor unsaturated, and the seed starts crystallization rather than dissolving away."}, {"id": 93, "level": "Intermediate", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Two beakers sit on the bench. Beaker 1 holds 75 g of Compound A in 100. mL of water at 20 °C, where the curve shows Compound A can hold 145 g per 100. mL. Beaker 2 holds 125 g of Compound B in 100. mL of water at 80 °C, which is more than Compound B's curve allows there. How is each solution described?", "options": ["Beaker 1 is unsaturated and Beaker 2 is supersaturated, since 75 g sits under the 145 g the curve allows there", "Beaker 1 is supersaturated and Beaker 2 is saturated, since Compound A is the more soluble compound on the graph", "Both are saturated, since each beaker holds all the solute its 100. mL of water can take at its temperature", "Beaker 1 is saturated and Beaker 2 is unsaturated, since Compound B is holding the larger mass of solute of the two"], "answer": "A", "answer_text": "Beaker 1 is unsaturated and Beaker 2 is supersaturated, since 75 g sits under the 145 g the curve allows there", "exp": "Beaker 1 holds 75 g where its curve allows 145 g, so more could still dissolve and it is unsaturated, while Beaker 2 carries more than its curve allows at 80 °C and is therefore supersaturated. Holding the larger mass does not make a solution unsaturated, being the more soluble compound does not make Compound A supersaturated, and neither beaker is sitting exactly on its saturation point."}, {"id": 94, "level": "Intermediate", "tag": "Gas Solubility", "stem": "A sealed sampling cylinder of river water is warmed from 5 °C to 25 °C, and at the same time the pressure of the air above the water is raised. What do those two changes do to the amount of oxygen the water can hold?", "options": ["The higher pressure lowers it while the higher temperature raises it, the way it would for a dissolved solid", "Both changes raise it, since warming a liquid and squeezing it each drive more gas down into the water", "The higher pressure raises it while the higher temperature lowers it, the way it goes for any dissolved gas", "Both changes lower it, since a gas leaves solution whenever anything about its surroundings is changed"], "answer": "C", "answer_text": "The higher pressure raises it while the higher temperature lowers it, the way it goes for any dissolved gas", "exp": "Gases become less soluble as temperature rises and more soluble as pressure rises, so warming from 5 °C to 25 °C lowers the oxygen the water can hold while the added pressure raises it. Rising temperature raises solubility only for solids, warming never drives a gas into water, and here the two changes work against each other rather than together."}, {"id": 95, "level": "Intermediate", "tag": "Gas Solubility", "stem": "At a bottling plant, CO₂ is forced into the syrup under high pressure while sugar is stirred into that same syrup. Which statement about what the pressure does is correct?", "options": ["The pressure raises how much of both dissolves, since squeezing the syrup forces every solute down into it", "The pressure raises how much sugar dissolves but drives the CO₂ back out as fast as it is pumped in", "The pressure raises how much CO₂ dissolves but does nothing at all to how much of the sugar dissolves", "The pressure changes neither one, since temperature is the only thing that can change how much dissolves"], "answer": "C", "answer_text": "The pressure raises how much CO₂ dissolves but does nothing at all to how much of the sugar dissolves", "exp": "Raising the pressure over a liquid pushes more gas into solution, so the CO₂ solubility climbs, while the solubility of a solid such as sugar is not affected by pressure at all. Pressure does not force a solid into solution, it drives the CO₂ in rather than out, and temperature is not the only factor here, since for a gas the pressure matters too."}, {"id": 96, "level": "Intermediate", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "Two students each stir 25 g of KNO₃ into 100. mL of water at 25 °C, where the curve allows 40. g per 100. mL. One grinds the crystals to a powder first; the other drops in a single large crystal. Once both have been left long enough, how do the two beakers compare?", "options": ["The powder beaker dissolves all 25 g while the large crystal beaker can take up only about half of it", "The powder beaker dissolves more than 25 g, since the extra surface area raises what the water can hold", "Both beakers stop short of 25 g, since 25 g is already past what 100. mL of water can take at 25 °C", "Both hold all 25 g dissolved, and the powder simply got there sooner, since 25 g sits under the 40. g limit"], "answer": "D", "answer_text": "Both hold all 25 g dissolved, and the powder simply got there sooner, since 25 g sits under the 40. g limit", "exp": "Surface area changes only the dissolving rate and not how much can dissolve, and 25 g is under the 40. g the curve allows at 25 °C, so both beakers finish with all 25 g in solution while the powder gets there faster. Grinding cannot raise the saturation point, the large crystal is not limited to half, and 25 g sits well below the 40. g limit."}, {"id": 97, "level": "Intermediate", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "A beaker of CuSO₄ solution at 20 °C has undissolved solid on the bottom, and the Day 9 table gives CuSO₄ solubility as 20. g per 100. mL of water at 20 °C and 30. g per 100. mL at 40 °C. Which change will actually put more CuSO₄ into solution?", "options": ["Grinding the leftover solid to a fine powder, which lifts the limit by exposing much more surface area", "Warming the beaker to 40 °C, which lifts the limit to 30. g per 100. mL and lets another 10. g dissolve", "Stirring the beaker hard for another ten minutes, which lifts the limit for as long as the stirring keeps up", "Sealing the beaker and raising the pressure above it, which packs more of the solid down into the water"], "answer": "B", "answer_text": "Warming the beaker to 40 °C, which lifts the limit to 30. g per 100. mL and lets another 10. g dissolve", "exp": "The solution is already saturated at 20. g per 100. mL, and only a temperature change moves that limit, so warming to 40 °C lets another 10. g per 100. mL dissolve. Agitation (stirring or shaking) and surface area change only the dissolving rate, so stirring longer or grinding finer adds nothing once a solution is saturated, and pressure changes the solubility of gases only, never of a solid."}, {"id": 98, "level": "Intermediate", "tag": "Electrolytes and Nonelectrolytes", "stem": "Two discharges are checked with a conductivity tester. Water from Discharge 1 lights the bulb brightly, while water from Discharge 2, known to carry dissolved sugar, leaves the bulb dark even though all of its sugar has dissolved. What can you conclude?", "options": ["Discharge 2's sugar dissolved into ions as well, but sugar ions are far too weak to carry a current", "Discharge 1 carries dissolved ions, while the sugar dissolves without ionizing and leaves the bulb dark", "Discharge 2 has nothing dissolved in it at all, since any solution carrying a solute will light the bulb", "Discharge 1 carries dissolved ions, so the tester has named the ion in that water as well as its charge"], "answer": "B", "answer_text": "Discharge 1 carries dissolved ions, while the sugar dissolves without ionizing and leaves the bulb dark", "exp": "A lit bulb means dissolved ions are present, so something in Discharge 1 dissociated, while sugar is a nonelectrolyte that dissolves as whole molecules and leaves the bulb dark. The tester shows only that ions are there and cannot say which ion it is, a solution can be full of dissolved solute and still not conduct, and sugar breaks into no ions at all, weak or otherwise."}, {"id": 99, "level": "Intermediate", "tag": "Water, Polarity, and Dissolving", "stem": "A fuel-oil sheen floats on the river while the dissolved salts in that same water stay in solution. Which explanation accounts for both observations?", "options": ["Oil is the more polar of the two, so the partial charges on the water molecules push it away to the surface", "Salt is nonpolar, so it slips between the water molecules, while the polar oil is blocked at the surface", "Water's partial charges hold the oil up in a layer, and the salts stay under only because they are heavier", "Water's partial charges pull the ions of the salt apart, but nonpolar oil gives them nothing to pull on"], "answer": "D", "answer_text": "Water's partial charges pull the ions of the salt apart, but nonpolar oil gives them nothing to pull on", "exp": "Unequal sharing of the electrons gives water a partial positive end and a partial negative end, and those partial charges pull the ions of a salt apart and surround them, while an oil molecule shares its electrons nearly evenly and offers nothing to grip. Oil is the nonpolar substance and salt the ionic one, not the reverse, and the separation has nothing to do with which is heavier."}, {"id": 100, "level": "Intermediate", "tag": "Solute, Solvent, and Solution", "stem": "To make a working solution you pipet 25.0 mL of CuSO₄ stock into a flask and add water up to the 100.0 mL mark. In the finished flask, what is the solute, what is the solvent, and which volume belongs in the Liters of molarity = moles / Liters?", "options": ["CuSO₄ is the solute, water is the solvent, and the Liters is the 0.0250 L of stock that was pipetted", "CuSO₄ is the solute, water is the solvent, and the Liters is the whole 0.1000 L of solution in the flask", "Water is the solute, CuSO₄ is the solvent, and the Liters is the 0.1000 L of solution in the flask", "CuSO₄ is the solute, water is the solvent, and the Liters is the 0.0750 L of water that was added"], "answer": "B", "answer_text": "CuSO₄ is the solute, water is the solvent, and the Liters is the whole 0.1000 L of solution in the flask", "exp": "The CuSO₄ is the substance being dissolved and the water is doing the dissolving, and molarity counts moles per liter of solution, so the volume that belongs in the equation is the whole 100.0 mL ÷ 1000 mL/L = 0.1000 L in the flask. The 0.0750 L of water added and the 0.0250 L of stock pipetted are each only a part of that total, and the solvent is the water rather than the CuSO₄."}, {"id": 101, "level": "Intermediate", "tag": "Significant Digits in Solution Calculations", "stem": "You weigh 4.50 g of NaCl (MM = 58.44 g/mol) and dilute it to 0.250 L of solution. Running molarity = moles / Liters straight through without rounding, your calculator shows 0.3080082… Report the molarity with the correct number of significant digits.", "options": ["0.3M", "0.31M", "0.308M", "0.3080M"], "answer": "C", "answer_text": "0.308M", "exp": "The chain is 4.50 g NaCl × (1 mole NaCl / 58.44 g NaCl) = 0.0770 mol, then 0.0770 mol ÷ 0.250 L, and the fewest digits anywhere in the chain is three, from 4.50 g and 0.250 L, so the molarity is 0.308M. Rounding once at the end is what fixes the count: 0.3080M shows four digits, 0.31M shows two, and 0.3M shows one."}, {"id": 102, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "On Day 4 the gravimetric test is repeated at a second station, where a 0.100 L sample yields 1.2 × 10⁻⁴ g of dried AlPO₄ (MM = 121.95 g/mol). One mole of AlPO₄ carries one mole of Al³⁺. Using molarity = moles / Liters, what is the molarity of Al³⁺ at that station? Report your answer with the correct number of significant digits.", "options": ["9.8 × 10⁻⁷M", "9.8 × 10⁻⁶M", "1.2 × 10⁻³M", "9.8 × 10⁻⁸M"], "answer": "B", "answer_text": "9.8 × 10⁻⁶M", "exp": "The T-chart gives 1.2 × 10⁻⁴ g AlPO₄ × (1 mole AlPO₄ / 121.95 g AlPO₄) = 9.8 × 10⁻⁷ mol, and molarity = moles / Liters = 9.8 × 10⁻⁷ mol ÷ 0.100 L = 9.8 × 10⁻⁶M at two digits, still above the 3.0 × 10⁻⁶ moles/liter threshold. The value 9.8 × 10⁻⁷M stops at the mole count, 9.8 × 10⁻⁸M multiplies by the 0.100 L instead of dividing by it, and 1.2 × 10⁻³M never takes the grams to moles at all."}, {"id": 103, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "Your Day 4 sample works out to 1.0 × 10⁻⁵M Al³⁺, and the aluminum toxicity threshold used in the investigation is 3.0 × 10⁻⁶ moles/liter. How many times the threshold is that sample? Report your answer with the correct number of significant digits.", "options": ["0.30 times", "7.0 × 10⁻⁶ times", "3.3 times", "3.33 times"], "answer": "C", "answer_text": "3.3 times", "exp": "Divide the two: 1.0 × 10⁻⁵M ÷ 3.0 × 10⁻⁶M = 3.333, or 3.3 times the threshold at two digits, so the sample sits well above the limit. The value 0.30 times inverts the ratio and would put the sample under the threshold, 7.0 × 10⁻⁶ times subtracts the molarities instead of dividing them, and 3.33 times keeps a third digit the two-digit data cannot support."}, {"id": 104, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "On Day 6 your team runs the serial-dilution ladder 1.0M → 0.1M → 0.01M → 0.001M → 0.0001M on samples from both ends of the 40-mile stretch. The sample from the Anderson end has to be carried further down the ladder than the Indianapolis sample before it matches the same reference color. What does that tell you?", "options": ["The two samples were equally concentrated, since both were matched against the very same reference color on the chart", "The Anderson sample was the more dilute, since a sample carried further down the ladder began weaker than the one beside it", "The Anderson sample was the more concentrated of the two, since each rung of the ladder cuts the concentration to a tenth", "The Anderson sample held fewer moles per liter, since each rung of the ladder removes solute from the flask for good"], "answer": "C", "answer_text": "The Anderson sample was the more concentrated of the two, since each rung of the ladder cuts the concentration to a tenth", "exp": "Every rung of the ladder cuts the concentration to a tenth, so a sample that needs more rungs to fall to the reference color must have started with more moles per liter, which puts the heaviest contamination at the north end, at Anderson. Needing more dilution marks a stronger sample rather than a weaker one, matching the same reference at different rungs means the samples were not equal, and dilution spreads solute through more volume instead of removing it."}, {"id": 105, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "Guide Corporation pleaded guilty to criminal negligence under the Clean Water Act after the 1999 White River fish kill. Which statement about the penalties is correct?", "options": ["There was no fine of any kind, since the wastewater went through the Anderson treatment plant and that plant carried the whole penalty", "The criminal fine alone came to about $14 million, and no civil settlement or restitution was ever attached to the case at all", "The company paid about $2 million in all, every dollar of it restitution, with no criminal fine included anywhere in that figure", "The criminal fine was about $2 million, and forfeiture, restitution and the civil settlement brought the total to about $14 million"], "answer": "D", "answer_text": "The criminal fine was about $2 million, and forfeiture, restitution and the civil settlement brought the total to about $14 million", "exp": "The criminal fine was roughly $2 million, while forfeiture, restitution and the civil settlement brought what Guide Corporation paid to roughly $14 million in all. The $14 million was never the criminal fine by itself, a guilty plea to criminal negligence means there certainly was a fine, and the $2 million figure is that criminal fine rather than the whole of what was paid."}, {"id": 106, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "On Day 1 the conductivity tester lights up in the river sample but stays dark in a sample of the boat fuel oil. How does that reading bear on the fuel-oil suspect?", "options": ["It tells you nothing at all, since a conductivity tester responds only to how warm the water in the beaker happens to be", "It names the ion in the river water, since every dissolved ion lights the bulb with a brightness of its own to read off", "It confirms the oil as the source, since a dark bulb is what a dissolved pollutant always gives in a test of this kind", "It rules the oil out, since the oil neither dissolves in water nor breaks apart into the ions a tester needs to light the bulb"], "answer": "D", "answer_text": "It rules the oil out, since the oil neither dissolves in water nor breaks apart into the ions a tester needs to light the bulb", "exp": "The lit bulb shows the river water carries dissolved ions, and the dark bulb shows the nonpolar fuel oil neither dissolves nor breaks apart into ions, so the oil cannot be what the tester is picking up and the spill is ruled out. A dark bulb is not a positive result, the tester shows only that ions are present without naming which one, and it responds to ions rather than to temperature."}, {"id": 107, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "The Day 2 spot test runs each sample against CuSO₄, NH₄OH, Na₂CO₃, MgSO₄ and CaCl₂. Your river water gives NR, PPT, PPT, NR, NR, which matches the aluminum row of the chart. A second sample gives PPT with all five reagents. Which suspect ion does that second sample carry?", "options": ["Aluminum, since a more concentrated aluminum sample precipitates with every one of the five reagents on the tray", "Lead, since Pb²⁺ is insoluble with sulfate, hydroxide, carbonate and chloride alike, so all five wells come down", "Nitrate, since nitrate precipitates with each of the five reagents once it is concentrated enough to show", "Sodium, since the sodium in a sample precipitates with every one of the five reagents on the tray in turn"], "answer": "B", "answer_text": "Lead, since Pb²⁺ is insoluble with sulfate, hydroxide, carbonate and chloride alike, so all five wells come down", "exp": "Pb²⁺ sits on the insoluble side of the sulfate, hydroxide, carbonate and halide rows, so a lead sample precipitates with all five reagents, while aluminum gives only the two precipitates of the NR, PPT, PPT, NR, NR fingerprint however concentrated it is. Nitrate is soluble with every cation and sodium is soluble with every anion, so neither of those can give a precipitate at all."}, {"id": 108, "level": "Intermediate", "tag": "Case File: An Aquatic Apocalypse", "stem": "The coal power plant is a suspect for thermal pollution, and warm water holds less dissolved oxygen than cold water. Your Day 9 weather data for Indianapolis over December 5–16 gives daily highs running from −7 °C to 11 °C. How does that bear on the low-oxygen explanation for the December 16 kill?", "options": ["It strengthens it, since cold water is denser and dense water squeezes dissolved oxygen out at the surface as it sinks", "It settles nothing, since temperature changes only how fast oxygen dissolves and not how much of it the river can hold", "It weakens it, since water that cold can hold a great deal of oxygen, far more than the same river could hold in summer", "It strengthens it, since cold water holds less oxygen than warm water and December is the worst month of the year for it"], "answer": "C", "answer_text": "It weakens it, since water that cold can hold a great deal of oxygen, far more than the same river could hold in summer", "exp": "Gases become less soluble as temperature rises, so river water at those December temperatures can hold a great deal of dissolved oxygen, which makes thermal pollution and asphyxiation a poor explanation for the kill — and that is why your investigation ruled it out. Cold water can hold more oxygen rather than less, temperature does change how much of a gas can dissolve, and density does not push dissolved oxygen out of solution."}, {"id": 109, "level": "Advanced", "tag": "Molarity", "stem": "Three grab samples of 250.0 mL each are taken along an upstream-to-downstream transect and evaporated to dryness on an analytical scale reading to 0.0001 g. Station 1 leaves 0.0292 g of NaCl (MM = 58.44 g/mol), Station 2 leaves 0.0373 g of KCl (MM = 74.55 g/mol), and Station 3 leaves 0.0555 g of CaCl₂ (MM = 110.98 g/mol). There are 1000 mL in a liter. Using molarity = moles / Liters, which station's water is the most concentrated? Report any molarity with the correct number of significant digits.", "options": ["All three are the same, 5.00 × 10⁻⁴M, since every sample was the same 250.0 mL and molarity just counts moles", "Station 3, at 5.00 × 10⁻⁴M, because the heaviest dried residue always marks the most concentrated sample", "Station 2, at 2.55 × 10⁻³M, because potassium chloride puts more dissolved particles into each gram than the others", "All three are the same, 2.00 × 10⁻³M, since the larger molar masses take more grams to reach the same moles"], "answer": "D", "answer_text": "All three are the same, 2.00 × 10⁻³M, since the larger molar masses take more grams to reach the same moles", "exp": "Each residue is 5.00 × 10⁻⁴ mol: 0.0292 g ÷ 58.44 g/mol, 0.0373 g ÷ 74.55 g/mol and 0.0555 g ÷ 110.98 g/mol all return that count, and 5.00 × 10⁻⁴ mol ÷ 0.2500 L = 2.00 × 10⁻³M at every station. Calling Station 3 the strongest at 5.00 × 10⁻⁴M compares grams instead of moles and reports moles as a molarity, 2.55 × 10⁻³M runs Station 2's residue through the wrong molar mass, and 5.00 × 10⁻⁴M for all three stops at the mole count without dividing by the 0.2500 L."}, {"id": 110, "level": "Advanced", "tag": "Molarity", "stem": "A printed worked solution in the lab binder reads: “How many grams of NaCl (MM = 58.44 g/mol) are in 0.75 L of 0.20M NaCl? molarity = moles / Liters, so moles = 0.20 mol, and 0.20 mol NaCl × (58.44 g NaCl / 1 mole NaCl) = 11.7 g NaCl.” Using molarity = moles / Liters, what is wrong with it? Report any mass with the correct number of significant digits.", "options": ["The moles line: 0.20M = moles / 0.75 L gives 0.15 mol, so the T-chart returns 8.8 g of NaCl", "The molar mass line: sodium chloride enters this T-chart at 22.99 g/mol, so the flask holds 4.6 g of NaCl", "Nothing is wrong; molarity already counts moles, so 0.20M is 0.20 mol of NaCl whatever volume the flask holds", "The volume line: 0.20M ÷ 0.75 L gives 0.27 mol, so the T-chart returns 16 g of NaCl for that flask"], "answer": "A", "answer_text": "The moles line: 0.20M = moles / 0.75 L gives 0.15 mol, so the T-chart returns 8.8 g of NaCl", "exp": "Substituting gives 0.20M = moles / 0.75 L, so moles = 0.15 mol, and 0.15 mol NaCl × (58.44 g NaCl / 1 mole NaCl) = 8.8 g NaCl to two digits. The printed 11.7 g comes from copying the molarity down as the mole count, 16 g divides by the volume instead of multiplying, and 4.6 g swaps in the atomic mass of sodium for the molar mass of the whole compound."}, {"id": 111, "level": "Advanced", "tag": "Molarity", "stem": "A downstream grab sample carries 12.4 mg of KNO₃ (MM = 101.10 g/mol) dissolved in each 500.0 mL of river water. If there are 1000 mg in a gram and 1000 mL in a liter, what is the molarity of the KNO₃? Use molarity = moles / Liters and report your answer with the correct number of significant digits.", "options": ["0.245M, because the 12.4 mg goes into the T-chart exactly as the field sheet writes it", "1.23 × 10⁻⁴M, since a 500.0 mL sample already sits in the units that molarity = moles / Liters wants", "2.45 × 10⁻⁴M, after the milligrams are taken to grams and the milliliters to liters", "2.45 × 10⁻⁷M, since the sample is 500.0 of the liters that the bottom of molarity = moles / Liters calls for"], "answer": "C", "answer_text": "2.45 × 10⁻⁴M, after the milligrams are taken to grams and the milliliters to liters", "exp": "The sample holds 12.4 mg × (1 g / 1000 mg) = 0.0124 g, and 0.0124 g KNO₃ × (1 mole KNO₃ / 101.10 g KNO₃) = 1.2265 × 10⁻⁴ mol, which over 0.5000 L gives 2.45 × 10⁻⁴M to three digits. The 0.245M value leaves the mass in milligrams, 1.23 × 10⁻⁴M reports the mole count without dividing by the volume, and 2.45 × 10⁻⁷M divides by 500.0 L instead of 0.5000 L."}, {"id": 112, "level": "Advanced", "tag": "Molarity", "stem": "The prep sheet for a flask of 0.0500M Na₂CO₃ (MM = 105.99 g/mol) records that 1.06 g of solid was used and that the flask was then filled to its mark. Substitute into molarity = moles / Liters to find the volume of solution in the flask, then find what volume of that solution carries 0.00250 mol of Na₂CO₃. There are 1000 mL in a liter. Report both answers with the correct number of significant digits.", "options": ["The flask holds 5.00 L of solution, and 250. mL of it carries 0.00250 mol, since a bigger flask is what a molarity that small demands", "The flask holds 0.200 L of solution, and 50.0 mL of it carries 0.00250 mol, since 0.0500M = 0.00250 mol / Liters gives 0.0500 L", "The flask holds 21.2 L of solution, and 53.0 mL of it carries 0.00250 mol, since the grams drop straight into molarity = moles / Liters", "The flask holds 0.200 L of solution, and 125 mL of it carries 0.00250 mol, since the volume needed scales with the molar mass"], "answer": "B", "answer_text": "The flask holds 0.200 L of solution, and 50.0 mL of it carries 0.00250 mol, since 0.0500M = 0.00250 mol / Liters gives 0.0500 L", "exp": "The solid is 1.06 g Na₂CO₃ × (1 mole Na₂CO₃ / 105.99 g Na₂CO₃) = 0.0100 mol, so 0.0500M = 0.0100 mol / Liters gives 0.200 L, and 0.0500M = 0.00250 mol / Liters gives 0.0500 L, or 50.0 mL. The 21.2 L figure divides grams by molarity without ever converting to moles, 5.00 L inverts the substitution, and 125 mL drags the molar mass into a step that only needs moles and molarity."}, {"id": 113, "level": "Advanced", "tag": "Molarity", "stem": "Two batches of NaCl solution are poured into one tank and mixed: 0.750 L of 0.0400M NaCl and 0.250 L of 0.0200M NaCl, giving 1.000 L of solution. Using molarity = moles / Liters, what is the molarity of NaCl in the tank? Report your answer with the correct number of significant digits.", "options": ["0.0350M, from 0.0300 mol plus 0.00500 mol of NaCl sitting in the 1.000 L of solution the tank holds", "0.0250M, since the smaller batch is the stronger of the two once the pair of them share one tank", "0.0300M, the average of the two labels, since mixing two solutions of one salt averages their molarity", "0.0600M, because the two molarities add together once the batches share one tank"], "answer": "A", "answer_text": "0.0350M, from 0.0300 mol plus 0.00500 mol of NaCl sitting in the 1.000 L of solution the tank holds", "exp": "Substituting batch by batch gives 0.0400M = moles / 0.750 L → 0.0300 mol and 0.0200M = moles / 0.250 L → 0.00500 mol, so the tank holds 0.0350 mol in 1.000 L, or 0.0350M. The 0.0300M value averages the two labels and ignores that three times as much of the stronger batch went in, 0.0600M adds molarities as though they were moles, and 0.0250M attaches each label to the wrong volume."}, {"id": 114, "level": "Advanced", "tag": "Molarity", "stem": "A recipe calls for 100.0 mL of 0.250M KNO₃ (MM = 101.10 g/mol), and the lab scale reads to 0.01 g. The technician weighs 2.60 g by mistake and fills to the 100.0 mL mark anyway. Using molarity = moles / Liters and 1000 mL in a liter, what mass was called for, and what molarity was actually made? Report both with the correct number of significant digits.", "options": ["25.3 g was called for, and the 2.60 g actually weighed leaves the flask at only 0.0257M, a tenth of what the recipe wanted", "2.53 g was called for, but the flask is still 0.250M, because the mark on a volumetric flask fixes the molarity", "2.53 g was called for, and the 2.60 g actually weighed makes the flask 0.243M, since extra solid raises the molar mass", "2.53 g was called for, and the 2.60 g actually weighed makes the flask 0.257M, since molarity is set by what is really in it"], "answer": "D", "answer_text": "2.53 g was called for, and the 2.60 g actually weighed makes the flask 0.257M, since molarity is set by what is really in it", "exp": "The recipe needs 0.250M = moles / 0.1000 L → 0.0250 mol, and 0.0250 mol KNO₃ × (101.10 g KNO₃ / 1 mole KNO₃) = 2.53 g; the 2.60 g actually used is 2.60 g ÷ 101.10 g/mol = 0.025717 mol, which over 0.1000 L is 0.257M. Holding the flask at 0.250M ignores that molarity is set by what is in the flask, not by the label, 25.3 g multiplies by 0.250 mol instead of 0.0250 mol, and 0.243M moves the error to the molar mass, which the extra solid cannot change."}, {"id": 115, "level": "Advanced", "tag": "Molarity", "stem": "Four bottles on the prep bench each carry a label and the recipe used to make them. Using molarity = moles / Liters and 1000 mL in a liter, which bottle's label matches its own recipe?", "options": ["0.0500M KNO₃ (MM = 101.10 g/mol), made from 0.100 mol of KNO₃ taken to 2.00 L of solution", "0.0320M Na₂CO₃ (MM = 105.99 g/mol), made from 0.0800 mol of Na₂CO₃ taken to 0.400 L of solution", "0.500M NaCl (MM = 58.44 g/mol), made from 5.85 g of NaCl taken to 500.0 mL of solution", "0.0250M CaCl₂ (MM = 110.98 g/mol), made from 2.78 g of CaCl₂ taken to 250.0 mL of solution"], "answer": "A", "answer_text": "0.0500M KNO₃ (MM = 101.10 g/mol), made from 0.100 mol of KNO₃ taken to 2.00 L of solution", "exp": "For the potassium nitrate bottle, molarity = 0.100 mol / 2.00 L = 0.0500M, which is exactly what the label says. The NaCl bottle is really 5.85 g ÷ 58.44 g/mol = 0.100 mol in 0.5000 L, or 0.200M rather than 0.500M; the CaCl₂ bottle is 2.78 g ÷ 110.98 g/mol = 0.0250 mol in 0.2500 L, or 0.100M rather than 0.0250M; and the Na₂CO₃ bottle is 0.0800 mol / 0.400 L = 0.200M, the 0.0320M label coming from multiplying the 0.0800 mol by the 0.400 L instead of dividing by it."}, {"id": 116, "level": "Advanced", "tag": "Dilution", "stem": "A 0.400M CuSO₄ stock (MM = 159.60 g/mol) is diluted by taking 20.0 mL of it to a final volume of 200.0 mL of solution. A 25.0 mL portion is then poured out of the diluted flask. Using M(i)V(i) = M(f)V(f), then molarity = moles / Liters with 1000 mL in a liter, how many grams of CuSO₄ are in that portion? Report your answer with the correct number of significant digits.", "options": ["1.28 g, which is the CuSO₄ carried by the whole 200.0 mL of diluted solution", "1.60 g, since pouring a portion out of the flask hands you liquid at the stock molarity", "160. g, since the 25.0 mL poured out is the volume that molarity = moles / Liters asks for", "0.160 g, from 0.0400M in the diluted flask acting on the 0.0250 L of the portion"], "answer": "D", "answer_text": "0.160 g, from 0.0400M in the diluted flask acting on the 0.0250 L of the portion", "exp": "The dilution gives (0.400M)(20.0 mL) = M(f)(200.0 mL), so M(f) = 0.0400M, and 0.0400M = moles / 0.0250 L returns 0.00100 mol, which is 0.00100 mol CuSO₄ × (159.60 g CuSO₄ / 1 mole CuSO₄) = 0.160 g. The 1.28 g value is the whole flask rather than the portion, 1.60 g uses the undiluted 0.400M, and 160. g leaves the portion in milliliters where molarity = moles / Liters needs liters."}, {"id": 117, "level": "Advanced", "tag": "Dilution", "stem": "In a two-step dilution you transfer 5.00 mL of 1.00M stock into a flask and add water to the 100.0 mL mark, then transfer 10.0 mL of that flask into a second flask and again add water, this time to the 50.0 mL mark. Using M(i)V(i) = M(f)V(f), what is the molarity in the second flask, and how much water was added in the second step? Report both with the correct number of significant digits.", "options": ["0.0500M, with 40.0 mL of water added, because moving solution from one flask into another cannot change its molarity", "0.00500M, with 45.0 mL of water added, since the two transfers multiply out to a 200-fold dilution of the stock", "0.0100M, with 50.0 mL of water added in the second step, since the flask is filled to the 50.0 mL mark with water", "0.0100M, with 40.0 mL of water added in the second step, since the transferred 10.0 mL is solution rather than water"], "answer": "D", "answer_text": "0.0100M, with 40.0 mL of water added in the second step, since the transferred 10.0 mL is solution rather than water", "exp": "The first step gives (1.00M)(5.00 mL) = M(f)(100.0 mL) → 0.0500M, the second gives (0.0500M)(10.0 mL) = M(f)(50.0 mL) → 0.0100M, and the water added in that second step is 50.0 mL − 10.0 mL = 40.0 mL. Reporting 50.0 mL of water counts the transferred solution as water, 0.0500M stops after the first flask, and 0.00500M uses a 200-fold factor when the two steps are 20-fold then 5-fold, or 100-fold in all."}, {"id": 118, "level": "Advanced", "tag": "Dilution", "stem": "A printed answer key reads: “Dilute 100.0 mL of 10.0M NH₄NO₃ down to 1.00M. M(i)V(i) = M(f)V(f), so (10.0M)(100.0 mL) = (1.00M)(V(f)) and V(f) = 0.001 mL of water.” Using M(i)V(i) = M(f)V(f), what should the key say? Report volumes with the correct number of significant digits.", "options": ["The 0.001 in the key is right and only the unit is off; it is 0.001 L, so 1.00 mL of water finishes the dilution", "V(f) is 1.00 × 10³ mL of solution, so 9.0 × 10² mL of water must be added to the 100.0 mL of stock", "V(f) is 10.0 mL of solution, so 90.0 mL of water must be boiled off before the flask reaches 1.00M", "V(f) is 1.00 × 10³ mL of solution, and that is also the water added, since the stock is already sitting in the flask"], "answer": "B", "answer_text": "V(f) is 1.00 × 10³ mL of solution, so 9.0 × 10² mL of water must be added to the 100.0 mL of stock", "exp": "Solving (10.0M)(100.0 mL) = (1.00M)(V(f)) gives V(f) = 1.00 × 10³ mL of solution, and since 100.0 mL of stock is already in the flask, the water added is 1.00 × 10³ mL − 100.0 mL = 9.0 × 10² mL. Calling 1.00 × 10³ mL the water added confuses the final volume of solution with the water poured in, 10.0 mL inverts the equation, and reading the printed figure as 0.001 L still leaves a flask far too concentrated to be 1.00M."}, {"id": 119, "level": "Advanced", "tag": "Dilution", "stem": "You need 500.0 mL of 0.0200M AgNO₃ for the spot-test tray and the shelf holds 0.500M AgNO₃ stock. Using M(i)V(i) = M(f)V(f), which recipe delivers exactly what you need?", "options": ["Measure 20.0 mL of the stock into a flask and add water to the 500.0 mL mark, since 0.500M down to 0.0200M is a 25-fold dilution", "Measure 25.0 mL of the stock into a flask and add water to the 250.0 mL mark, since only the ratio of the two volumes matters here", "Measure 20.0 mL of the stock into a flask and add 500.0 mL of water, since the water added sets the final volume", "Measure 10.0 mL of the stock into a flask and add water to the 500.0 mL mark, since 0.500M is ten times 0.0200M"], "answer": "A", "answer_text": "Measure 20.0 mL of the stock into a flask and add water to the 500.0 mL mark, since 0.500M down to 0.0200M is a 25-fold dilution", "exp": "Solving (0.500M)V(i) = (0.0200M)(500.0 mL) gives V(i) = 20.0 mL of stock, taken to a final volume of 500.0 mL of solution. Adding 500.0 mL of water to 20.0 mL of stock makes 520.0 mL and lands at 0.0192M, 10.0 mL to the mark gives 0.0100M because the dilution is 25-fold and not ten-fold, and 25.0 mL to 250.0 mL gives 0.0500M and only half the volume the tray needs."}, {"id": 120, "level": "Advanced", "tag": "Dilution", "stem": "A 0.750 L batch of NaCl solution (MM = 58.44 g/mol) was made from 4.68 g of NaCl, and it must be brought down to 0.0400M. Using molarity = moles / Liters and then M(i)V(i) = M(f)V(f), what volume of water must be added? Carry the starting molarity unrounded and report your answer with the correct number of significant digits.", "options": ["1.25 L of water, the gap between the 2.00 L final volume and the 0.750 L already in the batch", "0.281 L of water, from the final molarity times the starting volume divided by the starting molarity", "2.00 L of water, since that is the volume the finished solution has to reach in the end", "2.75 L of water, since the 0.750 L already in the batch must be topped up by the 2.00 L the equation returns"], "answer": "A", "answer_text": "1.25 L of water, the gap between the 2.00 L final volume and the 0.750 L already in the batch", "exp": "The batch is 4.68 g NaCl × (1 mole NaCl / 58.44 g NaCl) = 0.080082 mol, so 0.080082 mol / 0.750 L = 0.106776M, and (0.106776M)(0.750 L) = (0.0400M)V(f) gives V(f) = 2.00 L of solution, leaving 2.00 L − 0.750 L = 1.25 L of water to add. Reporting 2.00 L answers a question about the final volume rather than the water, 2.75 L adds the starting volume on top of a final volume that already includes it, and 0.281 L inverts the equation."}, {"id": 121, "level": "Advanced", "tag": "Dilution", "stem": "An outfall sample reads 0.0300M, far off the top of the meter’s range, and the meter reads cleanly at 0.00120M. What volume of the 0.0300M outfall sample must be taken to the 250.0 mL mark to read 0.00120M? Use M(i)V(i) = M(f)V(f) and report your answer with the correct number of significant digits.", "options": ["240. mL of the sample, leaving room for the 10.0 mL of water the dilution calls for in the flask", "25.0 mL of the sample, since 0.0300M down to 0.00120M is a ten-fold dilution of the outfall water", "10.0 mL of the sample, since 0.0300M down to 0.00120M is a 25-fold dilution of the outfall water", "6.25 × 10³ mL of the sample, since the starting molarity divides into the final one to set the volume"], "answer": "C", "answer_text": "10.0 mL of the sample, since 0.0300M down to 0.00120M is a 25-fold dilution of the outfall water", "exp": "Solving (0.0300M)V(i) = (0.00120M)(250.0 mL) gives V(i) = 10.0 mL of sample, which is then taken to the 250.0 mL mark with water. The 6.25 × 10³ mL value inverts the equation and asks for more sample than the flask could ever hold, 25.0 mL treats the step as ten-fold when 0.0300M ÷ 0.00120M is 25-fold, and 240. mL is the water that goes in around the 10.0 mL of sample rather than the sample itself."}, {"id": 122, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "An unknown solution is tested in four wells against Na₂CO₃, NaCl, Na₂SO₄ and NaNO₃ solution, in that order, and the tray reads PPT, PPT, PPT, NR. Using the general solubility rules, which cation is in the unknown?", "options": ["Potassium, K⁺, since group 1 carbonates, chlorides and sulfates settle out and only the nitrate stays dissolved", "Silver, Ag⁺, since its carbonate, chloride and sulfate are all insoluble while its nitrate stays dissolved", "Magnesium, Mg²⁺, since its carbonate, chloride and sulfate all settle out and only its nitrate stays dissolved", "Calcium, Ca²⁺, since its carbonate, chloride and sulfate are all insoluble while its nitrate stays dissolved"], "answer": "B", "answer_text": "Silver, Ag⁺, since its carbonate, chloride and sulfate are all insoluble while its nitrate stays dissolved", "exp": "Silver fits every well: Ag₂CO₃ is insoluble because carbonate is soluble only with H⁺, group 1 and NH₄⁺, AgCl is insoluble because Ag⁺ is on the halide exception list, Ag₂SO₄ is insoluble because Ag⁺ is on the sulfate exception list, and AgNO₃ is soluble because every nitrate is. Calcium fails the second well, since CaCl₂ is soluble; magnesium fails the second and third, since MgCl₂ and MgSO₄ are both soluble; and potassium fails all four, since every potassium salt in the table is soluble."}, {"id": 123, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "A six-well tray mixes each of Na₂CO₃, Na₂SO₄ and NaNO₃ solution with each of CaCl₂ and KCl solution. Using the general solubility rules, how many wells show PPT, and what are the solids?", "options": ["Four wells: CaCO₃, CaSO₄, K₂CO₃ and K₂SO₄ come down, since only the two nitrate wells on the tray stay dissolved", "One well: only CaCO₃ comes down, since every sulfate listed in the rules table is soluble in water, calcium included", "Two wells: CaCO₃ and CaSO₄ come down, and the other four stay clear, since every potassium salt and every nitrate is soluble", "Three wells: CaCO₃, CaSO₄ and Ca(NO₃)₂ come down, since calcium is insoluble with every one of the three anions on the tray"], "answer": "C", "answer_text": "Two wells: CaCO₃ and CaSO₄ come down, and the other four stay clear, since every potassium salt and every nitrate is soluble", "exp": "Calcium carbonate is insoluble because carbonate is soluble only with H⁺, group 1 and NH₄⁺, and calcium sulfate is insoluble because Ca²⁺ is on the sulfate exception list, so those two wells give PPT; Ca(NO₃)₂ is soluble, and every potassium salt on the tray is soluble, so the other four read NR. Counting three wells adds a calcium nitrate that no nitrate rule allows to precipitate, four wells precipitates potassium salts the first row of the table calls soluble, and one well treats sulfate as having no exceptions at all."}, {"id": 124, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "Your lab partner writes four lines for K₂CO₃ mixed with MgSO₄ under the Science Spiral rule “Soluble compounds will remain as ions.” Which line is right, balanced with the lowest whole-number coefficients?", "options": ["K₂CO₃ + MgSO₄ → 2K⁺ + CO₃²⁻ + MgSO₄, with MgSO₄ circled as the precipitate left over from the mixing of the two", "K₂CO₃ + MgSO₄ → 2K⁺ + SO₄²⁻ + Mg²⁺ + CO₃²⁻, with nothing circled because both of the products stay dissolved", "K₂CO₃ + MgSO₄ → K₂SO₄ + MgCO₃, with MgCO₃ circled as the precipitate, since a balanced line always pairs each cation with its new anion", "K₂CO₃ + MgSO₄ → 2K⁺ + SO₄²⁻ + MgCO₃, with MgCO₃ circled as the precipitate and the soluble K₂SO₄ left as ions"], "answer": "D", "answer_text": "K₂CO₃ + MgSO₄ → 2K⁺ + SO₄²⁻ + MgCO₃, with MgCO₃ circled as the precipitate and the soluble K₂SO₄ left as ions", "exp": "Trading partners gives K₂SO₄, which is soluble and so is written as 2K⁺ + SO₄²⁻, and MgCO₃, which is insoluble because carbonate is soluble only with H⁺, group 1 and NH₄⁺. The line atom-balances at 2 K, 1 C, 1 Mg, 1 S and 7 O on each side, and it charge-balances too: the reactants are neutral, and 2(+1) + (−2) + 0 on the right is zero as well. Writing K₂SO₄ as a compound ignores the instruction to leave soluble compounds as ions, circling MgSO₄ keeps a soluble reactant as the solid, and leaving all four ions loose denies a precipitate the carbonate rule requires."}, {"id": 125, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "A 0.250 L water sample is treated with excess AgNO₃ solution, and the dried AgCl (MM = 143.32 g/mol) filtered off weighs 0.0430 g. One mole of AgCl carries one mole of chloride. Using molarity = moles / Liters, what was the molarity of dissolved chloride in the sample? Report your answer with the correct number of significant digits.", "options": ["24.7M, since the molar mass of AgCl belongs on top of the T-chart whenever a solid is weighed", "1.72 × 10⁻¹M, since the dried solid divides straight into the 0.250 L of sample it came out of", "1.20 × 10⁻³M, from 3.00 × 10⁻⁴ mol of chloride sitting in 0.250 L of sample", "3.00 × 10⁻⁴M, which is what the filter paper held once the T-chart was run"], "answer": "C", "answer_text": "1.20 × 10⁻³M, from 3.00 × 10⁻⁴ mol of chloride sitting in 0.250 L of sample", "exp": "The solid is 0.0430 g AgCl × (1 mole AgCl / 143.32 g AgCl) = 3.00 × 10⁻⁴ mol, which is also the chloride, so molarity = 3.00 × 10⁻⁴ mol / 0.250 L = 1.20 × 10⁻³M. The 3.00 × 10⁻⁴M value stops at the mole count and never divides by the sample volume, 1.72 × 10⁻¹M skips the molar mass entirely, and 24.7M puts the molar mass in the numerator of the T-chart."}, {"id": 126, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "A lab partner writes: “NH₄Cl solution plus AgNO₃ solution is NR, because every ammonium compound is soluble and every nitrate is soluble, so neither product can be a solid.” Use the general solubility rules to judge the claim.", "options": ["The claim holds: both starting solutions are clear, so the mixture has nothing left in it that can form a solid", "The claim holds: silver is listed as soluble with any anion at all, so nothing here can leave the solution", "The claim fails: trading partners gives NH₄NO₃ and AgCl, and it is the NH₄NO₃ that settles out of the well", "The claim fails: trading partners gives NH₄NO₃ and AgCl, and AgCl is insoluble, so a white solid comes down"], "answer": "D", "answer_text": "The claim fails: trading partners gives NH₄NO₃ and AgCl, and AgCl is insoluble, so a white solid comes down", "exp": "The products are NH₄NO₃ and AgCl, and while the ammonium nitrate is indeed soluble, the halide row puts Ag⁺ among the exceptions, so AgCl is insoluble and the well reads PPT. Naming NH₄NO₃ as the solid contradicts the first row of the table, saying both starting solutions are clear ignores that the partners trade on mixing, and calling silver soluble with any anion is the nitrate rule misapplied to a cation."}, {"id": 127, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "A well holds a sodium salt known to be either Na₂SO₄ or Na₂CO₃, and you may add one reagent to separate portions of it to tell the two apart. Using the general solubility rules, which reagent does the job?", "options": ["KNO₃ solution, which comes down as K₂SO₄ with one of them while potassium carbonate stays dissolved", "MgCl₂ solution, which comes down as MgCO₃ with one of them while magnesium sulfate stays dissolved", "CaCl₂ solution, which comes down as CaCO₃ with one of them while calcium sulfate stays dissolved", "AgNO₃ solution, which comes down as Ag₂CO₃ with one of them while silver sulfate stays dissolved"], "answer": "B", "answer_text": "MgCl₂ solution, which comes down as MgCO₃ with one of them while magnesium sulfate stays dissolved", "exp": "Magnesium sulfate is soluble, since the sulfate exceptions are only Ca²⁺, Sr²⁺, Ba²⁺, Ag⁺, Pb²⁺ and Ra²⁺, while MgCO₃ is insoluble, so MgCl₂ gives PPT with the carbonate and NR with the sulfate. Calcium and silver both fail because CaSO₄ and Ag₂SO₄ are on the sulfate exception list and precipitate along with their carbonates, and KNO₃ fails because every potassium and every nitrate salt in the table is soluble, so both portions stay clear."}, {"id": 128, "level": "Advanced", "tag": "Double Replacement and Precipitates", "stem": "A sodium salt with an unknown anion is tested against AgNO₃, CaCl₂ and MgSO₄ solution, in that order, and the tray reads PPT, PPT, NR. Using the general solubility rules, which salt is it?", "options": ["NaCl, whose silver and calcium salts are insoluble while magnesium chloride stays dissolved", "NaNO₃, whose silver and calcium salts are insoluble while magnesium nitrate stays dissolved", "Na₃PO₄, whose silver and calcium salts are insoluble while magnesium phosphate stays dissolved", "Na₂SO₄, whose silver and calcium salts are insoluble while magnesium sulfate stays dissolved"], "answer": "D", "answer_text": "Na₂SO₄, whose silver and calcium salts are insoluble while magnesium sulfate stays dissolved", "exp": "Sodium sulfate gives Ag₂SO₄ and CaSO₄, both on the sulfate exception list and both PPT, and with MgSO₄ there is no partner to trade, so the third well reads NR. Sodium chloride fails the second well because CaCl₂ is soluble, sodium phosphate fails the third because Mg₃(PO₄)₂ is insoluble under the phosphate rule, and sodium nitrate fails the first because every nitrate is soluble."}, {"id": 129, "level": "Advanced", "tag": "Solubility Curves", "stem": "Your KNO₃ solubility curve is built from these crystallization points: 40. g per 100. mL at 25 °C, 80. g per 100. mL at 50 °C, 120. g per 100. mL at 65 °C and 160. g per 100. mL at 75 °C. A beaker holds 160. g of KNO₃ dissolved in 200. mL of water at 75 °C, and a seed crystal is dropped in as the beaker cools slowly. At what temperature do crystals first appear?", "options": ["75 °C, because a beaker that was made up at 75 °C is already saturated at that temperature", "50 °C, the temperature at which the curve allows 80. g per 100. mL of water", "25 °C, the temperature at which the curve allows 40. g per 100. mL of water", "65 °C, the temperature at which the curve allows 120. g per 100. mL of water"], "answer": "B", "answer_text": "50 °C, the temperature at which the curve allows 80. g per 100. mL of water", "exp": "The beaker carries 160. g in 200. mL, which is 80. g per 100. mL, so it is well below the 160. g per 100. mL the curve allows at 75 °C and stays unsaturated until cooling brings the capacity down to 80. g per 100. mL at 50 °C. Choosing 75 °C assumes the beaker was saturated when it was made, and 65 °C and 25 °C read the curve at 120. g and 40. g per 100. mL, neither of which is the 80. g per 100. mL this beaker actually holds."}, {"id": 130, "level": "Advanced", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of CuSO₄ per 100. mL of water: 15 g at 0 °C, 20. g at 20 °C, 30. g at 40 °C, 40. g at 60 °C, 55 g at 80 °C and 79 g at 100 °C. A flask holds 200. mL of water saturated with CuSO₄ at 80 °C. It must be cooled to 20 °C without any solid crystallizing, so water is added as it cools. What volume of water must be added? Report your answer with the correct number of significant digits.", "options": ["5.5 × 10² mL of water must be added, since that is what the dissolved CuSO₄ needs at 20 °C to stay in solution", "No water at all is needed, since CuSO₄ that is already dissolved cannot be pushed back out of solution by cooling alone", "2.0 × 10² mL of water must be added, doubling the water the flask already holds to match the drop in temperature", "3.5 × 10² mL of water must be added, bringing the total up to the 5.5 × 10² mL that 110 g of CuSO₄ needs at 20 °C"], "answer": "D", "answer_text": "3.5 × 10² mL of water must be added, bringing the total up to the 5.5 × 10² mL that 110 g of CuSO₄ needs at 20 °C", "exp": "At 80 °C the flask holds 55 g per 100. mL × 2.00 = 110 g of CuSO₄, and at 20 °C each 100. mL of water holds only 20. g, so 110 g needs 550 mL of water in all, of which 200. mL is already there, leaving 3.5 × 10² mL to add. Reporting 5.5 × 10² mL gives the total water rather than the water added, 2.0 × 10² mL doubles the volume without checking the 20 °C capacity, and saying no water is needed contradicts the table, which shows capacity falling as the flask cools."}, {"id": 131, "level": "Advanced", "tag": "Solubility Curves", "stem": "On the class solubility graph the line for Compound W rises steeply and is the highest of the four at 50 °C, while the line for Compound Y is nearly flat across the whole temperature range. A student writes: “Heating a saturated solution of Y from 20 °C to 50 °C will let a great deal more Y dissolve.” Judge the claim using the graph.", "options": ["The claim fails: a nearly flat line means Y's capacity barely changes with temperature, so very little extra dissolves", "The claim holds: the flat line shows Y is already saturated, and any saturated solution takes up much more solute as it warms", "The claim fails: a flat line marks Y as a gas, so heating drives Y out of solution instead of dissolving more of it", "The claim holds: heating lets a great deal more of any solid dissolve, whatever shape its line takes on the graph"], "answer": "A", "answer_text": "The claim fails: a nearly flat line means Y's capacity barely changes with temperature, so very little extra dissolves", "exp": "A solubility curve plots how much can dissolve at each temperature, and a nearly flat line means that capacity is almost the same at 50 °C as at 20 °C, so heating Y adds very little; it is W, with the steep line, that gains a great deal. Saying every solid gains a great deal ignores the shape of the line the question points to, calling Y a gas confuses a flat line with the falling line that marks a gas, and a saturated solution does not take up more solute unless its capacity itself rises."}, {"id": 132, "level": "Advanced", "tag": "Solubility Curves", "stem": "Your Day 9 table gives, per 100. mL of water at 0 °C, 20 °C, 40 °C, 60 °C, 80 °C and 100 °C, NH₃ at 90. g, 55 g, 35 g, 23 g, 14 g and 7 g, and NH₄Cl at 30. g, 38 g, 45 g, 55 g, 65 g and 78 g. Two flasks, each holding 100. mL of water saturated at 40 °C — one with NH₃, one with NH₄Cl — are warmed to 80 °C. How does the amount each can hold change?", "options": ["Both can hold less per 100. mL, NH₃ by 21 g and NH₄Cl by 20. g, since heating drives dissolved solute out of any flask", "NH₃ can hold 14 g less per 100. mL, and NH₄Cl 65 g more, which are the two amounts the Day 9 table itself lists at 80 °C", "NH₃ can hold 21 g more per 100. mL, and NH₄Cl 20. g more, since warming raises every solubility printed in the Day 9 table", "NH₃ can hold 21 g less per 100. mL, while NH₄Cl can hold 20. g more, since a gas and a solid move opposite ways with temperature"], "answer": "D", "answer_text": "NH₃ can hold 21 g less per 100. mL, while NH₄Cl can hold 20. g more, since a gas and a solid move opposite ways with temperature", "exp": "Ammonia falls from 35 g to 14 g per 100. mL, a drop of 21 g, while ammonium chloride rises from 45 g to 65 g, a gain of 20. g, which is the ordinary split between a gas and a solid as temperature rises. Reading 14 g and 65 g gives the capacities at 80 °C rather than the changes, and both of the options that move the two substances in the same direction ignore that the NH₃ column falls while the NH₄Cl column rises."}, {"id": 133, "level": "Advanced", "tag": "Solubility Curves", "stem": "Your Day 9 table gives the solubility of NH₄Cl per 100. mL of water: 30. g at 0 °C, 38 g at 20 °C, 45 g at 40 °C, 55 g at 60 °C, 65 g at 80 °C and 78 g at 100 °C. A flask holding 200. mL of water saturated with NH₄Cl at 80 °C is cooled to 20 °C with a seed crystal in it. About how much NH₄Cl crystallizes out? Report your answer with the correct number of significant digits.", "options": ["27 g, the gap the table shows between 80 °C and 20 °C for a single 100. mL of water", "76 g, the NH₄Cl that 200. mL of water still holds once the flask has reached 20 °C", "54 g, the gap between what 200. mL of water holds at 80 °C and what it holds at 20 °C", "1.3 × 10² g, since cooled water gives up every gram of the NH₄Cl it took in at 80 °C"], "answer": "C", "answer_text": "54 g, the gap between what 200. mL of water holds at 80 °C and what it holds at 20 °C", "exp": "Saturated at 80 °C the flask holds 65 g per 100. mL × 2.00 = 130 g of NH₄Cl, and at 20 °C the same 200. mL can hold only 38 g per 100. mL × 2.00 = 76 g, so 130 g − 76 g = 54 g crystallizes out. The 27 g figure subtracts the two table rows without scaling them to 200. mL of water, 76 g reports what stays dissolved rather than what comes out, and 1.3 × 10² g assumes the cooled water holds nothing at all."}, {"id": 134, "level": "Advanced", "tag": "Solubility Curves", "stem": "Your Day 9 table gives, per 100. mL of water at 0 °C, 20 °C, 40 °C, 60 °C, 80 °C and 100 °C: CuSO₄ at 15 g, 20. g, 30. g, 40. g, 55 g and 79 g; NH₃ at 90. g, 55 g, 35 g, 23 g, 14 g and 7 g; NH₄Cl at 30. g, 38 g, 45 g, 55 g, 65 g and 78 g. Which statement does the table support?", "options": ["NH₃ is the most soluble of the three at 100 °C, holding 7 g per 100. mL of water there, more than either of the two solids manages that hot", "A solution in which all 60. g of NH₄Cl per 100. mL of water has dissolved at 60 °C is supersaturated, since the table allows only 55 g", "A solution holding 25 g of CuSO₄ per 100. mL of water at 30 °C is unsaturated, since the table puts CuSO₄ at 30. g per 100. mL of water at 30 °C", "CuSO₄ and NH₃ hold the same amount per 100. mL of water at about 32 °C, where the falling gas column crosses the rising CuSO₄ column"], "answer": "B", "answer_text": "A solution in which all 60. g of NH₄Cl per 100. mL of water has dissolved at 60 °C is supersaturated, since the table allows only 55 g", "exp": "The table allows only 55 g of NH₄Cl per 100. mL of water at 60 °C, so a solution in which all 60. g has gone into solution at that temperature is carrying more than its capacity and is supersaturated. At 100 °C ammonia is the least soluble of the three at 7 g rather than the most, the 30. g CuSO₄ figure belongs to 40 °C so a 30 °C solution sits at about 25 g and is saturated rather than unsaturated, and the columns that meet near 32 °C are NH₃ and NH₄Cl, not NH₃ and CuSO₄."}, {"id": 135, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "In the simulated investigation a downstream sample is too concentrated for the meter, so 10.0 mL of it is taken to a final volume of 100.0 mL of solution, and the diluted solution reads 4.0 × 10⁻⁶M in Al³⁺. Using M(i)V(i) = M(f)V(f), what was the sample's Al³⁺ molarity, and how does it stand against the 3.0 × 10⁻⁶ moles/liter toxicity threshold?", "options": ["4.0 × 10⁻⁷M, which sits comfortably below the threshold once the dilution is accounted for", "4.0 × 10⁻⁴M, roughly 130 times the threshold, since the flask was filled to 1.00 × 10³ mL", "4.0 × 10⁻⁵M, roughly 13 times the threshold, since the ten-fold dilution has to be undone", "4.0 × 10⁻⁶M, since diluting a sample in the lab does not change what the river itself is carrying"], "answer": "C", "answer_text": "4.0 × 10⁻⁵M, roughly 13 times the threshold, since the ten-fold dilution has to be undone", "exp": "Solving M(i)(10.0 mL) = (4.0 × 10⁻⁶M)(100.0 mL) gives M(i) = 4.0 × 10⁻⁵M, and 4.0 × 10⁻⁵ ÷ 3.0 × 10⁻⁶ is about 13 times the threshold. The 4.0 × 10⁻⁷M value divides by the ten-fold dilution instead of multiplying, 4.0 × 10⁻⁶M reports the diluted flask rather than the river, and 4.0 × 10⁻⁴M uses a 1.00 × 10³ mL final volume that the stem never gives."}, {"id": 136, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "In the simulated investigation your downstream sample gives 4.0 mg/L of nitrate against a 10. mg/L maximum, 0.040 mg/L of phosphate against a 0.10 mg/L maximum, and dissolved aluminum at 1.0 × 10⁻⁵M against a toxicity threshold of 3.0 × 10⁻⁶ moles/liter. The farms and the aluminum smelting plant are both on the suspect map. Which suspect does this evidence support, and what settles it?", "options": ["The farms, since 4.0 mg/L of nitrate is a far bigger number than 1.0 × 10⁻⁵M of aluminum and the bigger number does the harm", "The smelting plant, since the aluminum sits at about 3.3 times its threshold while nitrate and phosphate sit at 0.40 of theirs", "Neither suspect, since a reading under a maximum and a reading over a threshold cancel each other out and leave the river inside its limits", "The farms, since any nitrate and phosphate measurable in a river is by itself proof that field runoff caused the kill"], "answer": "B", "answer_text": "The smelting plant, since the aluminum sits at about 3.3 times its threshold while nitrate and phosphate sit at 0.40 of theirs", "exp": "Dividing each reading by its own limit settles it: 4.0 ÷ 10. and 0.040 ÷ 0.10 both give 0.40, so nitrate and phosphate are under their maxima, while 1.0 × 10⁻⁵ ÷ 3.0 × 10⁻⁶ is about 3.3, putting aluminum over its threshold. Treating any measurable nitrate as proof ignores the maximum the class was given, comparing 4.0 mg/L with 1.0 × 10⁻⁵M sets two different units side by side, and readings under a limit do not cancel a reading over one."}, {"id": 137, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "Which account of the real 1999 White River fish kill is consistent with the record?", "options": ["The wastewater came from an aluminum smelter upstream of Anderson, which is why dissolved aluminum was the contaminant named in the criminal case that followed the 1999 kill", "Guide Corporation piped its wastewater straight into the White River, bypassing the Anderson treatment plant altogether, and about 4.6 million fish died along roughly 40 miles of river", "Guide Corporation's Anderson plant sent about 1.6 million gallons of contaminated wastewater to the Anderson sewage treatment plant, which in turn passed it on to the White River", "Carbon disulfide was poured into the river deliberately as a cleaning agent, and the Anderson treatment plant filtered out the dimethyldithiocarbamate before any of it reached the water"], "answer": "C", "answer_text": "Guide Corporation's Anderson plant sent about 1.6 million gallons of contaminated wastewater to the Anderson sewage treatment plant, which in turn passed it on to the White River", "exp": "The record has Guide Corporation's Anderson plant sending roughly 1.6 million gallons of untested, contaminated wastewater to the Anderson sewage treatment plant, which then passed it to the river, where an estimated 4.6 million fish died along about 40 miles. A direct pipe to the river is exactly what did not happen, the smelter and its aluminum belong to the classroom simulation rather than to the real case, and carbon disulfide was a breakdown product of the treatment chemical rather than something poured in on purpose."}, {"id": 138, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "Which statement about the material carried by the 1999 White River wastewater is supported by the record?", "options": ["HMP-2000 was the fuel oil spilled from a boat, and the dimethyldithiocarbamate in it separated out as a floating sheen on the river", "HMP-2000 was a form of aluminum sulfate used as a flocculant, which is why dissolved aluminum turned up in the river", "HMP-2000 was a waste solvent tipped out of drums, and its active ingredient, carbon disulfide, broke down into dimethyldithiocarbamate", "HMP-2000 was a treatment product whose active ingredient is a dimethyldithiocarbamate, with carbon disulfide as a breakdown product"], "answer": "D", "answer_text": "HMP-2000 was a treatment product whose active ingredient is a dimethyldithiocarbamate, with carbon disulfide as a breakdown product", "exp": "HMP-2000 was a treatment product, not a dumped pollutant, its active ingredient is a dimethyldithiocarbamate, and carbon disulfide showed up as a breakdown product of that ingredient. Reversing the two chemicals puts the breakdown product in the role of the active ingredient, the aluminum sulfate flocculant belongs to the classroom simulation's suspect list, and the boat fuel oil is a suspect in that simulation rather than a description of HMP-2000."}, {"id": 139, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "In the simulated investigation a lab tech's report reads: “The 0.050 L river sample gave 6.1 × 10⁻⁵ g of AlPO₄ (MM = 121.95 g/mol). Moles = 6.1 × 10⁻⁵ × 121.95 = 7.4 × 10⁻³ mol, so molarity = 7.4 × 10⁻³ mol / 0.050 L = 0.15M, far above the 3.0 × 10⁻⁶ moles/liter threshold.” One mole of AlPO₄ carries one mole of Al³⁺. What is wrong, and what is the right conclusion?", "options": ["The threshold line is wrong: the sample is really 1.0 × 10⁻⁵M, which sits below 3.0 × 10⁻⁶ moles/liter and clears the aluminum", "The volume line is wrong: the sample should enter as 50. L, giving 1.5 × 10⁻⁴M, which is below the threshold", "Nothing is wrong; 0.15M is what the T-chart returns, and it confirms that aluminum is above the threshold", "The T-chart is inverted: 6.1 × 10⁻⁵ g ÷ 121.95 g/mol = 5.0 × 10⁻⁷ mol, giving 1.0 × 10⁻⁵M, still above the threshold"], "answer": "D", "answer_text": "The T-chart is inverted: 6.1 × 10⁻⁵ g ÷ 121.95 g/mol = 5.0 × 10⁻⁷ mol, giving 1.0 × 10⁻⁵M, still above the threshold", "exp": "Grams go to moles by dividing by the molar mass, so 6.1 × 10⁻⁵ g AlPO₄ × (1 mole AlPO₄ / 121.95 g AlPO₄) = 5.0 × 10⁻⁷ mol, and 5.0 × 10⁻⁷ mol / 0.050 L = 1.0 × 10⁻⁵M, which is still above 3.0 × 10⁻⁶ moles/liter. Keeping 0.15M accepts a multiplication where a division belongs, rewriting the volume as 50. L moves the error to a line that was correct, and calling 1.0 × 10⁻⁵M smaller than 3.0 × 10⁻⁶ misreads the exponents."}, {"id": 140, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "In the simulated investigation three stations are sampled along the 40-mile stretch. To bring each into the meter’s range the Anderson sample is diluted by taking 1.00 mL to the 100.0 mL mark, the midpoint sample by taking 5.00 mL to the 100.0 mL mark, and the Indianapolis sample by taking 10.0 mL to the 100.0 mL mark, and all three diluted solutions then read the same 5.0 × 10⁻⁷M in Al³⁺. Using M(i)V(i) = M(f)V(f), what were the three samples carrying, and what does that say about the source?", "options": ["5.0 × 10⁻⁹M, 2.5 × 10⁻⁸M and 5.0 × 10⁻⁸M, so the aluminum climbs steadily toward the Indianapolis end of the stretch", "5.0 × 10⁻⁵M, 1.0 × 10⁻⁵M and 5.0 × 10⁻⁶M, so the aluminum is highest at the Anderson end and the source lies upstream", "All three carry 5.0 × 10⁻⁷M, so the aluminum is spread evenly and no one stretch of the river can be the source", "5.0 × 10⁻⁵M, 1.0 × 10⁻⁵M and 5.0 × 10⁻⁶M, so the source is at the Indianapolis end, the station that needed the least dilution"], "answer": "B", "answer_text": "5.0 × 10⁻⁵M, 1.0 × 10⁻⁵M and 5.0 × 10⁻⁶M, so the aluminum is highest at the Anderson end and the source lies upstream", "exp": "Each dilution factor is the final volume over the volume taken: 100.0 mL ÷ 1.00 mL = 100 at Anderson, 100.0 mL ÷ 5.00 mL = 20 at the midpoint and 100.0 mL ÷ 10.0 mL = 10 at Indianapolis, so undoing them gives 5.0 × 10⁻⁷M × 100 = 5.0 × 10⁻⁵M, × 20 = 1.0 × 10⁻⁵M and × 10 = 5.0 × 10⁻⁶M — all three above the 3.0 × 10⁻⁶ moles/liter threshold, with the north end ten times the south end and the source upstream. Saying all three are 5.0 × 10⁻⁷M reports the diluted flasks instead of the samples, the 5.0 × 10⁻⁹M set divides by the factors instead of multiplying, and pointing at Indianapolis reads the smallest concentration as the strongest."}, {"id": 141, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "The coal power plant is a suspect for thermal pollution in the simulated investigation. Your Day 9 data give oxygen saturation as 10.1 mg per 1 L of water at 14 °C, and the Indianapolis daily highs for December 5–16 are −7, −1, −6, 4, 6, −1, 1, −1, 3, 11, 11 and −6 °C. What does that evidence support?", "options": ["Nothing follows, because oxygen enters river water only through photosynthesis, which stops altogether during December", "Every daily high is under 14 °C, so the water could hold at least 10.1 mg of O₂ per liter and low oxygen is ruled out", "The unusually warm December air pushed the river above 14 °C, dropping it below 10.1 mg of O₂ per liter and asphyxiating the fish", "Cold water holds less oxygen than warm water, so the December cold is itself what drove the dissolved oxygen down"], "answer": "B", "answer_text": "Every daily high is under 14 °C, so the water could hold at least 10.1 mg of O₂ per liter and low oxygen is ruled out", "exp": "Water holds more dissolved gas as it gets colder, so a river no warmer than the 11 °C high could hold at least the 10.1 mg per 1 L that the data give for 14 °C, which takes thermal pollution and low oxygen off the list and sends the investigation back to the aluminum. Saying the air pushed the river past 14 °C contradicts every reading in the list, cold water holding less oxygen reverses the relationship, and oxygen in fact enters mainly by dissolving from the air at the surface, with photosynthesis second."}, {"id": 142, "level": "Advanced", "tag": "Case File: An Aquatic Apocalypse", "stem": "A partner writes: “The Anderson plant treats its water with an aluminum sulfate flocculant, but flocculation would have pulled the dissolved aluminum straight back out again, so the plant cannot be the source in our investigation.” Judge the claim.", "options": ["The claim holds: aluminum sulfate is insoluble, so it settles and carries the dissolved aluminum down with it", "The claim holds: a flocculant strips every dissolved ion out, so aluminum downstream must come from elsewhere", "The claim fails: flocculation clumps suspended particles so they settle, while dissolved Al³⁺ stays in solution", "The claim fails, but only because flocculants act on nitrates and phosphates and never touch a dissolved metal"], "answer": "C", "answer_text": "The claim fails: flocculation clumps suspended particles so they settle, while dissolved Al³⁺ stays in solution", "exp": "Flocculation works on suspended particles, clumping them until they settle, and it leaves ions that are genuinely dissolved where they are — which is why a sample can still read 1.0 × 10⁻⁵M in Al³⁺. Saying a flocculant strips every dissolved ion overstates what settling can do, restricting flocculants to nitrates and phosphates invents a rule the unit never gives, and aluminum sulfate is a soluble salt rather than something that settles out on its own."}, {"id": 143, "level": "Advanced", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Your KNO₃ curve gives 40. g per 100. mL of water at 25 °C and 120. g per 100. mL at 65 °C. A flask holding 250. mL of water is saturated with KNO₃ at 65 °C, then left to cool undisturbed to 25 °C with no seed surface, and no crystals appear. How is the flask described, and by how much? Report any mass with the correct number of significant digits.", "options": ["Unsaturated, because cooling a flask raises the amount of solute the water sitting in it is able to hold, leaving room to spare", "Supersaturated by 8.0 × 10¹ g, since the gap between the 120. g and 40. g readings printed on the curve is what the flask carries", "Saturated, holding exactly the 1.0 × 10² g the curve allows at 25 °C, the rest of it having already settled quietly to the bottom", "Supersaturated, carrying about 2.0 × 10² g more than the 1.0 × 10² g the curve allows at 25 °C, since nothing was there to nucleate on"], "answer": "D", "answer_text": "Supersaturated, carrying about 2.0 × 10² g more than the 1.0 × 10² g the curve allows at 25 °C, since nothing was there to nucleate on", "exp": "The flask dissolved 120. g per 100. mL × 2.50 = 300. g at 65 °C, and at 25 °C that water can hold only 40. g per 100. mL × 2.50 = 1.0 × 10² g, so cooling undisturbed with nothing to nucleate on leaves it supersaturated by 300. g − 1.0 × 10² g = 2.0 × 10² g. Calling it saturated at 1.0 × 10² g assumes crystals formed when the stem says none did, the 8.0 × 10¹ g figure uses the per-100. mL gap for a flask holding 250. mL, and cooling lowers rather than raises how much KNO₃ the water can hold."}, {"id": 144, "level": "Advanced", "tag": "Saturated, Unsaturated, and Supersaturated", "stem": "Your Day 9 table gives the solubility of CuSO₄ per 100. mL of water: 15 g at 0 °C, 20. g at 20 °C, 30. g at 40 °C, 40. g at 60 °C, 55 g at 80 °C and 79 g at 100 °C. Beaker 1 has 60. g of CuSO₄ stirred into 100. mL of water at 80 °C; Beaker 2 has 60. g stirred into 200. mL of water at 40 °C. Describe each beaker.", "options": ["Beaker 1 is supersaturated at 60. g against a 55 g capacity, and Beaker 2 is unsaturated with room to spare", "Beaker 1 is saturated with about 5 g left undissolved, and Beaker 2 is saturated with the last of the 60. g just dissolved", "Beaker 1 is saturated with about 5 g undissolved, and Beaker 2 is unsaturated, holding 60. g against an 8.0 × 10¹ g capacity", "Both are unsaturated, since stirring either beaker long enough will always take the whole 60. g into solution"], "answer": "B", "answer_text": "Beaker 1 is saturated with about 5 g left undissolved, and Beaker 2 is saturated with the last of the 60. g just dissolved", "exp": "Beaker 1 offers 60. g where 100. mL at 80 °C holds 55 g, so it is saturated with about 5 g lying undissolved, while Beaker 2 offers 60. g where 200. mL at 40 °C holds 30. g per 100. mL × 2.00 = 60. g exactly, so it is saturated with everything just dissolved. Calling either one unsaturated ignores those capacities, the 8.0 × 10¹ g figure reads the 60 °C row for water sitting at 40 °C, and supersaturation comes only from cooling a solution undisturbed, never from stirring extra solid into a hot beaker."}, {"id": 145, "level": "Advanced", "tag": "Gas Solubility", "stem": "A 5.00 L river sample at 14 °C is saturated with oxygen, which your data give as 10.1 mg of O₂ per 1 L of water at that temperature. There are 1000 mg in a gram and O₂ is 32.00 g/mol. Using a T-chart to take the mass to moles, how many moles of O₂ does the sample hold, and what happens to that capacity if the water warms? Report the moles with the correct number of significant digits.", "options": ["1.62 mol, and the capacity falls as the water warms, because a warmer river holds less dissolved gas", "1.58 × 10⁻³ mol, and the capacity rises as the water warms, since warm water takes up every solute better", "1.58 × 10⁻³ mol, and the capacity falls as the water warms, because a warmer river holds less dissolved gas", "3.16 × 10⁻⁴ mol, and the capacity falls as the water warms, because a warmer river holds less dissolved oxygen"], "answer": "C", "answer_text": "1.58 × 10⁻³ mol, and the capacity falls as the water warms, because a warmer river holds less dissolved gas", "exp": "The sample carries 10.1 mg/L × 5.00 L = 50.5 mg, which is 50.5 mg × (1 g / 1000 mg) = 0.0505 g, and 0.0505 g O₂ × (1 mole O₂ / 32.00 g O₂) = 1.58 × 10⁻³ mol; gases become less soluble as temperature rises, so warming lowers what the river can hold. The 3.16 × 10⁻⁴ mol value covers only 1 L of the 5.00 L sample, 1.62 mol multiplies by the molar mass instead of dividing, and saying the capacity rises applies the behaviour of a dissolved solid to a dissolved gas."}, {"id": 146, "level": "Advanced", "tag": "Gas Solubility", "stem": "A holding pond is aerated by a bubbler that raises the pressure of air in contact with the water, and at the same time a warm discharge is raising the pond's temperature. The pond also carries dissolved salt. Which statement about the pond is correct?", "options": ["Warming raises the salt the water can hold and leaves the oxygen untouched, while the added pressure lowers the salt capacity", "Warming lowers both the oxygen and the salt the water can hold, and the added pressure raises the capacity for both of them", "Warming lowers the oxygen the water can hold but raises the salt it could hold, and the added pressure acts on the oxygen alone", "Warming raises both the oxygen and the salt that the water can hold, and the added pressure raises the capacity for both of them as well"], "answer": "C", "answer_text": "Warming lowers the oxygen the water can hold but raises the salt it could hold, and the added pressure acts on the oxygen alone", "exp": "Rising temperature makes gases less soluble and solids more soluble, so the pond's oxygen capacity falls while its capacity for dissolved salt rises, and raising pressure increases gas solubility while leaving a solid unaffected. The options that move oxygen and salt the same way ignore that split, and no version of the pressure rule lowers or raises how much solid a given volume of water can dissolve."}, {"id": 147, "level": "Advanced", "tag": "Rate of Dissolving vs Amount Dissolved", "stem": "A lab report reads: “We stirred 50. g of KNO₃ i
