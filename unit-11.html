nto 100. mL of water at 25 °C and some never dissolved, so we ground what was left to a fine powder and stirred for twenty minutes more, and it all went in. This shows that grinding a solid raises its solubility.” Your curve gives 40. g per 100. mL of water at 25 °C. What is wrong?", "options": ["The curve reading is wrong: at 25 °C the curve allows 80. g per 100. mL, so all 50. g dissolves without any grinding", "At 25 °C only 40. g can dissolve, so about 10. g has to stay undissolved however fine the powder or long the stirring", "The temperature is the problem: twenty minutes of stirring warms the water enough to lift the capacity past 50. g", "Nothing is wrong; a powder has far more surface area than a single crystal, and more surface area lifts the saturation point"], "answer": "B", "answer_text": "At 25 °C only 40. g can dissolve, so about 10. g has to stay undissolved however fine the powder or long the stirring", "exp": "Surface area and agitation (stirring or shaking) change the dissolving rate — how fast the solute goes in — while only temperature changes how much can dissolve, and at 25 °C the curve caps the water at 40. g per 100. mL, leaving 50. g − 40. g = 10. g on the bottom. Crediting the powder with a higher saturation point is the rate-for-solubility swap the curve rules out, 80. g per 100. mL is the 50 °C reading rather than the 25 °C one, and stirring does not warm a beaker enough to move its capacity by 10. g."}, {"id": 148, "level": "Advanced", "tag": "Solubility Rules", "stem": "Use the general solubility rules table to label four reagents on the shelf — CuCl₂, Ag₂SO₄, Na₃PO₄ and NH₄Cl — as soluble (S) or insoluble (I). Which labeling is correct?", "options": ["CuCl₂ is S, Ag₂SO₄ is S, Na₃PO₄ is I and NH₄Cl is S, since silver sulfate dissolves freely while sodium phosphate is held back by the phosphate rule", "CuCl₂ is I, Ag₂SO₄ is I, Na₃PO₄ is S and NH₄Cl is S, since every copper compound is on the halide exception list, silver included", "All four are S, since each of the four carries either a halide or a metal from the first column of the periodic table with it", "CuCl₂ is S, Ag₂SO₄ is I, Na₃PO₄ is S and NH₄Cl is S, since the halide exception names Cu⁺ and not Cu²⁺, while Ag⁺ is on the sulfate list"], "answer": "D", "answer_text": "CuCl₂ is S, Ag₂SO₄ is I, Na₃PO₄ is S and NH₄Cl is S, since the halide exception names Cu⁺ and not Cu²⁺, while Ag⁺ is on the sulfate list", "exp": "The halide row lists Ag⁺, Pb²⁺, Cu⁺ and Tl⁺ as the exceptions, and copper(II) is not among them, so CuCl₂ is soluble; Ag⁺ is on the sulfate exception list, making Ag₂SO₄ insoluble; and the first row of the table makes both the sodium and the ammonium salt soluble. Labeling CuCl₂ insoluble reads Cu⁺ as any copper ion, calling Ag₂SO₄ soluble and Na₃PO₄ insoluble reverses two rows of the table, and labeling all four soluble ignores the silver exception altogether."}, {"id": 149, "level": "Advanced", "tag": "Significant Digits in Solution Calculations", "stem": "You weigh 3.17 g of KNO₃ (MM = 101.10 g/mol) and take it to 0.500 L of solution. Running the T-chart and then molarity = moles / Liters straight through without rounding, the calculator shows 0.062710188. Report your answer with the correct number of significant digits.", "options": ["0.0627102M", "0.06271M", "0.0627M", "0.063M"], "answer": "C", "answer_text": "0.0627M", "exp": "The chain is 3.17 g KNO₃ × (1 mole KNO₃ / 101.10 g KNO₃) = 0.0313551 mol, then 0.0313551 mol / 0.500 L, and the fewest significant digits among 3.17, 101.10 and 0.500 is three, so the reported value is 0.0627M. Writing 0.06271M keeps four digits and 0.0627102M keeps six, both claiming more precision than the 3.17 g weighing supports, while 0.063M drops to two and throws away a digit the measurements earned."}, {"id": 150, "level": "Advanced", "tag": "Electrolytes and Nonelectrolytes", "stem": "On Day 1 of the simulated investigation the conductivity tester lights brightly in the river sample, and a partner writes: “The bulb lit, so the river must be carrying dissolved aluminum.” Judge the claim.", "options": ["The claim holds: the brightness of the bulb reads out which metal is dissolved, and aluminum gives the brightest glow of the metals", "The claim overreaches: a lit bulb shows only that dissolved ions are present, and the Day 2 spot test is what names the ion", "The claim overreaches: a lit bulb shows the sample carries a dissolved nonelectrolyte, which could be any of many substances", "The claim holds: aluminum salts are the only compounds that dissociate well enough to light a tester at all"], "answer": "B", "answer_text": "The claim overreaches: a lit bulb shows only that dissolved ions are present, and the Day 2 spot test is what names the ion", "exp": "A conductivity tester lights when an ionic compound has dissociated and dissolved ions are carrying charge through the solution, but it cannot say which ions those are — that is what the Day 2 spot test and its PPT/NR fingerprint do. Many dissolved ionic compounds light the bulb, so aluminum is not the only candidate, brightness does not identify a metal, and a nonelectrolyte such as sugar is precisely what leaves the bulb dark."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>
  `<button data-t="${i}">${t}<span class="c">${tagCount[t]}</span></button>`).join('');
document.querySelectorAll('#tagchips button').forEach((b,i)=>{
  b.onclick = ()=>{
    const t = tags[i];
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.classList.toggle('on', picked.has(t));
    refresh();
  };
});
$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
