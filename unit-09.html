<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "Your Science Spiral notes for the Stardust unit define one term as “the flow of thermal energy.” Which term is being defined?", "options": ["Thermal energy, the motion of the particles", "Specific heat, the energy per gram per degree", "Temperature, the flow of thermal energy", "Heat, the flow of thermal energy"], "answer": "D", "answer_text": "Heat, the flow of thermal energy", "exp": "Heat is the flow of thermal energy from one place to another, which is exactly the wording of the definition. Temperature measures the average kinetic energy rather than any flow, thermal energy is the particle motion itself instead of its movement from place to place, and specific heat is the energy needed to raise 1 gram by 1 °C."}, {"id": 2, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "A thermometer hangs above the dance floor of the Stardust nightclub. What does the reading on that thermometer actually measure?", "options": ["The total thermal energy stored in all of the air", "The flow of thermal energy through the air", "The energy stored in the bonds of the air", "The average kinetic energy of the air particles"], "answer": "D", "answer_text": "The average kinetic energy of the air particles", "exp": "Temperature is a measure of the average kinetic energy of the particles, so a hotter reading means faster average motion. The total thermal energy stored in all the air also depends on how much air there is, the flow of thermal energy is the definition of heat, and the energy stored in the bonds is chemical energy."}, {"id": 3, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "In the “Heat in a Flame” lab you record a temperature and you calculate a thermal energy from q = mcΔT. Which unit belongs with the thermal energy?", "options": ["The joule, which measures energy", "The gram, which measures energy", "The degree Celsius, which measures energy", "The kelvin, which measures energy"], "answer": "A", "answer_text": "The joule, which measures energy", "exp": "Thermal energy is measured in joules, while temperature is measured in degrees Celsius or kelvins and mass is measured in grams. Calling the degree Celsius or the kelvin a unit of energy confuses temperature with energy, and the gram measures how much matter is present, not how much energy it holds."}, {"id": 4, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "The unit notes say thermal energy describes the movement of tiny particles. As the air trapped in the Stardust ceiling void gets hotter, what happens?", "options": ["The particles move faster, so the thermal energy is smaller", "The particle speed is unchanged, but the energy is greater", "The particles move faster, so the thermal energy is greater", "The particles move slower, so the thermal energy is greater"], "answer": "C", "answer_text": "The particles move faster, so the thermal energy is greater", "exp": "Faster-moving particles carry more thermal energy, so heating the air speeds the particles up and raises the thermal energy together. Saying the particles move slower or that their speed is unchanged contradicts the rising temperature, and faster particles can never mean less thermal energy."}, {"id": 5, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "In the “Heat in a Flame” lab the water in the test tube reads 19.0 °C before the candle is lit and 25.0 °C twenty seconds later. Using ΔT = T_final − T_initial, what is ΔT?", "options": ["6.0 °C", "44.0 °C", "1.3 °C", "−6.0 °C"], "answer": "A", "answer_text": "6.0 °C", "exp": "Subtract in the order the equation gives: 25.0 °C − 19.0 °C = 6.0 °C, and because both readings run to the tenths place the answer is reported to the tenths place too. The value −6.0 °C reverses the subtraction to initial minus final, 44.0 °C adds the two readings, and 1.3 °C divides them."}, {"id": 6, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "Two beakers of water sit side by side on the lab bench, both at 22.0 °C. One holds 50.0 mL of water and the other holds 250.0 mL. Which statement is correct?", "options": ["The 250.0 mL sample is at a higher temperature", "The 250.0 mL sample holds more thermal energy", "The two samples hold equal thermal energy", "The 50.0 mL sample holds more thermal energy"], "answer": "B", "answer_text": "The 250.0 mL sample holds more thermal energy", "exp": "Thermal energy counts the motion of every particle, so the larger 250.0 mL sample holds more of it even though both beakers read 22.0 °C. Saying the 50.0 mL sample holds more reverses that, saying the samples hold equal thermal energy ignores the difference in amount, and a higher temperature is ruled out because both thermometers read 22.0 °C."}, {"id": 7, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "A steel axe head at 18 °C is laid against a wall panel that is at 245 °C. Which way does the heat flow?", "options": ["From the panel into the axe, until the axe is the hotter object", "From the panel into the axe, until they reach the same temperature", "In neither direction, because both objects are made of solids", "From the axe into the panel, until they reach the same temperature"], "answer": "B", "answer_text": "From the panel into the axe, until they reach the same temperature", "exp": "Heat always flows from the hotter object to the cooler one, so it moves from the 245 °C panel into the 18 °C axe head until both sit at one temperature. Flow from the axe into the panel runs uphill in temperature, heat never keeps flowing until the axe becomes the hotter object, and being solid does not stop heat transfer."}, {"id": 8, "level": "Beginner", "tag": "Heat, Temperature, and Thermal Energy", "stem": "Day 2 asks you to lower the temperature of solid argon in the simulation to 0 K, which is −273.15 °C. What happens to the argon particles there?", "options": ["They keep their speed, but lose all kinetic energy", "They move faster, but lose all of their kinetic energy", "They move faster, so they have more kinetic energy", "They stop moving, so they have no kinetic energy"], "answer": "D", "answer_text": "They stop moving, so they have no kinetic energy", "exp": "Absolute zero, −273.15 °C, is the temperature at which particle motion stops, so the kinetic energy goes to zero. Moving faster would mean a higher temperature, not the lowest one possible, and particles cannot keep their speed or speed up while losing all of their kinetic energy."}, {"id": 9, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "The unit defines one kind of reaction as one that releases more energy when bonds form than it takes in to break bonds. Which reaction is that?", "options": ["Endothermic, and the water around it cools down", "Exothermic, and the water around it cools down", "Exothermic, and the water around it warms up", "Endothermic, and the water around it warms up"], "answer": "C", "answer_text": "Exothermic, and the water around it warms up", "exp": "A reaction that gives off more energy forming bonds than it absorbs breaking them is exothermic, and that released energy warms the water nearby. Calling the same description endothermic reverses the definition, and an exothermic reaction cannot leave the water cooler because energy is flowing out of the reaction and into the water."}, {"id": 10, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "Which description matches an endothermic reaction?", "options": ["It absorbs more energy breaking bonds than it releases forming them", "It releases more energy forming bonds than it absorbs breaking them", "It absorbs and releases exactly equal energy in every bond change", "It forms brand new bonds without ever breaking any of the old ones"], "answer": "A", "answer_text": "It absorbs more energy breaking bonds than it releases forming them", "exp": "Endothermic means energy goes in overall, which happens when breaking bonds costs more than forming new ones pays back. Releasing more energy forming bonds than breaking them is the definition of exothermic, exactly equal energy would leave no temperature change at all, and every reaction must break old bonds before it can form new ones."}, {"id": 11, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "In the Day 4 lab you add calcium chloride to 5.0 g of water at 21.0 °C and the temperature climbs to 29.0 °C. How is the dissolving classified?", "options": ["Endothermic, because the calcium chloride is soluble in water", "Exothermic, because the calcium chloride dissolved completely", "Endothermic, because the temperature of the water increased", "Exothermic, because the temperature of the water increased"], "answer": "D", "answer_text": "Exothermic, because the temperature of the water increased", "exp": "The water got hotter, so energy flowed out of the dissolving calcium chloride and into the water, which makes the process exothermic. Reading the same temperature rise as endothermic reverses the direction of energy flow, and whether the solid dissolved completely or is soluble says nothing about which way the energy moved."}, {"id": 12, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "An instant cold pack from the first-aid kit turns icy in your hand as the salt inside dissolves. How is the dissolving classified, and which way does the heat move?", "options": ["Endothermic, and heat moves from your hand into the pack", "Endothermic, and heat moves from the pack into your hand", "Exothermic, and heat moves from your hand into the pack", "Exothermic, and heat moves from the pack into your hand"], "answer": "A", "answer_text": "Endothermic, and heat moves from your hand into the pack", "exp": "Your hand feels cold because heat is leaving it and being absorbed by the dissolving salt, which makes the process endothermic. An exothermic process would release energy and warm your hand instead, and heat moving from the pack into your hand would leave the pack feeling warm rather than icy."}, {"id": 13, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "Burning a sample of polyurethane foam releases 3.0 × 10³ J of thermal energy. Using the convention that exothermic q is negative and endothermic q is positive, what is q for this burning?", "options": ["−3.0 × 10⁻³ J", "+3.0 × 10⁶ J", "+3.0 × 10³ J", "−3.0 × 10³ J"], "answer": "D", "answer_text": "−3.0 × 10³ J", "exp": "Burning releases energy, so the process is exothermic and q carries a negative sign: q = −3.0 × 10³ J. Writing +3.0 × 10³ J drops the sign that marks energy leaving, −3.0 × 10⁻³ J moves the decimal six places the wrong way, and +3.0 × 10⁶ J multiplies by 1000 as if joules were being converted."}, {"id": 14, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "Melting a block of ice at 0 °C absorbs 1.7 × 10³ J of thermal energy. Using the convention that endothermic q is positive and exothermic q is negative, what is q for the melting ice?", "options": ["+1.7 × 10⁻³ J", "−1.7 × 10³ J", "+1.7 × 10³ J", "−1.7 × 10⁶ J"], "answer": "C", "answer_text": "+1.7 × 10³ J", "exp": "Melting takes energy in, so the process is endothermic and q is positive: q = +1.7 × 10³ J. The value −1.7 × 10³ J gives the sign of a process that releases energy, +1.7 × 10⁻³ J shifts the decimal six places the wrong way, and −1.7 × 10⁶ J has both the wrong sign and a factor of 1000 too many."}, {"id": 15, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "The unit notes say chemical energy is stored in the bonds between atoms. Which statement about those bonds is correct?", "options": ["Forming bonds absorbs energy and breaking bonds releases energy", "Breaking bonds and forming bonds both absorb energy from the water", "Breaking bonds and forming bonds both release energy to the water", "Breaking bonds absorbs energy and forming bonds releases energy"], "answer": "D", "answer_text": "Breaking bonds absorbs energy and forming bonds releases energy", "exp": "Pulling bonded atoms apart costs energy, so breaking bonds absorbs it, while snapping new bonds together gives energy back, so forming bonds releases it. The reversed statement would make every reaction behave backwards, and if bond breaking and bond forming both released or both absorbed energy, no reaction could ever be sorted into exothermic and endothermic."}, {"id": 16, "level": "Beginner", "tag": "Endothermic and Exothermic", "stem": "Which pair of physical changes are both endothermic?", "options": ["Freezing and evaporation", "Freezing and condensation", "Melting and evaporation", "Boiling and condensation"], "answer": "C", "answer_text": "Melting and evaporation", "exp": "Melting and evaporation both pull particles apart, and both take energy in, so both are endothermic. Freezing and condensation both let particles come together and give energy off, so the pairing of freezing with condensation is entirely exothermic, while boiling with condensation and freezing with evaporation each mix one energy-absorbing change with one energy-releasing change."}, {"id": 17, "level": "Beginner", "tag": "Specific Heat", "stem": "The unit defines specific heat as the amount of energy it takes to do what?", "options": ["Boil 1 gram of a substance sitting at its boiling point", "Raise the temperature of 1 gram of a substance by 1 °C", "Raise the temperature of any sample of a substance by 1 °C", "Melt 1 gram of a substance sitting at its melting point"], "answer": "B", "answer_text": "Raise the temperature of 1 gram of a substance by 1 °C", "exp": "Specific heat is the energy required to raise 1 gram of a substance by 1 °C, which is why its units are J/g°C. Raising any sample by 1 °C would depend on how big the sample is, melting 1 gram at its melting point is the heat of fusion, and boiling 1 gram is the heat of vaporization."}, {"id": 18, "level": "Beginner", "tag": "Specific Heat", "stem": "Which set of units belongs with a specific heat value such as the 4.18 for water?", "options": ["g°C/J, gram degrees per joule added", "J/g°C, joules per gram per degree", "J/g, joules per gram of substance", "kJ/g, kilojoules per gram melted"], "answer": "B", "answer_text": "J/g°C, joules per gram per degree", "exp": "Specific heat is energy per gram per degree, so water is 4.18 J/g°C and never simply 4.18 J/g. Both J/g and kJ/g leave out the degree and are the units used for a heat of fusion or vaporization, and g°C/J turns the ratio upside down."}, {"id": 19, "level": "Beginner", "tag": "Specific Heat", "stem": "A 25.0 g piece of copper wire absorbs 1.9 × 10² J of thermal energy and its temperature rises 20.0 °C. Using q = mcΔT, what is the specific heat of the copper?", "options": ["7.6 J/g°C", "9.5 J/g°C", "2.6 J/g°C", "0.38 J/g°C"], "answer": "D", "answer_text": "0.38 J/g°C", "exp": "Rearranged, c = q ÷ (m × ΔT) = 1.9 × 10² J ÷ (25.0 g × 20.0 °C) = 0.38 J/g°C, and the 1.9 × 10² J carries only two digits, so the answer does too. Dividing by the mass alone gives 7.6, dividing by the temperature change alone gives 9.5, and 2.6 comes from flipping the ratio and dividing 5.0 × 10² by 1.9 × 10²."}, {"id": 20, "level": "Beginner", "tag": "Specific Heat", "stem": "Equal masses of three metals sit in the sun for several hours and absorb the same amount of energy. Their specific heats are beryllium 1.83 J/g°C, lead 0.130 J/g°C, and manganese 0.48 J/g°C. Which will feel hottest?", "options": ["Lead, because it needs the least energy per degree", "All three, because they sat in the sun for the same time", "Beryllium, because it needs the most energy per degree", "Manganese, because its value falls between the other two"], "answer": "A", "answer_text": "Lead, because it needs the least energy per degree", "exp": "For the same energy and the same mass, the metal with the smallest specific heat climbs the most degrees, and 0.130 J/g°C is the smallest of the three. Beryllium at 1.83 J/g°C needs the most energy per degree, so it warms the least, manganese at 0.48 J/g°C lands in between, and equal time in the sun does not make the temperatures equal."}, {"id": 21, "level": "Beginner", "tag": "Specific Heat", "stem": "Equal masses of water (4.18 J/g°C) and aluminum (0.90 J/g°C) each absorb 1.0 × 10³ J from the same flame. Which sample ends up with the larger temperature change?", "options": ["Neither, because both samples absorbed the same energy", "The aluminum, because its specific heat is smaller", "The aluminum, because every metal must heat up slowly", "The water, because its specific heat is larger"], "answer": "B", "answer_text": "The aluminum, because its specific heat is smaller", "exp": "Because ΔT = q ÷ (m × c), the smaller specific heat gives the bigger temperature change, and 0.90 J/g°C is far smaller than 4.18 J/g°C. Saying water changes more because its specific heat is larger reverses the relationship, metals in fact heat quickly rather than slowly, and equal energy does not give equal ΔT when the specific heats differ."}, {"id": 22, "level": "Beginner", "tag": "Specific Heat", "stem": "A 5.00 g scrap of copper and a 50.00 g scrap of copper are cut from the same wire. What is true of their specific heats?", "options": ["The 5.00 g scrap has the larger value, since it warms up faster", "The 50.00 g scrap has the larger value, since it has more mass", "Both are 0.38 J/g°C, since specific heat ignores sample size", "Neither has a value until the mass and the heat are measured"], "answer": "C", "answer_text": "Both are 0.38 J/g°C, since specific heat ignores sample size", "exp": "Specific heat is already an amount per gram, so every piece of copper carries the same 0.38 J/g°C no matter how large the piece is. Tying the value to the 50.00 g mass or to how fast the 5.00 g piece warms confuses specific heat with the total energy q, which does grow with mass, and the value of a substance does not have to be measured fresh for each scrap."}, {"id": 23, "level": "Beginner", "tag": "Specific Heat", "stem": "Dublin Fire Brigade poured water onto the Stardust fire. Which property of water, whose specific heat is 4.18 J/g°C, makes it a good choice?", "options": ["It soaks up very little energy for each degree it warms", "It soaks up a great deal of energy for each degree it warms", "Its low specific heat lets it heat up and boil away quickly", "Its units of J/g let it store heat without any temperature change"], "answer": "B", "answer_text": "It soaks up a great deal of energy for each degree it warms", "exp": "A specific heat of 4.18 J/g°C is large, so each gram of water carries a great deal of energy away from the fire for every degree it warms. Saying water soaks up very little energy or has a low specific heat contradicts that value, and specific heat is written in J/g°C, not J/g, because it always refers to a temperature change."}, {"id": 24, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "The unit defines calorimetry as which process?", "options": ["Determining the mass of a burning fuel", "Determining the flash point of a liquid", "Determining a change in thermal energy", "Determining the melting point of a metal"], "answer": "C", "answer_text": "Determining a change in thermal energy", "exp": "Calorimetry is the process of determining a change in thermal energy, which is what q = mcΔT calculates from a measured temperature change. Finding a flash point tells you when a liquid gives off ignitable vapor, weighing a fuel gives only a mass, and a melting point is a temperature rather than an energy change."}, {"id": 25, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "A reference box in the review packet writes Q = mcΔT with “m = mass (kg)” while the specific heat is given in J/g°C. Which mass should you actually put into the equation?", "options": ["The mass in kilograms, so the answer comes out in kilojoules", "The mass in kilograms, because specific heat is per kilogram", "The mass in grams, so the grams in the specific heat cancel", "The mass in milligrams, so the answer comes out in joules"], "answer": "C", "answer_text": "The mass in grams, so the grams in the specific heat cancel", "exp": "The specific heat 4.18 J/g°C is written per gram, so the mass must be in grams for the grams to cancel and leave joules. Using kilograms makes every answer 1000 times too small rather than converting it to kilojoules, specific heat here is not a per-kilogram value, and milligrams would make every answer 1000 times too large."}, {"id": 26, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "Burning a piece of candy bar raises the temperature of 50.0 g of water from 19.0 °C to 55.0 °C. The specific heat of water is 4.18 J/g°C. How much energy did the water absorb? Report your answer with the correct number of significant digits.", "options": ["7524 J", "7.52 × 10³ J", "209 J", "1.15 × 10⁴ J"], "answer": "B", "answer_text": "7.52 × 10³ J", "exp": "First ΔT = 55.0 °C − 19.0 °C = 36.0 °C, then q = 50.0 g × 4.18 J/g°C × 36.0 °C = 7524 J, and since every measurement carries three digits the answer is 7.52 × 10³ J. Reporting 7524 J keeps a fourth digit the data cannot support, 1.15 × 10⁴ J uses the final temperature 55.0 °C in place of the change, and 209 J stops after multiplying mass by specific heat."}, {"id": 27, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "In the “Heat in a Flame” lab a tea candle warms 10.0 g of water from 19.0 °C to 25.0 °C. The specific heat of water is 4.18 J/g°C. How much energy did the water absorb? Report your answer with the correct number of significant digits.", "options": ["1.05 × 10³ J", "−2.5 × 10² J", "2.5 × 10² J", "250.8 J"], "answer": "C", "answer_text": "2.5 × 10² J", "exp": "Here ΔT = 25.0 °C − 19.0 °C = 6.0 °C, so q = 10.0 g × 4.18 J/g°C × 6.0 °C = 250.8 J, and the 6.0 °C carries only two digits, so the answer is 2.5 × 10² J. Leaving 250.8 J reports four digits from a two-digit ΔT, the negative version belongs to water that is cooling rather than warming, and 1.05 × 10³ J uses the final temperature 25.0 °C instead of the change."}, {"id": 28, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "The same lab repeated with a Bunsen burner warms 10.0 g of water from 19.0 °C to 45.0 °C. The specific heat of water is 4.18 J/g°C. How much energy did the water absorb? Report your answer with the correct number of significant digits.", "options": ["1.88 × 10³ J", "1086.8 J", "2.60 × 10² J", "1.09 × 10³ J"], "answer": "D", "answer_text": "1.09 × 10³ J", "exp": "With ΔT = 45.0 °C − 19.0 °C = 26.0 °C, q = 10.0 g × 4.18 J/g°C × 26.0 °C = 1086.8 J, and all three measurements carry three digits, so the answer is 1.09 × 10³ J. The value 2.60 × 10² J leaves the specific heat out of the multiplication, 1086.8 J keeps two digits too many, and 1.88 × 10³ J uses the final temperature 45.0 °C rather than the change."}, {"id": 29, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "A 20.0 g strip of aluminum from a ceiling grid is heated from 25.0 °C to 175.0 °C. The specific heat of aluminum is 0.90 J/g°C. How much energy did the aluminum absorb?", "options": ["2.7 × 10³ J", "3.2 × 10³ J", "1.25 × 10⁴ J", "−2.7 × 10³ J"], "answer": "A", "answer_text": "2.7 × 10³ J", "exp": "With ΔT = 175.0 °C − 25.0 °C = 150.0 °C, q = 20.0 g × 0.90 J/g°C × 150.0 °C = 2700 J, and the 0.90 J/g°C carries only two digits, so the answer is 2.7 × 10³ J. The value 3.2 × 10³ J uses the final temperature 175.0 °C instead of the change, 1.25 × 10⁴ J substitutes water’s 4.18 J/g°C for aluminum’s, and the negative version belongs to metal that is cooling."}, {"id": 30, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "You pour 25.0 mL of water into a test tube, where 1 mL of water = 1 g, and a flame warms it from 21.0 °C to 33.0 °C. The specific heat of water is 4.18 J/g°C. How much energy did the water absorb? Report your answer with the correct number of significant digits.", "options": ["1254 J", "3.45 × 10³ J", "1.25 × 10³ J", "1.25 J"], "answer": "C", "answer_text": "1.25 × 10³ J", "exp": "Since 1 mL of water is 1 g, the mass is 25.0 g, ΔT = 33.0 °C − 21.0 °C = 12.0 °C, and q = 25.0 g × 4.18 J/g°C × 12.0 °C = 1254 J, reported as 1.25 × 10³ J because every measurement carries three digits. Leaving 1254 J keeps a fourth digit, 1.25 J comes from entering the mass as 0.0250 kg when the specific heat is per gram, and 3.45 × 10³ J uses the final temperature 33.0 °C in place of the change."}, {"id": 31, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "A beaker holding 40.0 g of water cools from 30.0 °C to 20.0 °C as it sits on the bench. The specific heat of water is 4.18 J/g°C. What is q for the water? Report your answer with the correct number of significant digits.", "options": ["−1672 J", "−1.67 × 10³ J", "+1.67 × 10³ J", "+1.7 × 10³ J"], "answer": "B", "answer_text": "−1.67 × 10³ J", "exp": "Here ΔT = 20.0 °C − 30.0 °C = −10.0 °C, so q = 40.0 g × 4.18 J/g°C × (−10.0 °C) = −1672 J, which is −1.67 × 10³ J to three digits. The positive versions drop the sign that shows the water is losing energy, −1672 J keeps a fourth digit the data cannot support, and +1.7 × 10³ J is both unsigned and a digit short."}, {"id": 32, "level": "Beginner", "tag": "Calorimetry and q = mcΔT", "stem": "In the calorimetry lab the water absorbs +1.09 × 10³ J while the candle wax burns beneath it. Using the convention that exothermic q is negative, what is q for the burning wax?", "options": ["−1.09 × 10⁶ J", "+2.18 × 10³ J", "−1.09 × 10³ J", "+1.09 × 10³ J"], "answer": "C", "answer_text": "−1.09 × 10³ J", "exp": "The wax gives up the energy the water takes in, so the size stays the same and only the sign flips: q = −1.09 × 10³ J. Repeating +1.09 × 10³ J leaves the wax gaining energy it actually released, −1.09 × 10⁶ J multiplies by 1000 for no reason, and +2.18 × 10³ J doubles the energy as if the water and the wax each supplied it."}, {"id": 33, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "The unit defines a phase change as which of the following?", "options": ["A change in state, such as a solid turning into a liquid", "A change in temperature, such as 20.0 °C rising to 30.0 °C", "A change in mass, such as 5.0 g of water becoming 10.0 g", "A change in the bonds inside each individual molecule"], "answer": "A", "answer_text": "A change in state, such as a solid turning into a liquid", "exp": "A phase change is a change of state, such as ice melting into liquid water, and it happens at a constant temperature. A temperature change from 20.0 °C to 30.0 °C is the sloped part of a heating curve rather than a phase change, mass does not change during melting or boiling, and the bonds inside each molecule stay intact."}, {"id": 34, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "On a heating curve the temperature climbs, then holds flat for several minutes even though the burner keeps supplying heat. What is happening along that flat part?", "options": ["Nothing, because no energy enters the sample there", "A phase change, while the temperature holds steady", "A phase change, while the temperature keeps climbing", "A temperature change, while the phase holds steady"], "answer": "B", "answer_text": "A phase change, while the temperature holds steady", "exp": "A flat stretch on a heating curve is a phase change, where the incoming energy pulls particles apart instead of speeding them up, so the thermometer holds steady. A phase change with a climbing temperature describes no part of the curve, a temperature change is the sloped part instead, and energy is still entering the whole time the burner runs."}, {"id": 35, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "A beaker of ice sits at 0 °C and is slowly melting. What happens to the potential energy and the kinetic energy of the water molecules while the ice melts?", "options": ["Potential energy decreases while kinetic energy stays the same", "Both the potential energy and the kinetic energy increase", "Kinetic energy increases while potential energy stays the same", "Potential energy increases while kinetic energy stays the same"], "answer": "D", "answer_text": "Potential energy increases while kinetic energy stays the same", "exp": "Melting breaks the intermolecular forces holding the ice together, and pulling the molecules apart stores energy as potential energy. The thermometer holds at 0 °C the whole time, so the average kinetic energy does not change, which rules out kinetic energy increasing or both increasing, and a decrease in potential energy describes the opposite process of freezing."}, {"id": 36, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "How much energy is needed to melt 25.0 g of ice that is already at 0 °C? The heat of fusion of water is 0.333 kJ/g. Report your answer with the correct number of significant digits.", "options": ["−8.33 kJ", "+8.325 kJ", "+56.5 kJ", "+8.33 kJ"], "answer": "D", "answer_text": "+8.33 kJ", "exp": "Use q = m × heat of fusion = 25.0 g × 0.333 kJ/g = 8.325 kJ, which rounds to +8.33 kJ because 25.0 g carries three digits, and the sign is positive because melting absorbs energy. Reporting +8.325 kJ keeps a fourth digit, +56.5 kJ uses the heat of vaporization 2.26 kJ/g by mistake, and −8.33 kJ gives the sign of a process that releases energy."}, {"id": 37, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "How much energy is needed to boil 15.0 g of water that is already at 100. °C? The heat of vaporization of water is 2.26 kJ/g. Report your answer with the correct number of significant digits.", "options": ["+5.00 kJ", "+33.9 kJ", "−33.9 kJ", "+34 kJ"], "answer": "B", "answer_text": "+33.9 kJ", "exp": "Use q = m × heat of vaporization = 15.0 g × 2.26 kJ/g = 33.9 kJ, positive because boiling absorbs energy, and three digits are right because both values carry three. The value +5.00 kJ comes from using the heat of fusion 0.333 kJ/g instead, +34 kJ drops a digit the data supports, and −33.9 kJ gives the sign of a process that releases energy."}, {"id": 38, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "Melting 1.00 g of ice at 0 °C takes 333 J using the heat of fusion 0.333 kJ/g, while warming 1.00 g of liquid water by 1.00 °C takes 4.18 J using the specific heat 4.18 J/g°C. What does this comparison show?", "options": ["The two take roughly the same energy for the same gram", "A 1 °C warming takes far more energy than a phase change", "A phase change takes no energy, since the temperature holds", "A phase change takes far more energy than a 1 °C warming"], "answer": "D", "answer_text": "A phase change takes far more energy than a 1 °C warming", "exp": "The 333 J needed to melt a gram of ice is about eighty times the 4.18 J needed to warm that gram by one degree, so phase changes dominate the energy in a heating-curve problem. Claiming the warming step costs more reverses the two numbers, calling them roughly equal ignores the size gap, and a steady temperature does not mean zero energy is required."}, {"id": 39, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "A phase-change calculation gives an answer of 16.7 kJ. Written in joules, this is which value? (1 kJ = 1000 J)", "options": ["1.67 × 10⁷ J", "1.67 × 10⁴ J", "1.67 × 10² J", "1.67 × 10⁻² J"], "answer": "B", "answer_text": "1.67 × 10⁴ J", "exp": "A kilojoule is the larger unit, so multiply: 16.7 kJ × 1000 J/kJ = 16,700 J, or 1.67 × 10⁴ J. The value 1.67 × 10⁻² J divides by 1000 instead of multiplying, 1.67 × 10² J moves the decimal only one place, and 1.67 × 10⁷ J multiplies by a million."}, {"id": 40, "level": "Beginner", "tag": "Phase Changes and Heating Curves", "stem": "On the heating curve for ethanol the temperature stops rising and holds at 78 °C while the burner keeps heating. What is the ethanol doing during that flat stretch?", "options": ["Warming, as the liquid ethanol simply gets hotter", "Boiling, as the liquid ethanol turns into vapor", "Cooling, as the ethanol vapor turns back to liquid", "Melting, as the solid ethanol turns into liquid"], "answer": "B", "answer_text": "Boiling, as the liquid ethanol turns into vapor", "exp": "The accelerant table lists 78 °C as the boiling point of ethyl alcohol, so the flat stretch at that temperature is the liquid boiling into vapor. Melting would show up as a flat stretch at a much lower temperature, warming would appear as a sloped line rather than a flat one, and the ethanol cannot be cooling while the burner is still adding heat."}, {"id": 41, "level": "Beginner", "tag": "Potential Energy Diagrams", "stem": "On a potential energy diagram the products are drawn lower than the reactants. How is the reaction classified?", "options": ["Endothermic, because the products hold less energy", "Exothermic, because the products hold more energy", "Endothermic, because the products hold more energy", "Exothermic, because the products hold less energy"], "answer": "D", "answer_text": "Exothermic, because the products hold less energy", "exp": "Products drawn below the reactants mean the reaction gave energy away, which is exothermic. Pairing that same drop with endothermic reverses the definition, and any option that says the products hold more energy contradicts the diagram, since the products are the lower of the two levels."}, {"id": 42, "level": "Beginner", "tag": "Potential Energy Diagrams", "stem": "A potential energy diagram for the salt in a cold pack shows the products drawn above the reactants. How is the reaction classified?", "options": ["Exothermic, because energy was released overall", "Endothermic, because energy was released overall", "Exothermic, because energy was absorbed overall", "Endothermic, because energy was absorbed overall"], "answer": "D", "answer_text": "Endothermic, because energy was absorbed overall", "exp": "Climbing from reactants up to products means the reaction had to take energy in, which is endothermic and matches a pack that turns cold. Calling an uphill diagram exothermic reverses the definition, and the two options that pair endothermic with release or exothermic with absorption swap the words against their own meanings."}, {"id": 43, "level": "Beginner", "tag": "Potential Energy Diagrams", "stem": "Every potential energy diagram in the unit shows a hump between the reactants and the products. What does the height of that hump above the reactants represent?", "options": ["The heat of combustion of the fuel that burns", "The activation energy needed to start the reaction", "The specific heat of the substances reacting", "The total amount of energy the reaction releases overall"], "answer": "B", "answer_text": "The activation energy needed to start the reaction", "exp": "The hump is the activation energy, the energy that must be supplied before reactants can become products, which is why a fire needs a spark. The overall energy released is the gap between the reactant and product levels rather than the height of the hump, and specific heat and heat of combustion are measured properties, not features of the curve."}, {"id": 44, "level": "Beginner", "tag": "Potential Energy Diagrams", "stem": "On a potential energy diagram the reactants sit at 4.0 × 10² kJ and the products sit at 1.5 × 10² kJ. What is the energy change for the reaction?", "options": ["+2.5 × 10² kJ, absorbed", "−2.5 × 10² kJ, released", "+5.5 × 10² kJ, absorbed", "−5.5 × 10² kJ, released"], "answer": "B", "answer_text": "−2.5 × 10² kJ, released", "exp": "Subtract products minus reactants: 1.5 × 10² kJ − 4.0 × 10² kJ = −2.5 × 10² kJ, and the negative sign says the energy was released. The value +2.5 × 10² kJ has the right size but reverses the subtraction, and both 5.5 × 10² kJ answers come from adding the two levels instead of subtracting them."}, {"id": 45, "level": "Beginner", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "In the candle minilab you hold one end of a rolled aluminum foil stick in the flame and soon feel heat at your fingers. Which type of heat transfer is that?", "options": ["Conduction, as vibrating atoms bump their neighbors", "Convection, as vibrating atoms bump their neighbors", "Radiation, as infrared waves travel along the foil", "Convection, as a current carries the warm foil upward"], "answer": "A", "answer_text": "Conduction, as vibrating atoms bump their neighbors", "exp": "Heat moving through a solid piece of metal is conduction: the atoms in the flame end vibrate and knock into the atoms beside them all the way to your fingers. Convection needs a fluid such as air or water to carry a current, and radiation carries energy across a gap as waves rather than through a solid stick."}, {"id": 46, "level": "Beginner", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "Above the tea candle the warm air rises while cooler air sinks in to take its place. Which type of heat transfer is that?", "options": ["Combustion, which happens when the fuel burns", "Convection, which happens in fluids such as air", "Conduction, which happens only in solid metals", "Radiation, which happens through infrared waves"], "answer": "B", "answer_text": "Convection, which happens in fluids such as air", "exp": "A rising-and-sinking current of warm and cool air is convection, and convection occurs in fluids, meaning liquids and gases. Conduction moves heat by particle collisions rather than by a current, radiation travels as waves and needs no air at all, and combustion is the burning reaction that supplied the heat in the first place."}, {"id": 47, "level": "Beginner", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "Holding your hand beside the candle flame, not above it, you still feel heat across the gap of air. Which type of heat transfer is that?", "options": ["Radiation, infrared waves carrying energy across", "Conduction, air atoms vibrating against your hand", "Combustion, the wax reacting with the oxygen present", "Convection, warm air currents rising above the flame"], "answer": "A", "answer_text": "Radiation, infrared waves carrying energy across", "exp": "Heat felt to the side of a flame arrives as radiation, the infrared waves that carry energy across the gap. Convection carries heat upward, which is why your hand feels much hotter above the flame than beside it, conduction would require good particle-to-particle contact, and combustion is the reaction producing the energy rather than the way it travels."}, {"id": 48, "level": "Beginner", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "In a room fire the hot gas layer at the ceiling reaches 6.0 × 10² °C while the floor stays much cooler, yet the floor below is heated strongly across the open room. How does that energy reach the floor?", "options": ["By convection carrying hot gas down to the floor", "By radiation from the hot gas layer overhead", "By conduction through the open air below it", "By conduction through the concrete of the floor"], "answer": "B", "answer_text": "By radiation from the hot gas layer overhead", "exp": "The hot ceiling layer radiates infrared energy down onto everything below, which is why the floor is heated strongly without ever touching anything hot. Air is a poor conductor and there is no solid path from the ceiling to the floor, and convection carries hot gas upward, not downward."}, {"id": 49, "level": "Beginner", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "Which material found on the Stardust’s walls and ceiling would carry heat best by conduction?", "options": ["Polyurethane foam, because foam conducts heat well", "Trapped air, because gases conduct heat very well", "Copper wiring, because metals conduct heat well", "Carpet tiles, because their fabric conducts heat well"], "answer": "C", "answer_text": "Copper wiring, because metals conduct heat well", "exp": "Metals such as copper are the good conductors, with atoms packed so that vibrations pass quickly from one to the next. Carpet tiles, polyurethane foam and trapped air are insulators rather than conductors, which is why the fire spread by flame spread and by radiation from the hot gas layer instead of by conduction through the lining."}, {"id": 50, "level": "Beginner", "tag": "Fire Science: Flash Point and Ignition", "stem": "The unit defines the flash point of a liquid as which temperature?", "options": ["The temperature where all of the liquid has turned to gas", "The temperature where the liquid begins to freeze solid", "The temperature where its vapor ignites with no flame at all", "The temperature where its vapor will ignite from a flame"], "answer": "D", "answer_text": "The temperature where its vapor will ignite from a flame", "exp": "The flash point is the temperature at which a liquid gives off enough vapor to be lit by an outside flame, and the burning stops when that flame is taken away. Igniting with no flame present is the auto-ignition temperature, the point where all the liquid turns to gas is the boiling point, and freezing is unrelated to ignition."}, {"id": 51, "level": "Beginner", "tag": "Fire Science: Flash Point and Ignition", "stem": "Acetone has a flash point far below room temperature and an auto-ignition temperature of 465 °C. What does the 465 °C tell an investigator?", "options": ["The acetone vapor will have cooled back to a liquid by then", "All of the liquid acetone will have boiled away by then", "Its vapor will ignite there only if a flame is held to it", "Its vapor will ignite there with no flame present"], "answer": "D", "answer_text": "Its vapor will ignite there with no flame present", "exp": "The auto-ignition temperature is the temperature at which the vapor catches fire on its own, with no outside flame, so acetone vapor self-ignites at 465 °C. Needing a flame held to it describes the flash point instead, and boiling away and condensing back are changes of state rather than ignition."}, {"id": 52, "level": "Beginner", "tag": "Fire Science: Flash Point and Ignition", "stem": "Flash points from the accelerant table: acetone −20 °C, lighter fluid −4 °C, ethyl alcohol 13 °C, gasoline −43 °C. Which of these liquids would ignite most easily on a cold night?", "options": ["Ethyl alcohol, whose flash point is 13 °C", "Gasoline, whose flash point is −43 °C", "Lighter fluid, whose flash point is −4 °C", "Acetone, whose flash point is −20 °C"], "answer": "B", "answer_text": "Gasoline, whose flash point is −43 °C", "exp": "The lower the flash point, the colder a liquid can be and still give off ignitable vapor, and −43 °C is the lowest of the four. Acetone at −20 °C and lighter fluid at −4 °C are still below freezing but not as low, and ethyl alcohol at 13 °C needs the warmest conditions of the four before its vapor will light."}, {"id": 53, "level": "Beginner", "tag": "Fire Science: Flash Point and Ignition", "stem": "Investigators say a room has reached flashover when the upper gas layer averages at least 6.0 × 10² °C and the floor below is bathed in radiant energy. What happens at flashover?", "options": ["Only the item that ignited first goes on burning quietly", "The room cools as the hot gases escape upward", "Every ignitable surface in the room bursts into flame", "The fire runs out of oxygen and smothers itself out"], "answer": "C", "answer_text": "Every ignitable surface in the room bursts into flame", "exp": "At flashover the radiation from the 6.0 × 10² °C gas layer pushes every exposed combustible surface past its ignition temperature at once, so the whole room goes up in flame. Having only the first item burn describes the stage before flashover, running out of oxygen describes a smouldering fire that may later backdraft, and the room heats rather than cools."}, {"id": 54, "level": "Beginner", "tag": "Fire Science: Flash Point and Ignition", "stem": "The unit says a fire needs three things in order to burn. Which three?", "options": ["Smoke, oxygen, and moisture", "Fuel, nitrogen, and pressure", "Fuel, oxygen, and heat", "Fuel, water vapor, and heat"], "answer": "C", "answer_text": "Fuel, oxygen, and heat", "exp": "The fire triangle is fuel, oxygen and heat, and taking away any one of the three stops the combustion. Nitrogen and water vapor do not support burning, pressure is not one of the three requirements, and smoke is a product of the fire rather than something the fire needs to start."}, {"id": 55, "level": "Intermediate", "tag": "Heat, Temperature, and Thermal Energy", "stem": "Two jugs of water stand behind the Stardust bar, one holding 150. g and one holding 45.0 g, and both start at 65.0 °C. Both cool to 25.0 °C. Using c = 4.18 J/g°C for water, how much MORE heat does the larger jug release than the smaller one?", "options": ["1.76 × 10⁴ J", "7.52 × 10³ J", "1.8 × 10⁴ J", "2.51 × 10⁴ J"], "answer": "A", "answer_text": "1.76 × 10⁴ J", "exp": "The extra mass is 150. g − 45.0 g = 105 g, and q = mcΔT = 105 g × 4.18 J/g°C × 40.0 °C = 17,556 J, which is 1.76 × 10⁴ J at three significant digits. The value 2.51 × 10⁴ J is the large jug's whole release and 7.52 × 10³ J is the small jug's, while 1.8 × 10⁴ J reports only two digits when every measurement supplies three."}, {"id": 56, "level": "Intermediate", "tag": "Heat, Temperature, and Thermal Energy", "stem": "A single spark falling from the ceiling void has a mass of about 0.0020 g at a temperature of 1.1 × 10³ °C. The fire brigade's tank holds 2.0 × 10⁵ g of water at 12 °C. Which comparison of their thermal energy is correct?", "options": ["They hold equal thermal energy, because thermal energy is an intensive property.", "The water holds more thermal energy, because thermal energy depends on mass too.", "The spark holds more thermal energy, because thermal energy is fixed by temperature.", "The spark holds more thermal energy, because its particles are moving much faster."], "answer": "B", "answer_text": "The water holds more thermal energy, because thermal energy depends on mass too.", "exp": "Thermal energy is the total energy of all the particles in a sample, so 2.0 × 10⁵ g of water at 12 °C stores far more of it than 0.0020 g of spark at 1.1 × 10³ °C. The spark's particles really do move faster on average, but that is temperature, which is the average kinetic energy per particle; thermal energy is extensive, not intensive, so equal amounts is also wrong."}, {"id": 57, "level": "Intermediate", "tag": "Heat, Temperature, and Thermal Energy", "stem": "A 40.0 g sample of water at 90.0 °C and a 4.00 × 10² g sample of water at 30.0 °C are both cooled to 20.0 °C. Using c = 4.18 J/g°C, which sample releases more heat, and which sample started hotter?", "options": ["The 40.0 g sample releases more heat, 1.17 × 10⁴ J, and it also started hotter.", "Both release the same heat, 1.67 × 10⁴ J, because both are cooled to the same 20.0 °C.", "The 4.00 × 10² g sample releases more heat, 1.67 × 10⁴ J, though the 40.0 g started hotter.", "The 4.00 × 10² g sample releases more heat, 1.67 × 10⁴ J, and it also started hotter."], "answer": "C", "answer_text": "The 4.00 × 10² g sample releases more heat, 1.67 × 10⁴ J, though the 40.0 g started hotter.", "exp": "For the small hot sample q = 40.0 g × 4.18 J/g°C × 70.0 °C = 11,704 J, or 1.17 × 10⁴ J, while for the large cool sample q = 4.00 × 10² g × 4.18 J/g°C × 10.0 °C = 16,720 J, or 1.67 × 10⁴ J. Heat depends on mass as well as on ΔT, so the cooler sample releases more energy even though the 40.0 g sample started at the higher temperature; saying the larger sample started hotter, or calling the two releases equal, both ignore the numbers."}, {"id": 58, "level": "Intermediate", "tag": "Endothermic and Exothermic", "stem": "A 75.0 g sample of water drawn from a fire hose cools from 82.0 °C to 24.0 °C. Using c = 4.18 J/g°C, what is q for that water, with its sign?", "options": ["−18.2 J", "+1.82 × 10⁴ J", "−1.8 × 10⁴ J", "−1.82 × 10⁴ J"], "answer": "D", "answer_text": "−1.82 × 10⁴ J", "exp": "ΔT = 24.0 °C − 82.0 °C = −58.0 °C, so q = 75.0 g × 4.18 J/g°C × (−58.0 °C) = −18,183 J, which is −1.82 × 10⁴ J at three digits; the minus sign says the water released heat. Writing +1.82 × 10⁴ J drops the sign, −1.8 × 10⁴ J reports two digits when the data give three, and −18.2 J is the answer in kilojoules with the unit label left as joules."}, {"id": 59, "level": "Intermediate", "tag": "Endothermic and Exothermic", "stem": "In the cold-pack demonstration, 125 g of water in a cup falls from 21.5 °C to 4.0 °C as a salt dissolves in it. Using c = 4.18 J/g°C, what is q for the dissolving process, and how is it classified?", "options": ["+9.14 × 10³ J, endothermic", "+9.1 × 10³ J, endothermic", "+2.09 × 10³ J, endothermic", "−9.14 × 10³ J, exothermic"], "answer": "A", "answer_text": "+9.14 × 10³ J, endothermic", "exp": "ΔT = 4.0 °C − 21.5 °C = −17.5 °C, so the water loses q = 125 g × 4.18 J/g°C × (−17.5 °C) = −9143.75 J; the dissolving takes in exactly that heat, so its q is +9.14 × 10³ J and it is endothermic. The value +2.09 × 10³ J uses the final reading 4.0 °C as if it were ΔT and keeps a digit too many, −9.14 × 10³ J reports the water's sign instead of the process's, and +9.1 × 10³ J shows only two digits."}, {"id": 60, "level": "Intermediate", "tag": "Endothermic and Exothermic", "stem": "Four things happen in the club's store room on the night of the fire. Which one is ENDOTHERMIC?", "options": ["Water vapor condenses onto the cold window above the store-room sink.", "Anhydrous magnesium sulfate dissolves and warms the water in the beaker with it.", "A block of polyurethane seat foam burns on the store-room floor.", "Ice from the ice machine melts into liquid in a glass on the bar."], "answer": "D", "answer_text": "Ice from the ice machine melts into liquid in a glass on the bar.", "exp": "Melting absorbs heat from the surroundings in order to pull the water molecules apart, so q is positive and the change is endothermic. Condensing releases heat as molecules come back together, burning foam releases heat as every combustion does, and anhydrous magnesium sulfate dissolves exothermically — only the hydrated Epsom-salt form cools its water."}, {"id": 61, "level": "Intermediate", "tag": "Endothermic and Exothermic", "stem": "A burning cushion warms the water in a can suspended above it. Taking the burning cushion as the system and the water as the surroundings, which pair of signs is correct?", "options": ["q for the burning cushion is positive and q for the water above it is negative.", "q for the burning cushion is negative and q for the water above it is positive.", "Both q values are positive, because the water's temperature is climbing steadily.", "Both q values are negative, because heat is leaving the burning cushion."], "answer": "B", "answer_text": "q for the burning cushion is negative and q for the water above it is positive.", "exp": "Combustion is exothermic, so the system loses heat and its q carries a minus sign, while the water absorbs that very same heat and its q is positive: q(water) = −q(cushion). Making both negative or both positive breaks that pairing, and reversing the two signs would say the cushion absorbed heat from water it is busy boiling."}, {"id": 62, "level": "Intermediate", "tag": "Endothermic and Exothermic", "stem": "How much heat is needed to melt 85.0 g of ice at 0.0 °C? The heat of fusion of water is 0.333 kJ/g and 1 kJ = 1000 J. Report the answer in joules with its sign.", "options": ["−2.83 × 10⁴ J", "+28.3 J", "+2.83 × 10⁴ J", "+1.92 × 10⁵ J"], "answer": "C", "answer_text": "+2.83 × 10⁴ J", "exp": "q = m × heat of fusion = 85.0 g × 0.333 kJ/g = 28.305 kJ, which is 28.3 kJ at three digits, and 28.3 kJ × 1000 J/kJ = 2.83 × 10⁴ J; melting absorbs heat, so q is positive. The value +28.3 J divides by 1000 instead of multiplying, +1.92 × 10⁵ J uses the heat of vaporization 2.26 kJ/g in place of the heat of fusion, and a minus sign would claim melting ice gives heat off."}, {"id": 63, "level": "Intermediate", "tag": "Specific Heat", "stem": "A 65.0 g fragment of metalwork recovered from the West Alcove absorbs 1114 J as it warms from 22.0 °C to 60.0 °C. What is the specific heat of the metal?", "options": ["0.286 J/g°C", "0.451 J/g", "0.451 J/g°C", "0.45 J/g°C"], "answer": "C", "answer_text": "0.451 J/g°C", "exp": "Rearranged, c = q / (m × ΔT) = 1114 J / (65.0 g × 38.0 °C) = 1114 J / 2470 g°C = 0.45101 J/g°C, and the three-digit mass and ΔT hold it to 0.451 J/g°C, which matches iron. The value 0.286 J/g°C divides by the final reading 60.0 °C instead of by ΔT, 0.45 J/g°C throws away a digit the data support, and 0.451 J/g is missing the per-degree part of the unit."}, {"id": 64, "level": "Intermediate", "tag": "Specific Heat", "stem": "Equal 1.00 × 10² g blocks of lead (c = 0.130 J/g°C), iron (c = 0.451 J/g°C) and aluminum (c = 0.90 J/g°C) each absorb 2.00 × 10³ J. What temperature rise does the LEAD block show?", "options": ["154 °C", "44.3 °C", "153.8 °C", "22 °C"], "answer": "A", "answer_text": "154 °C", "exp": "ΔT = q / (m × c) = 2.00 × 10³ J / (1.00 × 10² g × 0.130 J/g°C) = 2000 J / 13.0 J/°C = 153.85 °C, which is 154 °C at three digits. The value 44.3 °C is the iron block and 22 °C is the aluminum block, while 153.8 °C keeps a fourth digit that 0.130 J/g°C and the other three-digit data cannot support."}, {"id": 65, "level": "Intermediate", "tag": "Specific Heat", "stem": "The lab bench holds a 25.0 g aluminum sample and a 250. g aluminum sample cut from the same sheet. Which statement about them is correct?", "options": ["Both have c = 0.90 J/g°C, but the larger needs 10 times the heat per degree.", "The 250. g sample has the larger specific heat, because specific heat grows with mass.", "Both have c = 0.90 J/g°C, so both need exactly the same heat to rise one degree.", "The 25.0 g sample has the larger specific heat, since its heat sits in less material."], "answer": "A", "answer_text": "Both have c = 0.90 J/g°C, but the larger needs 10 times the heat per degree.", "exp": "Specific heat is an intensive property — the heat needed per gram per degree — so every piece of aluminum has c = 0.90 J/g°C no matter how big it is. The heat itself is extensive: q = mcΔT with 250. g is ten times the q with 25.0 g for the same ΔT, so 'the same heat to rise one degree' is wrong, and specific heat never grows or shrinks with sample size."}, {"id": 66, "level": "Intermediate", "tag": "Specific Heat", "stem": "A 155 g copper wire (c = 0.38 J/g°C) is heated from 24.0 °C to 310.0 °C. How much heat does the wire absorb?", "options": ["1.8 × 10⁴ J", "1.68 × 10⁴ J", "1.7 × 10⁴ J", "16,845 J"], "answer": "C", "answer_text": "1.7 × 10⁴ J", "exp": "q = mcΔT = 155 g × 0.38 J/g°C × 286.0 °C = 16,845 J, but 0.38 J/g°C carries only two significant digits, so the answer is limited to 1.7 × 10⁴ J. Reporting 16,845 J or 1.68 × 10⁴ J claims precision the specific heat does not have, and 1.8 × 10⁴ J comes from using the final reading 310.0 °C in place of ΔT = 286.0 °C."}, {"id": 67, "level": "Intermediate", "tag": "Specific Heat", "stem": "What mass of water must absorb 8.36 × 10³ J in order to warm from 20.0 °C to 60.0 °C? Use c = 4.18 J/g°C.", "options": ["50.0 g", "1.40 × 10⁶ g", "50 g", "33.3 g"], "answer": "A", "answer_text": "50.0 g", "exp": "Rearranged, m = q / (c × ΔT) = 8360 J / (4.18 J/g°C × 40.0 °C) = 8360 J / 167.2 J/g = 50.0 g, and three-digit data mean the trailing zero must be shown. Writing 50 g hides that third digit, 33.3 g divides by the final reading 60.0 °C instead of by ΔT, and 1.40 × 10⁶ g multiplies by c and ΔT when the equation calls for dividing."}, {"id": 68, "level": "Intermediate", "tag": "Specific Heat", "stem": "A 125 g iron pipe (c = 0.451 J/g°C) starts at 18.0 °C and absorbs 3.38 × 10³ J. What is the pipe's FINAL temperature?", "options": ["78.0 °C", "60.0 °C", "−42.0 °C", "78 °C"], "answer": "A", "answer_text": "78.0 °C", "exp": "ΔT = q / (m × c) = 3380 J / (125 g × 0.451 J/g°C) = 3380 J / 56.375 J/°C = 59.96 °C, so ΔT = 60.0 °C and T(final) = 18.0 °C + 60.0 °C = 78.0 °C. Answering 60.0 °C reports the change as if it were the final reading, −42.0 °C subtracts the change from the start instead of adding it, and 78 °C drops a digit that addition to the tenths place keeps."}, {"id": 69, "level": "Intermediate", "tag": "Specific Heat", "stem": "A 250. g block of beryllium (c = 1.83 J/g°C) and a 250. g block of manganese (c = 0.48 J/g°C) each cool by 45.0 °C. How much MORE heat does the beryllium release?", "options": ["2.06 × 10⁴ J", "5.4 × 10³ J", "1.52 × 10⁴ J", "1.5 × 10⁴ J"], "answer": "C", "answer_text": "1.52 × 10⁴ J", "exp": "The specific heats differ by 1.83 J/g°C − 0.48 J/g°C = 1.35 J/g°C, a subtraction kept to two decimal places, and that difference still has three digits, so q = 250. g × 1.35 J/g°C × 45.0 °C = 15,187.5 J = 1.52 × 10⁴ J. The value 2.06 × 10⁴ J is the beryllium's whole release and 5.4 × 10³ J is the manganese's, while 1.5 × 10⁴ J drops to two digits that the subtraction did not force."}, {"id": 70, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A student dissolves 1.5 g of anhydrous magnesium sulfate in 5.0 g of water in a test tube, and the temperature climbs from 21.0 °C to 33.5 °C. Using c = 4.18 J/g°C for water, how much heat did the water absorb?", "options": ["2.6 × 10² J", "3.4 × 10² J", "78 J", "7.0 × 10² J"], "answer": "A", "answer_text": "2.6 × 10² J", "exp": "Only the water's mass belongs in q = mcΔT: q = 5.0 g × 4.18 J/g°C × 12.5 °C = 261.25 J, which the two-digit 5.0 g holds to 2.6 × 10² J. The value 78 J uses the 1.5 g of solute as the mass, 3.4 × 10² J uses the combined 6.5 g, and 7.0 × 10² J uses the final reading 33.5 °C instead of ΔT = 12.5 °C."}, {"id": 71, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A hot metal bolt is dropped into 100.0 g of water at 22.0 °C in a coffee-cup calorimeter, and the water settles at 28.4 °C. Using c = 4.18 J/g°C, what is q for the BOLT?", "options": ["+2.7 × 10³ J", "−2675 J", "−2.7 × 10³ J", "−1.19 × 10⁴ J"], "answer": "C", "answer_text": "−2.7 × 10³ J", "exp": "The water gains q = 100.0 g × 4.18 J/g°C × 6.4 °C = 2675.2 J, and the heat lost by the bolt equals the heat gained by the water, so q(bolt) = −2.7 × 10³ J, limited to two digits by ΔT = 6.4 °C. Answering +2.7 × 10³ J drops the sign that says the bolt cooled, −2675 J keeps four digits ΔT cannot support, and −1.19 × 10⁴ J uses 28.4 °C as the temperature change."}, {"id": 72, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "In an insulated container, 2.00 × 10² g of water at 75.0 °C is mixed with 1.00 × 10² g of water at 15.0 °C. Using c = 4.18 J/g°C for both, what is the final temperature of the mixture?", "options": ["55.0 °C", "35.0 °C", "30.0 °C", "45.0 °C"], "answer": "A", "answer_text": "55.0 °C", "exp": "Heat lost equals heat gained, so 200.(75.0 − T)(4.18) = 100.(T − 15.0)(4.18); the 4.18 cancels and 15,000 − 200T = 100T − 1500, giving 300T = 16,500 and T = 55.0 °C. The value 45.0 °C is the plain average of 75.0 and 15.0 and ignores the 2-to-1 mass ratio, 35.0 °C weights the masses onto the wrong samples, and 30.0 °C reports half the 60.0 °C gap as though a change were a final reading."}, {"id": 73, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A 50.0 g metal sample at 99.0 °C is dropped into 125.0 g of water at 20.0 °C, and the water rises to 23.5 °C. Using c = 4.18 J/g°C for water, what is the specific heat of the metal?", "options": ["0.19 J/g°C", "0.48 J/g", "0.48 J/g°C", "0.484 J/g°C"], "answer": "C", "answer_text": "0.48 J/g°C", "exp": "The water gains 125.0 g × 4.18 J/g°C × 3.5 °C = 1828.75 J, the metal loses that same heat over ΔT = 23.5 °C − 99.0 °C = −75.5 °C, so c = 1828.75 J / (50.0 g × 75.5 °C) = 0.4844 J/g°C, held to 0.48 J/g°C by the two-digit ΔT of 3.5 °C. The value 0.19 J/g°C puts the metal's 50.0 g into the water's heat calculation, 0.484 J/g°C claims a third digit, and 0.48 J/g leaves the degrees out of the unit."}, {"id": 74, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "Under a calorimeter, a burning sample raises 250.0 g of water from 18.0 °C to 41.0 °C. Using c = 4.18 J/g°C and 1 kJ = 1000 J, how much heat did the water absorb, in joules?", "options": ["2.4 × 10⁴ J", "2.40 × 10⁷ J", "24.0 J", "2.40 × 10⁴ J"], "answer": "D", "answer_text": "2.40 × 10⁴ J", "exp": "q = 250.0 g × 4.18 J/g°C × 23.0 °C = 24,035 J, and three digits from 4.18 J/g°C and ΔT = 23.0 °C give 2.40 × 10⁴ J, where the final zero is a digit that must be shown. The value 24.0 J is the kilojoule answer with the unit left as joules, 2.40 × 10⁷ J multiplies by 1000 a second time, and 2.4 × 10⁴ J shows only two digits."}, {"id": 75, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A 425 g sample of water in a calorimeter rises 34.5 °C. Using c = 4.18 J/g°C and 1 kJ = 1000 J, how much heat did it absorb, in kilojoules?", "options": ["6.13 × 10⁴ kJ", "0.0613 kJ", "61.29 kJ", "61.3 kJ"], "answer": "D", "answer_text": "61.3 kJ", "exp": "q = 425 g × 4.18 J/g°C × 34.5 °C = 61,289 J, which is 6.13 × 10⁴ J at three digits, and 61,289 J ÷ 1000 J/kJ = 61.3 kJ. The value 6.13 × 10⁴ kJ never converted the joules at all, 0.0613 kJ divides by 1000 twice, and 61.29 kJ keeps a fourth digit that the three-digit data do not justify."}, {"id": 76, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A sprinkler line delivers 4.52 × 10⁵ J to water that warms from 12.0 °C to 62.0 °C. Using c = 4.18 J/g°C, what mass of water was heated?", "options": ["9.45 × 10⁷ g", "2.16 × 10³ g", "2163 g", "1.74 × 10³ g"], "answer": "B", "answer_text": "2.16 × 10³ g", "exp": "m = q / (c × ΔT) = 452,000 J / (4.18 J/g°C × 50.0 °C) = 452,000 J / 209 J/g = 2162.7 g, or 2.16 × 10³ g at three digits. The value 1.74 × 10³ g divides by the final reading 62.0 °C rather than by ΔT, 9.45 × 10⁷ g multiplies where the equation divides, and 2163 g claims a fourth digit the data cannot support."}, {"id": 77, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A 75.0 g brass fitting cools and releases 3.40 × 10³ J into 2.00 × 10² g of water. Using c = 4.18 J/g°C, by how much does the water's temperature rise?", "options": ["10.8 °C", "4.07 °C", "4.1 °C", "0.246 °C"], "answer": "B", "answer_text": "4.07 °C", "exp": "The water gains the heat the brass loses, so ΔT = q / (m × c) = 3400 J / (2.00 × 10² g × 4.18 J/g°C) = 3400 J / 836 J/°C = 4.067 °C, which is 4.07 °C at three digits. The value 10.8 °C uses the brass's 75.0 g instead of the water's mass, 0.246 °C inverts the ratio to mc/q, and 4.1 °C reports only two digits."}, {"id": 78, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "Burning a scrap of seat foam under a can raises 100.0 g of water from 20.0 °C to 46.0 °C. Using c = 4.18 J/g°C, which pair of values is correct?", "options": ["q(water) = +1.92 × 10⁴ J and q(foam) = −1.92 × 10⁴ J", "q(water) = −1.09 × 10⁴ J and q(foam) = +1.09 × 10⁴ J", "q(water) = +1.09 × 10⁴ J and q(foam) = −1.09 × 10⁴ J", "q(water) = +1.09 × 10⁴ J and q(foam) = +1.09 × 10⁴ J"], "answer": "C", "answer_text": "q(water) = +1.09 × 10⁴ J and q(foam) = −1.09 × 10⁴ J", "exp": "The water absorbs q = 100.0 g × 4.18 J/g°C × 26.0 °C = 10,868 J, which is +1.09 × 10⁴ J at three digits, and the burning foam releases exactly that much, so its q is −1.09 × 10⁴ J. The pair with 1.92 × 10⁴ J uses the final reading 46.0 °C as ΔT, the reversed pair says the water cooled while the fire warmed, and two positive values would create energy out of nothing."}, {"id": 79, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A student writes m = 0.0850 kg into q = mcΔT with c = 4.18 J/g°C for water warming from 16.0 °C to 44.0 °C. What is the correct heat?", "options": ["9.9 × 10³ J", "9.95 × 10³ J", "1.56 × 10⁴ J", "9.95 J"], "answer": "B", "answer_text": "9.95 × 10³ J", "exp": "Because c is given in J/g°C, the mass has to be in grams: 0.0850 kg = 85.0 g, so q = 85.0 g × 4.18 J/g°C × 28.0 °C = 9948.4 J = 9.95 × 10³ J. Leaving the mass in kilograms gives 9.95 J, a thousand times too small, 1.56 × 10⁴ J uses the final reading 44.0 °C instead of ΔT = 28.0 °C, and 9.9 × 10³ J drops to two digits."}, {"id": 80, "level": "Intermediate", "tag": "Calorimetry and q = mcΔT", "stem": "A 335 g cast-iron grate (c = 0.451 J/g°C) cools from 425.0 °C to 25.0 °C after the fire is knocked down. Using 1 kJ = 1000 J, how much heat does it release, in kilojoules?", "options": ["−60.4 kJ", "−6.04 × 10⁴ kJ", "+60.4 kJ", "−0.0604 kJ"], "answer": "A", "answer_text": "−60.4 kJ", "exp": "q = mcΔT = 335 g × 0.451 J/g°C × (−400.0 °C) = −60,434 J, which is −6.04 × 10⁴ J at three digits, and −60,434 J ÷ 1000 J/kJ = −60.4 kJ. The value −6.04 × 10⁴ kJ never converted to kilojoules, −0.0604 kJ divides by 1000 twice, and +60.4 kJ drops the sign that marks heat leaving the grate."}, {"id": 81, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "How many grams of ice at 0.0 °C can be melted by 5.55 × 10⁴ J? The heat of fusion of water is 0.333 kJ/g and 1 kJ = 1000 J.", "options": ["24.6 g", "167 g", "166.7 g", "1.67 × 10⁵ g"], "answer": "B", "answer_text": "167 g", "exp": "First convert the constant: 0.333 kJ/g × 1000 J/kJ = 333 J/g, so m = 55,500 J ÷ 333 J/g = 166.7 g, or 167 g at three digits. The value 1.67 × 10⁵ g divides by 0.333 without ever converting the kilojoules, 24.6 g uses the heat of vaporization 2260 J/g, and 166.7 g claims a fourth digit the three-digit data do not support."}, {"id": 82, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "A 50.0 g block of ice is warmed from −18.0 °C to 0.0 °C without any of it melting. The specific heat of ice is 2.108 J/g°C. How much heat does the ice absorb?", "options": ["1.9 × 10³ J", "1897 J", "3.76 × 10³ J", "1.90 × 10³ J"], "answer": "D", "answer_text": "1.90 × 10³ J", "exp": "q = mcΔT = 50.0 g × 2.108 J/g°C × 18.0 °C = 1897.2 J, and the three-digit mass and ΔT give 1.90 × 10³ J, where the final zero must be displayed. The value 3.76 × 10³ J uses water's 4.18 J/g°C instead of ice's 2.108 J/g°C, 1897 J claims four digits, and 1.9 × 10³ J shows only two."}, {"id": 83, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "How much heat is needed to turn 30.0 g of water at 100.0 °C into steam at 135.0 °C? Heat of vaporization 2.26 kJ/g, specific heat of steam 1.996 J/g°C, 1 kJ = 1000 J.", "options": ["6.78 × 10⁴ J", "2.10 × 10³ J", "7.0 × 10⁴ J", "6.99 × 10⁴ J"], "answer": "D", "answer_text": "6.99 × 10⁴ J", "exp": "Boiling takes 30.0 g × 2.26 kJ/g = 67.8 kJ = 67,800 J and heating the steam takes 30.0 g × 1.996 J/g°C × 35.0 °C = 2095.8 J, so the total is 69,896 J = 6.99 × 10⁴ J. The value 6.78 × 10⁴ J leaves out the steam-heating step, 2.10 × 10³ J leaves out the phase change entirely, and 7.0 × 10⁴ J rounds away a digit the data support."}, {"id": 84, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "How much heat is required to take 20.0 g of water from 50.0 °C all the way to steam at 150.0 °C? Use c(water) = 4.18 J/g°C, c(steam) = 1.996 J/g°C, heat of vaporization 2.26 kJ/g, 1 kJ = 1000 J.", "options": ["8.36 × 10³ J", "5.14 × 10⁴ J", "5.1 × 10⁴ J", "6.18 × 10³ J"], "answer": "B", "answer_text": "5.14 × 10⁴ J", "exp": "Three steps add up: 20.0 g × 4.18 J/g°C × 50.0 °C = 4180 J, then 20.0 g × 2.26 kJ/g = 45.2 kJ = 45,200 J, then 20.0 g × 1.996 J/g°C × 50.0 °C = 1996 J, for 51,376 J = 5.14 × 10⁴ J. The value 6.18 × 10³ J omits the boiling step, which is by far the largest, 8.36 × 10³ J treats the whole climb as liquid water, and 5.1 × 10⁴ J drops to two digits."}, {"id": 85, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "How much heat is required to take 50.0 g of ice from −5.0 °C to liquid water at 75.0 °C? Use c(ice) = 2.108 J/g°C, c(water) = 4.18 J/g°C, heat of fusion 0.333 kJ/g, 1 kJ = 1000 J.", "options": ["1.72 × 10⁴ J", "3.29 × 10⁴ J", "3.3 × 10⁴ J", "1.62 × 10⁴ J"], "answer": "B", "answer_text": "3.29 × 10⁴ J", "exp": "Warming the ice takes 50.0 g × 2.108 J/g°C × 5.0 °C = 527 J, melting it takes 50.0 g × 0.333 kJ/g = 16.65 kJ = 16,650 J, and warming the water takes 50.0 g × 4.18 J/g°C × 75.0 °C = 15,675 J, for a total of 32,852 J = 3.29 × 10⁴ J. The value 1.62 × 10⁴ J skips the melting step, 1.72 × 10⁴ J stops at 0 °C without warming the liquid, and 3.3 × 10⁴ J reports only two digits."}, {"id": 86, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "A heating curve for water shows a flat line at 0 °C while the ice is melting. What is happening to the molecules' energy along that flat line?", "options": ["Potential energy falls as the forces between molecules are pulled apart; kinetic energy holds constant.", "Both potential and kinetic energy rise, which is why melting needs so much heat to finish.", "Kinetic energy rises as the molecules speed up; potential energy holds constant.", "Potential energy rises as the forces between molecules are pulled apart; kinetic energy holds constant."], "answer": "D", "answer_text": "Potential energy rises as the forces between molecules are pulled apart; kinetic energy holds constant.", "exp": "The line is flat because the temperature is not changing, and temperature tracks average kinetic energy, so kinetic energy holds constant while the added heat goes into pulling the molecules apart and raising potential energy. Saying potential energy falls has it backwards — separating attracting particles always stores energy — and any answer with kinetic energy rising contradicts the flat thermometer reading."}, {"id": 87, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "For 15.0 g of water, compare two steps: warming the liquid from 0.0 °C to 100.0 °C, and boiling it at 100.0 °C. Use c(water) = 4.18 J/g°C, heat of vaporization 2.26 kJ/g, 1 kJ = 1000 J. Which step takes more heat, and by how much?", "options": ["Warming the liquid, by 2.76 × 10⁴ J", "Boiling, by 27.6 J", "Boiling, by 2.76 × 10⁴ J", "Boiling, by 2.8 × 10⁴ J"], "answer": "C", "answer_text": "Boiling, by 2.76 × 10⁴ J", "exp": "Warming the liquid takes 15.0 g × 4.18 J/g°C × 100.0 °C = 6270 J, while boiling takes 15.0 g × 2.26 kJ/g = 33.9 kJ = 33,900 J, so boiling takes 33,900 J − 6270 J = 27,630 J = 2.76 × 10⁴ J more. Phase changes always cost far more than temperature changes over the same sample; 27.6 J is the difference in kilojoules mislabeled as joules, and 2.8 × 10⁴ J drops a digit both terms supply."}, {"id": 88, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "Water spilled on the cold floor freezes solid. How much heat does 2.40 × 10² g of water release as it freezes at 0.0 °C? The heat of fusion of water is 0.333 kJ/g.", "options": ["+79.9 kJ", "−79.9 kJ", "−542 kJ", "−0.0799 kJ"], "answer": "B", "answer_text": "−79.9 kJ", "exp": "q = m × heat of fusion = 2.40 × 10² g × 0.333 kJ/g = 79.92 kJ = 79.9 kJ at three digits, and freezing releases heat, so the sign is negative. The value −542 kJ uses the heat of vaporization 2.26 kJ/g, −0.0799 kJ divides by 1000 when no conversion was asked for, and +79.9 kJ would say freezing absorbs energy."}, {"id": 89, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "How much heat does 12.0 g of steam release when it condenses to liquid water at 100.0 °C? Heat of vaporization 2.26 kJ/g, 1 kJ = 1000 J. Report the answer in joules with its sign.", "options": ["−2.71 × 10⁴ J", "+2.71 × 10⁴ J", "−27.1 J", "−4.00 × 10³ J"], "answer": "A", "answer_text": "−2.71 × 10⁴ J", "exp": "q = 12.0 g × 2.26 kJ/g = 27.12 kJ, which is 27.1 kJ at three digits, and 27.1 kJ × 1000 J/kJ = 2.71 × 10⁴ J; condensing forms attractions and releases heat, so the sign is negative. The value −27.1 J divides by 1000 instead of multiplying, −4.00 × 10³ J uses the heat of fusion 0.333 kJ/g, and +2.71 × 10⁴ J drops the sign."}, {"id": 90, "level": "Intermediate", "tag": "Phase Changes and Heating Curves", "stem": "A liquid recovered from the West Alcove is heated steadily. Its heating curve climbs, holds flat at 98 °C for several minutes, then climbs again. Boiling points: acetone 57 °C, ethyl alcohol 78 °C, lighter fluid 98 °C, water 100 °C. What does the flat line show?", "options": ["The sample stopped absorbing heat at 98 °C, so it must be water that is slightly impure.", "The sample is boiling, so 98 °C must be the flash point of the lighter fluid present.", "The sample is boiling at 98 °C, which matches lighter fluid rather than water.", "The sample is boiling at 98 °C, which matches ethyl alcohol rather than lighter fluid."], "answer": "C", "answer_text": "The sample is boiling at 98 °C, which matches lighter fluid rather than water.", "exp": "A plateau on a heating curve is a phase change: heat is still going in, but it is raising potential energy instead of temperature, and 98 °C is the boiling point of lighter fluid, two degrees below water's 100 °C. Ethyl alcohol would plateau at 78 °C, the sample never stops absorbing heat along the flat line, and the flash point of lighter fluid is −4 °C, a completely different property."}, {"id": 91, "level": "Intermediate", "tag": "Potential Energy Diagrams", "stem": "A potential energy diagram for a reaction in the alcove shows the reactants at 245 kJ and the products at 88 kJ. What is ΔH, and how is the reaction classified?", "options": ["+157 kJ, endothermic", "−333 kJ, exothermic", "−157 kJ, exothermic", "+333 kJ, endothermic"], "answer": "C", "answer_text": "−157 kJ, exothermic", "exp": "ΔH is products minus reactants: 88 kJ − 245 kJ = −157 kJ, and a negative ΔH with the products sitting lower means energy was released, so the reaction is exothermic. Answering +157 kJ reverses the subtraction and would call an energy-releasing reaction endothermic, while ±333 kJ adds the two levels instead of subtracting them."}, {"id": 92, "level": "Intermediate", "tag": "Potential Energy Diagrams", "stem": "Two potential energy diagrams are compared. Reaction A runs from 235 kJ down to 46 kJ, and Reaction B runs from 176 kJ down to 62 kJ. Which reaction releases more energy, and by how much more?", "options": ["Reaction A, by 75 kJ", "Reaction B, by 75 kJ", "Reaction A, by 59 kJ", "Reaction B, by 16 kJ"], "answer": "A", "answer_text": "Reaction A, by 75 kJ", "exp": "For A, ΔH = 46 kJ − 235 kJ = −189 kJ, and for B, ΔH = 62 kJ − 176 kJ = −114 kJ, so A releases 189 kJ − 114 kJ = 75 kJ more. The 59 kJ figure compares only the two reactant levels and the 16 kJ figure compares only the two product levels, while naming B ignores that A drops further overall."}, {"id": 93, "level": "Intermediate", "tag": "Potential Energy Diagrams", "stem": "The burning of acetone can be written as C₃H₆O(l) + 4O₂(g) → 3CO₂(g) + 3H₂O(g) + 1.77 × 10³ kJ. Which statement matches this thermochemical equation and its potential energy diagram?", "options": ["ΔH = −1.77 × 10³ kJ; the products sit above the reactants on the diagram.", "ΔH = −1.77 × 10³ kJ; the products sit below the reactants on the diagram.", "ΔH = +1.77 × 10³ kJ; the reaction pulls that energy in from its surroundings.", "ΔH = +1.77 × 10³ kJ; the products sit above the reactants on the diagram."], "answer": "B", "answer_text": "ΔH = −1.77 × 10³ kJ; the products sit below the reactants on the diagram.", "exp": "Energy written on the product side is energy given off, so the reaction is exothermic, ΔH = −1.77 × 10³ kJ, and the products must be drawn lower than the reactants. A positive ΔH would mean heat was absorbed and the energy term would appear with the reactants, and no diagram can show a negative ΔH with the products drawn higher."}, {"id": 94, "level": "Intermediate", "tag": "Potential Energy Diagrams", "stem": "A potential energy diagram is drawn for ice melting, with solid water on the left and liquid water on the right. The liquid is drawn ABOVE the solid. What does that tell you?", "options": ["Melting is endothermic; the molecules gained potential energy while the temperature held steady.", "Melting is endothermic; the molecules gained kinetic energy, which is why the line is drawn higher.", "Melting is exothermic; the molecules lost potential energy while the temperature held steady.", "Melting is exothermic; heat is given off as the forces between molecules are pulled apart."], "answer": "A", "answer_text": "Melting is endothermic; the molecules gained potential energy while the temperature held steady.", "exp": "Drawing the liquid higher means its potential energy is greater, and energy had to be absorbed to get there, so melting is endothermic. Melting happens at a constant 0 °C, so the average kinetic energy does not change; any answer calling melting exothermic has the arrows backwards, since pulling attracting molecules apart always costs energy."}, {"id": 95, "level": "Intermediate", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "At flashover the hot upper gas layer radiates 20. kW/m² down onto the floor. How much energy lands on a 1.5 m² patch of carpet in 30. s? Use 1 kW = 1000 W and 1 W = 1 J/s.", "options": ["9.0 × 10⁵ J", "3.0 × 10⁴ J", "9.0 × 10⁸ J", "9.0 × 10² J"], "answer": "A", "answer_text": "9.0 × 10⁵ J", "exp": "Convert first: 20. kW/m² × 1000 W/kW = 2.0 × 10⁴ W/m², then energy = 2.0 × 10⁴ J/s·m² × 1.5 m² × 30. s = 900,000 J = 9.0 × 10⁵ J at two digits. The value 9.0 × 10² J leaves the flux in kilowatts, 3.0 × 10⁴ J forgets to multiply by the 30. s, and 9.0 × 10⁸ J converts to watts a second time."}, {"id": 96, "level": "Intermediate", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "Radiation from the hot gas l
