ayer delivers 25 kW/m² onto a 0.80 m² block of polyurethane foam for 12 s. The block has a mass of 1.5 × 10³ g and c = 1.8 J/g°C. If all of that energy warmed the foam, what temperature rise would it produce? Use 1 kW = 1000 W and 1 W = 1 J/s.", "options": ["38 °C", "0.089 °C", "89 °C", "1.1 × 10² °C"], "answer": "C", "answer_text": "89 °C", "exp": "The foam receives 2.5 × 10⁴ J/s·m² × 0.80 m² × 12 s = 2.4 × 10⁵ J, so ΔT = q / (m × c) = 240,000 J / (1.5 × 10³ g × 1.8 J/g°C) = 240,000 J / 2700 J/°C = 88.9 °C, which is 89 °C at two digits. The value 0.089 °C never converted kilowatts to watts, 38 °C uses water's 4.18 J/g°C instead of the foam's 1.8 J/g°C, and 1.1 × 10² °C leaves out the 0.80 m² area."}, {"id": 97, "level": "Intermediate", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "The inquest evidence describes three things: the hot smoke layer rising and running along the ceiling, a steel column with one end in the fire growing hot several meters away along its length, and seats across the room igniting before any flame reaches them. Which set of mechanisms is correct, in that order?", "options": ["Convection, then radiation, then conduction.", "Convection, then conduction, then radiation.", "Radiation, then convection, then conduction.", "Conduction, then convection, then radiation."], "answer": "B", "answer_text": "Convection, then conduction, then radiation.", "exp": "Hot gas rising and spreading is convection, heat travelling along the metal of a column from the end sitting in the fire is conduction, and energy crossing an open room to distant seats without touching them is radiation. The seats did not heat by conduction — the carpet and polystyrene tiles between them are insulators, and the fire spread by flame spread and by radiation from the hot gas layer."}, {"id": 98, "level": "Intermediate", "tag": "Fire Science: Flash Point and Ignition", "stem": "Boiling points from the accelerant table: acetone 57 °C, ethyl alcohol 78 °C, lighter fluid 98 °C, mineral spirits 150–200 °C, paint thinner 135–175 °C. A floor surface reaches 105 °C. Which of these liquids would already have boiled away?", "options": ["Acetone and ethyl alcohol only", "Acetone, ethyl alcohol and lighter fluid", "Mineral spirits and paint thinner only", "All five, since 105 °C is above every flash point"], "answer": "B", "answer_text": "Acetone, ethyl alcohol and lighter fluid", "exp": "A liquid boils away once the surface passes its boiling point, and 105 °C is above 57 °C, 78 °C and 98 °C but below the 135–200 °C ranges of paint thinner and mineral spirits. Leaving lighter fluid out forgets that 98 °C is under 105 °C, and the answer naming all five confuses boiling point with flash point, which is the far lower temperature at which vapor will catch a flame."}, {"id": 99, "level": "Intermediate", "tag": "Fire Science: Flash Point and Ignition", "stem": "The store room sits at 20.0 °C. Flash points: acetone −20 °C, lighter fluid −4 °C, ethyl alcohol 13 °C, mineral spirits 35 °C, cooking oil 326 °C. Which liquids are ALREADY above their flash points in that room?", "options": ["Acetone, lighter fluid and ethyl alcohol", "Mineral spirits and cooking oil only", "All five, because the room is above 0 °C", "Acetone and lighter fluid only"], "answer": "A", "answer_text": "Acetone, lighter fluid and ethyl alcohol", "exp": "A liquid is above its flash point when the room is warmer than that temperature, and 20.0 °C is warmer than −20 °C, −4 °C and 13 °C, so those three are already giving off ignitable vapor. Mineral spirits at 35 °C and cooking oil at 326 °C are still below theirs, leaving ethyl alcohol out overlooks that 13 °C is under 20.0 °C, and being above 0 °C has nothing to do with it."}, {"id": 100, "level": "Intermediate", "tag": "Fire Science: Flash Point and Ignition", "stem": "The ceiling void reaches 225 °C with no spark or flame anywhere near it. Auto-ignition temperatures: lighter fluid 215 °C, kerosene 229 °C, mineral spirits 232 °C, paint thinner 253 °C, acetone 465 °C. Which vapor would ignite on its own at that temperature?", "options": ["All five, because 225 °C is above every flash point listed", "Only lighter fluid, whose point is 215 °C", "Lighter fluid and kerosene, at 215 °C and 229 °C", "Kerosene and mineral spirits, at 229 °C and 232 °C"], "answer": "B", "answer_text": "Only lighter fluid, whose point is 215 °C", "exp": "Auto-ignition needs the temperature to reach or pass that substance's auto-ignition point without any spark, and only lighter fluid's 215 °C is below 225 °C. Kerosene at 229 °C, mineral spirits at 232 °C, paint thinner at 253 °C and acetone at 465 °C all still need an ignition source, and flash points are a different, much lower property that says nothing about igniting on its own."}, {"id": 101, "level": "Intermediate", "tag": "Fire Science: Flash Point and Ignition", "stem": "Cooking oil has a flash point of 326 °C. A pan of it sits at 20.0 °C. How many degrees must the oil rise before it begins to give off ignitable vapor?", "options": ["306 °C", "16.3 °C", "346 °C", "306.0 °C"], "answer": "A", "answer_text": "306 °C", "exp": "The rise needed is 326 °C − 20.0 °C = 306 °C, and subtraction keeps the fewest decimal places, so the whole-number flash point holds the answer to the ones place: 306 °C. Writing 306.0 °C claims a tenths digit the 326 °C reading never supplied, 346 °C adds the two temperatures instead of subtracting, and 16.3 °C divides them."}, {"id": 102, "level": "Intermediate", "tag": "Fire Science: Flash Point and Ignition", "stem": "A 175 g steel tray (c = 0.50 J/g°C) holding paper is heated from 22.0 °C up to the 218 °C flash point of paper. How much heat does the tray itself absorb? Use 1 kJ = 1000 J.", "options": ["1.72 × 10⁴ J", "17 J", "1.7 × 10⁴ J", "1.9 × 10⁴ J"], "answer": "C", "answer_text": "1.7 × 10⁴ J", "exp": "ΔT = 218 °C − 22.0 °C = 196 °C to the ones place, so q = 175 g × 0.50 J/g°C × 196 °C = 17,150 J, but the two-digit 0.50 J/g°C holds the answer to 1.7 × 10⁴ J. The value 1.72 × 10⁴ J claims three digits, 1.9 × 10⁴ J uses 218 °C as the temperature change, and 17 J is the answer in kilojoules with the label left as joules."}, {"id": 103, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Isopropyl alcohol, C₃H₈O, has a heat of combustion of −33.4 kJ/g and a molar mass of 60.09 g/mol. Using ΔH = (heat per gram) × (molar mass), what is ΔH per mole?", "options": ["−2.01 × 10³ kJ/mol", "+2.01 × 10³ kJ/mol", "−0.556 kJ/mol", "−2007 kJ/mol"], "answer": "A", "answer_text": "−2.01 × 10³ kJ/mol", "exp": "ΔH = −33.4 kJ/g × 60.09 g/mol = −2007.0 kJ/mol, and the three-digit heat of combustion limits it to −2.01 × 10³ kJ/mol. The value −2007 kJ/mol keeps four digits that −33.4 kJ/g cannot support, −0.556 kJ/mol divides by the molar mass instead of multiplying, and +2.01 × 10³ kJ/mol drops the sign that marks combustion as exothermic."}, {"id": 104, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Hexane, C₆H₁₄, is a solvent with a heat of combustion of −48.3 kJ/g. Using atomic masses C = 12.01 and H = 1.008, and ΔH = (heat per gram) × (molar mass), what is ΔH per mole?", "options": ["−4.16 × 10³ kJ/mol", "+4.16 × 10³ kJ/mol", "−4.2 × 10³ kJ/mol", "−3.48 × 10³ kJ/mol"], "answer": "A", "answer_text": "−4.16 × 10³ kJ/mol", "exp": "The molar mass is 6(12.01) + 14(1.008) = 72.06 + 14.112 = 86.17 g/mol, so ΔH = −48.3 kJ/g × 86.17 g/mol = −4162.0 kJ/mol = −4.16 × 10³ kJ/mol at three digits. The value −3.48 × 10³ kJ/mol comes from a molar mass of 72.15 g/mol, which belongs to C₅H₁₂ and not to hexane, −4.2 × 10³ kJ/mol drops to two digits when the data supports three, and +4.16 × 10³ kJ/mol loses the sign that marks the reaction as exothermic."}, {"id": 105, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Acetone, C₃H₆O, is one of the accelerants tested in the case file. Which equation for its complete combustion is correctly balanced?", "options": ["C₃H₆O + 4O₂ → 3CO₂ + 4H₂O", "C₃H₆O + 3O₂ → 3CO₂ + 3H₂O", "C₃H₆O + 4O₂ → 3CO₂ + 3H₂O", "C₃H₆O + 4O₂ → 2CO₂ + 3H₂O"], "answer": "C", "answer_text": "C₃H₆O + 4O₂ → 3CO₂ + 3H₂O", "exp": "Counting atoms in C₃H₆O + 4O₂ → 3CO₂ + 3H₂O gives 3 C, 6 H and 1 + 8 = 9 O on the left against 3 C, 6 H and 6 + 3 = 9 O on the right. Using 3O₂ leaves only 7 O on the left against 9 on the right, writing 4H₂O demands 8 H when acetone supplies 6, and 2CO₂ strands one of the three carbon atoms."}, {"id": 106, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Paint thinner, C₁₀H₁₆, has a heat of combustion of −45.5 kJ/g and a molar mass of 136.24 g/mol. What is ΔH per mole?", "options": ["−6.199 × 10³ kJ/mol", "−0.334 kJ/mol", "−6.2 × 10³ kJ/mol", "−6.20 × 10³ kJ/mol"], "answer": "D", "answer_text": "−6.20 × 10³ kJ/mol", "exp": "ΔH = −45.5 kJ/g × 136.24 g/mol = −6198.9 kJ/mol, and three digits from −45.5 kJ/g give −6.20 × 10³ kJ/mol, where the final zero is a real digit and must be written. The value −6.2 × 10³ kJ/mol shows only two digits, −6.199 × 10³ kJ/mol claims four, and −0.334 kJ/mol divides by the molar mass instead of multiplying by it."}, {"id": 107, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Acetone releases 30.5 kJ of heat per gram burned. An 8.40 g spill burns completely. Using 1 kJ = 1000 J, how much heat is released, in joules?", "options": ["−0.256 J", "+2.56 × 10⁵ J", "−2.56 × 10² J", "−2.56 × 10⁵ J"], "answer": "D", "answer_text": "−2.56 × 10⁵ J", "exp": "q = 8.40 g × (−30.5 kJ/g) = −256 kJ, and −256 kJ × 1000 J/kJ = −2.56 × 10⁵ J, written with three digits because both measurements carry three. The value −2.56 × 10² J is the kilojoule answer with the unit changed but the number left alone, −0.256 J divides by 1000 instead of multiplying, and the positive value loses the sign that marks the heat as released."}, {"id": 108, "level": "Intermediate", "tag": "Heat of Combustion", "stem": "Ethanol (C₂H₆O, 46.07 g/mol) and lighter fluid (C₅H₁₂, 72.15 g/mol) both release 29.7 kJ per gram burned. Which releases more energy per MOLE?", "options": ["Neither, since both release 29.7 kJ per mole just as they do per gram", "Lighter fluid, 2.14 × 10³ kJ/mol against ethanol's 1.37 × 10³ kJ/mol", "Ethanol, because a smaller molar mass packs more energy into every mole", "Ethanol, 1.37 × 10³ kJ/mol against lighter fluid's 2.14 × 10³ kJ/mol"], "answer": "B", "answer_text": "Lighter fluid, 2.14 × 10³ kJ/mol against ethanol's 1.37 × 10³ kJ/mol", "exp": "Multiply the heat per gram by the molar mass: ethanol gives 29.7 kJ/g × 46.07 g/mol = 1368 kJ/mol = 1.37 × 10³ kJ/mol, while lighter fluid gives 29.7 kJ/g × 72.15 g/mol = 2143 kJ/mol = 2.14 × 10³ kJ/mol. A mole of the heavier molecule weighs more, so it carries more grams and more energy; saying both release 29.7 kJ per mole confuses the per-gram value with the per-mole value, and a smaller molar mass gives fewer grams per mole, not more energy."}, {"id": 109, "level": "Advanced", "tag": "Specific Heat", "stem": "A study guide's reference box lists the specific heat of steel as “0.50 J/g” and defines it as “the heat needed to raise the temperature of a sample by 1 °C.” Using q = m × c × ΔT, a 125 g steel bolt from a fire scene is warmed from 22.0 °C to 42.0 °C. Which correction and result go together?", "options": ["1250 J, and the unit is J/g°C, because each digit of the product is a measured digit", "1.3 × 10³ J, and the unit is J/g, because the degree cancels out inside q = m × c × ΔT", "2.6 × 10³ J, and the unit is J/g°C, because ΔT is the final temperature, 42.0 °C", "1.3 × 10³ J, and the unit is J/g°C, because specific heat is heat per gram per degree"], "answer": "D", "answer_text": "1.3 × 10³ J, and the unit is J/g°C, because specific heat is heat per gram per degree", "exp": "Specific heat is heat per gram per degree, so steel is 0.50 J/g°C, and q = (125 g)(0.50 J/g°C)(42.0 − 22.0 °C) = 1250 J, reported as 1.3 × 10³ J because 0.50 J/g°C carries only two digits. Writing the unit as J/g throws away the degree the definition depends on, 1250 J shows four digits from two-digit data, and 2.6 × 10³ J comes from using 42.0 °C in place of ΔT = 20.0 °C."}, {"id": 110, "level": "Advanced", "tag": "Specific Heat", "stem": "A 45.0 g metal chip pulled from the debris absorbs 8.1 × 10² J and its temperature climbs from 21.5 °C to 41.5 °C. Use q = m × c × ΔT and this list of specific heats in J/g°C: aluminum 0.90, iron 0.451, lead 0.130, beryllium 1.83, manganese 0.48, copper 0.38, steel 0.50. What is the specific heat, and which metal fits?", "options": ["0.90 J/g°C, matching aluminum, from 8.1 × 10² J ÷ (45.0 g × 20.0 °C)", "18 J/g°C, matching no listed metal, from 8.1 × 10² J ÷ 45.0 g with no ΔT", "0.43 J/g°C, matching no listed metal, from 8.1 × 10² J ÷ (45.0 g × 41.5 °C)", "0.9 J/g°C, matching aluminum, since a trailing zero is never a reported digit"], "answer": "A", "answer_text": "0.90 J/g°C, matching aluminum, from 8.1 × 10² J ÷ (45.0 g × 20.0 °C)", "exp": "ΔT = 41.5 − 21.5 = 20.0 °C, so c = 8.1 × 10² J ÷ (45.0 g × 20.0 °C) = 0.90 J/g°C, the value listed for aluminum, and two digits are right because 8.1 × 10² J has two. Dividing by 41.5 °C uses the final temperature instead of the change and gives 0.43 J/g°C, leaving ΔT out entirely gives 18 J/g°C, and writing 0.9 J/g°C hides a digit the measurement earned."}, {"id": 111, "level": "Advanced", "tag": "Specific Heat", "stem": "Two blocks, each 1.00 × 10² g, sit on a hot plate: one aluminum (c = 0.90 J/g°C) and one copper (c = 0.38 J/g°C). Each absorbs 5.0 × 10² J. Using q = m × c × ΔT, which block warms more, and by how much?", "options": ["Aluminum by 13 °C and copper by 5.6 °C, since a larger specific heat always gives a bigger rise", "Copper by 13.2 °C and aluminum by 5.56 °C, keeping every digit the calculator shows", "Copper by 13 °C and aluminum by 5.6 °C, since a smaller specific heat gives a bigger rise", "Both by 5.6 °C, since equal masses given equal heat must change temperature equally"], "answer": "C", "answer_text": "Copper by 13 °C and aluminum by 5.6 °C, since a smaller specific heat gives a bigger rise", "exp": "Rearranging gives ΔT = q ÷ (m × c), so copper rises 5.0 × 10² J ÷ (1.00 × 10² g × 0.38 J/g°C) = 13 °C while aluminum rises 5.0 × 10² J ÷ (1.00 × 10² g × 0.90 J/g°C) = 5.6 °C, each held to two digits by 5.0 × 10² J. Saying aluminum rises 13 °C reverses the roles of the specific heats, 13.2 °C and 5.56 °C claim a third digit, and equal rises would require equal specific heats, which 0.90 and 0.38 are not."}, {"id": 112, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "A student's worked solution for a dissolving test reads: “1.5 g of ammonium nitrate was stirred into 5.0 g of water; the water fell from 22.4 °C to 8.6 °C, so q = 1.5 g × 4.18 J/g°C × 13.8 °C = 86.5 J.” Water is 4.18 J/g°C. What is q for the water?", "options": ["−2.9 × 10² J, because q = m × c × ΔT takes the 5.0 g of water, not the 1.5 g of solid", "−86.5 J, because the 1.5 g of dissolved solid is the mass whose temperature really changed", "+2.9 × 10² J, because the 5.0 g of water is right but ΔT is 22.4 − 8.6 = 13.8 °C", "−288 J, because the 5.0 g of water is right and every digit of the product is kept"], "answer": "A", "answer_text": "−2.9 × 10² J, because q = m × c × ΔT takes the 5.0 g of water, not the 1.5 g of solid", "exp": "The thermometer sits in the water, so the mass in q = m × c × ΔT is the 5.0 g of water: q = (5.0 g)(4.18 J/g°C)(8.6 − 22.4 °C) = −288.42 J, or −2.9 × 10² J for the two digits in 5.0 g. Using 1.5 g gives −86.5 J for a mass that was never the thermometer's surroundings, −288 J shows three digits from two-digit data, and +2.9 × 10² J flips ΔT = T_final − T_initial, which is negative when water cools."}, {"id": 113, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "A 55.0 g iron bolt (c = 0.451 J/g°C) heated to 98.5 °C is dropped into water in a foam cup, and the bolt cools to 25.4 °C. Using q = m × c × ΔT with ΔT = T_final − T_initial, how much heat did the bolt release?", "options": ["+1.81 × 10³ J, from (55.0 g)(0.451 J/g°C)(98.5 − 25.4 °C)", "−1.81 × 10³ J, from (55.0 g)(0.451 J/g°C)(25.4 − 98.5 °C)", "−1.68 × 10⁴ J, from (55.0 g)(4.18 J/g°C)(25.4 − 98.5 °C)", "−1813 J, from (55.0 g)(0.451 J/g°C)(25.4 − 98.5 °C) with four digits kept"], "answer": "B", "answer_text": "−1.81 × 10³ J, from (55.0 g)(0.451 J/g°C)(25.4 − 98.5 °C)", "exp": "ΔT = 25.4 − 98.5 = −73.1 °C, so q = (55.0 g)(0.451 J/g°C)(−73.1 °C) = −1813.2 J, reported as −1.81 × 10³ J for three digits, and the negative sign says the bolt gave heat away. A positive 1.81 × 10³ J subtracts the temperatures backwards, −1.68 × 10⁴ J uses water's 4.18 J/g°C for an iron bolt, and −1813 J shows a fourth digit the data cannot support."}, {"id": 114, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "A calorimeter holds 2.50 × 10² g of water at 24.6 °C. A hot copper cylinder is dropped in and the water rises to 31.2 °C before both settle. Water is 4.18 J/g°C and copper is 0.38 J/g°C. If the cup loses no heat to the room, how much heat did the copper release?", "options": ["−6.3 × 10² J, from (2.50 × 10² g)(0.38 J/g°C)(6.6 °C), copper's specific heat", "−6897 J, from (2.50 × 10² g)(4.18 J/g°C)(6.6 °C) with four digits kept", "+6.9 × 10³ J, since the copper and the water both gain heat in the cup", "−6.9 × 10³ J, the mirror image of the +6.9 × 10³ J the water gained"], "answer": "D", "answer_text": "−6.9 × 10³ J, the mirror image of the +6.9 × 10³ J the water gained", "exp": "The water gained q = (2.50 × 10² g)(4.18 J/g°C)(31.2 − 24.6 °C) = 6897 J, or 6.9 × 10³ J for the two digits in ΔT = 6.6 °C, and heat lost by the copper equals heat gained by the water, so q for the copper is −6.9 × 10³ J. A positive value would mean nothing cooled, −6897 J keeps four digits, and −6.3 × 10² J puts copper's specific heat with the water's mass and temperature change."}, {"id": 115, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "A study guide's worked solution reads: “4.50 × 10² g of water is heated from 18.0 °C to 88.0 °C, so q = 450 g × 4.18 J/g°C × 88.0 °C = 1.66 × 10⁵ J.” Water is 4.18 J/g°C and ΔT = T_final − T_initial. What is the correct value of q?", "options": ["+1.66 × 10⁵ J, because the final temperature 88.0 °C is the ΔT the equation calls for", "+3.39 × 10⁴ J, because the starting temperature 18.0 °C is the ΔT the equation calls for", "+1.32 × 10⁵ J, because ΔT = 88.0 − 18.0 = 70.0 °C, not the final temperature alone", "+1.3 × 10⁵ J, because ΔT = 70.0 °C is right but only two digits may be reported"], "answer": "C", "answer_text": "+1.32 × 10⁵ J, because ΔT = 88.0 − 18.0 = 70.0 °C, not the final temperature alone", "exp": "ΔT is a change, so ΔT = 88.0 − 18.0 = 70.0 °C and q = (4.50 × 10² g)(4.18 J/g°C)(70.0 °C) = 131,670 J = +1.32 × 10⁵ J, three digits throughout. Using 88.0 °C gives 1.66 × 10⁵ J, using 18.0 °C gives 3.39 × 10⁴ J, and +1.3 × 10⁵ J drops a digit that 4.50 × 10², 4.18 and 70.0 all support."}, {"id": 116, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "A fire investigator heats 8.00 × 10² g of water in a steel pot from 15.5 °C to 92.0 °C to test a heating element. Water is 4.18 J/g°C and 1 kJ = 1000 J. How much heat did the water absorb, in kilojoules?", "options": ["+255.816 kJ, from 255,816 J ÷ 1000 J/kJ with every digit kept", "+2.56 × 10⁸ kJ, from 2.56 × 10⁵ J × 1000 J/kJ, scaling up twice over", "+2.56 × 10⁵ kJ, since the product of m, c and ΔT is already in kilojoules", "+256 kJ, from 255,816 J = 2.56 × 10⁵ J, then ÷ 1000 J/kJ"], "answer": "D", "answer_text": "+256 kJ, from 255,816 J = 2.56 × 10⁵ J, then ÷ 1000 J/kJ", "exp": "q = (8.00 × 10² g)(4.18 J/g°C)(92.0 − 15.5 °C) = 255,816 J = 2.56 × 10⁵ J to three digits, and 2.56 × 10⁵ J ÷ 1000 J/kJ = 256 kJ. Calling it 2.56 × 10⁵ kJ skips the conversion, 2.56 × 10⁸ kJ multiplies where it should divide, and 255.816 kJ reports six digits from three-digit data."}, {"id": 117, "level": "Advanced", "tag": "Calorimetry and q = mcΔT", "stem": "Adding 1.05 × 10⁴ J of heat to a beaker of water raises it from 20.0 °C to 45.0 °C. Water is 4.18 J/g°C, and q = m × c × ΔT can be rearranged to m = q ÷ (c × ΔT). What mass of water is in the beaker?", "options": ["1.10 × 10⁶ g, from 1.05 × 10⁴ J × 4.18 J/g°C × 25.0 °C, multiplying", "55.8 g, from 1.05 × 10⁴ J ÷ (4.18 J/g°C × 45.0 °C)", "2.51 × 10³ g, from 1.05 × 10⁴ J ÷ 4.18 J/g°C with no ΔT", "1.00 × 10² g, from 1.05 × 10⁴ J ÷ (4.18 J/g°C × 25.0 °C)"], "answer": "D", "answer_text": "1.00 × 10² g, from 1.05 × 10⁴ J ÷ (4.18 J/g°C × 25.0 °C)", "exp": "ΔT = 45.0 − 20.0 = 25.0 °C, so m = 1.05 × 10⁴ J ÷ (4.18 J/g°C × 25.0 °C) = 100.48 g, written 1.00 × 10² g so that all three digits show. Dividing by 45.0 °C uses the final temperature and gives 55.8 g, multiplying instead of dividing gives 1.10 × 10⁶ g, and leaving ΔT out gives 2.51 × 10³ g."}, {"id": 118, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A study guide's worked solution reads: “20.0 g of water is heated from 50.0 °C to 150.0 °C, so q = (20.0)(4.18)(50.0) + (20.0)(1.996)(50.0) = 4180 J + 1996 J = 6.18 × 10³ J.” Water is 4.18 J/g°C, steam is 1.996 J/g°C, heat of vaporization is 2.26 kJ/g and heat of fusion is 0.333 kJ/g. What is the correct total?", "options": ["5.14 × 10⁴ J, once the 4.52 × 10⁴ J of vaporizing at 100 °C joins the two heating steps", "6.18 × 10³ J, since those two heating steps already span 50.0 °C all the way up to 150.0 °C", "5.80 × 10⁴ J, once vaporizing and 0.333 kJ/g of fusion both join the two heating steps", "4.94 × 10⁴ J, once vaporizing joins the liquid step but the steam step is left out"], "answer": "A", "answer_text": "5.14 × 10⁴ J, once the 4.52 × 10⁴ J of vaporizing at 100 °C joins the two heating steps", "exp": "Water at 50.0 °C must be warmed to 100 °C, (20.0)(4.18)(50.0) = 4180 J, boiled away, (20.0 g)(2260 J/g) = 45,200 J, then the steam warmed to 150.0 °C, (20.0)(1.996)(50.0) = 1996 J, a total of 51,376 J = 5.14 × 10⁴ J. Stopping at 6.18 × 10³ J skips the boiling plateau, which is by far the largest step; 4.94 × 10⁴ J leaves out the steam; and 5.80 × 10⁴ J adds melting to a sample that is already liquid."}, {"id": 119, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A study guide's worked solution reads: “50.0 g of ice at −5.0 °C is heated to water at 75.0 °C, so q = (50.0)(2.108)(5.0) + (50.0)(4.18)(75.0) = 527 J + 15,675 J = 1.62 × 10⁴ J.” Ice is 2.108 J/g°C, water is 4.18 J/g°C, heat of fusion is 0.333 kJ/g and heat of vaporization is 2.26 kJ/g. What is the correct total?", "options": ["3.29 × 10⁴ J, once the 1.67 × 10⁴ J of melting at 0 °C joins the two heating steps", "3.23 × 10⁴ J, once melting joins the liquid step but the ice below 0 °C is left out", "1.62 × 10⁴ J, since warming the ice and warming the water already cover the range", "1.46 × 10⁵ J, once melting and 2.26 kJ/g of vaporizing both join the two heating steps"], "answer": "A", "answer_text": "3.29 × 10⁴ J, once the 1.67 × 10⁴ J of melting at 0 °C joins the two heating steps", "exp": "The ice warms, (50.0)(2.108)(5.0) = 527 J, melts, (50.0 g)(333 J/g) = 16,650 J, then the water warms, (50.0)(4.18)(75.0) = 15,675 J, giving 32,852 J = 3.29 × 10⁴ J. Stopping at 1.62 × 10⁴ J skips the melting plateau, 1.46 × 10⁵ J boils water that never reaches 100 °C, and 3.23 × 10⁴ J forgets the 527 J that carries the ice from −5.0 °C up to 0 °C."}, {"id": 120, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A study guide claims that “changing the temperature of water always takes more energy than changing its state.” Test the claim on 1.00 × 10² g of water: first heating it from 0.0 °C to 100.0 °C, then boiling all of it away. Water is 4.18 J/g°C, heat of vaporization is 2.26 kJ/g and 1 kJ = 1000 J. What do the numbers show?", "options": ["Boiling takes more, 226 kJ against 41.8 kJ, about 184 times as much energy", "The two match at 41.8 kJ each, because the same 1.00 × 10² g of water is involved", "Heating takes more, 41.8 kJ against 22.6 kJ, because 100.0 °C is a wide span to cross", "Boiling takes more, 226 kJ against 41.8 kJ, about 5.41 times as much energy"], "answer": "D", "answer_text": "Boiling takes more, 226 kJ against 41.8 kJ, about 5.41 times as much energy", "exp": "Heating takes q = (1.00 × 10² g)(4.18 J/g°C)(100.0 °C) = 41,800 J = 41.8 kJ, while boiling takes (1.00 × 10² g)(2.26 kJ/g) = 226 kJ, and 226 ÷ 41.8 = 5.41, so the phase change costs far more and the claim fails. The 22.6 kJ figure misplaces a decimal in 2.26 kJ/g, equal totals would require the plateau to cost nothing, and 184 is the difference 226 − 41.8 in kJ, not a ratio."}, {"id": 121, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A 32.0 g block of ice at 0.0 °C is carried all the way to steam at 100.0 °C. Water is 4.18 J/g°C, heat of fusion is 0.333 kJ/g, heat of vaporization is 2.26 kJ/g and 1 kJ = 1000 J. Which single step absorbs the most heat?", "options": ["Warming the liquid from 0.0 to 100.0 °C, which takes 13.4 kJ, the widest span shown", "Melting at 0.0 °C, which takes 10.7 kJ, because pulling a solid apart costs the most", "Boiling at 100.0 °C, which takes 72.3 J, more than the other two steps together", "Boiling at 100.0 °C, which takes 72.3 kJ, more than the other two steps together"], "answer": "D", "answer_text": "Boiling at 100.0 °C, which takes 72.3 kJ, more than the other two steps together", "exp": "Melting takes (32.0 g)(0.333 kJ/g) = 10.7 kJ, warming the liquid takes (32.0)(4.18)(100.0) = 13,376 J = 13.4 kJ, and boiling takes (32.0 g)(2.26 kJ/g) = 72.3 kJ, which beats 10.7 + 13.4 = 24.1 kJ combined. Melting is the smaller plateau, the liquid step is smaller still, and 72.3 J confuses joules with the kilojoules that (g)(kJ/g) already gives."}, {"id": 122, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A study guide converts the heat needed to melt 50.0 g of ice at 0 °C, 16.7 kJ, into joules this way: “16.7 kJ ÷ 1000 = 0.0167 J.” Heat of fusion is 0.333 kJ/g and 1 kJ = 1000 J. What is the correct value in joules?", "options": ["16.7 J, since kilojoules and joules differ only in the name written after the number", "1.67 × 10⁷ J, since the factor of 1000 has to be applied twice to reach joules", "1.67 × 10⁴ J, since each kilojoule is 1000 joules, so the count of joules is larger", "0.0167 J, since dividing by 1000 is what turns kilojoules into joules"], "answer": "C", "answer_text": "1.67 × 10⁴ J, since each kilojoule is 1000 joules, so the count of joules is larger", "exp": "Melting takes (50.0 g)(0.333 kJ/g) = 16.65 kJ = 16.7 kJ, and 16.7 kJ × 1000 J/kJ = 1.67 × 10⁴ J, since a joule is the smaller unit and it takes many of them. Dividing gives 0.0167 J, less heat than a lit match delivers; 1.67 × 10⁷ J applies the factor twice; and 16.7 J treats the prefix as decoration."}, {"id": 123, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "How much heat must be removed to turn 75.0 g of liquid water at 18.0 °C into ice at −12.0 °C? Water is 4.18 J/g°C, ice is 2.108 J/g°C, heat of fusion is 0.333 kJ/g and heat of vaporization is 2.26 kJ/g.", "options": ["−2.02 × 10⁵ J, adding the three steps plus 2.26 kJ/g for condensing the water first", "+3.25 × 10⁴ J, adding the same three steps, since removing heat makes q positive", "−7.54 × 10³ J, adding the two cooling steps, since freezing releases no heat at all", "−3.25 × 10⁴ J, adding −5.64 × 10³ J, −2.50 × 10⁴ J and −1.90 × 10³ J"], "answer": "D", "answer_text": "−3.25 × 10⁴ J, adding −5.64 × 10³ J, −2.50 × 10⁴ J and −1.90 × 10³ J", "exp": "Cooling the liquid gives (75.0)(4.18)(−18.0) = −5643 J, freezing gives −(75.0 g)(333 J/g) = −24,975 J, and cooling the ice gives (75.0)(2.108)(−12.0) = −1897 J, a total of −32,515 J = −3.25 × 10⁴ J. A positive q would mean the sample absorbed heat while it froze, −7.54 × 10³ J drops the freezing plateau, and −2.02 × 10⁵ J condenses steam that never existed in a sample that starts as liquid."}, {"id": 124, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A 40.0 g block of ice starts at −20.0 °C, and exactly 8.00 × 10³ J of heat is added to it. Ice is 2.108 J/g°C, water is 4.18 J/g°C and heat of fusion is 0.333 kJ/g. What is the sample doing at that point?", "options": ["Sitting at 27.8 °C as liquid water, since all 8.00 × 10³ J went into raising temperature", "Sitting at 0.0 °C fully melted, since 8.00 × 10³ J is more than the ice needs to melt", "Sitting at 0.0 °C part way through melting, with about 19.0 g of the ice melted", "Sitting at −20.0 °C still, since ice absorbs no heat until it has reached 0.0 °C"], "answer": "C", "answer_text": "Sitting at 0.0 °C part way through melting, with about 19.0 g of the ice melted", "exp": "Warming the ice to 0.0 °C uses (40.0)(2.108)(20.0) = 1686 J, leaving 8000 − 1686 = 6314 J for melting, but melting it all would take (40.0 g)(333 J/g) = 13,320 J, so the sample sits on the plateau with 6314 J ÷ 333 J/g = 19.0 g melted. Reaching 27.8 °C ignores both plateaus, staying at −20.0 °C ignores the ice's own specific heat, and full melting would need 13,320 J, well past the 8.00 × 10³ J supplied."}, {"id": 125, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "A steam line releases 4.52 × 10⁵ J of heat as steam at 100.0 °C condenses to water at 100.0 °C. Heat of vaporization is 2.26 kJ/g, heat of fusion is 0.333 kJ/g and 1 kJ = 1000 J. What mass of steam condensed?", "options": ["2.00 × 10⁵ g, from 4.52 × 10⁵ J ÷ 2.26 kJ/g with no unit conversion", "2.00 × 10² g, from 4.52 × 10⁵ J ÷ 2260 J/g, both in joules", "1.02 × 10⁹ g, from 4.52 × 10⁵ J × 2260 J/g, multiplying instead", "1.36 × 10³ g, from 4.52 × 10⁵ J ÷ 333 J/g, the heat of fusion"], "answer": "B", "answer_text": "2.00 × 10² g, from 4.52 × 10⁵ J ÷ 2260 J/g, both in joules", "exp": "Condensing runs on q = m × (heat of vaporization), so m = 4.52 × 10⁵ J ÷ 2260 J/g = 200 g, written 2.00 × 10² g so that three digits show. Using 333 J/g gives 1.36 × 10³ g from the wrong plateau, multiplying gives 1.02 × 10⁹ g, and dividing joules by kilojoules per gram gives 2.00 × 10⁵ g, a thousand times too much steam."}, {"id": 126, "level": "Advanced", "tag": "Phase Changes and Heating Curves", "stem": "How much heat is released when 1.00 × 10² g of steam at 125.0 °C is cooled to liquid water at 60.0 °C? Steam is 1.996 J/g°C, water is 4.18 J/g°C, heat of vaporization is 2.26 kJ/g and heat of fusion is 0.333 kJ/g.", "options": ["−2.17 × 10⁴ J, adding the two cooling steps, since condensing releases no heat", "+2.48 × 10⁵ J, adding the same three steps, since a cooling sample reports a positive q", "−2.48 × 10⁵ J, adding −4.99 × 10³ J, −2.26 × 10⁵ J and −1.67 × 10⁴ J", "−2.81 × 10⁵ J, adding the three steps plus 0.333 kJ/g for freezing the water as well"], "answer": "C", "answer_text": "−2.48 × 10⁵ J, adding −4.99 × 10³ J, −2.26 × 10⁵ J and −1.67 × 10⁴ J", "exp": "Cooling the steam gives (1.00 × 10²)(1.996)(−25.0) = −4990 J, condensing gives −(1.00 × 10² g)(2260 J/g) = −226,000 J, and cooling the liquid gives (1.00 × 10²)(4.18)(−40.0) = −16,720 J, a total of −247,710 J = −2.48 × 10⁵ J. Dropping the plateau leaves only −2.17 × 10⁴ J, −2.81 × 10⁵ J freezes water that stops at 60.0 °C, and a positive q would say the sample took heat in while it cooled."}, {"id": 127, "level": "Advanced", "tag": "Potential Energy Diagrams", "stem": "A study guide states: “While ice melts at 0 °C, the potential energy of the molecules decreases and the kinetic energy stays constant.” On a heating curve, the melting plateau is flat, so the temperature does not change. Which description of the melting plateau is correct?", "options": ["Potential energy rises and kinetic energy rises, since the temperature climbs across the melting step", "Potential energy falls and kinetic energy holds steady, since molecules settle into a lower state", "Potential energy rises and kinetic energy holds steady, since heat goes into pulling molecules apart", "Potential energy holds steady and kinetic energy rises, since added heat always speeds molecules up"], "answer": "C", "answer_text": "Potential energy rises and kinetic energy holds steady, since heat goes into pulling molecules apart", "exp": "Temperature measures average kinetic energy, and the plateau is flat, so kinetic energy is unchanged while every joule goes into separating molecules against their attractions, which raises potential energy. Saying potential energy falls describes freezing, not melting; a rise in kinetic energy would tilt the plateau upward; and both rising contradicts the flat line on the curve."}, {"id": 128, "level": "Advanced", "tag": "Potential Energy Diagrams", "stem": "A potential energy diagram drawn for burning 1 mol of ethyl alcohol places the reactants at +2.10 × 10² kJ and the products at −1.160 × 10³ kJ on the same energy axis. ΔH is the products' energy minus the reactants' energy. What is ΔH, and how is the reaction classified?", "options": ["−1.370 × 10³ kJ, exothermic, because the products sit below the reactants on the diagram", "+1.370 × 10³ kJ, endothermic, because the drop is read as an energy gain instead", "+1.160 × 10³ kJ, endothermic, because the products' energy alone is what ΔH reports", "−9.50 × 10² kJ, exothermic, because the two energies are combined by adding them"], "answer": "A", "answer_text": "−1.370 × 10³ kJ, exothermic, because the products sit below the reactants on the diagram", "exp": "ΔH = products − reactants = −1.160 × 10³ kJ − (+2.10 × 10² kJ) = −1.370 × 10³ kJ, and a negative ΔH with products below reactants is exothermic, which matches a fuel that heats its surroundings. Both values are known to the units place, so the difference is too, which is why the answer carries four digits. Reporting +1.370 × 10³ kJ reverses the subtraction, −9.50 × 10² kJ adds instead of subtracting, and +1.160 × 10³ kJ ignores where the reactants started."}, {"id": 129, "level": "Advanced", "tag": "Potential Energy Diagrams", "stem": "A hose delivers 55.0 g of water into a burning room; the water reaches 100.0 °C and then all of it boils away in the hot gas layer. Heat of vaporization is 2.26 kJ/g and heat of fusion is 0.333 kJ/g. Which description of that boiling step, drawn on a potential energy diagram, is correct?", "options": ["Endothermic, +124 kJ taken in, and the water's potential energy rises as it boils", "Endothermic, +124 kJ taken in, and the water's potential energy falls as it boils", "Exothermic, −124 kJ given off, and the water's potential energy rises as it boils", "Exothermic, −18.3 kJ given off, and the water's potential energy falls as it boils"], "answer": "A", "answer_text": "Endothermic, +124 kJ taken in, and the water's potential energy rises as it boils", "exp": "Boiling takes q = (55.0 g)(2.26 kJ/g) = +124 kJ pulled out of the fire, so the step is endothermic, and separating the molecules raises their potential energy. Calling it exothermic reverses the direction of the heat that makes water useful on a fire, a falling potential energy describes condensing, and 18.3 kJ comes from the fusion value 0.333 kJ/g rather than vaporization."}, {"id": 130, "level": "Advanced", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "A study guide explains a nightclub fire by saying the flames crossed a seating alcove “because the polystyrene ceiling tiles and the carpet conducted the heat sideways so well.” Polystyrene and carpet are both poor conductors, and the burning gases collected in a hot layer under the ceiling. Which explanation fits the materials?", "options": ["Conduction along the steel roof beams, which move heat faster than any flame front", "Convection only, since hot gases sink to floor level and heat the seats from below", "Radiation down from the hot gas layer, since polystyrene and carpet are insulators", "Conduction through the polystyrene and carpet, both excellent thermal conductors"], "answer": "C", "answer_text": "Radiation down from the hot gas layer, since polystyrene and carpet are insulators", "exp": "Polystyrene and carpet are thermal insulators, so heat does not travel far through them; the spread comes from flame moving across surfaces and from radiation beaming down out of the hot gas layer overhead. Calling those materials excellent conductors reverses a property they are chosen for, steel beams sit above the ceiling and are not the path, and hot gases rise rather than sink."}, {"id": 131, "level": "Advanced", "tag": "Heat Transfer: Conduction, Convection, Radiation", "stem": "In a room fire the smoke and hot gases gather in a layer beneath the ceiling; flashover is reached once that layer is at least 6.0 × 10² °C and the floor is receiving at least 20 kW/m². Which pairing of heat transfer modes describes how the room reaches that condition?", "options": ["Convection carries the hot gases up to the ceiling and radiation from that layer heats the floor", "Convection carries the hot gases up to the ceiling and conduction through air heats the floor", "Radiation carries the hot gases up to the ceiling and conduction from that layer heats the floor", "Conduction carries the hot gases up to the ceiling and convection from that layer heats the floor"], "answer": "A", "answer_text": "Convection carries the hot gases up to the ceiling and radiation from that layer heats the floor", "exp": "Convection is the bulk movement of a heated fluid, which is exactly how buoyant smoke rises and pools at the ceiling, and that glowing layer then sends energy down to the floor as radiation, no contact needed. Conduction needs touching particles and moves nothing through open air, and radiation does not carry gas anywhere; naming it as the lifting mechanism confuses the energy with the smoke."}, {"id": 132, "level": "Advanced", "tag": "Fire Science: Flash Point and Ignition", "stem": "Flash points from an investigator's table (°C): acetone −20, lighter fluid −4, ethyl alcohol 13, kerosene 38 to 74, cooking oil 326, gasoline −43, mineral spirits 35, paint thinner 35. Flash point is the lowest temperature at which a liquid gives off enough vapor to be lit by a spark. Which liquid can be lit at the lowest temperature, and why?", "options": ["Ethyl alcohol, at 13 °C, because alcohol vapor lights more readily than any other vapor", "Gasoline, at −43 °C, because the lowest flash point means ignitable vapor forms soonest", "Acetone, at −20 °C, because its boiling point of 57 °C makes it the most volatile liquid", "Cooking oil, at 326 °C, because the highest flash point marks the greatest fire hazard"], "answer": "B", "answer_text": "Gasoline, at −43 °C, because the lowest flash point means ignitable vapor forms soonest", "exp": "Flash point is a threshold temperature, so the smallest number is the liquid that is ready to burn first, and gasoline's −43 °C is below every other entry, including acetone's −20 °C. Cooking oil at 326 °C is the safest of the group at room temperature, not the most dangerous, and ethyl alcohol at 13 °C flashes 56 °C higher than gasoline no matter how its vapor behaves once lit."}, {"id": 133, "level": "Advanced", "tag": "Fire Science: Flash Point and Ignition", "stem": "Boiling points from an investigator's table (°C): acetone 57, lighter fluid 98, ethyl alcohol 78, kerosene 175 to 260, mineral spirits 150 to 200, paint thinner 135 to 175, cooking oil 355. A section of concrete floor is held at 100.0 °C for a long time. Which liquids would have boiled away completely?", "options": ["Mineral spirits and paint thinner, whose ranges start below the 100.0 °C of the floor", "Acetone alone, since only a boiling point under 60 °C lets a liquid leave a floor surface", "Acetone, ethyl alcohol and mineral spirits, since all three are thin quick-drying liquids", "Acetone, ethyl alcohol and lighter fluid, whose boiling points all fall below 100.0 °C"], "answer": "D", "answer_text": "Acetone, ethyl alcohol and lighter fluid, whose boiling points all fall below 100.0 °C", "exp": "A liquid held above its boiling point vaporizes completely, and 57 °C, 78 °C and 98 °C are all below 100.0 °C, so acetone, ethyl alcohol and lighter fluid go. Mineral spirits at 150 to 200 °C and paint thinner at 135 to 175 °C both start well above 100.0 °C and would leave residue behind, and stopping at acetone alone ignores the two other entries under the line."}, {"id": 134, "level": "Advanced", "tag": "Fire Science: Flash Point and Ignition", "stem": "A can of lighter fluid has a flash point of −4 °C and an auto-ignition temperature of 215 °C. The can sits open in a storeroom held at 25 °C. Which statement describes the hazard correctly?", "options": ["It ignites by itself right now, since 25 °C is already far above its flash point of −4 °C", "Its vapor can be set off by a spark now, but it will not ignite on its own until 215 °C", "Nothing above the can can burn until 215 °C, since flash point applies only to solid fuels", "Its vapor can be set off by a spark only above 215 °C, the level the flash point really sets"], "answer": "B", "answer_text": "Its vapor can be set off by a spark now, but it will not ignite on its own until 215 °C", "exp": "At 25 °C the storeroom is well above the −4 °C flash point, so ignitable vapor is standing over the liquid and any spark will light it, but self-ignition with no spark waits for the 215 °C auto-ignition temperature. Saying it ignites by itself confuses the two thresholds, flash point describes liquids rather than solids, and the level above which no spark is needed at all is 215 °C, not the −4 °C flash point."}, {"id": 135, "level": "Advanced", "tag": "Fire Science: Flash Point and Ignition", "stem": "A study guide states: “Acetone is the most dangerous liquid in the table because its auto-ignition temperature, 465 °C, is the highest one listed.” For comparison, gasoline's flash point is −43 °C and acetone's is −20 °C, and auto-ignition temperature is the temperature at which a substance ignites with no spark. Is the claim sound?", "options": ["Yes, because the highest auto-ignition temperature marks the liquid that lights most easily", "Yes, because auto-ignition temperature and flash point always rank liquids in one order", "No, because a high auto-ignition temperature means acetone is harder to set off on its own", "No, because acetone's auto-ignition temperature of 465 °C is the lowest value in the table"], "answer": "C", "answer_text": "No, because a high auto-ignition temperature means acetone is harder to set off on its own", "exp": "A high auto-ignition temperature means a substance must be driven hotter before it lights unaided, so 465 °C makes acetone harder to self-ignite, and it is the flash point that ranks everyday hazard, where gasoline's −43 °C beats acetone's −20 °C. Calling 465 °C the easiest to ignite inverts the meaning, 465 °C is a high value rather than the lowest, and the two properties plainly disagree here."}, {"id": 136, "level": "Advanced", "tag": "Fire Science: Flash Point and Ignition", "stem": "Flashover is reached when the upper gas layer is at least 6.0 × 10² °C and the floor receives at least 20 kW/m². Seat foam melts between 80 and 150 °C and ignites at 400 °C. Fire crews measure an upper layer of 620 °C and a floor flux of 24 kW/m² in a room full of foam seating. What does the data support?", "options": ["Flashover conditions are met, but the foam cannot burn until the layer passes 80 °C melting", "Flashover conditions are not met, because 620 °C sits below the 6.0 × 10² °C the layer needs", "Flashover conditions are not met, because foam must reach 465 °C before any seat can ignite", "Flashover conditions are met, and foam ignites at 400 °C, so seats can light across the room"], "answer": "D", "answer_text": "Flashover conditions are met, and foam ignites at 400 °C, so seats can light across the room", "exp": "Both thresholds are cleared, 620 °C against 6.0 × 10² °C and 24 kW/m² against 20 kW/m², and the layer is 220 °C above the foam's 400 °C ignition temperature, so exposed seats can light almost at once. Saying 620 °C is below 600 °C misreads the comparison, melting at 80 to 150 °C happened long before this point, and 465 °C is the auto-ignition value for acetone, not for foam."}, {"id": 137, "level": "Advanced", "tag": "Heat of Combustion", "stem": "A reference table lists lighter fluid as C₅H₁₂ with a heat of combustion of −29.7 kJ/g and a molar mass of 104.2 g/mol, and gives ΔH = (heat per gram) × (molar mass). Using C 12.01 g/mol and H 1.008 g/mol, check the molar mass and report ΔH.", "options": ["72.15 g/mol and ΔH = +2.14 × 10³ kJ/mol, since burning pours heat into the sample", "72.15 g/mol and ΔH = −2.14 × 10³ kJ/mol, since 5(12.01) + 12(1.008) = 72.15", "104.2 g/mol and ΔH = −3.09 × 10³ kJ/mol, since the printed molar mass checks out", "72.15 g/mol and ΔH = −2143 kJ/mol, since every digit of the product should be kept"], "answer": "B", "answer_text": "72.15 g/mol and ΔH = −2.14 × 10³ kJ/mol, since 5(12.01) + 12(1.008) = 72.15", "exp": "C₅H₁₂ has 5(12.01) + 12(1.008) = 60.05 + 12.096 = 72.15 g/mol, so the printed 104.2 g/mol is wrong, and ΔH = (−29.7 kJ/g)(72.15 g/mol) = −2142.9 kJ/mol = −2.14 × 10³ kJ/mol for three digits. Keeping 104.2 g/mol gives −3.09 × 10³ kJ/mol, −2143 kJ/mol shows four digits from three-digit data, and a positive ΔH would make a fuel absorb heat as it burns."}, {"id": 138, "level": "Advanced", "tag": "Heat of Combustion", "stem": "A worksheet prints the burning of ethyl alcohol as “C₂H₆O + 2O₂ → 2CO₂ + 3H₂O.” Which version is balanced using the lowest whole-number coefficients?", "options": ["2C₂H₆O + 6O₂ → 4CO₂ + 6H₂O, since doubling every coefficient is what balances it", "C₂H₆O + 2O₂ → 2CO₂ + 3H₂O, since the carbon and hydrogen atoms already match", "C₂H₆O + 3O₂ → 2CO₂ + 3H₂O, since 1 + 6 = 7 oxygen atoms match 4 + 3 = 7", "C₂H₆O + 3O₂ → 3CO₂ + 2H₂O, since three oxygen molecules must give three CO₂ units"], "answer": "C", "answer_text": "C₂H₆O + 3O₂ → 2CO₂ + 3H₂O, since 1 + 6 = 7 oxygen atoms match 4 + 3 = 7", "exp": "Carbon (2 = 2) and hydrogen (6 = 6) already match as printed, but oxygen does not: 1 + 2(2) = 5 on the left against 2(2) + 3 = 7 on the right, so the coefficient on O₂ must be 3, giving 1 + 6 = 7 on each side. Leaving 2O₂ keeps the equation short two oxygen atoms, the doubled version balances but is not in lowest whole numbers, and 3CO₂ + 2H₂O invents a third carbon and loses two hydrogens."}, {"id": 139, "level": "Advanced", "tag": "Heat of Combustion", "stem": "A worksheet prints the burning of paint thinner as “C₁₀H₁₆ + 9O₂ → 5CO₂ + 8H₂O.” Which version is balanced using the lowest whole-number coefficients?", "options": ["C₁₀H₁₆ + 14O₂ → 10CO₂ + 8H₂O, since 28 oxygen atoms match 20 + 8 = 28", "C₁₀H₁₆ + 9O₂ → 5CO₂ + 8H₂O, since 18 oxygen atoms match 10 + 8 = 18 as printed", "2C₁₀H₁₆ + 28O₂ → 20CO₂ + 16H₂O, since doubling gives the lowest whole numbers", "C₁₀H₁₆ + 18O₂ → 10CO₂ + 16H₂O, since each of the 16 hydrogen atoms takes a water"], "answer": "A", "answer_text": "C₁₀H₁₆ + 14O₂ → 10CO₂ + 8H₂O, since 28 oxygen atoms match 20 + 8 = 28", "exp": "Ten carbons must make 10CO₂ and sixteen hydrogens must make 8H₂O, so the right side holds 20 + 8 = 28 oxygen atoms and the left needs 14O₂. The printed version balances oxygen at 18 but strands five carbon atoms, the 16H₂O version doubles the hydrogen the formula actually has, and doubling everything gives coefficients twice as large as they need to be."}, {"id": 140, "level": "Advanced", "tag": "Heat of Combustion", "stem": "A 12.5 g sample of paint thinner burns completely; its heat of combustion is −45.5 kJ/g and 1 kJ = 1000 J. How much heat does the sample release, in joules?", "options": ["+5.69 × 10⁵ J, from (45.5 kJ/g)(12.5 g) = 569 kJ, then × 1000 J/kJ", "−5.69 × 10² J, from (−45.5 kJ/g)(12.5 g) = −569 kJ read straight off as joules", "−5.69 × 10⁵ J, from (−45.5 kJ/g)(12.5 g) = −569 kJ, then × 1000 J/kJ", "−0.569 J, from (−45.5 kJ/g)(12.5 g) = −569 kJ, then ÷ 1000 J/kJ"], "answer": "C", "answer_text": "−5.69 × 10⁵ J, from (−45.5 kJ/g)(12.5 g) = −569 kJ, then × 1000 J/kJ", "exp": "q = (−45.5 kJ/g)(12.5 g) = −568.75 kJ = −569 kJ to three digits, and −569 kJ × 1000 J/kJ = −5.69 × 10⁵ J. Reading it as −5.69 × 10² J skips the conversion, dividing by 1000 gives −0.569 J, far too little heat to matter in a fire, and a positive value would say the burning sample soaked heat up."}, {"id": 141, "level": "Advanced", "tag": "Heat of Combustion", "stem": "Mineral spirits release 43.2 kJ of heat per gram burned. How many grams must burn to release 1.50 × 10³ kJ?", "options": ["34.7 g, from 1.50 × 10³ kJ ÷ 43.2 kJ/g, kept to three digits", "6.48 × 10⁴ g, from 1.50 × 10³ kJ × 43.2 kJ/g, multiplying instead", "34.72 g, from 1.50 × 10³ kJ ÷ 43.2 kJ/g with four digits kept", "0.0288 g, from 43.2 kJ/g ÷ 1.50 × 10³ kJ, dividing the other way round"], "answer": "A", "answer_text": "34.7 g, from 1.50 × 10³ kJ ÷ 43.2 kJ/g, kept to three digits", "exp": "Dividing the total heat by the heat per gram cancels the kilojoules: 1.50 × 10³ kJ ÷ 43.2 kJ/g = 34.7 g, held to three digits because both inputs carry three. Multiplying gives 6.48 × 10⁴ g, more than 64 kg of solvent; 34.72 g shows a fourth digit; and 0.0288 g inverts the ratio into a mass too small to see."}, {"id": 142, "level": "Advanced", "tag": "Heat of Combustion", "stem": "Two solvents are compared: acetone, −30.5 kJ/g with a molar mass of 58.08 g/mol, and ethyl alcohol, −29.7 kJ/g with a molar mass of 46.07 g/mol. Using ΔH = (heat per gram) × (molar mass), which releases more heat per mole?", "options": ["Acetone, at −1771 kJ/mol against −1368 kJ/mol, with every calculator digit kept", "Neither, since −30.5 kJ/g and −29.7 kJ/g settle the ranking without any molar mass", "Ethyl alcohol, at −1.37 × 10³ kJ/mol against −1.77 × 10³ kJ/mol, the larger release", "Acetone, at −1.77 × 10³ kJ/mol against −1.37 × 10³ kJ/mol for ethyl alcohol"], "answer": "D", "answer_text": "Acetone, at −1.77 × 10³ kJ/mol against −1.37 × 10³ kJ/mol for ethyl alcohol", "exp": "ΔH for acetone is (−30.5 kJ/g)(58.08 g/mol) = −1771.4 kJ/mol = −1.77 × 10³ kJ/mol, while ethyl alcohol gives (−29.7 kJ/g)(46.07 g/mol) = −1368.3 kJ/mol = −1.37 × 10³ kJ/mol, so a mole of acetone releases about 4.0 × 10² kJ more. Calling −1.37 × 10³ kJ/mol the larger release ignores the sign, the four-digit values overstate three-digit data, and per-gram values cannot rank per-mole amounts when the molar masses differ by 12 g/mol."}, {"id": 143, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, lab model: fire broke out at about 1:41 a.m. on 14 February 1981 in the Stardust nightclub in Dublin, and 48 young people died. No residue analysis of this kind was carried out in the real investigation, but suppose a swab lifted from the floor of the bar storage area, where spirits were kept in bulk and no lighter fluid was stocked, were burned in the lab: a microbalance records 1.72 × 10⁻⁴ g and the sample releases 5.10 × 10⁻³ kJ. Heats of combustion (kJ/g): acetone −30.5, lighter fluid −29.7, ethyl alcohol −29.7, mineral spirits −43.2, paint thinner −45.5. What does the sample match?", "options": ["Paint thinner, −45.5 kJ/g, since only a stronger fuel could start a fire in a ceiling void", "Acetone, −30.5 kJ/g, the nearest listed value once the result is rounded to two digits", "Mineral spirits, −43.2 kJ/g, since 5.10 × 10⁻³ kJ ÷ 1.72 × 10⁻⁴ g works out near 43 kJ/g", "Ethyl alcohol, −29.7 kJ/g, matching both the measured value and the bar storage location"], "answer": "D", "answer_text": "Ethyl alcohol, −29.7 kJ/g, matching both the measured value and the bar storage location", "exp": "Heat per gram is 5.10 × 10⁻³ kJ ÷ 1.72 × 10⁻⁴ g = 29.7 kJ/g released, so q per gram is −29.7 kJ/g, which fits both ethyl alcohol and lighter fluid, and the storeroom held spirits and no lighter fluid. Acetone's −30.5 kJ/g is a different three-digit value, and −43.2 kJ/g and −45.5 kJ/g are nowhere near the 29.7 kJ/g the division actually gives."}, {"id": 144, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file: after the 1982 tribunal into the Stardust fire concluded the blaze was probably started deliberately, the Dáil in 2009 accepted an independent review finding that conclusion unfounded. Fresh inquests were ordered in 2019, ran through 2023 and 2024, and the jury delivered its verdicts on 18 April 2024. What did that jury return?", "options": ["Arson by a person unknown, restoring the 1982 tribunal's finding of probable deliberate ignition", "Unlawful killing for all 48 who died, with the jury naming deliberate ignition of alcove seating", "Unlawful killing for all 48 who died, without the jury naming a definitive cause of the fire", "Accidental death for all 48 who died, since the 2009 review had ruled out human responsibility"], "answer": "C", "answer_text": "Unlawful killing for all 48 who died, without the jury naming a definitive cause of the fire", "exp": "On 18 April 2024 the inquest jury returned verdicts of unlawful killing for all 48 victims and did not identify a definitive cause of the fire. Arson was the 1982 finding that the 2009 review found unfounded, an accidental verdict is not what the jury returned, and no claim naming a deliberate ignition point survived the inquests."}, {"id": 145, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, origin evidence: staff and patrons of the Stardust reported seats in the West Alcove alight at about 1:41 a.m. on 14 February 1981; later investigation established that a fire had been developing in the ceiling void above that alcove; the 1982 tribunal treated the alcove seats themselves as the point of origin. Which claim does that evidence best support?", "options": ["The burning seats were a late stage of a fire already growing in the void above the alcove", "The void fire and the seat fire were unrelated, since a ceiling void holds nothing to burn", "The burning seats prove ignition by hand, since foam cannot be lit by heat from overhead", "The burning seats were the origin, since that was the first flame anyone actually reported"], "answer": "A", "answer_text": "The burning seats were a late stage of a fire already growing in the void above the alcove", "exp": "A fire growing unseen in the void was already burning before anyone saw flame in the seats, so the seats mark where the fire became visible, not where it began, and the tribunal's reading confuses the two. First reported flame is not the same as first ignition, foam ignites readily at 400 °C from radiation overhead, and a void carrying wiring and combustible lining has plenty of fuel."}, {"id": 146, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, evacuation evidence: the Stardust had exits that were chained, padlocked or blocked by furniture on the night of 13–14 February 1981, and toilet windows were covered by steel plates. Flashover swept the ballroom within minutes of the seating igniting, and 48 people died. Which claim about the death toll does that evidence support?", "options": ["The exits were beside the point, because the 48 deaths all occurred inside the ceiling void", "Locked and blocked exits cut the escape time available once flashover began to spread", "Locked exits changed nothing, since flashover kills everyone before an exit can be reached", "Locked exits prove the fire was set on purpose by someone who chained the doors in advance"], "answer": "B", "answer_text": "Locked and blocked exits cut the escape time available once flashover began to spread", "exp": "Flashover gives occupants only a short window, so exits that were chained, blocked or plated over directly reduced the number of people who could get out, which is evidence about the death toll rather than about ignition. Claiming the exits changed nothing ignores that flashover took minutes, the deaths occurred in the ballroom and its exits rather than in a void, and blocked exits show negligence, not a deliberately set fire."}, {"id": 147, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, fuel load: investigators estimate the West Alcove seating held 4.2 × 10³ g of polyurethane foam, whose heat of combustion is 3.0 × 10¹ kJ/g. Burning foam also gives off HCN and CO. How much heat is released if all of that foam burns?", "options": ["−1.3 × 10⁵ kJ, from (3.0 × 10¹ kJ/g)(4.2 × 10³ g) held to two digits", "−1.26 × 10⁵ kJ, from (3.0 × 10¹ kJ/g)(4.2 × 10³ g) held to three digits", "−1.3 × 10² kJ, from (3.0 × 10¹ kJ/g)(4.2 × 10³ g), then ÷ 1000 J/kJ", "+1.3 × 10⁵ kJ, from (3.0 × 10¹ kJ/g)(4.2 × 10³ g), since burning takes heat in"], "answer": "A", "answer_text": "−1.3 × 10⁵ kJ, from (3.0 × 10¹ kJ/g)(4.2 × 10³ g) held to two digits", "exp": "q = (−3.0 × 10¹ kJ/g)(4.2 × 10³ g) = −126,000 kJ, reported as −1.3 × 10⁵ kJ because both inputs carry only two digits. Keeping −1.26 × 10⁵ kJ claims a third digit the data do not support, dividing by 1000 J/kJ answers a question about joules that was never asked, and a positive value would make the seats absorb heat as they burned."}, {"id": 148, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, suppression estimate: suppose crews had put 2.50 × 10⁴ g of water at 12.0 °C onto the Stardust ballroom fire and all of it reached 100.0 °C and boiled away. Water is 4.18 J/g°C, heat of vaporization is 2.26 kJ/g, heat of fusion is 0.333 kJ/g and 1 kJ = 1000 J. How much heat would that water take out of the fire?", "options": ["+9.20 × 10³ kJ, the heating step by itself, since boiling adds nothing to the total", "+6.57 × 10⁴ kJ, adding 9.20 × 10³ kJ of heating to 5.65 × 10⁴ kJ of boiling", "+5.65 × 10⁴ kJ, the boiling step by itself, since water thrown on a fire boils at once", "+7.40 × 10⁴ kJ, adding 8.33 × 10³ kJ of melting to the heating and the boiling steps"], "answer": "B", "answer_text": "+6.57 × 10⁴ kJ, adding 9.20 × 10³ kJ of heating to 5.65 × 10⁴ kJ of boiling", "exp": "Heating gives q = (2.50 × 10⁴ g)(4.18 J/g°C)(88.0 °C) = 9,196,000 J = 9.20 × 10³ kJ, boiling gives (2.50 × 10⁴ g)(2.26 kJ/g) = 5.65 × 10⁴ kJ, and the total is 65,696 kJ = 6.57 × 10⁴ kJ. Either step alone leaves out most of the cooling, and the 8.33 × 10³ kJ melting term belongs to ice, not to water already at 12.0 °C."}, {"id": 149, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, claim testing: the 1982 tribunal into the Stardust fire concluded the blaze was probably started deliberately, and in 2009 the Dáil accepted an independent review finding that conclusion unfounded and had the record corrected. Using Claim, Evidence, Reasoning, what does that correction illustrate?", "options": ["A claim of arson is settled by the authority of a tribunal, so the 1982 finding still holds", "A claim of arson needs only that other causes look unlikely, which the tribunal supplied", "A claim of arson needs physical evidence, and without it probable arson was unsupported", "A claim of arson needs no evidence when exits are locked, since locking them shows intent"], "answer": "C", "answer_text": "A claim of arson needs physical evidence, and without it probable arson was unsupported", "exp": "A claim carries only as much weight as the evidence behind it, and the review found no physical evidence of a deliberately set fire, so the tribunal's reasoning could not support its own conclusion. Ruling other causes unlikely is not evidence for arson, authority does not substitute for evidence, and locked exits are evidence about the death toll rather than about how the fire started."}, {"id": 150, "level": "Advanced", "tag": "Case File: The Stardust Fire", "stem": "Case file, lab check: a student investigator's worked solution reads: “The calorimeter held 0.125 kg of water and the temperature rose 14.0 °C, so q = 0.125 × 4.18 J/g°C × 14.0 = 7.32 J.” Water is 4.18 J/g°C, 1 kg = 1000 g and 1 kJ = 1000 J. What is q for the water?", "options": ["+7.32 J, since 0.125 kg is the mass measured and 4.18 J/g°C works with any mass unit", "+7.32 × 10⁶ J, since 0.125 kg has to be converted into 1.25 × 10⁵ g of water first", "+7.3 × 10³ J, since 125 g is the right mass but only two digits may be reported", "+7.32 × 10³ J, since q = m × c × ΔT needs mass in grams and 0.125 kg is 125 g"], "answer": "D", "answer_text": "+7.32 × 10³ J, since q = m × c × ΔT needs mass in grams and 0.125 kg is 125 g", "exp": "The specific heat is written per gram, so the mass must be 0.125 kg × 1000 g/kg = 125 g, giving q = (125 g)(4.18 J/g°C)(14.0 °C) = 7315 J = +7.32 × 10³ J to three digits. Leaving the mass in kilograms reports 7.32 J, a thousand times too small; 1.25 × 10⁵ g multiplies by 1000 twice; and +7.3 × 10³ J drops a digit that 0.125, 4.18 and 14.0 all support."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>
  `<button data-t="${i}">${t}<span class="c">${tagCount[t]}</span></button>`).join('');
document.querySelectorAll('#tagchips button').forEach((b,i)=>{
  b.onclick = ()=>{
    const t = tags[i];
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.classList.toggle('on', picked.has(t));
    refresh();
  };
});
$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
