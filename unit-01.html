eps the result positive even though this group recovered MORE than the actual mass, and dividing by the measured value instead gives 4.9%."}, {"id": 121, "level": "Advanced", "tag": "Percent Difference", "stem": "A group recovers noticeably MORE iron than the mixture actually contained. What is the most reasonable explanation?", "options": ["The actual mass recorded by the teacher was wrong", "Some sand or damp material was collected along with the iron filings", "The percent difference formula does not work in this case", "Iron was created during the separation"], "answer": "B", "answer_text": "Some sand or damp material was collected along with the iron filings", "exp": "Matter is not created during a physical separation, so extra mass has to come from something else being collected — clinging sand, moisture, or fragments from the magnet. Recovering more than 100% is a standard signal of contamination."}, {"id": 122, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "Two of the white powders are both sodium chloride, but one is labeled “unknown” and the other “salt”; they differ only in crystal size. What does this tell you about crystal size?", "options": ["It is a physical property that can differ between samples of the SAME substance", "It proves the two powders must be completely different substances after all", "It determines the density of the substance, so larger crystals are denser", "It is a chemical property that reliably identifies which substance you have"], "answer": "A", "answer_text": "It is a physical property that can differ between samples of the SAME substance", "exp": "Two samples of the same compound can be ground or grown to different crystal sizes without changing what they are. Because crystal size varies within one substance, it is a physical property that cannot be used for identification."}, {"id": 123, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "An unknown white powder dissolves in water, does NOT fizz with vinegar, and does NOT turn phenolphthalein pink. Which conclusion is best supported?", "options": ["The powder must be plaster of Paris, since it dissolved without any reaction", "No conclusion is possible, because negative test results are not real evidence", "The powder is definitely table salt, because it dissolved and did not react", "The powder is not a carbonate and not a base, but more tests are needed to identify it"], "answer": "D", "answer_text": "The powder is not a carbonate and not a base, but more tests are needed to identify it", "exp": "Negative results are real evidence — no fizzing rules out carbonates like baking soda and washing soda, and no pink rules out bases. But several soluble, non-reactive powders remain, so the tests narrow the field without naming a single answer."}, {"id": 124, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "The liquid in the shot glass boiled away at about 100 °C leaving a white solid, and that solid dissolves readily in water and conducts electricity in solution. Which conclusion is best supported?", "options": ["The unknown was corn starch in water", "The unknown was a dissolved salt in water", "The unknown was pure water", "The unknown was an alcohol"], "answer": "B", "answer_text": "The unknown was a dissolved salt in water", "exp": "Boiling near 100 °C indicates water; a residue rules out pure water; and a solid that dissolves readily and makes the solution conduct electricity is characteristic of a dissolved salt. Corn starch would not dissolve fully or conduct."}, {"id": 125, "level": "Advanced", "tag": "Claim, Evidence, and Reasoning", "stem": "Which FINAL CLAIM is the strongest?", "options": ["The student got sick from drinking the liquid that was in the shot glass, and I am pretty sure that whatever happened to be sitting in there is the thing that made the student feel so bad afterward, even though we never really checked what it was.", "I think it was probably the salt that caused the whole problem, because that is basically what our group ended up finding in the lab that day, and a couple of the other groups seemed to get something pretty similar, so it feels like a reasonable guess to me.", "The student was most likely poisoned by some kind of substance that had been dissolved in the liquid sitting in the shot glass, and it must have been a fairly dangerous substance to do that, but we never actually figured out what the substance was.", "The student became ill from consuming a large amount of dissolved salt: our tests showed the liquid left a salt residue that conducted electricity, and according to a medical source, consuming too much salt at once can cause seizures and coma."], "answer": "D", "answer_text": "The student became ill from consuming a large amount of dissolved salt: our tests showed the liquid left a salt residue that conducted electricity, and according to a medical source, consuming too much salt at once can cause seizures and coma.", "exp": "A strong final claim answers the question in a complete sentence, cites specific experimental evidence, brings in outside research, and gives credit to the source. The others are vague, hedged, or offer a conclusion with no supporting evidence at all."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let tag = '', setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
$('#tagsel').innerHTML = '<option value="">All skills</option>' +
  tags.map(t=>`<option value="${t}">${t} (${BANK.filter(q=>q.tag===t).length})</option>`).join('');

function pool(){
  return BANK.filter(q => levels.has(q.level) && (!tag || q.tag===tag));
}
function refresh(){
  const n = pool().length;
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
$('#tagsel').onchange = e => { tag = e.target.value; refresh(); };
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  const n = pos + (answered?1:0);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
