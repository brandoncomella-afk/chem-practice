<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "An intensive property is a property that:", "options": ["can only be measured in the lab", "always requires a chemical reaction to observe", "changes as the amount of substance changes", "does not change as the amount of substance changes"], "answer": "D", "answer_text": "does not change as the amount of substance changes", "exp": "An intensive property stays the same no matter how much of the substance you have, which is exactly why it can be used to IDENTIFY a substance. Extensive properties change with the amount, so they cannot identify anything."}, {"id": 2, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "Which of the following is an EXTENSIVE property?", "options": ["The density of the sample is 2.7 g/mL", "The sample has a mass of 7.1 grams", "The sample is a blue crystal", "The sample melts at 660.3 °C"], "answer": "B", "answer_text": "The sample has a mass of 7.1 grams", "exp": "Take twice as much of the substance and the mass doubles, so mass depends on the amount present — that makes it extensive. Density, melting point, and color are all the same for any size sample."}, {"id": 3, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "Which property could be used to IDENTIFY an unknown substance?", "options": ["Its mass", "Its volume", "Its temperature", "Its density"], "answer": "D", "answer_text": "Its density", "exp": "Only intensive properties identify a substance, and density is intensive — every sample of the same substance has the same density. Mass and volume both change with sample size, and temperature simply describes how hot the sample is right now — none of the three says anything about identity."}, {"id": 4, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "“The melting point of aluminum is 660.3 °C.” This statement describes:", "options": ["a chemical change", "an extensive property", "a measurement error", "an intensive property"], "answer": "D", "answer_text": "an intensive property", "exp": "A gram of aluminum and a kilogram of aluminum both melt at 660.3 °C. Because the value does not depend on how much you have, melting point is intensive."}, {"id": 5, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "“The sand sample takes up 25 mL of space.” This statement describes:", "options": ["an intensive property", "a chemical property", "the density of sand", "an extensive property"], "answer": "D", "answer_text": "an extensive property", "exp": "Volume is the space a sample occupies, and doubling the sample doubles the volume. Anything that scales with the amount of matter is extensive."}, {"id": 6, "level": "Beginner", "tag": "Intensive vs. Extensive Properties", "stem": "Volume is classified as an extensive property because:", "options": ["it changes when the substance reacts", "it is measured in milliliters", "a larger sample of the same substance has a larger volume", "it can only be measured with a graduated cylinder"], "answer": "C", "answer_text": "a larger sample of the same substance has a larger volume", "exp": "The classification depends only on whether the value changes with the AMOUNT of substance. Pour more of the same liquid and the volume goes up, so volume is extensive — the units and the measuring tool are irrelevant."}, {"id": 7, "level": "Beginner", "tag": "Accuracy vs. Precision", "stem": "Accuracy describes:", "options": ["how close a measurement is to the accepted or true value", "how close repeated measurements are to each other", "how expensive the instrument is", "how many significant digits a measurement has"], "answer": "A", "answer_text": "how close a measurement is to the accepted or true value", "exp": "Accuracy is a comparison to reality — the accepted value. Agreement among your own repeated trials is precision, and the two are completely independent of each other."}, {"id": 8, "level": "Beginner", "tag": "Accuracy vs. Precision", "stem": "Precision describes:", "options": ["whether the substance is pure", "how close a measurement is to the accepted value", "how large the measured value is", "how close repeated measurements are to each other"], "answer": "D", "answer_text": "how close repeated measurements are to each other", "exp": "Precision is about reproducibility — do you get the same answer each time you repeat the measurement? A set of trials can be tightly clustered (precise) and still be far from the true value."}, {"id": 9, "level": "Beginner", "tag": "Accuracy vs. Precision", "stem": "A group measures the same liquid three times with a 10-mL graduated cylinder marked every 0.1 mL and gets 8.42 mL, 8.45 mL, and 8.43 mL. The actual volume is 10.00 mL. This group's data are:", "options": ["both accurate and precise", "precise but not accurate", "neither accurate nor precise", "accurate but not precise"], "answer": "B", "answer_text": "precise but not accurate", "exp": "The three trials agree to within 0.03 mL of one another, so the data are precise. But all three sit about 1.57 mL below the actual value, so they are not accurate — a pattern that usually points to a problem with the instrument or the technique."}, {"id": 10, "level": "Beginner", "tag": "Accuracy vs. Precision", "stem": "Which set of measurements is the MOST precise?", "options": ["9.0, 8.9, 8.7 cm/s", "6.2, 9.4, 8.0 cm/s", "9.5, 9.0, 9.2 cm/s", "7.0, 7.1, 7.0 cm/s"], "answer": "D", "answer_text": "7.0, 7.1, 7.0 cm/s", "exp": "Precision is judged only by how tightly the trials cluster, without any reference to the true value. The set 7.0, 7.1, 7.0 spans just 0.1 cm/s — a tighter spread than any other set here."}, {"id": 11, "level": "Beginner", "tag": "Accuracy vs. Precision", "stem": "To decide whether a measurement is ACCURATE, you must compare it to:", "options": ["the number of significant digits used", "the other trials in your own data set", "the accepted or actual value", "the average of the class data"], "answer": "C", "answer_text": "the accepted or actual value", "exp": "Accuracy requires an outside standard — the accepted or actual value. Comparing your trials only to each other tells you about precision, and a whole class can be precisely wrong together."}, {"id": 12, "level": "Beginner", "tag": "Measuring with Significant Digits", "stem": "When measuring a sample, the recorded measurement should include:", "options": ["the known digits and two estimated digits", "as many digits as the calculator displays", "only the known digits", "the known digits and one estimated digit"], "answer": "D", "answer_text": "the known digits and one estimated digit", "exp": "You record every digit you are certain of from the instrument's markings, plus exactly ONE digit you estimate between the markings. Adding more estimated digits claims precision the instrument does not have."}, {"id": 13, "level": "Beginner", "tag": "Measuring with Significant Digits", "stem": "In any properly recorded measurement, the LAST digit is:", "options": ["the exactly known digit", "the largest-place digit", "the estimated digit", "the insignificant digit"], "answer": "C", "answer_text": "the estimated digit", "exp": "The final digit is the one you estimated between the markings, which is why every measurement carries some uncertainty. That estimated digit still counts as significant."}, {"id": 14, "level": "Beginner", "tag": "Measuring with Significant Digits", "stem": "A graduated cylinder is marked every 10 mL. The liquid sits between the 20 mL and 30 mL lines, a little less than halfway up. The best recorded measurement is:", "options": ["20 mL", "30 mL", "24.5 mL", "24 mL"], "answer": "D", "answer_text": "24 mL", "exp": "The tens place is known from the markings and the ones place is estimated between them, giving two digits: 24 mL. Recording 24.5 mL adds a second estimated digit the markings cannot support."}, {"id": 15, "level": "Beginner", "tag": "Measuring with Significant Digits", "stem": "A large beaker is marked every 100 mL. The liquid sits between the 200 mL and 300 mL lines, a bit more than two-thirds of the way up. The best recorded measurement is:", "options": ["300 mL", "200 mL", "270.0 mL", "270 mL"], "answer": "D", "answer_text": "270 mL", "exp": "The hundreds place is the known digit and the tens place is the estimated digit, so the measurement is 270 mL. Writing 270.0 mL claims the ones and tenths places are also meaningful, which they are not."}, {"id": 16, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 0.00560 g?", "options": ["6", "2", "3", "5"], "answer": "C", "answer_text": "3", "exp": "Leading zeros are only placeholders and never count. The 5, the 6, and the trailing zero after the decimal point are significant — 3 SD."}, {"id": 17, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 1200 m (written with no decimal point)?", "options": ["2", "1", "3", "4"], "answer": "A", "answer_text": "2", "exp": "Trailing zeros in a number with NO decimal point are treated as placeholders, not measured digits. Only the 1 and the 2 count, giving 2 SD."}, {"id": 18, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 100.0 mL?", "options": ["2", "3", "4", "1"], "answer": "C", "answer_text": "4", "exp": "The decimal point makes the trailing zero significant — it shows the volume was actually read to the tenths place. The two middle zeros are trapped between significant digits, so all four count."}, {"id": 19, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 0.0304 s?", "options": ["5", "3", "4", "2"], "answer": "B", "answer_text": "3", "exp": "The two leading zeros are placeholders and do not count. The 3, the trapped zero, and the 4 are all significant — 3 SD."}, {"id": 20, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 45.60 cm?", "options": ["3", "5", "4", "2"], "answer": "C", "answer_text": "4", "exp": "All nonzero digits count, and the trailing zero counts because there is a decimal point — it shows the measurement was read to the hundredths place. That is 4 SD."}, {"id": 21, "level": "Beginner", "tag": "Counting Significant Digits", "stem": "A protozoan is 40.0 µm long. Which statement about this measurement is TRUE?", "options": ["The measurement has 2 significant digits", "The measurement has 3 significant digits", "Length is an intensive property", "The trailing zero is only a placeholder"], "answer": "B", "answer_text": "The measurement has 3 significant digits", "exp": "The decimal point makes the trailing zero significant, so 40.0 has 3 SD. The trailing zero is not a placeholder here — placeholders only appear BEFORE the first nonzero digit. And length is extensive, not intensive, since a longer specimen has a greater length."}, {"id": 22, "level": "Beginner", "tag": "Calculating with Significant Digits", "stem": "When MULTIPLYING two measurements, the answer should have:", "options": ["the same number of significant digits as the number with the MOST significant digits", "the total number of significant digits in both numbers added together", "the same number of significant digits as the number with the FEWEST significant digits", "as many digits as the calculator shows"], "answer": "C", "answer_text": "the same number of significant digits as the number with the FEWEST significant digits", "exp": "Your answer can never be more certain than your weakest measurement, so the value with the fewest significant digits sets the limit. Round up or down as needed to reach that count."}, {"id": 23, "level": "Beginner", "tag": "Calculating with Significant Digits", "stem": "Calculate 1.0 × 234, reported to the correct number of significant digits.", "options": ["200", "234.0", "234", "230"], "answer": "D", "answer_text": "230", "exp": "1.0 has 2 SD and 234 has 3 SD, so the answer is limited to 2 SD. The exact product 234 rounds to 230."}, {"id": 24, "level": "Beginner", "tag": "Calculating with Significant Digits", "stem": "When DIVIDING two measurements, the answer should have:", "options": ["the same number of significant digits as the number written in the denominator", "one more significant digit than the number with the fewest significant digits", "the same number of significant digits as the number with the fewest significant digits", "the same number of significant digits as the number written in the numerator"], "answer": "C", "answer_text": "the same number of significant digits as the number with the fewest significant digits", "exp": "Division follows the same rule as multiplication: the least precise measurement in the problem controls how many significant digits the answer may keep."}, {"id": 25, "level": "Beginner", "tag": "Density", "stem": "Which equation correctly defines density?", "options": ["Density = volume / mass", "Density = mass / volume", "Density = mass + volume", "Density = mass × volume"], "answer": "B", "answer_text": "Density = mass / volume", "exp": "Density is a comparison, or ratio, between mass and volume — how much mass is packed into each unit of volume. The units follow straight from the equation: g/mL or g/cm³."}, {"id": 26, "level": "Beginner", "tag": "Density", "stem": "Density is best described as:", "options": ["a measure of how heavy an object feels in the hand", "a comparison, or ratio, between mass and volume", "the total amount of space that a sample occupies", "the total amount of mass that a sample contains"], "answer": "B", "answer_text": "a comparison, or ratio, between mass and volume", "exp": "Density relates two extensive properties to each other. Because both mass and volume scale together, their ratio stays constant — which is what makes density intensive and useful for identification."}, {"id": 27, "level": "Beginner", "tag": "Density", "stem": "An object with a density of 0.80 g/mL is placed in water, which has a density of 1.00 g/mL. The object will:", "options": ["sink to the bottom", "float on the surface", "dissolve completely", "stay suspended in the middle"], "answer": "B", "answer_text": "float on the surface", "exp": "An object floats when it is less dense than the liquid around it, and 0.80 g/mL is less than 1.00 g/mL. It would only stay suspended if the two densities were exactly equal."}, {"id": 28, "level": "Beginner", "tag": "Density", "stem": "Which units are appropriate for reporting the density of a liquid?", "options": ["g", "g/mL", "g·mL", "mL"], "answer": "B", "answer_text": "g/mL", "exp": "Since density is mass divided by volume, its units must be a mass unit divided by a volume unit — grams per milliliter. Grams alone is mass and milliliters alone is volume."}, {"id": 29, "level": "Beginner", "tag": "Classifying Matter", "stem": "An element is made of:", "options": ["only one type of atom", "a combination of pure substances", "atoms that can be separated by filtering", "two or more different atoms chemically combined"], "answer": "A", "answer_text": "only one type of atom", "exp": "A nugget of gold contains nothing but gold atoms (Au). Two or more different atoms chemically combined would be a compound, and a combination of pure substances would be a mixture."}, {"id": 30, "level": "Beginner", "tag": "Classifying Matter", "stem": "Water (H₂O) is classified as a compound because:", "options": ["it stays a clear liquid at ordinary room temperature", "it can be separated into its parts by simple filtering", "it is found dissolved inside many everyday mixtures", "it contains two or more different atoms chemically combined"], "answer": "D", "answer_text": "it contains two or more different atoms chemically combined", "exp": "A compound is two or more DIFFERENT atoms chemically combined — here hydrogen and oxygen in a fixed ratio. Its physical state and where it is found have nothing to do with the classification."}, {"id": 31, "level": "Beginner", "tag": "Classifying Matter", "stem": "A pure substance contains:", "options": ["any material that looks uniform", "at least two elements", "only elements, never compounds", "only one type of element or compound"], "answer": "D", "answer_text": "only one type of element or compound", "exp": "A pure substance is a single element OR a single compound — one kind of particle throughout. Looking uniform is not enough, since salt water looks uniform but is a mixture."}, {"id": 32, "level": "Beginner", "tag": "Classifying Matter", "stem": "Which statement about mixtures is TRUE?", "options": ["Mixtures are always liquids at ordinary room temperature", "Mixtures can be physically separated back into their component parts", "Mixtures always contain exactly two substances in a fixed ratio", "Mixtures must be chemically decomposed before they can be separated"], "answer": "B", "answer_text": "Mixtures can be physically separated back into their component parts", "exp": "The substances in a mixture are not chemically bonded, so physical methods — magnets, filters, dissolving and evaporating — are enough to pull them apart. Chemical decomposition is what compounds require."}, {"id": 33, "level": "Beginner", "tag": "Classifying Matter", "stem": "Vinegar is a solution of acetic acid and water. Vinegar is therefore:", "options": ["an element", "a compound", "a mixture", "a pure substance"], "answer": "C", "answer_text": "a mixture", "exp": "Two different pure substances are combined here without being chemically bonded to each other, which makes vinegar a mixture. Acetic acid alone (CH₃COOH) is the compound."}, {"id": 34, "level": "Beginner", "tag": "Classifying Matter", "stem": "Rose gold is made of gold, copper, silver, and zinc melted together. Rose gold is:", "options": ["a compound", "an element", "a mixture", "a single pure substance"], "answer": "C", "answer_text": "a mixture", "exp": "The four metals are physically combined, not chemically bonded in a fixed ratio, and the proportions can be varied. Metal blends like this are mixtures, even though they look completely uniform."}, {"id": 35, "level": "Beginner", "tag": "Classifying Matter", "stem": "Sodium hypochlorite (NaClO) is a pure substance, while household bleach is NaClO dissolved in water. Which classification is correct?", "options": ["NaClO is a mixture; bleach is a compound", "NaClO is a compound; bleach is a mixture", "Both are compounds", "Both are elements"], "answer": "B", "answer_text": "NaClO is a compound; bleach is a mixture", "exp": "NaClO has different atoms chemically combined in a fixed formula, making it a compound. Adding water produces a combination of two pure substances that can be physically separated — a mixture."}, {"id": 36, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "A physical property is a quality that:", "options": ["is the same for every substance, no matter what it is made of", "can be observed without changing the substance into something else", "can be observed only while a chemical reaction is happening", "can be measured only by burning the substance in open air"], "answer": "B", "answer_text": "can be observed without changing the substance into something else", "exp": "You can check a physical property — color, texture, melting point, whether a magnet attracts it — and still be left with the same substance you started with. Chemical properties can only be observed by changing the substance's identity."}, {"id": 37, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Which of the following is a CHEMICAL change?", "options": ["Dissolving sugar in water", "Melting ice", "Crushing a can", "Iron rusting"], "answer": "D", "answer_text": "Iron rusting", "exp": "Rusting turns iron into iron oxide — an entirely new substance with new properties. The other three change only form, phase, or appearance; the original substance is still chemically there."}, {"id": 38, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Which of the following is a PHYSICAL change?", "options": ["Baking a cake", "Cutting paper into strips", "Plaster of Paris hardening with water", "Burning a candle"], "answer": "B", "answer_text": "Cutting paper into strips", "exp": "Cut paper is still paper — only its size and shape changed. The other three all form new substances with new properties."}, {"id": 39, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Flammability is classified as a chemical property because:", "options": ["observing it requires the substance to change into a new substance", "measuring it requires nothing more than a ruler and a balance", "describing it requires only the color and shape of the sample", "observing it depends only on the size of the sample used"], "answer": "A", "answer_text": "observing it requires the substance to change into a new substance", "exp": "The only way to find out whether something burns is to burn it, which converts it into new products. Any property you can observe only by changing the substance's identity is a chemical property."}, {"id": 40, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Boiling water is considered a physical change because:", "options": ["the water is still H₂O; only its state changed", "a brand new substance called steam is formed", "the water breaks apart into hydrogen and oxygen", "energy was added to the system"], "answer": "A", "answer_text": "the water is still H₂O; only its state changed", "exp": "Steam, liquid water, and ice are all made of H₂O particles. Boiling only spreads the particles apart — the chemical bonds inside each particle stay intact, so the substance's identity is unchanged."}, {"id": 41, "level": "Beginner", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Which observation is the BEST evidence that a chemical change has taken place?", "options": ["The sample was divided into two smaller pieces of the same size", "Bubbles of a new gas formed and the sample permanently changed color", "The sample was ground into a fine powder with a mortar and pestle", "The sample changed from a solid to a liquid when it was heated"], "answer": "B", "answer_text": "Bubbles of a new gas formed and the sample permanently changed color", "exp": "A new gas plus a permanent color change signals that new substances formed. Grinding, melting, and dividing all leave the original substance chemically unchanged."}, {"id": 42, "level": "Beginner", "tag": "States of Matter and Particle Models", "stem": "A solid has:", "options": ["neither a definite shape nor a definite volume", "a definite volume but takes the shape of its container", "a definite shape and a definite volume", "a definite shape but no definite volume"], "answer": "C", "answer_text": "a definite shape and a definite volume", "exp": "Solid particles are locked into fixed positions, so both the shape and the volume stay fixed. Liquids keep volume but not shape; gases keep neither."}, {"id": 43, "level": "Beginner", "tag": "States of Matter and Particle Models", "stem": "A liquid poured from a tall thin container into a wide flat dish will:", "options": ["expand to fill the entire dish including the space above it", "change into a gas", "keep the same volume but take the shape of the dish", "keep its original shape"], "answer": "C", "answer_text": "keep the same volume but take the shape of the dish", "exp": "Liquid particles stay close together, which fixes the volume, but they can slide past one another, so the shape adapts to the container. Only a gas would expand to fill all the available space."}, {"id": 44, "level": "Beginner", "tag": "States of Matter and Particle Models", "stem": "In the PhET simulation, neon atoms in the SOLID state are best described as:", "options": ["far apart and moving randomly in all directions", "packed closely together and sliding past one another", "completely motionless", "packed closely together and vibrating in place"], "answer": "D", "answer_text": "packed closely together and vibrating in place", "exp": "Solid particles are held in fixed positions by strong attractions but still have energy, so they vibrate without leaving their spots. Sliding past one another describes a liquid, and particles are never completely motionless."}, {"id": 45, "level": "Beginner", "tag": "Separating Mixtures", "stem": "Which tool would you use to remove iron filings from a mixture of iron filings, sand, and salt?", "options": ["A graduated cylinder", "A conductivity tester", "A coffee filter", "A magnet"], "answer": "D", "answer_text": "A magnet", "exp": "Iron is magnetic while sand and salt are not, so a magnet separates the iron in a single step without any chemical change. This is why the magnet step comes first — it works while everything is still dry."}, {"id": 46, "level": "Intermediate", "tag": "Intensive vs. Extensive Properties", "stem": "Three blocks cut from the same bar of lead have masses of 307.80 g (whole), 153.90 g (half), and 76.95 g (quarter). What do these masses show about mass?", "options": ["Mass is useful for identification, because each metal has its own mass", "Mass is extensive, because the value changes with the amount of lead", "Mass is intensive, because all three blocks are made of pure lead", "Mass is a chemical property, because it can be measured on a balance"], "answer": "B", "answer_text": "Mass is extensive, because the value changes with the amount of lead", "exp": "Cutting the bar in half cuts the mass in half. Because the value tracks the amount of substance, mass is extensive — and that is exactly why it cannot identify the metal."}, {"id": 47, "level": "Intermediate", "tag": "Intensive vs. Extensive Properties", "stem": "The whole, half, and quarter lead blocks all give the same value of 11.34 g/cm³ when mass is divided by volume. This shows that density is:", "options": ["intensive, because it does not change with the amount of substance", "extensive, because it was calculated from the mass of the block", "dependent on the shape, because each block was cut differently", "a chemical property, because you must calculate it with a formula"], "answer": "A", "answer_text": "intensive, because it does not change with the amount of substance", "exp": "Cutting the block halves the mass AND the volume, so the ratio between them is unchanged. A property that stays constant regardless of sample size is intensive, which is why density identifies a substance."}, {"id": 48, "level": "Intermediate", "tag": "Intensive vs. Extensive Properties", "stem": "Which pair contains TWO intensive properties?", "options": ["Mass and boiling point", "Length and total volume", "Total mass and volume", "Density and melting point"], "answer": "D", "answer_text": "Density and melting point", "exp": "Density and melting point are both the same for any size sample of a given substance. Mass, volume, and length all grow with the amount of matter, so any pair containing one of them fails."}, {"id": 49, "level": "Intermediate", "tag": "Intensive vs. Extensive Properties", "stem": "A student writes: “The iron metal sample has a weight of 7.1 grams.” This is an example of:", "options": ["an extensive property that cannot identify iron", "an intensive property that identifies iron", "a chemical property of iron", "a measurement with 1 significant digit"], "answer": "A", "answer_text": "an extensive property that cannot identify iron", "exp": "Weight (mass) changes with the amount of iron present, so it is extensive and useless for identification. The measurement also has 2 significant digits, not 1."}, {"id": 50, "level": "Intermediate", "tag": "Intensive vs. Extensive Properties", "stem": "Why can't the mass of a sample be used to identify what substance it is?", "options": ["Any substance can have any mass, depending on how much you have", "Mass is too hard to measure accurately in a school lab", "Mass changes whenever the substance is heated or cooled", "Mass has no units of its own, so it cannot be compared"], "answer": "A", "answer_text": "Any substance can have any mass, depending on how much you have", "exp": "A 10.0 g sample could be gold, sand, or sugar — mass says nothing about identity because it depends entirely on how much of the substance you have. Identification requires an intensive property such as density or melting point."}, {"id": 51, "level": "Intermediate", "tag": "Accuracy vs. Precision", "stem": "A motion detector gives the true speed as 9.0 cm/s. Student A records 9.0, 8.9, 8.7 cm/s; Student B records 7.0, 7.1, 7.0 cm/s; Student C records 9.5, 9.0, 9.2 cm/s. Which student is the MOST precise?", "options": ["All three are equally precise", "Student C", "Student B", "Student A"], "answer": "C", "answer_text": "Student B", "exp": "Precision is judged only by the spread within a student's own trials. Student B's range is 0.1 cm/s, tighter than A's 0.3 or C's 0.5 — even though B's values are the furthest from the true value."}, {"id": 52, "level": "Intermediate", "tag": "Accuracy vs. Precision", "stem": "Using the same data — true speed 9.0 cm/s; Student A: 9.0, 8.9, 8.7; Student B: 7.0, 7.1, 7.0; Student C: 9.5, 9.0, 9.2 — which student is the MOST accurate?", "options": ["Student C", "Student B", "All three are equally accurate", "Student A"], "answer": "D", "answer_text": "Student A", "exp": "Accuracy compares the results to the true value of 9.0 cm/s. Student A's average (8.87) is closest to 9.0; Student C averages 9.23 and Student B averages 7.03. Tight agreement is precision, not accuracy."}, {"id": 53, "level": "Intermediate", "tag": "Accuracy vs. Precision", "stem": "A balance is miscalibrated and reads exactly 2.00 g too high on every measurement. A student's repeated masses of the same object will be:", "options": ["precise but not accurate", "both accurate and precise", "accurate but not precise", "neither accurate nor precise"], "answer": "A", "answer_text": "precise but not accurate", "exp": "Because the error is the same every time, the trials will agree closely with each other — that is precision. But every value is off by the same 2.00 g, so none of them is accurate. A consistent offset like this is a systematic error."}, {"id": 54, "level": "Intermediate", "tag": "Accuracy vs. Precision", "stem": "One lab group measures 100.0 mL of liquid in a 100-mL graduated cylinder marked every 1 mL, and another measures 100 mL using a plastic cup with a single line drawn at 100 mL. Which statement best explains the difference in their results?", "options": ["The graduated cylinder gives more precise measurements because it has finer markings", "Both containers give equally precise measurements because both hold 100 mL", "Precision depends only on the person measuring, never on the instrument used", "The plastic cup gives more precise measurements because it is wider and larger"], "answer": "A", "answer_text": "The graduated cylinder gives more precise measurements because it has finer markings", "exp": "Precision is limited by how finely the instrument is marked. Closely spaced markings let you report more known digits before you estimate; a single hand-drawn line supports almost no certain digits at all."}, {"id": 55, "level": "Intermediate", "tag": "Measuring with Significant Digits", "stem": "A graduated cylinder is marked every 1 mL and the liquid sits about halfway between the 24 and 25 mL lines. How should the volume be recorded?", "options": ["24 mL", "24.53 mL", "24.5 mL", "25 mL"], "answer": "C", "answer_text": "24.5 mL", "exp": "The ones place is known from the markings and the tenths place is estimated between them, giving 24.5 mL. Recording 24.53 mL claims a second estimated digit the cylinder cannot support."}, {"id": 56, "level": "Intermediate", "tag": "Measuring with Significant Digits", "stem": "When reading the volume of water in a graduated cylinder, you should read:", "options": ["the average of the top and the bottom of the curved surface", "whichever mark on the scale happens to be closest to the water", "the top edge of the curve, where the water touches the glass", "the bottom of the curved surface, with your eye level with the liquid"], "answer": "D", "answer_text": "the bottom of the curved surface, with your eye level with the liquid", "exp": "Water curves upward where it touches the glass, so the convention is to read the bottom of that curve. Keeping your eye level with the liquid prevents reading the scale from an angle."}, {"id": 57, "level": "Intermediate", "tag": "Measuring with Significant Digits", "stem": "A group measures 100 mL of liquid using a plastic cup with a single hand-drawn line at 100 mL. How many significant digits can they honestly report?", "options": ["2", "4", "1", "3"], "answer": "C", "answer_text": "1", "exp": "With only one mark and nothing else to go by, the entire measurement is essentially an estimate — no digit is truly known from markings. Reporting 100.0 mL from that cup would claim precision the tool does not have."}, {"id": 58, "level": "Intermediate", "tag": "Measuring with Significant Digits", "stem": "Two groups measure the same liquid. Group 1 uses a 10-mL graduated cylinder marked every 0.1 mL and reports 8.40 mL. Group 2 uses a 50-mL beaker marked every 10 mL and reports 8 mL. What is the best explanation?", "options": ["Group 1's instrument has finer markings, so it supports more significant digits", "Group 2 made a mistake and should redo the measurement with more care", "The two measurements cannot be compared because the containers differ", "Group 2's measurement is more accurate because it uses fewer digits"], "answer": "A", "answer_text": "Group 1's instrument has finer markings, so it supports more significant digits", "exp": "Neither group is wrong. The number of significant digits you may report is set by the instrument's markings, and a cylinder graduated every 0.1 mL supports two more digits than a beaker marked every 10 mL."}, {"id": 59, "level": "Intermediate", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 0.0500 g?", "options": ["5", "3", "2", "1"], "answer": "B", "answer_text": "3", "exp": "The leading zeros are placeholders and never count. The 5 and the two trailing zeros after the decimal point are all significant — 3 SD."}, {"id": 60, "level": "Intermediate", "tag": "Counting Significant Digits", "stem": "How many significant digits are in the measurement 900. mL (written with a decimal point)?", "options": ["3", "1", "2", "4"], "answer": "A", "answer_text": "3", "exp": "The decimal point at the end is a deliberate signal that the trailing zeros were measured, not placeholders. That makes all three digits significant. Without the decimal point, 900 mL would be only 1 SD."}, {"id": 61, "level": "Intermediate", "tag": "Counting Significant Digits", "stem": "Which of these measurements has exactly 4 significant digits?", "options": ["0.007 g", "1500 g", "0.0250 g", "20.05 g"], "answer": "D", "answer_text": "20.05 g", "exp": "In 20.05 g all four digits count — the trapped zeros are always significant. By comparison, 0.0250 g has 3 SD, 1500 g has 2 SD, and 0.007 g has just 1 SD."}, {"id": 62, "level": "Intermediate", "tag": "Calculating with Significant Digits", "stem": "A student adds three volume measurements: 7.89 mL + 4.5 mL + 10. mL (note the decimal point after the 10). The answer, to the correct number of significant digits, is:", "options": ["22.4 mL", "22.3 mL", "22 mL", "22.39 mL"], "answer": "C", "answer_text": "22 mL", "exp": "Addition is limited by DECIMAL PLACES. The value 10. mL was measured only to the ones place — the decimal point shows the zero is significant, but nothing beyond it is — so the raw sum 22.39 must be reported to the ones place: 22 mL."}, {"id": 63, "level": "Intermediate", "tag": "Calculating with Significant Digits", "stem": "What is the density of a marble with a mass of 5.5 g and a volume of 15.0 mL? (Density = mass / volume)", "options": ["0.37 g/mL", "0.4 g/mL", "82.5 g/mL", "83 g/mL"], "answer": "A", "answer_text": "0.37 g/mL", "exp": "Divide, do not multiply: 5.5 g ÷ 15.0 mL = 0.3667 g/mL. The 5.5 g has only 2 SD, so the answer is reported as 0.37 g/mL."}, {"id": 64, "level": "Intermediate", "tag": "Calculating with Significant Digits", "stem": "A rectangle measures 3.24 cm by 1.2 cm. What is its area, reported to the correct number of significant digits?", "options": ["3.9 cm²", "3.89 cm²", "4 cm²", "3.888 cm²"], "answer": "A", "answer_text": "3.9 cm²", "exp": "For multiplication the answer takes the same number of SD as the least precise measurement. 1.2 cm has 2 SD, so the raw product 3.888 rounds to 3.9 cm²."}, {"id": 65, "level": "Intermediate", "tag": "Calculating with Significant Digits", "stem": "Add: 25.36 g + 4.2 g. Report the answer to the correct number of significant digits.", "options": ["29.5 g", "29.56 g", "29.6 g", "30 g"], "answer": "C", "answer_text": "29.6 g", "exp": "Addition goes by DECIMAL PLACES, not by counting digits. The 4.2 g is known only to the tenths place, so the answer stops at tenths: 29.56 rounds to 29.6 g."}, {"id": 66, "level": "Intermediate", "tag": "Calculating with Significant Digits", "stem": "A rectangle is measured as 1 cm by 234 cm. What is its area, reported to the correct number of significant digits?", "options": ["1 cm²", "230 cm²", "234 cm²", "2 × 10² cm²"], "answer": "D", "answer_text": "2 × 10² cm²", "exp": "The measurement 1 cm has only 1 SD, and that limits the whole answer to 1 SD. The product 234 must be rounded all the way to 200, written as 2 × 10² cm² so the single significant digit is unmistakable — a striking reminder that one sloppy measurement ruins an entire calculation."}, {"id": 67, "level": "Intermediate", "tag": "Density", "stem": "A sample has a mass of 24.0 g and a volume of 3.0 mL. What is its density, reported to the correct number of significant digits?", "options": ["8 g/mL", "72 g/mL", "0.13 g/mL", "8.0 g/mL"], "answer": "D", "answer_text": "8.0 g/mL", "exp": "Density = 24.0 g ÷ 3.0 mL = 8.0 g/mL. The 3.0 mL has 2 SD, so the answer must show 2 SD — which is why 8.0 g/mL is right and plain '8 g/mL' (1 SD) is not."}, {"id": 68, "level": "Intermediate", "tag": "Density", "stem": "Aluminum has a density of 2.70 g/cm³. What is the mass of a 15.0 cm³ piece of aluminum? (Density = mass / volume)", "options": ["5.56 g", "40 g", "0.180 g", "40.5 g"], "answer": "D", "answer_text": "40.5 g", "exp": "Rearranging gives mass = density × volume = (2.70 g/cm³)(15.0 cm³) = 40.5 g. Both measurements have 3 SD, so the answer keeps 3 SD."}, {"id": 69, "level": "Intermediate", "tag": "Density", "stem": "A graduated cylinder holds 25.0 mL of water. A 58.5 g metal object is added and the water rises to 32.5 mL. What is the density of the metal?", "options": ["2.34 g/mL", "0.13 g/mL", "7.8 g/mL", "1.80 g/mL"], "answer": "C", "answer_text": "7.8 g/mL", "exp": "The rise in water level IS the object's volume: 32.5 − 25.0 = 7.5 mL. Notice that subtracting two 3-SD readings left a value with only 2 SD, and that now limits everything downstream: 58.5 g ÷ 7.5 mL = 7.8 g/mL, reported to 2 SD. Dividing by the final volume of 32.5 mL instead of the displaced volume is the usual error."}, {"id": 70, "level": "Intermediate", "tag": "Density", "stem": "Which sample is the MOST dense?", "options": ["20.0 g occupying 5.0 mL", "15.0 g occupying 2.0 mL", "30.0 g occupying 5.0 mL", "10.0 g occupying 2.0 mL"], "answer": "B", "answer_text": "15.0 g occupying 2.0 mL", "exp": "You have to compute each ratio — the largest mass is not automatically the densest. Working each one out: 10.0 g ÷ 2.0 mL = 5.0, 15.0 g ÷ 2.0 mL = 7.5, 20.0 g ÷ 5.0 mL = 4.0, and 30.0 g ÷ 5.0 mL = 6.0 g/mL — so 15.0 g in 2.0 mL is the densest."}, {"id": 71, "level": "Intermediate", "tag": "Density", "stem": "A block of lead is cut exactly in half. Compared to the original block, each half has:", "options": ["half the mass and the same density", "half the mass and twice the density", "the same mass and half the density", "half the mass and half the density"], "answer": "A", "answer_text": "half the mass and the same density", "exp": "Cutting the block halves both mass and volume, so the ratio between them — the density — is unchanged. Density is intensive; mass is extensive."}, {"id": 72, "level": "Intermediate", "tag": "Classifying Matter", "stem": "Sterling silver is silver mixed with copper. How should it be classified?", "options": ["A pure substance, because the two metals blend into one uniform appearance", "A mixture, because the metals are physically combined and each keeps its own properties", "An element, because silver appears on the periodic table as a single symbol", "A compound, because the silver and copper atoms bond in a fixed whole-number ratio"], "answer": "B", "answer_text": "A mixture, because the metals are physically combined and each keeps its own properties", "exp": "The two metals are not chemically bonded to each other, and each one keeps its own properties inside the alloy, so sterling silver is a mixture. Looking completely uniform does not make something pure — that only makes it a homogeneous mixture."}, {"id": 73, "level": "Intermediate", "tag": "Classifying Matter", "stem": "Hydrogen peroxide has the formula H₂O₂. It is best classified as:", "options": ["a solution", "a compound", "an element", "a mixture"], "answer": "B", "answer_text": "a compound", "exp": "Two different types of atoms are chemically combined in a fixed ratio, which is the definition of a compound. Note that H₂O₂ is a different compound from water (H₂O), even though both contain only H and O."}, {"id": 74, "level": "Intermediate", "tag": "Classifying Matter", "stem": "Salt dissolved in water forms a clear, uniform liquid. This is:", "options": ["a mixture, because the salt can be recovered by evaporating the water", "a pure substance, because the liquid is clear and has no visible particles", "an element, because the dissolved salt and water act as one single substance", "a compound, because the salt and the water bonded chemically when they mixed"], "answer": "A", "answer_text": "a mixture, because the salt can be recovered by evaporating the water", "exp": "If a physical process such as evaporation can pull the components back apart, the material is a mixture. Being clear and uniform only means it is a homogeneous mixture, not a pure substance."}, {"id": 75, "level": "Intermediate", "tag": "Classifying Matter", "stem": "One white solid melts sharply at exactly 78 °C. A second white solid softens gradually between 65 °C and 81 °C. What can you conclude?", "options": ["The first is likely a pure substance and the second is likely a mixture", "Both must be mixtures, because all solids melt across a range of temperatures", "The second solid must be denser, because it needed a higher temperature", "Both are pure substances, because each one melted when it was heated enough"], "answer": "A", "answer_text": "The first is likely a pure substance and the second is likely a mixture", "exp": "A pure substance has one sharp, characteristic melting point. A mixture melts across a RANGE because its components melt at different temperatures, so the gradual 65–81 °C softening points to a mixture."}, {"id": 76, "level": "Intermediate", "tag": "Physical vs. Chemical Properties and Changes", "stem": "A student stirs iron filings into sand, then pulls the iron back out with a magnet. This shows that:", "options": ["the iron was destroyed, because the magnet pulled its particles apart", "the combination was a mixture, because the parts kept their own properties", "a chemical change occurred, because the magnet created a new substance", "the two formed a compound, because they were combined in a fixed ratio"], "answer": "B", "answer_text": "the combination was a mixture, because the parts kept their own properties", "exp": "The iron kept its magnetic property the whole time and came back out unchanged. Substances in a mixture retain their individual properties, and no new substance was ever formed."}, {"id": 77, "level": "Intermediate", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Corn starch stirred into cold water stays cloudy and settles out, while sugar dissolves completely into a clear solution. Solubility in water is:", "options": ["a physical property, because neither substance was changed into something else", "not useful for identifying substances, because it depends on the amount used", "a chemical property, because each powder turned into a new substance in water", "an extensive property, because more powder means a greater solubility value"], "answer": "A", "answer_text": "a physical property, because neither substance was changed into something else", "exp": "Both powders can be recovered unchanged by evaporating the water, so no new substance formed — solubility is a physical property. It is also intensive, which makes it a genuinely useful identification test."}, {"id": 78, "level": "Intermediate", "tag": "Physical vs. Chemical Properties and Changes", "stem": "A student adds vinegar to a white powder and observes steady bubbling and fizzing. This is evidence of:", "options": ["a physical change, because the powder simply dissolved", "an error in the procedure", "a chemical change, because a new gas was produced", "an extensive property of the powder"], "answer": "C", "answer_text": "a chemical change, because a new gas was produced", "exp": "A gas appearing where there was none before signals that new substances formed. Simple dissolving would produce a clear or cloudy liquid without any sustained fizzing."}, {"id": 79, "level": "Intermediate", "tag": "States of Matter and Particle Models", "stem": "Which particle model best represents a GAS?", "options": ["Particles touching but able to slide past one another", "Particles arranged in a single flat layer", "Particles far apart, moving quickly in random directions", "Particles packed tightly in a fixed, orderly arrangement"], "answer": "C", "answer_text": "Particles far apart, moving quickly in random directions", "exp": "Gas particles have enough energy to overcome their attractions entirely, so they spread far apart and travel randomly. That is why a gas has neither a definite shape nor a definite volume."}, {"id": 80, "level": "Intermediate", "tag": "States of Matter and Particle Models", "stem": "In the PhET simulation, heat is added to solid neon until it reaches its melting point. At that moment the particles:", "options": ["stop moving completely once the melting temperature has finally been reached", "gain enough energy to break out of their fixed positions and begin sliding past one another", "become a different element as the added heat rearranges the neon particles", "spread far apart and immediately fill every corner of the container evenly"], "answer": "B", "answer_text": "gain enough energy to break out of their fixed positions and begin sliding past one another", "exp": "At the melting point the added energy is enough to overcome the attractions holding particles in fixed spots, so they begin sliding past each other — the solid becomes a liquid. Spreading out to fill the container happens later, at the boiling point."}, {"id": 81, "level": "Intermediate", "tag": "Separating Mixtures", "stem": "A mixture contains sand and salt in water. Which sequence separates BOTH solids?", "options": ["Evaporate all of the water first, then filter the dry solids apart", "Filter the mixture, then evaporate the water from the filtrate", "Filter the mixture twice, using fresh filter paper each time", "Use a magnet to remove the sand, then filter out the salt"], "answer": "B", "answer_text": "Filter the mixture, then evaporate the water from the filtrate", "exp": "Sand is insoluble and gets trapped by the filter, while dissolved salt passes straight through with the water. Evaporating that filtrate then leaves the salt behind. Evaporating first would strand the salt and sand together."}, {"id": 82, "level": "Intermediate", "tag": "Separating Mixtures", "stem": "Why does filtration FAIL to remove dissolved salt from salt water?", "options": ["The filter paper is not strong enough to hold back the heavy salt particles", "The salt reacts with the filter paper and passes through as a new substance", "The dissolved salt particles are far too small to be caught by the filter", "Filter paper can only trap substances that are magnetic, and salt is not magnetic"], "answer": "C", "answer_text": "The dissolved salt particles are far too small to be caught by the filter", "exp": "Filtration separates by particle size, and dissolved salt exists as individual particles spread among the water particles — far smaller than any pore in the paper. Only removing the water itself will recover the salt."}, {"id": 83, "level": "Intermediate", "tag": "Separating Mixtures", "stem": "When using a magnet to pull iron filings from a mixture, why must you find the mass of the magnet BEFORE and AFTER collecting the filings?", "options": ["Because the balance only gives correct readings when metal is placed on it", "To check that the magnet is strong enough to attract all of the filings", "Because the mass of the iron is the difference between the two readings", "To make sure the magnet did not react chemically with the iron filings"], "answer": "C", "answer_text": "Because the mass of the iron is the difference between the two readings", "exp": "You cannot mass the filings directly while they cling to the magnet, so you mass the magnet alone first and again with the filings attached. Subtracting gives the mass of the iron only — the same subtraction technique used to mass a liquid in a container."}, {"id": 84, "level": "Intermediate", "tag": "Percent Difference", "stem": "A group recovers 4.75 g of salt from a mixture. The actual mass was 5.00 g. What is the percent difference? (percent difference = |actual − measured| ÷ actual × 100)", "options": ["4.75%", "5.0%", "25%", "0.25%"], "answer": "B", "answer_text": "5.0%", "exp": "Subtract first: |5.00 − 4.75| = 0.25 g. Subtraction keeps the hundredths place, but leading zeros are not significant, so that difference carries only 2 SD. Dividing, 0.25 ÷ 5.00 = 0.050, and × 100 gives 5.0% — two significant digits, not 5.00%."}, {"id": 85, "level": "Intermediate", "tag": "Percent Difference", "stem": "A group recovers 11.43 g of lima beans from a mixture that actually contained 12.00 g. What is the percent difference? (percent difference = |actual − measured| ÷ actual × 100)", "options": ["5.0%", "0.57%", "4.8%", "4.75%"], "answer": "C", "answer_text": "4.8%", "exp": "|12.00 − 11.43| = 0.57 g, a difference with only 2 SD. Then 0.57 ÷ 12.00 = 0.0475, and × 100 gives 4.75%, which must be rounded to 2 SD: 4.8%. Dividing by the measured value instead of the actual value gives 5.0% — the other common mistake."}, {"id": 86, "level": "Intermediate", "tag": "Percent Difference", "stem": "A group's percent difference for sand is 32%, while their percent difference for iron is 2%. What is the best interpretation?", "options": ["Both results are equally good", "Percent difference cannot be compared between substances", "Their sand result is far less reliable than their iron result", "Their sand result is more accurate"], "answer": "C", "answer_text": "Their sand result is far less reliable than their iron result", "exp": "Percent difference measures how far a result strays from the actual value as a fraction of that value, so a smaller number means a better recovery. A 32% difference points to a real problem in the sand step — spilling, incomplete drying, or losses during transfer."}, {"id": 87, "level": "Intermediate", "tag": "Identifying an Unknown", "stem": "Two white powders both dissolve completely in water and both look identical. What is the BEST next step to tell them apart?", "options": ["Run a different test, such as adding vinegar or phenolphthalein", "Repeat the solubility test more carefully with fresh water samples", "Compare how much of each powder you were given in the containers", "Describe the texture and color of each powder in greater detail"], "answer": "A", "answer_text": "Run a different test, such as adding vinegar or phenolphthalein", "exp": "A test that gives the same result for both cannot distinguish them no matter how carefully you repeat it. You need a test whose outcome actually differs — a reaction with acid, or an indicator color change."}, {"id": 88, "level": "Intermediate", "tag": "Identifying an Unknown", "stem": "Why are texture and crystal shape considered POOR properties for identifying an unknown powder?", "options": ["They can be changed — by grinding, for example — without changing what the substance actually is", "They are always exactly the same for every white powder, so they never differ", "They cannot be observed at all without a microscope and other special equipment", "They are chemical properties, so observing them destroys the sample being tested"], "answer": "A", "answer_text": "They can be changed — by grinding, for example — without changing what the substance actually is", "exp": "Grind a coarse crystal into a fine powder and the texture and shape change completely while the substance stays chemically identical. A property you can alter without changing the substance's identity cannot reliably identify it."}, {"id": 89, "level": "Intermediate", "tag": "Claim, Evidence, and Reasoning", "stem": "In a Claim–Evidence–Reasoning response, the CLAIM should be:", "options": ["a numbered list of every observation recorded during the investigation", "a direct quotation copied from a website about the topic being studied", "a step-by-step description of the procedure the group followed in lab", "a complete sentence that directly answers the question being investigated"], "answer": "D", "answer_text": "a complete sentence that directly answers the question being investigated", "exp": "The claim is your answer to the question, stated in one clear complete sentence. Observations belong in the evidence section, and the procedure and sources support the claim rather than being the claim."}, {"id": 90, "level": "Intermediate", "tag": "Claim, Evidence, and Reasoning", "stem": "A student writes: “The unknown bubbled when vinegar was added.” In a CER response, this statement is:", "options": ["evidence", "the claim", "the research", "reasoning"], "answer": "A", "answer_text": "evidence", "exp": "This is a specific observation from the investigation, which is exactly what evidence is. The reasoning would be the sentence that explains WHY bubbling with vinegar supports the claim about the unknown's identity."}, {"id": 91, "level": "Advanced", "tag": "Intensive vs. Extensive Properties", "stem": "The whole lead block has a mass of 307.80 g and a volume of 27.15 cm³. The quarter block has a mass of 76.95 g and a volume of 6.788 cm³. What is the density of the QUARTER block?", "options": ["11.3362 g/cm³", "0.08821 g/cm³", "11.34 g/cm³", "522.3 g/cm³"], "answer": "C", "answer_text": "11.34 g/cm³", "exp": "76.95 g ÷ 6.788 cm³ = 11.3362… The volume carries 4 SD, so the answer keeps 4 SD: 11.34 g/cm³ — identical to the whole block's 307.80 ÷ 27.15 = 11.34 g/cm³. That match is exactly what makes density intensive."}, {"id": 92, "level": "Advanced", "tag": "Intensive vs. Extensive Properties", "stem": "Investigators want to determine whether the liquid in the shot glass is water. Which measurement would be MOST useful on its own?", "options": ["The mass of liquid in the glass", "The number of glasses on the table", "The density of the liquid", "The volume of liquid in the glass"], "answer": "C", "answer_text": "The density of the liquid", "exp": "Mass, volume, and count all depend on how much liquid happened to be poured, so they cannot identify anything. Density is intensive, so it can be compared to the known density of water no matter how much liquid there is."}, {"id": 93, "level": "Advanced", "tag": "Intensive vs. Extensive Properties", "stem": "A student argues: “This sample must be aluminum, because its mass is 7.1 grams.” What is the flaw in the reasoning?", "options": ["Aluminum cannot have a mass of 7.1 g", "Mass is extensive, so any substance could have a mass of 7.1 g", "7.1 grams is too small a mass to measure", "The student should have used weight instead of mass"], "answer": "B", "answer_text": "Mass is extensive, so any substance could have a mass of 7.1 g", "exp": "Because mass depends entirely on how much of a substance you have, a 7.1 g sample could be aluminum, sugar, or sand. Identification requires an intensive property — density, melting point, or a chemical test."}, {"id": 94, "level": "Advanced", "tag": "Accuracy vs. Precision", "stem": "Every group in the class measures the same 100. mL of liquid, but each group uses a different vessel. The class data spread from 96 mL to 104 mL. What does this spread mainly demonstrate?", "options": ["The actual volume of the liquid was never really 100. mL to begin with", "The precision of a measurement is limited by the instrument used", "The liquid changed volume as it was poured from vessel to vessel", "The students were careless and read their vessels without looking"], "answer": "B", "answer_text": "The precision of a measurement is limited by the instrument used", "exp": "The variable that changed from group to group was the glassware, not the liquid. Finely marked instruments support more known digits and produce tightly clustered values; coarse ones do not — which is the whole point of assigning different vessels."}, {"id": 95, "level": "Advanced", "tag": "Accuracy vs. Precision", "stem": "A student's three trials cluster tightly but all fall well below the accepted value. What type of error is MOST likely, and how would you fix it?", "options": ["Systematic error; fix it by checking and recalibrating the instrument or technique", "Random error; fix it by using a much larger sample of the liquid each time", "Random error; fix it by running many more trials and reporting the average", "Systematic error; fix it by averaging the three trials that were collected"], "answer": "A", "answer_text": "Systematic error; fix it by checking and recalibrating the instrument or technique", "exp": "A consistent offset in one direction is the signature of systematic error — a miscalibrated balance, a misread meniscus, an uncorrected container mass. More trials or averaging cannot help, because every trial carries the same built-in error."}, {"id": 96, "level": "Advanced", "tag": "Accuracy vs. Precision", "stem": "A student runs twenty trials on a balance that reads 2.00 g too high. The average of the twenty trials will be:", "options": ["accurate, because averaging cancels out error", "impossible to determine", "both accurate and precise", "precise but still inaccurate by about 2.00 g"], "answer": "D", "answer_text": "precise but still inaccurate by about 2.00 g", "exp": "Averaging cancels RANDOM error that scatters both directions, but this error pushes every reading the same way by the same amount. Twenty trials simply produce a very precise wrong answer, still about 2.00 g high."}, {"id": 97, "level": "Advanced", "tag": "Measuring with Significant Digits", "stem": "You need to measure about 100 mL of liquid and record it with the greatest number of significant digits. Which vessel should you choose?", "options": ["A 100-mL graduated cylinder marked every 1 mL", "A 50-mL beaker marked every 10 mL", "A plastic cup with one line drawn at 100 mL", "A 400-mL beaker marked every 50 mL"], "answer": "A", "answer_text": "A 100-mL graduated cylinder marked every 1 mL", "exp": "More significant digits come from finer markings, and only the 100-mL graduated cylinder both holds the sample and is marked every 1 mL — letting you report the ones place as known and estimate the tenths."}, {"id": 98, "level": "Advanced", "tag": "Calculating with Significant Digits", "stem": "A rectangular block measures 3.20 cm × 2.15 cm × 4.00 cm. What is its volume, reported to the correct number of significant digits? (Volume = length × width × height)", "options": ["27.520 cm³", "27.5 cm³", "27.52 cm³", "28 cm³"], "answer": "B", "answer_text": "27.5 cm³", "exp": "The raw product is 27.52 cm³. All three edges were measured to 3 SD, so the answer keeps 3 SD: 27.5 cm³. Reporting 27.52 cm³ claims a fourth significant digit that none of the three measurements supports."}, {"id": 99, "level": "Advanced", "tag": "Calculating with Significant Digits", "stem": "A beaker plus liquid has a mass of 148.62 g and the empty beaker has a mass of 96.40 g. The liquid was delivered from a buret and has a volume of 50.00 mL. What is the density of the liquid, reported to the correct number of significant digits?", "options": ["1.044 g/mL", "1.0444 g/mL", "2.972 g/mL", "1.04 g/mL"], "answer": "A", "answer_text": "1.044 g/mL", "exp": "Subtract first, by DECIMAL PLACES: 148.62 − 96.40 = 52.22 g, and because both masses were read to the hundredths place all four digits survive. Then divide by SD: 52.22 g ÷ 50.00 mL = 1.0444, and with 4 SD in both values the answer is 1.044 g/mL. Forgetting to subtract the cylinder's own mass gives 2.972 g/mL."}, {"id": 100, "level": "Advanced", "tag": "Calculating with Significant Digits", "stem": "The whole lead block has a mass of 307.80 g and a volume of 27.15 cm³. What is its density, reported to the correct number of significant digits?", "options": ["11.3 g/cm³", "11.34 g/cm³", "11.337017 g/cm³", "11 g/cm³"], "answer": "B", "answer_text": "11.34 g/cm³", "exp": "307.80 ÷ 27.15 = 11.337017… The volume carries 4 SD, which limits the answer to 4 SD: 11.34 g/cm³. Copying the calculator's whole display would claim eight digits of certainty that the balance and the volume measurement never provided — and 11.34 g/cm³ is the accepted density of lead."}, {"id": 101, "level": "Advanced", "tag": "Calculating with Significant Digits", "stem": "Three measured trials total 45.6 cm. The average is found by dividing by 3. How many significant digits should the average have?", "options": ["2, because dividing always costs you one significant digit in the answer", "4, because averaging several trials increases the precision of the result", "3, because 45.6 has 3 significant digits and the 3 is an exact counted number", "1, because the number 3 you divided by has only one significant digit"], "answer": "C", "answer_text": "3, because 45.6 has 3 significant digits and the 3 is an exact counted number", "exp": "The 3 is a counted number, not a measurement, so it carries no uncertainty and never limits the answer. Only the measured sum controls the result: 45.6 ÷ 3 = 15.2 cm, with 3 SD."}, {"id": 102, "level": "Advanced", "tag": "Density", "stem": "The liquid from the shot glass has a mass of 52.93 g and, measured with a volumetric pipet, a volume of 50.00 mL. Pure water has a density of 1.000 g/mL. What is the best conclusion?", "options": ["The density is 0.9446 g/mL, so the liquid is less dense than water and must be a different liquid", "The density is 1.059 g/mL, close to but not equal to water — the liquid may be water with something dissolved in it", "Density cannot be used to investigate this liquid, since only mass and volume were measured", "The density is 1.059 g/mL, which is close enough to 1.000 g/mL to prove the liquid is pure water"], "answer": "B", "answer_text": "The density is 1.059 g/mL, close to but not equal to water — the liquid may be water with something dissolved in it", "exp": "52.93 g ÷ 50.00 mL = 1.0586, reported to 4 SD as 1.059 g/mL. Being measurably higher than water's 1.000 g/mL — and by more than the measurement's own uncertainty — is exactly what you would expect from water with a solid dissolved in it, which is why the next step is to boil the liquid away and examine the residue."}, {"id": 103, "level": "Advanced", "tag": "Density", "stem": "An 80.3 g metal sample raises the water level in a graduated cylinder from 20.0 mL to 30.2 mL. Using the table — aluminum 2.70, iron 7.87, copper 8.96, lead 11.34 g/cm³ — the metal is most likely:", "options": ["iron", "copper", "aluminum", "lead"], "answer": "A", "answer_text": "iron", "exp": "The displaced volume is 30.2 − 20.0 = 10.2 mL; subtraction goes by decimal places, so the tenths place survives and the result carries 3 SD. Dividing, 80.3 g ÷ 10.2 mL = 7.8725, reported to 3 SD as 7.87 g/cm³ — an exact match for iron."}, {"id": 104, "level": "Advanced", "tag": "Density", "stem": "Three liquids that do not mix are poured into one cylinder: oil (0.92 g/mL), water (1.00 g/mL), and glycerin (1.26 g/mL). From TOP to BOTTOM, the layers will be:", "options": ["water, oil, glycerin", "oil, water, glycerin", "glycerin, water, oil", "oil, glycerin, water"], "answer": "B", "answer_text": "oil, water, glycerin", "exp": "The least dense liquid floats highest and the most dense sinks. Ordering the densities from smallest to largest puts oil on top, water in the middle, and glycerin on the bottom."}, {"id": 105, "level": "Advanced", "tag": "Density", "stem": "A cube measures 2.00 cm on every edge and has a mass of 21.60 g. What is its density?", "options": ["43.20 g/cm³", "5.40 g/cm³", "2.70 g/cm³", "10.80 g/cm³"], "answer": "C", "answer_text": "2.70 g/cm³", "exp": "First find the volume: 2.00 × 2.00 × 2.00 = 8.00 cm³. The mass 21.60 g carries 4 SD but the volume only 3, so the volume is the limiter: 21.60 g ÷ 8.00 cm³ = 2.70 g/cm³, reported to 3 SD. Forgetting to use all three dimensions is the most common error here, and the result is an exact match for aluminum."}, {"id": 106, "level": "Advanced", "tag": "Density", "stem": "A block sold as “pure gold” (accepted density 19.30 g/cm³) has a mass of 386.0 g and a volume of 25.00 cm³. What should the buyer conclude?", "options": ["Density cannot identify a substance", "Its density is 15.44 g/cm³, so it is not pure gold", "It is pure gold, since 386.0 g is a large mass", "Its density is 19.30 g/cm³, confirming it is gold"], "answer": "B", "answer_text": "Its density is 15.44 g/cm³, so it is not pure gold", "exp": "386.0 g ÷ 25.00 cm³ = 15.44 g/cm³, with 4 SD in both measurements and therefore 4 SD in the answer. That is far short of gold's 19.30 g/cm³, and because density is intensive the gap is enough to rule out pure gold no matter how heavy the block feels."}, {"id": 107, "level": "Advanced", "tag": "Density", "stem": "Why is density a better first test for an unknown liquid than mass alone?", "options": ["Density is easier to measure in the lab than mass, since no balance is needed", "Density is intensive, so it has the same value for any amount of the liquid", "Mass cannot be measured accurately with the balances available in a lab", "Density requires no calculation, so it can be read directly off a scale"], "answer": "B", "answer_text": "Density is intensive, so it has the same value for any amount of the liquid", "exp": "Mass changes with how much liquid you happen to have, so it tells you nothing about identity. Density is the same for every sample of a given substance, so it can be compared directly against known values."}, {"id": 108, "level": "Advanced", "tag": "Classifying Matter", "stem": "The liquid from the shot glass was heated until it all boiled away at about 100 °C, leaving a white solid behind. What does this evidence indicate?", "options": ["The liquid was a pure substance that boiled away at 100 °C", "The white solid was created by the heat during the boiling", "The liquid was an element, since it all boiled away evenly", "The liquid was a mixture of water and a dissolved solid"], "answer": "D", "answer_text": "The liquid was a mixture of water and a dissolved solid", "exp": "Boiling near 100 °C points to water, but a pure liquid would leave nothing behind. A residue means something was dissolved in that water all along — the definition of a mixture, and the heat only separated the components rather than creating them."}, {"id": 109, "level": "Advanced", "tag": "Classifying Matter", "stem": "Which list contains ONLY compounds?", "options": ["Silver (Ag), tin (Sn), aluminum (Al), and solid iodine crystals (I₂)", "Bleach (NaClO and H₂O), table salt (NaCl), sterling silver (Ag and Cu)", "Silver (Ag), sodium hypochlorite (NaClO), table salt (NaCl), tin (Sn)", "Sodium hypochlorite (NaClO), hydrogen peroxide (H₂O₂), acetic acid (CH₃COOH)"], "answer": "D", "answer_text": "Sodium hypochlorite (NaClO), hydrogen peroxide (H₂O₂), acetic acid (CH₃COOH)", "exp": "Each of these has two or more DIFFERENT atoms chemically combined in a fixed formula. The other lists mix in elements (Ag, Sn, Al) or mixtures (bleach, sterling silver)."}, {"id": 110, "level": "Advanced", "tag": "Classifying Matter", "stem": "Can a mixture have a composition that varies from sample to sample?", "options": ["No — every mixture has one fixed composition set by a chemical formula", "Only if the mixture is a liquid — solid mixtures always stay fixed", "Yes — because the components are not chemically bonded, the proportions can vary", "Only if the mixture contains a metal — nonmetal mixtures cannot vary"], "answer": "C", "answer_text": "Yes — because the components are not chemically bonded, the proportions can vary", "exp": "A compound is locked to a fixed ratio by chemical bonds (water is always 2 hydrogen to 1 oxygen). Nothing locks a mixture, so salt water can be dilute or saturated and still be salt water."}, {"id": 111, "level": "Advanced", "tag": "Classifying Matter", "stem": "A student claims a clear, colorless liquid must be a pure substance because it looks completely uniform. What is the best response?", "options": ["Uniform appearance rules out a compound, so the liquid must be an element or a mixture", "Uniform appearance only rules out a heterogeneous mixture; a dissolved solid would still look uniform", "The student is correct; a liquid that looks completely uniform has been proven to be pure", "Appearance is a chemical property, so it cannot be used to classify a liquid at all"], "answer": "B", "answer_text": "Uniform appearance only rules out a heterogeneous mixture; a dissolved solid would still look uniform", "exp": "Homogeneous mixtures look completely uniform by definition — salt water is the obvious example. Distinguishing a pure substance from a homogeneous mixture takes a property test: density, boiling point, or boiling the liquid away to see whether a residue remains."}, {"id": 112, "level": "Advanced", "tag": "Physical vs. Chemical Properties and Changes", "stem": "A white powder is heated over a candle flame. It turns brown, gives off a burnt odor, and does not return to white on cooling. These observations indicate:", "options": ["a physical change, because heating only changed the state", "that the powder simply melted", "an extensive property of the powder", "a chemical change, because a new substance with new properties formed"], "answer": "D", "answer_text": "a chemical change, because a new substance with new properties formed", "exp": "A new color, a new odor, and irreversibility together point to new substances. Melting would be reversible on cooling and would not produce a burnt smell."}, {"id": 113, "level": "Advanced", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Plaster of Paris mixed with water becomes warm and hardens into a solid that cannot be returned to powder by drying. This is:", "options": ["a chemical change, because heat was released and a new substance formed irreversibly", "a physical change, because only water was added and nothing new was produced", "the same process as dissolving sugar, since both simply mix a solid into water", "a chemical property of water, because water makes every powder it touches harden"], "answer": "A", "answer_text": "a chemical change, because heat was released and a new substance formed irreversibly", "exp": "Released heat plus an irreversible product are strong chemical-change evidence. Dissolved sugar can be recovered by evaporating the water, but hardened plaster cannot be turned back into powder — which is also why it must never go down the sink."}, {"id": 114, "level": "Advanced", "tag": "Physical vs. Chemical Properties and Changes", "stem": "What is the key difference between a substance DISSOLVING and a substance REACTING?", "options": ["Reacting always produces a color change, but dissolving never changes the color", "Dissolving can only happen in water, while reacting can occur in any liquid", "Dissolving is always faster than reacting, which is how you tell them apart", "In dissolving, the substance can be recovered unchanged; in reacting, new substances form"], "answer": "D", "answer_text": "In dissolving, the substance can be recovered unchanged; in reacting, new substances form", "exp": "Dissolving spreads the original particles through the liquid without altering them, so evaporation brings them back. In a reaction the original substance is consumed and something new is produced, which no amount of evaporating will undo."}, {"id": 115, "level": "Advanced", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Which SET of observations best supports the conclusion that a chemical change occurred?", "options": ["The powder was white, felt gritty, and formed a pile", "The powder was ground finer and its volume decreased", "The mixture fizzed, warmed up, and turned pink permanently", "The powder dissolved and the solution stayed clear"], "answer": "C", "answer_text": "The mixture fizzed, warmed up, and turned pink permanently", "exp": "Gas production, a temperature change, and a permanent color change are three independent lines of evidence pointing to new substances. The others describe appearance, dissolving, and grinding — all physical."}, {"id": 116, "level": "Advanced", "tag": "States of Matter and Particle Models", "stem": "Rank the three states by the SPACING between particles, from closest together to furthest apart.", "options": ["Gas, liquid, solid", "Solid, liquid, gas", "Liquid, solid, gas", "Solid, gas, liquid"], "answer": "B", "answer_text": "Solid, liquid, gas", "exp": "Solid particles are locked closest together, liquid particles are still touching but able to slide, and gas particles are spread far apart. This ordering explains why solids and liquids hold their volume while gases do not."}, {"id": 117, "level": "Advanced", "tag": "States of Matter and Particle Models", "stem": "A sealed rigid container holds solid neon. As heat is added and the neon melts and then boils, what happens to the particles themselves?", "options": ["The particles are destroyed and then re-created as brand-new gas particles", "The particles change into a different element once the neon starts to boil", "The particles break apart into smaller pieces as the temperature increases", "The particles gain energy and move more freely, but each particle stays neon"], "answer": "D", "answer_text": "The particles gain energy and move more freely, but each particle stays neon", "exp": "Changes of state are physical changes — only the arrangement and energy of the particles change. Every particle is still a neon atom, whether it is vibrating in a solid, sliding in a liquid, or flying freely as a gas."}, {"id": 118, "level": "Advanced", "tag": "Separating Mixtures", "stem": "A mixture contains lima beans, sand, salt, and iron filings. Which procedure separates all four?", "options": ["Add water first, then use a magnet on the wet mixture, then filter everything and let the beans dry", "Filter the dry mixture first, then use a magnet on the filtrate, then evaporate what is in the funnel", "Use a magnet, pick out the lima beans, add water and filter to trap the sand, then evaporate the water to recover the salt", "Dissolve everything in water, evaporate it all at once, then filter the dry solids apart"], "answer": "C", "answer_text": "Use a magnet, pick out the lima beans, add water and filter to trap the sand, then evaporate the water to recover the salt", "exp": "Order matters. The magnet only works cleanly while everything is dry, so iron comes out first; the lima beans are large enough to pick out; water then dissolves only the salt so filtering traps the sand; evaporating the filtrate recovers the salt."}, {"id": 119, "level": "Advanced", "tag": "Separating Mixtures", "stem": "A group's recovered masses give a percent difference of 15% for the sand. Which explanation is MOST likely?", "options": ["The sand chemically reacted with the water and formed a new substance", "Sand is not a real substance, so its mass cannot be measured reliably", "Some sand was lost during transfer, or the sand was still damp when massed", "The balance was broken, since every mass reading in the lab was too high"], "answer": "C", "answer_text": "Some sand was lost during transfer, or the sand was still damp when massed", "exp": "Physical separation almost always loses a little material at each transfer, and undried sand carries extra water mass. Both are ordinary procedural losses — no chemical reaction is involved, since sand does not react with water."}, {"id": 120, "level": "Advanced", "tag": "Percent Difference", "stem": "A group recovers 5.10 g of iron filings from a mixture that actually contained 4.85 g. What is the percent difference? (percent difference = |actual − measured| ÷ actual × 100)", "options": ["4.9%", "0.25%", "5.15%", "5.2%"], "answer": "D", "answer_text": "5.2%", "exp": "|4.85 − 5.10| = 0.25 g, a difference carrying only 2 SD. Then 0.25 ÷ 4.85 = 0.0515, and × 100 gives 5.15% — which must be rounded to 2 SD: 5.2%. The absolute value ke
