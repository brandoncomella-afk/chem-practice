thing new is produced, which no amount of evaporating will undo."}, {"id": 115, "level": "Advanced", "tag": "Physical vs. Chemical Properties and Changes", "stem": "Which SET of observations best supports the conclusion that a chemical change occurred?", "options": ["The powder was white, felt gritty, and formed a pile", "The powder was ground finer and its volume decreased", "The mixture fizzed, warmed up, and turned pink permanently", "The powder dissolved and the solution stayed clear"], "answer": "C", "answer_text": "The mixture fizzed, warmed up, and turned pink permanently", "exp": "Gas production, a temperature change, and a permanent color change are three independent lines of evidence pointing to new substances. The others describe appearance, dissolving, and grinding — all physical."}, {"id": 116, "level": "Advanced", "tag": "States of Matter and Particle Models", "stem": "Rank the three states by the SPACING between particles, from closest together to furthest apart.", "options": ["Solid, gas, liquid", "Gas, liquid, solid", "Liquid, solid, gas", "Solid, liquid, gas"], "answer": "D", "answer_text": "Solid, liquid, gas", "exp": "Solid particles are locked closest together, liquid particles are still touching but able to slide, and gas particles are spread far apart. This ordering explains why solids and liquids hold their volume while gases do not."}, {"id": 117, "level": "Advanced", "tag": "States of Matter and Particle Models", "stem": "A sealed rigid container holds solid neon. As heat is added and the neon melts and then boils, what happens to the particles themselves?", "options": ["The particles change into a different element once the neon starts to boil", "The particles gain energy and move more freely, but each particle stays neon", "The particles break apart into smaller pieces as the temperature increases", "The particles are destroyed and then re-created as brand-new gas particles"], "answer": "B", "answer_text": "The particles gain energy and move more freely, but each particle stays neon", "exp": "Changes of state are physical changes — only the arrangement and energy of the particles change. Every particle is still a neon atom, whether it is vibrating in a solid, sliding in a liquid, or flying freely as a gas."}, {"id": 118, "level": "Advanced", "tag": "Separating Mixtures", "stem": "A mixture contains lima beans, sand, salt, and iron filings. Which procedure separates all four?", "options": ["Use a magnet, pick out the lima beans, add water and filter to trap the sand, then evaporate the water to recover the salt", "Filter the dry mixture first, then run a magnet through the filtrate, and finally evaporate whatever is left in the funnel", "Dissolve everything in water, evaporate all of it at once, and then filter the dry solids apart from one another", "Add water first, then drag a magnet through the wet mixture, then filter everything out and let the beans dry"], "answer": "A", "answer_text": "Use a magnet, pick out the lima beans, add water and filter to trap the sand, then evaporate the water to recover the salt", "exp": "Order matters. The magnet only works cleanly while everything is dry, so iron comes out first; the lima beans are large enough to pick out; water then dissolves only the salt so filtering traps the sand; evaporating the filtrate recovers the salt."}, {"id": 119, "level": "Advanced", "tag": "Separating Mixtures", "stem": "A group's recovered masses give a percent difference of 15% for the sand. Which explanation is MOST likely?", "options": ["Sand is not a real substance, so its mass cannot be measured reliably", "Some sand was lost during transfer, or the sand was still damp when massed", "The balance was broken, since every mass reading in the lab was too high", "The sand chemically reacted with the water and formed a new substance"], "answer": "B", "answer_text": "Some sand was lost during transfer, or the sand was still damp when massed", "exp": "Physical separation almost always loses a little material at each transfer, and undried sand carries extra water mass. Both are ordinary procedural losses — no chemical reaction is involved, since sand does not react with water."}, {"id": 120, "level": "Advanced", "tag": "Percent Difference", "stem": "A group recovers 5.10 g of iron filings from a mixture that actually contained 4.85 g. What is the percent difference? (percent difference = |actual − measured| ÷ actual × 100)", "options": ["5.15%", "5.2%", "4.9%", "0.25%"], "answer": "B", "answer_text": "5.2%", "exp": "|4.85 − 5.10| = 0.25 g, a difference carrying only 2 SD. Then 0.25 ÷ 4.85 = 0.0515, and × 100 gives 5.15% — which must be rounded to 2 SD: 5.2%. The absolute value keeps the result positive even though this group recovered MORE than the actual mass, and dividing by the measured value instead gives 4.9%."}, {"id": 121, "level": "Advanced", "tag": "Percent Difference", "stem": "A group recovers noticeably MORE iron than the mixture actually contained. What is the most reasonable explanation?", "options": ["The percent difference formula does not apply when the recovered mass is larger", "Extra iron was created during the separation by contact with the magnet", "The actual mass given by the teacher is only an estimate, so it can be ignored", "Some sand or damp material was collected along with the iron filings"], "answer": "D", "answer_text": "Some sand or damp material was collected along with the iron filings", "exp": "Matter is not created during a physical separation, so extra mass has to come from something else being collected — clinging sand, moisture, or fragments from the magnet. Recovering more than 100% is a standard signal of contamination."}, {"id": 122, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "Two of the white powders are both sodium chloride, but one is labeled “unknown” and the other “salt”; they differ only in crystal size. What does this tell you about crystal size?", "options": ["It determines the density of the substance, so larger crystals are denser", "It is a physical property that can differ between samples of the SAME substance", "It proves the two powders must be completely different substances after all", "It is a chemical property that reliably identifies which substance you have"], "answer": "B", "answer_text": "It is a physical property that can differ between samples of the SAME substance", "exp": "Two samples of the same compound can be ground or grown to different crystal sizes without changing what they are. Because crystal size varies within one substance, it is a physical property that cannot be used for identification."}, {"id": 123, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "An unknown white powder dissolves in water, does NOT fizz with vinegar, and does NOT turn phenolphthalein pink. Which conclusion is best supported?", "options": ["No conclusion is possible, because negative test results never count as real evidence", "The powder must be plaster of Paris, because it dissolved without any reaction at all", "The powder is definitely table salt, because it dissolved and produced no reaction", "The powder is not a carbonate and not a base, but more tests are needed to identify it"], "answer": "D", "answer_text": "The powder is not a carbonate and not a base, but more tests are needed to identify it", "exp": "Negative results are real evidence — no fizzing rules out carbonates like baking soda and washing soda, and no pink rules out bases. But several soluble, non-reactive powders remain, so the tests narrow the field without naming a single answer."}, {"id": 124, "level": "Advanced", "tag": "Identifying an Unknown", "stem": "The liquid in the shot glass boiled away at about 100 °C leaving a white solid, and that solid dissolves readily in water and conducts electricity in solution. Which conclusion is best supported?", "options": ["The unknown was a dissolved salt in water", "The unknown was pure water", "The unknown was corn starch in water", "The unknown was an alcohol"], "answer": "A", "answer_text": "The unknown was a dissolved salt in water", "exp": "Boiling near 100 °C indicates water; a residue rules out pure water; and a solid that dissolves readily and makes the solution conduct electricity is characteristic of a dissolved salt. Corn starch would not dissolve fully or conduct."}, {"id": 125, "level": "Advanced", "tag": "Claim, Evidence, and Reasoning", "stem": "Which FINAL CLAIM is the strongest?", "options": ["The student got sick from drinking the liquid that was in the shot glass, and I am pretty sure that whatever happened to be sitting in there is the thing that made the student feel so bad afterward, even though we never really checked what it was.", "The student became ill from consuming a large amount of dissolved salt: our tests showed the liquid left a salt residue that conducted electricity, and according to a medical source, consuming too much salt at once can cause seizures and coma.", "The student was most likely poisoned by some kind of substance that had been dissolved in the liquid sitting in the shot glass, and it must have been a fairly dangerous substance to do that, but we never actually figured out what the substance was.", "I think it was probably the salt that caused the whole problem, because that is basically what our group ended up finding in the lab that day, and a couple of the other groups seemed to get something pretty similar, so it feels like a reasonable guess to me."], "answer": "B", "answer_text": "The student became ill from consuming a large amount of dissolved salt: our tests showed the liquid left a salt residue that conducted electricity, and according to a medical source, consuming too much salt at once can cause seizures and coma.", "exp": "A strong final claim answers the question in a complete sentence, cites specific experimental evidence, brings in outside research, and gives credit to the source. The others are vague, hedged, or offer a conclusion with no supporting evidence at all."}, {"id": 126, "level": "Beginner", "tag": "Writing Scientific Notation", "stem": "Written in scientific notation, the measurement 0.00450 g is:", "options": ["4.50 × 10⁻³ g", "4.50 × 10³ g", "4.50 × 10⁻⁵ g", "4.50 × 10⁻² g"], "answer": "A", "answer_text": "4.50 × 10⁻³ g", "exp": "Move the decimal three places RIGHT to reach the coefficient 4.50, so the exponent is −3: 0.00450 g = 4.50 × 10⁻³ g. A value smaller than 1 takes a negative exponent, ruling out 4.50 × 10³ g, and the trailing zero stays because it was a measured digit in the original reading."}, {"id": 127, "level": "Beginner", "tag": "Writing Scientific Notation", "stem": "Written in standard form (as an ordinary decimal number), the volume 3.20 × 10⁻² L is:", "options": ["0.00320 L", "320. L", "0.0320 L", "0.320 L"], "answer": "C", "answer_text": "0.0320 L", "exp": "An exponent of −2 means the decimal point moves two places to the LEFT, so 3.20 becomes 0.0320 L. Moving the decimal to the RIGHT instead produces 320. L — a volume larger than the original rather than smaller."}, {"id": 128, "level": "Beginner", "tag": "Writing Scientific Notation", "stem": "In scientific notation the coefficient must be at least 1 and less than 10. Which value below is written correctly?", "options": ["70.5 × 10² cm", "0.705 × 10³ cm", "7.05 × 10⁴ cm", "705 × 10⁻¹ cm"], "answer": "C", "answer_text": "7.05 × 10⁴ cm", "exp": "Only 7.05 sits at least 1 and below 10, so 7.05 × 10⁴ cm is the one properly written form. The coefficients 705, 70.5, and 0.705 each break that rule — every one of those expressions names a real length, but none of them is in scientific notation."}, {"id": 129, "level": "Beginner", "tag": "Counting Digits in Scientific Notation", "stem": "How many significant digits are in the measurement 4.070 × 10⁻³ m?", "options": ["6", "4", "3", "2"], "answer": "B", "answer_text": "4", "exp": "Every significant digit lives in the coefficient. In 4.070 the 4, the captive zero, the 7, and the trailing zero all count — 4 SD, not 3. The count of 6 comes from writing the value out as 0.004070 and counting the leading zeros, which are never significant."}, {"id": 130, "level": "Beginner", "tag": "Counting Digits in Scientific Notation", "stem": "In the measurement 5.6 × 10⁻⁴ g, what does the exponent −4 tell you?", "options": ["The measurement was made with four significant digits rather than with two", "The mass itself is a negative quantity, because the exponent carries a negative sign", "The decimal point in 5.6 moves four places to the RIGHT, since a negative sign points toward the larger number", "The decimal point in 5.6 moves four places to the LEFT to write the value out in full"], "answer": "D", "answer_text": "The decimal point in 5.6 moves four places to the LEFT to write the value out in full", "exp": "The negative exponent means the value is smaller than 1, so the decimal shifts LEFT: 5.6 × 10⁻⁴ g = 0.00056 g. The minus sign belongs to the exponent, not to the mass itself, which is a perfectly ordinary positive quantity."}, {"id": 131, "level": "Beginner", "tag": "Writing Scientific Notation", "stem": "A trace of residue is reported in a lab manual as 0.000 0250 g. In scientific notation that mass is:", "options": ["2.50 × 10⁻⁵ g", "2.50 × 10⁻⁶ g", "2.50 × 10⁻⁴ g", "2.50 × 10⁵ g"], "answer": "A", "answer_text": "2.50 × 10⁻⁵ g", "exp": "Move the decimal point five places to the RIGHT to reach a coefficient of 2.50, so the exponent is −5: 0.000 0250 g = 2.50 × 10⁻⁵ g. Counting only the four zeros and stopping there gives 2.50 × 10⁻⁴ g, one power of ten too large."}, {"id": 132, "level": "Intermediate", "tag": "Writing Scientific Notation", "stem": "The crew of the Boeing 767 calculated that their 3,600-kilometer flight across Canada would need 22,300 kg of fuel, a value with 3 significant digits. In scientific notation that mass is:", "options": ["2.23 × 10⁴ kg", "2.23 × 10⁵ kg", "2.23 × 10⁻⁴ kg", "2.23 × 10³ kg"], "answer": "A", "answer_text": "2.23 × 10⁴ kg", "exp": "The decimal point moves four places LEFT, from 22,300. to 2.23, so the exponent is 4: 2.23 × 10⁴ kg. Three places gives 2.23 × 10³ kg and five gives 2.23 × 10⁵ kg, while 2.23 × 10⁻⁴ kg would be a fraction of a gram."}, {"id": 133, "level": "Intermediate", "tag": "Calculating in Scientific Notation", "stem": "When two values in scientific notation are multiplied, the coefficients are multiplied and the exponents are ADDED. What is (3.0 × 10⁴ cm) × (2.0 × 10³ cm), reported to the correct number of significant digits?", "options": ["6.0 × 10¹² cm²", "5.0 × 10⁷ cm²", "6.0 × 10⁷ cm²", "6.0 × 10¹ cm²"], "answer": "C", "answer_text": "6.0 × 10⁷ cm²", "exp": "Multiply the coefficients, 3.0 × 2.0 = 6.0, and add the exponents, 4 + 3 = 7, giving 6.0 × 10⁷ cm² with the 2 SD both values carry. Multiplying the exponents instead produces 6.0 × 10¹² cm², and adding the coefficients rather than multiplying gives 5.0 × 10⁷ cm²."}, {"id": 134, "level": "Intermediate", "tag": "Calculating in Scientific Notation", "stem": "What is (8.4 × 10⁵ mg) ÷ (2.0 × 10² mL), reported to the correct number of significant digits? (To divide, divide the coefficients and SUBTRACT the exponents.)", "options": ["4.2 × 10⁷ mg/mL", "4.2 × 10⁻³ mg/mL", "6.4 × 10³ mg/mL", "4.2 × 10³ mg/mL"], "answer": "D", "answer_text": "4.2 × 10³ mg/mL", "exp": "Divide the coefficients, 8.4 ÷ 2.0 = 4.2, and subtract the exponents, 5 − 2 = 3, giving 4.2 × 10³ mg/mL to 2 SD. Subtracting the coefficients instead of dividing them gives 6.4 × 10³ mg/mL, and adding the exponents gives 4.2 × 10⁷ mg/mL."}, {"id": 135, "level": "Intermediate", "tag": "Calculating in Scientific Notation", "stem": "Four individual grains recovered from the salt, sand, iron and lima bean mixture were massed. Which list places these masses in order from SMALLEST to LARGEST?", "options": ["1.20 × 10⁻¹ g, 2.50 × 10⁻² g, 4.00 × 10⁻² g, 8.10 × 10⁻³ g", "8.10 × 10⁻³ g, 4.00 × 10⁻² g, 2.50 × 10⁻² g, 1.20 × 10⁻¹ g", "8.10 × 10⁻³ g, 2.50 × 10⁻² g, 4.00 × 10⁻² g, 1.20 × 10⁻¹ g", "1.20 × 10⁻¹ g, 4.00 × 10⁻² g, 2.50 × 10⁻² g, 8.10 × 10⁻³ g"], "answer": "C", "answer_text": "8.10 × 10⁻³ g, 2.50 × 10⁻² g, 4.00 × 10⁻² g, 1.20 × 10⁻¹ g", "exp": "Compare exponents first: 10⁻³ < 10⁻² < 10⁻¹; coefficients decide only between the two sharing 10⁻², so 2.50 × 10⁻² g precedes 4.00 × 10⁻² g. The list swapping those two is otherwise correct and still fails, while ranking by coefficient alone puts 1.20 × 10⁻¹ g first and one option reverses the whole order."}, {"id": 136, "level": "Intermediate", "tag": "Counting Digits in Scientific Notation", "stem": "A balance reading whose first three digits were all measured is recorded in the Science Spiral as 2500 g, with no decimal point, so a reader cannot tell how many of its digits were actually measured. Rewriting it as 2.50 × 10³ g removes that ambiguity because:", "options": ["every digit shown in the coefficient counts, so the coefficient states the digit count outright", "the power of ten contributes significant digits of its own, adding two more to the total", "rewriting the value turns the two trailing zeros into captive zeros, which always count", "scientific notation is required to report every measurement to exactly three significant digits"], "answer": "A", "answer_text": "every digit shown in the coefficient counts, so the coefficient states the digit count outright", "exp": "In 2.50 × 10³ g the coefficient carries every significant digit, so a reader sees 3 SD with nothing left to guess; the power of ten never contributes digits. Written as 2500 g those trailing zeros read as placeholders and the value counts as just 2 SD."}, {"id": 137, "level": "Advanced", "tag": "Counting Digits in Scientific Notation", "stem": "The zoo told the college to prepare an enclosure for a turtle weighing 250; the college assumed 250 pounds while the zoo meant 250 kilograms. Suppose the zoo had written 2.50 × 10² instead. What would that change?", "options": ["It would fix the digit count at 2 SD, and naming the unit then no longer matters for building the enclosure", "It would fix the digit count at 3 SD, but the mix-up still happens, since the confusion was about the UNIT", "It would prevent the mix-up entirely, since a coefficient and a power of ten cannot be misread as pounds", "It would prevent the mix-up entirely, since a value written in scientific notation is understood to be in SI units"], "answer": "B", "answer_text": "It would fix the digit count at 3 SD, but the mix-up still happens, since the confusion was about the UNIT", "exp": "Scientific notation settles how many digits were measured — 2.50 × 10² shows all three, not 2 — but says nothing about WHAT was measured. Clarence pushed the fence over because no unit was ever attached, and 2.50 × 10² with no unit is as dangerous as 250 with none."}, {"id": 138, "level": "Intermediate", "tag": "Calculating in Scientific Notation", "stem": "A single salt crystal has a mass of 4.0 × 10⁻³ g, and a sample is estimated to contain 2.5 × 10³ crystals. What is the total mass of the sample, written correctly in scientific notation and to the correct number of significant digits?", "options": ["6.5 × 10⁰ g", "1.0 × 10¹ g", "1.0 × 10⁻⁸ g", "1.0 × 10⁻⁵ g"], "answer": "B", "answer_text": "1.0 × 10¹ g", "exp": "Multiply the coefficients, 4.0 × 2.5 = 10, and add the exponents, −3 + 3 = 0, which gives 10 × 10⁰ g. Because a coefficient must be at least 1 and less than 10, that becomes 1.0 × 10¹ g, still 2 SD. Subtracting the exponents instead yields 1.0 × 10⁻⁵ g."}, {"id": 139, "level": "Advanced", "tag": "Writing Scientific Notation", "stem": "A student writes the Mars Climate Orbiter's $125 million price tag as 12.5 × 10⁷ dollars and reports it as 3 significant digits. Which evaluation is correct?", "options": ["The form is right, and the digit count should be 2, since the final 5 is an estimated digit and is never counted", "The form is right, but the digit count is wrong: a value in scientific notation carries as many digits as its exponent", "The digit count is right, but the form is not: a coefficient must be at least 1 and below 10, so write 1.25 × 10⁸", "Both the form and the digit count are right, since any coefficient may be paired with any power of ten"], "answer": "C", "answer_text": "The digit count is right, but the form is not: a coefficient must be at least 1 and below 10, so write 1.25 × 10⁸", "exp": "12.5 × 10⁷ and 1.25 × 10⁸ are the same $125,000,000 and both show three digits, so the digit count is fine; what fails is the form, since a coefficient of 12.5 is not below 10. An estimated digit is always counted, so this value is 3 SD, not 2."}, {"id": 140, "level": "Advanced", "tag": "Writing Scientific Notation", "stem": "One group records the lead block's volume as 27.15 cm³, a second group writes 2.715 × 10¹ cm³, and a third writes 0.2715 × 10² cm³. Which statement is TRUE?", "options": ["All three name the same volume with 4 significant digits, but only 2.715 × 10¹ cm³ is proper scientific notation", "Only 27.15 cm³ keeps 4 significant digits; both power-of-ten forms drop to 3, since the exponent replaces a digit", "0.2715 × 10² cm³ is the proper scientific form, since a coefficient below 1 makes its leading zero significant", "The three values differ in size, since changing the exponent always changes the magnitude of a measurement"], "answer": "A", "answer_text": "All three name the same volume with 4 significant digits, but only 2.715 × 10¹ cm³ is proper scientific notation", "exp": "All three name the same 27.15 cm³ with four measured digits — a leading zero is never significant, so 0.2715 still counts 4 SD. Only 2.715 × 10¹ cm³ has a coefficient at least 1 and less than 10, which is what proper scientific notation requires."}, {"id": 141, "level": "Beginner", "tag": "Choosing a Conversion Factor", "stem": "A student sets up the conversion 25.0 cm × (1 m / 100 cm). Which unit cancels? (1 m = 100 cm)", "options": ["Both cm and m cancel each other out, leaving a pure number with no unit attached", "Neither one, since a conversion factor changes the number but never removes a unit", "cm, because it sits in the measurement's numerator and in the factor's denominator", "m, because m is the unit that the finished answer is supposed to be reported in"], "answer": "C", "answer_text": "cm, because it sits in the measurement's numerator and in the factor's denominator", "exp": "Units cancel when the same unit appears once on top and once on the bottom, which is true of cm here: 25.0 cm × (1 m / 100 cm) = 0.250 m. The unit you WANT has to survive, so m cannot be the one that cancels."}, {"id": 142, "level": "Beginner", "tag": "Choosing a Conversion Factor", "stem": "To convert 4.50 kg to grams, which conversion factor should the measurement be multiplied by? (1 kg = 1000 g)", "options": ["1000 kg per 1 g", "1 kg per 1000 g", "1000 g per 1 kg", "1 g per 1000 kg"], "answer": "C", "answer_text": "1000 g per 1 kg", "exp": "The factor must put kg on the bottom so it cancels and leaves g on top: 4.50 kg × (1000 g / 1 kg) = 4.50 × 10³ g. Turned over it leaves the answer in kg²/g, and the other two factors state equalities that are simply false."}, {"id": 143, "level": "Beginner", "tag": "One-Step Conversions", "stem": "Convert 3.50 L to milliliters. (1 L = 1000 mL)", "options": ["3.50 × 10³ mL", "3.50 × 10⁻³ mL", "3.50 × 10² mL", "3.50 × 10¹ mL"], "answer": "A", "answer_text": "3.50 × 10³ mL", "exp": "3.50 L × (1000 mL / 1 L) = 3500 mL, written 3.50 × 10³ mL so all three significant digits show. Dividing by 1000 instead of multiplying gives 3.50 × 10⁻³ mL, a barely visible droplet rather than more than three liters' worth."}, {"id": 144, "level": "Beginner", "tag": "One-Step Conversions", "stem": "The college built its enclosure for a 250. lb turtle. Using 1 kg = 2.205 lb, what is that mass in kilograms?", "options": ["1.13 × 10³ kg", "5.51 × 10² kg", "2.50 × 10² kg", "1.13 × 10² kg"], "answer": "D", "answer_text": "1.13 × 10² kg", "exp": "The factor must put lb on the bottom: 250. lb × (1 kg / 2.205 lb) = 113.4 kg, reported to 3 SD as 1.13 × 10² kg. Multiplying by 2.205 instead of dividing gives 5.51 × 10² kg — a mass larger in kilograms than in pounds, which cannot happen."}, {"id": 145, "level": "Beginner", "tag": "One-Step Conversions", "stem": "Convert 0.250 m to millimeters. (1 m = 1000 mm)", "options": ["2.50 × 10² mm", "2.50 × 10³ mm", "2.50 × 10¹ mm", "2.50 × 10⁻⁴ mm"], "answer": "A", "answer_text": "2.50 × 10² mm", "exp": "The factor must put m on the bottom so mm survives: 0.250 m × (1000 mm / 1 m) = 250 mm = 2.50 × 10² mm, keeping all 3 SD. Dividing by 1000 instead of multiplying gives 2.50 × 10⁻⁴ mm, a length far shorter than the original."}, {"id": 146, "level": "Intermediate", "tag": "Two-Step Conversions", "stem": "Convert 2.50 km to centimeters. (1 km = 1000 m; 1 m = 100 cm)", "options": ["2.50 × 10³ cm", "2.50 × 10⁵ cm", "2.50 × 10⁴ cm", "2.50 × 10⁻⁵ cm"], "answer": "B", "answer_text": "2.50 × 10⁵ cm", "exp": "Chain the factors: 2.50 km × (1000 m / 1 km) × (100 cm / 1 m) = 2.50 × 10⁵ cm to 3 SD. Stopping after the first factor gives 2.50 × 10³ cm — the answer in meters, not centimeters — and using 100 in place of 1000 gives 2.50 × 10⁴ cm."}, {"id": 147, "level": "Intermediate", "tag": "One-Step Conversions", "stem": "A bubble rises through the liquid at 8.40 cm/s. Convert this rate to meters per second. (1 m = 100 cm)", "options": ["8.40 × 10⁻¹ m/s", "8.40 × 10² m/s", "8.40 × 10⁻² m/s", "8.40 × 10⁻³ m/s"], "answer": "C", "answer_text": "8.40 × 10⁻² m/s", "exp": "Only the cm needs converting; the seconds ride along untouched: 8.40 cm/s × (1 m / 100 cm) = 8.40 × 10⁻² m/s. Multiplying by 100 rather than dividing gives 8.40 × 10² m/s, shifting one place gives 8.40 × 10⁻¹ m/s, and dividing by 1000 gives 8.40 × 10⁻³ m/s."}, {"id": 148, "level": "Intermediate", "tag": "Choosing a Conversion Factor", "stem": "A student converting a ", "4.50 × 10⁻³ kg"], "answer": "D", "answer_text": "4.50 × 10⁻³ kg", "exp": "Two factors are needed, each with the unwanted unit on the bottom: 4.50 × 10³ mg × (1 g / 1000 mg) × (1 kg / 1000 g) = 4.50 × 10⁻³ kg. Stopping after the first factor gives 4.50 × 10⁰ kg, a number that is really in grams."}, {"id": 151, "level": "Intermediate", "tag": "Choosing a Conversion Factor", "stem": "A student writes: 45.0 mL × (1 L / 1000 mL) × (1000 cm³ / 1 L). Which statement about this setup is TRUE? (1 L = 1000 mL; 1 L = 1000 cm³)", "options": ["mL cancels in the first factor and L cancels in the second, so the answer lands in cm³", "Nothing cancels here, because a unit can only cancel when it appears twice inside one factor", "The two 1000s cancel first, which leaves the value 45.0 with no unit attached to it", "L cancels in both factors, so the mL is never removed and the answer is still in mL"], "answer": "A", "answer_text": "mL cancels in the first factor and L cancels in the second, so the answer lands in cm³", "exp": "Each unwanted unit meets a matching unit across a fraction bar — mL over mL, then L over L — so the surviving unit is cm³ and the arithmetic gives 45.0 cm³. Units cancel across factors, not only within one."}, {"id": 152, "level": "Advanced", "tag": "One-Step Conversions", "stem": "The Boeing 767 crew needed 22,300 kg of fuel (3 significant digits) and had to convert that mass to liters. They used 1.77 lb per liter; the value they should have used was 0.80 kg per liter. Using the CORRECT density, how many liters did the flight need? (volume = mass ÷ density)", "options": ["2.8 × 10³ L", "2.8 × 10⁴ L", "1.26 × 10⁴ L", "1.8 × 10⁴ L"], "answer": "B", "answer_text": "2.8 × 10⁴ L", "exp": "22,300 kg ÷ 0.80 kg/L = 27,875 L, or 2.8 × 10⁴ L to the 2 SD of the density. The crew's real mistake ran the other way: they multiplied a dripstick reading in liters by 1.77 — a POUNDS-per-liter figure — and then recorded the answer as kilograms, so they believed they had roug sting whose volume is 2.50 × 10² cm³? (Density = mass / volume; 1000 g = 1 kg)", "options": ["1.97 kg", "1968 kg", "0.0318 kg", "31.8 kg"], "answer": "A", "answer_text": "1.97 kg", "exp": "Rearrange to mass = density × volume: 7.87 g/cm³ × 2.50 × 10² cm³ = 1967.5 g, then × (1 kg / 1000 g) = 1.9675 kg, reported to the 3 SD of the volume as 1.97 kg. Forgetting the last factor leaves 1968 kg — really the mass in grams."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>
  `<button data-t="${i}">${t}<span class="c">${tagCount[t]}</span></button>`).join('');
document.querySelectorAll('#tagchips button').forEach((b,i)=>{
  b.onclick = ()=>{
    const t = tags[i];
    picked.has(t) ? picked.delete(t) : picked.add(t);
    b.classList.toggle('on', picked.has(t));
    refresh();
  };
});
$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
