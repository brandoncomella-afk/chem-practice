orrect count?", "options": ["6.6 × 10⁻²⁴ atoms, since 4.0 mol is divided by 6.022 × 10²³", "2.4 × 10²³ atoms, since the exponent never changes during this step", "2.409 × 10²⁴ atoms, since all four calculator digits should be kept", "2.4 × 10²⁴ atoms, since 4.0 × 6.022 = 24.088, which is 2.4088 × 10¹"], "answer": "D", "answer_text": "2.4 × 10²⁴ atoms, since 4.0 × 6.022 = 24.088, which is 2.4088 × 10¹", "exp": "4.0 mol × 6.022 × 10²³ atoms/mol = 24.088 × 10²³, and rewriting that properly gives 2.4088 × 10²⁴, reported to two digits as 2.4 × 10²⁴ atoms. Leaving the exponent at 10²³ makes the sample ten times too small, 2.409 × 10²⁴ claims four digits from a two-digit measurement, and dividing gives 6.6 × 10⁻²⁴."}, {"id": 117, "level": "Advanced", "tag": "Mass and Particles", "stem": "A study guide states: “8.10 moles of lithium contains 4.87 × 10²⁴ atoms,” using 6.022 × 10²³ atoms per mole. What is the correct count?", "options": ["4.87 × 10²⁴ atoms, because the digits sitting after the 4.87 are simply dropped", "4.88 × 10²⁴ atoms, because 8.10 × 6.022 = 48.7782, which rounds to 48.8", "1.35 × 10⁻²³ atoms, because 8.10 mol is divided by 6.022 × 10²³", "4.878 × 10²⁴ atoms, because a fourth digit belongs in this kind of product"], "answer": "B", "answer_text": "4.88 × 10²⁴ atoms, because 8.10 × 6.022 = 48.7782, which rounds to 48.8", "exp": "8.10 mol × 6.022 × 10²³ atoms/mol = 4.87782 × 10²⁴, and 8.10 mol carries three digits, so the third digit rounds up to give 4.88 × 10²⁴ atoms. Truncating to 4.87 × 10²⁴ skips the rounding step, 4.878 × 10²⁴ keeps a fourth digit the data does not support, and dividing gives 1.35 × 10⁻²³."}, {"id": 118, "level": "Advanced", "tag": "Mass and Particles", "stem": "A capsule holds 1.48 × 10²¹ molecules of acetaminophen, C₈H₉NO₂, molar mass 151.165 g/mol. One mole is 6.022 × 10²³ molecules. What mass of acetaminophen is in the capsule?", "options": ["0.3715 g, the calculator reading kept to four digits, not three", "0.337 g, using a molar mass that leaves out the nitrogen atom", "0.00246 g, the number of moles written down as a mass in grams", "0.372 g, from 1.48 × 10²¹ ÷ 6.022 × 10²³, then × 151.165 g/mol"], "answer": "D", "answer_text": "0.372 g, from 1.48 × 10²¹ ÷ 6.022 × 10²³, then × 151.165 g/mol", "exp": "1.48 × 10²¹ molecules ÷ 6.022 × 10²³ molecules/mol = 2.46 × 10⁻³ mol, and 2.46 × 10⁻³ mol × 151.165 g/mol = 0.372 g, to the three digits 1.48 supports. 0.337 g comes from a molar mass of 137.158 g/mol with the nitrogen missing, 0.00246 g is the mole count mislabeled as grams, and 0.3715 g keeps a fourth digit."}, {"id": 119, "level": "Advanced", "tag": "Mass and Particles", "stem": "A tablet contains 0.320 g of aspirin, C₉H₈O₄, molar mass 180.159 g/mol. One mole is 6.022 × 10²³ molecules. How many aspirin molecules are in the tablet?", "options": ["3.47 × 10²⁵ molecules, from 0.320 × 180.159, then × 6.022 × 10²³", "1.78 × 10⁻³ molecules, the mole count reported as a molecule count", "1.07 × 10²¹ molecules, from 0.320 ÷ 180.159, then × 6.022 × 10²³", "1.0696 × 10²¹ molecules, the calculator reading kept to five digits"], "answer": "C", "answer_text": "1.07 × 10²¹ molecules, from 0.320 ÷ 180.159, then × 6.022 × 10²³", "exp": "0.320 g ÷ 180.159 g/mol = 1.78 × 10⁻³ mol, and 1.78 × 10⁻³ mol × 6.022 × 10²³ molecules/mol = 1.07 × 10²¹ molecules to three digits. Multiplying by the molar mass instead of dividing gives 3.47 × 10²⁵, 1.78 × 10⁻³ is the mole count and not a particle count, and 1.0696 × 10²¹ reports five digits from three-digit data."}, {"id": 120, "level": "Advanced", "tag": "Mass and Particles", "stem": "A study guide states: “A 0.585 g sample of table salt, NaCl, molar mass 58.443 g/mol, contains 6.03 × 10²¹ molecules of NaCl.” One mole is 6.022 × 10²³ particles. Which correction is right?", "options": ["1.00 × 10⁻² formula units; the mole count is already the number of particles", "6.03 × 10²¹ molecules; every substance is built out of molecules of some kind", "3.52 × 10²³ formula units; the sample mass is multiplied by 6.022 × 10²³", "6.03 × 10²¹ formula units; NaCl is ionic, so its particle is a formula unit"], "answer": "D", "answer_text": "6.03 × 10²¹ formula units; NaCl is ionic, so its particle is a formula unit", "exp": "0.585 g ÷ 58.443 g/mol = 1.00 × 10⁻² mol, and 1.00 × 10⁻² mol × 6.022 × 10²³ = 6.03 × 10²¹ particles, so the number is right but the name is not: sodium and chloride ions sit in a lattice, so the counted particle is a formula unit. 1.00 × 10⁻² is the mole count, and skipping the molar mass entirely gives 3.52 × 10²³."}, {"id": 121, "level": "Advanced", "tag": "Mass and Particles", "stem": "Two samples sit on the balance: 1.00 g of lithium, molar mass 6.941 g/mol, and 1.00 g of sodium, molar mass 22.990 g/mol. One mole is 6.022 × 10²³ atoms. Which sample holds more atoms, and how many?", "options": ["Lithium, 6.02 × 10²³, since 1.00 g of any element is one full mole", "Lithium, 8.68 × 10²², against 2.62 × 10²² atoms of sodium", "Sodium, 8.68 × 10²², against 2.62 × 10²² atoms of lithium", "Neither; equal masses of two elements hold equal numbers of atoms"], "answer": "B", "answer_text": "Lithium, 8.68 × 10²², against 2.62 × 10²² atoms of sodium", "exp": "1.00 g ÷ 6.941 g/mol × 6.022 × 10²³ = 8.68 × 10²² lithium atoms, while 1.00 g ÷ 22.990 g/mol × 6.022 × 10²³ = 2.62 × 10²² sodium atoms, so the lighter element packs more than three times as many atoms into the same gram. Equal masses hold equal counts only when the molar masses match, and 1.00 g is one mole only for a substance whose molar mass is 1.00 g/mol."}, {"id": 122, "level": "Advanced", "tag": "Percent Composition", "stem": "A tablet’s filler is sodium carbonate, Na₂CO₃, molar mass 105.988 g/mol, built from Na 22.990, C 12.011 and O 15.999. What is the percent composition of sodium, and what mass of sodium is in a 2.50 g sample of the filler?", "options": ["43.4% sodium, so a 2.50 g sample holds 1.08 g of sodium", "21.7% sodium, so a 2.50 g sample holds 0.542 g of sodium", "43.4% sodium, so a 2.50 g sample holds 5.76 g of sodium", "45.3% sodium, so a 2.50 g sample holds 1.13 g of sodium"], "answer": "A", "answer_text": "43.4% sodium, so a 2.50 g sample holds 1.08 g of sodium", "exp": "Two sodium atoms contribute 2(22.990) = 45.980 g, so 45.980 ÷ 105.988 × 100% = 43.4%, and 45.980 ÷ 105.988 × 2.50 g = 1.0846 g, which is 1.08 g of sodium. Counting one sodium atom gives 21.7% and 0.542 g, 45.3% is really the oxygen percentage, and 5.76 g comes from dividing 2.50 g by 0.434 instead of multiplying."}, {"id": 123, "level": "Advanced", "tag": "Percent Composition", "stem": "A reference table lists aconite, C₃₄H₄₇NO₁₁, molar mass 645.746 g/mol, as C = 63.28%, H = 7.34%, N = 2.17% and O = 27.27%. Using C 12.011, H 1.008, N 14.007 and O 15.999, what is wrong with the table?", "options": ["Nothing is wrong; a measured percent composition may total more than 100%", "The four values total 100.06%; the error is in N, which should be 2.11%", "The four values total 100.06%; recomputing gives C 63.24% and O 27.25%", "The four values total 100.06%; the error is in H, which should be 7.28%"], "answer": "C", "answer_text": "The four values total 100.06%; recomputing gives C 63.24% and O 27.25%", "exp": "The parts of a compound must total 100%, and 63.28 + 7.34 + 2.17 + 27.27 = 100.06%. Recomputing gives carbon 34(12.011) ÷ 645.746 × 100% = 63.24% and oxygen 11(15.999) ÷ 645.746 × 100% = 27.25%, which restores a total of 100.00%. Nitrogen really is 2.17% and hydrogen really is 7.34%, so neither of those is the source of the excess."}, {"id": 124, "level": "Advanced", "tag": "Percent Composition", "stem": "Molar masses: acetaminophen C₈H₉NO₂ 151.165 g/mol, aspirin C₉H₈O₄ 180.159 g/mol, codeine C₁₈H₂₁NO₃ 299.370 g/mol, ibuprofen C₁₃H₁₈O₂ 206.285 g/mol, naproxen C₁₄H₁₄O₃ 230.263 g/mol. Using C 12.011, which painkiller has the highest percent composition of carbon?", "options": ["Codeine, at 72.2% carbon by mass", "Ibuprofen, at 75.7% carbon", "Aspirin, at 60.0% carbon", "Naproxen, at 73.0% carbon by mass"], "answer": "B", "answer_text": "Ibuprofen, at 75.7% carbon", "exp": "Ibuprofen carries 13(12.011) = 156.143 g of carbon in every 206.285 g, so 156.143 ÷ 206.285 × 100% = 75.7%, the largest of the five. Codeine holds the most carbon atoms at 18, but they sit in a much heavier molecule and come to only 72.2%; naproxen reaches 73.0% and aspirin only 60.0%, so the number of carbon atoms alone does not decide the percentage."}, {"id": 125, "level": "Advanced", "tag": "Percent Composition", "stem": "Nitroglycerine is C₃H₅N₃O₉, molar mass 227.085 g/mol, built from C 12.011, H 1.008, N 14.007 and O 15.999. What mass of oxygen is in a 0.400 g tablet of nitroglycerine?", "options": ["0.631 g, since the 0.400 g mass is divided by that percent", "0.0740 g, since nitrogen is 18.5% of the compound by mass", "0.0636 g, since carbon is 15.9% of the compound by mass", "0.254 g, since oxygen is 63.4% of the compound by mass"], "answer": "D", "answer_text": "0.254 g, since oxygen is 63.4% of the compound by mass", "exp": "Nine oxygen atoms contribute 9(15.999) = 143.991 g, so 143.991 ÷ 227.085 × 100% = 63.4% oxygen, and 0.634 × 0.400 g = 0.254 g. The values 0.0740 g and 0.0636 g are the nitrogen and carbon masses in that same tablet, and 0.631 g comes from dividing 0.400 g by 0.634 rather than multiplying."}, {"id": 126, "level": "Advanced", "tag": "Percent Composition", "stem": "Potassium cyanide is KCN, molar mass 65.116 g/mol, built from K 39.098, C 12.011 and N 14.007. What is its percent composition, and how much nitrogen is in a 0.134 g dose?", "options": ["K 21.5%, C 18.4%, N 60.0%, so 0.134 g holds 0.0804 g of N", "K 33.3%, C 33.3%, N 33.3%, so 0.134 g holds 0.0446 g of N", "K 60.0%, C 18.4%, N 21.5%, so 0.134 g holds 0.0288 g of N", "K 60.0%, C 21.5%, N 18.4%, so 0.134 g holds 0.0247 g of N"], "answer": "C", "answer_text": "K 60.0%, C 18.4%, N 21.5%, so 0.134 g holds 0.0288 g of N", "exp": "Each element’s mass is divided by the whole: 39.098 ÷ 65.116 × 100% = 60.0% K, 12.011 ÷ 65.116 × 100% = 18.4% C and 14.007 ÷ 65.116 × 100% = 21.5% N, so 0.215 × 0.134 g = 0.0288 g of nitrogen. Swapping carbon and nitrogen gives 0.0247 g, handing nitrogen the potassium share gives 0.0804 g, and equal thirds would require all three atoms to weigh the same."}, {"id": 127, "level": "Advanced", "tag": "Empirical Formula", "stem": "A powder is 75.52% carbon, 13.47% hydrogen and 11.01% nitrogen by mass. Using C 12.011, H 1.008 and N 14.007, what is its empirical formula?", "options": ["C₇HN, from dividing the percents by the smallest percent", "C₈H₁₇N₃, from multiplying every value by three at the end", "C₈H₁₇N, from mole values of 6.288, 13.363 and 0.786", "C₄H₈N, from halving the ratio to reach smaller whole numbers"], "answer": "C", "answer_text": "C₈H₁₇N, from mole values of 6.288, 13.363 and 0.786", "exp": "Treating the percents as grams and dividing by molar masses gives 75.52 ÷ 12.011 = 6.288 mol C, 13.47 ÷ 1.008 = 13.363 mol H and 11.01 ÷ 14.007 = 0.786 mol N, and dividing each by the smallest value, 0.786, gives 8.00 : 17.00 : 1, so the formula is C₈H₁₇N. Dividing the percents themselves gives C₇HN, because heavy and light atoms are never in the same ratio as their masses, and tripling or halving a ratio that is already whole only breaks it."}, {"id": 128, "level": "Advanced", "tag": "Empirical Formula", "stem": "A student’s worked solution for a white powder that is 52.93% aluminum and 47.07% oxygen reads: “Al 52.93 ÷ 26.982 = 1.962 mol; O 47.07 ÷ 15.999 = 2.942 mol; 1.962 ÷ 1.962 = 1 and 2.942 ÷ 1.962 = 1.5, so the formula is AlO₁.₅.” What is the correct empirical formula?", "options": ["Al₂O₃, because both values are multiplied by 2 to clear the 1.5", "AlO₂, because the decimal 1.5 is rounded up to the next whole", "Al₃O₄.₅, because both values are multiplied by 3 to clear the 1.5", "AlO₁.₅, because a subscript may be a decimal when data says so"], "answer": "A", "answer_text": "Al₂O₃, because both values are multiplied by 2 to clear the 1.5", "exp": "Step 4 multiplies every value by the same whole number until all of them are whole, and 1 : 1.5 becomes 2 : 3 when both are doubled, giving Al₂O₃. Subscripts count atoms, so AlO₁.₅ cannot stand as written; rounding 1.5 up to 2 changes the ratio outright, and tripling leaves oxygen at 4.5, still not whole."}, {"id": 129, "level": "Advanced", "tag": "Empirical Formula", "stem": "A student’s worked solution for a salt that is 26.19% nitrogen, 7.54% hydrogen and 66.27% chlorine reads: “N 1.870 mol, H 7.480 mol, Cl 1.869 mol. Divide each by the largest value, 7.480: N 0.25, H 1, Cl 0.25.” What is the correct empirical formula?", "options": ["N₀.₂₅HCl₀.₂₅, since the largest mole value sets the ratio for all", "N₄HCl₄, found by dividing the largest mole value by each of the rest", "NH₄Cl, found by dividing each mole value by the smallest, 1.869", "NHCl, since the decimal values of 0.25 each round down to one atom"], "answer": "C", "answer_text": "NH₄Cl, found by dividing each mole value by the smallest, 1.869", "exp": "Step 3 divides by the smallest mole value, so 1.870 ÷ 1.869 = 1.00 for N, 7.480 ÷ 1.869 = 4.00 for H and 1.869 ÷ 1.869 = 1.00 for Cl, giving NH₄Cl. Dividing by the largest leaves 0.25 subscripts, which cannot count atoms; rounding those to 1 gives NHCl and quietly discards three hydrogens, and inverting the division flips the formula to N₄HCl₄."}, {"id": 130, "level": "Advanced", "tag": "Empirical Formula", "stem": "A small round tablet is 57.1% carbon, 6.2% hydrogen, 9.5% nitrogen and 27.2% oxygen by mass. Using C 12.011, H 1.008, N 14.007 and O 15.999, what is its empirical formula?", "options": ["C₇H₉NO₃, after rounding the 2.5 oxygen value up to 3", "C₇H₉NO₂.₅, the ratio left exactly as dividing by the smallest gave it", "C₂₁H₂₇N₃O₇.₅, after tripling the ratio 7 : 9 : 1 : 2.5", "C₁₄H₁₈N₂O₅, after doubling the ratio 7 : 9 : 1 : 2.5"], "answer": "D", "answer_text": "C₁₄H₁₈N₂O₅, after doubling the ratio 7 : 9 : 1 : 2.5", "exp": "Dividing by molar masses gives 4.754 mol C, 6.151 mol H, 0.678 mol N and 1.700 mol O, and dividing each by 0.678 gives 7.01 : 9.07 : 1 : 2.51. Doubling that to clear the half, giving C₁₄H₁₈N₂O₅; leaving 2.5 as a subscript counts half an atom, rounding it to 3 changes the compound, and tripling leaves oxygen at 7.5."}, {"id": 131, "level": "Advanced", "tag": "Empirical Formula", "stem": "The contents of a capsule are 15.9% carbon, 2.2% hydrogen, 18.5% nitrogen and 63.4% oxygen by mass. Using C 12.011, H 1.008, N 14.007 and O 15.999, what is the empirical formula?", "options": ["C₂H₃N₂O₆, after multiplying the ratio 1 : 1.65 : 1 : 3 by two", "C₃H₅N₃O₉, after multiplying the ratio 1 : 1.65 : 1 : 3 by three", "CH₁.₆₅NO₃, the ratio left exactly as dividing by the smallest gave it", "CH₂NO₃, after rounding the hydrogen value of 1.65 up to 2 atoms"], "answer": "B", "answer_text": "C₃H₅N₃O₉, after multiplying the ratio 1 : 1.65 : 1 : 3 by three", "exp": "The mole values 1.324 C, 2.183 H, 1.321 N and 3.963 O divided by the smallest, 1.321, give 1.00 : 1.65 : 1 : 3.00, and only multiplying by three makes hydrogen whole: 3 : 4.96 : 3 : 9, so the formula is C₃H₅N₃O₉. Doubling leaves hydrogen at 3.3, rounding 1.65 to 2 skips Step 4 altogether, and 1.65 cannot stand as a subscript."}, {"id": 132, "level": "Advanced", "tag": "Empirical Formula", "stem": "An empirical formula is the simplest whole number ratio of atoms in a compound. Which of these molecular formulas is already written as its own empirical formula?", "options": ["C₁₃H₁₈O₂, whose subscripts 13, 18 and 2 share no common factor", "C₃H₆O₃, whose subscripts cannot be reduced once oxygen appears", "C₁₀H₁₄N₂, whose subscripts cannot be reduced because 10 is even", "C₆H₁₂O₆, whose subscripts are already the smallest set using a 6"], "answer": "A", "answer_text": "C₁₃H₁₈O₂, whose subscripts 13, 18 and 2 share no common factor", "exp": "An empirical formula cannot be reduced any further, and 13, 18 and 2 share no common factor, so ibuprofen’s C₁₃H₁₈O₂ is already its own empirical formula. C₁₀H₁₄N₂ divides by 2 to give C₅H₇N, while C₆H₁₂O₆ and C₃H₆O₃ both reduce to CH₂O — whether a subscript is even, or whether oxygen is present, has nothing to do with it."}, {"id": 133, "level": "Advanced", "tag": "Molecular Formula", "stem": "A study guide shows: “Empirical formula CH₂O; molar mass of CH₂O = 29.018 g/mol; compound molar mass 90.08 g/mol; 90.08 ÷ 29.018 = 3.104 ≈ 3; molecular formula C₃H₆O₃.” Using C 12.011, H 1.008 and O 15.999, what is the right correction?", "options": ["CH₂O is 30.026 g/mol, so 90.08 ÷ 30.026 = 3.000 and the answer is CH₂O", "CH₂O is 29.018 g/mol, and 3.104 rounds down to 3, so C₃H₆O₃ stands", "CH₂O is 30.026 g/mol, so 90.08 ÷ 30.026 = 3.000 and the answer is C₃H₂O", "CH₂O is 30.026 g/mol, so 90.08 ÷ 30.026 = 3.000 and C₃H₆O₃ stands"], "answer": "D", "answer_text": "CH₂O is 30.026 g/mol, so 90.08 ÷ 30.026 = 3.000 and C₃H₆O₃ stands", "exp": "CH₂O contains two hydrogen atoms, so its mass is 12.011 + 2(1.008) + 15.999 = 30.026 g/mol, and 90.08 ÷ 30.026 = 3.000, a clean whole number instead of a 3.104 that has to be forced. Step 3 then multiplies every subscript by 3 to give C₃H₆O₃; leaving the answer as CH₂O skips Step 3 entirely, and C₃H₂O multiplies only the carbon."}, {"id": 134, "level": "Advanced", "tag": "Molecular Formula", "stem": "A compound has the empirical formula CH₃ and a molar mass of 30.07 g/mol. Using C 12.011 and H 1.008, what is its molecular formula?", "options": ["C₄H₁₂, because the ratio comes from dividing 60.14 by 15.035", "C₂H₆, because 30.07 ÷ 15.035 = 2.000 and both subscripts double", "C₂H₃, because the ratio of 2.000 applies only to the carbon atom", "CH₃, because 15.035 ÷ 30.07 = 0.500 and a formula cannot shrink"], "answer": "B", "answer_text": "C₂H₆, because 30.07 ÷ 15.035 = 2.000 and both subscripts double", "exp": "The empirical formula CH₃ has a molar mass of 12.011 + 3(1.008) = 15.035 g/mol, and 30.07 ÷ 15.035 = 2.000, so Step 3 multiplies every subscript by 2 to give C₂H₆. Dividing in the other order gives 0.500 and leaves CH₃ unchanged, multiplying only carbon gives C₂H₃, and doubling the compound’s molar mass first inflates the ratio to 4."}, {"id": 135, "level": "Advanced", "tag": "Molecular Formula", "stem": "A stimulant has the empirical formula C₅H₇N and a molar mass of 162.236 g/mol. Using C 12.011, H 1.008 and N 14.007, what is its molecular formula?", "options": ["C₁₀H₁₄N₂, since 162.236 ÷ 81.118 = 2.000 and every subscript doubles", "C₁₅H₂₁N₃, since 162.236 ÷ 54.079 = 3.000 sets the multiplier at three", "C₅H₇N, since an empirical formula and a molecular formula always match", "C₁₀H₇N, since the ratio of 2.000 multiplies only the carbon subscript"], "answer": "A", "answer_text": "C₁₀H₁₄N₂, since 162.236 ÷ 81.118 = 2.000 and every subscript doubles", "exp": "C₅H₇N has a molar mass of 5(12.011) + 7(1.008) + 14.007 = 81.118 g/mol, and 162.236 ÷ 81.118 = 2.000, so doubling every subscript gives C₁₀H₁₄N₂. Multiplying only carbon gives C₁₀H₇N, which no longer holds the 5 : 7 : 1 ratio; the two formulas match only when that ratio works out to 1, and 54.079 g/mol is not the mass of C₅H₇N."}, {"id": 136, "level": "Advanced", "tag": "Molecular Formula", "stem": "A compound has the empirical formula CH and a molar mass of 78.11 g/mol. Using C 12.011 and H 1.008, what is its molecular formula?", "options": ["C₆H₆, since 78.11 ÷ 13.019 = 6.000 and both subscripts become 6", "CH₆, since the ratio of 6.000 is applied to the hydrogen subscript only", "C₇₇H₇₇, since 78.11 ÷ 1.008 = 77.49 sets the multiplier at about 77", "C₆H, since the ratio of 6.000 is applied to the carbon subscript only"], "answer": "A", "answer_text": "C₆H₆, since 78.11 ÷ 13.019 = 6.000 and both subscripts become 6", "exp": "CH has a molar mass of 12.011 + 1.008 = 13.019 g/mol, and 78.11 ÷ 13.019 = 6.000, so both subscripts are multiplied by 6 to give C₆H₆. Step 3 multiplies every subscript, so C₆H and CH₆ each leave one element behind, and dividing by hydrogen’s mass alone instead of the whole empirical formula mass produces a meaningless 77."}, {"id": 137, "level": "Advanced", "tag": "Molecular Formula", "stem": "A poison has the empirical formula C₃₄H₄₇NO₁₁, whose empirical formula mass is 645.746 g/mol, and the compound itself has a molar mass of 645.746 g/mol. What is its molecular formula?", "options": ["C₆₈H₉₄N₂O₂₂, since a molecular formula is always larger than the empirical", "C₁₇H₂₃.₅N₀.₅O₅.₅, since a ratio of 1.000 means the subscripts are halved", "C₃₄H₄₇NO₁₁, since 645.746 ÷ 645.746 = 1.000 and nothing is multiplied", "CH₂O, since every molecular formula reduces to a simpler empirical formula"], "answer": "C", "answer_text": "C₃₄H₄₇NO₁₁, since 645.746 ÷ 645.746 = 1.000 and nothing is multiplied", "exp": "Step 2 divides the compound’s molar mass by the empirical formula mass, and 645.746 ÷ 645.746 = 1.000, so Step 3 multiplies each subscript by 1 and the molecular formula is C₃₄H₄₇NO₁₁ itself. A molecular formula equals its empirical formula whenever that ratio is 1, so doubling to C₆₈H₉₄N₂O₂₂ or halving into fractional subscripts both contradict the measured 645.746 g/mol."}, {"id": 138, "level": "Advanced", "tag": "Molecular Formula", "stem": "A student’s worked solution reads: “Empirical formula CH₂O, mass 30.026 g/mol. Compound molar mass 180.16 g/mol. 180.16 ÷ 30.026 = 6.000. Molecular formula C₆H₈O₆.” What is the correct molecular formula?", "options": ["C₆H₁₂O₆, because the multiplier 6 is applied to the subscript 2 as well", "C₆H₆O₆, because a subscript of 1 is understood on H before any scaling", "C₆H₈O₆, because 6 added to the subscript 2 gives a hydrogen count of 8", "C₆H₂O₆, because a subscript already written in a formula stays unchanged"], "answer": "A", "answer_text": "C₆H₁₂O₆, because the multiplier 6 is applied to the subscript 2 as well", "exp": "Step 3 multiplies every subscript by the ratio, and the 2 on hydrogen is a subscript like any other: 6 × 1 = 6 carbon, 6 × 2 = 12 hydrogen and 6 × 1 = 6 oxygen, giving C₆H₁₂O₆. Adding 6 to the 2 gives C₆H₈O₆, treating hydrogen as though it had no subscript gives C₆H₆O₆, and leaving the 2 alone gives C₆H₂O₆, none of which keeps the 1 : 2 : 1 ratio."}, {"id": 139, "level": "Advanced", "tag": "Percent Difference", "stem": "Two lab groups mass the wafer from a regular Oreo on balances reading to 0.01 g: Group 1 records 8.16 g and Group 2 records 7.94 g. Neither value is an accepted value. Using |(difference) ÷ (mean)| × 100% = percent difference, what is the percent difference?", "options": ["2.8%, from 0.22 g ÷ 7.94 g × 100%", "2.7%, from 0.22 g ÷ 8.05 g × 100%", "0.22%, using the gap in grams as the percent", "2.73%, keeping three digits from 0.22 ÷ 8.05"], "answer": "B", "answer_text": "2.7%, from 0.22 g ÷ 8.05 g × 100%", "exp": "The difference is 8.16 − 7.94 = 0.22 g and the mean is (8.16 + 7.94) ÷ 2 = 8.05 g, so 0.22 ÷ 8.05 × 100% = 2.7%. Dividing by Group 2’s 7.94 g gives 2.8% but treats that group as a standard it has not earned, 2.73% claims three digits when the subtracted 0.22 g supports only two, and 0.22 g is a mass rather than a percent."}, {"id": 140, "level": "Advanced", "tag": "Percent Difference", "stem": "A study guide compares two groups’ crème masses, 3.02 g and 2.86 g, as |(3.02 − 2.86) ÷ 2.86| × 100% = 5.6%, and labels the result percent error. Neither group’s value is an accepted value. What is the correct calculation?", "options": ["16%, from the 0.16 g gap read straight off as a percentage", "5.4%, from 0.16 g ÷ 2.94 g, and it is a percent difference", "5.6%, from 0.16 g ÷ 2.86 g, and it is a percent difference", "5.3%, from 0.16 g ÷ 3.02 g, and it is still a percent error"], "answer": "B", "answer_text": "5.4%, from 0.16 g ÷ 2.94 g, and it is a percent difference", "exp": "Percent error compares a measurement against an accepted value, and neither group holds one here, so the comparison is a percent difference and the denominator is the mean: (3.02 + 2.86) ÷ 2 = 2.94 g, giving 0.16 ÷ 2.94 × 100% = 5.4%. Dividing by 2.86 g gives 5.6% and dividing by 3.02 g gives 5.3%, each of which quietly promotes one group to the standard, and 0.16 g is a mass rather than a percentage."}, {"id": 141, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "Five pills were left in the vial in Mary Heller’s mother’s purse. Pill 1, a capsule, comes back from the lab as 63.5% carbon, 6.0% hydrogen, 9.3% nitrogen and 21.2% oxygen by mass. Using C 12.011, H 1.008, N 14.007 and O 15.999, which compound is Pill 1?", "options": ["Aspirin, C₉H₈O₄, taken for mild pain, fever and inflammation", "Aspartame, C₁₄H₁₈N₂O₅, the sweetener in Equal and NutraSweet", "Nitroglycerine, C₃H₅N₃O₉, taken for chest pain in heart failure", "Acetaminophen, C₈H₉NO₂, the active ingredient in Tylenol"], "answer": "D", "answer_text": "Acetaminophen, C₈H₉NO₂, the active ingredient in Tylenol", "exp": "Treating the percents as grams gives 63.5 ÷ 12.011 = 5.287 mol C, 6.0 ÷ 1.008 = 5.95 mol H, 9.3 ÷ 14.007 = 0.664 mol N and 21.2 ÷ 15.999 = 1.325 mol O, and dividing each by 0.664 gives 7.96 : 8.96 : 1 : 2.00, which rounds to C₈H₉NO₂, acetaminophen. Aspirin holds no nitrogen at all, and nitroglycerine at 18.5% nitrogen and aspartame at 9.5% nitrogen do not match a 9.3% nitrogen sample with this much carbon."}, {"id": 142, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "Pills 4 and 5 from the vial are large round tablets, and both come back as 75.7% carbon, 8.8% hydrogen and 15.5% oxygen by mass, with no nitrogen. Using C 12.011, H 1.008 and O 15.999, what is the empirical formula and the identification?", "options": ["C₁₃H₁₈O₂, ibuprofen, after doubling the ratio 6.5 : 9 : 1", "C₆H₉O, an unnamed compound, from rounding the 6.5 down to 6", "C₇H₉O, an unnamed compound, from rounding the 6.5 up to 7", "C₁₄H₁₄O₃, naproxen, after tripling the ratio 6.5 : 9 : 1"], "answer": "A", "answer_text": "C₁₃H₁₈O₂, ibuprofen, after doubling the ratio 6.5 : 9 : 1", "exp": "The mole values are 75.7 ÷ 12.011 = 6.303, 8.8 ÷ 1.008 = 8.730 and 15.5 ÷ 15.999 = 0.969, and dividing each by 0.969 gives 6.51 : 9.01 : 1, which doubles to 13 : 18 : 2, so the tablets are C₁₃H₁₈O₂, ibuprofen. Rounding 6.5 down to 6 or up to 7 skips the stepp 4 and invents a compound, and tripling would leave carbon at 19.5, still not a whole number."}, {"id": 143, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "A Tylenol capsule holds about 0.5 mL. The fatal dose of strychnine is 9.00 g, and the density of strychnine is 1.36 g/mL. Density = mass ÷ volume. Could a fatal dose of strychnine be hidden inside one capsule?", "options": ["No; 9.00 g ÷ 1.36 g/mL = 6.62 mL, over ten times the capsule", "Yes; 9.00 g ÷ 1.36 g/mL = 0.662 mL, which fits in the capsule", "Yes; 1.36 g/mL ÷ 9.00 g = 0.151 mL, which fits in the capsule", "No; 9.00 g × 1.36 g/mL = 12.2 mL, over twenty times the capsule"], "answer": "A", "answer_text": "No; 9.00 g ÷ 1.36 g/mL = 6.62 mL, over ten times the capsule", "exp": "Rearranging Density = mass ÷ volume gives volume = mass ÷ density, so 9.00 g ÷ 1.36 g/mL = 6.62 mL — about thirteen capsules’ worth, which rules strychnine out. Multiplying instead of dividing gives 12.2 and does not even leave units of mL, inverting the division gives 0.151 mL, and 0.662 mL misplaces the decimal point by a factor of ten."}, {"id": 144, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "A Tylenol capsule holds about 0.5 mL. The fatal dose of cyanide is 0.134 g, and the density of cyanide is 1.52 g/mL. Density = mass ÷ volume. What volume does that dose fill, and does it fit inside one capsule?", "options": ["0.204 mL, from multiplying dose by density, and it fits too", "0.088 mL, which fits, reported to the digits data allows", "11.3 mL, from dividing density by dose, and it cannot fit", "0.0882 mL, which fits easily inside the 0.5 mL capsule"], "answer": "D", "answer_text": "0.0882 mL, which fits easily inside the 0.5 mL capsule", "exp": "Volume = mass ÷ density = 0.134 g ÷ 1.52 g/mL = 0.0882 mL, roughly one sixth of the capsule, so a fatal dose of cyanide hides inside one capsule with room to spare. Both 0.134 g and 1.52 g/mL carry three digits, so 0.088 mL throws one away; multiplying gives 0.204 and inverting the division gives 11.3, and neither is the volume the dose occupies."}, {"id": 145, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "Suspicious capsules pulled from store shelves hold a compound that is more than 15% nitrogen and less than 50% carbon by mass. The five fast-acting poisons under consideration are aconite (C 63.24%, N 2.17%), coniine (C 75.52%, N 11.01%), cyanide as KCN (C 18.45%, N 21.51%), nicotine (C 74.03%, N 17.27%) and strychnine (C 75.42%, N 8.38%). Which poison is in the capsules?", "options": ["Aconite, since its 63.24% carbon is the lowest of the organic poisons", "Cyanide, the only one above 15% nitrogen and below 50% carbon", "Nicotine, since its 17.27% nitrogen clears the 15% nitrogen mark", "Coniine, since 11.01% nitrogen and 75.52% carbon fit both limits"], "answer": "B", "answer_text": "Cyanide, the only one above 15% nitrogen and below 50% carbon", "exp": "Both conditions have to hold at the same time, and only cyanide does it: 21.51% nitrogen is above 15%, and 18.45% carbon is below 50%. Nicotine clears the nitrogen bar at 17.27% but its carbon sits at 74.03%, far above 50%; aconite has the lowest carbon among the other four and is still 63.24%, and coniine fails both tests at once."}, {"id": 146, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "A study guide states: “The fatal dose of cyanide is 0.134 g of KCN, molar mass 65.116 g/mol. That is 0.00206 mol, or 1.24 × 10²¹ molecules of KCN.” One mole is 6.022 × 10²³ particles. Which correction is right?", "options": ["The count holds, but KCN is ionic, so those are 1.24 × 10²¹ formula units", "The count should read 0.00206 formula units, since the mole count is the count", "The count holds, and molecules is the right name for any counted particle", "The count should read 1.24 × 10²⁴ formula units, since 0.00206 × 6.022 is 12.4"], "answer": "A", "answer_text": "The count holds, but KCN is ionic, so those are 1.24 × 10²¹ formula units", "exp": "0.134 g ÷ 65.116 g/mol = 0.00206 mol, and 0.00206 mol × 6.022 × 10²³ = 1.24 × 10²¹ particles, so the arithmetic is sound; what fails is the word, because potassium ions and cyanide ions build a lattice rather than a molecule, so the particle counted is a formula unit. 0.00206 mol × 6.022 × 10²³ = 1.24 × 10²¹, not 1.24 × 10²⁴, so the exponent stays at 10²¹, and 0.00206 is the mole count itself."}, {"id": 147, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "In the capsule-building lab a filled capsule holds 0.60 g in all. One group’s balance, reading to the nearest 0.01 g, gives a capsule shell of 0.11 g, an active ingredient of 0.21 g and an inactive ingredient of 0.28 g. Using Part ÷ Total × 100% = percent composition, what is the percent composition of the filled capsule?", "options": ["Shell 18.3%, active 35.0%, inactive 46.7%", "Shell 18%, active 35%, inactive 47%", "Shell 18%, active 47%, inactive 35%", "Shell 11%, active 21%, inactive 28%"], "answer": "B", "answer_text": "Shell 18%, active 35%, inactive 47%", "exp": "Each part is divided by the 0.60 g total: 0.11 ÷ 0.60 × 100% = 18%, 0.21 ÷ 0.60 × 100% = 35% and 0.28 ÷ 0.60 × 100% = 47%, and those three total 100%. Every mass on that balance carries two digits, so 18.3%, 35.0% and 46.7% report a digit that was never measured, and reading 0.11 g straight off as 11% would only work if the total happened to be 1.00 g."}, {"id": 148, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "A study guide reports a regular Oreo as 30% wafer and 60% crème by mass. A lab group masses a whole regular Oreo at 11.24 g, then scrapes off and masses 3.32 g of crème. Using Part ÷ Total × 100% = percent composition, what do these data show?", "options": ["The guide is right at 30% wafer and 60% crème; parts need not total 100%", "About 70.5% wafer and 29.5% crème; the guide has wafer and crème backwards", "About 3.32% crème and 96.7% wafer; the crème mass in grams is its percent", "About 29.5% wafer and 70.5% crème; crème is the heavier part here"], "answer": "B", "answer_text": "About 70.5% wafer and 29.5% crème; the guide has wafer and crème backwards", "exp": "The wafer is 11.24 − 3.32 = 7.92 g, so 7.92 ÷ 11.24 × 100% = 70.5% wafer and 3.32 ÷ 11.24 × 100% = 29.5% crème, and the two total 100.0% as the parts of any whole must. The guide has wafer and crème the wrong way round, and its two figures reach only 90% rather than 100%, and a mass in grams is not a percent — 3.32 g is 29.5% of this cookie, not 3.32% of it."}, {"id": 149, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "An Extra-Strength Tylenol capsule is labeled 500. mg of acetaminophen, C₈H₉NO₂, molar mass 151.165 g/mol. One mole is 6.022 × 10²³ molecules. How many acetaminophen molecules does one capsule hold?", "options": ["3.31 × 10⁻³ molecules, the mole count written down as a molecule count", "4.55 × 10²⁵ molecules, from 0.500 × 151.165, then × 6.022 × 10²³", "3.01 × 10²³ molecules, from 0.500 g × 6.022 × 10²³ with no molar mass", "1.99 × 10²¹ molecules, from 0.500 ÷ 151.165, then × 6.022 × 10²³"], "answer": "D", "answer_text": "1.99 × 10²¹ molecules, from 0.500 ÷ 151.165, then × 6.022 × 10²³", "exp": "500. mg is 0.500 g, and 0.500 g ÷ 151.165 g/mol = 3.31 × 10⁻³ mol, which multiplied by 6.022 × 10²³ molecules/mol gives 1.99 × 10²¹ molecules. Skipping the molar mass gives 3.01 × 10²³, multiplying by it instead of dividing gives 4.55 × 10²⁵, and 3.31 × 10⁻³ is the mole count rather than a particle count."}, {"id": 150, "level": "Advanced", "tag": "Case File: The Poisonous Pill", "stem": "Mary Heller’s mother was almost certain she handed her daughter an Extra-Strength Tylenol. Percent composition run on the five pills still in the vial identifies Pill 1 as C₈H₉NO₂ (acetaminophen), Pill 2 as C₃H₅N₃O₉ (nitroglycerine), Pill 3 as C₁₄H₁₈N₂O₅ (aspartame) and Pills 4 and 5 as C₁₃H₁₈O₂ (ibuprofen). What claim do these data support?", "options": ["Nitroglycerine was in the vial, so Mary was surely handed the heart medicine", "Acetaminophen was in the vial, but the tests cannot show what Mary swallowed", "The vial held four medicines at once, so the mother’s account cannot be true", "Acetaminophen was in the vial, so the pill Mary swallowed was surely Tylenol"], "answer": "B", "answer_text": "Acetaminophen was in the vial, but the tests cannot show what Mary swallowed", "exp": "The evidence is percent composition run on the five pills that remain, and one of them really is acetaminophen, which is consistent with the mother reaching for Tylenol; but the pill Mary swallowed is gone, so no percent composition can identify it. A purse vial holding several medicines is ordinary and does not make her account false, and the presence of nitroglycerine among four other pills is not evidence about which one she was handed."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let picked = new Set(), setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
const tagCount = {}; tags.forEach(t=>tagCount[t]=BANK.filter(q=>q.tag===t).length);
$('#tagchips').innerHTML = tags.map((t,i)=>

document.querySelectorAll('#tagchips button').forEach((b,i)=>{

$('#tagall').onclick = ()=>{
  picked = new Set(tags);
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.add('on'));
  refresh();
};
$('#tagnone').onclick = ()=>{
  picked.clear();
  document.querySelectorAll('#tagchips button').forEach(b=>b.classList.remove('on'));
  refresh();
};

// No skills chosen means every skill — the same as choosing them all.
function pool(){
  return BANK.filter(q => levels.has(q.level) && (picked.size===0 || picked.has(q.tag)));
}
function refresh(){
  const n = pool().length;
  $('#taghint').textContent = picked.size === 0
    ? 'All ' + tags.length + ' skills'
    : picked.size + ' of ' + tags.length + ' selected';
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  // pos has already advanced past the last question by the time finish() runs,
  // so clamp: without this a completed set reports one more question than it held.
  const n = Math.min(pos + (answered?1:0), queue.length);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
