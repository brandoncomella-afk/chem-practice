<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "One of the pills left in the vial is acetaminophen, C₈H₉NO₂. How many hydrogen atoms are in one molecule of acetaminophen?", "options": ["2 hydrogen atoms", "8 hydrogen atoms", "9 hydrogen atoms", "1 hydrogen atom"], "answer": "C", "answer_text": "9 hydrogen atoms", "exp": "The subscript written after an element tells you how many atoms of that element there are, and the subscript after H is 9. The 8 belongs to carbon and the 2 belongs to oxygen, and 1 would only be correct if hydrogen had no subscript at all."}, {"id": 2, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "Potassium phosphate, K₃PO₄, is used as a filler in some tablets. How many phosphorus atoms are in one formula unit of K₃PO₄?", "options": ["0 phosphorus atoms", "3 phosphorus atoms", "4 phosphorus atoms", "1 phosphorus atom"], "answer": "D", "answer_text": "1 phosphorus atom", "exp": "When an element has no small number (subscript) beside it, there is only one of that element, so P stands for exactly 1 phosphorus atom. The 3 counts potassium and the 4 counts oxygen, and phosphorus cannot be absent because its symbol is written in the formula."}, {"id": 3, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "Milk of magnesia contains magnesium hydroxide, Mg(OH)₂. How many oxygen atoms are in one formula unit?", "options": ["4 oxygen atoms", "2 oxygen atoms", "3 oxygen atoms", "1 oxygen atom"], "answer": "B", "answer_text": "2 oxygen atoms", "exp": "When a formula contains parentheses, multiply the subscript outside by the subscripts inside: O has an understood subscript of 1, and 1 × 2 = 2 oxygen atoms. Answering 1 oxygen atom means the outside subscript was ignored, and 4 would require an O₂ inside the parentheses."}, {"id": 4, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "An inactive ingredient in a tablet is calcium nitrate, Ca(NO₃)₂. How many oxygen atoms are in one formula unit?", "options": ["8 oxygen atoms", "6 oxygen atoms", "5 oxygen atoms", "3 oxygen atoms"], "answer": "B", "answer_text": "6 oxygen atoms", "exp": "Multiply the subscript outside the parentheses by the subscript inside: 3 × 2 = 6 oxygen atoms. Answering 3 oxygen atoms ignores the 2 outside the parentheses, and 5 comes from adding 3 + 2 instead of multiplying them."}, {"id": 5, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "How many atoms in total are in one formula unit of aluminum carbonate, Al₂(CO₃)₃?", "options": ["12 atoms", "6 atoms", "8 atoms", "14 atoms"], "answer": "D", "answer_text": "14 atoms", "exp": "The 3 outside the parentheses multiplies both subscripts inside, giving 2 Al + 3 C + 9 O = 14 atoms. Answering 6 atoms ignores the outside subscript completely, and 12 comes from multiplying the oxygen through but leaving carbon at 1."}, {"id": 6, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "Aspirin has the formula C₉H₈O₄. How many atoms in total are in one molecule of aspirin?", "options": ["13 atoms", "17 atoms", "288 atoms", "21 atoms"], "answer": "D", "answer_text": "21 atoms", "exp": "Add the subscripts of every element: 9 C + 8 H + 4 O = 21 atoms. Answering 17 atoms leaves out the four oxygens and 13 leaves out the eight hydrogens, while 288 comes from multiplying the subscripts instead of adding them."}, {"id": 7, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "How many oxygen atoms are in one formula unit of magnesium phosphate, Mg₃(PO₄)₂?", "options": ["12 oxygen atoms", "8 oxygen atoms", "4 oxygen atoms", "6 oxygen atoms"], "answer": "B", "answer_text": "8 oxygen atoms", "exp": "Multiply the subscript inside the parentheses by the subscript outside: 4 × 2 = 8 oxygen atoms. Answering 4 oxygen atoms ignores the 2 outside, 6 comes from adding 4 + 2, and 12 uses the 3 that belongs to magnesium."}, {"id": 8, "level": "Beginner", "tag": "Counting Atoms in a Formula", "stem": "Codeine, one of the painkillers considered in the case, has the formula C₁₈H₂₁NO₃. How many atoms in total are in one molecule of codeine?", "options": ["43 atoms", "4 atoms", "39 atoms", "42 atoms"], "answer": "A", "answer_text": "43 atoms", "exp": "Add every subscript, remembering that N with no subscript means 1 nitrogen atom: 18 + 21 + 1 + 3 = 43 atoms. Answering 42 atoms drops that single nitrogen, 39 counts only the carbon and hydrogen, and 4 counts the kinds of elements rather than the atoms."}, {"id": 9, "level": "Beginner", "tag": "The Mole Concept", "stem": "A pair of shoes is always 2 shoes and a dozen roses is always 12 roses. A mole of atoms is always ______.", "options": ["6.022 × 10⁻²³ atoms", "6.022 atoms", "6.022 × 10²³ atoms", "6.022 × 10²² atoms"], "answer": "C", "answer_text": "6.022 × 10²³ atoms", "exp": "A mole is a counting word, and the count it stands for is 6.022 × 10²³ particles. Answering 6.022 atoms keeps the digits but throws away the power of ten, and 6.022 × 10²² is ten times too small."}, {"id": 10, "level": "Beginner", "tag": "The Mole Concept", "stem": "A mole connects ______.", "options": ["the number of protons to the number of neutrons", "the mass of a substance to the particles in it", "the oxidation number to the valence number", "the number of particles to the atomic number"], "answer": "B", "answer_text": "the mass of a substance to the particles in it", "exp": "The mole is the bridge between a mass you can weigh on a balance and the number of particles in that sample, which is why 1 mole = 6.022 × 10²³ particles = the mass in grams from the periodic table. Protons and neutrons, oxidation numbers, and atomic numbers are all counts of subatomic particles or charges, and none of them are tied to the mole."}, {"id": 11, "level": "Beginner", "tag": "The Mole Concept", "stem": "Which statement about the mole is correct?", "options": ["One mole always means 12 particles, just like a dozen", "One mole of any substance contains the same number of particles", "One mole of a heavy element holds more particles than a light one", "One mole of any substance has the same mass in grams"], "answer": "B", "answer_text": "One mole of any substance contains the same number of particles", "exp": "A mole is a fixed count, 6.022 × 10²³ particles, no matter what the substance is. The masses are not the same, because a heavier atom makes a heavier mole, and a dozen is 12 while a mole is 6.022 × 10²³."}, {"id": 12, "level": "Beginner", "tag": "The Mole Concept", "stem": "A vial holds 1 mole of ibuprofen molecules and a second vial holds 1 mole of naproxen molecules. Which vial holds more molecules?", "options": ["The naproxen vial, because its molar mass is larger", "The ibuprofen vial, because its molar mass is smaller", "The naproxen vial, because it holds more carbon atoms", "Neither: both vials hold 6.022 × 10²³ molecules"], "answer": "D", "answer_text": "Neither: both vials hold 6.022 × 10²³ molecules", "exp": "One mole is always 6.022 × 10²³ particles, so both vials hold exactly the same number of molecules. Molar mass changes how many grams you must weigh out, so the naproxen sample is heavier, but a larger molar mass never means more molecules."}, {"id": 13, "level": "Beginner", "tag": "The Mole Concept", "stem": "Potassium cyanide, KCN, is an ionic compound. One mole of KCN contains 6.022 × 10²³ particles, and those particles are correctly called:", "options": ["molecules, because KCN is a compound", "formula units, because KCN is ionic", "atoms, because KCN holds three elements", "grams, because KCN can be weighed out"], "answer": "B", "answer_text": "formula units, because KCN is ionic", "exp": "Ionic compounds such as KCN and NaCl are counted in formula units, because they are not built from separate molecules the way C₈H₉NO₂ is. One formula unit of KCN contains 3 atoms, so an atom count is not the same as a particle count, and grams measure mass rather than a number of particles."}, {"id": 14, "level": "Beginner", "tag": "The Mole Concept", "stem": "Complete the reference line: 6.022 × 10²³ particles = 1 mole = ______.", "options": ["the atomic number taken from the periodic table", "the mass in grams taken from the periodic table", "the mass in grams of one single particle", "the number of protons in one mole of atoms"], "answer": "B", "answer_text": "the mass in grams taken from the periodic table", "exp": "The periodic table entry for a substance gives the mass in grams of one mole of it, which is why the mole links a count of particles to a mass you can weigh. The atomic number is a proton count rather than a mass, and one single particle has a mass far too small to read on a balance."}, {"id": 15, "level": "Beginner", "tag": "The Mole Concept", "stem": "In the Day 1 lab, grains of rice were counted by weighing them instead of one at a time. Chemists count atoms the same way because ______.", "options": ["atoms are far too small and too numerous to count", "atoms all have exactly the same mass as one another", "atoms lose mass while they are being counted", "a balance reports the number of atoms directly"], "answer": "A", "answer_text": "atoms are far too small and too numerous to count", "exp": "A sample you can hold contains something like 10²³ atoms, so counting them individually is impossible and weighing is the practical substitute. Atoms of different elements have different masses, a balance reads mass and not a count, and nothing is lost during counting."}, {"id": 16, "level": "Beginner", "tag": "The Mole Concept", "stem": "A student weighs out 1 mole of carbon atoms and 1 mole of copper atoms. How do the two samples compare?", "options": ["The copper sample has more atoms, since copper is heavier", "The carbon sample has more atoms, since carbon is lighter", "Same number of atoms, but different masses", "Same mass and the same number of atoms"], "answer": "C", "answer_text": "Same number of atoms, but different masses", "exp": "Each sample contains 6.022 × 10²³ atoms because each is one mole, but a copper atom is heavier than a carbon atom, so the copper sample weighs 63.546 g while the carbon sample weighs 12.011 g. A heavier element gives a heavier mole, never a larger count of atoms."}, {"id": 17, "level": "Beginner", "tag": "Moles and Particles", "stem": "A sample contains 2.00 moles of copper atoms. How many copper atoms is that? (1 mole = 6.022 × 10²³ particles)", "options": ["1.20 × 10²⁴ atoms", "1.2044 × 10²⁴ atoms", "3.01 × 10²³ atoms", "6.022 × 10²³ atoms"], "answer": "A", "answer_text": "1.20 × 10²⁴ atoms", "exp": "Set up the domino so moles cancel: 2.00 mol × (6.022 × 10²³ atoms / 1 mol) = 1.20 × 10²⁴ atoms, rounded to the 3 digits given in 2.00. Writing 1.2044 × 10²⁴ keeps raw calculator digits, 3.01 × 10²³ comes from dividing instead of multiplying, and 6.022 × 10²³ is the count for only one mole."}, {"id": 18, "level": "Beginner", "tag": "Moles and Particles", "stem": "How many carbon atoms are in 4.0 moles of carbon? (1 mole = 6.022 × 10²³ particles)", "options": ["2.4088 × 10²⁴ atoms", "1.5 × 10²³ atoms", "2.4 × 10²³ atoms", "2.4 × 10²⁴ atoms"], "answer": "D", "answer_text": "2.4 × 10²⁴ atoms", "exp": "4.0 mol × (6.022 × 10²³ atoms / 1 mol) = 2.4 × 10²⁴ atoms, with 2 digits because 4.0 has only two. The value 2.4 × 10²³ has the right digits but is ten times too small, 2.4088 × 10²⁴ is the unrounded calculator output, and 1.5 × 10²³ comes from dividing."}, {"id": 19, "level": "Beginner", "tag": "Moles and Particles", "stem": "A sample of lithium contains 8.10 moles of lithium atoms. How many atoms is that? (1 mole = 6.022 × 10²³ particles)", "options": ["4.878 × 10²⁴ atoms", "4.88 × 10²⁴ atoms", "7.43 × 10²² atoms", "4.87 × 10²⁴ atoms"], "answer": "B", "answer_text": "4.88 × 10²⁴ atoms", "exp": "8.10 mol × (6.022 × 10²³ atoms / 1 mol) = 4.87782 × 10²⁴, which rounds up to 4.88 × 10²⁴ atoms for the 3 digits in 8.10. Rounding down to 4.87 × 10²⁴ drops the 8 that follows, 4.878 × 10²⁴ keeps one digit too many, and 7.43 × 10²² comes from dividing."}, {"id": 20, "level": "Beginner", "tag": "Moles and Particles", "stem": "How many molecules are in 0.500 mole of acetaminophen? (1 mole = 6.022 × 10²³ particles)", "options": ["3.01 × 10²³ molecules", "3.011 × 10²³ molecules", "6.022 × 10²³ molecules", "1.20 × 10²⁴ molecules"], "answer": "A", "answer_text": "3.01 × 10²³ molecules", "exp": "0.500 mol × (6.022 × 10²³ molecules / 1 mol) = 3.01 × 10²³ molecules, reported with 3 digits to match 0.500. Writing 3.011 × 10²³ keeps a fourth digit that the data does not support, and 1.20 × 10²⁴ comes from dividing by 0.500 instead of multiplying."}, {"id": 21, "level": "Beginner", "tag": "Moles and Particles", "stem": "One acetaminophen pill contains 1.48 × 10²¹ molecules of the active ingredient. How many moles is that? (1 mole = 6.022 × 10²³ particles)", "options": ["0.00246 mol", "407 mol", "0.002458 mol", "8.91 × 10⁴⁴ mol"], "answer": "A", "answer_text": "0.00246 mol", "exp": "Divide so that molecules cancel: 1.48 × 10²¹ molecules × (1 mol / 6.022 × 10²³ molecules) = 0.00246 mol, using the 3 digits in 1.48. The value 0.002458 keeps a fourth digit, 407 mol comes from flipping the domino upside down, and 8.91 × 10⁴⁴ comes from multiplying instead of dividing."}, {"id": 22, "level": "Beginner", "tag": "Moles and Particles", "stem": "An aspirin tablet contains 1.07 × 10²¹ molecules of aspirin. How many moles of aspirin is that? (1 mole = 6.022 × 10²³ particles)", "options": ["0.001777 mol", "563 mol", "0.00178 mol", "6.44 × 10⁴⁴ mol"], "answer": "C", "answer_text": "0.00178 mol", "exp": "1.07 × 10²¹ molecules × (1 mol / 6.022 × 10²³ molecules) = 0.00178 mol, rounded to the 3 digits in 1.07. The value 0.001777 shows a fourth digit the data cannot support, 563 mol is the inverted division, and 6.44 × 10⁴⁴ comes from multiplying by 6.022 × 10²³ instead of dividing."}, {"id": 23, "level": "Beginner", "tag": "Moles and Particles", "stem": "A sample of table salt contains 9.033 × 10²³ formula units of NaCl. How many moles of NaCl is that? (1 mole = 6.022 × 10²³ particles)", "options": ["0.6667 mol", "1.500 mol", "15.00 mol", "5.440 × 10⁴⁷ mol"], "answer": "B", "answer_text": "1.500 mol", "exp": "9.033 × 10²³ formula units × (1 mol / 6.022 × 10²³ formula units) = 1.500 mol, carrying the 4 digits given in 9.033. The value 0.6667 mol is the same division turned upside down, and 5.440 × 10⁴⁷ comes from multiplying the two large numbers together."}, {"id": 24, "level": "Beginner", "tag": "Molar Mass", "stem": "The mass of one mole of a substance, reported in g/mol, is called its ______.", "options": ["percent composition", "empirical formula", "formula mass", "molar mass"], "answer": "D", "answer_text": "molar mass", "exp": "Molar mass is the mass of one mole of a substance and carries the units g/mol. Formula mass is the same count of atoms reported in amu for a single molecule, while percent composition is a percent and an empirical formula is a ratio of atoms, so neither is a mass."}, {"id": 25, "level": "Beginner", "tag": "Molar Mass", "stem": "One mole of carbon would have a mass of ______ grams.", "options": ["6.022 × 10²³", "6", "6.022", "12.011"], "answer": "D", "answer_text": "12.011", "exp": "The periodic table entry for carbon gives 12.011, and that number in grams is the mass of one mole of carbon atoms. The 6 is carbon's atomic number rather than its mass, while 6.022 and 6.022 × 10²³ come from the particle count, which is a count and not a mass."}, {"id": 26, "level": "Beginner", "tag": "Molar Mass", "stem": "A one mole sample of carbon dioxide, CO₂, has a mass of ______ grams. (C 12.011, O 15.999)", "options": ["6.022 × 10²³", "44.009", "88.018", "28.010"], "answer": "B", "answer_text": "44.009", "exp": "Add one carbon and two oxygens: 12.011 + 2(15.999) = 44.009 g. Using 28.010 counts only one oxygen because the subscript 2 was skipped, 88.018 doubles the whole formula, and 6.022 × 10²³ is a count of particles rather than a mass."}, {"id": 27, "level": "Beginner", "tag": "Molar Mass", "stem": "What is the molar mass of water, H₂O? (H 1.008, O 15.999)", "options": ["10.000 g/mol", "36.030 g/mol", "18.015 g/mol", "17.007 g/mol"], "answer": "C", "answer_text": "18.015 g/mol", "exp": "Two hydrogens plus one oxygen gives 2(1.008) + 15.999 = 18.015 g/mol. Using 17.007 g/mol counts hydrogen only once, 36.030 g/mol doubles the entire formula, and 10.000 g/mol comes from adding atomic numbers instead of atomic masses."}, {"id": 28, "level": "Beginner", "tag": "Molar Mass", "stem": "What is the molar mass of sodium chloride, NaCl? (Na 22.990, Cl 35.453)", "options": ["35.453 g/mol", "116.886 g/mol", "28.000 g/mol", "58.443 g/mol"], "answer": "D", "answer_text": "58.443 g/mol", "exp": "Add one sodium and one chlorine: 22.990 + 35.453 = 58.443 g/mol. Using 35.453 g/mol reports only the chlorine, 116.886 g/mol doubles the formula, and 28.000 g/mol adds the atomic numbers 11 and 17 instead of the masses."}, {"id": 29, "level": "Beginner", "tag": "Molar Mass", "stem": "What is the molar mass of magnesium hydroxide, Mg(OH)₂? (Mg 24.305, O 15.999, H 1.008)", "options": ["58.319 g/mol", "116.638 g/mol", "41.312 g/mol", "30.000 g/mol"], "answer": "A", "answer_text": "58.319 g/mol", "exp": "The subscript outside the parentheses doubles both inside atoms: 24.305 + 2(15.999) + 2(1.008) = 58.319 g/mol. Using 41.312 g/mol ignores the 2 outside the parentheses, 116.638 g/mol doubles the magnesium as well, and 30.000 g/mol comes from atomic numbers instead of masses."}, {"id": 30, "level": "Beginner", "tag": "Molar Mass", "stem": "Acetaminophen is C₈H₉NO₂. What is its molar mass? (C 12.011, H 1.008, N 14.007, O 15.999)", "options": ["151.165 g/mol", "302.330 g/mol", "135.166 g/mol", "137.158 g/mol"], "answer": "A", "answer_text": "151.165 g/mol", "exp": "Add every atom: 8(12.011) + 9(1.008) + 14.007 + 2(15.999) = 96.088 + 9.072 + 14.007 + 31.998 = 151.165 g/mol. Using 137.158 g/mol leaves out the single nitrogen, 135.166 g/mol counts oxygen once instead of twice, and 302.330 g/mol doubles the whole formula."}, {"id": 31, "level": "Beginner", "tag": "Moles and Mass", "stem": "What is the mass of 4.0 moles of carbon? (C 12.011 g/mol)", "options": ["48.04 g", "0.33 g", "48 g", "36 g"], "answer": "C", "answer_text": "48 g", "exp": "4.0 mol × (12.011 g / 1 mol) = 48.044 g, which is reported as 48 g because 4.0 carries only two digits. Writing 48.04 g keeps calculator digits the data cannot support, 36 g comes from using 9 instead of 12.011, and 0.33 g comes from dividing instead of multiplying."}, {"id": 32, "level": "Beginner", "tag": "Moles and Mass", "stem": "What is the mass of 2.00 moles of water? (H₂O, 18.015 g/mol)", "options": ["36.0 g", "0.111 g", "36.030 g", "18.015 g"], "answer": "A", "answer_text": "36.0 g", "exp": "2.00 mol × (18.015 g / 1 mol) = 36.030 g, reported as 36.0 g to match the 3 digits in 2.00. Leaving all five digits as 36.030 g claims a precision the 2.00 does not have, 18.015 g is the mass of just one mole, and 0.111 g comes from dividing."}, {"id": 33, "level": "Beginner", "tag": "Moles and Mass", "stem": "A sample of pure carbon has a mass of 60. g. How many moles of carbon is that? (C 12.011 g/mol)", "options": ["4.995 mol", "7.2 × 10² mol", "0.20 mol", "5.0 mol"], "answer": "D", "answer_text": "5.0 mol", "exp": "Divide so grams cancel: 60. g × (1 mol / 12.011 g) = 4.9954 mol, which is 5.0 mol with the 2 digits that 60. provides. Reporting 4.995 mol keeps four digits, 7.2 × 10² mol comes from multiplying by the molar mass, and 0.20 mol inverts the division."}, {"id": 34, "level": "Beginner", "tag": "Moles and Mass", "stem": "One pill contains 0.372 g of acetaminophen. How many moles of acetaminophen is that? (151.165 g/mol)", "options": ["56.2 mol", "406 mol", "0.002461 mol", "0.00246 mol"], "answer": "D", "answer_text": "0.00246 mol", "exp": "0.372 g × (1 mol / 151.165 g) = 0.0024609 mol, reported as 0.00246 mol for the 3 digits in 0.372. The value 0.002461 mol keeps a fourth digit, 56.2 mol comes from multiplying by the molar mass, and 406 mol comes from dividing the molar mass by the mass."}, {"id": 35, "level": "Beginner", "tag": "Moles and Mass", "stem": "A sample of table salt has a mass of 25.0 g. How many moles of NaCl is that? (58.443 g/mol)", "options": ["1.46 × 10³ mol", "2.34 mol", "0.428 mol", "0.4278 mol"], "answer": "C", "answer_text": "0.428 mol", "exp": "25.0 g × (1 mol / 58.443 g) = 0.42777 mol, which is 0.428 mol with the 3 digits given by 25.0. Reporting 0.4278 mol keeps one digit too many, 2.34 mol flips the division, and 1.46 × 10³ mol comes from multiplying by the molar mass."}, {"id": 36, "level": "Beginner", "tag": "Moles and Mass", "stem": "What is the mass of 0.500 mole of sucrose? (C₁₂H₂₂O₁₁, 342.297 g/mol)", "options": ["0.00146 g", "342 g", "171 g", "171.15 g"], "answer": "C", "answer_text": "171 g", "exp": "0.500 mol × (342.297 g / 1 mol) = 171.15 g, reported as 171 g for the 3 digits in 0.500. Keeping 171.15 g shows five digits the data does not support, 342.297 g is the mass of a full mole, and 0.00146 g comes from dividing."}, {"id": 37, "level": "Beginner", "tag": "Moles and Mass", "stem": "A sample of lithium has a mass of 5.00 g. How many moles of lithium is that? (Li 6.941 g/mol)", "options": ["0.720 mol", "0.7204 mol", "1.39 mol", "34.7 mol"], "answer": "A", "answer_text": "0.720 mol", "exp": "5.00 g × (1 mol / 6.941 g) = 0.72036 mol, reported as 0.720 mol for the 3 digits in 5.00. The value 0.7204 mol carries a fourth digit, 1.39 mol is the inverted division, and 34.7 mol comes from multiplying by the molar mass."}, {"id": 38, "level": "Beginner", "tag": "Moles and Mass", "stem": "What is the mass of 1.50 moles of ibuprofen? (C₁₃H₁₈O₂, 206.285 g/mol)", "options": ["138 g", "309 g", "206.285 g", "309.43 g"], "answer": "B", "answer_text": "309 g", "exp": "1.50 mol × (206.285 g / 1 mol) = 309.4275 g, reported as 309 g because 1.50 carries only 3 digits. Writing 309.43 g keeps five digits, 206.285 g is the mass of one mole rather than 1.50 mol, and 138 g comes from dividing the molar mass by 1.50."}, {"id": 39, "level": "Beginner", "tag": "Percent Composition", "stem": "What is the percent composition of carbon in carbon dioxide, CO₂? Use Part/Total × 100% = Percent composition. (C 12.011, CO₂ 44.009 g/mol)", "options": ["366.41%", "33.3%", "72.708%", "27.292%"], "answer": "D", "answer_text": "27.292%", "exp": "The part is the carbon, 12.011 g, and the total is the whole mole, 44.009 g: (12.011/44.009) × 100% = 27.292%. The value 72.708% is the percent of oxygen, 33.3% counts atoms instead of mass since 1 of 3 atoms is carbon, and 366.41% comes from putting the total on top."}, {"id": 40, "level": "Beginner", "tag": "Percent Composition", "stem": "What is the percent composition of sodium in sodium sulfate, Na₂SO₄? Use Part/Total × 100% = Percent composition. (Na 22.990, Na₂SO₄ 142.04 g/mol)", "options": ["16.19%", "32.38%", "22.57%", "45.05%"], "answer": "B", "answer_text": "32.38%", "exp": "There are two sodiums, so the part is 2(22.990) = 45.980 g: (45.980/142.04) × 100% = 32.37%… rounded to four digits, 32.38%. Using 16.19% counts only one of the two sodium atoms, 22.57% is the sulfur percent, and 45.05% is the oxygen percent."}, {"id": 41, "level": "Beginner", "tag": "Percent Composition", "stem": "What is the percent composition of sodium in sodium carbonate, Na₂CO₃? Use Part/Total × 100% = Percent composition. (Na 22.990, Na₂CO₃ 105.988 g/mol)", "options": ["43.382%", "21.691%", "45.285%", "11.332%"], "answer": "A", "answer_text": "43.382%", "exp": "The part is both sodium atoms, 2(22.990) = 45.980 g: (45.980/105.988) × 100% = 43.382%. Using 21.691% counts a single sodium and forgets the subscript 2, while 45.285% is the oxygen percent and 11.332% is the carbon percent."}, {"id": 42, "level": "Beginner", "tag": "Percent Composition", "stem": "What is the percent composition of hydrogen in water, H₂O? Use Part/Total × 100% = Percent composition. (H 1.008, H₂O 18.015 g/mol)", "options": ["66.67%", "88.81%", "11.19%", "5.595%"], "answer": "C", "answer_text": "11.19%", "exp": "The part is 2(1.008) = 2.016 g of hydrogen out of 18.015 g: (2.016/18.015) × 100% = 11.19%. Using 5.595% counts one hydrogen instead of two, 88.81% is the oxygen percent, and 66.67% counts atoms rather than mass since 2 of the 3 atoms are hydrogen."}, {"id": 43, "level": "Beginner", "tag": "Percent Composition", "stem": "Pill 1 from the vial is acetaminophen, C₈H₉NO₂. What is its percent composition of carbon? Use Part/Total × 100% = Percent composition. (C 12.011, C₈H₉NO₂ 151.165 g/mol)", "options": ["63.565%", "21.168%", "40.0%", "6.0014%"], "answer": "A", "answer_text": "63.565%", "exp": "The part is all eight carbons, 8(12.011) = 96.088 g, so (96.088/151.165) × 100% = 63.565%. The value 21.168% is the oxygen percent and 6.0014% is the hydrogen percent, while 40.0% counts 8 carbon atoms out of 20 total atoms instead of comparing masses."}, {"id": 44, "level": "Beginner", "tag": "Percent Composition", "stem": "What is the percent composition of oxygen in aspirin, C₉H₈O₄? Use Part/Total × 100% = Percent composition. (O 15.999, C₉H₈O₄ 180.159 g/mol)", "options": ["8.8805%", "60.002%", "19.0%", "35.522%"], "answer": "D", "answer_text": "35.522%", "exp": "Four oxygens give a part of 4(15.999) = 63.996 g, so (63.996/180.159) × 100% = 35.522%. Using 8.8805% counts one oxygen instead of four, 60.002% is the carbon percent, and 19.0% counts 4 of the 21 atoms rather than comparing masses."}, {"id": 45, "level": "Beginner", "tag": "Percent Composition", "stem": "A 500. mg tablet contains 320. mg of active ingredient. What percent of the tablet is active ingredient? Use Part/Total × 100% = Percent composition.", "options": ["64.0%", "156%", "36.0%", "0.640%"], "answer": "A", "answer_text": "64.0%", "exp": "The part is the active ingredient and the total is the whole tablet: (320. mg/500. mg) × 100% = 64.0%, with 3 digits since both masses have three. The value 36.0% is the inactive ingredient left over, 156% comes from dividing the tablet mass by the active mass, and a percent above 100% cannot describe part of a tablet."}, {"id": 46, "level": "Beginner", "tag": "Percent Composition", "stem": "In the Oreo lab a whole cookie has a mass of 11.30 g and its creme filling has a mass of 3.40 g. What is the percent composition of creme? Use Part/Total × 100% = Percent composition.", "options": ["69.9%", "3.01%", "30.1%", "332%"], "answer": "C", "answer_text": "30.1%", "exp": "The creme is the part and the whole cookie is the total: (3.40 g/11.30 g) × 100% = 30.088%, or 30.1% with the 3 digits in 3.40. The value 69.9% is the percent of wafer, and 332% comes from dividing the cookie mass by the creme mass, which cannot be a part of the whole."}, {"id": 47, "level": "Beginner", "tag": "Empirical Formula", "stem": "An empirical formula is ______.", "options": ["the mass of one mole of the compound in grams", "the percent by mass of each element present", "the simplest whole number ratio of atoms", "the actual count of each element in one molecule"], "answer": "C", "answer_text": "the simplest whole number ratio of atoms", "exp": "An empirical formula reduces the atom counts to their simplest whole number ratio, so C₆H₁₂O₆ becomes CH₂O. The actual count of each element is the molecular formula, while a mass in grams is the molar mass and a percent by mass is the percent composition."}, {"id": 48, "level": "Beginner", "tag": "Empirical Formula", "stem": "A molecular formula is ______.", "options": ["the actual count of each element in the compound", "the ratio of the mass of the compound to its volume", "the simplest whole number ratio of the atoms", "the mass of all the atoms reported in amu"], "answer": "A", "answer_text": "the actual count of each element in the compound", "exp": "A molecular formula gives the actual number of atoms of each element in the compound, such as C₆H₁₂O₆ for glucose. The simplest whole number ratio is the empirical formula, the mass of all the atoms in amu is the formula mass, and mass over volume is density."}, {"id": 49, "level": "Beginner", "tag": "Empirical Formula", "stem": "Glucose has the molecular formula C₆H₁₂O₆. What is its empirical formula?", "options": ["C₂H₄O₂", "C₃H₆O₃", "C₆H₁₂O₆", "CH₂O"], "answer": "D", "answer_text": "CH₂O", "exp": "Divide every subscript by the largest number that goes into all of them, which is 6: 6/6 = 1, 12/6 = 2, 6/6 = 1, giving CH₂O. Dividing by 2 gives C₃H₆O₃ and dividing by 3 gives C₂H₄O₂, and both can still be reduced further, so neither is the simplest ratio."}, {"id": 50, "level": "Beginner", "tag": "Empirical Formula", "stem": "Following the empirical formula steps, a compound gives 0.250 mol of carbon and 0.500 mol of hydrogen. Step 3 says to divide each mole value by the smallest one. What ratio does that give?", "options": ["1 C to 2 H, giving CH₂", "1 C to 1 H, giving CH", "1 C to 4 H, giving CH₄", "2 C to 1 H, giving C₂H"], "answer": "A", "answer_text": "1 C to 2 H, giving CH₂", "exp": "The smallest mole value is 0.250, so 0.250/0.250 = 1 for carbon and 0.500/0.250 = 2 for hydrogen, giving CH₂. Answering C₂H divides by the wrong value and flips the ratio upside down, and CH₄ would need 1.00 mol of hydrogen instead of 0.500 mol."}, {"id": 51, "level": "Beginner", "tag": "Empirical Formula", "stem": "Which of these formulas is already written as an empirical formula?", "options": ["C₆H₁₂O₆", "H₂O₂", "CO₂", "C₄H₈"], "answer": "C", "answer_text": "CO₂", "exp": "The subscripts 1 and 2 in CO₂ share no common factor, so CO₂ is already the simplest whole number ratio. H₂O₂ reduces to HO, C₄H₈ reduces to CH₂, and C₆H₁₂O₆ reduces to CH₂O, so none of those three is in simplest form."}, {"id": 52, "level": "Beginner", "tag": "Percent Difference", "stem": "In the capsule lab a capsule is supposed to hold 0.600 g of powder, and one group's capsule held 0.552 g. What is the percent difference? Use |(Your Measurement − Their Measurement)/Their Measurement| × 100%.", "options": ["−8.0%", "8.7%", "92.0%", "8.0%"], "answer": "D", "answer_text": "8.0%", "exp": "The difference is 0.552 g − 0.600 g = −0.048 g, and |−0.048/0.600| × 100% = 8.0%, keeping the 2 digits that 0.048 provides. The value 8.7% divides by the group's own measurement instead of the accepted 0.600 g, 92.0% compares the masses directly instead of their difference, and the absolute value bars make a negative answer impossible."}, {"id": 53, "level": "Beginner", "tag": "Percent Difference", "stem": "Two lab groups massed the same powder and neither value is an accepted value: Group A got 0.372 g and Group B got 0.320 g. What is the percent difference? Use |(Group A − Group B)/mean of the two| × 100%.", "options": ["15%", "7.5%", "14%", "16%"], "answer": "A", "answer_text": "15%", "exp": "The mean is (0.372 g + 0.320 g)/2 = 0.346 g and the difference is 0.052 g, so (0.052/0.346) × 100% = 15%, with 2 digits because 0.052 has only two. Dividing by 0.372 g gives 14% and dividing by 0.320 g gives 16%, but neither group's value is accepted, and 7.5% comes from dividing by the sum rather than the mean."}, {"id": 54, "level": "Beginner", "tag": "Percent Difference", "stem": "Two groups measured the mass of the same tablet and got different answers. Neither group used an accepted value. What should the difference be divided by?", "options": ["the larger of the two measurements", "the sum of the two measurements", "the mean of the two measurements", "the smaller of the two measurements"], "answer": "C", "answer_text": "the mean of the two measurements", "exp": "When neither measurement is an accepted value, there is no reason to trust one group over the other, so the difference is divided by the mean of the two. Choosing the larger or the smaller value would treat that group as correct, and dividing by the sum makes the percent about half as large as it should be."}, {"id": 55, "level": "Intermediate", "tag": "Moles and Particles", "stem": "A dose of acetaminophen contains 0.250 mol of acetaminophen molecules. Using 6.022 × 10²³ particles = 1 mole, how many molecules of acetaminophen is that?", "options": ["4.15 × 10⁻²⁵ molecules", "1.51 × 10²³ molecules", "1.5 × 10²³ molecules", "6.022 × 10²³ molecules"], "answer": "B", "answer_text": "1.51 × 10²³ molecules", "exp": "Set the domino up so that the unit mol cancels: 0.250 mol × (6.022 × 10²³ molecules / 1 mol) = 1.5055 × 10²³ molecules, and 0.250 mol carries three significant digits, so the answer is 1.51 × 10²³ molecules. Writing 1.5 × 10²³ throws away a digit the data supports, 4.15 × 10⁻²⁵ comes from flipping the domino and dividing by 6.022 × 10²³, and 6.022 × 10²³ is the count for a full mole, not for a quarter of one."}, {"id": 56, "level": "Intermediate", "tag": "Moles and Particles", "stem": "A sample of aspirin contains 3.61 × 10²² molecules. How many moles of aspirin is in the sample?", "options": ["0.0599 mol", "0.060 mol", "16.7 mol", "2.17 × 10⁴⁶ mol"], "answer": "A", "answer_text": "0.0599 mol", "exp": "The domino that cancels molecules has molecules on the bottom: 3.61 × 10²² molecules × (1 mol / 6.022 × 10²³ molecules) = 0.059947 mol, which rounds to 0.0599 mol because 3.61 × 10²² carries only three significant digits, the fewest in the calculation. Reporting 0.060 mol drops to two digits, 2.17 × 10⁴⁶ mol comes from multiplying by 6.022 × 10²³ instead of dividing, and 16.7 mol comes from dividing 6.022 × 10²³ by 3.61 × 10²²."}, {"id": 57, "level": "Intermediate", "tag": "Moles and Particles", "stem": "A chemist weighs out 8.10 mol of lithium atoms. How many lithium atoms is that?", "options": ["4.88 × 10²³ atoms", "1.35 × 10⁻²³ atoms", "4.87 × 10²⁴ atoms", "4.88 × 10²⁴ atoms"], "answer": "D", "answer_text": "4.88 × 10²⁴ atoms", "exp": "8.10 mol × (6.022 × 10²³ atoms / 1 mol) = 4.87782 × 10²⁴ atoms, and three significant digits gives 4.88 × 10²⁴ atoms. Reporting 4.87 × 10²⁴ chops the third digit instead of rounding it, 4.88 × 10²³ loses a power of ten because 8.10 mol is more than one mole, and 1.35 × 10⁻²³ comes from dividing by 6.022 × 10²³ instead of multiplying."}, {"id": 58, "level": "Intermediate", "tag": "Moles and Particles", "stem": "Five pills are left in the vial from Mary Heller's mother's purse. Each pill contains 2.50 × 10⁻³ mol of active ingredient. How many molecules of active ingredient are in the five pills together?", "options": ["7.53 × 10²¹ molecules", "2.08 × 10⁻²⁶ molecules", "7.5 × 10²¹ molecules", "1.51 × 10²¹ molecules"], "answer": "A", "answer_text": "7.53 × 10²¹ molecules", "exp": "Five counted pills is an exact number, so 5 × 2.50 × 10⁻³ mol = 0.0125 mol, and 0.0125 mol × (6.022 × 10²³ molecules / 1 mol) = 7.5275 × 10²¹ molecules, or 7.53 × 10²¹ molecules to three significant digits. The value 1.51 × 10²¹ is one pill's worth, 7.5 × 10²¹ reports only two digits when the data supports three, and 2.08 × 10⁻²⁶ comes from dividing by 6.022 × 10²³."}, {"id": 59, "level": "Intermediate", "tag": "Moles and Particles", "stem": "Potassium cyanide, KCN, is an ionic compound, so a sample of it is counted in formula units. How many formula units are in 0.0400 mol of KCN?", "options": ["2.41 × 10²² formula units", "6.64 × 10⁻²⁶ formula units", "2.409 × 10²² formula units", "2.41 × 10²³ formula units"], "answer": "A", "answer_text": "2.41 × 10²² formula units", "exp": "0.0400 mol × (6.022 × 10²³ formula units / 1 mol) = 2.4088 × 10²² formula units, and 0.0400 mol has three significant digits, so the answer is 2.41 × 10²² formula units. Reporting 2.409 × 10²² keeps a fourth digit the measurement cannot support, 2.41 × 10²³ misplaces the exponent, and 6.64 × 10⁻²⁶ comes from dividing by 6.022 × 10²³ instead of multiplying."}, {"id": 60, "level": "Intermediate", "tag": "Moles and Particles", "stem": "A single pill was found to contain 1.48 × 10²¹ molecules of acetaminophen. How many moles of acetaminophen is that?", "options": ["2.5 × 10⁻³ mol", "8.91 × 10⁴⁴ mol", "2.46 × 10⁻³ mol", "407 mol"], "answer": "C", "answer_text": "2.46 × 10⁻³ mol", "exp": "1.48 × 10²¹ molecules × (1 mol / 6.022 × 10²³ molecules) = 2.4577 × 10⁻³ mol, which is 2.46 × 10⁻³ mol to three significant digits. Reporting 2.5 × 10⁻³ keeps only two digits, 8.91 × 10⁴⁴ comes from multiplying by 6.022 × 10²³ instead of dividing, and 407 mol comes from putting the two numbers in the wrong order in the division."}, {"id": 61, "level": "Intermediate", "tag": "Moles and Particles", "stem": "Which sample holds more particles: 0.500 mol of NaCl formula units, or a sample containing 2.00 × 10²³ molecules of water?", "options": ["They are equal, because a half mole is 2.00 × 10²³ particles", "The NaCl, because 0.500 mol is 3.01 × 10²³ formula units", "The water, because 2.00 × 10²³ is the larger of the two numbers", "The water, because 0.500 mol of NaCl is only 8.30 × 10⁻²⁵ units"], "answer": "B", "answer_text": "The NaCl, because 0.500 mol is 3.01 × 10²³ formula units", "exp": "Put both samples in the same unit first: 0.500 mol × (6.022 × 10²³ formula units / 1 mol) = 3.011 × 10²³, or 3.01 × 10²³ formula units, which is larger than 2.00 × 10²³ molecules of water. Comparing 0.500 to 2.00 × 10²³ directly compares a mole count to a particle count, 8.30 × 10⁻²⁵ comes from dividing 0.500 mol by 6.022 × 10²³, and a half mole is 3.01 × 10²³ particles, not 2.00 × 10²³."}, {"id": 62, "level": "Intermediate", "tag": "Molar Mass", "stem": "Aspirin has the formula C₉H₈O₄. Using H 1.008, C 12.011, and O 15.999 g/mol, what is the molar mass of aspirin?", "options": ["180.159 g/mol", "180.16 g/mol", "29.018 g/mol", "173.103 g/mol"], "answer": "A", "answer_text": "180.159 g/mol", "exp": "Multiply each atomic mass by its subscript and add: 9(12.011) + 8(1.008) + 4(15.999) = 108.099 + 8.064 + 63.996 = 180.159 g/mol. Every atomic mass used runs to the thousandths place, so the sum keeps three decimal places and 180.16 g/mol rounds away a digit that is known; 173.103 g/mol counts only one hydrogen, and 29.018 g/mol adds one atom of each element and ignores the subscripts entirely."}, {"id": 63, "level": "Intermediate", "tag": "Molar Mass", "stem": "Calcium nitrate is Ca(NO₃)₂. Remember that the subscript outside the parenthesis multiplies every subscript inside it. What is the molar mass of Ca(NO₃)₂?", "options": ["164.09 g/mol", "164.086 g/mol", "102.082 g/mol", "116.089 g/mol"], "answer": "B", "answer_text": "164.086 g/mol", "exp": "The 2 outside the parenthesis gives 2 N and 6 O: 40.078 + 2(14.007) + 6(15.999) = 40.078 + 28.014 + 95.994 = 164.086 g/mol. The value 102.082 g/mol ignores the outside subscript altogether and 116.089 g/mol applies it to the nitrogen but not the oxygen, while 164.09 g/mol drops a decimal place that all three atomic masses supply."}, {"id": 64, "level": "Intermediate", "tag": "Molar Mass", "stem": "What is the molar mass of aluminum carbonate, Al₂(CO₃)₃?", "options": ["233.988 g/mol", "137.994 g/mol", "86.990 g/mol", "233.99 g/mol"], "answer": "A", "answer_text": "233.988 g/mol", "exp": "The 3 outside the parenthesis gives 3 C and 9 O: 2(26.982) + 3(12.011) + 9(15.999) = 53.964 + 36.033 + 143.991 = 233.988 g/mol. The value 137.994 g/mol multiplies the carbon by 3 but leaves the oxygen at 3 instead of 9, 86.990 g/mol ignores the 2 on aluminum and the 3 outside the parenthesis, and 233.99 g/mol rounds off a decimal place the atomic masses support."}, {"id": 65, "level": "Intermediate", "tag": "Molar Mass", "stem": "What is the molar mass of magnesium hydroxide, Mg(OH)₂?", "options": ["57.311 g/mol", "58.319 g/mol", "82.624 g/mol", "41.312 g/mol"], "answer": "B", "answer_text": "58.319 g/mol", "exp": "The subscript 2 applies to both the O and the H inside the parenthesis: 24.305 + 2(15.999) + 2(1.008) = 24.305 + 31.998 + 2.016 = 58.319 g/mol. The value 41.312 g/mol ignores the outside subscript, 57.311 g/mol doubles the oxygen but not the hydrogen, and 82.624 g/mol doubles the magnesium as well, which the formula does not do."}, {"id": 66, "level": "Intermediate", "tag": "Molar Mass", "stem": "Calcium sulfate is CaSO₄. The atomic mass of sulfur is known only to the hundredths place, 32.06 g/mol, while Ca is 40.078 and O is 15.999 g/mol. What is the molar mass of CaSO₄?", "options": ["88.14 g/mol", "136.134 g/mol", "72.14 g/mol", "136.13 g/mol"], "answer": "D", "answer_text": "136.13 g/mol", "exp": "Adding gives 40.078 + 32.06 + 4(15.999) = 40.078 + 32.06 + 63.996 = 136.134, but in addition the answer stops at the fewest decimal places, and sulfur's 32.06 stops at the hundredths, so the molar mass is 136.13 g/mol. Reporting 136.134 g/mol claims a thousandths digit that sulfur's mass cannot support; 88.14 g/mol counts only one oxygen and 72.14 g/mol leaves the oxygen out completely."}, {"id": 67, "level": "Intermediate", "tag": "Molar Mass", "stem": "What is the molar mass of SCl₆, using S 32.06 g/mol and Cl 35.453 g/mol?", "options": ["212.72 g/mol", "67.51 g/mol", "244.778 g/mol", "244.78 g/mol"], "answer": "D", "answer_text": "244.78 g/mol", "exp": "The sum is 32.06 + 6(35.453) = 32.06 + 212.718 = 244.778, and because sulfur's mass is known only to the hundredths place the sum is reported as 244.78 g/mol. Keeping 244.778 g/mol claims a thousandths digit the sulfur value does not have, 212.72 g/mol leaves the sulfur out, and 67.51 g/mol uses only one chlorine instead of six."}, {"id": 68, "level": "Intermediate", "tag": "Molar Mass", "stem": "Ibuprofen, the active ingredient in Advil and Motrin, is C₁₃H₁₈O₂. What is its molar mass?", "options": ["206.285 g/mol", "206.281 g/mol", "206.29 g/mol", "189.149 g/mol"], "answer": "A", "answer_text": "206.285 g/mol", "exp": "Multiply and add: 13(12.011) + 18(1.008) + 2(15.999) = 156.143 + 18.144 + 31.998 = 206.285 g/mol. The value 206.281 g/mol comes from using 18.140 for the hydrogen instead of 18 × 1.008 = 18.144, 189.149 g/mol counts a single hydrogen, and 206.29 g/mol rounds off a decimal place that all three atomic masses supply."}, {"id": 69, "level": "Intermediate", "tag": "Moles and Mass", "stem": "A capsule holds 0.0250 mol of acetaminophen, whose molar mass is 151.165 g/mol. What is the mass of the acetaminophen in the capsule?", "options": ["1.65 × 10⁻⁴ g", "6.05 × 10³ g", "3.78 g", "3.779 g"], "answer": "C", "answer_text": "3.78 g", "exp": "Line up the domino so mol cancels: 0.0250 mol × (151.165 g / 1 mol) = 3.779125 g, and 0.0250 mol has three significant digits, so the mass is 3.78 g. Reporting 3.779 g keeps a fourth digit the sample size cannot support, while 1.65 × 10⁻⁴ g comes from turning the molar-mass domino upside down, and 6.05 × 10³ g comes from entering the two numbers in the wrong order."}, {"id": 70, "level": "Intermediate", "tag": "Moles and Mass", "stem": "A sample contains 4.0 mol of carbon atoms. What is the mass of the sample?", "options": ["36 g", "48.0 g", "48 g", "48.044 g"], "answer": "C", "answer_text": "48 g", "exp": "4.0 mol C × (12.011 g / 1 mol C) = 48.044 g, but 4.0 mol carries only two significant digits, so the mass must be reported as 48 g. The calculator output 48.044 g and the rounded 48.0 g both claim precision the 4.0 mol sample does not have, and 36 g comes from multiplying by 3 mol instead of the 4.0 mol given."}, {"id": 71, "level": "Intermediate", "tag": "Moles and Mass", "stem": "A student masses out 25.0 g of table salt, NaCl, whose molar mass is 58.443 g/mol. How many moles of NaCl is that?", "options": ["0.428 mol", "1.46 × 10³ mol", "2.34 mol", "0.4278 mol"], "answer": "A", "answer_text": "0.428 mol", "exp": "Put grams on the bottom of the domino so it cancels: 25.0 g × (1 mol / 58.443 g) = 0.42777 mol, which is 0.428 mol to three significant digits. Reporting 0.4278 mol keeps four digits when 25.0 g supplies only three, 2.34 mol comes from dividing 58.443 by 25.0, and 1.46 × 10³ mol comes from multiplying by the molar mass instead of dividing."}, {"id": 72, "level": "Intermediate", "tag": "Moles and Mass", "stem": "Potassium cyanide has a molar mass of 65.116 g/mol. How many moles of KCN are in a 0.500 g sample?", "options": ["0.0077 mol", "1.30 × 10² mol", "0.00768 mol", "32.6 mol"], "answer": "C", "answer_text": "0.00768 mol", "exp": "0.500 g × (1 mol / 65.116 g) = 0.0076786 mol, which is 0.00768 mol to the three significant digits that 0.500 g supplies. Reporting 0.0077 mol keeps only two digits, 32.6 mol comes from multiplying by 65.116 g/mol rather than dividing, and 1.30 × 10² mol comes from dividing 65.116 by 0.500."}, {"id": 73, "level": "Intermediate", "tag": "Moles and Mass", "stem": "The fatal dose of nicotine listed in the case file is 0.0601 g. Nicotine has a molar mass of 162.236 g/mol. How many moles is a fatal dose?", "options": ["3.7 × 10⁻⁴ mol", "9.75 mol", "3.704 × 10⁻⁴ mol", "3.70 × 10⁻⁴ mol"], "answer": "D", "answer_text": "3.70 × 10⁻⁴ mol", "exp": "0.0601 g × (1 mol / 162.236 g) = 3.7045 × 10⁻⁴ mol, and 0.0601 g has three significant digits, so the dose is 3.70 × 10⁻⁴ mol, with the zero written to show the third digit. Reporting 3.7 × 10⁻⁴ mol drops that digit and 3.704 × 10⁻⁴ mol claims a fourth digit the 0.0601 g dose cannot support, while 9.75 mol comes from multiplying by the molar mass instead of dividing."}, {"id": 74, "level": "Intermediate", "tag": "Moles and Mass", "stem": "Sucrose is C₁₂H₂₂O₁₁, with a molar mass of 342.297 g/mol. What is the mass of 2.50 mol of sucrose?", "options": ["856 g", "855.74 g", "0.00730 g", "8.6 × 10² g"], "answer": "A", "answer_text": "856 g", "exp": "2.50 mol × (342.297 g / 1 mol) = 855.7425 g, and 2.50 mol carries three significant digits, so the mass is 856 g. The calculator reading 855.74 g keeps five digits, 8.6 × 10² g keeps only two, and 0.00730 g comes from dividing by the molar mass when the units call for multiplying."}, {"id": 75, "level": "Intermediate", "tag": "Moles and Mass", "stem": "One tablet contains 0.500 g of ibuprofen, molar mass 206.285 g/mol. How many moles of ibuprofen are in the tablet?", "options": ["2.424 × 10⁻³ mol", "103 mol", "2.42 × 10⁻³ mol", "4.13 × 10² mol"], "answer": "C", "answer_text": "2.42 × 10⁻³ mol", "exp": "0.500 g × (1 mol / 206.285 g) = 2.4238 × 10⁻³ mol, which is 2.42 × 10⁻³ mol to the three significant digits that 0.500 g supplies. Reporting 2.424 × 10⁻³ mol keeps a fourth digit, 103 mol comes from multiplying by the molar mass instead of dividing, and 4.13 × 10² mol comes from dividing 206.285 by 0.500."}, {"id": 76, "level": "Intermediate", "tag": "Mass and Particles", "stem": "You have a 1.2 g sample of helium, molar mass 4.0026 g/mol. How many helium atoms do you have?", "options": ["5.0 × 10⁻²⁵ atoms", "2.9 × 10²⁴ atoms", "1.81 × 10²³ atoms", "1.8 × 10²³ atoms"], "answer": "D", "answer_text": "1.8 × 10²³ atoms", "exp": "Two dominoes are needed: 1.2 g × (1 mol / 4.0026 g) × (6.022 × 10²³ atoms / 1 mol) = 1.805 × 10²³ atoms, and 1.2 g has only two significant digits, so the count is 1.8 × 10²³ atoms. Reporting 1.81 × 10²³ claims a third digit the balance reading does not support, 2.9 × 10²⁴ comes from multiplying by 4.0026 g/mol instead of dividing, and 5.0 × 10⁻²⁵ comes from dividing by 6.022 × 10²³."}, {"id": 77, "level": "Intermediate", "tag": "Mass and Particles", "stem": "How many formula units of sodium chloride are in 10.0 g of NaCl? The molar mass of NaCl is 58.443 g/mol.", "options": ["2.84 × 10⁻²⁵ formula units", "1.03 × 10²³ formula units", "3.52 × 10²⁶ formula units", "1.030 × 10²³ formula units"], "answer": "B", "answer_text": "1.03 × 10²³ formula units", "exp": "Chain the dominoes: 10.0 g × (1 mol / 58.443 g) × (6.022 × 10²³ formula units / 1 mol) = 1.0304 × 10²³ formula units, or 1.03 × 10²³ to three significant digits. Reporting 1.030 × 10²³ keeps a fourth digit that 10.0 g cannot support, 3.52 × 10²⁶ comes from multiplying by the molar mass instead of dividing, and 2.84 × 10⁻²⁵ comes from dividing by 6.022 × 10²³."}, {"id": 78, "level": "Intermediate", "tag": "Mass and Particles", "stem": "A piece of copper wire has a mass of 12.5 g. Copper's molar mass is 63.546 g/mol. How many copper atoms are in the wire?", "options": ["1.18 × 10²³ atoms", "4.78 × 10²⁶ atoms", "3.06 × 10²⁴ atoms", "1.2 × 10²³ atoms"], "answer": "A", "answer_text": "1.18 × 10²³ atoms", "exp": "12.5 g × (1 mol / 63.546 g) × (6.022 × 10²³ atoms / 1 mol) = 1.1846 × 10²³ atoms, which is 1.18 × 10²³ atoms to three significant digits. Reporting 1.2 × 10²³ drops a digit that 12.5 g supports, 3.06 × 10²⁴ comes from dividing 63.546 by 12.5 in the first domino, and 4.78 × 10²⁶ comes from multiplying by the molar mass instead of dividing."}, {"id": 79, "level": "Intermediate", "tag": "Mass and Particles", "stem": "A sample of aspirin contains 2.41 × 10²² molecules. Aspirin's molar mass is 180.159 g/mol. What is the mass of the sample?", "options": ["2.61 × 10⁴⁸ g", "7.21 g", "7.2 g", "2.22 × 10⁻⁴ g"], "answer": "B", "answer_text": "7.21 g", "exp": "First to moles, then to grams: 2.41 × 10²² molecules × (1 mol / 6.022 × 10²³ molecules) × (180.159 g / 1 mol) = 7.2100 g, or 7.21 g to three significant digits. Reporting 7.2 g drops a supported digit, 2.22 × 10⁻⁴ g comes from dividing by the molar mass instead of multiplying, and 2.61 × 10⁴⁸ g comes from multiplying by 6.022 × 10²³ in the first step."}, {"id": 80, "level": "Intermediate", "tag": "Mass and Particles", "stem": "A syringe holds 3.00 × 10²¹ molecules of nicotine, molar mass 162.236 g/mol. What mass of nicotine is that?", "options": ["0.81 g", "2.93 × 10⁴⁷ g", "3.07 × 10⁻⁵ g", "0.808 g"], "answer": "D", "answer_text": "0.808 g", "exp": "3.00 × 10²¹ molecules × (1 mol / 6.022 × 10²³ molecules) × (162.236 g / 1 mol) = 0.80822 g, which is 0.808 g to three significant digits. Reporting 0.81 g drops a supported digit, 3.07 × 10⁻⁵ g comes from dividing by the molar mass instead of multiplying, and 2.93 × 10⁴⁷ g comes from multiplying by 6.022 × 10²³ rather than dividing."}, {"id": 81, "level": "Intermediate", "tag": "Mass and Particles", "stem": "How many magnesium atoms are in a 0.500 g strip of magnesium ribbon? The molar mass of Mg is 24.305 g/mol.", "options": ["7.32 × 10²⁴ atoms", "3.42 × 10⁻²⁶ atoms", "1.24 × 10²² atoms", "1.2 × 10²² atoms"], "answer": "C", "answer_text": "1.24 × 10²² atoms", "exp": "0.500 g × (1 mol / 24.305 g) × (6.022 × 10²³ atoms / 1 mol) = 1.2388 × 10²² atoms, which is 1.24 × 10²² atoms to three significant digits. Reporting 1.2 × 10²² keeps only two digits, 7.32 × 10²⁴ comes from multiplying by 24.305 g/mol instead of dividing, and 3.42 × 10⁻²⁶ comes from dividing by 6.022 × 10²³ in the second step."}, {"id": 82, "level": "Intermediate", "tag": "Mass and Particles", "stem": "An Extra-Strength tablet contains a 500. mg dose of acetaminophen, molar mass 151.165 g/mol. There are exactly 1000 mg in 1 g. How many acetaminophen molecules are in the dose?", "options": ["1.99 × 10²⁴ molecules", "2.0 × 10²¹ molecules", "1.99 × 10²¹ molecules", "4.55 × 10²⁵ molecules"], "answer": "C", "answer_text": "1.99 × 10²¹ molecules", "exp": "Three dominoes: 500. mg × (1 g / 1000 mg) × (1 mol / 151.165 g) × (6.022 × 10²³ molecules / 1 mol) = 1.9919 × 10²¹ molecules, or 1.99 × 10²¹ molecules, since 500. mg has three significant digits and the mg-to-g definition is exact. The value 1.99 × 10²⁴ skips the milligram domino and treats the dose as 500. g, 2.0 × 10²¹ reports only two digits, and 4.55 × 10²⁵ comes from multiplying by the molar mass instead of dividing."}, {"id": 83, "level": "Intermediate", "tag": "Percent Composition", "stem": "What is the percent composition of potassium in potassium carbonate, K₂CO₃? Percent composition = Part / Total × 100%. The molar mass of K₂CO₃ is 138.204 g/mol. Report your answer to three significant digits.", "options": ["28.3%", "56.6%", "33.3%", "56.58%"], "answer": "B", "answer_text": "56.6%", "exp": "The part is both potassium atoms, 2(39.098) = 78.196 g, so 78.196 g / 138.204 g × 100% = 56.580%, which is 56.6% to three significant digits. The value 28.3% uses only one potassium atom, 56.58% keeps four digits instead of the three asked for, and 33.3% comes from counting atoms (2 of 6) rather than comparing masses."}, {"id": 84, "level": "Intermediate", "tag": "Percent Composition", "stem": "Sodium carbonate, Na₂CO₃, has a molar mass of 105.988 g/mol. What is the percent composition of sodium in Na₂CO₃? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["45.3%", "21.7%", "43.38%", "43.4%"], "answer": "D", "answer_text": "43.4%", "exp": "The part is 2(22.990) = 45.980 g of sodium, so 45.980 g / 105.988 g × 100% = 43.382%, which is 43.4% to three significant digits. The value 21.7% uses a single sodium atom, 43.38% keeps a fourth digit, and 45.3% is the percent of oxygen in the compound rather than sodium."}, {"id": 85, "level": "Intermediate", "tag": "Percent Composition", "stem": "Carbon dioxide, CO₂, has a molar mass of 44.009 g/mol. What is the percent composition of oxygen in CO₂? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["72.71%", "27.3%", "36.4%", "72.7%"], "answer": "D", "answer_text": "72.7%", "exp": "Both oxygen atoms count as the part: 2(15.999) = 31.998 g, so 31.998 g / 44.009 g × 100% = 72.708%, which is 72.7% to three significant digits. The value 36.4% uses only one oxygen atom, 27.3% is the percent of carbon instead, and 72.71% keeps four digits when three were asked for."}, {"id": 86, "level": "Intermediate", "tag": "Percent Composition", "stem": "Magnesium hydroxide, Mg(OH)₂, has a molar mass of 58.319 g/mol. What is the percent composition of oxygen in Mg(OH)₂? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["41.7%", "54.9%", "27.4%", "54.87%"], "answer": "B", "answer_text": "54.9%", "exp": "The subscript outside the parenthesis gives two oxygens, so the part is 2(15.999) = 31.998 g and 31.998 g / 58.319 g × 100% = 54.867%, or 54.9% to three significant digits. The value 27.4% counts only one oxygen, 41.7% is the percent of magnesium, and 54.87% carries a fourth digit past what was asked for."}, {"id": 87, "level": "Intermediate", "tag": "Percent Composition", "stem": "Ibuprofen is C₁₃H₁₈O₂, molar mass 206.285 g/mol. What is the percent composition of carbon in ibuprofen? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["75.69%", "132%", "8.80%", "75.7%"], "answer": "D", "answer_text": "75.7%", "exp": "The carbon part is 13(12.011) = 156.143 g, so 156.143 g / 206.285 g × 100% = 75.693%, which is 75.7% to three significant digits and matches the case-file value for pills 4 and 5. The value 8.80% is the percent of hydrogen, 75.69% keeps four digits, and 132% comes from flipping the fraction to Total / Part; a percent composition can never be above 100%, so that result has to be wrong."}, {"id": 88, "level": "Intermediate", "tag": "Percent Composition", "stem": "Potassium phosphate, K₃PO₄, has a molar mass of 212.264 g/mol. What is the percent composition of phosphorus in K₃PO₄? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["55.3%", "14.59%", "14.6%", "30.1%"], "answer": "C", "answer_text": "14.6%", "exp": "There is only one phosphorus atom, so the part is 30.974 g and 30.974 g / 212.264 g × 100% = 14.592%, which is 14.6% to three significant digits. The value 55.3% is the percent of potassium, 30.1% is the percent of oxygen, and 14.59% keeps a fourth digit beyond what was asked for."}, {"id": 89, "level": "Intermediate", "tag": "Percent Composition", "stem": "Sucrose is C₁₂H₂₂O₁₁, molar mass 342.297 g/mol. What is the percent composition of hydrogen in sucrose? Percent composition = Part / Total × 100%. Report your answer to three significant digits.", "options": ["6.48%", "0.294%", "6.479%", "48.9%"], "answer": "A", "answer_text": "6.48%", "exp": "The hydrogen part is 22(1.008) = 22.176 g, so 22.176 g / 342.297 g × 100% = 6.4786%, which is 6.48% to three significant digits. The value 48.9% counts atoms (22 of the 45 atoms) instead of comparing masses, 0.294% uses a single hydrogen atom, and 6.479% keeps a fourth digit."}, {"id": 90, "level": "Intermediate", "tag": "Percent Composition", "stem": "A 25.0 g sample of calcium sulfate, CaSO₄, is analyzed. The molar mass of CaSO₄ is 136.13 g/mol and the atomic mass of sulfur is 32.06 g/mol. What mass of sulfur is in the sample?", "options": ["7.36 g", "23.6 g", "106 g", "5.89 g"], "answer": "D", "answer_text": "5.89 g", "exp": "Sulfur is 32.06 g / 136.13 g × 100% = 23.551% of the compound, and 25.0 g × 0.23551 = 5.8878 g, which is 5.89 g to the three significant digits that 25.0 g supplies. The value 23.6 g reports the percent as if it were the mass and never multiplies by the sample size, 7.36 g uses calcium's share instead of sulfur's, and 106 g comes from flipping the fraction."}, {"id": 91, "level": "Intermediate", "tag": "Empirical Formula", "stem": "Pill 1 from the vial is 63.5% C, 6.0% H, 9.3% N, and 21.2% O by mass. Assume a 100. g sample, convert each element to moles, and divide by the smallest mole value. What is the empirical formula?", "options": ["C₈H₉NO₂", "C₂₁H₂N₃O₇", "C₁₆H₁₈N₂O₄", "C₄H₅NO"], "answer": "A", "answer_text": "C₈H₉NO₂", "exp": "In 100. g there are 63.5 g / 12.011 = 5.287 mol C, 6.0 g / 1.008 = 5.95 mol H, 9.3 g / 14.007 = 0.664 mol N, and 21.2 g / 15.999 = 1.325 mol O; dividing every value by the smallest, 0.664, gives 7.96 : 8.97 : 1 : 2.00, or C₈H₉NO₂, which is acetaminophen. C₁₆H₁₈N₂O₄ is the same ratio doubled and so is not the simplest whole-number ratio, C₄H₅NO comes from halving a ratio that has an odd 9 in it, and C₂₁H₂N₃O₇ comes from treating the percents themselves as mole counts, dividing by the smallest and doubling."}, {"id": 92, "level": "Intermediate", "tag": "Empirical Formula", "stem": "Pill 2 is 15.9% C, 2.2% H, 18.5% N, and 63.4% O by mass. Assume a 100. g sample. What is the empirical formula of pill 2?", "options": ["C₆H₁₀N₆O₁₈", "C₃H₅N₃O₉", "CH₂NO₃", "C₂H₃N₂O₆"], "answer": "B", "answer_text": "C₃H₅N₃O₉", "exp": "The mole counts are 15.9 / 12.011 = 1.324 mol C, 2.2 / 1.008 = 2.18 mol H, 18.5 / 14.007 = 1.321 mol N, and 63.4 / 15.999 = 3.963 mol O, and dividing by the smallest, 1.321, gives 1.00 : 1.65 : 1 : 3.00. Multiplying every value by 3 clears the 1.65 to give 3 : 5 : 3 : 9, so the formula is C₃H₅N₃O₉, nitroglycerine; CH₂NO₃ comes from rounding 1.65 to 2 instead of multiplying, C₂H₃N₂O₆ comes from multiplying by 2 and then rounding, and C₆H₁₀N₆O₁₈ is the correct ratio doubled."}, {"id": 93, "level": "Intermediate", "tag": "Empirical Formula", "stem": "Pill 3 is 57.1% C, 6.2% H, 9.5% N, and 27.2% O by mass. Assume a 100. g sample. What is the empirical formula of pill 3?", "options": ["C₁₄H₁₈NO₅", "C₂₈H₃₆N₄O₁₀", "C₁₄H₁₈N₂O₅", "C₇H₉NO₃"], "answer": "C", "answer_text": "C₁₄H₁₈N₂O₅", "exp": "The mole counts are 4.754 mol C, 6.151 mol H, 0.678 mol N, and 1.700 mol O, and dividing by the smallest, 0.678, gives 7.01 : 9.07 : 1 : 2.51. Multiplying all four by 2 clears the 2.51 and gives C₁₄H₁₈N₂O₅, aspartame; C₇H₉NO₃ comes from rounding 2.51 up to 3 instead of multiplying by 2, C₁₄H₁₈NO₅ forgets to multiply the nitrogen along with the rest, and C₂₈H₃₆N₄O₁₀ multiplies one time too many."}, {"id": 94, "level": "Intermediate", "tag": "Empirical Formula", "stem": "Pills 4 and 5 are both 75.7% C, 8.8% H, and 15.5% O by mass. Assume a 100. g sample. What is the empirical formula of these pills?", "options": ["C₂₆H₃₆O₄", "C₆H₉O", "C₁₃H₁₈O₂", "C₇H₉O"], "answer": "C", "answer_text": "C₁₃H₁₈O₂", "exp": "The mole counts are 75.7 / 12.011 = 6.303 mol C, 8.8 / 1.008 = 8.73 mol H, and 15.5 / 15.999 = 0.969 mol O; dividing by 0.969 gives 6.51 : 9.01 : 1, and multiplying by 2 gives C₁₃H₁₈O₂, ibuprofen. Rounding 6.51 up to 7 gives C₇H₉O and rounding it down gives C₆H₉O, both of which skip the step of multiplying until the values are whole, while C₂₆H₃₆O₄ is the right ratio doubled and so is not simplest."}, {"id": 95, "level": "Intermediate", "tag": "Empirical Formula", "stem": "A compound is 40.0% C, 6.7% H, and 53.3% O by mass. Assume a 100. g sample. What is the empirical formula of the compound?", "options": ["CH₂O", "CHO", "C₂H₄O₂", "C₆HO₈"], "answer": "A", "answer_text": "CH₂O", "exp": "The mole counts are 40.0 / 12.011 = 3.330 mol C, 6.7 / 1.008 = 6.65 mol H, and 53.3 / 15.999 = 3.331 mol O, and dividing all three by the smallest, 3.330, gives 1 : 2.00 : 1.00, so the empirical formula is CH₂O. C₂H₄O₂ is that ratio doubled rather than simplest, CHO comes from dividing by the largest mole value, 6.65, and then rounding 0.50 up to 1, and C₆HO₈ comes from using the percents directly as if they were mole counts."}, {"id": 96, "level": "Intermediate", "tag": "Empirical Formula", "stem": "A white powder is 27.7% Mg, 23.6% P, and 48.7% O by mass. Assume a 100. g sample. What is the empirical formula of the powder?", "options": ["Mg₆(PO₄)₄", "Mg₃(PO₄)₂", "Mg₂PO₄", "MgPO₄"], "answer": "B", "answer_text": "Mg₃(PO₄)₂", "exp": "The mole counts are 27.7 / 24.305 = 1.140 mol Mg, 23.6 / 30.974 = 0.762 mol P, and 48.7 / 15.999 = 3.044 mol O, and dividing by 0.762 gives 1.50 : 1 : 4.00. Multiplying all three by 2 gives 3 : 2 : 8, written Mg₃(PO₄)₂; Mg₂PO₄ rounds 1.50 up and MgPO₄ rounds it down instead of multiplying, and Mg₆(PO₄)₄ is that ratio doubled and so is not the simplest."}, {"id": 97, "level": "Intermediate", "tag": "Empirical Formula", "stem": "A poison recovered in the case file is 75.5% C, 13.5% H, and 11.0% N by mass. Assume a 100. g sample. What is its empirical formula?", "options": ["C₈H₁₇N", "C₄H₉N", "C₁₆H₃₄N₂", "C₆H₁₃N"], "answer": "A", "answer_text": "C₈H₁₇N", "exp": "The mole counts are 75.5 / 12.011 = 6.286 mol C, 13.5 / 1.008 = 13.39 mol H, and 11.0 / 14.007 = 0.785 mol N, and dividing all three by the smallest, 0.785, gives 8.00 : 17.1 : 1, so the empirical formula is C₈H₁₇N, coniine. C₆H₁₃N comes from rounding the mole counts themselves into subscripts without dividing by the smallest, C₁₆H₃₄N₂ is the correct ratio doubled, and C₄H₉N halves a ratio with an odd 17 in it."}, {"id": 98, "level": "Intermediate", "tag": "Empirical Formula", "stem": "Nicotine is 74.0% C, 8.70% H, and 17.3% N by mass. Assume a 100. g sample. What is the empirical formula of nicotine, the simplest whole-number ratio of its atoms?", "options": ["C₆H₉N", "C₅H₆N", "C₅H₇N", "C₁₀H₁₄N₂"], "answer": "C", "answer_text": "C₅H₇N", "exp": "The mole counts are 74.0 / 12.011 = 6.161 mol C, 8.70 / 1.008 = 8.631 mol H, and 17.3 / 14.007 = 1.235 mol N, and dividing by 1.235 gives 4.99 : 6.99 : 1, so the empirical formula is C₅H₇N. C₁₀H₁₄N₂ is nicotine's molecular formula, the actual count of atoms, which takes the molar mass to find and is not the simplest ratio; C₅H₆N rounds 6.99 down to 6, and C₆H₉N uses the mole counts as subscripts without dividing by the smallest."}, {"id": 99, "level": "Intermediate", "tag": "Molecular Formula", "stem": "A sugar has the empirical formula CH₂O and a molar mass of 180.156 g/mol. Find the mass of the empirical formula, divide the molar mass by it, and multiply the subscripts. What is the molecular formula?", "options": ["C₁₂H₂₄O₁₂", "CH₂O", "C₆H₁₂O₆", "C₅H₁₀O₅"], "answer": "C", "answer_text": "C₆H₁₂O₆", "exp": "The empirical formula mass is 12.011 + 2(1.008) + 15.999 = 30.026 g/mol, and 180.156 g/mol ÷ 30.026 g/mol = 6.00, so every subscript is multiplied by the whole number 6 to give C₆H₁₂O₆. Answering CH₂O uses the empirical formula in place of the molecular formula, C₅H₁₀O₅ comes from subtracting 30.026 from 180.16 before dividing, and C₁₂H₂₄O₁₂ comes from dividing by 15.035, the mass of CH₃, instead of 30.026."}, {"id": 100, "level": "Intermediate", "tag": "Molecular Formula", "stem": "A second compound also has the empirical formula CH₂O, but its molar mass is 60.052 g/mol. What is its molecular formula?", "options": ["C₂H₂O₂", "CH₂O", "C₄H₈O₄", "C₂H₄O₂"], "answer": "D", "answer_text": "C₂H₄O₂", "exp": "The empirical formula mass of CH₂O is 30.026 g/mol, and 60.052 g/mol ÷ 30.026 g/mol = 2.00, so each subscript doubles to give C₂H₄O₂. Answering CH₂O treats the empirical formula as the molecular one even though the molar mass is twice as large, C₂H₂O₂ doubles the C and the O but leaves the H behind, and C₄H₈O₄ multiplies by 4 instead of 2."}, {"id": 101, "level": "Intermediate", "tag": "Molecular Formula", "stem": "A hydrocarbon has the empirical formula C₂H₅ and a molar mass of 58.12 g/mol. What is its molecular formula?", "options": ["C₄H₅", "C₆H₁₅", "C₂H₅", "C₄H₁₀"], "answer": "D", "answer_text": "C₄H₁₀", "exp": "The empirical formula mass is 2(12.011) + 5(1.008) = 29.062 g/mol, and 58.12 g/mol ÷ 29.062 g/mol = 2.000, so doubling every subscript gives C₄H₁₀, butane. Answering C₂H₅ uses the empirical formula unchanged, C₆H₁₅ triples instead of doubles, and C₄H₅ doubles only the carbon subscript."}, {"id": 102, "level": "Intermediate", "tag": "Molecular Formula", "stem": "A hydrocarbon has the empirical formula CH₂ and a molar mass of 42.08 g/mol. What is its molecular formula?", "options": ["CH₂", "C₆H₁₂", "C₃H₆", "C₃H₂"], "answer": "C", "answer_text": "C₃H₆", "exp": "The empirical formula mass is 12.011 + 2(1.008) = 14.027 g/mol, and 42.08 g/mol ÷ 14.027 g/mol = 3.00, so each subscript is tripled to give C₃H₆. Answering CH₂ stops at the empirical formula, C₃H₂ triples only the carbon, and C₆H₁₂ doubles the answer a second time and would have a molar mass of about 84 g/mol."}, {"id": 103, "level": "Intermediate", "tag": "Molecular Formula", "stem": "Caffeine has the empirical formula C₄H₅N₂O and a molar mass of 194.19 g/mol. What is the molecular formula of caffeine?", "options": ["C₁₂H₁₅N₆O₃", "C₈H₁₀N₂O", "C₄H₅N₂O", "C₈H₁₀N₄O₂"], "answer": "D", "answer_text": "C₈H₁₀N₄O₂", "exp": "The empirical formula mass is 4(12.011) + 5(1.008) + 2(14.007) + 15.999 = 97.097 g/mol, and 194.19 g/mol ÷ 97.097 g/mol = 2.00, so every subscript doubles to give C₈H₁₀N₄O₂. Answering C₄H₅N₂O uses the empirical formula as though it were the molecular formula, C₈H₁₀N₂O doubles only the carbon and hydrogen, and C₁₂H₁₅N₆O₃ multiplies by 3 instead of 2."}, {"id": 104, "level": "Intermediate", "tag": "Molecular Formula", "stem": "A compound has the empirical formula C₉H₈O₄ and a molar mass of 180.16 g/mol. What is its molecular formula?", "options": ["C₂₇H₂₄O₁₂, because three empirical units fit in the molar mass", "CH₂O, because that is the simplest ratio of the three elements", "C₁₈H₁₆O₈, because a molecular formula always doubles the empirical", "C₉H₈O₄, because the molar mass equals the empirical formula mass"], "answer": "D", "answer_text": "C₉H₈O₄, because the molar mass equals the empirical formula mass", "exp": "The empirical formula mass is 9(12.011) + 8(1.008) + 4(15.999) = 180.159 g/mol, and 180.16 g/mol ÷ 180.159 g/mol = 1.00, so every subscript is multiplied by 1 and the molecular formula is the same as the empirical formula, C₉H₈O₄, aspirin. Doubling to C₁₈H₁₆O₈ would give about 360 g/mol and tripling to C₂₇H₂₄O₁₂ about 540 g/mol, neither of which matches 180.16 g/mol, and CH₂O is not the ratio that 9 : 8 : 4 reduces to."}, {"id": 105, "level": "Intermediate", "tag": "Percent Difference", "stem": "Two lab groups measure the hydrogen content of the same sample. Group 1 reports 6.48% H and Group 2 reports 6.12% H. Neither value is an accepted value, so percent difference = |Group 1 − Group 2| / (mean of the two values) × 100%. What is the percent difference?", "options": ["5.71%", "5.88%", "5.7%", "5.56%"], "answer": "C", "answer_text": "5.7%", "exp": "The difference is 6.48% − 6.12% = 0.36%, a subtraction that keeps the hundredths place and leaves two significant digits, and the mean is (6.48% + 6.12%) / 2 = 6.30%, so 0.36 / 6.30 × 100% = 5.71%, reported as 5.7%. Keeping 5.71% claims a third digit that the subtracted 0.36 cannot support, 5.56% divides by Group 1's value instead of the mean, and 5.88% divides by Group 2's value."}, {"id": 106, "level": "Intermediate", "tag": "Percent Difference", "stem": "A group measures the molar mass of ibuprofen as 215.0 g/mol. The accepted value is 206.285 g/mol. Percent error = |Measured − Accepted| / Accepted × 100%. What is the percent error?", "options": ["4.05%", "0.042%", "4.2%", "4.22%"], "answer": "C", "answer_text": "4.2%", "exp": "The subtraction 215.0 − 206.285 = 8.715 stops at the tenths place because 215.0 does, giving 8.7 g/mol with two significant digits, and 8.7 / 206.285 × 100% = 4.2%. Reporting 4.22% keeps digits the subtraction destroyed, and 4.05% divides by the group's own measurement instead of the accepted value. Note that this is percent ERROR, not percent difference — there is an accepted value here, so one number is the standard rather than both being equal measurements."}, {"id": 107, "level": "Intermediate", "tag": "Case File: The Poisonous Pill", "stem": "An autopsy report lists a fatal dose of nicotine as 0.0601 g. Nicotine has a density of 1.01 g/mL, and the capsule found at the scene holds 0.5 mL. Using density = mass / volume, what volume is a fatal dose, and can it fit in the capsule?", "options": ["0.0595 mL, which fits easily inside the capsule", "0.060 mL, which fits easily inside the capsule", "16.8 mL, which is far too large for the capsule", "0.0607 mL, which fits easily inside the capsule"], "answer": "A", "answer_text": "0.0595 mL, which fits easily inside the capsule", "exp": "Rearranging density = mass / volume gives volume = 0.0601 g × (1 mL / 1.01 g) = 0.059505 mL, or 0.0595 mL to the three significant digits both measurements supply — well under the 0.5 mL the capsule holds, so nicotine cannot be ruled out on volume. Reporting 0.060 mL drops a digit the data support, 0.0607 mL comes from multiplying by the density, and 16.8 mL comes from dividing the density by the mass."}, {"id": 108, "level": "Intermediate", "tag": "Case File: The Poisonous Pill", "stem": "A capsule taken from the vial has a total mass of 0.500 g, and the analysis shows 0.372 g of acetaminophen, the active ingredient. What mass of inactive ingredient (filler) is in the capsule, and what percent of the capsule is inactive?", "options": ["0.13 g of filler, which is 26% of the capsule", "0.128 g of filler, which is 25.6% of the capsule", "0.128 g of filler, which is 34.4% of the capsule", "0.372 g of filler, which is 74.4% of the capsule"], "answer": "B", "answer_text": "0.128 g of filler, which is 25.6% of the capsule", "exp": "Subtracting gives 0.500 g − 0.372 g = 0.128 g of filler, a result good to the thousandths place because both masses are, and 0.128 g / 0.500 g × 100% = 25.6% of the capsule. Reporting 0.13 g and 26% throws away a digit the balance supplied, 34.4% divides the filler by the 0.372 g of active ingredient instead of by the whole capsule, and 0.372 g with 74.4% names the active ingredient rather than the filler."}, {"id": 109, "level": "Advanced", "tag": "Molar Mass", "stem": "A study guide shows this work: “Empirical formula CH₂O. Molar mass = 12.011 + 1.008 + 15.999 = 29.018 g/mol.” Using C 12.011, H 1.008 and O 15.999, what is the molar mass of CH₂O, and where did the work go wrong?", "options": ["30.026 g/mol; the subscript 2 counts two hydrogen atoms, so 1.008 is added twice", "60.052 g/mol; the subscript 2 doubles every atom in the formula, not just hydrogen", "28.010 g/mol; hydrogen is so light that it is left out of a molar mass total", "29.018 g/mol; a subscript changes the atom count in a formula but not its mass total"], "answer": "A", "answer_text": "30.026 g/mol; the subscript 2 counts two hydrogen atoms, so 1.008 is added twice", "exp": "CH₂O holds one C, two H and one O, so the molar mass is 12.011 + 2(1.008) + 15.999 = 30.026 g/mol; the work added 1.008 only once. Doubling the whole formula gives 60.052 g/mol, which is really the mass of C₂H₄O₂, and dropping hydrogen gives 28.010 g/mol — every atom in a formula contributes its mass."}, {"id": 110, "level": "Advanced", "tag": "Molar Mass", "stem": "A student’s worked solution for the filler magnesium phosphate, Mg₃(PO₄)₂, reads: “3(24.305) + 30.974 + 4(15.999) = 167.885 g/mol.” Using Mg 24.305, P 30.974 and O 15.999, what is the correct molar mass?", "options": ["167.885 g/mol, because a subscript outside parentheses applies only to the metal atoms", "335.770 g/mol, because the 2 outside the parentheses doubles the entire formula", "262.855 g/mol, because the 2 outside the parentheses doubles both the P and the O", "214.245 g/mol, because the 3 belongs to the parentheses and not to the magnesium atoms"], "answer": "C", "answer_text": "262.855 g/mol, because the 2 outside the parentheses doubles both the P and the O", "exp": "The 2 outside the parentheses multiplies every subscript inside, so the count is 3 Mg, 2 P and 8 O: 72.915 + 61.948 + 127.992 = 262.855 g/mol. The 167.885 g/mol version counts one P and four O instead of two and eight, 214.245 g/mol drops the 3 from magnesium, and 335.770 g/mol is just 167.885 doubled."}, {"id": 111, "level": "Advanced", "tag": "Molar Mass", "stem": "Codeine is C₁₈H₂₁NO₃ and naproxen is C₁₄H₁₄O₃. Using C 12.011, H 1.008, N 14.007 and O 15.999, how much larger is the molar mass of codeine than the molar mass of naproxen?", "options": ["69.11 g/mol, the gap rounded off to the nearest hundredth gram", "69.107 g/mol, the gap between 299.370 g/mol and 230.263 g/mol", "55.100 g/mol, the gap once codeine’s nitrogen atom is left out", "529.633 g/mol, found by adding the two molar masses together"], "answer": "B", "answer_text": "69.107 g/mol, the gap between 299.370 g/mol and 230.263 g/mol", "exp": "Codeine is 18(12.011) + 21(1.008) + 14.007 + 3(15.999) = 299.370 g/mol and naproxen is 14(12.011) + 14(1.008) + 3(15.999) = 230.263 g/mol, so the gap is 299.370 − 230.263 = 69.107 g/mol. Both molar masses carry three decimal places, so the difference keeps three, and 69.11 g/mol throws away a digit the data supports. Dropping codeine’s nitrogen gives 55.100 g/mol, and 529.633 g/mol is the sum rather than the difference."}, {"id": 112, "level": "Advanced", "tag": "Moles and Mass", "stem": "A study guide states: “4.0 moles of carbon has a mass of 36 g.” Carbon’s molar mass is 12.011 g/mol. What mass should be reported, and with how many digits?", "options": ["0.33 g, because moles become grams by dividing 4.0 by 12.011 g/mol", "36 g, because one mole of carbon weighs 9 g and 4.0 × 9 gives 36 g", "48 g, because 4.0 × 12.011 = 48.044 and 4.0 carries only two digits", "48.044 g, because every digit the calculator displays should be kept"], "answer": "C", "answer_text": "48 g, because 4.0 × 12.011 = 48.044 and 4.0 carries only two digits", "exp": "Grams come from moles by multiplying: 4.0 mol × 12.011 g/mol = 48.044 g, and because 4.0 mol is known to only two digits the result is reported as 48 g. Writing 48.044 g claims five digits from two-digit data, 0.33 g comes from dividing instead of multiplying, and no mole of carbon weighs 9 g."}, {"id": 113, "level": "Advanced", "tag": "Moles and Mass", "stem": "Sucrose, C₁₂H₂₂O₁₁, is used as an inactive ingredient and has a molar mass of 342.30 g/mol. What is the mass of 0.0125 mol of sucrose?", "options": ["7.53 × 10²¹ g, from 0.0125 mol × 6.022 × 10²³", "4.28 g, from 0.0125 mol × 342.30 g/mol = 4.27875 g", "4.279 g, keeping four digits off the calculator display", "2.74 × 10⁴ g, from 342.30 g/mol ÷ 0.0125 mol"], "answer": "B", "answer_text": "4.28 g, from 0.0125 mol × 342.30 g/mol = 4.27875 g", "exp": "One mole of sucrose is 342.30 g, so 0.0125 mol × 342.30 g/mol = 4.27875 g, and 0.0125 mol carries three digits, giving 4.28 g. Reporting 4.279 g keeps a fourth digit the measurement does not support, dividing in the wrong order gives 2.74 × 10⁴ g, and 6.022 × 10²³ counts particles rather than converting to grams."}, {"id": 114, "level": "Advanced", "tag": "Moles and Mass", "stem": "Pills 4 and 5 from the vial are ibuprofen, C₁₃H₁₈O₂, molar mass 206.285 g/mol. A vial holds 50 tablets, and each tablet contains 0.200 g of ibuprofen. How many moles of ibuprofen are in the full vial?", "options": ["0.048477 mol, the whole calculator reading for 10.0 ÷ 206.285", "0.0485 mol, from 50 × 0.200 g = 10.0 g, then 10.0 ÷ 206.285", "2.06 × 10³ mol, from 10.0 g × 206.285 g/mol instead of dividing", "0.000970 mol, the moles in one tablet rather than in the whole vial"], "answer": "B", "answer_text": "0.0485 mol, from 50 × 0.200 g = 10.0 g, then 10.0 ÷ 206.285", "exp": "The 50 tablets are a counted number with no measurement error, so 50 × 0.200 g = 10.0 g of ibuprofen, and 10.0 g ÷ 206.285 g/mol = 0.048477 mol, reported to the three digits 0.200 g supports as 0.0485 mol. 0.000970 mol stops after a single tablet, 2.06 × 10³ mol comes from multiplying by the molar mass, and 0.048477 mol claims five digits."}, {"id": 115, "level": "Advanced", "tag": "Moles and Mass", "stem": "A lab balance reading to the nearest 0.01 g gives 0.42 g of sucrose, molar mass 342.30 g/mol. A student’s worked solution reads: “0.42 ÷ 342.30 = 0.0012270 mol.” What should be reported?", "options": ["0.0012270 mol, because a division keeps every digit the display shows", "0.00123 mol, because the molar mass is what sets the digit count here", "0.0012 mol, because the 0.42 g mass is known to only two digits", "8.2 × 10² mol, because 342.30 is divided by the 0.42 g mass"], "answer": "C", "answer_text": "0.0012 mol, because the 0.42 g mass is known to only two digits", "exp": "0.42 g ÷ 342.30 g/mol = 0.0012270 mol on the calculator, but 0.42 g carries two digits while 342.30 g/mol carries five, so the answer is cut to two: 0.0012 mol. Keeping 0.0012270 mol or 0.00123 mol claims precision the balance never delivered, and 8.2 × 10² mol comes from dividing in the wrong order."}, {"id": 116, "level": "Advanced", "tag": "Mass and Particles", "stem": "A study guide states: “4.0 moles of carbon contains 2.4 × 10²³ atoms,” using 6.022 × 10²³ atoms per mole. What is the c
