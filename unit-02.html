<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "History of Atomic Models", "stem": "John Dalton's atomic theory of 1803 described atoms as:", "options": ["solid particles that cannot be split apart", "positive spheres with electrons stuck inside", "mostly empty space around a dense nucleus", "clouds of electrons moving on fixed rings"], "answer": "A", "answer_text": "solid particles that cannot be split apart", "exp": "Dalton pictured each atom as one solid particle with no smaller parts, which is why his postulates came long before the electron was even known. Mostly empty space around a dense nucleus is Rutherford's picture, electrons stuck in a positive sphere is Thomson's plum pudding, and electrons on fixed rings is Bohr's."}, {"id": 2, "level": "Beginner", "tag": "History of Atomic Models", "stem": "In 1897 J. J. Thomson used a cathode ray tube and became the first scientist to:", "options": ["prove that atoms could not be divided", "discover the neutron inside the nucleus", "measure the energy of a bright line color", "discover the negatively charged electron"], "answer": "D", "answer_text": "discover the negatively charged electron", "exp": "Thomson's cathode ray bent toward a positive plate, showing that the beam was made of negatively charged particles, which we now call electrons. The neutron waited for Chadwick in 1932, and it was Dalton who claimed atoms could not be divided."}, {"id": 3, "level": "Beginner", "tag": "History of Atomic Models", "stem": "Rutherford's nuclear atom differs from Thomson's plum pudding model because Rutherford said the positive charge is:", "options": ["carried by the electrons themselves", "spread evenly throughout the atom", "packed into a tiny central nucleus", "found only on the outside surface"], "answer": "C", "answer_text": "packed into a tiny central nucleus", "exp": "Rutherford concluded that all of the positive charge sits in a tiny, dense nucleus at the center of a mostly empty atom. Thomson had pictured that charge spread evenly through the whole atom, and electrons carry the negative charge, so they cannot be the source of the positive charge."}, {"id": 4, "level": "Beginner", "tag": "History of Atomic Models", "stem": "Niels Bohr improved the model of the atom in 1913 by proposing that electrons:", "options": ["have no mass and no electric charge", "sit still on the surface of the nucleus", "are spread evenly through a positive ball", "travel in rings at set energy levels"], "answer": "D", "answer_text": "travel in rings at set energy levels", "exp": "Bohr placed the electrons on rings, and each ring is a specific energy level, which explains why an element gives off only certain colors of light. Electrons spread evenly through a positive ball is Thomson's older model, and electrons do carry a negative charge and a very small mass."}, {"id": 5, "level": "Beginner", "tag": "History of Atomic Models", "stem": "James Chadwick's 1932 discovery added which particle to the model of the atom?", "options": ["the nucleus", "the proton", "the neutron", "the electron"], "answer": "C", "answer_text": "the neutron", "exp": "Chadwick identified the neutron, the neutral nuclear particle that explains why helium was known to have 2 protons but a mass of 4. Thomson had already found the electron in 1897, the proton was known before 1932, and the nucleus that Rutherford found in 1911 is a region, not a particle."}, {"id": 6, "level": "Beginner", "tag": "History of Atomic Models", "stem": "Which list places these atomic models in the correct order, from earliest to most recent?", "options": ["Thomson, Dalton, Bohr, Rutherford", "Dalton, Thomson, Rutherford, Bohr", "Bohr, Rutherford, Thomson, Dalton", "Rutherford, Bohr, Dalton, Thomson"], "answer": "B", "answer_text": "Dalton, Thomson, Rutherford, Bohr", "exp": "Dalton published in 1803, Thomson in 1897, Rutherford in 1911, and Bohr in 1913, so the solid-particle atom comes first and the ringed atom comes last. Any order that puts Bohr or Rutherford ahead of Dalton reverses more than a century of work."}, {"id": 7, "level": "Beginner", "tag": "Evidence and Experiments", "stem": "In the gold foil experiment, most alpha particles went straight through but a few bounced back at sharp angles. This is evidence that the atom contains:", "options": ["electrons packed tightly on the outside", "a tiny dense positive core in the center", "a large positive region filling the atom", "equal amounts of matter everywhere in it"], "answer": "B", "answer_text": "a tiny dense positive core in the center", "exp": "Because almost every alpha particle passed through, the atom must be mostly empty space, and the rare sharp bounce means a few particles hit something small, heavy, and positive — the nucleus. A large positive region filling the atom would have deflected nearly every particle instead of just a few."}, {"id": 8, "level": "Beginner", "tag": "Evidence and Experiments", "stem": "In a cathode ray tube the beam bends away from a negative plate and toward a positive plate. This is evidence that the particles in the beam are:", "options": ["heavier than atoms", "positively charged", "negatively charged", "electrically neutral"], "answer": "C", "answer_text": "negatively charged", "exp": "Opposite charges attract, so a beam pulled toward the positive plate must itself carry negative charge — these are electrons. Positively charged particles would have been pushed away from that plate, and a neutral beam would not have bent at all."}, {"id": 9, "level": "Beginner", "tag": "Evidence and Experiments", "stem": "In the hula-hoop model of the gold foil experiment, the Styrofoam ball at the center stands for:", "options": ["the electron cloud of the atom", "the nucleus of the atom", "one incoming alpha particle", "the whole sheet of gold foil"], "answer": "B", "answer_text": "the nucleus of the atom", "exp": "The thrown ping pong balls act as the alpha particles, and the Styrofoam ball is the small, dense nucleus they can bounce off of. The hula hoop marks the outer edge of the atom where the electron cloud is, so balls that pass through the hoop show that the atom is mostly empty space."}, {"id": 10, "level": "Beginner", "tag": "Subatomic Particles", "stem": "Which list gives the correct charge of each subatomic particle?", "options": ["proton neutral, neutron positive, electron negative", "proton negative, neutron neutral, electron positive", "proton positive, neutron neutral, electron negative", "proton positive, neutron negative, electron neutral"], "answer": "C", "answer_text": "proton positive, neutron neutral, electron negative", "exp": "Protons carry the positive charge, neutrons carry no charge at all, and electrons carry the negative charge. Swapping the proton and electron signs is the most common slip, but the nucleus is the positive region of the atom, so the proton must be the positive one."}, {"id": 11, "level": "Beginner", "tag": "Subatomic Particles", "stem": "Where are the three subatomic particles located in an atom?", "options": ["protons and electrons in the nucleus, neutrons in the electron cloud", "protons and neutrons in the nucleus, electrons in the electron cloud", "protons in the nucleus, neutrons and electrons in the electron cloud", "protons and neutrons in the electron cloud, electrons in the nucleus"], "answer": "B", "answer_text": "protons and neutrons in the nucleus, electrons in the electron cloud", "exp": "An atom has two regions: the nucleus holds the protons and neutrons, and the electron cloud around it holds the electrons. Placing the electrons in the nucleus would leave the center with no net positive charge, which contradicts the gold foil results."}, {"id": 12, "level": "Beginner", "tag": "Subatomic Particles", "stem": "Compared with a proton, an electron has:", "options": ["almost no mass at all", "roughly twice the mass", "about the same mass", "exactly one half the mass"], "answer": "A", "answer_text": "almost no mass at all", "exp": "A proton and a neutron each count as about one atomic mass unit, while an electron's mass is so small that it is ignored when finding the mass number. That is why we say the mass of the atom is in the nucleus."}, {"id": 13, "level": "Beginner", "tag": "Subatomic Particles", "stem": "Two samples are made of atoms that have the same number of protons. This means the samples:", "options": ["must be the same element", "must have the same number of neutrons", "must have the same mass", "must be different elements"], "answer": "A", "answer_text": "must be the same element", "exp": "Protons are the particles that define the type of element, so an identical proton count always means the same element. It does not force the same mass or the same neutron count, because isotopes of one element differ in exactly that way."}, {"id": 14, "level": "Beginner", "tag": "Subatomic Particles", "stem": "In a neutral atom, the number of electrons is always equal to the number of:", "options": ["neutrons plus protons", "neutrons in the nucleus", "protons in the nucleus", "rings in the model"], "answer": "C", "answer_text": "protons in the nucleus", "exp": "In a neutral atom the positive charges equal the negative charges, so electrons = protons. Neutrons carry no charge, so neither the neutron count nor the total of protons plus neutrons has any effect on the charge balance."}, {"id": 15, "level": "Beginner", "tag": "Reading the Periodic Table", "stem": "On the periodic table, the top number in each element box is the atomic number. It tells you the number of:", "options": ["isotopes of the element", "protons in the atom", "rings in the atom", "neutrons in the atom"], "answer": "B", "answer_text": "protons in the atom", "exp": "The atomic number is defined as the number of protons, which is why it never changes for a given element. The neutron count is not printed on the table at all — you have to subtract the atomic number from a mass number to find it."}, {"id": 16, "level": "Beginner", "tag": "Reading the Periodic Table", "stem": "The bottom number in a periodic table box is a decimal, such as 35.45 for chlorine, because it is:", "options": ["the mass number of the most common atom", "an average mass of all of the isotopes", "a count of the neutrons in a single atom", "the total of the protons and the electrons"], "answer": "B", "answer_text": "an average mass of all of the isotopes", "exp": "Atomic mass is an average of the masses of all the isotopes of an element, weighted by percent abundance, and a weighted average rarely lands on a whole number. A mass number counts protons plus neutrons in one atom, so a mass number is always a whole number."}, {"id": 17, "level": "Beginner", "tag": "Reading the Periodic Table", "stem": "You need the number of protons in an atom of cobalt. Which piece of information from the periodic table box do you use?", "options": ["the atomic mass, 58.93", "the element symbol, Co", "the box position, period 4", "the atomic number, 27"], "answer": "D", "answer_text": "the atomic number, 27", "exp": "The atomic number 27 is the proton count, so every cobalt atom has exactly 27 protons. The atomic mass 58.93 is an average that already includes neutrons, so it cannot give the proton count by itself."}, {"id": 18, "level": "Beginner", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A carbon-14 atom has 6 protons. How many neutrons does it have?", "options": ["8", "6", "14", "20"], "answer": "A", "answer_text": "8", "exp": "Mass number = protons + neutrons, so neutrons = 14 − 6 = 8. Answering 14 just repeats the mass number, and 20 comes from adding 14 + 6 instead of subtracting."}, {"id": 19, "level": "Beginner", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "How many protons, neutrons, and electrons are in a neutral neon-21 atom? Neon's atomic number is 10.", "options": ["11 protons, 10 neutrons, 11 electrons", "10 protons, 11 neutrons, 10 electrons", "10 protons, 21 neutrons, 10 electrons", "10 protons, 11 neutrons, 11 electrons"], "answer": "B", "answer_text": "10 protons, 11 neutrons, 10 electrons", "exp": "The atomic number gives 10 protons, and neutrons = 21 − 10 = 11. The atom is neutral, so electrons equal protons at 10; a particle with 10 protons and 11 electrons would carry a 1− charge, and one with 11 protons is sodium, not neon."}, {"id": 20, "level": "Beginner", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A neutral atom has 17 protons and 20 neutrons. What is its mass number?", "options": ["17", "20", "37", "54"], "answer": "C", "answer_text": "37", "exp": "Mass number = protons + neutrons = 17 + 20 = 37, so this is a chlorine-37 atom. Electrons are never included, because their mass is far too small to matter, which is why 54 (adding the 17 electrons as well) is wrong."}, {"id": 21, "level": "Beginner", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "How many electrons are in a neutral iron-58 atom? Iron's atomic number is 26.", "options": ["32", "58", "84", "26"], "answer": "D", "answer_text": "26", "exp": "A neutral atom has equal numbers of protons and electrons, and the atomic number 26 gives both. The value 32 is the neutron count from 58 − 26, and 58 is the mass number rather than any single particle count."}, {"id": 22, "level": "Beginner", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "Aluminum has an atomic number of 13. Which row correctly describes a neutral aluminum-27 atom?", "options": ["13 protons, 14 neutrons, 10 electrons", "14 protons, 13 neutrons, 14 electrons", "13 protons, 27 neutrons, 13 electrons", "13 protons, 14 neutrons, 13 electrons"], "answer": "D", "answer_text": "13 protons, 14 neutrons, 13 electrons", "exp": "Neutrons = 27 − 13 = 14, and because the atom is neutral the electron count matches the 13 protons. The row with 10 electrons describes the aluminum ion with a net charge of 3+, not a neutral atom."}, {"id": 23, "level": "Beginner", "tag": "Isotopes", "stem": "Isotopes of the same element always have the same number of:", "options": ["electrons, but different protons", "protons, but different neutrons", "protons, and the same mass number", "neutrons, but different protons"], "answer": "B", "answer_text": "protons, but different neutrons", "exp": "Isotopes are atoms of the same element, so the proton count is locked in and only the neutron count changes. That changing neutron count is exactly what makes the mass numbers different, and if the proton count changed you would have a different element."}, {"id": 24, "level": "Beginner", "tag": "Isotopes", "stem": "Which pair of atoms are isotopes of each other?", "options": ["neon-20 and sodium-22", "carbon-12 and nitrogen-14", "carbon-12 and carbon-13", "lithium-7 and beryllium-9"], "answer": "C", "answer_text": "carbon-12 and carbon-13", "exp": "Both carbon atoms have 6 protons and differ only by one neutron, which is the definition of isotopes. Every other pair names two different elements, and different elements must have different numbers of protons."}, {"id": 25, "level": "Beginner", "tag": "Isotopes", "stem": "In the Eggium egg lab, every egg held 4 protons but the eggs held different numbers of neutrons. The eggs were models of:", "options": ["isotopes of one element", "atoms of four elements", "energy levels of an atom", "ions of one element"], "answer": "A", "answer_text": "isotopes of one element", "exp": "The proton count stayed at 4 in every egg, so all the eggs were the same element, and the changing neutron count produced Eggium-7, Eggium-8, and Eggium-9. Ions differ in electrons, not neutrons, so changing neutrons can never make an ion."}, {"id": 26, "level": "Beginner", "tag": "Isotopes", "stem": "Compared with a chlorine-35 atom, a chlorine-37 atom has:", "options": ["two fewer neutrons in the nucleus", "two more neutrons in the nucleus", "two more electrons in the cloud", "two more protons in the nucleus"], "answer": "B", "answer_text": "two more neutrons in the nucleus", "exp": "Both atoms are chlorine, so both hold 17 protons; the mass number rises from 35 to 37 because the neutrons go from 18 to 20. Adding protons would change the element, and adding electrons would make an ion rather than an isotope."}, {"id": 27, "level": "Beginner", "tag": "Isotope Notation", "stem": "In the isotope notation ₆¹⁴C, the 14 written at the upper left is the:", "options": ["neutron count", "net charge", "mass number", "atomic number"], "answer": "C", "answer_text": "mass number", "exp": "The upper left number is the mass number, protons plus neutrons, so this carbon atom holds 14 − 6 = 8 neutrons. The lower left 6 is the atomic number, and because no right superscript is shown the net charge is zero."}, {"id": 28, "level": "Beginner", "tag": "Isotope Notation", "stem": "Which isotope notation represents a magnesium-24 ion that has 12 protons and 10 electrons?", "options": ["₁₀²⁴Mg²⁺", "₁₂²⁴Mg²⁻", "₁₂²⁴Mg²⁺", "₂₄¹²Mg²⁺"], "answer": "C", "answer_text": "₁₂²⁴Mg²⁺", "exp": "The atomic number 12 goes at the lower left, the mass number 24 at the upper left, and the charge at the upper right written number-then-sign. With 12 protons and only 10 electrons the ion is short two negative charges, so the net charge is 2+ and not 2−."}, {"id": 29, "level": "Beginner", "tag": "Isotope Notation", "stem": "The notation ₃₅⁸⁰Br describes an atom with how many neutrons?", "options": ["80", "35", "115", "45"], "answer": "D", "answer_text": "45", "exp": "The lower left 35 is the atomic number, or proton count, and the upper left 80 is the mass number, so neutrons = 80 − 35 = 45. The value 115 comes from adding the two numbers instead of subtracting them."}, {"id": 30, "level": "Beginner", "tag": "Ions: Cations and Anions", "stem": "An atom that has gained or lost electrons so that it carries a net charge is called:", "options": ["a nucleus", "an isotope", "an ion", "an orbital"], "answer": "C", "answer_text": "an ion", "exp": "An atom with a net charge is called an ion, and it forms when electrons are added to or removed from the atom. Isotopes differ in neutrons and still carry no net charge, so changing the neutron count never produces an ion."}, {"id": 31, "level": "Beginner", "tag": "Ions: Cations and Anions", "stem": "A CATION forms when an atom:", "options": ["loses one or more protons", "gains one or more electrons", "gains one or more neutrons", "loses one or more electrons"], "answer": "D", "answer_text": "loses one or more electrons", "exp": "Removing negative electrons leaves more protons than electrons, so the net charge comes out positive — that is a CATION. Gaining electrons gives more negative charges than positive ones and makes an ANION instead."}, {"id": 32, "level": "Beginner", "tag": "Ions: Cations and Anions", "stem": "A sulfur atom gains 2 electrons. The particle that forms is:", "options": ["an ANION with a 2+ charge", "an ANION with a 2− charge", "a CATION with a 2+ charge", "a new element with 2 protons"], "answer": "B", "answer_text": "an ANION with a 2− charge", "exp": "Two extra electrons mean two more negative charges than positive charges, so the net charge is 2− and the particle is an ANION. Gaining electrons can never make the charge positive, and the proton count is untouched, so the particle is still sulfur."}, {"id": 33, "level": "Beginner", "tag": "Ions: Cations and Anions", "stem": "A sodium atom loses one electron to become a sodium ion. The identity of the particle:", "options": ["stays sodium, because electrons were added", "changes, because the net charge is now 1+", "changes, because the mass number went down by one", "stays sodium, because protons did not change"], "answer": "D", "answer_text": "stays sodium, because protons did not change", "exp": "Only the proton count decides the element, and losing an electron leaves all 11 protons in place, so the particle is still sodium. The mass number does not drop either, since electrons have almost no mass and are not counted in it."}, {"id": 34, "level": "Beginner", "tag": "Average Atomic Mass", "stem": "The average atomic mass of an element is best described as:", "options": ["the total mass of all of its isotopes added", "the mass of one proton plus one neutron", "an average of the masses of its isotopes", "the mass number of its most common isotope"], "answer": "C", "answer_text": "an average of the masses of its isotopes", "exp": "Atomic mass is an average of the masses of all the isotopes of an element, with each isotope counted in proportion to its percent abundance. Simply totaling all of the isotope masses ignores abundance and gives a number far too large."}, {"id": 35, "level": "Beginner", "tag": "Average Atomic Mass", "stem": "In step 1 of an average atomic mass calculation, a percent abundance of 20.0% is changed to a decimal. That decimal is:", "options": ["20.0", "0.0200", "0.200", "2.00"], "answer": "C", "answer_text": "0.200", "exp": "Step 1 says to change the percent abundance to a decimal by dividing by 100%, so 20.0% ÷ 100% = 0.200. Shifting the decimal only one place gives 2.00, which would mean 200% of the sample and would make the average far too large."}, {"id": 36, "level": "Beginner", "tag": "Average Atomic Mass", "stem": "An element has only two isotopes, with mass numbers 52 and 53. Using mass numbers in the weighted-average calculation, its average atomic mass must be:", "options": ["between the two mass numbers", "below both mass numbers, under 52", "above both mass numbers, over 53", "equal to 105, the two masses added"], "answer": "A", "answer_text": "between the two mass numbers", "exp": "A weighted average always lands between the smallest and the largest value being averaged, so the result has to fall between 52 and 53 — a quick way to check yourself. Adding the two mass numbers to get 105 is not an average at all, and no mixture of the two can push the result outside that range."}, {"id": 37, "level": "Beginner", "tag": "Average Atomic Mass", "stem": "Copper has two isotopes, copper-63 and copper-65, and an average atomic mass of 63.55. This tells you that:", "options": ["the two isotopes are equally abundant", "copper-65 is the more abundant isotope", "copper-63 is the more abundant isotope", "copper atoms have 63.55 neutrons each"], "answer": "C", "answer_text": "copper-63 is the more abundant isotope", "exp": "The average 63.55 sits much closer to 63 than to 65, so most copper atoms have to be copper-63. Equal abundances would put the average halfway between the two, near 64, and no atom can hold a fractional number of neutrons."}, {"id": 38, "level": "Beginner", "tag": "Bohr Models and Energy Levels", "stem": "When you draw a Bohr model, how many electrons can go in the first ring?", "options": ["2", "8", "10", "1"], "answer": "A", "answer_text": "2", "exp": "Two electrons can go in the first ring, and up to 8 can go in the second ring. The number 8 is the capacity of the second ring, so using it first would crowd too many electrons closest to the nucleus."}, {"id": 39, "level": "Beginner", "tag": "Bohr Models and Energy Levels", "stem": "A neutral nitrogen atom has 7 electrons. Which Bohr model arrangement is correct?", "options": ["2 in the first ring, 5 in the second", "7 in the first ring, 0 in the second", "5 in the first ring, 2 in the second", "2 in the first ring, 8 in the second"], "answer": "A", "answer_text": "2 in the first ring, 5 in the second", "exp": "The first ring fills with 2 electrons, leaving 7 − 2 = 5 for the second ring, which can hold up to 8. Placing all 7 in the first ring overfills it, and 2 plus 8 accounts for 10 electrons instead of the 7 that nitrogen has."}, {"id": 40, "level": "Beginner", "tag": "Bohr Models and Energy Levels", "stem": "Why do we still draw Bohr models even though the Quantum Mechanical Model is the current model of the atom?", "options": ["the Quantum Mechanical Model was proven wrong", "Bohr's model shows the exact electron paths", "the Bohr model is easier to draw and explain", "the Bohr model shows orbital shapes correctly"], "answer": "C", "answer_text": "the Bohr model is easier to draw and explain", "exp": "The Quantum Mechanical Model is the current model but is incredibly difficult to draw, so the Bohr model is used to explain basic atom concepts. The quantum model was never proven wrong, and the s, p, and d orbital shapes come from it rather than from Bohr's rings."}, {"id": 41, "level": "Beginner", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "All light travels through the vacuum of space at a speed of:", "options": ["1.00 × 10⁻⁹ m/s", "3.00 × 10⁻⁸ m/s", "6.626 × 10⁻³⁴ m/s", "3.00 × 10⁸ m/s"], "answer": "D", "answer_text": "3.00 × 10⁸ m/s", "exp": "The speed of light in a vacuum is c = 3.00 × 10⁸ m/s, the value used in f = c/λ. The number 6.626 × 10⁻³⁴ is Planck's constant in J·s and is not a speed, and 10⁻⁹ is the number of meters in one nanometer."}, {"id": 42, "level": "Beginner", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "As the wavelength of light gets longer, its frequency:", "options": ["stays the same", "gets larger", "gets smaller", "becomes zero"], "answer": "C", "answer_text": "gets smaller", "exp": "Frequency is f = c/λ, and c is fixed at 3.00 × 10⁸ m/s, so a larger wavelength in the denominator gives a smaller frequency. The two are inversely related, which is why radio waves have enormous wavelengths and low frequencies."}, {"id": 43, "level": "Beginner", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "Which of these carries the MOST energy per wave?", "options": ["visible light", "ultraviolet light", "gamma rays", "radio waves"], "answer": "C", "answer_text": "gamma rays", "exp": "Energy is E = hf, so the wave with the highest frequency carries the most energy, and gamma rays sit at the high frequency end of the electromagnetic spectrum. Radio waves have the lowest frequency of the four listed and therefore the least energy."}, {"id": 44, "level": "Beginner", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "One of the hydrogen lines has a wavelength of 656 nm. Using 1 nm = 10⁻⁹ m, this wavelength in meters is:", "options": ["6.56 × 10⁻⁷ m", "6.56 × 10⁻⁵ m", "6.56 × 10⁻¹¹ m", "6.56 × 10⁹ m"], "answer": "A", "answer_text": "6.56 × 10⁻⁷ m", "exp": "Since 1 nm = 10⁻⁹ m, the conversion is 656 nm × 10⁻⁹ m/nm = 6.56 × 10⁻⁷ m, with the nm units cancelling. Multiplying by 10⁹ instead gives 6.56 × 10⁹ m, a wavelength longer than any radio wave."}, {"id": 45, "level": "Beginner", "tag": "Emission Spectra and Flame Tests", "stem": "An emission spectrum can be used to identify an element because:", "options": ["each element has its own pattern of lines", "the lines show how many neutrons there are", "every element gives the same set of lines", "all elements glow the same shade of red"], "answer": "A", "answer_text": "each element has its own pattern of lines", "exp": "Since each element has its own unique emission spectrum, its pattern of bright lines works like a fingerprint. Those lines come from electrons moving between energy levels, so they reveal nothing at all about the neutron count."}, {"id": 46, "level": "Beginner", "tag": "Emission Spectra and Flame Tests", "stem": "When you compare a Known spectrum with an Unknown spectrum, a match can be claimed only when:", "options": ["at least one Known line appears in the Unknown too", "both spectra show a faint rainbow of all colors", "every line from the Known appears in the Unknown", "the Unknown shows fewer bright lines than the Known"], "answer": "C", "answer_text": "every line from the Known appears in the Unknown", "exp": "All of the lines from the Known must be present in the Unknown for a match to be made, since a single shared line could easily be a coincidence. The Unknown may still show extra lines from other elements, which is how the Vermeer white paint was shown to hold lead plus silver and antimony."}, {"id": 47, "level": "Beginner", "tag": "Emission Spectra and Flame Tests", "stem": "In the flame test lab, Sample 1 burned with a red flame. Using the flame color chart, the best conclusion is that Sample 1:", "options": ["contains no metal atoms of any kind at all", "could contain lithium, strontium, or mercury", "must contain lithium and nothing else at all", "must contain barium, since barium burns red"], "answer": "B", "answer_text": "could contain lithium, strontium, or mercury", "exp": "Lithium, strontium, and mercury (I) all give a red flame, so more than one element may show the same color and the test cannot narrow Sample A down to a single metal. Barium burns green, so a red flame rules barium out rather than pointing to it."}, {"id": 48, "level": "Beginner", "tag": "Orbitals and the Quantum Model", "stem": "In the Quantum Mechanical Model, an electron orbital is best described as:", "options": ["a solid shell that traps the electrons inside", "the ring drawn in a Bohr model diagram", "the exact circular path of an electron", "the area electrons occupy 95% of the time"], "answer": "D", "answer_text": "the area electrons occupy 95% of the time", "exp": "An electron orbital describes the area that a set of electrons can be found in 95% of the time, so it is a region of probability and not a path. Heisenberg's Uncertainty Principle states that it is impossible to know both the energy and the position of an electron, which rules out any exact circular path."}, {"id": 49, "level": "Intermediate", "tag": "History of Atomic Models", "stem": "One model of the atom shows positive material spread through the whole sphere with electrons stuck in it like raisins in dough. A newer model packs all of that positive charge into a tiny center with electrons in the space around it. Which piece of evidence forced the change from the older model to the newer one?", "options": ["Cathode rays inside a sealed glass tube bent toward the positively charged metal plate", "Each element gave off only a few specific colors of light in its own emission spectrum", "Two elements always combined with each other in the same whole-number mass ratios", "A few positively charged alpha particles bounced back off a thin sheet of gold foil"], "answer": "D", "answer_text": "A few positively charged alpha particles bounced back off a thin sheet of gold foil", "exp": "Bouncing alpha particles back can only happen if the positive charge is concentrated in a tiny, dense center, which is what Rutherford concluded in 1911. The bending of cathode rays discovered the electron but said nothing about a nucleus, and fixed mass ratios only supported Dalton's much earlier indivisible-sphere picture."}, {"id": 50, "level": "Intermediate", "tag": "History of Atomic Models", "stem": "Van Meegeren painted his suspected forgery in the 1930s. Which list places the models of the atom in the order they were accepted, starting with the earliest and ending with the model that was current while he painted?", "options": ["plum pudding, indivisible sphere, energy levels, nuclear atom, quantum mechanical", "indivisible sphere, plum pudding, nuclear atom, energy levels, quantum mechanical", "indivisible sphere, nuclear atom, plum pudding, quantum mechanical, energy levels", "nuclear atom, plum pudding, indivisible sphere, quantum mechanical, energy levels"], "answer": "B", "answer_text": "indivisible sphere, plum pudding, nuclear atom, energy levels, quantum mechanical", "exp": "The dates run Dalton 1803 (indivisible sphere), Thomson 1897 (plum pudding), Rutherford 1911 (nuclear atom), Bohr 1913 (energy levels), then the quantum mechanical model of the 1920s. Any list that puts the nuclear atom before plum pudding reverses Thomson and Rutherford, and putting plum pudding first ignores Dalton entirely."}, {"id": 51, "level": "Intermediate", "tag": "History of Atomic Models", "stem": "Dalton stated in 1803 that all atoms of a given element are identical, including their masses. Which later discovery showed that this postulate had to be revised, and why?", "options": ["Spectra, because atoms of one element release different colors of light at once", "Isotopes, because atoms of one element can hold different numbers of neutrons", "Ions, because atoms of one element can gain or lose protons and change mass", "Orbitals, because atoms of one element take up different volumes as they move"], "answer": "B", "answer_text": "Isotopes, because atoms of one element can hold different numbers of neutrons", "exp": "Chlorine-35 and chlorine-37 are both chlorine, both with 17 protons, yet their masses differ by 2 neutrons, so identical mass fails. Ions differ in electrons and never in protons, and neither the size of the electron cloud nor the set of emission lines has anything to do with the mass of the atom."}, {"id": 52, "level": "Intermediate", "tag": "History of Atomic Models", "stem": "Your notes say that the quantum mechanical model is the current model of the atom but is incredibly difficult to draw, so the Bohr model is used to explain basic ideas. Which statement best explains why the Bohr model is still worth using?", "options": ["It counts the neutrons in the nucleus, which the quantum mechanical model hides away", "It replaces the nucleus with a spread-out positive pudding that is easy to sketch quickly", "Electrons sit in fixed energy levels, which explains why an element emits set colors", "It shows the exact position and the exact energy of every electron at the same moment"], "answer": "C", "answer_text": "Electrons sit in fixed energy levels, which explains why an element emits set colors", "exp": "Bright lines exist because electrons can only sit at certain energy levels, and rings on a Bohr drawing show that idea clearly. Knowing both position and energy at once is exactly what Heisenberg's Uncertainty Principle forbids, and no model of the atom hides the neutrons or brings back the plum pudding."}, {"id": 53, "level": "Intermediate", "tag": "History of Atomic Models", "stem": "Helium was known to have 2 protons but a mass of 4 atomic mass units, a gap chemists could not explain until 1932. How did Chadwick's discovery close the gap?", "options": ["The 2 missing mass units come from the 2 energy levels that hold the electrons", "The 2 missing mass units come from 2 neutrons sitting in the nucleus", "The 2 missing mass units come from 2 extra electrons sitting in the nucleus", "The 2 missing mass units come from 2 extra protons hidden in the electron cloud"], "answer": "B", "answer_text": "The 2 missing mass units come from 2 neutrons sitting in the nucleus", "exp": "A neutron carries about 1 atomic mass unit and no charge, so 2 protons plus 2 neutrons give a mass of 4 while the charge stays 2+. Extra protons would change helium into a different element, and electrons and energy levels contribute almost no mass at all."}, {"id": 54, "level": "Intermediate", "tag": "Evidence and Experiments", "stem": "In the hula-hoop model of Rutherford's experiment, a group throws 250 ping pong balls at the model. Three of them hit the Styrofoam ball and bounce back, and the other 247 pass through or beside the hoop. What percent bounced back, and what does that tell you about the atom?", "options": ["12% bounced back, so the nucleus takes up most of the volume inside of the atom", "1.2% bounced back, so the nucleus is spread evenly through the atom's whole volume", "98.8% bounced back, so the nucleus and the electron cloud are about the same size", "1.2% bounced back, so the nucleus takes up a very small part of the atom's volume"], "answer": "D", "answer_text": "1.2% bounced back, so the nucleus takes up a very small part of the atom's volume", "exp": "3 ÷ 250 = 0.012, and 0.012 × 100% = 1.2%, so almost everything sails through untouched. Reading 0.012 as 12% moves the decimal two places the wrong way, and 98.8% is the percent that missed, which would wrongly suggest a huge nucleus."}, {"id": 55, "level": "Intermediate", "tag": "Evidence and Experiments", "stem": "In the cathode ray tube simulation the beam always bends toward the positively charged plate, and it does this no matter which gas is sealed inside the tube. Which pair of conclusions does this evidence support?", "options": ["The rays carry negative charge, and the same particle is present in every element", "The rays carry no charge at all, and the particle is found only in metal elements", "The rays carry negative charge, and the particle has more mass than the whole atom", "The rays carry positive charge, and a different particle is present in every element"], "answer": "A", "answer_text": "The rays carry negative charge, and the same particle is present in every element", "exp": "Bending toward the positive plate means the ray itself must be negative, since opposite charges attract. Getting the same particle from every gas shows electrons are in all elements, and Thomson also showed the particle has almost no mass compared with the atom."}, {"id": 56, "level": "Intermediate", "tag": "Evidence and Experiments", "stem": "The white paint from the known Vermeer gives bright lines for lead, silver, and antimony. The white paint from the possible forgery gives bright lines for lead only. Using the rule that all of the lines from the known must be present in the unknown for a match, what is the correct conclusion?", "options": ["The paints do match, because the lead lines show up in both of the samples", "No conclusion is possible, because spectra cannot identify metals in paint", "The paints do match, because extra lines are always allowed within a match", "The paints do not match, because the silver and antimony lines are missing"], "answer": "D", "answer_text": "The paints do not match, because the silver and antimony lines are missing", "exp": "A match requires every line of the known sample to appear in the unknown, and two whole sets of lines are absent from the forgery's paint. Sharing the lead lines is not enough, and since every element has its own unique emission spectrum, spectra identify metals very well."}, {"id": 57, "level": "Intermediate", "tag": "Subatomic Particles", "stem": "A proton and a neutron are each counted as one atomic mass unit, while an electron has almost no mass. A neutral atom of lead-208 has 82 protons, 126 neutrons, and 82 electrons. Where is the mass of this atom, and how much of it is there?", "options": ["Almost all of it is in the electron cloud, which holds 82 atomic mass units", "Almost all of it is in the nucleus, which holds 208 atomic mass units", "Almost all of it is in the nucleus, which holds 290 atomic mass units", "It is shared evenly, with 145 atomic mass units in each of the two regions"], "answer": "B", "answer_text": "Almost all of it is in the nucleus, which holds 208 atomic mass units", "exp": "Only protons and neutrons carry mass, so 82 + 126 = 208 atomic mass units, all of it inside the nucleus. The value 290 comes from adding the 82 electrons as well, and the electron cloud holds nearly no mass even though it fills almost all of the volume."}, {"id": 58, "level": "Intermediate", "tag": "Subatomic Particles", "stem": "A student adds two electrons to an atom of copper and says, \"Now I have made a brand new element.\" What is wrong with this claim?", "options": ["Electrons define the element, so removing them instead would keep it copper", "Nothing is wrong, because the mass number rises when the electrons are added", "Neutrons define the element, so adding electrons makes an isotope of copper", "Protons define the element, so adding electrons makes an ion of copper"], "answer": "D", "answer_text": "Protons define the element, so adding electrons makes an ion of copper", "exp": "All atoms with 29 protons are copper, and gaining or losing electrons only changes the net charge, never the identity. Isotopes are made by changing neutrons, and electrons carry almost no mass, so the mass number does not move at all."}, {"id": 59, "level": "Intermediate", "tag": "Subatomic Particles", "stem": "A neutral atom of iron-56 has 26 protons. Counting protons, neutrons, and electrons together, how many subatomic particles does the atom contain, and how many of those sit in the nucleus?", "options": ["112 particles in all, and 82 of them sit inside the nucleus", "82 particles in all, and 56 of them sit inside the nucleus", "82 particles in all, and 26 of them sit inside the nucleus", "56 particles in all, and 26 of them sit inside the nucleus"], "answer": "B", "answer_text": "82 particles in all, and 56 of them sit inside the nucleus", "exp": "Neutrons = 56 − 26 = 30, and a neutral atom has 26 electrons, so 26 + 30 + 26 = 82 particles in all. The nucleus holds only the protons and neutrons, 26 + 30 = 56 of them, so answers naming 26 in the nucleus are counting protons alone."}, {"id": 60, "level": "Intermediate", "tag": "Reading the Periodic Table", "stem": "A box on the periodic table shows the number 29 above the symbol Cu and the number 63.55 below it. Which reading of that box is correct?", "options": ["29 is the atomic number, the protons; 63.55 is the average atomic mass", "29 is the number of neutrons; 63.55 is the mass number of one Cu atom", "29 is the mass number of copper; 63.55 is the number of neutrons in it", "29 is the average atomic mass; 63.55 is the number of protons in copper"], "answer": "A", "answer_text": "29 is the atomic number, the protons; 63.55 is the average atomic mass", "exp": "The top number in every box is the atomic number, which is the number of protons that defines the element, and the bottom number is the average atomic mass. Neutrons are never printed in the box, and no single copper atom has a mass number of 63.55 because mass numbers are whole numbers."}, {"id": 61, "level": "Intermediate", "tag": "Reading the Periodic Table", "stem": "The periodic table lists the bottom number for lead as 207.2, but the mass number of any one lead atom is a whole number such as 206 or 208. Why is the table's value a decimal?", "options": ["It is an average of the isotope masses weighted by their percent abundance", "It is the number of protons in one lead atom, rounded off to one decimal", "It counts the protons plus the neutrons plus the electrons all added up", "It includes the tiny extra mass of every electron out in the electron cloud"], "answer": "A", "answer_text": "It is an average of the isotope masses weighted by their percent abundance", "exp": "Lead has four stable isotopes, and the table reports the average atomic mass of that natural mixture, which lands between 204 and 208 rather than on a whole number. Electrons contribute almost no mass, and the number of protons in lead is exactly 82, not 207.2."}, {"id": 62, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "The lead in Vermeer's white paint includes the isotope ₈₂²⁰⁶Pb. How many protons, neutrons, and electrons are in one neutral atom of this isotope?", "options": ["124 protons, 82 neutrons, and 124 electrons", "206 protons, 124 neutrons, and 206 electrons", "82 protons, 124 neutrons, and 82 electrons", "82 protons, 206 neutrons, and 82 electrons"], "answer": "C", "answer_text": "82 protons, 124 neutrons, and 82 electrons", "exp": "The subscript 82 is the atomic number, so there are 82 protons and, in a neutral atom, 82 electrons. Neutrons = mass number − protons = 206 − 82 = 124; using 206 as the neutron count forgets to subtract the protons out of the mass number."}, {"id": 63, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A chip of modern white paint contains the ion ₁₃²⁷Al³⁺. How many protons, neutrons, and electrons does this ion have?", "options": ["13 protons, 27 neutrons, and 10 electrons", "13 protons, 14 neutrons, and 16 electrons", "13 protons, 14 neutrons, and 10 electrons", "10 protons, 14 neutrons, and 13 electrons"], "answer": "C", "answer_text": "13 protons, 14 neutrons, and 10 electrons", "exp": "Protons = 13 from the subscript and neutrons = 27 − 13 = 14. A 3+ net charge means three more protons than electrons, so electrons = 13 − 3 = 10; answering 16 electrons adds the three instead of subtracting them."}, {"id": 64, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A particle has 34 neutrons, a mass number of 63, and a net charge of 2+. How many protons and electrons does it have?", "options": ["29 protons and 27 electrons", "29 protons and 31 electrons", "34 protons and 32 electrons", "63 protons and 61 electrons"], "answer": "A", "answer_text": "29 protons and 27 electrons", "exp": "Protons = mass number − neutrons = 63 − 34 = 29, which makes this a copper particle. A 2+ charge means two electrons were lost, so 29 − 2 = 27 electrons; 31 electrons would give a net charge of 2− instead."}, {"id": 65, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "Which set of particle counts belongs to ₁₇³⁷Cl¹⁻?", "options": ["17 protons, 20 neutrons, and 18 electrons", "17 protons, 37 neutrons, and 18 electrons", "17 protons, 20 neutrons, and 16 electrons", "18 protons, 19 neutrons, and 17 electrons"], "answer": "A", "answer_text": "17 protons, 20 neutrons, and 18 electrons", "exp": "Chlorine's atomic number is 17, so there are 17 protons, and neutrons = 37 − 17 = 20. The 1− net charge means one extra electron, 17 + 1 = 18; taking one away gives 16 electrons and would produce a 1+ charge."}, {"id": 66, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A neutral atom of the metal used in a blue pigment has 27 protons and 32 neutrons. What is its mass number, and what is the isotope called?", "options": ["Mass number 32, so the atom is cobalt-32", "Mass number 59, so the atom is cobalt-59", "Mass number 54, so the atom is cobalt-54", "Mass number 86, so the atom is cobalt-86"], "answer": "B", "answer_text": "Mass number 59, so the atom is cobalt-59", "exp": "Mass number = protons + neutrons = 27 + 32 = 59, and 27 protons identify the element as cobalt. The value 86 comes from also adding the 27 electrons, but electrons have almost no mass and never belong in a mass number."}, {"id": 67, "level": "Intermediate", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A strontium-88 particle is found to contain 36 electrons. Strontium has an atomic number of 38. How many protons and neutrons does the particle have, and what is its net charge?", "options": ["38 protons, 50 neutrons, and a net charge of 2−", "38 protons, 88 neutrons, and a net charge of 2−", "38 protons, 50 neutrons, and a net charge of 2+", "36 protons, 52 neutrons, and a net charge of 2+"], "answer": "C", "answer_text": "38 protons, 50 neutrons, and a net charge of 2+", "exp": "Protons stay at 38 because that is what makes it strontium, and neutrons = 88 − 38 = 50. With 38 protons and only 36 electrons the positives win by two, giving a net charge of 2+, not 2−."}, {"id": 68, "level": "Intermediate", "tag": "Isotopes", "stem": "In the Eggium lab every egg held 4 protons. Egg 2 held 4 protons and 5 neutrons, while Egg 3 held 4 protons and 3 neutrons. Which statement describes the two eggs?", "options": ["They are ions of Eggium with net charges of 5+ and 3+", "They are two different elements with mass numbers of 9 and 7", "They are isotopes of Eggium with mass numbers of 5 and 3", "They are isotopes of Eggium with mass numbers of 9 and 7"], "answer": "D", "answer_text": "They are isotopes of Eggium with mass numbers of 9 and 7", "exp": "Same protons and different neutrons is the definition of isotopes, and mass number = protons + neutrons gives 4 + 5 = 9 and 4 + 3 = 7. The mass numbers 5 and 3 are just the neutron counts, and ions are made by changing electrons, not neutrons."}, {"id": 69, "level": "Intermediate", "tag": "Isotopes", "stem": "A sample of table salt contains both chlorine-35 and chlorine-37. Which statement is true of both isotopes at once?", "options": ["Each one has 18 electrons, and the two differ by 2 protons", "Each one has 17 protons, and the two differ by 2 neutrons", "Each one has 35 protons, and the two differ by 2 electrons", "Each one has 17 neutrons, and the two differ by 2 protons"], "answer": "B", "answer_text": "Each one has 17 protons, and the two differ by 2 neutrons", "exp": "Chlorine is defined by its 17 protons, so neutrons = 35 − 17 = 18 and 37 − 17 = 20, a difference of 2 neutrons. Any answer that lets the protons differ describes two different elements, and neutral chlorine atoms have 17 electrons, not 18."}, {"id": 70, "level": "Intermediate", "tag": "Isotopes", "stem": "Pb-204 and Pb-208 are both stable isotopes of lead, which has an atomic number of 82. How do their neutron counts compare?", "options": ["Pb-208 has 208 neutrons, which is 4 more than Pb-204 has", "Pb-208 has 122 neutrons, which is 4 fewer than Pb-204 has", "Pb-208 has 82 neutrons, the same number that Pb-204 has", "Pb-208 has 126 neutrons, which is 4 more than Pb-204 has"], "answer": "D", "answer_text": "Pb-208 has 126 neutrons, which is 4 more than Pb-204 has", "exp": "Neutrons = mass number − 82, so Pb-208 has 208 − 82 = 126 and Pb-204 has 204 − 82 = 122, a gap of 4 neutrons. Using 208 as the neutron count skips the subtraction, and 82 is the proton count that both isotopes share."}, {"id": 71, "level": "Intermediate", "tag": "Isotopes", "stem": "Lead ore from Europe and lead ore from North America have different percent abundances of Pb-204, Pb-206, Pb-207, and Pb-208. Why does this difference let an investigator tell where a paint's lead was mined?", "options": ["Different abundance mixtures produce different average atomic masses", "Different mines produce lead atoms with different numbers of protons", "Different abundance mixtures give lead a different atomic number each", "Different mines produce lead atoms with different numbers of electrons"], "answer": "A", "answer_text": "Different abundance mixtures produce different average atomic masses", "exp": "The average atomic mass is a weighted average, so shifting the percent abundances shifts the average even though every atom is still lead. Every lead atom everywhere has 82 protons, so neither the proton count nor the atomic number can vary from mine to mine."}, {"id": 72, "level": "Intermediate", "tag": "Isotope Notation", "stem": "A calcium-44 ion has 20 protons, 24 neutrons, and 18 electrons. Which isotope notation is written correctly for it?", "options": ["₂₀⁴⁴Ca²⁻", "₂₀²⁴Ca²⁺", "₂₄⁴⁴Ca²⁺", "₂₀⁴⁴Ca²⁺"], "answer": "D", "answer_text": "₂₀⁴⁴Ca²⁺", "exp": "The subscript is the atomic number 20 and the superscript is the mass number 20 + 24 = 44. Two more protons than electrons is a 2+ net charge, so writing 2− flips the sign, and putting 24 in either position swaps the neutron count in for a number it is not."}, {"id": 73, "level": "Intermediate", "tag": "Isotope Notation", "stem": "A sample card reads \"Phosphorus-31 ion\" and the ion is found to have 18 electrons. Phosphorus has an atomic number of 15. Which isotope notation belongs on the card?", "options": ["₁₅¹⁶P³⁻", "₁₅³¹P³⁺", "₁₈³¹P³⁻", "₁₅³¹P³⁻"], "answer": "D", "answer_text": "₁₅³¹P³⁻", "exp": "The subscript must be 15 and the superscript must be the mass number 31 from the name. With 18 electrons against 15 protons the negatives win by three, so the charge is 3−; a 3+ charge would require only 12 electrons."}, {"id": 74, "level": "Intermediate", "tag": "Isotope Notation", "stem": "Which isotope notation describes a neutral atom that has 29 protons and 34 neutrons?", "options": ["₂₉³⁴Cu", "₂₉⁶³Cu²⁺", "₂₉⁶³Cu", "₃₄⁶³Cu"], "answer": "C", "answer_text": "₂₉⁶³Cu", "exp": "The atomic number 29 is the subscript and the mass number 29 + 34 = 63 is the superscript. Writing 34 as the superscript reports neutrons instead of the mass number, and adding a 2+ charge would describe an ion rather than the neutral atom asked for."}, {"id": 75, "level": "Intermediate", "tag": "Isotope Notation", "stem": "A data sheet lists the particle ₃₈⁸⁸Sr²⁺. Which number tells you the element is strontium, and how many electrons does the particle have?", "options": ["The superscript 88, and the particle holds 36 electrons", "The subscript 38, and the particle holds 40 electrons", "The superscript 88, and the particle holds 88 electrons", "The subscript 38, and the particle holds 36 electrons"], "answer": "D", "answer_text": "The subscript 38, and the particle holds 36 electrons", "exp": "The subscript is the atomic number, and only the proton count identifies an element; the superscript 88 is the mass number, which changes from isotope to isotope. A 2+ charge means two electrons were lost, so 38 − 2 = 36 electrons, while 40 would give a 2− charge."}, {"id": 76, "level": "Intermediate", "tag": "Ions: Cations and Anions", "stem": "A sodium-22 particle contains 11 protons, 11 neutrons, and 10 electrons. What is this particle called, and what is its net charge?", "options": ["An ANION, because it lost one electron, with a net charge of 1−", "An ANION, because it gained one electron, with a net charge of 1−", "A neutral atom, because the protons and neutrons match at a charge of 0", "A CATION, because it lost one electron, with a net charge of 1+"], "answer": "D", "answer_text": "A CATION, because it lost one electron, with a net charge of 1+", "exp": "Net charge = protons − electrons = 11 − 10 = 1+, and a positive ion is a CATION. Calling it an ANION would require more electrons than protons, and neutrons are neutral, so they never enter the charge calculation at all."}, {"id": 77, "level": "Intermediate", "tag": "Ions: Cations and Anions", "stem": "An atom of fluorine-18, which has 9 protons and 9 electrons, gains one electron. What are the new counts, and what is the particle now called?", "options": ["10 protons and 9 electrons, an ANION with a net charge of 1−", "9 protons and 10 electrons, an ANION with a net charge of 1−", "9 protons and 8 electrons, a CATION with a net charge of 1+", "9 protons and 10 electrons, a CATION with a net charge of 1+"], "answer": "B", "answer_text": "9 protons and 10 electrons, an ANION with a net charge of 1−", "exp": "Gaining an electron leaves the 9 protons alone and raises the electrons to 10, so net charge = 9 − 10 = 1− and the particle is an ANION. Changing the proton count to 10 would turn the fluorine into neon, and a negative particle is never a CATION."}, {"id": 78, "level": "Intermediate", "tag": "Ions: Cations and Anions", "stem": "Boron has an atomic number of 5. The ion ₅¹⁰B³⁺ appears in a spectra reference table. How many electrons does this ion have, and why does boron form it?", "options": ["8 electrons, because it gained 3 to leave a full first ring of electrons", "2 electrons, because it lost 3 to leave a full first ring of electrons", "3 electrons, because the 3+ charge tells you how many electrons remain", "5 electrons, because the 3+ charge counts protons rather than electrons"], "answer": "B", "answer_text": "2 electrons, because it lost 3 to leave a full first ring of electrons", "exp": "A 3+ net charge means three electrons were removed, so 5 − 3 = 2 electrons, exactly the number that fills the first ring. Gaining electrons would make a negative ion, and protons never move when an ion forms because that would change the element."}, {"id": 79, "level": "Intermediate", "tag": "Ions: Cations and Anions", "stem": "Sodium has an atomic number of 11. How does a sodium ion with a net charge of 1+ differ from a neutral sodium atom?", "options": ["It has the same 11 electrons but one fewer proton than the atom", "It has one more proton and one more neutron than the neutral atom", "It has the same 11 protons but one fewer electron than the atom", "It has the same 11 protons but one fewer neutron than the atom"], "answer": "C", "answer_text": "It has the same 11 protons but one fewer electron than the atom", "exp": "A 1+ charge is made by removing one electron, taking 11 electrons down to 10 while the 11 protons stay put. Losing a proton would change the element to neon, and neutrons are neutral, so removing one changes the isotope but not the charge."}, {"id": 80, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "Eggium is 20.0% Eggium-7, 40.0% Eggium-8, and 40.0% Eggium-9. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of Eggium?", "options": ["8.20 amu", "8.00 amu", "8.2 amu", "820. g"], "answer": "A", "answer_text": "8.20 amu", "exp": "0.200 × 7 = 1.40, 0.400 × 8 = 3.20, and 0.400 × 9 = 3.60, and 1.40 + 3.20 + 3.60 = 8.20 amu. Mass numbers are exact counts, so the three-SD abundances set the precision: 8.2 amu throws away a digit, 8.00 amu averages the three mass numbers while ignoring abundance, and 820. g skips dividing by 100%."}, {"id": 81, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "A sample of elemental boron is 20.0% boron-10 and 80.0% boron-11. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of this boron?", "options": ["10.5 amu", "10.80 amu", "10.8 amu", "1.080 × 10³ g"], "answer": "B", "answer_text": "10.80 amu", "exp": "0.200 × 10 = 2.00 and 0.800 × 11 = 8.80, and adding gives 2.00 + 8.80 = 10.80 amu, kept to the two decimal places both terms share. The value 10.5 amu is the plain average of 10 and 11 with the abundances ignored, and 1.080 × 10³ amu comes from never dividing the percents by 100%."}, {"id": 82, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "A copper wire is 69.20% copper-63 and 30.80% copper-65. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of this copper?", "options": ["64.00 amu", "63.616 amu", "63.62 amu", "63.6 amu"], "answer": "C", "answer_text": "63.62 amu", "exp": "0.6920 × 63 = 43.60 and 0.3080 × 65 = 20.02, and 43.60 + 20.02 = 63.62 amu. The abundances carry 4 SD, so 63.616 amu is unrounded calculator output with a digit too many, 63.6 amu has a digit too few, and 64.00 amu ignores the abundances entirely."}, {"id": 83, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "An air sample is 99.60% nitrogen-14 and 0.400% nitrogen-15. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of the nitrogen in this sample?", "options": ["14.00 amu", "14 amu", "14.004 amu", "14.50 amu"], "answer": "A", "answer_text": "14.00 amu", "exp": "0.9960 × 14 = 13.94 and 0.00400 × 15 = 0.0600, and adding to the two decimal places of 13.94 gives 13.94 + 0.06 = 14.00 amu. Reporting 14.004 amu keeps unrounded output, plain 14 amu hides the decimal precision the data supports, and 14.50 amu is the average of the two mass numbers with no weighting."}, {"id": 84, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "Ore from one North American lead mine is 3.140% Pb-204, 27.510% Pb-206, 22.660% Pb-207, and 46.690% Pb-208. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of the lead from this mine?", "options": ["207.1 amu", "2.07098 × 10⁴ g", "206.250 amu", "207.098 amu"], "answer": "D", "answer_text": "207.098 amu", "exp": "The four products are 0.03140 × 204 = 6.406, 0.27510 × 206 = 56.671, 0.22660 × 207 = 46.906, and 0.46690 × 208 = 97.115, and they add to 207.098 amu at the three decimal places they share. The value 206.250 amu averages the four mass numbers without weighting, and 2.07098 × 10⁴ g is 100 times too large because the percents were never divided by 100%."}, {"id": 85, "level": "Intermediate", "tag": "Average Atomic Mass", "stem": "A sample of lithium is 7.60% lithium-6 and 92.40% lithium-7. Step 1: divide each percent abundance by 100% to get a decimal. Step 2: multiply each isotope's mass number by its abundance. Step 3: add the results. What is the average atomic mass of this lithium?", "options": ["6.50 amu", "6.076 amu", "6.92 amu", "6.924 amu"], "answer": "D", "answer_text": "6.924 amu", "exp": "0.0760 × 6 = 0.456 and 0.9240 × 7 = 6.468, and 0.456 + 6.468 = 6.924 amu, which sits between 6 and 7 as a weighted average must. The value 6.076 amu comes from pairing each mass number with the wrong abundance, 6.92 amu drops a digit, and 6.50 amu ignores abundance altogether."}, {"id": 86, "level": "Intermediate", "tag": "Bohr Models and Energy Levels", "stem": "Consider a Bohr model of beryllium-10. Beryllium has an atomic number of 4, two electrons go in the first ring, and up to 8 go in the second ring. Which description matches the correct drawing?", "options": ["4 protons and 6 neutrons in the nucleus, with 2 electrons in ring 1 and 2 in ring 2", "4 protons and 6 neutrons in the nucleus, with 4 electrons in ring 1 and 0 in ring 2", "6 protons and 4 neutrons in the nucleus, with 2 electrons in ring 1 and 4 in ring 2", "4 protons and 10 neutrons in the nucleus, with 2 electrons in ring 1 and 2 in ring 2"], "answer": "A", "answer_text": "4 protons and 6 neutrons in the nucleus, with 2 electrons in ring 1 and 2 in ring 2", "exp": "Neutrons = 10 − 4 = 6, and a neutral atom has 4 electrons, which fill ring 1 with 2 and put the remaining 2 in ring 2. Using 10 neutrons forgets to subtract the protons, and packing 4 electrons into ring 1 breaks the rule that the first ring holds only 2."}, {"id": 87, "level": "Intermediate", "tag": "Bohr Models and Energy Levels", "stem": "A neutral atom of nitrogen-15 is drawn as a Bohr model. Nitrogen has an atomic number of 7. How are its electrons arranged in the rings?", "options": ["2 electrons in the first ring and 5 electrons in the second ring", "5 electrons in the first ring and 2 electrons in the second ring", "2 electrons in the first ring and 8 electrons in the second ring", "7 electrons in the first ring and 0 electrons in the second ring"], "answer": "A", "answer_text": "2 electrons in the first ring and 5 electrons in the second ring", "exp": "A neutral nitrogen atom has 7 electrons, the first ring takes exactly 2, and the remaining 7 − 2 = 5 go in the second ring, which can hold up to 8. Putting 5 or 7 in the first ring overfills it, and 2 plus 8 accounts for 10 electrons, which would be neon."}, {"id": 88, "level": "Intermediate", "tag": "Bohr Models and Energy Levels", "stem": "In the discharge lamp simulation, an electron in a hydrogen atom drops from energy level 3 down to energy level 2, and a bright line appears in the spectroscope. What happened?", "options": ["The nucleus released a neutron, so the mass number of the atom dropped", "The atom released energy as light equal to the gap between the two levels", "The atom absorbed energy as light equal to the gap between the two levels", "The electron left the atom, so the atom became a CATION with a 1+ charge"], "answer": "B", "answer_text": "The atom released energy as light equal to the gap between the two levels", "exp": "Moving to a lower energy level means the electron gives up energy, and that energy leaves the atom as a photon of one specific color, which is the bright line. Absorbing energy would push the electron up instead of down, and nothing about the electron drop removes a neutron or an electron from the atom."}, {"id": 89, "level": "Intermediate", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "One line of the hydrogen emission spectrum is measured at 486 nm. Using 1 nm = 10⁻⁹ m, c = 3.00 × 10⁸ m/s, and f = c/λ, what is the frequency of this light?", "options": ["6.17 × 10⁵ Hz", "1.62 × 10⁻¹⁵ Hz", "6.1728 × 10¹⁴ Hz", "6.17 × 10¹⁴ Hz"], "answer": "D", "answer_text": "6.17 × 10¹⁴ Hz", "exp": "First convert: 486 nm × 10⁻⁹ m/nm = 4.86 × 10⁻⁷ m, then f = (3.00 × 10⁸ m/s) ÷ (4.86 × 10⁻⁷ m) = 6.17 × 10¹⁴ Hz to 3 SD. Leaving the wavelength in nanometers gives 6.17 × 10⁵ Hz, dividing λ by c inverts the formula to 1.62 × 10⁻¹⁵ Hz, and 6.1728 × 10¹⁴ Hz keeps two digits more than the data allow."}, {"id": 90, "level": "Intermediate", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "The red hydrogen line has a wavelength of 656 nm. Using E = hc/λ with h = 6.626 × 10⁻³⁴ J·s, c = 3.00 × 10⁸ m/s, and 1 nm = 10⁻⁹ m, what is the energy of one photon of this light?", "options": ["3.03 × 10⁻¹⁹ J", "3.30 × 10¹⁸ J", "3.03 × 10⁻²⁸ J", "3.0302 × 10⁻¹⁹ J"], "answer": "A", "answer_text": "3.03 × 10⁻¹⁹ J", "exp": "Convert 656 nm to 6.56 × 10⁻⁷ m, then E = (6.626 × 10⁻³⁴ J·s)(3.00 × 10⁸ m/s) ÷ (6.56 × 10⁻⁷ m) = 3.03 × 10⁻¹⁹ J, limited to 3 SD by c and λ. Skipping the nanometer conversion gives 3.03 × 10⁻²⁸ J, flipping the fraction gives 3.30 × 10¹⁸ J, and 3.0302 × 10⁻¹⁹ J is unrounded calculator output."}, {"id": 91, "level": "Intermediate", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "A violet line in a discharge tube has a frequency of 7.32 × 10¹⁴ Hz. Using λ = c/f with c = 3.00 × 10⁸ m/s, what is the wavelength of this light in meters?", "options": ["4.10 × 10⁻⁷ m", "4.0984 × 10⁻⁷ m", "2.44 × 10⁶ m", "2.20 × 10²³ m"], "answer": "A", "answer_text": "4.10 × 10⁻⁷ m", "exp": "λ = (3.00 × 10⁸ m/s) ÷ (7.32 × 10¹⁴ /s) = 4.10 × 10⁻⁷ m, which is 410. nm and lands in the violet range as expected. Dividing f by c gives 2.44 × 10⁶ m, multiplying them gives 2.20 × 10²³ m, and 4.0984 × 10⁻⁷ m reports 5 SD when only 3 are justified."}, {"id": 92, "level": "Intermediate", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "In a lightsaber duel the red blade emits light at 660. nm and the green blade emits light at 530. nm. Using f = c/λ with c = 3.00 × 10⁸ m/s, which statement compares the two blades correctly?", "options": ["Both blades are equal in frequency at 5.00 × 10¹⁴ Hz, so both carry the same", "Green is lower in frequency at 5.66 × 10¹⁴ Hz, so green carries less energy", "Green is higher in frequency at 5.66 × 10¹⁴ Hz, so green carries more energy", "Red is higher in frequency at 4.55 × 10¹⁴ Hz, so red carries more energy"], "answer": "C", "answer_text": "Green is higher in frequency at 5.66 × 10¹⁴ Hz, so green carries more energy", "exp": "Green: (3.00 × 10⁸ m/s) ÷ (5.30 × 10⁻⁷ m) = 5.66 × 10¹⁴ Hz; red: (3.00 × 10⁸ m/s) ÷ (6.60 × 10⁻⁷ m) = 4.55 × 10¹⁴ Hz. The shorter wavelength always gives the higher frequency, and higher frequency means more energy, so calling 5.66 × 10¹⁴ Hz the lower value contradicts its own arithmetic."}, {"id": 93, "level": "Intermediate", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "Green laser light has a frequency of 5.66 × 10¹⁴ Hz. Using E = hf with h = 6.626 × 10⁻³⁴ J·s, what is the energy of one photon of this light?", "options": ["3.75 × 10⁻²⁰ J", "1.17 × 10⁻⁴⁸ J", "3.7503 × 10⁻¹⁹ J", "3.75 × 10⁻¹⁹ J"], "answer": "D", "answer_text": "3.75 × 10⁻¹⁹ J", "exp": "E = (6.626 × 10⁻³⁴ J·s)(5.66 × 10¹⁴ /s) = 3.75 × 10⁻¹⁹ J, rounded to the 3 SD of the frequency. Dividing h by f instead of multiplying gives 1.17 × 10⁻⁴⁸ J, 3.75 × 10⁻²⁰ J misplaces the exponent by one, and 3.7503 × 10⁻¹⁹ J shows two digits the data cannot support."}, {"id": 94, "level": "Intermediate", "tag": "Emission Spectra and Flame Tests", "stem": "Sample 2, scraped from a green pigment, burns with a green flame. The class flame-color chart lists Barium – Green, Boron – Green, Copper (II) – Green, and Thallium – Green. What is the best conclusion from this one test?", "options": ["The metal cannot be identified at all, because flame colors change every trial", "The metal is a mixture of more than one of them, because each one burns with green light", "The metal must be barium, because barium is the first green metal on the chart", "The metal is barium, boron, copper (II), or thallium, and the test cannot narrow it more"], "answer": "D", "answer_text": "The metal is barium, boron, copper (II), or thallium, and the test cannot narrow it more", "exp": "More than one element can show the same flame color, so a green flame narrows the field to four candidates but cannot pick one of them. Choosing barium because of chart order is not evidence, and flame colors are reproducible, which is why the test is used at all."}, {"id": 95, "level": "Intermediate", "tag": "Emission Spectra and Flame Tests", "stem": "A known lithium spectrum shows bright lines at 460. nm, 610. nm, and 670. nm. An unknown sample shows bright lines at 460. nm and 670. nm only. Using the rule that all of the known's lines must be present in the unknown, is this a match?", "options": ["No match, because the known's line at 610. nm is absent in the unknown", "A match, because the unknown adds no extra lines beyond the known's set", "No match, because the unknown has to show more lines than the known does", "A match, because two of the three lines of the known sample are present"], "answer": "A", "answer_text": "No match, because the known's line at 610. nm is absent in the unknown", "exp": "Every line of the known must appear in the unknown, and the 610. nm line does not, so lithium is ruled out. Having two lines in common is not enough, and no rule requires the unknown to show extra lines beyond those of the known."}, {"id": 96, "level": "Intermediate", "tag": "Orbitals and the Quantum Model", "stem": "An electron orbital is the region where a set of electrons is found 95% of the time; an s orbital holds 2 electrons, a p set holds 6, and a d set holds 10, and any electrons in the same orbital must have opposite spins. Which statement follows from these facts?", "options": ["A single orbital holds exactly 10 electrons, and all of them share the same spin", "A single orbital holds at most 2 electrons, and those 2 must have opposite spins", "A single orbital holds at most 6 electrons, as long as each pair has opposite spins", "A single orbital traces the exact circular path an electron follows around a nucleus"], "answer": "B", "answer_text": "A single orbital holds at most 2 electrons, and those 2 must have opposite spins", "exp": "There are only two possible spins and electrons sharing an orbital must have opposite spins, so no orbital can hold more than 2 electrons; the 6 and the 10 are the totals for whole p and d sets. Describing an exact circular path is a Bohr ring, not an orbital, which is a region of probability."}, {"id": 97, "level": "Advanced", "tag": "History of Atomic Models", "stem": "A student writes on the Atomic History Notes Summary: “Rutherford's gold foil experiment showed that electrons travel in fixed energy levels around the nucleus.” Which correction is needed?", "options": ["The foil experiment showed that atoms cannot split; fixed energy levels came from Chadwick and neutrons", "The foil experiment showed a small dense nucleus; fixed energy levels came from Dalton and his postulates", "The foil experiment showed the plum pudding atom; fixed energy levels came from Thomson and cathode rays", "The foil experiment showed a small dense nucleus; fixed energy levels came from Bohr and emission spectra"], "answer": "D", "answer_text": "The foil experiment showed a small dense nucleus; fixed energy levels came from Bohr and emission spectra", "exp": "Most alpha particles passed straight through the foil and a few bounced back, which told Rutherford only that the positive charge and nearly all of the mass sit in a tiny nucleus. The idea that electrons occupy fixed energy levels came from Bohr in 1913, and his evidence was the bright-line emission spectrum of hydrogen — not scattered alpha particles."}, {"id": 98, "level": "Advanced", "tag": "History of Atomic Models", "stem": "Lead white from a known Vermeer and lead white from the questioned painting both contain atoms with 82 protons, yet the two samples have different average atomic masses. Which of Dalton's postulates must be revised, and whose later discovery explained why?", "options": ["The postulate that atoms of an element cannot be divided; Rutherford's 1911 nucleus explained isotopes", "The postulate that all atoms of an element are identical; Thomson's 1897 electron explained isotopes", "The postulate that atoms combine in whole-number ratios; Bohr's 1913 energy levels explained isotopes", "The postulate that all atoms of an element are identical; Chadwick's 1932 neutron explained isotopes"], "answer": "D", "answer_text": "The postulate that all atoms of an element are identical; Chadwick's 1932 neutron explained isotopes", "exp": "Both samples are lead because both are built from 82-proton atoms, so the only thing that can differ is the neutron count — these are isotopes, and Dalton's claim that every atom of an element is identical fails. Chadwick identified the neutron in 1932, which is what supplied the missing mass; Thomson's electron and Rutherford's nucleus say nothing about why two lead atoms would weigh differently."}, {"id": 99, "level": "Advanced", "tag": "History of Atomic Models", "stem": "Which statement correctly names something a model could NOT explain?", "options": ["Thomson's model could not explain how a negatively charged particle could come out of any element", "Bohr's model could not explain why an electron's position and energy cannot both be known at once", "Dalton's model could not explain why atoms combine in simple whole-number ratios in a compound", "Rutherford's model could not explain why most alpha particles passed straight through the gold foil"], "answer": "B", "answer_text": "Bohr's model could not explain why an electron's position and energy cannot both be known at once", "exp": "Bohr placed electrons in defined rings at defined energies, so his model has no room for Heisenberg's Uncertainty Principle, which says the position and the energy of an electron cannot both be known. The other three describe exactly what each model was built to explain: whole-number ratios were Dalton's, straight-through passage was Rutherford's, and the electron was Thomson's own discovery."}, {"id": 100, "level": "Advanced", "tag": "Evidence and Experiments", "stem": "In the hula-hoop model of the gold foil experiment, a group throws 400 ping-pong balls and 3 of them hit the Styrofoam ball at the center. The data sheet lists Rutherford's own hit rate as 0.0125%. What does the comparison say about the group's model?", "options": ["Their hit rate of 0.0075% is about 60 times below Rutherford's rate, so the classroom model is nearly exact", "Their hit rate of 7.50% is about 600 times Rutherford's rate, so the hula hoop should be made much smaller", "Their hit rate of 0.750% is about 60 times Rutherford's rate, so their Styrofoam nucleus is much too small", "Their hit rate of 0.750% is about 60 times Rutherford's rate, so their Styrofoam nucleus is much too large"], "answer": "D", "answer_text": "Their hit rate of 0.750% is about 60 times Rutherford's rate, so their Styrofoam nucleus is much too large", "exp": "3 ÷ 400 = 0.0075, and × 100 gives a hit rate of 0.750%; dividing by Rutherford's 0.0125% gives 0.750 ÷ 0.0125 = 60.0. Hitting the center 60 times too often means the Styrofoam ball is far too big compared with the hoop — a real nucleus is a far smaller fraction of the atom's width than the model shows."}, {"id": 101, "level": "Advanced", "tag": "Evidence and Experiments", "stem": "Thomson ran his cathode ray tube with different gases inside and different metals as electrodes, and the beam always bent toward the positive plate by the same amount at a given voltage. Which conclusion is BEST supported by that repetition?", "options": ["Nearly all of the atom's mass sits in a tiny nucleus, so the atom is mostly empty space", "Every element contains the same negatively charged particle, so the atom is not indivisible", "Electrons are limited to fixed energy levels, so every element gives off its own colors", "Every element contains the same positively charged particle, so the atom is not indivisible"], "answer": "B", "answer_text": "Every element contains the same negatively charged particle, so the atom is not indivisible", "exp": "Bending toward the positive plate means the beam particles are negative, and getting the identical result no matter which gas or metal was used means that same particle comes out of every element. That makes the particle a piece of the atom, which contradicts Dalton's indivisible atom; the nucleus and the energy levels were discovered later, by Rutherford and Bohr."}, {"id": 102, "level": "Advanced", "tag": "Subatomic Particles", "stem": "A student writes: “The electron cloud takes up almost the entire volume of a lead atom, so almost all of the atom's mass must be spread through the electron cloud.” What is wrong with this reasoning?", "options": ["Electrons have almost no mass, so nearly all of the mass sits in the tiny nucleus instead", "Electrons have almost no volume, so nearly all of the volume sits in the tiny nucleus instead", "Lead atoms are too heavy for the electron cloud model, so the model cannot be applied here", "The electron cloud holds the protons, so the nucleus of a lead atom contains only neutrons"], "answer": "A", "answer_text": "Electrons have almost no mass, so nearly all of the mass sits in the tiny nucleus instead", "exp": "Volume and mass are different properties, and the student has traded one for the other. Each proton and each neutron counts as about one atomic mass unit while an electron contributes almost none, so nearly all of the mass of a lead atom is packed into the nucleus even though the nucleus is a very small part of the atom's volume."}, {"id": 103, "level": "Advanced", "tag": "Subatomic Particles", "stem": "Which comparison of the subatomic particles in a neutral ₈₂²⁰⁸Pb atom is correct?", "options": ["Its 82 protons and 126 neutrons each have about the same mass; onl
