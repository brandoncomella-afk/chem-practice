y the protons are charged", "Its 126 neutrons and 82 electrons each have about the same mass; only the protons are charged", "Its 82 protons and 82 electrons each have about the same mass; only the neutrons are charged", "Its 82 protons and 126 neutrons each have about the same mass; only the neutrons are charged"], "answer": "A", "answer_text": "Its 82 protons and 126 neutrons each have about the same mass; only the protons are charged", "exp": "Mass number = protons + neutrons, so this atom holds 208 − 82 = 126 neutrons alongside its 82 protons, and a proton and a neutron each count as about one atomic mass unit. Of the two nuclear particles only the proton carries charge, and an electron has almost no mass at all, so pairing an electron with a proton or a neutron by mass is wrong."}, {"id": 104, "level": "Advanced", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A particle detected in a paint chip has 23 electrons, a net charge of 3+, and a mass number of 56. How many protons and neutrons does it have, and which element is it?", "options": ["26 protons and 33 neutrons, so the particle is an iron ion", "23 protons and 33 neutrons, so the particle is a vanadium ion", "20 protons and 36 neutrons, so the particle is a calcium ion", "26 protons and 30 neutrons, so the particle is an iron ion"], "answer": "D", "answer_text": "26 protons and 30 neutrons, so the particle is an iron ion", "exp": "Net charge is protons minus electrons, so 3+ means protons = 23 + 3 = 26, and 26 protons on the periodic table is iron. Mass number = protons + neutrons, so neutrons = 56 − 26 = 30; subtracting the 23 electrons instead gives 33 neutrons, which uses the wrong particle entirely."}, {"id": 105, "level": "Advanced", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "The white pigment in the questioned painting is lead-206, while a modern white pigment is titanium-48. How many more neutrons are in one lead-206 atom than in one titanium-48 atom? (Lead has atomic number 82; titanium has atomic number 22.)", "options": ["124 more neutrons", "158 more neutrons", "98 more neutrons", "60 more neutrons"], "answer": "C", "answer_text": "98 more neutrons", "exp": "Lead-206 holds 206 − 82 = 124 neutrons and titanium-48 holds 48 − 22 = 26 neutrons, so the difference is 124 − 26 = 98. Subtracting the mass numbers directly gives 158, which counts protons as well as neutrons, and 124 is the lead neutron count alone."}, {"id": 106, "level": "Advanced", "tag": "Counting Protons, Neutrons, and Electrons", "stem": "A student fills in a data table for ₃₅⁸⁰Br¹⁻ as 35 protons, 45 neutrons, and 34 electrons. Which correction is needed?", "options": ["The electrons should be 35, because forming an ion never changes the electron count", "The neutrons should be 35, because the atomic number gives the neutrons in the nucleus", "The electrons should be 36, because a 1− charge means the ANION gained an electron", "The protons should be 36, because a 1− charge adds one proton to the nucleus of the atom"], "answer": "C", "answer_text": "The electrons should be 36, because a 1− charge means the ANION gained an electron", "exp": "The protons (35) and neutrons (80 − 35 = 45) are both right, but a 1− net charge means the negative charges outnumber the positive ones, so electrons = 35 + 1 = 36. Writing 34 electrons would give a net charge of 1+, a CATION, which is the opposite of what the notation says."}, {"id": 107, "level": "Advanced", "tag": "Isotopes", "stem": "In the Eggium lab a group finds five eggs that each hold 4 protons, with 4, 5, 3, 4, and 5 neutrons. A sixth egg is opened and holds 5 protons and 4 neutrons. Why is egg 6 NOT an isotope of Eggium?", "options": ["The neutron count defines the element, so 4 neutrons makes egg 6 a different element", "The proton count defines the element, so 5 protons makes egg 6 a different element", "Isotopes must always hold more neutrons than protons, and egg 6 holds fewer of them", "Its mass of 9 already belongs to another egg, and two isotopes cannot share a mass"], "answer": "B", "answer_text": "The proton count defines the element, so 5 protons makes egg 6 a different element", "exp": "Isotopes are atoms of the same element — the same number of protons — with different numbers of neutrons, so every Eggium isotope must show 4 protons. Egg 6 has 5 protons, which makes it a different element no matter what its mass adds up to; eggs 2 and 5 already show that two samples can share a mass number of 9."}, {"id": 108, "level": "Advanced", "tag": "Isotopes", "stem": "Two white paint samples are both pure lead, but sample 1 averages 207.24 amu and sample 2 averages 207.10 amu. Which statement MUST be true?", "options": ["Sample 1 must hold some 83-proton atoms, and those extra protons are what raise its average", "The two samples must be different elements, since each element has one average atomic mass", "Both samples hold only 82-proton atoms, and the samples differ in their mix of electron counts", "Both samples hold only 82-proton atoms, and the samples differ in their mix of neutron counts"], "answer": "D", "answer_text": "Both samples hold only 82-proton atoms, and the samples differ in their mix of neutron counts", "exp": "Every lead atom has 82 protons by definition, so the only thing that can shift the average is the proportion of Pb-204, Pb-206, Pb-207, and Pb-208 — that is, the neutron mix. Adding an 83rd proton would make the sample bismuth, and electrons have too little mass to change an average atomic mass at all."}, {"id": 109, "level": "Advanced", "tag": "Isotope Notation", "stem": "Write the isotope notation for a titanium ion that contains 22 protons, 26 neutrons, and 18 electrons.", "options": ["₂₂⁴⁸Ti⁴⁻", "₂₂⁴⁴Ti⁴⁺", "₂₂⁴⁸Ti⁴⁺", "₂₆⁴⁸Ti⁴⁺"], "answer": "C", "answer_text": "₂₂⁴⁸Ti⁴⁺", "exp": "The atomic number 22 is the left subscript, the mass number 22 + 26 = 48 is the left superscript, and the net charge is 22 protons − 18 electrons = 4+, written number-then-sign as a CATION. Using 22 + 22 for the mass number gives 44, and putting the neutron count 26 in the subscript would change the element."}, {"id": 110, "level": "Advanced", "tag": "Isotope Notation", "stem": "A student writes the notation for a bromine-80 ion holding 36 electrons as ₈₀³⁵Br²⁻. Which list names ALL of the errors?", "options": ["The 80 and 35 are swapped, and the charge should be 1+ rather than 2−", "The 80 and 35 are swapped, and the neutron count 45 should replace the 35", "The 80 and 35 are swapped, and the charge should be 1− rather than 2−", "The 80 and 35 are correct, but the charge should be 1− rather than 2−"], "answer": "C", "answer_text": "The 80 and 35 are swapped, and the charge should be 1− rather than 2−", "exp": "The atomic number goes in the left subscript and the mass number in the left superscript, so bromine must be written ₃₅⁸⁰Br. Net charge is protons − electrons = 35 − 36 = 1−, so the correct notation is ₃₅⁸⁰Br¹⁻; a 2− charge would require 37 electrons, and the neutron count never appears in the notation."}, {"id": 111, "level": "Advanced", "tag": "Ions: Cations and Anions", "stem": "A study guide lists a fluorine-18 particle with 9 protons, 9 neutrons, and 10 electrons as having a net charge of 1+. What is the correct net charge, and why?", "options": ["1−, because the 10 negative electrons outnumber the 9 positive protons", "1+, because the 9 positive protons outnumber the 10 negative electrons", "0, because gaining an electron does not change the net charge of an atom", "1−, because the 10 electrons outnumber the 9 neutrons inside the nucleus"], "answer": "A", "answer_text": "1−, because the 10 negative electrons outnumber the 9 positive protons", "exp": "Net charge is the difference between the positive and negative charges: 9 protons − 10 electrons = 1−, so this is an ANION and the study guide has the sign inverted. Neutrons are neutral and never enter the charge count, and gaining an electron always makes a particle more negative, not unchanged."}, {"id": 112, "level": "Advanced", "tag": "Ions: Cations and Anions", "stem": "Which particle is an ANION that contains exactly 10 electrons and has a mass number of 15?", "options": ["₁₂²⁴Mg²⁺", "₇¹⁵N³⁻", "₉¹⁹F¹⁻", "₈¹⁸O²⁻"], "answer": "B", "answer_text": "₇¹⁵N³⁻", "exp": "All four particles hold 10 electrons, so the mass number and the charge sign decide it: nitrogen-15 gained 3 electrons (7 + 3 = 10) for a 3− charge and a mass number of 15. The oxygen and fluorine particles are anions too but carry mass numbers of 18 and 19, and the magnesium particle lost electrons, making it a CATION."}, {"id": 113, "level": "Advanced", "tag": "Average Atomic Mass", "stem": "A mass analysis of the lead in a paint sample gives Pb-204 at 1.400%, Pb-206 at 24.10%, Pb-207 at 22.10%, and Pb-208 at 52.40%. What is the average atomic mass, reported to the correct number of significant digits? (Mass numbers are exact counted values.)", "options": ["207.241 amu", "207.3 amu", "207.2 amu", "206.3 amu"], "answer": "C", "answer_text": "207.2 amu", "exp": "Dividing each percent abundance by 100% and multiplying by its exact mass number gives 2.856 + 49.646 + 45.747 + 108.992 = 207.241. Every abundance carries 4 SD, so the least precise product, 108.992 → 109.0, is trustworthy only to the tenths place, and rounding the sum once at the end gives 207.2 amu. Copying the calculator gives 207.241 amu, and averaging the four mass numbers without weighting gives 206.3 amu."}, {"id": 114, "level": "Advanced", "tag": "Average Atomic Mass", "stem": "A copper sample is 69.17% copper-63 and 30.83% copper-65. What is the average atomic mass, reported to the correct number of significant digits?", "options": ["63.6166 amu", "63.62 amu", "63.6 amu", "64.00 amu"], "answer": "B", "answer_text": "63.62 amu", "exp": "(63)(0.6917) + (65)(0.3083) = 43.5771 + 20.0395 = 63.6166. Both abundances carry 4 SD, so both products are good to the hundredths place (43.58 and 20.04) and the answer is 63.62 amu. Reporting 63.6 amu throws away a digit the data supports, and 64.00 amu is the unweighted average of 63 and 65, which ignores the abundances completely."}, {"id": 115, "level": "Advanced", "tag": "Average Atomic Mass", "stem": "A student’s worked solution reports the average atomic mass of a lithium sample that is 7.6% lithium-6 and 92.4% lithium-7 as “0.456 + 6.468 = 9.9 amu.” Using the self-check that the answer must land between the isotope masses, what is the correct value?", "options": ["9.90 amu, because the sum in the solution was added correctly", "6.92 amu, because the sum was added incorrectly in the solution", "6.50 amu, because the two isotope masses should be averaged", "6.924 amu, because the sum was added incorrectly in the solution"], "answer": "B", "answer_text": "6.92 amu, because the sum was added incorrectly in the solution", "exp": "The two products are right — (6)(0.076) = 0.456 and (7)(0.924) = 6.468 — but they add to 6.924, not 9.9, and 9.9 fails the self-check because the answer has to fall between 6 and 7. The 7.6% abundance carries only 2 SD, so its product is good only to the hundredths place, making the reported answer 6.92 amu; 6.924 amu claims a digit that 7.6% never supported."}, {"id": 116, "level": "Advanced", "tag": "Average Atomic Mass", "stem": "Lead ore from the European deposits that supplied Dutch painters in the 1600s measures Pb-204 at 1.3700%, Pb-206 at 22.5100%, Pb-207 at 25.4700%, and Pb-208 at 50.6500%. What is the average atomic mass of this lead, to the correct number of significant digits?", "options": ["207.2 amu", "207.2403 amu", "206.3 amu", "207.24 amu"], "answer": "D", "answer_text": "207.24 amu", "exp": "The four products are 2.7948 + 46.3706 + 52.7229 + 105.3520 = 207.2403. The abundances each carry 5 SD, so the least precise product, 105.3520 → 105.35, is good to the hundredths place and the answer is 207.24 amu. Reporting 207.2 amu discards a digit these five-digit abundances paid for, and 206.3 amu is the unweighted average of the four mass numbers."}, {"id": 117, "level": "Advanced", "tag": "Average Atomic Mass", "stem": "An element consists of only copper-63 and copper-65, and a sample of it has an average atomic mass of 63.62 amu. Without any further calculation, which conclusion is best supported?", "options": ["Some copper-64 must also be present, since 63.62 rounds to 64 and falls between them", "The two isotopes are present in nearly equal amounts, since 63.62 falls between them", "More than half of the atoms are copper-63, since 63.62 sits closer to 63 than to 65", "More than half of the atoms are copper-65, since 63.62 sits closer to 65 than to 63"], "answer": "C", "answer_text": "More than half of the atoms are copper-63, since 63.62 sits closer to 63 than to 65", "exp": "An average atomic mass is a weighted average, so it is always pulled toward the more abundant isotope. Here 63.62 sits only 0.62 above 63 but 1.38 below 65, so copper-63 must dominate — in fact 1.38 ÷ 2 = 0.69, about 69% copper-63. Equal amounts would have produced 64.00 amu."}, {"id": 118, "level": "Advanced", "tag": "Bohr Models and Energy Levels", "stem": "Which description matches a correct Bohr model of the ₁₃²⁷Al³⁺ ion? (Two electrons fit in the first ring, and up to eight fit in the second.)", "options": ["13 protons and 27 neutrons, with 2 electrons in the first ring and 8 in the second", "13 protons and 14 neutrons, with 2 electrons in the first ring and 8 in the second", "10 protons and 14 neutrons, with 2 electrons in the first ring and 8 in the second", "13 protons and 14 neutrons, with 2 electrons in the first ring and 11 in the second"], "answer": "B", "answer_text": "13 protons and 14 neutrons, with 2 electrons in the first ring and 8 in the second", "exp": "Neutrons = 27 − 13 = 14, and a 3+ net charge means the ion kept 13 − 3 = 10 electrons, which fill the first ring with 2 and the second ring with 8 — a full outer ring. Using 27 as the neutron count forgets to subtract the protons, and dropping the protons to 10 would change the element, which forming an ion never does."}, {"id": 119, "level": "Advanced", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "A hydrogen emission line has a wavelength of 434.0 nm. What is its frequency? (f = c/λ, c = 3.00 × 10⁸ m/s, 1 nm = 10⁻⁹ m)", "options": ["6.91 × 10¹⁴ Hz", "6.912 × 10¹⁴ Hz", "6.91 × 10⁵ Hz", "1.45 × 10⁻¹⁵ Hz"], "answer": "A", "answer_text": "6.91 × 10¹⁴ Hz", "exp": "First convert: 434.0 nm × 10⁻⁹ m/nm = 4.340 × 10⁻⁷ m. Then f = 3.00 × 10⁸ m/s ÷ 4.340 × 10⁻⁷ m = 6.9124 × 10¹⁴, and since c carries only 3 SD the answer is 6.91 × 10¹⁴ Hz. Skipping the nanometer conversion gives 6.91 × 10⁵ Hz, and dividing the wavelength by c instead gives 1.45 × 10⁻¹⁵."}, {"id": 120, "level": "Advanced", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "The red hydrogen line has a wavelength of 656.3 nm. What is the energy of one photon of this light? (E = hc/λ, h = 6.626 × 10⁻³⁴ J·s, c = 3.00 × 10⁸ m/s, 1 nm = 10⁻⁹ m)", "options": ["3.029 × 10⁻¹⁹ J", "4.35 × 10⁻³¹ J", "3.03 × 10⁻¹⁹ J", "3.03 × 10⁻²⁸ J"], "answer": "C", "answer_text": "3.03 × 10⁻¹⁹ J", "exp": "hc = (6.626 × 10⁻³⁴ J·s)(3.00 × 10⁸ m/s) = 1.9878 × 10⁻²⁵ J·m, and dividing by 6.563 × 10⁻⁷ m gives 3.0288 × 10⁻¹⁹; c limits the answer to 3 SD, so E = 3.03 × 10⁻¹⁹ J. Leaving the wavelength in nanometers gives 3.03 × 10⁻²⁸ J, and multiplying h by the wavelength as if it were the frequency gives 4.35 × 10⁻³¹ J."}, {"id": 121, "level": "Advanced", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "Compare the violet hydrogen line at 410.2 nm with the red hydrogen line at 656.3 nm. How many times greater is the energy of one violet photon than one red photon, reported to the correct number of significant digits?", "options": ["1.6 times greater", "0.6250 times greater", "1.600 times greater", "246.1 times greater"], "answer": "C", "answer_text": "1.600 times greater", "exp": "Because E = hc/λ, h and c cancel in the comparison and the energy ratio is just the inverse wavelength ratio: 656.3 nm ÷ 410.2 nm = 1.5999… Both wavelengths carry 4 SD, so the answer must display 4 SD as 1.600. Dividing the other way gives 0.6250, and 246.1 is the difference of the two wavelengths in nm, not a ratio."}, {"id": 122, "level": "Advanced", "tag": "Light: Wavelength, Frequency, and Energy", "stem": "X-rays like the ones Roentgen produced are used to look beneath the surface layer of a painting. An X-ray source has a frequency of 1.00 × 10¹⁸ Hz. What is its wavelength in nanometers? (λ = c/f, c = 3.00 × 10⁸ m/s, 1 nm = 10⁻⁹ m)", "options": ["0.300 nm", "3.00 × 10⁻¹⁰ nm", "3.00 nm", "3.33 × 10⁹ nm"], "answer": "A", "answer_text": "0.300 nm", "exp": "λ = 3.00 × 10⁸ m/s ÷ 1.00 × 10¹⁸ /s = 3.00 × 10⁻¹⁰ m, and dividing by 10⁻⁹ m/nm converts that to 0.300 nm. Writing 3.00 × 10⁻¹⁰ nm keeps the value in meters while labeling it nanometers, and 3.33 × 10⁹ comes from dividing f by c instead of c by f."}, {"id": 123, "level": "Advanced", "tag": "Emission Spectra and Flame Tests", "stem": "A spectroscope reading of an Unknown paint sample shows every bright line found in the Known lithium spectrum, plus three additional bright lines at other wavelengths. Using the rule that all of the lines from the Known must be present in the Unknown for a match, what is the best conclusion?", "options": ["No conclusion can be drawn, because emission spectra cannot be read from a mixture", "Lithium is the only element present, because every one of its lines showed up here", "Lithium is absent, because the three extra lines rule out any lithium in the sample", "Lithium is present, and at least one other element is present in the sample too"], "answer": "D", "answer_text": "Lithium is present, and at least one other element is present in the sample too", "exp": "The rule is one-directional: every Known line appearing in the Unknown confirms lithium is there. Extra lines do not cancel that match — they mean something else is in the sample as well, since each element contributes its own set of bright lines and a mixture simply stacks the sets together."}, {"id": 124, "level": "Advanced", "tag": "Emission Spectra and Flame Tests", "stem": "Sample A, scraped from the wooden chair, burns bright red in the flame test. The class flame-color chart lists lithium, strontium, and mercury (I) all as red. What is the strongest defensible conclusion?", "options": ["None of those three metals is present, since more than one metal can share that same color", "Lithium is present, since lithium is the first metal that is listed as red on the class chart", "At least one of those three metals is present, and a spectrum is needed to choose among them", "All three of those metals are present, since the red flame had to come from each one of them"], "answer": "C", "answer_text": "At least one of those three metals is present, and a spectrum is needed to choose among them", "exp": "A flame color narrows the possibilities but cannot identify a single metal, because more than one element glows red. Emission spectra do the rest of the job, since the set of bright lines is unique to each element while the overall color is not."}, {"id": 125, "level": "Advanced", "tag": "Emission Spectra and Flame Tests", "stem": "Two white paint chips are flame tested. Chip 1 burns blue and chip 2 burns silver white; the chart lists lead as blue and titanium as silver white. Which chip could have come from a paint mixed in the 1600s, and why?", "options": ["Chip 2, because white paint of the 1600s was titanium based and lead white is modern", "Both chips, because a flame color comes from the paint binder rather than from its metal", "Chip 1, because white paint of the 1600s was lead based and titanium white is modern", "Chip 1, because a blue flame shows the painter mixed cobalt into the white of the 1600s"], "answer": "C", "answer_text": "Chip 1, because white paint of the 1600s was lead based and titanium white is modern", "exp": "On the pigment table, Vermeer's white in the 1600s is lead, while Von Meegeren's white in the early 1900s is titanium, so a blue lead flame is the only one consistent with the older paint. The flame color comes from the metal in the pigment, not the binder, and cobalt is listed as silver white rather than blue."}, {"id": 126, "level": "Advanced", "tag": "Emission Spectra and Flame Tests", "stem": "The emission spectrum of the known Vermeer white paint shows lead lines plus silver and antimony lines. A student compares it with the questioned painting's white paint and reports: “They match — both spectra show a strong lead line at the same wavelength.” What is wrong with this reasoning?", "options": ["A match cannot be judged from bright lines at all, because only a faint rainbow identifies an element", "A match needs every line of the Known present, and the silver and antimony lines are missing", "A match needs only one shared line to be found, so flame colors should have been compared instead", "A match needs the two spectra to share no lines at all, so one shared line already rules out a match"], "answer": "B", "answer_text": "A match needs every line of the Known present, and the silver and antimony lines are missing", "exp": "One shared line only shows that both paints contain lead, which was already known. The white paint of the known Vermeer also produced silver and antimony lines, and those are missing from the questioned painting's white — so not all of the Known's lines are present and the paints do not match."}, {"id": 127, "level": "Advanced", "tag": "Orbitals and the Quantum Model", "stem": "A set of d orbitals holds a maximum of 10 electrons, and any two electrons sharing one orbital must have opposite spins. How many separate d orbitals are in the set, and how do the spins divide?", "options": ["10 orbitals, with 5 electrons of one spin and 5 of the other spin", "5 orbitals, with 5 electrons of one spin and 5 of the other spin", "5 orbitals, with all 10 electrons carrying one and the same spin", "2 orbitals, with 5 electrons of one spin and 5 of the other spin"], "answer": "B", "answer_text": "5 orbitals, with 5 electrons of one spin and 5 of the other spin", "exp": "Each orbital holds at most 2 electrons, so a 10-electron set requires 10 ÷ 2 = 5 orbitals. Since the two electrons in each orbital must have opposite spins, a full set has 5 of one spin and 5 of the other; there are only two possible spins, so all 10 sharing one spin is impossible."}, {"id": 128, "level": "Advanced", "tag": "Orbitals and the Quantum Model", "stem": "A student says: “Heisenberg's Uncertainty Principle means we cannot know how many electrons an atom has.” What does the principle actually say, and why does the student's version fail?", "options": ["An electron's position and energy cannot both be known; the electron count is therefore unknowable", "An electron's mass and charge cannot both be known; the electron count comes from the neutrons", "An electron's spin and charge cannot both be known; the electron count comes from the mass number", "An electron's position and energy cannot both be known; the electron count comes from the protons"], "answer": "D", "answer_text": "An electron's position and energy cannot both be known; the electron count comes from the protons", "exp": "Heisenberg's principle limits knowing an electron's position and its energy at the same time — it says nothing about counting electrons. In a neutral atom the electron count equals the proton count, and in an ion it is the proton count adjusted by the net charge, so the number is always known exactly."}, {"id": 129, "level": "Advanced", "tag": "Orbitals and the Quantum Model", "stem": "An orbital viewer draws the region where a set of electrons is found 95% of the time. What does the remaining 5% tell you about the electron cloud?", "options": ["An electron is sometimes found outside the drawn region, so its edge is not a solid wall", "The drawing is 5% inaccurate, so a better orbital viewer would show a true 100% boundary line", "About 5% of the atom's electrons are missing, so the drawn region only holds the rest of them", "An electron spends 5% of its time inside the nucleus among the protons and the neutrons"], "answer": "A", "answer_text": "An electron is sometimes found outside the drawn region, so its edge is not a solid wall", "exp": "An orbital is a probability region, not a container: 95% of the time the electron is inside the drawn shape, and the other 5% of the time it is somewhere outside it. That is why the quantum mechanical model pictures a cloud instead of the sharp path a Bohr ring suggests — no electrons are missing and the drawing is not in error."}, {"id": 130, "level": "Advanced", "tag": "Orbitals and the Quantum Model", "stem": "The Quantum Mechanical Model is the current model of the atom, yet the Bohr model is the one drawn in class. Which statement best explains that choice and names what the two models agree on?", "options": ["Bohr rings are far easier to draw, and both models keep electron energies at set levels", "Bohr's model was developed most recently, and both models fix an electron's exact position", "Bohr rings are far easier to draw, and both models put electrons on fixed circular paths", "Bohr's model was later proven correct, and both models treat the nucleus as empty space"], "answer": "A", "answer_text": "Bohr rings are far easier to draw, and both models keep electron energies at set levels", "exp": "The quantum mechanical model is the accepted one but its probability clouds are extremely difficult to draw, so the Bohr rings stand in for basic atom work. What survives from Bohr is quantization — electrons may only hold certain energies — while the fixed circular path does not, and Bohr's 1913 model came before the 1920s quantum model rather than after it."}, {"id": 131, "level": "Advanced", "tag": "Case File: Found or Forgery", "stem": "The lead in the questioned painting's white paint has an average atomic mass of 207.09 amu. Lead from the three candidate ore sources averages 207.24 amu (Europe), 207.10 amu (North America), and 207.35 amu (Australia). What does this evidence support?", "options": ["The ore source cannot be identified, because all three averages round to the very same value", "The lead came from European ore, so the paint is consistent with a genuine 1600s Vermeer", "The lead came from North American ore, which Dutch painters of the 1600s did not have", "The lead came from Australian ore, which Dutch painters of the 1600s used most regularly"], "answer": "C", "answer_text": "The lead came from North American ore, which Dutch painters of the 1600s did not have", "exp": "The sample sits 0.01 from the North American value but 0.15 from Europe and 0.26 from Australia, so North America is the match. Dutch lead in Vermeer's time came from deposits in the Netherlands and Belgium; lead was not imported from the Americas and Australia until the 19th century, so this paint cannot be from the 1600s."}, {"id": 132, "level": "Advanced", "tag": "Case File: Found or Forgery", "stem": "The three candidate ore sources give average atomic masses of 207.24, 207.10, and 207.35 amu — values that agree in the ones place and differ only in the tenths and hundredths places. What does that require of the percent abundance data behind the calculation?", "options": ["The abundances must be rounded off to whole percents so the three sources compare cleanly", "The abundances do not matter here, because the exact mass numbers already carry all the digits", "The abundances must be measured to at least four significant digits to separate the sources", "The abundances must add up to more than 100% before the hundredths place could be trusted"], "answer": "C", "answer_text": "The abundances must be measured to at least four significant digits to separate the sources", "exp": "Mass numbers are exact counted values with infinite significant digits, so the abundances alone set the precision of the answer. Abundances rounded to whole percents would carry one or two SD and limit each average to about the ones place, and all three sources would then be reported as the same number — the case only works because the abundances were measured to four or five SD."}, {"id": 133, "level": "Advanced", "tag": "Case File: Found or Forgery", "stem": "A flame test on the white paint of a second questioned painting gives a silver-white flame, and its emission spectrum matches titanium. Which conclusion is strongest, and what does a lead result alone NOT prove?", "options": ["The painting is genuine, since titanium white was standard in the 1600s; a lead result dates it", "The painting is genuine, since a silver-white flame comes from both lead and titanium pigments", "The painting is modern, since titanium white postdates the 1600s; a lead result proves it genuine", "The painting is modern, since titanium white postdates the 1600s; a lead result dates nothing"], "answer": "D", "answer_text": "The painting is modern, since titanium white postdates the 1600s; a lead result dates nothing", "exp": "Titanium white belongs to Von Meegeren's era in the early 1900s, so titanium in the white pigment places the paint well after Vermeer. A lead result proves much less, because lead white was used in both eras and a careful forger mixed period paints on purpose — which is why the lead isotope ratio, not the metal itself, carries the case."}, {"id": 134, "level": "Advanced", "tag": "Case File: Found or Forgery", "stem": "In the case summary, a student writes four sentences. Which one functions as EVIDENCE rather than as a claim or as reasoning?", "options": ["The lead in the white paint has an average atomic mass of 207.09 amu", "Forgery is a far less serious crime than selling art to the enemy in wartime", "Because modern ore has a different isotope mix, the paint is not from the 1600s", "The painting was made by van Meegeren and is not a genuine Vermeer at all"], "answer": "A", "answer_text": "The lead in the white paint has an average atomic mass of 207.09 amu", "exp": "Evidence is the measured data itself — a number that came from an instrument. The sentence naming the painter is the claim, the sentence beginning “Because” is the reasoning that ties data to claim, and the sentence comparing how serious two crimes are is an opinion rather than a measurement."}, {"id": 135, "level": "Advanced", "tag": "Case File: Found or Forgery", "stem": "The emission spectra, the flame tests, and the lead isotope average all point to modern paint. What is the strongest CLAIM this chemical evidence supports about the charge van Meegeren faced?", "options": ["He copied an existing Vermeer line for line, so the chemical evidence shows no crime happened", "He painted the work himself, so he should be tried as a forger rather than a war criminal", "He sold a genuine Vermeer to the enemy, so he should be tried as a war criminal, not a forger", "He painted the work himself, and the chemical evidence also proves he never met a Nazi buyer"], "answer": "B", "answer_text": "He painted the work himself, so he should be tried as a forger rather than a war criminal", "exp": "Modern paint means the canvas cannot be a lost 1600s Vermeer, which supports van Meegeren's own defense that the work was his forgery — the lesser charge. The chemistry dates the paint and nothing else, so it cannot speak to who bought the painting, and forging a new “could have been” work is still a crime."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let tag = '', setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
$('#tagsel').innerHTML = '<option value="">All skills</option>' +
  tags.map(t=>`<option value="${t}">${t} (${BANK.filter(q=>q.tag===t).length})</option>`).join('');

function pool(){
  return BANK.filter(q => levels.has(q.level) && (!tag || q.tag===tag));
}
function refresh(){
  const n = pool().length;
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
$('#tagsel').onchange = e => { tag = e.target.value; refresh(); };
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  const n = pos + (answered?1:0);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
