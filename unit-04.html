o melt means something ionic is mixed in with the sugar. A covalent network such as graphite would not dissolve in water in the first place, and a nonpolar wax would fail both the solubility and the conductivity tests."}, {"id": 100, "level": "Intermediate", "tag": "Case File: When Bonds Break", "stem": "The poison hidden in the sugar bowl is thallium sulfate. Thallium acts with a 1+ oxidation number and sulfate is SO₄²⁻. What is the formula for this compound?", "options": ["TlSO₄, since the 1+ and the 2− cancel one another out", "Tl(SO₄)₂, since the 2− charge crisscrosses onto Tl", "Tl₂(SO₄)₂, since each ion is given a subscript of two", "Tl₂SO₄, since two 1+ ions balance one 2− sulfate ion"], "answer": "D", "answer_text": "Tl₂SO₄, since two 1+ ions balance one 2− sulfate ion", "exp": "Crisscrossing Tl¹⁺ with SO₄²⁻ puts the 2 on thallium and the 1 on sulfate, giving Tl₂SO₄ with 2(1+) = 2+ balancing the 2−. TlSO₄ leaves a net 1− charge, Tl(SO₄)₂ crisscrosses in only one direction, and Tl₂(SO₄)₂ would reduce to TlSO₄ anyway."}, {"id": 101, "level": "Advanced", "tag": "Types of Bonds", "stem": "Day 3 predicts bond type from two trends: two elements that both have a high electronegativity and a high first ionization energy share electrons; when one element is low on both and the other is high on both, electrons are transferred; when both elements are low on both, the atoms pool their valence electrons. A table lists potassium as low/low, bromine as high/high, and copper and zinc each as low/low. What bond forms in potassium bromide, and what bond holds copper and zinc together in brass?", "options": ["Ionic in potassium bromide, because both elements are high on the two trends; covalent in brass, because both are low", "Covalent in potassium bromide, because both elements hold electrons tightly; metallic in brass, because both are low", "Ionic in potassium bromide, because one element is low and one is high; metallic in brass, because both are low", "Metallic in potassium bromide, because both elements are low on the trends; ionic in brass, because one is low and one is high"], "answer": "C", "answer_text": "Ionic in potassium bromide, because one element is low and one is high; metallic in brass, because both are low", "exp": "Potassium is low on both trends and bromine is high on both, so bromine takes the electron and potassium bromide is ionic; copper and zinc are both low, so their valence electrons are delocalized into a shared sea and the bond is metallic. Calling potassium bromide covalent would require both atoms to hold their electrons tightly, which is false for potassium, and no pair of metals transfers electrons to make an ionic bond."}, {"id": 102, "level": "Advanced", "tag": "Types of Bonds", "stem": "In the alloy lab a copper penny is coated with zinc and then heated until the two metals mix into a brass surface layer. The layer conducts electricity, can be hammered flat without shattering, and does not melt on the hot plate. A student concludes that brass must be ionic, “because only ionic substances conduct and have high melting points.” What is the correct analysis?", "options": ["Brass is metallic; a sea of delocalized electrons carries current, lets layers slide, and holds a high melting point", "Brass is covalent molecular; electrons shared inside Cu–Zn molecules carry current and give it a high melting point", "Brass is ionic; copper ions and zinc ions attract in a lattice, which carries current and gives a high melting point", "Brass is a covalent network; every atom is locked into one giant molecule, which carries current and melts very high"], "answer": "A", "answer_text": "Brass is metallic; a sea of delocalized electrons carries current, lets layers slide, and holds a high melting point", "exp": "An alloy is a mixture of two metals, so it is held together by metallic bonds: positive metal ions surrounded by delocalized electrons that carry current and let planes of ions slide past one another instead of shattering. High melting points are not exclusive to ionic solids — pure copper melts at 1085 °C and iron at 1538 °C. A dry ionic lattice does not conduct at all, and an alloy contains no discrete Cu–Zn molecules and no covalent network."}, {"id": 103, "level": "Advanced", "tag": "Ionic Bonding and Formulas", "stem": "A metal M forms an oxide with the formula M₂O₃. Oxygen's oxidation number in an oxide is 2−. Using the criss-cross method, what are the formulas of the compounds M forms with nitrogen (3−) and with sulfur (2−)?", "options": ["M is 2+, which gives M₃N₂ with nitrogen and MS with sulfur", "M is 1+, which gives M₃N with nitrogen and M₂S with sulfur", "M is 3+, which gives M₃N with nitrogen and MS₃ with sulfur", "M is 3+, which gives MN with nitrogen and M₂S₃ with sulfur"], "answer": "D", "answer_text": "M is 3+, which gives MN with nitrogen and M₂S₃ with sulfur", "exp": "Three oxides at 2− total 6−, and two M atoms must balance that, so each M is 3+. Criss-crossing M³⁺ with N³⁻ gives M₃N₃, which reduces to MN, and M³⁺ with S²⁻ gives M₂S₃, already in lowest terms. A 2+ metal would have produced the oxide MO instead of M₂O₃, and M₃N or MS₃ leaves the charges unbalanced."}, {"id": 104, "level": "Advanced", "tag": "Ionic Bonding and Formulas", "stem": "In the ionic puzzle activity a group models beryllium with nitrogen. Beryllium has 2 valence electrons and gives up both; nitrogen has 5 valence electrons and gains 3 to complete its valence shell. What is the smallest whole-atom combination, and how many electrons move in total?", "options": ["Three beryllium atoms give up 6 electrons to two nitrogen atoms, giving Be₃N₂", "Two beryllium atoms give up 4 electrons to three nitrogen atoms, giving Be₂N₃", "Two beryllium atoms give up 6 electrons to three nitrogen atoms, giving Be₂N₃", "One beryllium atom gives up 2 electrons to one nitrogen atom, giving BeN"], "answer": "A", "answer_text": "Three beryllium atoms give up 6 electrons to two nitrogen atoms, giving Be₃N₂", "exp": "Each beryllium releases 2 electrons and each nitrogen needs 3, so the count only balances at the least common multiple of 6: three Be²⁺ supplying 6 electrons to two N³⁻ accepting 6, which is Be₃N₂. A formula of Be₂N₃ would set a 4+ total against a 9− total, and BeN leaves nitrogen one electron short of a full valence shell."}, {"id": 105, "level": "Advanced", "tag": "Ionic Bonding and Formulas", "stem": "A student's worked solution shows two criss-crosses. Line 1: “Ca²⁺ and O²⁻ criss-cross to Ca₂O₂.” Line 2: “Al³⁺ and S²⁻ criss-cross to Al₂S₃, then reduce to AlS.” Which line, if either, needs fixing?", "options": ["Line 1 must reduce to CaO, and line 2 must be reduced one step further to AlS", "Both lines are correct, because criss-crossed subscripts are never reduced afterward", "Line 1 is correct as Ca₂O₂, and line 2 is correct once it is reduced to AlS", "Line 1 must reduce to CaO, while line 2 is already in lowest terms as Al₂S₃"], "answer": "D", "answer_text": "Line 1 must reduce to CaO, while line 2 is already in lowest terms as Al₂S₃", "exp": "Step 4 of the criss-cross method divides the subscripts by a common factor, so Ca₂O₂ becomes CaO, but 2 and 3 share no common factor and Al₂S₃ stands as written. Reducing Al₂S₃ to AlS would pair a 3+ ion with a single 2− ion and leave the compound with a net charge, and leaving Ca₂O₂ keeps a ratio that is really 1:1."}, {"id": 106, "level": "Advanced", "tag": "Naming Ionic Compounds", "stem": "A study guide names AuCl₃ “gold chloride” and CuCl “copper chloride.” Chloride carries a 1− charge, and both gold and copper have more than one possible oxidation number. What names does the unit's naming rule require?", "options": ["Gold (III) chloride and copper (I) chloride, because the metal must balance the chlorides", "Gold (I) chloride and copper (II) chloride, because a metal's charge equals its group number", "Gold chloride and copper chloride are correct, because chloride already fixes the charge", "Gold (III) chloride and copper (II) chloride, because transition metals are always 2+ or 3+"], "answer": "A", "answer_text": "Gold (III) chloride and copper (I) chloride, because the metal must balance the chlorides", "exp": "Three chlorides at 1− each require a 3+ gold, and one chloride requires a 1+ copper, so the names are gold (III) chloride and copper (I) chloride. A metal that can take more than one oxidation number always needs the Roman numeral, so leaving it off makes the name ambiguous, and neither charge can be read off a group number."}, {"id": 107, "level": "Advanced", "tag": "Naming Ionic Compounds", "stem": "Two titanium oxides appear in the naming practice: Ti₂O₃ and TiO₂. Oxide carries a 2− charge and titanium is a transition metal. Name both compounds.", "options": ["Titanium (III) oxide and titanium (IV) oxide, from 6− on two Ti and 4− on one Ti", "Dititanium trioxide and titanium dioxide, using prefixes to count the atoms present", "Titanium (III) oxide and titanium (II) oxide, from the oxygens minus the titaniums", "Titanium (II) oxide and titanium (III) oxide, from the subscript written on titanium"], "answer": "A", "answer_text": "Titanium (III) oxide and titanium (IV) oxide, from 6− on two Ti and 4− on one Ti", "exp": "In Ti₂O₃ the three oxides carry 6−, split between two titaniums, so each is 3+; in TiO₂ the two oxides carry 4−, all on a single titanium, so it is 4+. Prefix names such as titanium dioxide belong to covalent molecules, not ionic compounds, and taking the Roman numeral from the subscript gives (II) and (III), which balances neither formula."}, {"id": 108, "level": "Advanced", "tag": "Naming Ionic Compounds", "stem": "Three sodium compounds appear on the same practice page: Na₂S, Na₂SO₃, and Na₂SO₄. An -ide ending names a monatomic ion, while -ite and -ate name polyatomic ions. Name the three in the order listed.", "options": ["Disodium sulfide, then disodium sulfite, then disodium sulfate", "Sodium sulfate, then sodium sulfite, then sodium sulfide", "Sodium sulfide, then sodium sulfite, then sodium sulfate", "Sodium sulfide, then sodium sulfate, then sodium sulfite"], "answer": "C", "answer_text": "Sodium sulfide, then sodium sulfite, then sodium sulfate", "exp": "S²⁻ standing alone is the monatomic ion sulfide, SO₃²⁻ is sulfite, and SO₄²⁻ is sulfate, with the -ite ending marking the polyatomic ion that carries one fewer oxygen. Ionic names never take prefixes, so disodium is wrong, and naming Na₂S as a sulfate would claim oxygen atoms the formula does not contain."}, {"id": 109, "level": "Advanced", "tag": "Polyatomic Ions", "stem": "A student's worked solution for beryllium nitrate reads: “Beryllium is Be²⁺ and nitrate is NO₃¹⁻. Criss-cross: BeNO₃.” Which correction is right?", "options": ["The formula is Be(NO₃)₃; nitrate carries a 3− charge because it holds three oxygens", "The formula is Be(NO₃)₂; a 2+ ion needs two 1− nitrates, written in parentheses", "The formula BeNO₃ is correct; polyatomic ions never take subscripts or parentheses", "The formula is Be₂NO₃; the subscripts were crossed in the wrong direction here"], "answer": "B", "answer_text": "The formula is Be(NO₃)₂; a 2+ ion needs two 1− nitrates, written in parentheses", "exp": "Beryllium's 2+ must be balanced by two nitrate ions at 1− each, and because nitrate is a group of atoms the subscript goes outside parentheses: Be(NO₃)₂. BeNO₃ leaves a net 1+ charge, Be₂NO₃ sets 4+ against 1−, and nitrate's charge stays 1− no matter how many oxygen atoms it contains."}, {"id": 110, "level": "Advanced", "tag": "Polyatomic Ions", "stem": "Carbonate is CO₃²⁻ and aluminum is 3+. Which pair correctly gives the formula for aluminum carbonate and the name for Cr₂(CO₃)₃?", "options": ["Al₂(CO₃)₃ and chromium (II) carbonate, since chromium is always 2+ in a carbonate", "Al(CO₃)₃ and chromium carbonate, since carbonate needs no Roman numeral at all", "Al₂(CO₃)₃ and chromium (III) carbonate, since three carbonates carry 6− in all", "Al₃(CO₃)₂ and chromium (II) carbonate, since aluminum takes a 2+ oxidation number"], "answer": "C", "answer_text": "Al₂(CO₃)₃ and chromium (III) carbonate, since three carbonates carry 6− in all", "exp": "Two aluminums at 3+ total 6+ and three carbonates at 2− total 6−, so aluminum carbonate is Al₂(CO₃)₃; the identical 2:3 ratio in Cr₂(CO₃)₃ makes chromium 3+, so the name needs the Roman numeral (III). Al(CO₃)₃ leaves a 3− net charge and Al₃(CO₃)₂ leaves 5+, and a (II) label cannot balance the 6− those three carbonates carry."}, {"id": 111, "level": "Advanced", "tag": "Polyatomic Ions", "stem": "Joining one carbon to one nitrogen, carbon brings 4 valence electrons and nitrogen brings 5, and each atom needs 8. The bond equation, bonds = (needed − present) ÷ 2, gives (16 − 9) ÷ 2 = 3.5, which is impossible. What does that tell you, and what formula results with calcium (2+)?", "options": ["One extra electron gives a triple bond and CN¹⁻, so with calcium the formula is Ca(CN)₂", "One electron must be removed to give a double bond and CN¹⁺, so the formula is CaCN", "The two atoms cannot bond at all, so calcium must bond to carbon and to nitrogen separately", "Two extra electrons give a double bond and CN²⁻, so with calcium the formula is CaCN"], "answer": "A", "answer_text": "One extra electron gives a triple bond and CN¹⁻, so with calcium the formula is Ca(CN)₂", "exp": "Adding one electron raises the electrons present to 10, so (16 − 10) ÷ 2 = 3 bonds, a triple bond, and that extra electron leaves cyanide with a 1− charge; criss-crossing Ca²⁺ with CN¹⁻ gives Ca(CN)₂. Removing an electron would leave 8 present and demand 4 bonds between two atoms, and an 11-electron CN²⁻ returns another half-bond answer."}, {"id": 112, "level": "Advanced", "tag": "Covalent Bonding and Lewis Structures", "stem": "Carbon monoxide and carbon dioxide are both built in the bead activity. Use bonds = (valence electrons needed − valence electrons present) ÷ 2, with carbon bringing 4 valence electrons, each oxygen bringing 6, and every atom needing 8. How many bonds are in each molecule?", "options": ["CO has 1 bond, one single bond; CO₂ has 2 bonds, a double bond to one oxygen", "CO has 2 bonds, one double bond; CO₂ has 4 bonds, a double bond to each oxygen", "CO has 3 bonds, one triple bond; CO₂ has 4 bonds, a double bond to each oxygen", "CO has 3 bonds, one triple bond; CO₂ has 2 bonds, a single bond to each oxygen"], "answer": "C", "answer_text": "CO has 3 bonds, one triple bond; CO₂ has 4 bonds, a double bond to each oxygen", "exp": "For CO, present = 4 + 6 = 10 and needed = 8 + 8 = 16, so (16 − 10) ÷ 2 = 3 bonds, and all three sit between the same two atoms as a triple bond. For CO₂, present = 4 + 6 + 6 = 16 and needed = 24, so (24 − 16) ÷ 2 = 4 bonds, shared as one double bond to each oxygen; only 2 bonds would leave carbon with 4 electrons and each oxygen short."}, {"id": 113, "level": "Advanced", "tag": "Covalent Bonding and Lewis Structures", "stem": "A student places hydrogen in the middle of hydrogen cyanide, HCN, reasoning that the central atom is the element with the lowest electronegativity and that hydrogen (2.20) is lower than carbon (2.55) and nitrogen (3.04). Why does that structure fail, and what skeleton is correct?", "options": ["Hydrogen fills its shell with 2 electrons and forms only one bond, so carbon is central: H–C≡N", "Hydrogen is the most electronegative atom of the three listed, so nitrogen is central: H–N≡C", "Hydrogen behaves as a metal here and gives up its electron, leaving a C≡N unit beside a separate H", "Hydrogen forms two bonds but never three, so the skeleton is C–H–N with a double bond on each side"], "answer": "A", "answer_text": "Hydrogen fills its shell with 2 electrons and forms only one bond, so carbon is central: H–C≡N", "exp": "Hydrogen is the standing exception to the lowest-electronegativity rule: a full valence shell of just 2 electrons means it can form only one bond, so it can never be the central atom, and the least electronegative atom other than hydrogen — carbon — takes the middle. Counting electrons, present = 1 + 4 + 5 = 10 and needed = 2 + 8 + 8 = 18, so (18 − 10) ÷ 2 = 4 bonds: one H–C single bond plus a C≡N triple bond."}, {"id": 114, "level": "Advanced", "tag": "Covalent Bonding and Lewis Structures", "stem": "In the Day 1 lab, hydrogen peroxide (H₂O₂) breaks down quickly when yeast is added, filling the test tube with bubbles and warming the glass. Using bonds = (needed − present) ÷ 2, with each hydrogen needing 2 and each oxygen needing 8, how many bonds does H₂O₂ contain and what gas fills the tube?", "options": ["2 bonds, two O–H bonds and no O–O bond, and the gas is oxygen pulled from the air", "3 bonds, H–O–O–H, and the gas is hydrogen, since the O–H bonds break first", "4 bonds, H–O=O–H, and the gas is hydrogen released by the yeast that was added", "3 bonds, H–O–O–H, and the gas is oxygen, since 2 H₂O₂ → 2 H₂O + O₂"], "answer": "D", "answer_text": "3 bonds, H–O–O–H, and the gas is oxygen, since 2 H₂O₂ → 2 H₂O + O₂", "exp": "Present = 1 + 1 + 6 + 6 = 14 and needed = 2 + 2 + 8 + 8 = 20, so (20 − 14) ÷ 2 = 3 bonds: two O–H bonds and one O–O single bond, drawn H–O–O–H. The decomposition is 2 H₂O₂ → 2 H₂O + O₂, so the bubbles are oxygen; no hydrogen gas is produced, and a fourth bond for an O=O inside the molecule is more than the electron count allows."}, {"id": 115, "level": "Advanced", "tag": "Covalent Bonding and Lewis Structures", "stem": "Two molecules from the Lewis-dot practice are boron trichloride (BCl₃) and beryllium hydride (BeH₂). Boron has a full valence shell with 6 electrons and beryllium with 4, while each hydrogen needs 2 and each chlorine needs 8. Which set of structures is right?", "options": ["BCl₃: two single bonds and one double bond to chlorine; BeH₂: one double bond to a single hydrogen atom", "BCl₃: two single bonds and one double bond to reach 8 on boron; BeH₂: one single and one double bond", "BCl₃: three single bonds and no lone pair on boron; BeH₂: two single bonds and no lone pair on beryllium", "BCl₃: three single bonds and one lone pair on boron; BeH₂: two single bonds and one lone pair on beryllium"], "answer": "C", "answer_text": "BCl₃: three single bonds and no lone pair on boron; BeH₂: two single bonds and no lone pair on beryllium", "exp": "Boron stops at 6 electrons, so three single bonds to chlorine use everything it has, and beryllium stops at 4, so two single bonds to hydrogen use everything it has. Putting a lone pair on boron would push it to 8 electrons and strand a chlorine, and double bonds are impossible here because a hydrogen holds only 2 electrons and each chlorine is already full with one bond plus three lone pairs."}, {"id": 116, "level": "Advanced", "tag": "Naming Covalent Molecules", "stem": "A study guide gives two covalent formulas: “xenon hexafluoride → XeP₆” and “silicon tetrahydride → SiCl₄.” Which correction is right?", "options": ["XeP₆ and SiH₄, because xenon bonds to phosphorus and the prefix tetra- means four hydrogens", "Xe₆F and SiH₄, because the prefix hexa- always attaches to the first element in the name", "XeF₆ and SiH₄, because F is fluorine and H is hydrogen, while P and Cl are other elements", "XeF₆ and SiCl₄, because the second name is another way of naming the chloride of silicon"], "answer": "C", "answer_text": "XeF₆ and SiH₄, because F is fluorine and H is hydrogen, while P and Cl are other elements", "exp": "Hexafluoride means six fluorine atoms, so xenon hexafluoride is XeF₆, and tetrahydride means four hydrogen atoms, so silicon tetrahydride is SiH₄. The symbol P stands for phosphorus and Cl for chlorine, and neither element is named in either compound; a prefix attached to the second word of a name never migrates to the first element."}, {"id": 117, "level": "Advanced", "tag": "Naming Covalent Molecules", "stem": "Name these three covalent molecules from the practice set, remembering that if the first element carries no prefix there is only one atom of it and that the second element's name ends in -ide: P₂O₅, N₂O, and CS₂.", "options": ["Diphosphorus pentoxide, then dinitrogen monoxide, then carbon disulfide", "Diphosphorus pentoxide, then dinitrogen monoxide, then monocarbon disulfur", "Phosphorus pentoxide, then nitrogen monoxide, then carbon disulfide", "Diphosphorus hexoxide, then dinitrogen dioxide, then carbon disulfide"], "answer": "A", "answer_text": "Diphosphorus pentoxide, then dinitrogen monoxide, then carbon disulfide", "exp": "P₂O₅ holds two phosphorus and five oxygen atoms, giving diphosphorus pentoxide; N₂O holds two nitrogen and one oxygen, giving dinitrogen monoxide; CS₂ holds one carbon, so no prefix, and two sulfur, giving carbon disulfide. Dropping the di- would name PO₅ and NO instead, hexoxide and dioxide miscount the oxygens, and the second element must end in -ide, so disulfur is not a name."}, {"id": 118, "level": "Advanced", "tag": "Molecular Shapes (VSEPR)", "stem": "A study guide lists three measured bond angles — methane (CH₄) 109.5°, ammonia (NH₃) 107°, and water (H₂O) 104.5° — and then concludes: “So replacing a lone pair with a bonded atom decreases the bond angle.” All three molecules have four electron regions around the central atom. What is the correct statement?", "options": ["The angle depends only on how many atoms are attached, so ammonia and water should be equal", "Replacing a lone pair with a bonded atom increases the angle, since a lone pair repels bonds harder", "The angle is unchanged, since all three molecules have the same four electron regions in every case", "Replacing a lone pair with a bonded atom decreases the angle, since each added atom crowds the rest"], "answer": "B", "answer_text": "Replacing a lone pair with a bonded atom increases the angle, since a lone pair repels bonds harder", "exp": "Water carries two lone pairs at 104.5°, ammonia one at 107°, and methane none at 109.5°, so swapping lone pairs for bonded atoms raises the angle rather than lowering it. A lone pair is held by only one nucleus, so it spreads out and repels the bonding pairs more strongly than a bond repels a bond; the listed angles themselves contradict a “decreases” conclusion, and having four electron regions is what sets the 109.5° starting point."}, {"id": 119, "level": "Advanced", "tag": "Molecular Shapes (VSEPR)", "stem": "Carbon dioxide has two electron regions around the carbon and no lone pairs on it. Sulfur dioxide has three electron regions around the sulfur, one of which is a lone pair. Both compounds have an AB₂ formula. What shapes result?", "options": ["Both are linear, because each central atom has exactly two other atoms attached in the formula", "CO₂ is linear and SO₂ is bent, because the lone pair on sulfur pushes the two bonds together", "CO₂ is linear and SO₂ is trigonal planar, because sulfur carries three electron regions in total", "CO₂ is bent and SO₂ is linear, because a double bond takes up more room than a lone pair does"], "answer": "B", "answer_text": "CO₂ is linear and SO₂ is bent, because the lone pair on sulfur pushes the two bonds together", "exp": "Shape is set by how many electron regions surround the central atom and how many of them are lone pairs: two regions with no lone pair point in opposite directions and give a linear CO₂, while three regions with one lone pair leave the two bonds in a bent arrangement in SO₂. A shape name describes only where the atoms sit, so three regions with a lone pair is bent and not trigonal planar, and matching AB₂ formulas do not guarantee matching shapes."}, {"id": 120, "level": "Advanced", "tag": "Molecular Shapes (VSEPR)", "stem": "Case File 5 lists methanol, H₃C–OH, among the possible poisons. Its carbon has four electron regions and no lone pairs; its oxygen has four electron regions, two of which are lone pairs. What are the shapes around those two atoms?", "options": ["Trigonal pyramidal around the carbon and bent around the oxygen, from one lone pair", "Trigonal planar around the carbon and trigonal pyramidal around the oxygen atom", "Tetrahedral around the carbon and bent around the oxygen, from its two lone pairs", "Tetrahedral around the carbon and linear around the oxygen, from its two lone pairs"], "answer": "C", "answer_text": "Tetrahedral around the carbon and bent around the oxygen, from its two lone pairs", "exp": "Four electron regions with no lone pairs spread to the corners of a tetrahedron, so the three hydrogens and the oxygen sit around carbon at 109.5°. Four regions with two lone pairs leaves the C–O and O–H bonds in a bent arrangement, the same geometry water has. Trigonal pyramidal requires exactly one lone pair on the central atom, and a linear oxygen would need only two electron regions."}, {"id": 121, "level": "Advanced", "tag": "Molecular Shapes (VSEPR)", "stem": "Boron trichloride and nitrogen trifluoride are both AB₃ molecules. Boron ends up with three electron regions and no lone pair, while nitrogen ends up with four electron regions, one of them a lone pair. Which comparison is correct?", "options": ["BCl₃ is trigonal planar and NF₃ is trigonal pyramidal, so only NF₃ has a net dipole", "Both are trigonal pyramidal, so both have a net dipole pointing away from the lone pair", "Both are trigonal planar, so neither has a net dipole even though the bonds are polar", "BCl₃ is trigonal pyramidal and NF₃ is trigonal planar, so only BCl₃ has a net dipole"], "answer": "A", "answer_text": "BCl₃ is trigonal planar and NF₃ is trigonal pyramidal, so only NF₃ has a net dipole", "exp": "Three regions with no lone pair put the three chlorines flat in one plane around boron, where their bond dipoles cancel, so BCl₃ is trigonal planar and nonpolar. The lone pair on nitrogen forms a fourth region and presses the three fluorines to one side into a trigonal pyramid, so their dipoles add up; assigning both molecules the same shape ignores the lone pair, which is the only structural difference between them."}, {"id": 122, "level": "Advanced", "tag": "Electronegativity and Bond Polarity", "stem": "The Day 17 review asks about hydrogen chloride. Electronegativity values: hydrogen 2.20 and chlorine 3.16. Classify the H–Cl bond using the bands — a difference less than 0.5 is nonpolar covalent, between 0.5 and 2 is polar covalent, greater than 2 is ionic — and say which atom carries the partial negative charge.", "options": ["Difference 0.96, nonpolar covalent, with no partial charge on either of the atoms", "Difference 0.96, polar covalent, with δ − on the hydrogen and δ + on the chlorine", "Difference 0.96, polar covalent, with δ − on the chlorine and δ + on the hydrogen", "Difference 5.36, ionic, with a full negative charge sitting on the chlorine atom"], "answer": "C", "answer_text": "Difference 0.96, polar covalent, with δ − on the chlorine and δ + on the hydrogen", "exp": "3.16 − 2.20 = 0.96, which lands in the 0.5-to-2 band, so the bond is polar covalent, and the more electronegative atom — chlorine — pulls the shared pair closer and carries δ −. Adding the two values instead of subtracting produces 5.36, a number no band was written for, and 0.96 sits well above the 0.5 line, so the bond cannot be called nonpolar."}, {"id": 123, "level": "Advanced", "tag": "Electronegativity and Bond Polarity", "stem": "Electronegativity values: hydrogen 2.20, carbon 2.55, nitrogen 3.04, and oxygen 3.44. Rank the C–H, N–H, and O–H bonds from least polar to most polar, giving the difference for each bond.", "options": ["C–H at 0.35, then O–H at 1.24, then N–H at 0.84", "O–H at 1.24, then N–H at 0.84, then C–H at 0.35", "C–H at 0.35, then N–H at 0.84, then O–H at 1.24", "N–H at 0.84, then C–H at 0.35, then O–H at 1.24"], "answer": "C", "answer_text": "C–H at 0.35, then N–H at 0.84, then O–H at 1.24", "exp": "Subtracting each pair gives 2.55 − 2.20 = 0.35 for C–H, 3.04 − 2.20 = 0.84 for N–H, and 3.44 − 2.20 = 1.24 for O–H, so polarity climbs in that order because electronegativity climbs from left to right across Period 2. Starting with 1.24 runs the list from most polar to least, the reverse of what was asked, and any order placing 0.84 or 1.24 ahead of 0.35 misreads the sizes of the differences."}, {"id": 124, "level": "Advanced", "tag": "Electronegativity and Bond Polarity", "stem": "Using the bands from the review — a difference less than 0.5 is nonpolar covalent, between 0.5 and 2 is polar covalent, greater than 2 is ionic — and the values Mg 1.31, Si 1.90, Cl 3.16, and O 3.44, classify the Si–O bond, the Mg–O bond, and the Cl–Cl bond.", "options": ["Si–O 5.34 ionic, Mg–O 4.75 ionic, Cl–Cl 6.32 nonpolar covalent", "Si–O 1.54 ionic, Mg–O 2.13 polar covalent, Cl–Cl 0.00 nonpolar covalent", "Si–O 1.54 polar covalent, Mg–O 2.13 polar covalent, Cl–Cl 0.00 ionic", "Si–O 1.54 polar covalent, Mg–O 2.13 ionic, Cl–Cl 0.00 nonpolar covalent"], "answer": "D", "answer_text": "Si–O 1.54 polar covalent, Mg–O 2.13 ionic, Cl–Cl 0.00 nonpolar covalent", "exp": "3.44 − 1.90 = 1.54 falls between 0.5 and 2, so Si–O is polar covalent; 3.44 − 1.31 = 2.13 is above 2, so Mg–O is ionic; two identical chlorines differ by 0.00 and share equally, which is nonpolar covalent. Adding the electronegativities rather than subtracting them yields 5.34, 4.75 and 6.32, and a difference of 0.00 is the one value that can never describe an ionic bond."}, {"id": 125, "level": "Advanced", "tag": "Molecular Polarity", "stem": "In the packing-peanut lab a polystyrene peanut disappears in acetone while a starch peanut does not; in water the starch peanut dissolves and the polystyrene does not. A student's worked solution reads: “Acetone dissolved the polystyrene, so acetone must be nonpolar.” Acetone's measured dipole moment is 2.9 D, larger than water's 1.85 D. What is the correct reasoning?", "options": ["Acetone is polar and dissolves polystyrene by forming hydrogen bonds to the hydrogens along the polymer chain", "Acetone is polar, so polystyrene must be polar too, which is why the nonpolar starch peanut will not dissolve", "Acetone is polar but has no O–H bond, so its two methyl groups grip polystyrene by dispersion forces", "Acetone is nonpolar, because its 2.9 D value is measured for the bulk liquid and not for one molecule"], "answer": "C", "answer_text": "Acetone is polar but has no O–H bond, so its two methyl groups grip polystyrene by dispersion forces", "exp": "A dipole moment of 2.9 D makes acetone distinctly polar, but it carries no hydrogen attached to nitrogen, oxygen or fluorine, so it cannot hydrogen-bond; its two CH₃ groups let it interact with the nonpolar polystyrene chain through London dispersion forces. Starch is the polar member of the pair — it is what dissolves in water — so calling starch nonpolar or polystyrene polar reverses the lab's own results."}, {"id": 126, "level": "Advanced", "tag": "Molecular Polarity", "stem": "A study guide lists ozone (O₃) as “bent, three electron regions with one lone pair on the central oxygen, therefore nonpolar, because the two outer atoms are identical.” Ozone's measured dipole moment is 0.53 D. Where does that reasoning break down?", "options": ["Identical outer atoms always cancel, so the shape must really be linear rather than bent as listed", "Identical outer atoms cancel only in a symmetric shape, and a bent molecule leaves a net dipole", "The three oxygens are the same element, so every bond dipole in the molecule must be exactly zero", "Ozone is nonpolar as written, and the 0.53 D value belongs to the O₂ molecule rather than to ozone"], "answer": "B", "answer_text": "Identical outer atoms cancel only in a symmetric shape, and a bent molecule leaves a net dipole", "exp": "Bond dipoles cancel only when the outer atoms sit symmetrically around a central point, and a bent molecule is not symmetric. In ozone all three atoms are the same element, so the net dipole of 0.53 D comes from the uneven charge distribution the lone pair and resonance create — central oxygen slightly positive, outer oxygens slightly negative — rather than from unequal sharing. The bent shape in the study guide is right; the error is treating “identical outer atoms” as sufficient, the same shortcut that would wrongly make water nonpolar."}, {"id": 127, "level": "Advanced", "tag": "Molecular Polarity", "stem": "Carbon tetrafluoride (CF₄) and nitrogen trifluoride (NF₃) both contain strongly polar bonds to fluorine. CF₄ is tetrahedral with no lone pair on the carbon, and NF₃ is trigonal pyramidal with one lone pair on the nitrogen. Which molecule is polar overall?", "options": ["Only NF₃, because its three bond dipoles point toward one side and do not cancel out", "Only CF₄, because it holds four polar bonds while NF₃ holds only three of them", "Both of them, because any molecule built from polar bonds is polar whatever its shape", "Neither of them, because fluorine atoms around a central atom always cancel one another"], "answer": "A", "answer_text": "Only NF₃, because its three bond dipoles point toward one side and do not cancel out", "exp": "The four C–F dipoles in CF₄ point to the corners of a tetrahedron, symmetric around the carbon, so they cancel and the molecule is nonpolar; in NF₃ the lone pair pushes the three N–F bonds to one side, so those dipoles add to a net dipole. Counting how many polar bonds a molecule has does not decide the question — CF₄ has the most polar bonds of the two and is still nonpolar."}, {"id": 128, "level": "Advanced", "tag": "Intermolecular Forces", "stem": "In the penny lab, water piles into a tall dome and many drops fit on the coin, while isopropyl rubbing alcohol spreads flatter and fewer drops fit; a drop of the alcohol on the back of the hand also feels colder than a drop of water. Both molecules contain an O–H bond. What accounts for both results?", "options": ["Water is the heavier molecule of the two, so gravity flattens the alcohol drop and speeds its evaporation", "Water hydrogen-bonds through two O–H bonds at once, so it holds together tightly and evaporates slowly", "Isopropyl alcohol is ionic, so its ions repel each other and it evaporates before the water can spread out", "Isopropyl alcohol cannot hydrogen-bond at all, so only London dispersion forces hold its molecules together"], "answer": "B", "answer_text": "Water hydrogen-bonds through two O–H bonds at once, so it holds together tightly and evaporates slowly", "exp": "Each water molecule offers two O–H hydrogens and two lone pairs, so it hydrogen-bonds to several neighbors at once, pulling the drop into a dome and making escape into the gas phase difficult; the alcohol has one O–H plus a bulky nonpolar chain, so fewer hydrogen bonds hold it and it evaporates faster, carrying heat off the skin. Isopropyl alcohol does hydrogen-bond, just less, and it is a covalent molecule rather than ionic — and water is the lighter molecule, not the heavier."}, {"id": 129, "level": "Advanced", "tag": "Intermolecular Forces", "stem": "A study guide states: “Lauric acid, C₁₂H₂₄O₂, is a nonpolar molecule, so the only forces between its molecules are London dispersion forces.” Lauric acid is a fatty acid — an eleven-carbon hydrocarbon chain ending in a –COOH group — and it melts at about 44 °C. Which correction is right?", "options": ["The –COOH end makes the whole molecule ionic, so ionic attraction holds the molecules together", "The molecule is nonpolar exactly as stated, so its melting point near 44 °C comes from dispersion", "The –COOH end carries an O–H bond, so lauric acid molecules also hydrogen-bond at that end", "The long chain makes the molecule polar overall, so dipole-dipole attraction replaces dispersion"], "answer": "C", "answer_text": "The –COOH end carries an O–H bond, so lauric acid molecules also hydrogen-bond at that end", "exp": "Lauric acid is amphiphilic: the long hydrocarbon tail is nonpolar and interacts by London dispersion forces, while the carboxylic acid head carries an O–H and hydrogen-bonds to the heads of neighboring molecules. That extra attraction is why it melts near 44 °C instead of well below room temperature, and the nonpolar tail is why it still refuses to dissolve in water even though it can hydrogen-bond."}, {"id": 130, "level": "Advanced", "tag": "Intermolecular Forces", "stem": "Four small molecules are compared: methane (CH₄), ammonia (NH₃), water (H₂O), and hydrogen sulfide (H₂S). Hydrogen bonds form when hydrogen is bonded to nitrogen, oxygen, or fluorine. Which of the four has the highest boiling point, and why?", "options": ["Ammonia, because nitrogen is the most electronegative of the four central atoms listed here", "Methane, because its four C–H bonds give it the most hydrogen atoms available for bonding", "Hydrogen sulfide, because sulfur is larger and adds more London dispersion forces than oxygen", "Water, because each molecule hydrogen-bonds through two O–H bonds and two lone pairs"], "answer": "D", "answer_text": "Water, because each molecule hydrogen-bonds through two O–H bonds and two lone pairs", "exp": "Only ammonia and water qualify for hydrogen bonding, and water wins because each molecule supplies two O–H hydrogens and two lone pairs to accept them, so it can bond in four directions, while ammonia has three hydrogens but only one lone pair. Methane has no N–H, O–H or F–H bond at all, hydrogen sulfide has S–H rather than O–H, and oxygen rather than nitrogen is the most electronegative atom in this set."}, {"id": 131, "level": "Advanced", "tag": "Properties of Bonded Substances", "stem": "A student's worked solution reads: “Silicon dioxide, SiO₂, is drawn like carbon dioxide as O=Si=O. Since CO₂ is a gas at room temperature, quartz should melt easily too.” Quartz actually melts near 1713 °C. What is wrong with the model?", "options": ["SiO₂ is a covalent network; each silicon bonds to four oxygens in one giant 3-D structure", "SiO₂ is metallic; silicon is a metalloid, and its electron sea is what holds the quartz together", "SiO₂ is molecular as drawn, but O=Si=O molecules are heavy, so dispersion forces are enormous", "SiO₂ is ionic; silicon hands four electrons to two oxygens, and the lattice resists melting"], "answer": "A", "answer_text": "SiO₂ is a covalent network; each silicon bonds to four oxygens in one giant 3-D structure", "exp": "Quartz contains no discrete O=Si=O units: every silicon is bonded to four oxygens and every oxygen bridges two silicons, so the whole crystal is one giant molecule held by intramolecular covalent bonds, and melting it means breaking those bonds, which takes about 1713 °C. Carbon dioxide really is molecular, so only weak forces separate its molecules — which is why two oxides with such similar formulas behave nothing alike."}, {"id": 132, "level": "Advanced", "tag": "Properties of Bonded Substances", "stem": "In the Physical Properties Lab a white waxy unknown is tested three ways: it melts within a minute on a scoopula over a tea candle, it does not dissolve when a few grains are stirred into water, and the conductivity tester never lights. Which classification fits all three results?", "options": ["Ionic, since the sample melted quickly and its ions stayed locked in place instead of conducting", "Covalent molecular and polar, since weak forces melt easily but polar molecules stay out of water", "Covalent network, since its atoms are joined into one giant molecule that releases no ions at all", "Covalent molecular and nonpolar, since weak forces melt easily, water rejects it, no ions form"], "answer": "D", "answer_text": "Covalent molecular and nonpolar, since weak forces melt easily, water rejects it, no ions form", "exp": "A low melting point means only weak intermolecular forces have to be overcome, which rules out both an ionic lattice and a covalent network, since either one takes very high temperatures. Refusing to dissolve in water marks the substance as nonpolar, because like dissolves like, and the dead conductivity tester confirms there are no ions — candle wax fits every result."}, {"id": 133, "level": "Advanced", "tag": "Properties of Bonded Substances", "stem": "In the Physical Properties Lab, dry sodium chloride in a well plate does not light the conductivity tester, but the same salt stirred into water lights it brightly, while sucrose dissolves in water and never lights the tester. Which explanation fits all three observations?", "options": ["Dry salt holds no ions until water creates them, and sucrose creates none because its molecules are too large", "Dry salt conducts poorly only because it is a powder, and sucrose fails because its solution is too dilute", "Water breaks the covalent bonds inside sodium chloride, while sucrose has ionic bonds that water cannot break", "Ions are locked in the dry lattice but move once water frees them; sucrose dissolves as molecules"], "answer": "D", "answer_text": "Ions are locked in the dry lattice but move once water frees them; sucrose dissolves as molecules", "exp": "Charge flows only when charged particles can move: in the dry crystal the Na⁺ and Cl⁻ ions are fixed in place, but water surrounds them — oxygen ends toward the positive ion, hydrogen ends toward the negative ion — and frees them to carry current. Sucrose is covalent molecular, so it dissolves as whole neutral molecules and releases no ions at any concentration, and sodium chloride's own bonds are ionic rather than covalent."}, {"id": 134, "level": "Advanced", "tag": "Oxidation Numbers", "stem": "Two copper salts are compared in the oxidation-number lab: Cu₂SO₄ and CuSO₄. Sulfate carries a 2− charge. What is the oxidation number of copper in each, and what are the two names?", "options": ["1+ and 1+, named dicopper sulfate and copper monosulfate", "1+ and 2+, named copper (I) sulfate and copper (II) sulfate", "2+ and 1+, named copper (II) sulfate and copper (I) sulfate", "2+ and 4+, named copper (II) sulfate and copper (IV) sulfate"], "answer": "B", "answer_text": "1+ and 2+, named copper (I) sulfate and copper (II) sulfate", "exp": "One sulfate at 2− has to be balanced by whatever copper is present, so the two coppers in Cu₂SO₄ split that charge and each is 1+, while the single copper in CuSO₄ must carry the whole 2+. Reversing the names attaches the 2+ to the formula that holds two metal atoms, and ionic compounds never take prefixes such as dicopper or monosulfate."}, {"id": 135, "level": "Advanced", "tag": "Oxidation Numbers", "stem": "Atoms gain or lose valence electrons to reach a complete valence shell. Using that pattern, predict the oxidation numbers of barium (Group 2), nitrogen (Group 15), and iodine (Group 17), then write the formula for the compound of barium with iodine.", "options": ["Ba 2+, N 5+, I 7+, so barium with iodine gives BaI₂", "Ba 2+, N 3−, I 1−, so barium with iodine gives BaI₂", "Ba 2−, N 3+, I 1+, so barium with iodine gives Ba₂I", "Ba 2+, N 3−, I 1−, so barium with iodine gives Ba₂I₂"], "answer": "B", "answer_text": "Ba 2+, N 3−, I 1−, so barium with iodine gives BaI₂", "exp": "Barium holds 2 valence electrons and loses both to reach 2+, nitrogen holds 5 and gains 3 to reach 3−, and iodine holds 7 and gains 1 to reach 1−; criss-crossing Ba²⁺ with I¹⁻ gives BaI₂. Reading the group number straight off as the charge produces 5+ and 7+ for atoms that actually gain electrons, and Ba₂I₂ reduces to BaI, which sets a 2+ ion against a single 1− ion."}, {"id": 136, "level": "Advanced", "tag": "Case File: When Bonds Break", "stem": "Carbon monoxide binds to hemoglobin in the blood roughly 200 times more tightly than oxygen does. Ms. Smith's apartment had a gas oven left open, yet her blood carbon monoxide level came back at less than 2.8% — a normal adult carries less than 2.3%. Why does the strength of that binding matter to the investigation?", "options": ["Because a strong binder never builds up at all, so blood level cannot be measured in this case", "Because a strong binder changes the fatal threshold, so 2.8% may still have been lethal for her", "Because a strong binder is released fast, so her level would have dropped after she was found", "Because a strong binder would build up fast, so a near-normal level means little gas reached her"], "answer": "D", "answer_text": "Because a strong binder would build up fast, so a near-normal level means little gas reached her", "exp": "Carbon monoxide holds onto hemoglobin so tightly that real exposure drives the blood level up quickly and keeps it up — that is exactly why it is dangerous. A near-normal reading therefore means she was never meaningfully exposed, and it does not come back down on its own after death. The 35% fatal threshold is a property of the gas, not something that shifts from person to person."}, {"id": 137, "level": "Advanced", "tag": "Case File: When Bonds Break", "stem": "Case File 5 offers three candidate poisons for the glass of clear liquid on the bedside table: methanol (H₃C–OH, a polar molecule with a noticeable odor), dimethyl mercury (C₂H₆Hg, nonpolar), and diarsenic trioxide (As₂O₃, a solid that is only slightly soluble). To hide in the glass the poison had to dissolve in water and go unnoticed. Investigators smell nothing at the glass, and the laboratory later reports the liquid is pure water. Which conclusion follows?", "options": ["Diarsenic trioxide is ionic, so it dissolves completely and no laboratory test could ever detect it", "Dimethyl mercury is nonpolar, so it dissolves in water best and explains the pure-water lab result", "Methanol dissolves and carries no odor of its own, so it stays the best candidate to test for here", "Methanol would dissolve but would smell, and nothing was dissolved at all, so test for none of them"], "answer": "D", "answer_text": "Methanol would dissolve but would smell, and nothing was dissolved at all, so test for none of them", "exp": "Like dissolves like, so of the three only the polar methanol would mix into water, yet methanol has an odor that nobody at the scene noticed — and the laboratory finding of pure water rules out all three anyway. A nonpolar molecule such as dimethyl mercury will not dissolve in polar water, and a dissolved ionic solid is exactly the kind of thing a laboratory test does find."}, {"id": 138, "level": "Advanced", "tag": "Case File: When Bonds Break", "stem": "In the oxidation-number lab, a drop of Gaviscon gels in a salt solution whose metal ion carries a charge greater than 1+, but stays liquid when the metal ion carries a 1+ charge. The unknown solution made from the victim's sugar bowl leaves the Gaviscon liquid. Investigators suspect thallium sulfate, and sulfate carries a 2− charge. What does the result indicate, and what formula follows?", "options": ["The metal ion is 1+, matching thallium (I), so thallium sulfate is TlSO₄", "The metal ion is 1+, matching thallium (I), so thallium sulfate is Tl₂SO₄", "The metal ion is 2+, matching thallium (II), so thallium sulfate is TlSO₄", "The metal ion is 3+, matching thallium (III), so thallium sulfate is Tl₂(SO₄)₃"], "answer": "B", "answer_text": "The metal ion is 1+, matching thallium (I), so thallium sulfate is Tl₂SO₄", "exp": "No gel means the metal ion carries a 1+ charge, so the thallium present is thallium (I); balancing Tl¹⁺ against SO₄²⁻ takes two thallium ions, giving Tl₂SO₄. TlSO₄ would leave the compound with a net 1− charge, and a 2+ or 3+ ion would have gelled the Gaviscon the way the calcium chloride solution did."}, {"id": 139, "level": "Advanced", "tag": "Case File: When Bonds Break", "stem": "A suspect stated in her interview that she wears white-gold earrings and is allergic to nickel. The earring found at the scene is an alloy of one gold-colored metal and one silver-colored metal. In testing, the gold-colored piece sits in silver nitrate solution with no change, while the silver-colored piece placed in copper (II) sulfate solution becomes coated with a reddish film. A metal replaces only another metal that is less reactive than itself, and copper is more reactive than silver. Which identification fits?", "options": ["Gold and silver; silver plates out of copper sulfate while gold reacts with nothing, matching an alloy", "Copper and silver; copper replaces silver while silver outranks copper, matching a nickel allergy", "Copper and nickel; copper fails to replace silver while nickel outranks copper, matching an allergy", "Gold and nickel; nickel outranks copper while gold cannot replace silver, matching a nickel allergy"], "answer": "D", "answer_text": "Gold and nickel; nickel outranks copper while gold cannot replace silver, matching a nickel allergy", "exp": "Copper does replace silver, so a gold-colored metal that leaves silver nitrate unchanged cannot be copper — it is gold. The silver-colored piece pulled reddish copper out of copper (II) sulfate, so it is more reactive than copper, which fits nickel and rules out silver. White gold made of gold alloyed with nickel is exactly what the suspect described wearing."}, {"id": 140, "level": "Advanced", "tag": "Case File: When Bonds Break", "stem": "Testing the victim's sugar bowl showed sucrose mixed with an ionic compound. Investigators want to know WHICH ionic compound. Which test would best narrow it down?", "options": ["Melt the sample again over a candle and time how long the crystals take to melt", "Repeat the conductivity test on the dissolved sample a second time for confirmation", "Weigh the dry sample on a balance and compare the mass with a pure sucrose sample", "Add a drop of Gaviscon to the dissolved sample and watch whether it gels"], "answer": "D", "answer_text": "Add a drop of Gaviscon to the dissolved sample and watch whether it gels", "exp": "The Gaviscon test responds to the CHARGE of the metal ion — it gels with a 2+ ion and stays liquid with a 1+ ion — so it narrows the field in a way the earlier tests cannot. Repeating conductivity only confirms that ions are present, and mass and melting time say nothing about which metal is there."}];
const L = ['A','B','C','D'];
let levels = new Set(['Beginner','Intermediate','Advanced']);
let tag = '', setLen = 0, order = 'seq';
let queue = [], pos = 0, right = 0, answered = false, missed = [];

const $ = s => document.querySelector(s);
const tags = [...new Set(BANK.map(q=>q.tag))].sort();
$('#tagsel').innerHTML = '<option value="">All skills</option>' +
  tags.map(t=>`<option value="${t}">${t} (${BANK.filter(q=>q.tag===t).length})</option>`).join('');

function pool(){
  return BANK.filter(q => levels.has(q.level) && (!tag || q.tag===tag));
}
function refresh(){
  const n = pool().length;
  $('#avail').textContent = n + ' question' + (n===1?'':'s') + ' match your selection';
  $('#start').disabled = n===0;
}
document.querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{
  const l=b.dataset.l;
  if(levels.has(l)){ if(levels.size===1) return; levels.delete(l); b.classList.remove('on'); }
  else { levels.add(l); b.classList.add('on'); }
  refresh();
});
document.querySelectorAll('.len').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.len').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setLen = +b.dataset.n;
});
document.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ord').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); order = b.dataset.o;
});
$('#tagsel').onchange = e => { tag = e.target.value; refresh(); };
refresh();

$('#start').onclick = ()=>{
  queue = pool().slice();
  if(order==='rand'){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];} }
  if(setLen>0) queue = queue.slice(0,setLen);
  pos=0; right=0; missed=[];
  $('#setup').classList.add('hide'); $('#done').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
};
$('#quit').onclick = finish;
$('#next').onclick = ()=>{ if(!answered) return; pos++; (pos>=queue.length) ? finish() : render(); };

function render(){
  answered=false;
  const q = queue[pos];
  $('#sPos').textContent = (pos+1) + ' / ' + queue.length;
  $('#bar').style.width = (pos/queue.length*100) + '%';
  $('#next').textContent = (pos===queue.length-1) ? 'Finish' : 'Next question';
  $('#next').disabled = true;
  const host = $('#qhost');
  host.innerHTML = '';
  const card = document.createElement('div'); card.className='qcard';
  const head = document.createElement('div'); head.className='qhead';
  head.innerHTML = `<div class="qnum">${q.level.toUpperCase()} · #${q.id}</div><div class="tag">${q.tag}</div>`;
  card.appendChild(head);
  const stem = document.createElement('p'); stem.className='stem'; stem.textContent = q.stem;
  card.appendChild(stem);
  q.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML = `<span class="k">${L[i]}</span>`;
    b.appendChild(document.createTextNode(o));
    b.onclick = ()=>pick(card,q,L[i]);
    card.appendChild(b);
  });
  host.appendChild(card);
  window.scrollTo({top:0,behavior:'smooth'});
}

function pick(card,q,letter){
  if(answered) return; answered=true;
  const ok = letter===q.answer;
  if(ok) right++; else missed.push(q);
  [...card.querySelectorAll('.opt')].forEach((b,i)=>{
    b.disabled=true;
    if(L[i]===q.answer) b.classList.add('correct');
    else if(L[i]===letter) b.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='fb '+(ok?'y':'n');
  const t=document.createElement('b');
  t.textContent = ok ? 'Correct' : `Not quite — the answer is ${q.answer}. ${q.answer_text}`;
  fb.appendChild(t);
  fb.appendChild(document.createTextNode(q.exp));
  card.appendChild(fb);
  $('#sRight').textContent = right;
  $('#sPct').textContent = Math.round(right/(pos+1)*100)+'%';
  $('#next').disabled=false;
}

function finish(){
  $('#quiz').classList.add('hide');
  const n = pos + (answered?1:0);
  const pct = n ? Math.round(right/n*100) : 0;
  let msg = pct>=90 ? 'Exam ready. Move up a level.' :
            pct>=75 ? 'Solid. Clean up the misses below and run it again.' :
            pct>=50 ? 'Getting there — review the skills listed below, then retry.' :
                      'Go back to the notes for the skills below before trying again.';
  const byTag={};
  missed.forEach(q=>{byTag[q.tag]=(byTag[q.tag]||0)+1;});
  const list = Object.entries(byTag).sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<div><b>${c}×</b> ${t}</div>`).join('');
  $('#done').innerHTML =
    `<div class="score">${pct}%</div>
     <p class="sub" style="margin:8px 0 2px">${right} of ${n} correct</p>
     <p style="margin:6px 0 18px">${msg}</p>
     <button class="primary" onclick="location.reload()">Practice again</button>
     ${list?`<div class="miss"><h3>Skills to review</h3>${list}</div>`:''}`;
  $('#done').classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
