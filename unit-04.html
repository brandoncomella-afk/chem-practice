<script>
const BANK = [{"id": 1, "level": "Beginner", "tag": "Types of Bonds", "stem": "In a covalent bond, two atoms share electrons. A covalent bond generally occurs between:", "options": ["two metals, such as copper and zinc", "two nonmetals, such as carbon and oxygen", "a metal and a nonmetal, such as sodium and chlorine", "a metal and a noble gas, such as zinc and argon"], "answer": "B", "answer_text": "two nonmetals, such as carbon and oxygen", "exp": "Covalent bonds generally occur between two nonmetals, which share electrons rather than transferring them. Sodium with chlorine is a metal joined to a nonmetal, which gives an ionic bond; copper with zinc is two metals, which gives a metallic bond; and the noble gases already have a complete valence shell, so they generally form no compounds at all."}, {"id": 2, "level": "Beginner", "tag": "Types of Bonds", "stem": "An ionic bond forms when one atom steals electrons from another. Ionic bonds generally form between:", "options": ["two nonmetals", "a metal and a nonmetal", "a metal and a metalloid", "two metals"], "answer": "B", "answer_text": "a metal and a nonmetal", "exp": "Ionic bonds generally form between metals and nonmetals: the metal loses valence electrons and the nonmetal gains them, so both reach a complete valence shell. Two nonmetals share electrons in a covalent bond and two metals form a metallic bond, while metalloids are set aside in a noted exception rather than used as a bonding rule."}, {"id": 3, "level": "Beginner", "tag": "Types of Bonds", "stem": "In a metallic bond, the valence electrons of the metal atoms are:", "options": ["transferred completely from one metal to another", "locked in place on one metal atom apiece", "delocalized among all of the metal atoms", "shared by exactly two metal atoms at a time"], "answer": "C", "answer_text": "delocalized among all of the metal atoms", "exp": "A metallic bond forms from the attraction of positive metal ions and their negative sea of electrons, and the official name for those electrons is delocalized — they are free to move between any of the atoms in the whole piece of metal. Because they are not locked onto one atom, not handed over permanently, and not restricted to a pair of atoms, a metal can conduct electricity and be hammered into a new shape."}, {"id": 4, "level": "Beginner", "tag": "Types of Bonds", "stem": "Which of these substances is held together by ionic bonds?", "options": ["CO₂, carbon dioxide", "K₂S, potassium sulfide", "CH₄, methane", "N₂, molecular nitrogen"], "answer": "B", "answer_text": "K₂S, potassium sulfide", "exp": "Potassium is a metal and sulfur is a nonmetal, so K₂S is the metal-plus-nonmetal pairing that gives an ionic bond. Carbon dioxide, molecular nitrogen, and methane are each built only from nonmetals, so every bond in them is covalent."}, {"id": 5, "level": "Beginner", "tag": "Types of Bonds", "stem": "An alloy such as brass is best described as:", "options": ["a mixture of metals joined by metallic bonds", "a metal and a nonmetal joined by ionic bonds", "two nonmetals that share electrons covalently", "a pure element that was melted and cooled again"], "answer": "A", "answer_text": "a mixture of metals joined by metallic bonds", "exp": "An alloy is a mixture of metals, so brass — copper and zinc — is still held together by metallic bonding and still shows luster, malleability, conductivity, and ductility. A metal joined to a nonmetal would be an ionic compound, two nonmetals sharing electrons would be a covalent molecule, and a mixture of two elements is not a pure element no matter how it was heated."}, {"id": 6, "level": "Beginner", "tag": "Ionic Bonding and Formulas", "stem": "The crisscross method starts by writing the oxidation numbers as superscripts. The next steps are to:", "options": ["multiply the two charges and use that product", "erase the charges, then swap them as subscripts", "keep the +/- charges and write them as subscripts", "add the two charges together and use that total"], "answer": "B", "answer_text": "erase the charges, then swap them as subscripts", "exp": "The four crisscross steps are: write the oxidation numbers as superscripts, erase the +/- charges, swap the numbers to the other atom as subscripts, then reduce and drop any 1s. Adding or multiplying the two charges is not part of the method, and the charges are erased rather than carried down into the finished formula."}, {"id": 7, "level": "Beginner", "tag": "Ionic Bonding and Formulas", "stem": "Lithium forms Li¹⁺ and oxygen forms O²⁻. What is the formula for lithium oxide?", "options": ["LiO₂", "Li₂O₂", "LiO", "Li₂O"], "answer": "D", "answer_text": "Li₂O", "exp": "Crisscrossing Li¹⁺ with O²⁻ gives Li₂O₁, and dropping the 1 leaves Li₂O, so two 1+ ions balance one 2- ion. LiO₂ puts the subscripts on the wrong atoms, LiO leaves a leftover negative charge, and Li₂O₂ adds an extra oxygen that nothing balances."}, {"id": 8, "level": "Beginner", "tag": "Ionic Bonding and Formulas", "stem": "Calcium forms Ca²⁺ and sulfur forms S²⁻. What is the formula for calcium sulfide?", "options": ["Ca₂S₂", "CaS", "Ca₂S", "CaS₂"], "answer": "B", "answer_text": "CaS", "exp": "Crisscrossing Ca²⁺ with S²⁻ gives Ca₂S₂, and the last crisscross step says to reduce by dividing both subscripts by 2, which leaves CaS. Ca₂S₂ is the un-reduced answer, while CaS₂ and Ca₂S do not balance a 2+ charge against a 2- charge."}, {"id": 9, "level": "Beginner", "tag": "Ionic Bonding and Formulas", "stem": "Magnesium forms Mg²⁺ and nitrogen forms N³⁻. What is the formula for magnesium nitride?", "options": ["Mg₃N", "Mg₂N₃", "MgN", "Mg₃N₂"], "answer": "D", "answer_text": "Mg₃N₂", "exp": "Crisscross moves the 3 from N³⁻ down onto magnesium and the 2 from Mg²⁺ down onto nitrogen, giving Mg₃N₂, in which three 2+ charges balance two 3- charges. Mg₂N₃ crisscrosses in the wrong direction, and MgN and Mg₃N both leave the total charge uneven."}, {"id": 10, "level": "Beginner", "tag": "Ionic Bonding and Formulas", "stem": "In a finished ionic compound, the total positive charge and the total negative charge must:", "options": ["be equal, so the compound is neutral overall", "be equal to the number of atoms in the formula", "add up to a small negative overall charge", "add up to a small positive overall charge"], "answer": "A", "answer_text": "be equal, so the compound is neutral overall", "exp": "Ions combine in whatever ratio makes the positive and negative charges cancel, which is exactly what the crisscross method produces — in Al₂O₃ two 3+ ions balance three 2- ions. A completed ionic compound is neutral, so it cannot keep a leftover positive or negative charge, and the charges are not a count of atoms."}, {"id": 11, "level": "Beginner", "tag": "Naming Ionic Compounds", "stem": "What is the name of MgO?", "options": ["magnesium (II) oxide", "magnesium oxygen", "magnesium oxide", "monomagnesium monoxide"], "answer": "C", "answer_text": "magnesium oxide", "exp": "An ionic compound is named metal first, then the nonmetal with an -ide ending, so MgO is magnesium oxide. Prefixes such as mono- belong only to covalent molecules, magnesium is not a transition metal so it never takes a Roman numeral, and the nonmetal must be renamed oxide rather than left as oxygen."}, {"id": 12, "level": "Beginner", "tag": "Naming Ionic Compounds", "stem": "Which of these metals needs a Roman numeral in the names of its compounds?", "options": ["sodium", "iron", "aluminum", "zinc"], "answer": "B", "answer_text": "iron", "exp": "Iron is a transition metal that can have more than one oxidation number, so its compounds are named iron (II) or iron (III) to show which charge the iron is using. Zinc, aluminum, and sodium each form only one common ion, so zinc chloride, aluminum oxide, and sodium chloride need no numeral."}, {"id": 13, "level": "Beginner", "tag": "Naming Ionic Compounds", "stem": "The copper ion in CuCl₂ has an oxidation number of 2+. What is the name of CuCl₂?", "options": ["monocopper dichloride", "copper chloride", "copper (I) chloride", "copper (II) chloride"], "answer": "D", "answer_text": "copper (II) chloride", "exp": "Copper is a transition metal with more than one oxidation number, so the Roman numeral II states that the copper ion here is 2⁺. Copper (I) chloride is a different compound, CuCl; leaving the numeral off does not say which copper ion is present; and prefixes such as di- are never used in ionic names."}, {"id": 14, "level": "Beginner", "tag": "Naming Ionic Compounds", "stem": "Naming ionic compounds is easier than naming covalent molecules because ionic names:", "options": ["use a prefix only when there are three or more ions", "always end the metal's name with the -ide ending", "list the nonmetal first and then the metal second", "do not need prefixes to describe the number of ions"], "answer": "D", "answer_text": "do not need prefixes to describe the number of ions", "exp": "The rule is that you do not need prefixes to describe the number of ions, because the balanced charges already fix the ratio — CaCl₂ is simply calcium chloride. The -ide ending goes on the nonmetal rather than the metal, the metal is always written first, and prefixes are not brought back for larger numbers of ions."}, {"id": 15, "level": "Beginner", "tag": "Naming Ionic Compounds", "stem": "Iron (III) oxide contains oxide ions with an oxidation number of 2-. What is its formula?", "options": ["Fe₂O₃", "FeO₃", "FeO", "Fe₃O₂"], "answer": "A", "answer_text": "Fe₂O₃", "exp": "The Roman numeral III says the iron ion is 3⁺, and crisscrossing Fe³⁺ with O²⁻ gives Fe₂O₃, where two 3+ charges balance three 2- charges. Fe₃O₂ crisscrosses in the wrong direction, FeO would be iron (II) oxide, and FeO₃ would require an iron ion with a 6+ charge."}, {"id": 16, "level": "Beginner", "tag": "Polyatomic Ions", "stem": "The polyatomic ion sulfate is written SO₄ before its charge is added. Its charge is:", "options": ["2-", "2+", "3-", "1-"], "answer": "A", "answer_text": "2-", "exp": "Sulfate has a 2- charge, which is why it pairs one-to-one with a 2+ metal in MgSO₄ but needs two potassium ions in K₂SO₄. A 1- charge belongs to ions such as nitrate and hydroxide, a 3- charge belongs to phosphate, and sulfate bonds to positive metals because it is itself negative."}, {"id": 17, "level": "Beginner", "tag": "Polyatomic Ions", "stem": "Which of these polyatomic ions carries a positive charge?", "options": ["carbonate", "nitrate", "ammonium", "hydroxide"], "answer": "C", "answer_text": "ammonium", "exp": "Ammonium, NH₄¹⁺, is the positive polyatomic ion, which is why it takes the metal's place at the front of formulas such as (NH₄)₂S and (NH₄)₃PO₄. Hydroxide and nitrate each carry a 1- charge and carbonate carries a 2-, so all three are negative ions that must bond to a positive metal."}, {"id": 18, "level": "Beginner", "tag": "Polyatomic Ions", "stem": "Calcium hydroxide is written Ca(OH)₂. The parentheses are there to show that:", "options": ["the compound contains two calcium ions", "calcium and oxygen swap their charges", "the whole hydroxide ion is taken twice", "the oxygen atom alone is taken twice"], "answer": "C", "answer_text": "the whole hydroxide ion is taken twice", "exp": "Hydroxide, OH¹⁻, is one polyatomic ion, so the subscript 2 outside the parentheses means two complete OH units are needed to balance one Ca²⁺ ion. The 2 does not apply to the oxygen by itself, there is only one calcium ion in the formula, and parentheses have nothing to do with swapping charges."}, {"id": 19, "level": "Beginner", "tag": "Polyatomic Ions", "stem": "A polyatomic ion such as nitrate is a group of atoms that is:", "options": ["held together by ionic bonds and is neutral", "covalently bonded and has an overall charge", "loosely mixed together inside a solid sample", "a single metal atom that has lost electrons"], "answer": "B", "answer_text": "covalently bonded and has an overall charge", "exp": "Sometimes covalently bonded compounds have an overall charge, and that charged group is a polyatomic ion: nitrate, NO₃¹⁻, is a nitrogen and three oxygens sharing electrons with one extra electron overall. The charge on a polyatomic ion works like an oxidation number, so the group is not neutral, is not one metal atom, and is not a mixture."}, {"id": 20, "level": "Beginner", "tag": "Covalent Bonding and Lewis Structures", "stem": "Number of bonds = (valence electrons needed − valence electrons present) / 2. In F₂, 16 electrons are needed and 14 are present. How many bonds form?", "options": ["3", "4", "2", "1"], "answer": "D", "answer_text": "1", "exp": "(16 − 14)/2 = 2/2 = 1, so the two fluorine atoms are joined by a single bond, written F - F. Answering 2 comes from stopping at the subtraction and forgetting that each bond uses 2 electrons, and 3 or 4 bonds would take far more missing electrons than these atoms have."}, {"id": 21, "level": "Beginner", "tag": "Covalent Bonding and Lewis Structures", "stem": "In a Lewis dot structure, each covalent bond is made of:", "options": ["1 electron, drawn as one dot or one line", "4 electrons, drawn as four dots or one line", "2 electrons, drawn as two dots or one line", "8 electrons, one full valence shell per bond"], "answer": "C", "answer_text": "2 electrons, drawn as two dots or one line", "exp": "Each bond is made of 2 electrons, and a structure is changed into a structural formula by replacing every two dots with a line. A single electron cannot make a bond, four electrons would be a double bond rather than one bond, and eight electrons is a complete valence shell, not a single bond."}, {"id": 22, "level": "Beginner", "tag": "Covalent Bonding and Lewis Structures", "stem": "When you draw a Lewis dot structure for a molecule, the central atom is:", "options": ["the least electronegative element, never hydrogen", "the most electronegative element of those present", "always a hydrogen atom, whatever else is present", "whichever element has the largest subscript shown"], "answer": "A", "answer_text": "the least electronegative element, never hydrogen", "exp": "The central atom is the element with the lowest electronegativity, with one standing exception: hydrogen fills its valence shell with 2 electrons and forms only one bond, so it always sits on the outside. In water, oxygen is central and the two hydrogens are terminal, so picking the most electronegative atom, picking hydrogen, or counting subscripts all fail."}, {"id": 23, "level": "Beginner", "tag": "Covalent Bonding and Lewis Structures", "stem": "In a Lewis dot structure, hydrogen has a full valence shell when it has:", "options": ["8 electrons", "2 electrons", "6 electrons", "4 electrons"], "answer": "B", "answer_text": "2 electrons", "exp": "Hydrogen has a full valence shell with 2 electrons, so it forms exactly one bond and stays on the outside of a molecule. Beryllium is the exception that is full at 4 electrons and boron the exception that is full at 6, while 8 electrons is the full shell for most other representative elements."}, {"id": 24, "level": "Beginner", "tag": "Covalent Bonding and Lewis Structures", "stem": "Molecular nitrogen (N₂) has three bonds between its two atoms. Its structural formula is written:", "options": ["N = N", "N ⋯ N", "N ≡ N", "N - N"], "answer": "C", "answer_text": "N ≡ N", "exp": "Every two shared electrons become one line, so three shared pairs are drawn as three lines: N ≡ N. One line is a single bond and two lines a double bond, and neither gives both nitrogen atoms a complete valence shell, while a dotted line is not used for a covalent bond at all."}, {"id": 25, "level": "Beginner", "tag": "Naming Covalent Molecules", "stem": "What is the name of CS₂?", "options": ["carbon sulfide", "dicarbon sulfide", "monocarbon sulfur", "carbon disulfide"], "answer": "D", "answer_text": "carbon disulfide", "exp": "Covalent molecules use prefixes for the number of each type of atom and the second element ends in -ide, so CS₂ is carbon disulfide. Leaving off di- hides the two sulfurs, dicarbon sulfide would be C₂S, and the second element must be renamed sulfide rather than left as sulfur."}, {"id": 26, "level": "Beginner", "tag": "Naming Covalent Molecules", "stem": "What is the formula for diphosphorus pentoxide?", "options": ["P₅O₂", "PO₅", "P₂O₅", "P₂O₂"], "answer": "C", "answer_text": "P₂O₅", "exp": "Use the prefixes to write the subscripts: di- gives two phosphorus atoms and pent- gives five oxygens, so the formula is P₂O₅. P₅O₂ reverses the two prefixes, P₂O₂ ignores the pent- entirely, and PO₅ drops the di- that the name states."}, {"id": 27, "level": "Beginner", "tag": "Naming Covalent Molecules", "stem": "In the name silicon tetrachloride, the prefix tetra- tells you that the molecule contains:", "options": ["5 chlorine atoms", "4 chlorine atoms", "4 silicon atoms", "3 chlorine atoms"], "answer": "B", "answer_text": "4 chlorine atoms", "exp": "Tetra- means four, so silicon tetrachloride is SiCl₄, with one silicon and four chlorines. Tri- would mean three and penta- would mean five, and the prefix is attached to the chlorine part of the name, so it counts chlorine atoms rather than silicon atoms."}, {"id": 28, "level": "Beginner", "tag": "Naming Covalent Molecules", "stem": "In the name of a covalent molecule, if the first element has no prefix at all, the formula contains:", "options": ["any number of that element", "one atom of that element", "no atoms of that element", "two atoms of that element"], "answer": "B", "answer_text": "one atom of that element", "exp": "The rule is that if the first atom has no prefix, there is only one of that atom, which is why sulfur trioxide is SO₃ rather than S₂O₃. A missing prefix never stands for two atoms, for an unknown number, or for none at all — an element that is named must be present."}, {"id": 29, "level": "Beginner", "tag": "Molecular Shapes (VSEPR)", "stem": "In VSEPR, the electron regions counted around a central atom include:", "options": ["the bonds and the lone pairs", "only the bonds to other atoms", "only the protons in the nucleus", "only the lone pairs of electrons"], "answer": "A", "answer_text": "the bonds and the lone pairs", "exp": "The note states that the electron regions include lone pairs of electrons and bonds, and the total number of regions is what sets the shape. Counting only bonds would make ammonia and methane the same shape, counting only lone pairs would leave carbon dioxide with no shape at all, and protons sit in the nucleus and take no part in VSEPR."}, {"id": 30, "level": "Beginner", "tag": "Molecular Shapes (VSEPR)", "stem": "Carbon dioxide has 2 electron regions and no lone pairs on the central carbon. Its molecular geometry is:", "options": ["trigonal planar", "linear", "bent", "trigonal pyramidal"], "answer": "B", "answer_text": "linear", "exp": "Two electron regions push as far apart as they can, putting the two oxygens on opposite sides of the carbon, which is the linear shape. A bent shape requires a lone pair on the central atom, while trigonal planar needs three electron regions and trigonal pyramidal needs four."}, {"id": 31, "level": "Beginner", "tag": "Molecular Shapes (VSEPR)", "stem": "Which molecule has a trigonal pyramidal molecular geometry?", "options": ["NH₃, ammonia", "CO₂, carbon dioxide", "H₂O, water", "CH₄, methane"], "answer": "A", "answer_text": "NH₃, ammonia", "exp": "Ammonia has 4 electron regions around the nitrogen — three bonds and one lone pair — so the three hydrogens are pushed down into a trigonal pyramid. Methane has 4 regions with no lone pairs and is tetrahedral, water has 4 regions with two lone pairs and is bent, and carbon dioxide has only 2 regions and is linear."}, {"id": 32, "level": "Beginner", "tag": "Molecular Shapes (VSEPR)", "stem": "Methane is tetrahedral, ammonia is trigonal pyramidal, and water is bent. Which of the three has the largest bond angle?", "options": ["methane", "ammonia", "all three angles are the same", "water"], "answer": "A", "answer_text": "methane", "exp": "All three molecules have four electron regions, but a lone pair spreads out and pushes harder than a bonded atom, so each lone pair squeezes the remaining bonds closer together. Methane has no lone pairs and the widest angle at about 109.5°, ammonia has one lone pair and closes to about 107°, and water has two lone pairs and closes further to about 104.5°."}, {"id": 33, "level": "Beginner", "tag": "Electronegativity and Bond Polarity", "stem": "Two atoms with the same electronegativity share their electrons equally. The bond between them is:", "options": ["a polar covalent bond", "a nonpolar covalent bond", "a metallic bond between ions", "an ionic bond with full charges"], "answer": "B", "answer_text": "a nonpolar covalent bond", "exp": "If two atoms have the same electronegativity they share their electrons equally, and that is the definition of a nonpolar covalent bond, as in F₂ or N₂. A polar covalent bond requires unequal sharing, an ionic bond requires electrons to be taken outright, and a metallic bond requires metal atoms with a sea of electrons."}, {"id": 34, "level": "Beginner", "tag": "Electronegativity and Bond Polarity", "stem": "In a polar covalent bond, the more electronegative atom carries:", "options": ["a full negative charge of 1-", "no charge of any kind at all", "a partial positive charge, δ +", "a partial negative charge, δ -"], "answer": "D", "answer_text": "a partial negative charge, δ -", "exp": "Because of unequal sharing, the more electronegative atom holds the shared electrons closer and takes on a partial negative charge, δ -, leaving the less electronegative atom δ +. The symbol δ means partial, so this is not a full 1- charge as an ion would have, and an atom with no charge at all would mean the sharing was equal."}, {"id": 35, "level": "Beginner", "tag": "Electronegativity and Bond Polarity", "stem": "Use these bands: a difference less than 0.5 is nonpolar covalent, between 0.5 and 2 is polar covalent, and greater than 2 is ionic. The difference in electronegativity between nitrogen and hydrogen is 0.9, so the N–H bond is:", "options": ["polar covalent, with nitrogen δ − and hydrogen δ +", "metallic, with the electrons pooled between the two atoms", "ionic, with an electron transferred from hydrogen to nitrogen", "nonpolar covalent, with the pair shared equally between them"], "answer": "A", "answer_text": "polar covalent, with nitrogen δ − and hydrogen δ +", "exp": "A difference of 0.9 falls in the middle band, between 0.5 and 2, so nitrogen and hydrogen share unequally in a polar covalent bond, with the more electronegative nitrogen carrying δ −. Equal sharing would need a gap under 0.5, an outright transfer would need a gap over 2, and metallic bonding happens between metal atoms rather than being predicted from a difference at all."}, {"id": 36, "level": "Beginner", "tag": "Electronegativity and Bond Polarity", "stem": "Two elements that both have a high electronegativity and a high first ionization energy will form:", "options": ["an ionic bond, since one atom steals from the other", "no bond at all, since two nonmetals always repel", "a metallic bond, since they share a sea of electrons", "a covalent bond, since both hold electrons tightly"], "answer": "D", "answer_text": "a covalent bond, since both hold electrons tightly", "exp": "High electronegativity plus high first ionization energy is the nonmetal profile, so neither element will hand over an electron and they share instead, giving a covalent bond. Stealing electrons to form ions needs one element with a low electronegativity and low ionization energy, a sea of electrons needs metals, and two nonmetals certainly do bond — that is what a covalent molecule is."}, {"id": 37, "level": "Beginner", "tag": "Molecular Polarity", "stem": "A covalent molecule whose atoms are arranged symmetrically around a central point is:", "options": ["polar, because symmetry spreads the charge", "nonpolar, even if its bonds are polar", "polar, because its bonds are polar", "nonpolar only if its bonds are also nonpolar"], "answer": "B", "answer_text": "nonpolar, even if its bonds are polar", "exp": "The rule is that atoms in a molecule can have partial charges and still not be polar: if the atoms are symmetrical around a central point, the molecule is nonpolar. Carbon dioxide is the example — each carbon-to-oxygen bond is polar, but the linear shape balances them, so polar bonds by themselves do not make a polar molecule."}, {"id": 38, "level": "Beginner", "tag": "Molecular Polarity", "stem": "Following the rule that like dissolves like, a polar substance will dissolve in:", "options": ["a nonpolar substance, such as candle wax", "no liquid at all, only in a melted solid", "any liquid at all, polar or nonpolar", "another polar substance, such as water"], "answer": "D", "answer_text": "another polar substance, such as water", "exp": "Polar substances dissolve into other polar substances, and nonpolar substances dissolve only in nonpolar substances, which is why sucrose dissolves in water but lauric acid does not. A nonpolar solvent cannot pull a polar solid apart, and no single solvent dissolves everything."}, {"id": 39, "level": "Beginner", "tag": "Molecular Polarity", "stem": "Ozone (O₃) is a bent molecule with a lone pair on the central oxygen atom. Ozone is therefore:", "options": ["polar, because a bent shape is not symmetrical", "nonpolar, because the bend cancels the charges", "nonpolar, because all three atoms are oxygen", "polar, because each oxygen holds a full charge"], "answer": "A", "answer_text": "polar, because a bent shape is not symmetrical", "exp": "A bend in a molecule may create polarity that was not present in a linear molecule, and the lone pair on the central oxygen leaves ozone with an uneven distribution of electrons, so ozone is polar. Being made of three atoms of one element does not make a molecule symmetrical around a central point, a bend creates polarity instead of cancelling it, and the charges involved are partial rather than full."}, {"id": 40, "level": "Beginner", "tag": "Intermolecular Forces", "stem": "Hydrogen bonds form between hydrogen and which three elements?", "options": ["oxygen, nitrogen, or fluorine", "oxygen, chlorine, or sodium", "carbon, nitrogen, or phosphorus", "carbon, oxygen, or chlorine"], "answer": "A", "answer_text": "oxygen, nitrogen, or fluorine", "exp": "Hydrogen bonds form between hydrogen and oxygen, nitrogen, or fluorine, which is why water molecules hold onto one another so strongly and why ammonia molecules do the same. Carbon, sulfur, chlorine, and sodium are not on that list, so a molecule whose hydrogens are bonded only to carbon cannot form hydrogen bonds."}, {"id": 41, "level": "Beginner", "tag": "Intermolecular Forces", "stem": "Which of these attractions between particles is the weakest?", "options": ["dipole-dipole attractions", "ionic attractions in salt", "hydrogen bonds to oxygen", "London dispersion forces"], "answer": "D", "answer_text": "London dispersion forces", "exp": "London dispersion forces come from temporary, shifting partial charges in the electron cloud, so they are the weakest of these attractions — paraffin wax is held together by them and melts the most easily. Dipole-dipole attractions act between permanent partial charges, hydrogen bonds are a specially strong kind of dipole-dipole attraction, and ionic attractions are the strongest of all."}, {"id": 42, "level": "Beginner", "tag": "Intermolecular Forces", "stem": "Polar molecules are attracted to one another mainly by:", "options": ["metallic bonds from a shared sea of loose electrons", "London dispersion forces from temporary charges", "covalent bonds formed by sharing electron pairs", "dipole-dipole attractions between partial charges"], "answer": "D", "answer_text": "dipole-dipole attractions between partial charges", "exp": "Polar molecules are attracted to each other because of their dipole-dipole attraction: the δ + end of one molecule is pulled toward the δ - end of the next. London dispersion forces depend on temporary rather than permanent partial charges, while metallic and covalent bonds hold atoms together inside a substance rather than holding separate molecules to one another."}, {"id": 43, "level": "Beginner", "tag": "Intermolecular Forces", "stem": "An intermolecular force is an attraction that acts:", "options": ["between two electrons in one bond", "between separate molecules", "between atoms inside one molecule", "between protons and neutrons"], "answer": "B", "answer_text": "between separate molecules", "exp": "Intermolecular means between molecules, so these attractions hold one whole molecule to its neighbors and must be overcome to melt or boil a covalent molecular substance. Attractions between the atoms inside a single molecule are intramolecular — the covalent bonds themselves — and forces inside the nucleus or within one bond are not what the word describes."}, {"id": 44, "level": "Beginner", "tag": "Properties of Bonded Substances", "stem": "A white crystalline solid has a high melting point, dissolves in water, and conducts electricity once dissolved. This is the profile of:", "options": ["a pure metal such as copper metal", "a covalent network solid like graphite", "a nonpolar covalent molecule like wax", "an ionic compound such as a salt"], "answer": "D", "answer_text": "an ionic compound such as a salt", "exp": "Ionic compounds have high melting points, dissolve in water, and conduct electricity in that solution because the ions separate and become free to move. Graphite does not dissolve in water at all, so it cannot conduct in solution even though it conducts as a solid; wax melts easily and will not dissolve; and a metal conducts while dry but does not dissolve."}, {"id": 45, "level": "Beginner", "tag": "Properties of Bonded Substances", "stem": "Which set of properties describes a typical metal?", "options": ["does not conduct, malleable, high melting point", "conducts electricity, brittle, low melting point", "does not conduct at all, brittle, very low melting point", "conducts electricity, malleable, high melting point"], "answer": "D", "answer_text": "conducts electricity, malleable, high melting point", "exp": "The delocalized sea of electrons lets a metal conduct heat and electricity and lets its atoms slide past one another, so metals are malleable, ductile, and lustrous, and the strong pull between the metal ions and that sea gives metals high melting points. A brittle solid that will not conduct as a solid fits an ionic crystal instead, and a low melting point fits a covalent molecular substance such as candle wax."}, {"id": 46, "level": "Beginner", "tag": "Properties of Bonded Substances", "stem": "In a covalent network such as diamond, the whole sample is joined together by intramolecular bonds. As a result, the network has:", "options": ["a high melting point and no intermolecular bonds", "a low melting point and no intermolecular bonds at all", "a low melting point and many strong hydrogen bonds", "a high melting point and many dipole-dipole bonds"], "answer": "A", "answer_text": "a high melting point and no intermolecular bonds", "exp": "In diamond every carbon is covalently bonded to four others throughout the crystal, so there are no separate molecules and no intermolecular bonds at all. Melting it means breaking covalent bonds, which takes a great deal of energy, so the melting point is high rather than low, and hydrogen bonds and dipole-dipole attractions never come into it."}, {"id": 47, "level": "Beginner", "tag": "Properties of Bonded Substances", "stem": "In the physical properties lab, a waxy white solid melted quickly on the scoopula, did not dissolve in water, and did not conduct. It is best classified as:", "options": ["an ionic crystalline solid like salt", "a polar covalent molecular solid", "a covalent network solid like graphite", "a nonpolar covalent molecular solid"], "answer": "D", "answer_text": "a nonpolar covalent molecular solid", "exp": "A low melting point means only weak intermolecular forces hold the molecules together, and failing to dissolve in water means the substance is nonpolar, since polar substances dissolve in polar substances. Sucrose is polar covalent molecular and does dissolve, salt would dissolve and then conduct, and graphite would never have melted on the scoopula."}, {"id": 48, "level": "Beginner", "tag": "Oxidation Numbers", "stem": "The oxidation number of an atom is:", "options": ["the charge on the ion after electrons are moved", "the count of bonds the atom is able to form at once", "the number of protons the atom holds in its nucleus", "the mass of one atom compared with a carbon-12 atom"], "answer": "A", "answer_text": "the charge on the ion after electrons are moved", "exp": "The definition is that the oxidation number is the charge of the ion once the atom gains or loses electrons, so magnesium becomes Mg²⁺ and chlorine becomes Cl¹⁻. The proton count is the atomic number, how many bonds an atom can form is set by its valence electrons, not by its charge, and comparing an atom's mass with carbon-12 gives its atomic mass instead."}, {"id": 49, "level": "Beginner", "tag": "Oxidation Numbers", "stem": "Elements in Group 2, such as magnesium and calcium, form ions with an oxidation number of:", "options": ["2+", "2-", "1+", "1-"], "answer": "A", "answer_text": "2+", "exp": "A Group 2 metal has 2 valence electrons and loses both to reach a complete valence shell, leaving a 2+ ion such as Mg²⁺ or Ca²⁺. A 1+ charge belongs to the Group 1 metals, and negative oxidation numbers such as 2- and 1- belong to nonmetals, which gain electrons rather than lose them."}, {"id": 50, "level": "Beginner", "tag": "Oxidation Numbers", "stem": "In the name copper (I) chloride, the Roman numeral I tells you that the copper ion has an oxidation number of:", "options": ["0", "1+", "2+", "1-"], "answer": "B", "answer_text": "1+", "exp": "The Roman numeral in the name of a transition metal compound states that metal's oxidation number, so copper (I) is 1⁺ and the formula is CuCl. Copper (II) would be 2⁺ and give CuCl₂, a metal ion is never negative, and an oxidation number of 0 would mean the atom never became an ion."}, {"id": 51, "level": "Intermediate", "tag": "Types of Bonds", "stem": "Element X has a low electronegativity and a low first ionization energy. Element Y has a high electronegativity and a high first ionization energy. What type of bond forms between X and Y?", "options": ["Metallic, because the two elements pool electrons into a sea", "Covalent, because X gives up electrons that Y shares back evenly", "Covalent, because both elements hold their valence electrons tightly", "Ionic, because Y pulls electrons away from X to form ions"], "answer": "D", "answer_text": "Ionic, because Y pulls electrons away from X to form ions", "exp": "A low electronegativity and a low first ionization energy mean X gives up electrons easily, while Y's high values mean Y pulls electrons in hard, so electrons transfer and oppositely charged ions attract. Saying both elements hold their valence electrons tightly describes two nonmetals sharing covalently, and a sea of pooled electrons requires two metals, which would mean both elements had low values."}, {"id": 52, "level": "Intermediate", "tag": "Types of Bonds", "stem": "In the Day 3 lab a copper penny is converted to brass, an alloy of copper and zinc. Which bond holds the brass together, and which property follows from it?", "options": ["Metallic bonds; delocalized electrons make the solid malleable", "Ionic bonds; the solid conducts electricity only when dissolved", "Covalent bonds; the atoms share pairs in fixed positions", "Metallic bonds; fixed electrons leave the solid brittle and dull"], "answer": "A", "answer_text": "Metallic bonds; delocalized electrons make the solid malleable", "exp": "An alloy is a mixture of metals, and metal with metal gives a metallic bond in which the valence electrons become delocalized into a sea, which is what makes the sample malleable, ductile, conductive, and shiny. Electrons that were fixed in place would give a brittle, dull solid, and needing to be dissolved before conducting is the behavior of an ionic compound, not a metal."}, {"id": 53, "level": "Intermediate", "tag": "Types of Bonds", "stem": "A student tests three samples: potassium iodide (KI), carbon disulfide (CS₂), and a strip of magnesium metal. Which list gives the bond type in each, in that order?", "options": ["Covalent, ionic, metallic — nonmetal pair, metal with nonmetal, metal alone", "Ionic, metallic, covalent — metal with nonmetal, metal alone, nonmetal pair", "Metallic, ionic, covalent — metal alone, metal with nonmetal, nonmetal pair", "Ionic, covalent, metallic — metal with nonmetal, nonmetal pair, metal alone"], "answer": "D", "answer_text": "Ionic, covalent, metallic — metal with nonmetal, nonmetal pair, metal alone", "exp": "Potassium is a metal bonded to the nonmetal iodine, so KI is ionic; carbon and sulfur are both nonmetals, so CS₂ is covalent; and a strip of magnesium is metal with metal, which is metallic. Calling CS₂ metallic or KI covalent ignores that bond type is read from where the elements sit on the table, not from how many atoms the formula contains."}, {"id": 54, "level": "Intermediate", "tag": "Ionic Bonding and Formulas", "stem": "Aluminum forms Al³⁺ and sulfur forms S²⁻. Following the crisscross steps, what is the formula for aluminum sulfide?", "options": ["AlS, since the 3+ and the 2− simply cancel out", "Al₃S₂, since each charge stays on its own element", "Al₂S₃, since each charge becomes the other's subscript", "AlS₃, since only aluminum's charge is crisscrossed over"], "answer": "C", "answer_text": "Al₂S₃, since each charge becomes the other's subscript", "exp": "Crisscrossing puts the 3 from Al³⁺ on sulfur and the 2 from S²⁻ on aluminum, giving Al₂S₃, which balances at 2(3+) = 6+ and 3(2−) = 6−. Writing AlS assumes unequal charges can cancel, Al₃S₂ leaves each number on the element it came from, and AlS₃ crisscrosses in only one direction."}, {"id": 55, "level": "Intermediate", "tag": "Ionic Bonding and Formulas", "stem": "Magnesium forms Mg²⁺ and oxygen forms O²⁻. A student crisscrosses the charges and writes Mg₂O₂. What should the final formula be?", "options": ["MgO₂, because only the oxygen subscript is reduced", "Mg₂O₂, because both ions carry a charge of two", "MgO, because the subscripts both reduce by 2", "Mg₂O, because only the magnesium subscript is kept"], "answer": "C", "answer_text": "MgO, because the subscripts both reduce by 2", "exp": "Step 4 of the crisscross method says to reduce the subscripts by dividing by the same number and to drop any 1s, so Mg₂O₂ divided by 2 becomes MgO. Leaving Mg₂O₂ skips that step entirely, and reducing only one of the two subscripts, as in MgO₂ or Mg₂O, leaves the compound with a net charge instead of a neutral formula."}, {"id": 56, "level": "Intermediate", "tag": "Ionic Bonding and Formulas", "stem": "Calcium nitride has the formula Ca₃N₂. Which pair of ions produced that formula?", "options": ["Ca²⁺ and N³⁻, with the subscripts crisscrossed back", "Ca³⁺ and N²⁻, reading the subscripts straight across", "Ca²⁺ and N²⁻, since both ions come from the same period", "Ca¹⁺ and N¹⁻, since the compound is neutral overall"], "answer": "A", "answer_text": "Ca²⁺ and N³⁻, with the subscripts crisscrossed back", "exp": "Reversing the crisscross, the 3 on calcium came from nitrogen's 3− and the 2 on nitrogen came from calcium's 2+, and the charges balance: 3(2+) = 6+ and 2(3−) = 6−. Reading Ca³⁺ and N²⁻ straight off the subscripts reverses the whole method, and neither 1+ and 1− nor 2+ and 2− would ever produce the subscripts 3 and 2."}, {"id": 57, "level": "Intermediate", "tag": "Ionic Bonding and Formulas", "stem": "In the Day 12 puzzle-piece activity, students combine lithium (Li) with phosphorus (P). How do the electrons move, and what formula results?", "options": ["Two lithium atoms each give up one electron, forming Li₂P", "Phosphorus gives up its three electrons to lithium, forming LiP", "Three lithium atoms each give up one electron, forming Li₃P", "One lithium atom gives up three electrons, forming LiP₃"], "answer": "C", "answer_text": "Three lithium atoms each give up one electron, forming Li₃P", "exp": "Lithium has 1 valence electron and becomes Li¹⁺, while phosphorus needs 3 more electrons to complete its valence shell and becomes P³⁻, so it takes three lithium atoms to supply them, giving Li₃P. Lithium has only one valence electron to lose, so LiP₃ is impossible, and in an ionic bond the metal loses electrons to the nonmetal, not the other way around."}, {"id": 58, "level": "Intermediate", "tag": "Ionic Bonding and Formulas", "stem": "A student writes four ionic formulas from the oxidation numbers. Which formula is charge-balanced correctly?", "options": ["Ca₂O, built from calcium ions and oxide ions", "Mg₃N₂, built from magnesium ions and nitride ions", "K₂Cl, built from potassium ions and chloride ions", "AlBr₂, built from aluminum ions and bromide ions"], "answer": "B", "answer_text": "Mg₃N₂, built from magnesium ions and nitride ions", "exp": "Magnesium is Mg²⁺ and nitrogen is N³⁻, so Mg₃N₂ balances at 3(2+) = 6+ against 2(3−) = 6−. Potassium and chlorine are both 1, so the formula is KCl rather than K₂Cl; aluminum's 3+ needs three bromides, giving AlBr₃; and Ca²⁺ with O²⁻ reduces to CaO, not Ca₂O."}, {"id": 59, "level": "Intermediate", "tag": "Naming Ionic Compounds", "stem": "What is the correct name for AuCl₃?", "options": ["gold trichloride, since three chlorine atoms are present", "gold chloride, since gold has just one oxidation number", "gold (III) chloride, since each chloride ion carries 1−", "gold (I) chloride, since the formula shows only one gold atom"], "answer": "C", "answer_text": "gold (III) chloride, since each chloride ion carries 1−", "exp": "Three chloride ions at 1− each make 3−, so the single gold ion must be 3+, and gold is one of the metals that takes a Roman numeral, giving gold (III) chloride. Leaving the numeral off, or reading the numeral from the number of gold atoms instead of gold's charge, both hide that charge, and prefixes such as tri- belong to covalent molecules only."}, {"id": 60, "level": "Intermediate", "tag": "Naming Ionic Compounds", "stem": "What is the correct name for Cr₂(CO₃)₃?", "options": ["dichromium tricarbonate, using prefixes for the counts", "chromium (II) carbonate, matching carbonate's 2− charge", "chromium carbonate, since chromium needs no numeral", "chromium (III) carbonate, matching the 3+ on chromium"], "answer": "D", "answer_text": "chromium (III) carbonate, matching the 3+ on chromium", "exp": "Three carbonate ions at 2− each give 6−, so the two chromium ions must be 3+ each, making the name chromium (III) carbonate. Chromium is a transition metal with more than one oxidation number, so dropping the numeral is not allowed; the numeral names chromium's charge and not carbonate's, and ionic names never use prefixes such as di- and tri-."}, {"id": 61, "level": "Intermediate", "tag": "Naming Ionic Compounds", "stem": "Roman numerals are used only for metals that have more than one oxidation number. Which of these names is written correctly without one?", "options": ["PbO₂ named lead oxide, since lead has one oxidation state", "CuS named copper sulfide, since sulfide is always 2−", "ZnCl₂ named zinc chloride, since zinc is always 2+", "FeO named iron oxide, since iron has one oxidation state"], "answer": "C", "answer_text": "ZnCl₂ named zinc chloride, since zinc is always 2+", "exp": "Zinc takes only the 2+ oxidation number, so zinc chloride needs no Roman numeral. Iron, copper, and lead all have more than one oxidation number, so those compounds must be named iron (II) oxide, copper (II) sulfide, and lead (IV) oxide; the charge on the sulfide or oxide ion is never what the Roman numeral reports."}, {"id": 62, "level": "Intermediate", "tag": "Naming Ionic Compounds", "stem": "What is the formula for copper (I) sulfide?", "options": ["CuS₂, since the numeral one belongs to the copper", "Cu₂S₂, since each ion is given a subscript of two", "Cu₂S, since two 1+ coppers balance a 2− sulfide", "CuS, since the copper and sulfide charges cancel"], "answer": "C", "answer_text": "Cu₂S, since two 1+ coppers balance a 2− sulfide", "exp": "The Roman numeral tells you copper is 1+ here, and sulfide is 2−, so crisscrossing gives Cu₂S with 2(1+) = 2+ balancing the 2−. CuS would be copper (II) sulfide, CuS₂ puts copper's own numeral on sulfur, and Cu₂S₂ would reduce to CuS anyway."}, {"id": 63, "level": "Intermediate", "tag": "Naming Ionic Compounds", "stem": "In the Gaviscon lab one test tube held a salt with the formula CuCl₂. What is its name, and what oxidation number does copper have in it?", "options": ["copper (II) chloride; copper is 2+ in this compound", "copper dichloride; copper is 2+ in this compound", "copper (I) chloride; copper would be 1+ in this compound", "copper chloride; copper has one oxidation number"], "answer": "A", "answer_text": "copper (II) chloride; copper is 2+ in this compound", "exp": "Two chloride ions at 1− each give 2−, so copper must be 2+, and the name is copper (II) chloride. Copper (I) chloride is the other salt in that lab and has the formula CuCl, copper always needs a Roman numeral because it has more than one oxidation number, and the prefix di- is a covalent naming tool that ionic names never use."}, {"id": 64, "level": "Intermediate", "tag": "Polyatomic Ions", "stem": "Beryllium forms Be²⁺ and nitrate is NO₃¹⁻. What is the formula for beryllium nitrate?", "options": ["Be(NO₃)₂, since two 1− nitrates balance the 2+ ion", "Be(NO₃)₃, since nitrate carries a charge of three", "Be₂NO₃, since beryllium's charge is moved to the front", "BeNO₃, since the two charges cancel each other out"], "answer": "A", "answer_text": "Be(NO₃)₂, since two 1− nitrates balance the 2+ ion", "exp": "The crisscross shortcut works the same way with polyatomic ions, so Be²⁺ needs two NO₃¹⁻ ions and the whole ion is wrapped in parentheses: Be(NO₃)₂, balancing 2+ against 2(1−). BeNO₃ leaves the compound with a net 1+ charge, and nitrate carries 1−, not 3−, so Be(NO₃)₃ is not balanced either."}, {"id": 65, "level": "Intermediate", "tag": "Polyatomic Ions", "stem": "Magnesium is Mg²⁺ and phosphate is PO₄³⁻. What is the formula for magnesium phosphate?", "options": ["Mg₃PO₄, giving magnesium a subscript of three", "Mg₂(PO₄)₃, putting each charge back on its own ion", "Mg₃(PO₄)₂, crisscrossing the 2+ and 3− charges", "MgPO₄, letting the 2+ and the 3− cancel out"], "answer": "C", "answer_text": "Mg₃(PO₄)₂, crisscrossing the 2+ and 3− charges", "exp": "Crisscrossing gives three magnesium ions and two phosphate ions, Mg₃(PO₄)₂, which balances 3(2+) = 6+ against 2(3−) = 6−. MgPO₄ assumes a 2+ and a 3− can cancel, Mg₂(PO₄)₃ leaves each number on the ion it came from, and Mg₃PO₄ leaves the compound with a net 3+ charge."}, {"id": 66, "level": "Intermediate", "tag": "Polyatomic Ions", "stem": "Ammonium is NH₄¹⁺ and sulfate is SO₄²⁻. What is the formula for ammonium sulfate, and why are parentheses needed?", "options": ["N₂H₈SO₄; the subscripts inside are doubled instead", "NH₄(SO₄)₂; parentheses go around the larger ion here", "(NH₄)₂SO₄; parentheses show two whole ammonium ions", "NH₄SO₄; no parentheses are needed for a single ion"], "answer": "C", "answer_text": "(NH₄)₂SO₄; parentheses show two whole ammonium ions", "exp": "Two 1+ ammonium ions are needed to balance one 2− sulfate, and the parentheses show that the subscript 2 applies to the entire NH₄ group, giving (NH₄)₂SO₄. Writing N₂H₈SO₄ doubles the atoms inside the ion instead of counting whole ions, and NH₄SO₄ or NH₄(SO₄)₂ leave the compound with a net charge."}, {"id": 67, "level": "Intermediate", "tag": "Polyatomic Ions", "stem": "A student writes the formula Ca(ClO₂)₂ for a compound made from calcium and a polyatomic ion. What is its correct name?", "options": ["calcium chlorite, from the ion written as ClO₂¹⁻", "calcium (II) chlorite, showing calcium's 2+ charge", "calcium chlorate, from the ion written as ClO₃¹⁻", "calcium hypochlorite, from the ion written as ClO¹⁻"], "answer": "A", "answer_text": "calcium chlorite, from the ion written as ClO₂¹⁻", "exp": "The ion in the formula is ClO₂¹⁻, which is chlorite, so the compound is calcium chlorite; two 1− chlorites balance calcium's 2+. Chlorate is ClO₃¹⁻ and hypochlorite is ClO¹⁻, so those names would need different formulas, and calcium is a Group 2 metal with only one oxidation number, so it never takes a Roman numeral."}, {"id": 68, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "Use the shortcut bonds = (needed − available)/2 for ammonia, NH₃. Nitrogen needs 8 valence electrons and has 5; each hydrogen needs 2 and has 1. How many bonds form?", "options": ["4 bonds, from (16 − 8)/2 electrons", "5 bonds, from (18 − 8)/2 electrons", "3 bonds, from (14 − 8)/2 electrons", "2 bonds, from (14 − 10)/2 electrons"], "answer": "C", "answer_text": "3 bonds, from (14 − 8)/2 electrons", "exp": "Needed is 8 + 2 + 2 + 2 = 14 and available is 5 + 1 + 1 + 1 = 8, so (14 − 8)/2 = 3 bonds, one to each hydrogen. Using 16 for the needed total gives hydrogen a full shell of 8 instead of 2, and using 10 for the available total counts electrons hydrogen does not have."}, {"id": 69, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "Carbon dioxide has carbon as the central atom with a double bond to each oxygen. How many valence electrons appear in the finished Lewis structure, and how many of them are in lone pairs?", "options": ["16 electrons in all, with 4 of them in lone pairs", "16 electrons in all, with 8 of them in lone pairs", "20 electrons in all, with 8 of them in lone pairs", "12 electrons in all, with 4 of them in lone pairs"], "answer": "B", "answer_text": "16 electrons in all, with 8 of them in lone pairs", "exp": "Carbon brings 4 valence electrons and each oxygen brings 6, so the structure must show 4 + 6 + 6 = 16 electrons; the two double bonds use 4 bonds × 2 electrons = 8, leaving 8 electrons as four lone pairs, two on each oxygen. Totals of 12 or 20 do not match the valence electrons the three atoms actually bring, and 4 lone-pair electrons would leave both oxygens short of a full valence shell."}, {"id": 70, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "A student is drawing the Lewis structure for ammonia, NH₃. Which atom belongs in the center, and why?", "options": ["Nitrogen, since nitrogen has five valence electrons to lose", "Hydrogen, since it has the lowest electronegativity here", "Nitrogen, since a hydrogen atom can only form one bond", "Hydrogen, since three hydrogens outnumber the one nitrogen"], "answer": "C", "answer_text": "Nitrogen, since a hydrogen atom can only form one bond", "exp": "Hydrogen has a full valence shell at 2 electrons, so it can make only one bond and is always an outer atom, which leaves nitrogen in the center. The rule that the central atom has the lowest electronegativity is applied to the elements other than hydrogen, and nitrogen does not lose its five valence electrons in ammonia, it shares three of them."}, {"id": 71, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "Oxygen difluoride, OF₂, has one single bond from oxygen to each fluorine. How many lone pairs sit on the oxygen, and how many electron regions does that give?", "options": ["2 lone pairs, giving 2 electron regions in all", "1 lone pair, giving 3 electron regions in all", "2 lone pairs, giving 4 electron regions in all", "3 lone pairs, giving 5 electron regions in all"], "answer": "C", "answer_text": "2 lone pairs, giving 4 electron regions in all", "exp": "Oxygen brings 6 valence electrons; two of them go into the two bonds, leaving 4 electrons as 2 lone pairs, and electron regions count lone pairs along with bonds, so 2 bonds + 2 lone pairs = 4 regions. Counting only the bonds gives 2 regions, which is the most common error, and oxygen does not have enough valence electrons for 3 lone pairs plus two bonds."}, {"id": 72, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "Carbon monoxide is the gas first suspected in the case. Carbon has 4 valence electrons and oxygen has 6, and each needs 8. Using bonds = (needed − available)/2, how many bonds form?", "options": ["2 bonds, a double bond written C = O", "3 bonds, a triple bond written C ≡ O", "4 bonds, a quadruple bond between C and O", "1 bond, a single bond written C – O"], "answer": "B", "answer_text": "3 bonds, a triple bond written C ≡ O", "exp": "Needed is 8 + 8 = 16 and available is 4 + 6 = 10, so (16 − 10)/2 = 3 bonds, a triple bond written C ≡ O. A single or double bond would leave both atoms short of a full valence shell, and four bonds would give each atom more than 8 valence electrons."}, {"id": 73, "level": "Intermediate", "tag": "Covalent Bonding and Lewis Structures", "stem": "Boron has a full valence shell with only 6 electrons. Using bonds = (needed − available)/2, how many bonds are in BCl₃? Boron has 3 valence electrons and each chlorine has 7.", "options": ["3 bonds, from (30 − 24)/2 electrons", "6 bonds, from (36 − 24)/2 electrons", "4 bonds, from (32 − 24)/2 electrons", "2 bonds, from (28 − 24)/2 electrons"], "answer": "A", "answer_text": "3 bonds, from (30 − 24)/2 electrons", "exp": "Boron needs only 6 and each chlorine needs 8, so needed is 6 + 24 = 30 while available is 3 + 21 = 24, giving (30 − 24)/2 = 3 bonds, one to each chlorine. Treating boron as needing 8 raises the needed total to 32 and predicts 4 bonds, which is one more bond than there are chlorine atoms to bond to."}, {"id": 74, "level": "Intermediate", "tag": "Naming Covalent Molecules", "stem": "Silicon and hydrogen are both nonmetallic elements that share electrons. What is the name of SiH₄?", "options": ["tetrasilicon hydride, putting the prefix on silicon", "silicon hydride, since no prefix is needed here", "silicon tetrahydride, using the prefix for four", "monosilicon tetrahydride, prefixing both elements"], "answer": "C", "answer_text": "silicon tetrahydride, using the prefix for four", "exp": "Covalent names use prefixes for the number of each atom and end the second element in -ide, so four hydrogens give silicon tetrahydride. Dropping the prefix loses the count of four, putting tetra- on silicon describes four silicon atoms instead, and a leading mono- is not written when there is only one atom of the first element."}, {"id": 75, "level": "Intermediate", "tag": "Naming Covalent Molecules", "stem": "What is the formula for xenon pentafluoride?", "options": ["XeP₅, using P as the symbol for the second element", "Xe₅F, with the prefix applied to the xenon atom", "XeF₅, with five fluorine atoms bonded to xenon", "Xe₅F₅, with the prefix applied to both elements"], "answer": "C", "answer_text": "XeF₅, with five fluorine atoms bonded to xenon", "exp": "The prefix penta- gives the subscript for fluorine, and with no prefix on xenon there is just one xenon atom, so the formula is XeF₅. The symbol for fluorine is F, not P, which is phosphorus, and the prefix belongs only to the element it is attached to, so neither Xe₅F nor Xe₅F₅ follows the naming rule."}, {"id": 76, "level": "Intermediate", "tag": "Naming Covalent Molecules", "stem": "Prefixes are used for covalent molecules but never for ionic compounds. Which compound below is named correctly?", "options": ["N₂O₄, dinitrogen tetroxide, using prefixes for both", "Na₂S, disodium sulfide, using a prefix for two sodiums", "CO, carbon oxide, since only one atom of each is present", "CaCl₂, calcium dichloride, using a prefix for chlorine"], "answer": "A", "answer_text": "N₂O₄, dinitrogen tetroxide, using prefixes for both", "exp": "N₂O₄ is two nonmetals, so prefixes apply and the name is dinitrogen tetroxide. Na₂S and CaCl₂ are metal-with-nonmetal compounds named sodium sulfide and calcium chloride with no prefixes at all, and CO is carbon monoxide because the second element keeps its mono- prefix."}, {"id": 77, "level": "Intermediate", "tag": "Molecular Shapes (VSEPR)", "stem": "Methane, ammonia, and water each have four electron regions around the central atom, but their bond angles differ. Which list runs from the largest bond angle to the smallest?", "options": ["H₂O, NH₃, CH₄ — more lone pairs open the angle wider", "NH₃, CH₄, H₂O — the angle depends on the central atom", "CH₄, H₂O, NH₃ — the angle depends on the hydrogen count", "CH₄, NH₃, H₂O — each lone pair squeezes the angle in"], "answer": "D", "answer_text": "CH₄, NH₃, H₂O — each lone pair squeezes the angle in", "exp": "A lone pair spreads out more than a bonding pair and pushes the bonds closer together, so replacing lone pairs with bonded atoms opens the angle back up: tetrahedral methane is about 109.5°, trigonal pyramidal ammonia about 107°, and bent water about 104.5°. Putting water first reverses that effect, and the angle is set by the count of lone pairs and bonds rather than by which central atom or how many hydrogens are present."}, {"id": 78, "level": "Intermediate", "tag": "Molecular Shapes (VSEPR)", "stem": "Sulfur dioxide has one lone pair on the sulfur and a double bond to each oxygen. How many electron regions is that, and what molecular geometry results?", "options": ["2 regions, and the molecular geometry is linear", "3 regions, and the molecular geometry is bent", "4 regions, and the molecular geometry is trigonal pyramidal", "3 regions, and the molecular geometry is trigonal planar"], "answer": "B", "answer_text": "3 regions, and the molecular geometry is bent", "exp": "A double bond counts as one electron region, so two double bonds plus one lone pair is 3 regions, and 3 regions with 1 lone pair gives a bent molecule. Calling it trigonal planar treats the lone pair as though it were a third bonded atom, and ignoring the lone pair entirely leaves only 2 regions and the wrong prediction of linear."}, {"id": 79, "level": "Intermediate", "tag": "Molecular Shapes (VSEPR)", "stem": "Nitrogen trifluoride has 4 electron regions with 1 lone pair on the nitrogen. What is its molecular geometry, and how does it differ from a molecule with 4 regions and no lone pairs?", "options": ["Bent; two of the three bonds are pushed out of the way", "Tetrahedral; a lone pair does not change the shape name", "Trigonal pyramidal; the lone pair pushes the bonds down", "Trigonal planar; the lone pair flattens the molecule out"], "answer": "C", "answer_text": "Trigonal pyramidal; the lone pair pushes the bonds down", "exp": "Four regions with one lone pair gives trigonal pyramidal, because the lone pair takes one corner and pushes the three bonds down into a pyramid instead of the tetrahedral arrangement seen when all four regions are bonds. Molecular geometry names only the positions of the atoms, so the lone pair does change the name, and 4 regions can never give a flat trigonal planar shape."}, {"id": 80, "level": "Intermediate", "tag": "Molecular Shapes (VSEPR)", "stem": "In the Day 10 model lab students build hydrogen sulfide, H₂S. Counting the bonds and lone pairs on the sulfur, what is the molecular geometry?", "options": ["Linear, because only two atoms are bonded to the sulfur", "Bent, because two lone pairs sit beside the two bonds", "Tetrahedral, because there are four regions around it", "Trigonal planar, because three regions surround sulfur"], "answer": "B", "answer_text": "Bent, because two lone pairs sit beside the two bonds", "exp": "Sulfur has 6 valence electrons, so two of them make bonds to hydrogen and the other four become 2 lone pairs, giving 4 electron regions with 2 lone pairs, which is bent. Four regions do describe the electrons, but tetrahedral names the shape only when all four regions are bonds, and ignoring the lone pairs is what makes linear look tempting."}, {"id": 81, "level": "Intermediate", "tag": "Molecular Shapes (VSEPR)", "stem": "A molecule is reported to have a trigonal planar molecular geometry. What must be true of the central atom?", "options": ["3 electron regions, with no lone pairs on the central atom", "3 electron regions, one of which is a lone pair of electrons", "2 electron regions, one of which is a lone pair of electrons", "4 electron regions, with no lone pairs on the central atom"], "answer": "A", "answer_text": "3 electron regions, with no lone pairs on the central atom", "exp": "Trigonal planar is the shape for 3 electron regions when all three are bonds, so the three bonded atoms spread out flat around the center. Three regions with one lone pair would be bent instead, four regions with no lone pairs would be tetrahedral, and two regions would give a linear molecule."}, {"id": 82, "level": "Intermediate", "tag": "Electronegativity and Bond Polarity", "stem": "Hydrogen has an electronegativity of 2.1 and chlorine has 3.0. What is the difference, and what kind of bond does it predict?", "options": ["1.9, which falls between 0.5 and 2, so polar covalent", "0.9, which is less than 1, so nonpolar covalent instead", "0.9, which falls between 0.5 and 2, so polar covalent", "5.1, which is greater than 2, so an ionic bond forms"], "answer": "C", "answer_text": "0.9, which falls between 0.5 and 2, so polar covalent", "exp": "Subtracting gives 3.0 − 2.1 = 0.9, and a difference between 0.5 and 2 means the electrons are shared unevenly, which is a polar covalent bond. A difference of 1.9 would come from subtracting the wrong pair of values, adding the two values instead of subtracting gives 5.1, and the nonpolar band is a difference below 0.5, not below 1."}, {"id": 83, "level": "Intermediate", "tag": "Electronegativity and Bond Polarity", "stem": "Use these electronegativity values: H 2.1, C 2.5, O 3.5, F 4.0. Which bond is the most polar, and which is the least polar?", "options": ["H–F, difference 2.1, is most polar; H–O, 1.4, is least", "H–F, difference 1.9, is most polar; H–C, 0.4, is least", "H–C, difference 0.4, is most polar; H–F, 1.9, is least", "H–O, difference 1.4, is most polar; H–C, 0.4, is least"], "answer": "B", "answer_text": "H–F, difference 1.9, is most polar; H–C, 0.4, is least", "exp": "The differences are 4.0 − 2.1 = 1.9 for H–F, 3.5 − 2.1 = 1.4 for H–O, and 2.5 − 2.1 = 0.4 for H–C, so the larger the difference the more polar the bond. A difference of 2.1 is just hydrogen's own value rather than a subtraction, and treating the smallest difference of 0.4 as the most polar reverses the whole rule."}, {"id": 84, "level": "Intermediate", "tag": "Electronegativity and Bond Polarity", "stem": "In a C–O bond, carbon's electronegativity is 2.5 and oxygen's is 3.5. Which atom carries the partial negative charge (δ −), and why?", "options": ["Carbon, because it is the smaller of the two atoms here", "Oxygen, because it pulls the shared electrons harder", "Carbon, because it has fewer electrons to begin with", "Oxygen, because it hands its electrons over to carbon"], "answer": "B", "answer_text": "Oxygen, because it pulls the shared electrons harder", "exp": "The more electronegative atom pulls the shared pair closer, so with 3.5 against 2.5 the oxygen end is δ − and the carbon end is δ +. The number of electrons an atom starts with and its size are not what set the partial charges, and in a covalent bond neither atom hands electrons over, they share them unevenly."}, {"id": 85, "level": "Intermediate", "tag": "Electronegativity and Bond Polarity", "stem": "A nonpolar covalent bond has an electronegativity difference of less than 0.5. Which bond fits that description?", "options": ["C–H, with a difference of 0.4 in electronegativity", "S–O, with a difference of 1.0 in electronegativity", "O–H, with a difference of 1.4 in electronegativity", "N–H, with a difference of 0.9 in electronegativity"], "answer": "A", "answer_text": "C–H, with a difference of 0.4 in electronegativity", "exp": "A difference of 0.4 is below 0.5, so the C–H electrons are shared nearly equally and the bond is nonpolar covalent. The differences of 0.9 for N–H, 1.0 for S–O, and 1.4 for O–H all land between 0.5 and 2, which is the polar covalent band."}, {"id": 86, "level": "Intermediate", "tag": "Molecular Polarity", "stem": "Each C=O bond in carbon dioxide has an electronegativity difference of 1.0, yet the whole molecule is nonpolar. Why?", "options": ["The oxygen atoms are identical, so no partial charges form", "The bonds are nonpolar, since 1.0 is too small to count", "The molecule is bent, so the two dipoles cancel exactly", "The bonds are polar, but the linear shape is symmetrical"], "answer": "D", "answer_text": "The bonds are polar, but the linear shape is symmetrical", "exp": "A difference of 1.0 does make each bond polar, but carbon dioxide has 2 electron regions and no lone pairs, so it is linear and the two identical pulls point in exactly opposite directions around a symmetrical center. Carbon dioxide is not bent, and identical outer atoms do not stop partial charges from forming, they only make the two pulls equal."}, {"id": 87, "level": "Intermediate", "tag": "Molecular Polarity", "stem": "Ozone (O₃) has three electron regions with one lone pair on the central oxygen, which gives it a bent shape. Is ozone polar or nonpolar?", "options": ["Nonpolar, because all three atoms are the same element", "Polar, because the bent shape leaves the charge uneven", "Polar, because oxygen is the most electronegative atom", "Nonpolar, because the two outer oxygens balance exactly"], "answer": "B", "answer_text": "Polar, because the bent shape leaves the charge uneven", "exp": "A polar molecule is one with an uneven distribution of electrons across the molecule, and the lone pair on the bent central oxygen pushes electron density to one side, so ozone is polar even though every atom is oxygen. Symmetry around a central point is what makes a molecule nonpolar, and a bent molecule is not symmetrical; fluorine, not oxygen, is the most electronegative element."}, {"id": 88, "level": "Intermediate", "tag": "Molecular Polarity", "stem": "Methane and ammonia both have four electron regions around the central atom, but methane is nonpolar and ammonia is polar. What accounts for the difference?", "options": ["Ammonia has a lone pair, leaving it unsymmetrical overall", "Methane has more atoms, so its partial charges spread thin", "Methane's bonds are polar while ammonia's bonds are nonpolar", "Ammonia's bonds are polar while methane's bonds are ionic"], "answer": "A", "answer_text": "Ammonia has a lone pair, leaving it unsymmetrical overall", "exp": "Methane's four bonds point to the four corners of a tetrahedron, so it is symmetrical around a central point and nonpolar, while ammonia's lone pair takes one corner and leaves a trigonal pyramid with a δ − end and a δ + end. Ammonia's N–H bonds have a difference of 0.9 and are polar covalent, not ionic, and methane's C–H difference of 0.4 makes its bonds the nonpolar ones."}, {"id": 89, "level": "Intermediate", "tag": "Intermolecular Forces", "stem": "Case File 5 lists methanol (H₃C–OH) as a possible poison. Which intermolecular force can methanol molecules form with one another that methane (CH₄) molecules cannot?", "options": ["London dispersion forces, since methanol is the larger molecule", "Ionic bonds, since the O–H group breaks apart into two ions", "Hydrogen bonds, since methanol has hydrogen bonded to oxygen", "Dipole-dipole bonds, since only methanol contains any carbon"], "answer": "C", "answer_text": "Hydrogen bonds, since methanol has hydrogen bonded to oxygen", "exp": "Hydrogen bonds form when hydrogen is bonded to oxygen, nitrogen, or fluorine, and methanol's O–H group provides exactly that, while every hydrogen in methane is bonded to carbon. Both molecules do have London dispersion forces, so that is not the difference; both contain carbon; and methanol is a covalent molecule that does not break into ions."}, {"id": 90, "level": "Intermediate", "tag": "Intermolecular Forces", "stem": "Acetone (C₃H₆O) is a polar molecule, but none of its hydrogen atoms are bonded to the oxygen. Which intermolecular forces act between acetone molecules?", "options": ["Dipole-dipole and London dispersion forces, but no hydrogen bonds", "Ionic bonds only, since the oxygen takes on a full negative charge", "London dispersion forces only, since the molecule is nonpolar", "Hydrogen bonds and London dispersion forces, but no dipoles"], "answer": "A", "answer_text": "Dipole-dipole and London dispersion forces, but no hydrogen bonds", "exp": "Acetone is polar, so its molecules attract one another by dipole-dipole attraction, and every molecule also has London dispersion forces; what it lacks is hydrogen bonded to oxygen, nitrogen, or fluorine, so it cannot hydrogen bond with itself. Being unable to hydrogen bond does not make a molecule nonpolar, and the δ − on the oxygen is a partial charge, not a full ionic charge."}, {"id": 91, "level": "Intermediate", "tag": "Intermolecular Forces", "stem": "In the Day 8 penny lab, more drops of water than of isopropyl alcohol fit on a penny, and a drop of alcohol on the back of the hand felt colder than a drop of water. Which explanation fits both results?", "options": ["Alcohol is ionic, so its particles need much more energy to part", "Water's hydrogen bonds are stronger, so it evaporates slower", "Water has only London dispersion forces between its molecules", "Alcohol's hydrogen bonds are stronger, so it evaporates slower"], "answer": "B", "answer_text": "Water's hydrogen bonds are stronger, so it evaporates slower", "exp": "Stronger hydrogen bonding pulls water molecules together into a taller dome so more drops fit, and it also holds them in the liquid, so water evaporates slowly and takes less heat from the hand than the faster-evaporating alcohol does. Reversing the two makes the alcohol the stronger attractor, which contradicts both observations; water is polar and hydrogen bonds rather than relying on London dispersion forces alone; and isopropyl alcohol is a covalent molecule, not an ionic compound."}, {"id": 92, "level": "Intermediate", "tag": "Intermolecular Forces", "stem": "Iodine (I₂) and fluorine (F₂) are both nonpolar molecules, yet iodine is a solid at room temperature while fluorine is a gas. Which statement explains the difference?", "options": ["Iodine's bond is ionic, so far more energy is needed to melt it", "The larger iodine molecules have stronger London dispersion forces", "Iodine molecules form hydrogen bonds while fluorine molecules cannot", "Iodine is polar and fluorine is nonpolar, so iodine has strong dipoles"], "answer": "B", "answer_text": "The larger iodine molecules have stronger London dispersion forces", "exp": "The larger the molecule, the more places neighboring molecules can interact, so the temporary partial charges behind London dispersion forces add up to a much stronger attraction in iodine than in the much smaller fluorine. Hydrogen bonds require hydrogen bonded to oxygen, nitrogen, or fluorine, and neither molecule contains hydrogen; both I₂ and F₂ are two identical nonmetal atoms, so neither is polar or ionic."}, {"id": 93, "level": "Intermediate", "tag": "Properties of Bonded Substances", "stem": "A white crystal solid does not melt over a candle flame, dissolves in water, and the resulting solution lights the conductivity tester. Which type of substance is it?", "options": ["Covalent molecular and nonpolar, since it does not conduct", "Covalent network, since the atoms form one giant molecule", "Covalent molecular and polar, since it dissolves in water", "Ionic, since the ions separate and carry charge in water"], "answer": "D", "answer_text": "Ionic, since the ions separate and carry charge in water", "exp": "Ionic compounds have high melting points, dissolve in polar water, and conduct once dissolved because the separated ions are free to move and carry charge. A covalent network such as graphite also has a high melting point but does not dissolve in water at all, and a polar covalent molecule such as sucrose dissolves without conducting because no ions are released."}, {"id": 94, "level": "Intermediate", "tag": "Properties of Bonded Substances", "stem": "Sucrose and sodium chloride are both white crystal solids that dissolve in water. Which test tells them apart, and what result does each give?", "options": ["Melting point; sucrose melts over a candle but NaCl does not", "Conductivity; the sucrose solution conducts but the salt does not", "Solubility; sucrose dissolves in water but sodium chloride does not", "Color; the sucrose solution is clear and the salt solution is white"], "answer": "A", "answer_text": "Melting point; sucrose melts over a candle but NaCl does not", "exp": "Sucrose is a covalent molecular solid held together by intermolecular forces, so it melts at a low temperature over a candle, while sodium chloride's ionic bonds give it a high melting point and it will not melt in the scoopula. Both solids dissolve in water, so solubility alone cannot separate them, and the conductivity result is the reverse of what is stated: the salt solution conducts and the sucrose solution does not."}, {"id": 95, "level": "Intermediate", "tag": "Properties of Bonded Substances", "stem": "Which statement about a metallic solid such as copper is correct?", "options": ["It is brittle since its metal ions are locked in fixed positions", "It conducts as a solid because its electrons are delocalized", "It has a low melting point since its electrons are free to move", "It must be dissolved in water before it conducts any electricity"], "answer": "B", "answer_text": "It conducts as a solid because its electrons are delocalized", "exp": "In a metal the valence electrons are delocalized into a sea that moves freely among the positive metal ions, so a solid piece of copper conducts electricity and heat right away. Metals generally have high melting points because that attraction is strong, the mobile electrons let the ions slide past one another so metals are malleable rather than brittle, and only ionic compounds need to be dissolved before they conduct."}, {"id": 96, "level": "Intermediate", "tag": "Oxidation Numbers", "stem": "In Fe₂(SO₄)₃ each sulfate ion carries a 2− charge. What is the oxidation number of iron, and what is the compound's name?", "options": ["3+, so the compound is iron (III) sulfate", "2+, so the compound is called iron (II) sulfate", "6+, so the compound is called iron (VI) sulfate", "1+, so the compound is called iron (I) sulfate"], "answer": "A", "answer_text": "3+, so the compound is iron (III) sulfate", "exp": "Three sulfate ions at 2− each give a total of 6−, and that charge is split between the two iron ions, so each of the two irons must be 3+ because 2(3+) = 6+ and the name is iron (III) sulfate. Reading 6+ takes the whole negative total onto one iron instead of two, and iron (II) sulfate is FeSO₄, the salt used in the earring lab."}, {"id": 97, "level": "Intermediate", "tag": "Oxidation Numbers", "stem": "Aluminum is in Group 13 and oxygen is in Group 16. What oxidation numbers do these atoms take when they bond, and why?", "options": ["Al¹³⁺ and O¹⁶⁻; the group number becomes the charge here", "Al³⁻ and O²⁺; each atom gains whatever electrons it needs", "Al³⁺ and O²⁻; each atom moves toward a full valence shell", "Al²⁺ and O³⁻; the smaller atom always takes the smaller charge"], "answer": "C", "answer_text": "Al³⁺ and O²⁻; each atom moves toward a full valence shell", "exp": "Aluminum has 3 valence electrons and loses all three to reach a complete valence shell, giving Al³⁺, while oxygen has 6 and gains 2 to complete its shell, giving O²⁻. Metals lose electrons and nonmetals gain them, so reversing the signs is backwards, and the group number tells you how many valence electrons there are, not the size of the charge."}, {"id": 98, "level": "Intermediate", "tag": "Case File: When Bonds Break", "stem": "The autopsy showed Ms. Smith's blood carbon monoxide level was less than 2.8%. A normal adult level is less than 2.3%, a heavy smoker runs 8 to 9%, and a fatal level is greater than 35%. What conclusion does this evidence support?", "options": ["She died of carbon monoxide from the open gas oven after all", "Carbon monoxide did not kill her; another cause is needed", "The oven pushed her level far above the normal adult range", "She was a heavy smoker, since her level was between 8 and 9%"], "answer": "B", "answer_text": "Carbon monoxide did not kill her; another cause is needed", "exp": "A level of at most 2.8% is essentially a normal adult reading and more than twelve times below the 35% that would be fatal, so carbon monoxide from the oven cannot be the cause of death and the investigation has to look elsewhere. A heavy smoker's 8 to 9% is about three times the highest value her result allows, so the evidence does not place her in that range either."}, {"id": 99, "level": "Intermediate", "tag": "Case File: When Bonds Break", "stem": "The solid from the victim's sugar bowl dissolved in water, the solution lit the conductivity tester, and only some of the crystals melted over the candle flame. What does this evidence say about the sample?", "options": ["The whole sample is a covalent network, the way graphite is", "The sample also contains an ionic compound mixed into it", "The sample is a nonpolar wax that will not dissolve at all", "The whole sample is sucrose, a polar covalent molecule"], "answer": "B", "answer_text": "The sample also contains an ionic compound mixed into it", "exp": "Sucrose alone dissolves but does not conduct and melts easily, so a solution that conducts plus crystals that refuse t
